                    ? `Make ${groups.length} PO${groups.length > 1 ? 's' : ''} totaling ${$(total)} from Extra #${current.number}?\n\n` + groups.map(g => `${g.cat} / ${g.vendor}: ${$(g.cost)} (${g.idx.length} line${g.idx.length > 1 ? 's' : ''})`).join('\n')
                    : `Make no POs? `) + (untickedOpen.length ? `\n\n${untickedOpen.length} unticked line${untickedOpen.length > 1 ? 's go' : ' goes'} to the trade budget.` : '');
                if (!window.confirm(ask)) return;

                setBusy('pos'); setMsg(null);
                const itemRef = db.collection('extras').doc(jobId).collection('items').doc(current.id);
                const jobRef = db.collection('jobs').doc(jobId);
                const formsRef = jobRef.collection('forms');
                const now = new Date();
                const dateStr = `${now.getMonth() + 1}-${now.getDate()}-${String(now.getFullYear()).slice(-2)}`;
                const clean = (t) => (t || '').trim().replace(/[\/\\]/g, '-').replace(/\s+/g, '-');
                const header = {
                    jobCode: job.code || '', jobAddress: job.address || '', cityStateZip: job.cityStateZip || '', lockBox: job.lockBox || '',
                    superName: superPick.name || '', superEmail: superPick.email || '', superPhone: superPick.phone || ''
                };
                // Working copy of the lines: unticked open lines go to the budget (absorbed lines stay absorbed)
                let work = lines.map((l, i) => {
                    if (l.po && l.po.formId) return l;
                    if (!poPick[i]) return l.use === 'absorb' ? l : { ...l, use: 'budget' };
                    return l.use === 'absorb' ? l : { ...l, use: 'po' };
                });
                const made = [];
                try {
                    // Save the ticks first, so a stop partway leaves the extra matching what was made
                    await itemRef.update({ lines: work, updatedAt: stamp(), updatedBy: me });
                    for (const g of groups) {
                        setBusy(`pos:${made.length + 1} of ${groups.length}`);
                        const poNumber = await db.runTransaction(async (tx) => {
                            const snap = await tx.get(jobRef);
                            if (!snap.exists) throw new Error('Job not found.');
                            const next = (snap.data().poCounter || 0) + 1;
                            tx.update(jobRef, { poCounter: next });
                            return `${snap.data().code || job.code}-${String(next).padStart(3, '0')}`;
                        });
                        const tpl = templateFor(g) || {};
                        const amount = g.cost.toFixed(2);
                        const scope = scopeFor(g);
                        const bytes = await window.POForm.build({
                            ...header, poNumber, subName: g.vendor, contact: tpl.contact || '', phone: tpl.phone || '', email: tpl.email || '',
                            subCode: tpl.subCode || '', category: g.cat, amount, scope
                        }, []);
                        const amountShown = window.POForm.amountText(amount);
                        const fileName = `${clean(g.cat)}_${clean(g.vendor)}_${clean(amountShown)}_${poNumber}_${dateStr}.pdf`;
                        const fileRef = storage.ref(`jobForms/${jobId}/${Date.now()}_${fileName}`);
                        await fileRef.put(new Blob([bytes], { type: 'application/pdf' }), cleanSaveName(fileName, 'application/pdf'));
                        const pdfUrl = await fileRef.getDownloadURL();
                        const formRef = formsRef.doc();
                        await formRef.set({
                            fileName, pdfUrl, poNumber, subName: g.vendor, category: g.cat, contact: tpl.contact || '', phone: tpl.phone || '',
                            email: tpl.email || '', subCode: tpl.subCode || '', contractAmount: amount, scope, header, attachments: [],
                            notes: '', status: 'Extra', pdfUpdatedAt: now, dateUpdated: now, dateCreated: now, createdBy: me,
                            fromExtra: { extraId: current.id, number: current.number, title: current.title || '', lines: g.idx.map(i => i + 1) }
                        });
                        work = work.map((l, i) => g.idx.includes(i) ? { ...l, po: { formId: formRef.id, poNumber } } : l);
                        made.push({ poNumber, cat: g.cat, vendor: g.vendor, cost: g.cost, formId: formRef.id, lines: g.idx.map(i => i + 1) });
                        await itemRef.update({
                            lines: work, updatedAt: stamp(), updatedBy: me,
                            poHistory: firebase.firestore.FieldValue.arrayUnion({ poNumber, formId: formRef.id, cat: g.cat, vendor: g.vendor, cost: g.cost, lines: g.idx.map(i => i + 1), at: stamp(), by: me })
                        });
                    }
                    setPoPick(null);
                    setForm(toForm({ ...current, lines: work })); // the form follows what was saved (PO numbers, PO/budget choices)
                    say(true, made.length
                        ? `Made ${made.map(m => m.poNumber).join(', ')} (status Extra) in PO Manager. The Super sends them with Send to Sub.` + (made.some(m => !templateFor({ cat: m.cat, vendor: m.vendor })) ? ' A PO with no saved template has no contact or email yet; fill them in with Edit PO.' : '')
                        : 'Saved. Unticked lines go to the trade budget.');
                } catch (err) {
                    setPoPick(null);
                    setForm(toForm({ ...current, lines: work }));
                    say(false, (made.length ? `Made ${made.map(m => m.poNumber).join(', ')}, then stopped: ` : 'Nothing was made: ') + err.message + ' Lines not on a PO can be picked again with Make POs.');
                } finally { setBusy(''); }
            };

            const makePdf = async () => {
                if (!current) return;
                if (dirty) { say(false, 'Save your changes first.'); return; }
                const e = editable(current);
                if (e.type === 'internal') { say(false, 'Internal extras have no customer change order.'); return; }
                if (!e.lines.some(l => l.use !== 'absorb')) { say(false, 'Every line is "We absorb", so there is nothing to charge the customer.'); return; }
                const t = calcTotals(e.lines);
                setBusy('pdf'); setMsg(null);
                try {
                    const bytes = await buildExtraPdf({
                        number: current.number, extra: e, totals: t, name, address, code: job ? job.code : '',
                        dateText: fmtDate(new Date())
                    });
                    const fileName = pdfFileName(current.number, t.total, job ? job.code : '');
                    downloadBytes(bytes, fileName);
                    const ref = storage.ref(`jobForms/${jobId}/${Date.now()}_${fileName}`);
                    await ref.put(new Blob([bytes], { type: 'application/pdf' }), cleanSaveName(fileName, 'application/pdf'));
                    const url = await ref.getDownloadURL();
                    await db.collection('extras').doc(jobId).collection('items').doc(current.id).update({
                        pdfs: firebase.firestore.FieldValue.arrayUnion({ url, fileName, total: t.total, madeAt: stamp(), madeBy: me }),
                        updatedAt: stamp(), updatedBy: me
                    });
                    say(true, `${fileName} downloaded and saved with the extra. Send it through Adobe Sign or print it.`);
                } catch (err) {
                    say(false, 'PDF failed: ' + err.message);
                } finally { setBusy(''); }
            };

            const uploadSigned = async (file) => {
                if (!current || !file) return;
                if (dirty) { say(false, 'Save your changes first.'); return; }
                if (current.status === 'Void') { say(false, 'This extra is Void.'); return; }
                if (editable(current).type === 'internal') { say(false, 'Internal extras are not signed by the customer.'); return; }
                if (!window.confirm(`Upload ${file.name} as the signed copy of Extra #${current.number}? It will be marked Signed.`)) return;
                setBusy('upload'); setMsg(null);
                try {
                    const safe = file.name.replace(/[^\w.#$,-]+/g, '_');
                    const ref = storage.ref(`jobForms/${jobId}/signed_${Date.now()}_${safe}`);
                    await ref.put(file, cleanSaveName(file.name, file.type || 'application/pdf'));
                    const url = await ref.getDownloadURL();
                    const upd = {
                        signedCopies: firebase.firestore.FieldValue.arrayUnion({ url, fileName: file.name, uploadedAt: stamp(), uploadedBy: me }),
                        updatedAt: stamp(), updatedBy: me
                    };
                    if (current.status !== 'Signed') {
                        upd.status = 'Signed';
                        upd.signedAt = stamp();
                        upd.statusHistory = firebase.firestore.FieldValue.arrayUnion({ status: 'Signed', at: stamp(), by: me });
                    }
                    await db.collection('extras').doc(jobId).collection('items').doc(current.id).update(upd);
                    say(true, `Signed copy saved. Extra #${current.number} is Signed.`);
                } catch (err) {
                    say(false, 'Upload failed: ' + err.message);
                } finally {
                    setBusy('');
                    if (fileRef.current) fileRef.current.value = '';
                }
            };

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) { setAuthError(e.message); }
            };

            // ---------- Screens ----------
            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">LOGIN</div>
                        <button className="btn-primary" style={{ width: '100%' }} onClick={login}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }
            if (profile === null) return <div className="section">Loading...</div>;
            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">WAITING FOR APPROVAL</div>
                        <p>Your account is waiting for approval. An admin will set up your access.</p>
                    </div>
                );
            }
            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">ACCOUNT NOT SET UP</div>
                        <p>Your account doesn't have access. Contact an admin.</p>
                    </div>
                );
            }
            if (!allowed) {
                return (
                    <div className="section">
                        <div className="section-title">EXTRAS &amp; CREDITS</div>
                        <p>No access. Extras &amp; Credits is for Owner, Admin, Estimator and Super. Contact an admin.</p>
                    </div>
                );
            }

            const visibleJobs = jobs.filter(j => showArchived || !j.archived || j.id === jobId);
            const totals = form ? calcTotals(editable(form).lines) : null;
            const ro = locked; // form read-only

            return (
                <div>
                    <div className="section">
                        <div className="section-title">JOB</div>
                        <div className="form-group">
                            <select value={jobId} onChange={e => pickJob(e.target.value)}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code}{j.address ? ' - ' + j.address : ''}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                            <label className="radio-line" style={{ marginTop: 8 }}>
                                <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} />
                                Show archived jobs
                            </label>
                        </div>
                        {job && (
                            <div style={{ fontSize: 14, color: '#333' }}>
                                <div><b>Customer:</b> {name || <span style={{ color: '#b71c1c' }}>No name on Customer Information.</span>}</div>
                                <div><b>Address:</b> {address}</div>
                            </div>
                        )}
                        {listError && <div className="error">{listError}</div>}
                    </div>

                    {job && (
                        <div className="tabs">
                            <button className={'tab' + (tab === 'extras' ? ' on' : '')} onClick={() => setTab('extras')}>Extras</button>
                            <button className={'tab' + (tab === 'credits' ? ' on' : '')} onClick={() => setTab('credits')}>Credits{creditsDirty ? ' *' : ''}</button>
                        </div>
                    )}
                    {job && (
                        <div style={{ display: tab === 'credits' ? 'block' : 'none' }}>
                            <CreditsTab key={jobId} jobId={jobId} job={job} card={card} me={me} onDirty={setCreditsDirty} />
                        </div>
                    )}

                    <div style={{ display: tab === 'extras' ? 'block' : 'none' }}>
                    {job && (
                        <div className="section">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                                <div className="section-title" style={{ margin: 0 }}>EXTRAS</div>
                                <button className="btn-primary btn-small" onClick={newExtra}>+ New Extra</button>
                            </div>
                            {extras.length === 0 ? (
                                <p style={{ color: '#777' }}>No extras on this job yet.</p>
                            ) : (
                                <table>
                                    <thead>
                                        <tr><th>#</th><th>Title</th><th>Type</th><th>Status</th><th className="num">Cost</th><th className="num">Total Extra</th><th>Signed</th><th></th></tr>
                                    </thead>
                                    <tbody>
                                        {extras.map(x => (
                                            <tr key={x.id} className={(x.status === 'Void' ? 'void ' : '') + (openId === x.id ? 'picked' : '')}>
                                                <td>{x.number}</td>
                                                <td>{x.title}</td>
                                                <td>{typeLabel(editable(x).type)}</td>
                                                <td><span className={'badge ' + badgeClass(x.status)}>{statusLabel(x.status)}</span></td>
                                                <td className="num">{$(x.costTotal)}</td>
                                                <td className="num">{editable(x).type === 'internal' ? <span style={{ color: '#888' }}>No charge</span> : $(x.total)}</td>
                                                <td>{x.status === 'Signed' ? fmtDate(x.signedAt) : x.status === 'Approved' ? fmtDate(x.approvedAt) : ''}</td>
                                                <td><button className="btn-link" onClick={() => openExtra(x)}>Open</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    )}

                    {poPick && current && (
                        <PoPickWindow extra={current} pick={poPick} setPick={setPoPick} groups={pickedGroups()}
                            superName={superPick ? superPick.name || superPick.email : ''} onMake={makePOs} onClose={() => setPoPick(null)} busy={busy} />
                    )}
                    {job && form && (
                        <div className="section box">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                                <div className="section-title" style={{ margin: 0 }}>
                                    {openId === 'new' ? 'New Extra (number is given on Save)' : `Extra #${current ? current.number : ''}`}
                                </div>
                                <button className="btn-secondary btn-small" onClick={closeExtra}>Close</button>
                            </div>

                            {current && (
                                <div>
                                    <label>Status</label>
                                    <div className="status-row">
                                        {statusesFor(editable(current).type).map(s => (
                                            <button key={s} className={'status-btn' + (current.status === s ? ' on' : '')} disabled={!!busy} onClick={() => setStatus(s)}>{statusLabel(s)}</button>
                                        ))}
                                    </div>
                                    {locked && !priceOpen && <div className="info">{LOCKED.includes(current.status) ? `This extra is ${current.status}, so it can't be changed.` : 'This extra has POs, so it can\'t be changed.'} {current.status === 'Approved' ? 'A change after approval is a new extra.' : current.status === 'Signed' || hasPOs(current) ? 'A change after signing is a new extra.' : ''}</div>}
                                    {priceOpen && <div className="info">This extra has POs. Only Margin % and Allowance can be changed, to re-price it. Then Make PDF, get it signed, and Upload signed copy.</div>}
                                </div>
                            )}

                            <div className="grid">
                                <div className="form-group">
                                    <label>Type</label>
                                    <select value={form.type} disabled={ro || (!!current && current.status !== 'Draft')} onChange={e => setField('type', e.target.value)}>
                                        {TYPES.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>Days added to completion</label>
                                    <input value={form.daysAdded} disabled={ro} onChange={e => setField('daysAdded', e.target.value.replace(/[^0-9]/g, ''))} placeholder="0" />
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Title</label>
                                <input value={form.title} disabled={ro} onChange={e => setField('title', e.target.value)} placeholder="e.g. Wall Changes" />
                            </div>
                            <div className="form-group">
                                <label>Description (the customer reads this)</label>
                                <textarea rows={3} value={form.description} disabled={ro} onChange={e => setField('description', e.target.value)} />
                                {!ro && micButton('desc')}
                            </div>
                            <div className="hint" style={{ marginTop: -6, marginBottom: 12 }}>
                                {form.type === 'supplement' ? 'Supplement: the change order says it will be supplemented to the insurance company, and the customer pays if the supplement is not paid.'
                                    : form.type === 'internal' ? 'Internal: a cost we eat. No customer price, no change order, no signature. Mark it Approved to count it and to make POs.'
                                    : 'Customer: the change order says it is paid directly by the customer.'}
                            </div>

                            <label>Lines</label>
                            <table className="lines">
                                <thead>
                                    <tr><th style={{ width: 95 }}>Cat</th><th>Description</th><th style={{ width: 130 }}>Vendor</th><th className="num" style={{ width: 100 }}>Cost</th><th style={{ width: 85 }}>Margin %</th><th className="num" style={{ width: 90 }}>Price</th><th style={{ width: 148 }}>Use</th><th style={{ width: 26 }}></th></tr>
                                </thead>
                                <tbody>
                                    {form.lines.map((l, i) => {
                                        const sp = Array.isArray(l.scratch) ? l.scratch : [];
                                        const spHas = sp.some(x => String(x.note || '').trim() || String(x.amount || '').trim());
                                        return (
                                        <React.Fragment key={i}>
                                        <tr>
                                            <td><Suggest value={l.cat} upper disabled={ro} options={catOptions} placeholder="FRM" onChange={v => setLine(i, 'cat', v)} /></td>
                                            <td>
                                                <textarea rows={2} value={l.description} disabled={ro} onChange={e => setLine(i, 'description', e.target.value)} />
                                                {!ro && micButton('line-' + i)}
                                                {(!ro || spHas) && (
                                                    <button type="button" className={'mic' + (scratchOpen[i] ? ' sp-on' : '')} style={{ marginLeft: ro ? 0 : 6 }}
                                                        onClick={() => setScratchOpen(o => ({ ...o, [i]: !o[i] }))}
                                                        title="How this cost was reached. Not on the change order.">
                                                        📝 Scratch pad{spHas ? ` (${$(scratchTotal(sp))})` : ''}
                                                    </button>
                                                )}
                                            </td>
                                            <td><Suggest value={l.vendor} disabled={ro} options={vendorOptions(l.cat)} onChange={v => setLine(i, 'vendor', v)} /></td>
                                            <td><input style={{ textAlign: 'right' }} value={l.cost} disabled={ro} onChange={e => setLine(i, 'cost', e.target.value)} onBlur={e => { const n = toNumber(e.target.value); setLine(i, 'cost', n ? fmtMoney(n) : ''); }} placeholder="0.00" /></td>
                                            <td>
                                                <input style={{ textAlign: 'right' }} value={l.allowance ? '0' : l.margin} disabled={(ro && !priceOpen) || l.allowance || form.type === 'internal'} onChange={e => setLine(i, 'margin', e.target.value.replace(/[^0-9.]/g, ''))} onBlur={e => { if (!l.allowance && String(e.target.value).trim() === '') setLine(i, 'margin', String(DEFAULT_MARGIN)); else if (!l.allowance && toNumber(e.target.value) > MAX_MARGIN) setLine(i, 'margin', String(MAX_MARGIN)); }} />
                                                <label className="allow"><input type="checkbox" checked={l.allowance === true} disabled={(ro && !priceOpen) || form.type === 'internal'} onChange={e => setLine(i, 'allowance', e.target.checked)} />Allowance</label>
                                            </td>
                                            <td className="num" style={{ paddingTop: 12 }}>{l.use === 'absorb' || form.type === 'internal' ? <span style={{ color: '#888' }}>No charge</span> : $(linePrice(l))}</td>
                                            <td>
                                                <select value={l.use} disabled={ro} onChange={e => setLine(i, 'use', e.target.value)}>
                                                    {USES.map(([v, t]) => <option key={v} value={v}>{t}</option>)}
                                                </select>
                                                {l.po && l.po.poNumber && <div className="po-tag">PO {l.po.poNumber}</div>}
                                            </td>
                                            <td>{!ro && (
                                                <div className="line-move">
                                                    <button className="btn-link" title="Move line up" disabled={i === 0} onClick={() => moveLine(i, -1)}>▲</button>
                                                    <button className="btn-link" title="Remove line" onClick={() => removeLine(i)}>✕</button>
                                                    <button className="btn-link" title="Move line down" disabled={i === form.lines.length - 1} onClick={() => moveLine(i, 1)}>▼</button>
                                                </div>
                                            )}</td>
                                        </tr>
                                        {scratchOpen[i] && (
                                            <tr className="sp-row">
                                                <td></td>
                                                <td colSpan={7}>
                                                    <div className="sp-box">
                                                        <div className="sp-head">Scratch pad · {l.cat || 'line ' + (i + 1)}{l.description ? ' · ' + String(l.description).split('\n')[0].slice(0, 60) : ''} <span>How the cost was reached. Not on the change order. Cost changes only when you click "Use total as cost".</span></div>
                                                        {sp.length === 0 && <div className="hint">No scratch pad lines yet.</div>}
                                                        {sp.map((x, k) => (
                                                            <div key={k} className="sp-line">
                                                                <input value={x.note} disabled={ro} placeholder="Note, e.g. Labor 2 men x 1 day" onChange={e => setScratch(i, sp.map((y, j) => j === k ? { ...y, note: e.target.value } : y))} />
                                                                <input className="sp-amt" value={x.amount} disabled={ro} placeholder="0.00 or 2*480"
                                                                    onChange={e => setScratch(i, sp.map((y, j) => j === k ? { ...y, amount: e.target.value.replace(/[^0-9.+\-*/()x×÷,$ ]/gi, '') } : y))}
                                                                    onBlur={e => { const c = calcText(e.target.value); const v = c !== null ? c : (String(e.target.value).trim() ? signedNum(e.target.value) : null); setScratch(i, sp.map((y, j) => j === k ? { ...y, amount: v === null ? '' : fmtSigned(v) } : y)); }} />
                                                                {!ro && <button type="button" className="mic" style={{ marginTop: 0 }} title="Open the calculator; Use puts the answer in this line" onClick={() => setCalcFor({ i, k })}>Calc</button>}
                                                                {!ro && <button className="btn-link" title="Remove scratch pad line" onClick={() => setScratch(i, sp.filter((_, j) => j !== k))}>✕</button>}
                                                            </div>
                                                        ))}
                                                        <div className="sp-foot">
                                                            {!ro ? <button className="btn-secondary btn-small" onClick={() => setScratch(i, [...sp, { note: '', amount: '' }])}>+ Add line</button> : <span />}
                                                            <span>Total <b>{$(scratchTotal(sp))}</b>{toNumber(l.cost) ? <span style={{ color: '#888' }}> · line cost {$(toNumber(l.cost))}</span> : null}
                                                                {!ro && (() => {
                                                                    const tot = scratchTotal(sp);
                                                                    const same = round2(toNumber(l.cost)) === tot;
                                                                    return (
                                                                        <button type="button" className="btn-primary btn-small" style={{ marginLeft: 10 }} disabled={tot <= 0 || same}
                                                                            title={tot <= 0 ? 'The total must be more than $0.00.' : same ? 'Cost already matches the total.' : 'Put this total in the line\'s Cost'}
                                                                            onClick={() => {
                                                                                const old = round2(toNumber(l.cost));
                                                                                if (old && !window.confirm(`Replace the cost ${$(old)} with the scratch pad total ${$(tot)}?`)) return;
                                                                                setLine(i, 'cost', fmtMoney(tot));
                                                                            }}>
                                                                            Use total as cost
                                                                        </button>
                                                                    );
                                                                })()}
                                                            </span>
                                                        </div>
                                                        {!ro && <div className="hint">An amount can be a sum, like 2*480+150, or use Calc. Minus amounts are fine. "Use total as cost" puts the total in the line's Cost. Saved with the extra when you click Save.</div>}
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                        </React.Fragment>
                                        );
                                    })}
                                </tbody>
                            </table>
                            {calcFor && form.lines[calcFor.i] && (() => {
                                const sp = Array.isArray(form.lines[calcFor.i].scratch) ? form.lines[calcFor.i].scratch : [];
                                const cur = sp[calcFor.k] ? String(sp[calcFor.k].amount || '').replace(/,/g, '') : '';
                                return <Calculator start={cur} onClose={() => setCalcFor(null)}
                                    onUse={(v) => { setScratch(calcFor.i, sp.map((y, j) => j === calcFor.k ? { ...y, amount: fmtSigned(v) } : y)); setCalcFor(null); }} />;
                            })()}
                            {!ro && <button className="btn-secondary btn-small" style={{ marginTop: 8 }} onClick={addLine}>+ Add line</button>}
                            <div className="hint">Price = cost ÷ (1 − margin). Margin starts at 25% (cost ÷ 0.75); Allowance = no margin (price = cost), O&amp;P still added. "We absorb" lines are left off the customer's change order; their cost still counts. New PO lines start ticked in Make POs (once the extra is Signed, Work Done Customer Refused, or Approved for internal); lines not put on a PO go to the trade budget.</div>

                            <div className="totals">
                                <div><span>Cost of all lines</span><span>{$(totals.costTotal)}</span></div>
                                {totals.allowanceCost > 0 && <div style={{ color: '#888' }}><span>Allowances (cost)</span><span>{$(totals.allowanceCost)}</span></div>}
                                {totals.absorbedCost > 0 && <div style={{ color: '#888' }}><span>We absorb (cost)</span><span>{$(totals.absorbedCost)}</span></div>}
                                {form.type === 'internal' ? (
                                    <div className="grand"><span>Customer price</span><span style={{ color: '#888' }}>No charge (internal)</span></div>
                                ) : (
                                    <React.Fragment>
                                        <div><span>Sub Total</span><span>{$(totals.subtotal)}</span></div>
                                        <div><span>Overhead and Profit (10 &amp; 10)</span><span>{$(totals.op)}</span></div>
                                        <div className="grand"><span>Total Extra</span><span>{$(totals.total)}</span></div>
                                    </React.Fragment>
                                )}
                            </div>

                            <div className="row-actions">
                                {(!ro || priceOpen) && <button className="btn-primary" disabled={!!busy || (openId !== 'new' && !dirty)} onClick={saveExtra}>{busy === 'save' ? 'Saving...' : 'Save'}</button>}
                                {current && PO_STATUSES.includes(current.status) && (current.lines || []).some(l => !(l.po && l.po.formId)) && (
                                    <button className="btn-primary" disabled={!!busy || dirty} onClick={openPoPick}>{busy.startsWith('pos') ? 'Making POs ' + busy.slice(4) + '...' : 'Make POs'}</button>
                                )}
                                {current && editable(current).type !== 'internal' && <button className="btn-secondary" disabled={!!busy || dirty} onClick={makePdf}>{busy === 'pdf' ? 'Making PDF...' : 'Make PDF'}</button>}
                                {current && current.status !== 'Void' && editable(current).type !== 'internal' && (
                                    <button className="btn-secondary" disabled={!!busy || dirty} onClick={() => fileRef.current && fileRef.current.click()}>
                                        {busy === 'upload' ? 'Uploading...' : 'Upload signed copy'}
                                    </button>
                                )}
                                <input ref={fileRef} type="file" accept="application/pdf,image/*" style={{ display: 'none' }} onChange={e => uploadSigned(e.target.files && e.target.files[0])} />
                            </div>
                            {dirty && openId !== 'new' && <div className="hint">Unsaved changes. Save before making a PDF, uploading or changing the status.</div>}
                            {msg && <div className={msg.ok ? 'ok' : 'error'}>{msg.text}</div>}

                            {current && (
                                <div style={{ marginTop: 18 }}>
                                    {(current.pdfs || []).length > 0 && (
                                        <div>
                                            <label>PDFs made</label>
                                            <ul className="small-list">
                                                {current.pdfs.map((p, i) => <li key={i}><a href={p.url} target="_blank" rel="noopener">{p.fileName}</a> ({$(p.total)}) {fmtWhen(p.madeAt)} by {p.madeBy && p.madeBy.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                    {(current.signedCopies || []).length > 0 && (
                                        <div>
                                            <label>Signed copies</label>
                                            <ul className="small-list">
                                                {current.signedCopies.map((p, i) => <li key={i}><a href={p.url} target="_blank" rel="noopener">{p.fileName}</a> uploaded {fmtWhen(p.uploadedAt)} by {p.uploadedBy && p.uploadedBy.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                    {(current.poHistory || []).length > 0 && (
                                        <div>
                                            <label>POs made</label>
                                            <ul className="small-list">
                                                {current.poHistory.map((p, i) => <li key={i}>{p.poNumber}: {p.cat} / {p.vendor}, {$(p.cost)} (line{p.lines && p.lines.length > 1 ? 's' : ''} {(p.lines || []).join(', ')}) {fmtWhen(p.at)} by {p.by && p.by.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                    <label>Status history</label>
                                    <ul className="small-list">
                                        {(current.statusHistory || []).map((h, i) => <li key={i}>{statusLabel(h.status)} {fmtWhen(h.at)} by {h.by && h.by.name}</li>)}
                                    </ul>
                                    {(current.versions || []).length > 0 && (
                                        <div>
                                            <button className="btn-link" onClick={() => setShowVersions(v => !v)}>
                                                {showVersions ? 'Hide' : 'Show'} earlier versions ({current.versions.length})
                                            </button>
                                            {showVersions && (
                                                <ul className="small-list">
                                                    {current.versions.map((v, i) => (
                                                        <li key={i}>
                                                            Saved {fmtWhen(v.savedAt)} by {v.savedBy && v.savedBy.name}: "{v.title}", {(v.lines || []).length} lines, Total Extra {$(v.total)}
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    )}
                                    <div className="hint">Created {fmtWhen(current.createdAt)} by {current.createdBy && current.createdBy.name}.</div>
                                </div>
                            )}
                        </div>
                    )}
                    </div>
                </div>
            );
        }

        function PoPickWindow({ extra, pick, setPick, groups, superName, onMake, onClose, busy }) {
            const lines = extra.lines || [];
            const open = lines.map((l, i) => i).filter(i => !(lines[i].po && lines[i].po.formId));
            const ticked = open.filter(i => pick[i]).length;
            return (
                <div className="modal-back">
                    <div className="modal">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                            <div className="section-title" style={{ margin: 0 }}>Make POs from Extra #{extra.number}</div>
                            <button className="btn-secondary btn-small" disabled={!!busy} onClick={onClose}>Close</button>
                        </div>
                        <p style={{ fontSize: 13, color: '#555' }}>Tick the lines that get a PO. Lines with the same Cat and vendor go on one PO. Unticked lines go to the trade budget. Super on the POs: <b>{superName || 'none on Customer Information'}</b></p>
                        <table>
                            <thead><tr><th style={{ width: 40 }}>PO</th><th style={{ width: 30 }}>#</th><th>Cat</th><th>Vendor</th><th>Description</th><th className="num">Cost</th></tr></thead>
                            <tbody>
                                {lines.map((l, i) => {
                                    const done = l.po && l.po.formId;
                                    return (
                                        <tr key={i} className={pick[i] ? 'picked' : ''}>
                                            <td>{done ? <span className="po-tag" style={{ marginTop: 0 }}>{l.po.poNumber}</span>
                                                : <input type="checkbox" style={{ width: 'auto' }} checked={!!pick[i]} disabled={!!busy} onChange={e => setPick(p => ({ ...p, [i]: e.target.checked }))} />}</td>
                                            <td>{i + 1}</td>
                                            <td>{l.cat}</td>
                                            <td>{l.vendor}</td>
                                            <td>{l.description}{l.use === 'absorb' && <span style={{ color: '#888' }}> (we absorb)</span>}</td>
                                            <td className="num">{$(l.cost)}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        {groups.length > 0 && (
                            <div style={{ marginTop: 12 }}>
                                <label>POs to make</label>
                                {groups.map((g, k) => (
                                    <div key={k} className="group"><b>{g.cat || '(no Cat)'} / {g.vendor || '(no vendor)'}</b>: {$(g.cost)}, line{g.idx.length > 1 ? 's' : ''} {g.idx.map(i => i + 1).join(', ')}</div>
                                ))}
                            </div>
                        )}
                        <div className="row-actions">
                            <button className="btn-primary" disabled={!!busy} onClick={onMake}>
                                {busy ? 'Working...' : groups.length ? `Make ${groups.length} PO${groups.length > 1 ? 's' : ''}` : 'Save (no POs)'}
                            </button>
                            <span style={{ fontSize: 13, color: '#555', alignSelf: 'center' }}>{ticked} of {open.length} open line{open.length !== 1 ? 's' : ''} ticked</span>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ExtrasApp />, document.getElementById('app'));
    </script>
</body>
</html>
