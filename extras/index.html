<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extras &amp; Credits - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        input:disabled, select:disabled, textarea:disabled { background: #f7f7f7; color: #555; }
        .hint { font-size: 11px; color: #888; margin-top: 3px; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover:not(:disabled) { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover:not(:disabled) { background: #e0e0e0; }
        .btn-small { padding: 5px 10px; font-size: 13px; }
        .btn-link { background: none; color: #0066cc; padding: 0; font-size: 13px; }
        .btn-link:hover:not(:disabled) { text-decoration: underline; }
        .error { color: #d32f2f; font-size: 13px; margin-top: 5px; }
        .ok { color: #2e7d32; font-size: 13px; margin-top: 5px; }
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f5f5; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        tr.void td { color: #999; text-decoration: line-through; }
        tr.picked td { background: #eef5ff; }
        .lines td input, .lines td select, .lines td textarea { padding: 6px 8px; font-size: 13px; }
        .totals { margin-top: 12px; margin-left: auto; width: 320px; font-size: 14px; }
        .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
        .totals .grand { font-weight: 700; border-top: 2px solid #333; margin-top: 4px; padding-top: 6px; }
        .status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .status-btn { padding: 6px 12px; font-size: 13px; background: #f0f0f0; color: #333; border: 1px solid #ddd; }
        .status-btn.on { background: #0066cc; color: white; border-color: #0066cc; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #eee; color: #333; }
        .badge.Signed { background: #e3f2e5; color: #2e7d32; }
        .badge.Sent { background: #e3eefb; color: #0052a3; }
        .badge.Refused { background: #fdecea; color: #b71c1c; }
        .badge.Void { background: #eee; color: #888; }
        .box { border: 1px solid #ddd; border-radius: 6px; padding: 16px; background: #fcfcfc; }
        .info { background: #fff8e1; border: 1px solid #ffe082; border-radius: 4px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
        .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .small-list { font-size: 13px; margin: 4px 0 10px 0; }
        .small-list li { margin: 2px 0 2px 18px; }
        .radio-line { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #333; margin-bottom: 6px; font-weight: normal; }
        .radio-line input { width: auto; margin-top: 2px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .totals { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Extras &amp; Credits</h1>
        <p class="subtitle">Freeman Restoration extra change orders</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Same Firebase project as the other tools
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        const EXTRAS_ROLES = ['owner', 'admin', 'estimator', 'super'];

        // ---------- Pricing (decided Oct 24) ----------
        // Line price to the customer = cost ÷ 0.75 (25% margin). Total = subtotal × 1.2 (overhead and profit, 10 & 10).
        // "We absorb" lines are left off the customer price; their cost still counts.
        const MARGIN_DIVISOR = 0.75;
        const OP_RATE = 0.20;
        const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
        const toNumber = (t) => {
            const s = String(t ?? '').replace(/[^0-9.]/g, '');
            if (!s) return 0;
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        };
        const linePrice = (cost) => round2(toNumber(cost) / MARGIN_DIVISOR);
        const calcTotals = (lines) => {
            let costTotal = 0, absorbedCost = 0, subtotal = 0;
            (lines || []).forEach(l => {
                const c = toNumber(l.cost);
                costTotal += c;
                if (l.use === 'absorb') absorbedCost += c;
                else subtotal += linePrice(c);
            });
            subtotal = round2(subtotal);
            const op = round2(subtotal * OP_RATE);
            return { costTotal: round2(costTotal), absorbedCost: round2(absorbedCost), subtotal, op, total: round2(subtotal + op) };
        };
        const fmtMoney = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const $ = (n) => '$' + fmtMoney(n);

        const STATUSES = ['Draft', 'Sent', 'Signed', 'Customer refused', 'Void'];
        const LOCKED = ['Signed', 'Void']; // no edits to the extra itself while in these
        const badgeClass = (s) => s === 'Customer refused' ? 'Refused' : s;
        const USES = [['po', 'New PO'], ['budget', 'Trade budget'], ['absorb', 'We absorb']];
        const useLabel = (u) => (USES.find(x => x[0] === u) || USES[1])[1];
        const TYPES = [['customer', 'Customer'], ['internal', 'Internal (supplement)']];
        const typeLabel = (t) => (TYPES.find(x => x[0] === t) || TYPES[0])[1];

        const BLANK_LINE = () => ({ cat: '', description: '', vendor: '', cost: '', use: 'budget' });
        const BLANK_FORM = () => ({ type: 'customer', title: '', description: '', payBy: 'customer', daysAdded: '', lines: [BLANK_LINE()] });

        // The parts of an extra a person edits (what a version keeps)
        const editable = (x) => ({
            type: x.type === 'internal' ? 'internal' : 'customer',
            title: String(x.title || '').trim(),
            description: String(x.description || '').trim(),
            payBy: x.payBy === 'supplement' ? 'supplement' : 'customer',
            daysAdded: String(x.daysAdded ?? '').trim(),
            lines: (x.lines || []).map(l => ({
                cat: String(l.cat || '').trim().toUpperCase(),
                description: String(l.description || '').trim(),
                vendor: String(l.vendor || '').trim(),
                cost: round2(toNumber(l.cost)),
                use: ['po', 'budget', 'absorb'].includes(l.use) ? l.use : 'budget'
            })).filter(l => l.cat || l.description || l.vendor || l.cost)
        });
        const sameEditable = (a, b) => JSON.stringify(editable(a)) === JSON.stringify(editable(b));
        // Saved record -> form (cost shown as text)
        const toForm = (x) => {
            const e = editable(x);
            return { ...e, lines: e.lines.length ? e.lines.map(l => ({ ...l, cost: l.cost ? fmtMoney(l.cost) : '' })) : [BLANK_LINE()] };
        };

        const tsDate = (t) => { try { return t && t.toDate ? t.toDate() : (t ? new Date(t) : null); } catch (e) { return null; } };
        const fmtDate = (t) => { const d = tsDate(t); return d ? `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}` : ''; };
        const fmtWhen = (t) => { const d = tsDate(t); return d ? fmtDate(d) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''; };

        // Customer name on the change order: the Insured line, or the homeowners joined with "&" (same as Customer Information)
        const customerName = (card) => {
            if (!card) return '';
            const d = card.details || {};
            if (d.insured && String(d.insured).trim()) return String(d.insured).trim();
            return (card.homeowners || []).map(h => String((h && h.name) || '').trim()).filter(Boolean).join(' & ');
        };

        // ---------- Extra Change Order PDF (made in the browser) ----------
        const COMPANY = ['751 S. Weir Canyon Rd., Suite 157, Box #153', 'Anaheim, CA 92808', 'Phone: (800) 778-8910'];
        const FOOTER = 'Freeman Restoration  (800) 778-8910  CSLB # 688391';
        const SUPPLEMENT_TEXT = "This extra will be Supplemented to the Customer's Insurance Company for payment. Funds from supplement will be used to offset the cost of this extra. In the event supplement is not paid Customer agrees to pay for this extra.";
        const CUSTOMER_TEXT = "This extra will be paid directly by Customer. We will not supplement this change to customers Insurance Company.";
        const ACCEPT_TEXT = 'The above prices and specifications of this extra order are satisfactory and are hereby accepted. All Work to be performed under the same terms and conditions as specified in the original contract unless otherwise noted.';

        const pdfFileName = (number, total, code) => {
            const d = new Date();
            const yy = String(d.getFullYear()).slice(-2);
            return `Extra#${number}_$${fmtMoney(total)}_${(code || 'job').replace(/[^\w.-]+/g, '_')}_${d.getMonth() + 1}-${d.getDate()}-${yy}.pdf`;
        };

        // pdf-lib's standard fonts only print plain characters; swap the common others
        const plain = (s) => String(s || '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x20-\x7E\n]/g, '');

        const buildExtraPdf = async ({ number, extra, totals, name, address, code, dateText }) => {
            const { PDFDocument, StandardFonts, rgb } = PDFLib;
            const doc = await PDFDocument.create();
            const font = await doc.embedFont(StandardFonts.Helvetica);
            const bold = await doc.embedFont(StandardFonts.HelveticaBold);
            const W = 612, H = 792, M = 50, BOTTOM = 60;
            const black = rgb(0, 0, 0), grey = rgb(0.4, 0.4, 0.4), line = rgb(0.75, 0.75, 0.75);
            let page, y;

            const wrap = (text, f, size, width) => {
                const out = [];
                plain(text).split('\n').forEach(para => {
                    const words = para.split(/\s+/).filter(Boolean);
                    if (!words.length) { out.push(''); return; }
                    let cur = '';
                    words.forEach(w => {
                        const test = cur ? cur + ' ' + w : w;
                        if (f.widthOfTextAtSize(test, size) <= width) cur = test;
                        else { if (cur) out.push(cur); cur = w; }
                    });
                    if (cur) out.push(cur);
                });
                return out;
            };
            const text = (s, x, yy, size = 10, f = font, color = black) => page.drawText(plain(s), { x, y: yy, size, font: f, color });
            const right = (s, xr, yy, size = 10, f = font) => text(s, xr - f.widthOfTextAtSize(plain(s), size), yy, size, f);
            const footer = () => {
                const w = font.widthOfTextAtSize(FOOTER, 9);
                text(FOOTER, (W - w) / 2, 30, 9, font, grey);
            };
            const newPage = () => {
                page = doc.addPage([W, H]);
                footer();
                y = H - M;
            };
            const need = (h) => { if (y - h < BOTTOM) { newPage(); text(`Extra #${number} (continued)`, M, y, 10, bold); y -= 20; } };

            newPage();
            // Header
            text('Freeman Restoration', M, y, 16, bold); y -= 14;
            COMPANY.forEach(l => { text(l, M, y, 9, font, grey); y -= 11; });
            y -= 14;
            const title = 'EXTRA CHANGE ORDER';
            text(title, (W - bold.widthOfTextAtSize(title, 18)) / 2, y, 18, bold); y -= 30;

            // Name / address / extra number
            text('Name:', M, y, 10, bold); text(name || '', M + 55, y, 10);
            text('Extra #:', 400, y, 10, bold); text(String(number), 455, y, 10); y -= 15;
            text('Address:', M, y, 10, bold);
            const addrLines = wrap(address || '', font, 10, 280);
            text('Date:', 400, y, 10, bold); text(dateText, 455, y, 10);
            addrLines.forEach((l, i) => { text(l, M + 55, y - i * 13, 10); });
            y -= Math.max(1, addrLines.length) * 13 + 2;
            if (code) { text('Job:', 400, y + 2, 10, bold); text(code, 455, y + 2, 10); }
            y -= 18;

            // Extra description
            text('EXTRA DESCRIPTION', M, y, 11, bold); y -= 15;
            if (extra.title) { wrap(extra.title, bold, 11, W - 2 * M).forEach(l => { need(14); text(l, M, y, 11, bold); y -= 14; }); }
            if (extra.description) { wrap(extra.description, font, 10, W - 2 * M).forEach(l => { need(13); text(l, M, y, 10); y -= 13; }); }
            y -= 10;

            // Lines (charged lines only; "We absorb" lines are left off)
            const colCat = M, colDesc = M + 70, colAmt = W - M, descW = (W - M - 90) - colDesc;
            const header = () => {
                text('Category', colCat, y, 10, bold); text('Description', colDesc, y, 10, bold); right('Amount', colAmt, y, 10, bold);
                y -= 5; page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 1, color: black }); y -= 13;
            };
            need(40); header();
            extra.lines.filter(l => l.use !== 'absorb').forEach(l => {
                const d = wrap(l.description || '', font, 10, descW);
                const h = Math.max(1, d.length) * 13 + 4;
                if (y - h < BOTTOM) { newPage(); text(`Extra #${number} (continued)`, M, y, 10, bold); y -= 20; header(); }
                text(l.cat || '', colCat, y, 10);
                d.forEach((t, i) => text(t, colDesc, y - i * 13, 10));
                right($(linePrice(l.cost)), colAmt, y, 10);
                y -= h;
                page.drawLine({ start: { x: M, y: y + 9 }, end: { x: W - M, y: y + 9 }, thickness: 0.5, color: line });
            });

            // Totals
            need(60); y -= 6;
            const tl = 340;
            text('Sub Total', tl, y, 10); right($(totals.subtotal), colAmt, y, 10); y -= 14;
            text('Overhead and Profit (10 & 10)', tl, y, 10); right($(totals.op), colAmt, y, 10); y -= 6;
            page.drawLine({ start: { x: tl, y }, end: { x: W - M, y }, thickness: 1, color: black }); y -= 13;
            text('Total Extra', tl, y, 11, bold); right($(totals.total), colAmt, y, 11, bold); y -= 28;

            // Payment, days added, acceptance and signatures (kept on one page)
            const payLines = (t) => wrap(t, font, 10, W - 2 * M - 30);
            const sLines = payLines(SUPPLEMENT_TEXT), cLines = payLines(CUSTOMER_TEXT), aLines = wrap(ACCEPT_TEXT, font, 10, W - 2 * M);
            const blockH = (sLines.length + cLines.length + aLines.length) * 13 + 200;
            need(blockH);
            const check = (on, lines) => {
                page.drawRectangle({ x: M, y: y - 2, width: 11, height: 11, borderColor: black, borderWidth: 1 });
                if (on) text('X', M + 2, y, 10, bold);
                lines.forEach((t, i) => text(t, M + 25, y - i * 13, 10));
                y -= lines.length * 13 + 10;
            };
            check(extra.payBy === 'supplement', sLines);
            check(extra.payBy !== 'supplement', cLines);
            y -= 4;
            const days = extra.daysAdded === '' ? '____' : String(extra.daysAdded);
            text(days, M, y, 10, bold);
            text('Days added to completion date for this extra work, from the date of customer approval', M + 35, y, 10); y -= 26;
            aLines.forEach(t => { text(t, M, y, 10); y -= 13; });
            y -= 34;
            const sig = (label) => {
                page.drawLine({ start: { x: M, y }, end: { x: M + 300, y }, thickness: 0.8, color: black });
                page.drawLine({ start: { x: M + 340, y }, end: { x: W - M, y }, thickness: 0.8, color: black });
                text(label, M, y - 12, 9, font, grey); text('Date', M + 340, y - 12, 9, font, grey);
                y -= 44;
            };
            sig('Owner Signature');
            sig('Owner Signature');
            return await doc.save();
        };

        const downloadBytes = (bytes, fileName) => {
            const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
            const a = document.createElement('a');
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        };

        // ---------- Page ----------
        function ExtrasApp() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState('');
            const [profile, setProfile] = useState(null); // null = checking, 'pending', false = not set up, object = active user
            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [card, setCard] = useState(null);
            const [extras, setExtras] = useState([]);
            const [listError, setListError] = useState('');
            const [openId, setOpenId] = useState(null); // extra id, 'new', or null
            const [form, setForm] = useState(null);
            const [busy, setBusy] = useState('');
            const [msg, setMsg] = useState(null); // { ok, text }
            const [showVersions, setShowVersions] = useState(false);
            const fileRef = useRef(null);

            useEffect(() => {
                auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) { setJobs([]); setJobId(''); setExtras([]); setOpenId(null); setForm(null); return; }
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        if (snap.exists && snap.data().active === true) {
                            setProfile({ uid: currentUser.uid, ...snap.data() });
                        } else if (!snap.exists) {
                            try {
                                await db.collection('users').doc(currentUser.uid).set({
                                    name: currentUser.displayName || currentUser.email || '',
                                    email: currentUser.email || '',
                                    role: 'pending', active: false, requestedAt: new Date()
                                });
                                setProfile('pending');
                            } catch (e) { setProfile(false); }
                        } else {
                            setProfile(snap.data().role === 'pending' ? 'pending' : false);
                        }
                    } catch (e) { setProfile(false); }
                });
            }, []);

            const allowed = !!profile && typeof profile === 'object' && EXTRAS_ROLES.includes(profile.role);
            const me = allowed ? { uid: profile.uid, name: profile.name || (user && user.email) || '' } : null;

            // Job list: all jobs, or only assigned jobs for Supers
            useEffect(() => {
                if (!allowed) return;
                let q = db.collection('jobs');
                if (profile.role === 'super') q = q.where('assignedSupers', 'array-contains', profile.uid);
                return q.onSnapshot(snap => {
                    const list = [];
                    snap.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, code: d.code || '', address: d.address || '', cityStateZip: d.cityStateZip || '', archived: d.archived === true });
                    });
                    list.sort((a, b) => a.code.localeCompare(b.code));
                    setJobs(list);
                }, err => setListError('Error loading jobs: ' + err.message));
            }, [allowed]);

            // Open from a link with ?job=ID
            const urlDone = useRef(false);
            useEffect(() => {
                if (urlDone.current || !jobs.length) return;
                urlDone.current = true;
                const id = new URLSearchParams(window.location.search).get('job');
                if (id && jobs.some(j => j.id === id)) setJobId(id);
            }, [jobs]);

            // Customer Information card (name on the change order)
            useEffect(() => {
                setCard(null);
                if (!allowed || !jobId) return;
                return db.collection('jobs').doc(jobId).collection('notesInfo').doc('contactCard').onSnapshot(
                    doc => setCard(doc.exists ? doc.data() : {}),
                    () => setCard({})
                );
            }, [allowed, jobId]);

            // The job's extras
            useEffect(() => {
                setExtras([]); setListError('');
                if (!allowed || !jobId) return;
                return db.collection('extras').doc(jobId).collection('items').onSnapshot(snap => {
                    const list = [];
                    snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => (a.number || 0) - (b.number || 0));
                    setExtras(list);
                }, err => setListError('Error loading extras: ' + err.message));
            }, [allowed, jobId]);

            const job = jobs.find(j => j.id === jobId) || null;
            const address = job ? [job.address, job.cityStateZip].filter(Boolean).join(', ') : '';
            const name = customerName(card);
            const current = openId && openId !== 'new' ? extras.find(x => x.id === openId) || null : null;
            const dirty = !!form && (openId === 'new' ? !sameEditable(form, BLANK_FORM()) : (current ? !sameEditable(form, current) : false));
            const locked = !!current && LOCKED.includes(current.status);

            const say = (ok, text) => setMsg({ ok, text });
            const leaveOk = () => !dirty || window.confirm('You have unsaved changes to this extra. Drop them?');

            const pickJob = (id) => {
                if (id === jobId) return;
                if (!leaveOk()) return;
                setOpenId(null); setForm(null); setMsg(null); setShowVersions(false);
                setJobId(id);
            };
            const openExtra = (x) => {
                if (openId === x.id) return;
                if (!leaveOk()) return;
                setOpenId(x.id); setForm(toForm(x)); setMsg(null); setShowVersions(false);
            };
            const newExtra = () => {
                if (!leaveOk()) return;
                setOpenId('new'); setForm(BLANK_FORM()); setMsg(null); setShowVersions(false);
            };
            const closeExtra = () => {
                if (!leaveOk()) return;
                setOpenId(null); setForm(null); setMsg(null); setShowVersions(false);
            };

            const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));
            const setLine = (i, k, v) => setForm(f => ({ ...f, lines: f.lines.map((l, j) => j === i ? { ...l, [k]: v } : l) }));
            const addLine = () => setForm(f => ({ ...f, lines: [...f.lines, BLANK_LINE()] }));
            const removeLine = (i) => setForm(f => ({ ...f, lines: f.lines.length > 1 ? f.lines.filter((_, j) => j !== i) : [BLANK_LINE()] }));

            const stamp = () => firebase.firestore.Timestamp.now();

            const saveExtra = async () => {
                const e = editable(form);
                if (!e.title) { say(false, 'Give the extra a title.'); return; }
                if (!e.lines.length) { say(false, 'Add at least one line.'); return; }
                const t = calcTotals(e.lines);
                setBusy('save'); setMsg(null);
                try {
                    if (openId === 'new') {
                        const parent = db.collection('extras').doc(jobId);
                        const ref = parent.collection('items').doc();
                        let number = 0;
                        await db.runTransaction(async (tx) => {
                            const p = await tx.get(parent);
                            const used = extras.reduce((m, x) => Math.max(m, x.number || 0), 0);
                            number = Math.max((p.exists && p.data().nextNumber) || 1, used + 1);
                            tx.set(parent, { nextNumber: number + 1, updatedAt: stamp() }, { merge: true });
                            tx.set(ref, {
                                ...e, ...t, number, status: 'Draft',
                                statusHistory: [{ status: 'Draft', at: stamp(), by: me }],
                                createdAt: stamp(), createdBy: me, updatedAt: stamp(), updatedBy: me,
                                versions: [], pdfs: [], signedCopies: []
                            });
                        });
                        setOpenId(ref.id);
                        setForm(toForm(e));
                        say(true, `Extra #${number} saved as Draft.`);
                    } else {
                        if (!current) return;
                        if (LOCKED.includes(current.status)) { say(false, `Extra #${current.number} is ${current.status} and can't be changed.`); return; }
                        if (sameEditable(e, current)) { say(true, 'No changes to save.'); return; }
                        const old = { ...editable(current), total: current.total || 0, savedAt: current.updatedAt || current.createdAt || null, savedBy: current.updatedBy || current.createdBy || null };
                        await db.collection('extras').doc(jobId).collection('items').doc(current.id).update({
                            ...e, ...t, updatedAt: stamp(), updatedBy: me,
                            versions: firebase.firestore.FieldValue.arrayUnion(old)
                        });
                        setForm(toForm(e));
                        say(true, `Extra #${current.number} saved. The earlier version is kept.`);
                    }
                } catch (err) {
                    say(false, 'Save failed: ' + err.message);
                } finally { setBusy(''); }
            };

            const setStatus = async (s) => {
                if (!current || current.status === s) return;
                if (dirty) { say(false, 'Save your changes first.'); return; }
                if (s === 'Void' && !window.confirm(`Void Extra #${current.number}? It will no longer count in GPM or Job Cost.`)) return;
                if (current.status === 'Signed' && !window.confirm(`Extra #${current.number} is Signed. Change it to ${s}?`)) return;
                if (s === 'Signed' && !(current.signedCopies || []).length && !window.confirm(`Mark Extra #${current.number} Signed without uploading the signed copy?`)) return;
                setBusy('status'); setMsg(null);
                try {
                    const upd = {
                        status: s, updatedAt: stamp(), updatedBy: me,
                        statusHistory: firebase.firestore.FieldValue.arrayUnion({ status: s, at: stamp(), by: me })
                    };
                    if (s === 'Signed') upd.signedAt = stamp();
                    await db.collection('extras').doc(jobId).collection('items').doc(current.id).update(upd);
                    say(true, `Extra #${current.number} is now ${s}.`);
                } catch (err) {
                    say(false, 'Status change failed: ' + err.message);
                } finally { setBusy(''); }
            };

            const makePdf = async () => {
                if (!current) return;
                if (dirty) { say(false, 'Save your changes first.'); return; }
                const e = editable(current);
                if (!e.lines.some(l => l.use !== 'absorb')) { say(false, 'Every line is "We absorb", so there is nothing to charge the customer.'); return; }
                const t = calcTotals(e.lines);
                setBusy('pdf'); setMsg(null);
                try {
                    const bytes = await buildExtraPdf({
                        number: current.number, extra: e, totals: t, name, address, code: job ? job.code : '',
                        dateText: fmtDate(new Date())
                    });
                    const fileName = pdfFileName(current.number, t.total, job ? job.code : '');
                    downloadBytes(bytes, fileName);
                    const ref = storage.ref(`jobForms/${jobId}/${Date.now()}_${fileName}`);
                    await ref.put(new Blob([bytes], { type: 'application/pdf' }));
                    const url = await ref.getDownloadURL();
                    await db.collection('extras').doc(jobId).collection('items').doc(current.id).update({
                        pdfs: firebase.firestore.FieldValue.arrayUnion({ url, fileName, total: t.total, madeAt: stamp(), madeBy: me }),
                        updatedAt: stamp(), updatedBy: me
                    });
                    say(true, `${fileName} downloaded and saved with the extra. Send it through Adobe Sign or print it.`);
                } catch (err) {
                    say(false, 'PDF failed: ' + err.message);
                } finally { setBusy(''); }
            };

            const uploadSigned = async (file) => {
                if (!current || !file) return;
                if (dirty) { say(false, 'Save your changes first.'); return; }
                if (current.status === 'Void') { say(false, 'This extra is Void.'); return; }
                if (!window.confirm(`Upload ${file.name} as the signed copy of Extra #${current.number}? It will be marked Signed.`)) return;
                setBusy('upload'); setMsg(null);
                try {
                    const safe = file.name.replace(/[^\w.#$,-]+/g, '_');
                    const ref = storage.ref(`jobForms/${jobId}/signed_${Date.now()}_${safe}`);
                    await ref.put(file, { contentType: file.type || 'application/pdf' });
                    const url = await ref.getDownloadURL();
                    const upd = {
                        signedCopies: firebase.firestore.FieldValue.arrayUnion({ url, fileName: file.name, uploadedAt: stamp(), uploadedBy: me }),
                        updatedAt: stamp(), updatedBy: me
                    };
                    if (current.status !== 'Signed') {
                        upd.status = 'Signed';
                        upd.signedAt = stamp();
                        upd.statusHistory = firebase.firestore.FieldValue.arrayUnion({ status: 'Signed', at: stamp(), by: me });
                    }
                    await db.collection('extras').doc(jobId).collection('items').doc(current.id).update(upd);
                    say(true, `Signed copy saved. Extra #${current.number} is Signed.`);
                } catch (err) {
                    say(false, 'Upload failed: ' + err.message);
                } finally {
                    setBusy('');
                    if (fileRef.current) fileRef.current.value = '';
                }
            };

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) { setAuthError(e.message); }
            };

            // ---------- Screens ----------
            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">LOGIN</div>
                        <button className="btn-primary" style={{ width: '100%' }} onClick={login}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }
            if (profile === null) return <div className="section">Loading...</div>;
            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">WAITING FOR APPROVAL</div>
                        <p>Your account is waiting for approval. An admin will set up your access.</p>
                    </div>
                );
            }
            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">ACCOUNT NOT SET UP</div>
                        <p>Your account doesn't have access. Contact an admin.</p>
                    </div>
                );
            }
            if (!allowed) {
                return (
                    <div className="section">
                        <div className="section-title">EXTRAS &amp; CREDITS</div>
                        <p>No access. Extras &amp; Credits is for Owner, Admin, Estimator and Super. Contact an admin.</p>
                    </div>
                );
            }

            const visibleJobs = jobs.filter(j => showArchived || !j.archived || j.id === jobId);
            const totals = form ? calcTotals(editable(form).lines) : null;
            const ro = locked; // form read-only

            return (
                <div>
                    <div className="section">
                        <div className="section-title">JOB</div>
                        <div className="form-group">
                            <select value={jobId} onChange={e => pickJob(e.target.value)}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code}{j.address ? ' - ' + j.address : ''}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                            <label className="radio-line" style={{ marginTop: 8 }}>
                                <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} />
                                Show archived jobs
                            </label>
                        </div>
                        {job && (
                            <div style={{ fontSize: 14, color: '#333' }}>
                                <div><b>Customer:</b> {name || <span style={{ color: '#b71c1c' }}>No name on Customer Information.</span>}</div>
                                <div><b>Address:</b> {address}</div>
                            </div>
                        )}
                        {listError && <div className="error">{listError}</div>}
                    </div>

                    {job && (
                        <div className="section">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                                <div className="section-title" style={{ margin: 0 }}>EXTRAS</div>
                                <button className="btn-primary btn-small" onClick={newExtra}>+ New Extra</button>
                            </div>
                            {extras.length === 0 ? (
                                <p style={{ color: '#777' }}>No extras on this job yet.</p>
                            ) : (
                                <table>
                                    <thead>
                                        <tr><th>#</th><th>Title</th><th>Type</th><th>Status</th><th className="num">Cost</th><th className="num">Total Extra</th><th>Signed</th><th></th></tr>
                                    </thead>
                                    <tbody>
                                        {extras.map(x => (
                                            <tr key={x.id} className={(x.status === 'Void' ? 'void ' : '') + (openId === x.id ? 'picked' : '')}>
                                                <td>{x.number}</td>
                                                <td>{x.title}</td>
                                                <td>{typeLabel(x.type)}</td>
                                                <td><span className={'badge ' + badgeClass(x.status)}>{x.status}</span></td>
                                                <td className="num">{$(x.costTotal)}</td>
                                                <td className="num">{$(x.total)}</td>
                                                <td>{x.status === 'Signed' ? fmtDate(x.signedAt) : ''}</td>
                                                <td><button className="btn-link" onClick={() => openExtra(x)}>Open</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    )}

                    {job && form && (
                        <div className="section box">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                                <div className="section-title" style={{ margin: 0 }}>
                                    {openId === 'new' ? 'New Extra (number is given on Save)' : `Extra #${current ? current.number : ''}`}
                                </div>
                                <button className="btn-secondary btn-small" onClick={closeExtra}>Close</button>
                            </div>

                            {current && (
                                <div>
                                    <label>Status</label>
                                    <div className="status-row">
                                        {STATUSES.map(s => (
                                            <button key={s} className={'status-btn' + (current.status === s ? ' on' : '')} disabled={!!busy} onClick={() => setStatus(s)}>{s}</button>
                                        ))}
                                    </div>
                                    {locked && <div className="info">This extra is {current.status}, so it can't be changed. {current.status === 'Signed' ? 'A change after signing is a new extra.' : ''}</div>}
                                </div>
                            )}

                            <div className="grid">
                                <div className="form-group">
                                    <label>Type</label>
                                    <select value={form.type} disabled={ro} onChange={e => setField('type', e.target.value)}>
                                        {TYPES.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>Days added to completion</label>
                                    <input value={form.daysAdded} disabled={ro} onChange={e => setField('daysAdded', e.target.value.replace(/[^0-9]/g, ''))} placeholder="0" />
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Title</label>
                                <input value={form.title} disabled={ro} onChange={e => setField('title', e.target.value)} placeholder="e.g. Wall Changes" />
                            </div>
                            <div className="form-group">
                                <label>Description (the customer reads this)</label>
                                <textarea rows={3} value={form.description} disabled={ro} onChange={e => setField('description', e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label>Payment</label>
                                <label className="radio-line">
                                    <input type="radio" checked={form.payBy === 'supplement'} disabled={ro} onChange={() => setField('payBy', 'supplement')} />
                                    Supplemented to the customer's insurance company; customer pays if the supplement is not paid
                                </label>
                                <label className="radio-line">
                                    <input type="radio" checked={form.payBy !== 'supplement'} disabled={ro} onChange={() => setField('payBy', 'customer')} />
                                    Paid directly by the customer
                                </label>
                            </div>

                            <label>Lines</label>
                            <table className="lines">
                                <thead>
                                    <tr><th style={{ width: 80 }}>Cat</th><th>Description</th><th style={{ width: 125 }}>Vendor</th><th className="num" style={{ width: 110 }}>Cost</th><th className="num" style={{ width: 100 }}>Price</th><th style={{ width: 140 }}>Use</th><th style={{ width: 30 }}></th></tr>
                                </thead>
                                <tbody>
                                    {form.lines.map((l, i) => (
                                        <tr key={i}>
                                            <td><input value={l.cat} disabled={ro} onChange={e => setLine(i, 'cat', e.target.value.toUpperCase())} placeholder="FRM" /></td>
                                            <td><textarea rows={2} value={l.description} disabled={ro} onChange={e => setLine(i, 'description', e.target.value)} /></td>
                                            <td><input value={l.vendor} disabled={ro} onChange={e => setLine(i, 'vendor', e.target.value)} /></td>
                                            <td><input style={{ textAlign: 'right' }} value={l.cost} disabled={ro} onChange={e => setLine(i, 'cost', e.target.value)} onBlur={e => { const n = toNumber(e.target.value); setLine(i, 'cost', n ? fmtMoney(n) : ''); }} placeholder="0.00" /></td>
                                            <td className="num" style={{ paddingTop: 12 }}>{l.use === 'absorb' ? <span style={{ color: '#888' }}>No charge</span> : $(linePrice(l.cost))}</td>
                                            <td>
                                                <select value={l.use} disabled={ro} onChange={e => setLine(i, 'use', e.target.value)}>
                                                    {USES.map(([v, t]) => <option key={v} value={v}>{t}</option>)}
                                                </select>
                                            </td>
                                            <td>{!ro && <button className="btn-link" title="Remove line" onClick={() => removeLine(i)}>✕</button>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {!ro && <button className="btn-secondary btn-small" style={{ marginTop: 8 }} onClick={addLine}>+ Add line</button>}
                            <div className="hint">Price = cost ÷ 0.75. "We absorb" lines are left off the customer's change order; their cost still counts. New PO and Trade budget are saved now and are used once the PO step is added.</div>

                            <div className="totals">
                                <div><span>Cost of all lines</span><span>{$(totals.costTotal)}</span></div>
                                {totals.absorbedCost > 0 && <div style={{ color: '#888' }}><span>We absorb (cost)</span><span>{$(totals.absorbedCost)}</span></div>}
                                <div><span>Sub Total</span><span>{$(totals.subtotal)}</span></div>
                                <div><span>Overhead and Profit (10 &amp; 10)</span><span>{$(totals.op)}</span></div>
                                <div className="grand"><span>Total Extra</span><span>{$(totals.total)}</span></div>
                            </div>

                            <div className="row-actions">
                                {!ro && <button className="btn-primary" disabled={!!busy || (openId !== 'new' && !dirty)} onClick={saveExtra}>{busy === 'save' ? 'Saving...' : 'Save'}</button>}
                                {current && <button className="btn-secondary" disabled={!!busy || dirty} onClick={makePdf}>{busy === 'pdf' ? 'Making PDF...' : 'Make PDF'}</button>}
                                {current && current.status !== 'Void' && (
                                    <button className="btn-secondary" disabled={!!busy || dirty} onClick={() => fileRef.current && fileRef.current.click()}>
                                        {busy === 'upload' ? 'Uploading...' : 'Upload signed copy'}
                                    </button>
                                )}
                                <input ref={fileRef} type="file" accept="application/pdf,image/*" style={{ display: 'none' }} onChange={e => uploadSigned(e.target.files && e.target.files[0])} />
                            </div>
                            {dirty && openId !== 'new' && <div className="hint">Unsaved changes. Save before making a PDF, uploading or changing the status.</div>}
                            {msg && <div className={msg.ok ? 'ok' : 'error'}>{msg.text}</div>}

                            {current && (
                                <div style={{ marginTop: 18 }}>
                                    {(current.pdfs || []).length > 0 && (
                                        <div>
                                            <label>PDFs made</label>
                                            <ul className="small-list">
                                                {current.pdfs.map((p, i) => <li key={i}><a href={p.url} target="_blank" rel="noopener">{p.fileName}</a> ({$(p.total)}) {fmtWhen(p.madeAt)} by {p.madeBy && p.madeBy.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                    {(current.signedCopies || []).length > 0 && (
                                        <div>
                                            <label>Signed copies</label>
                                            <ul className="small-list">
                                                {current.signedCopies.map((p, i) => <li key={i}><a href={p.url} target="_blank" rel="noopener">{p.fileName}</a> uploaded {fmtWhen(p.uploadedAt)} by {p.uploadedBy && p.uploadedBy.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                    <label>Status history</label>
                                    <ul className="small-list">
                                        {(current.statusHistory || []).map((h, i) => <li key={i}>{h.status} {fmtWhen(h.at)} by {h.by && h.by.name}</li>)}
                                    </ul>
                                    {(current.versions || []).length > 0 && (
                                        <div>
                                            <button className="btn-link" onClick={() => setShowVersions(v => !v)}>
                                                {showVersions ? 'Hide' : 'Show'} earlier versions ({current.versions.length})
                                            </button>
                                            {showVersions && (
                                                <ul className="small-list">
                                                    {current.versions.map((v, i) => (
                                                        <li key={i}>
                                                            Saved {fmtWhen(v.savedAt)} by {v.savedBy && v.savedBy.name}: "{v.title}", {(v.lines || []).length} lines, Total Extra {$(v.total)}
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    )}
                                    <div className="hint">Created {fmtWhen(current.createdAt)} by {current.createdBy && current.createdBy.name}.</div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<ExtrasApp />, document.getElementById('app'));
    </script>
</body>
</html>
