<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRM-EST - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .back { display: inline-block; color: #0066cc; text-decoration: none; font-size: 14px; margin-bottom: 12px; }
        .back:hover { text-decoration: underline; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        .sub-title { font-weight: 600; color: #444; margin: 18px 0 8px; font-size: 14px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, select { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { padding: 10px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; margin-top: 8px; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-x { background: #d32f2f; color: white; padding: 4px 9px; font-size: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .muted { font-size: 13px; color: #666; margin-top: 8px; }
        .msg { margin-top: 15px; padding: 10px; text-align: center; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 6px 4px; font-weight: 600; color: #555; border-bottom: 2px solid #ddd; }
        td { padding: 4px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        .num { width: 80px; }
        .out { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
        .out > div { flex: 1; min-width: 260px; background: #f9f9f9; border-radius: 4px; padding: 12px; font-size: 13px; }
        .out .t { font-weight: 600; margin-bottom: 6px; }
        .out div.l { padding: 2px 0; }
        .inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .inline label { margin: 0; }
        .unsaved { color: #cc6600; font-weight: 600; }
        .money { text-align: right; white-space: nowrap; }
        .totals td, .totals th { padding: 5px 6px; }
        .totals tr.sum td { font-weight: 700; border-top: 2px solid #ddd; }
        #print-root { display: none; }
        @media print {
            body { background: white; padding: 0; }
            body > .container { display: none; }
            #print-root { display: block; font-size: 12px; }
            #print-root h2 { font-size: 16px; margin: 0 0 4px; }
            #print-root h3 { font-size: 13px; margin: 14px 0 4px; }
            #print-root .page { page-break-after: always; }
            #print-root .page:last-child { page-break-after: auto; }
            #print-root table { width: 100%; border-collapse: collapse; }
            #print-root td, #print-root th { padding: 2px 4px; border-bottom: 1px solid #eee; text-align: left; }
        }
    </style>
</head>
<body>
    <div id="print-root"></div>
    <div class="container">
        <a class="back" href="/">← Dashboard</a>
        <h1>FRM-EST</h1>
        <p class="subtitle">Freeman Restoration framing estimate: lumber lists, framing hours, demo hours</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ALLOWED = ['owner', 'admin', 'estimator'];

        // Wall height -> precut stud (supplier) and nominal feet (Xactimate LF)
        const HEIGHTS = {
            '8':  { precut: '92 1/4',  ft: 8 },
            '9':  { precut: '104 5/8', ft: 9 },
            '10': { precut: '116 5/8', ft: 10 }
        };
        const HEADER_SIZES = ['4x4', '4x6', '4x8', '4x10', '4x12', '6x6', '6x8', '6x10', '6x12'];
        const POST_SIZES = ['4x4', '4x6', '4x8', '6x6'];

        const JOIST_SIZES = ['2x6', '2x8', '2x10', '2x12'];
        const BEAM_SIZES = ['4x6', '4x8', '4x10', '4x12', '6x8', '6x10', '6x12'];
        const SPACING = { '12': 1.0, '16': 0.8, '24': 0.55 }; // joists per LF of run
        const SHEATH_TYPES = { '3/4': '4 x 8 x 3/4" T&G', '5/8': '4 x 8 x 5/8" T&G' };

        const RAFTER_SIZES = ['2x6', '2x8', '2x10', '2x12'];
        const RIDGE_SIZES = ['2x8', '2x10', '2x12', '2x14'];
        const PURLIN_SIZES = ['2x4', '2x6', '4x4', '4x6'];
        const newRoof = () => ({ name: '', size: '2x6', spacing: '24', pitch: '', run: '', overhang: '', length: '', sides: 2, gables: 2, ridgeSize: '2x8', doubleRidge: false, collar: true });
        const ROOF_SHEATH = { '1/2': '4 x 8 x 1/2" CDX', '7/16': '4 x 8 x 7/16" OSB' };
        const newTruss = () => ({ name: '', span: '', pitch: '', overhang: '', length: '', gables: 2 });
        const HARDWARE = ['Simpson H2.5A', 'Simpson A35', 'Simpson L50', 'Simpson LUS26', 'Simpson LUS28', 'Simpson LUS210',
            'Simpson LSU26', 'Simpson LSU210', 'Simpson HDU2', 'Simpson HDU4', 'Simpson MSTA24', 'Simpson MSTA36',
            'Simpson CS16 coil strap', 'Simpson SDS 1/4 x 3', '16d gun nails', '8d gun nails', '10d gun nails', '5 lbs teco nails'];
        const HW_UNITS = ['EA', 'Box', 'Roll', 'LF'];
        const HW_SUPPLIER_WASTE = 0; // no supplier waste on hardware
        const newHW = () => ({ item: '', qty: '', unit: 'EA' });
        const newJoist = () => ({ name: '', size: '2x10', span: '', run: '', spacing: '16', extra: '' });
        const newLF = (size) => ({ size, lf: '' });
        const newWall = () => ({ name: '', lf: '', size: '2x4', height: '8', topPlates: 2, pt: true, extraStuds: '' });
        const newPiece = (size) => ({ size, qty: '', length: '' });
        const newHours = () => ({ crew: '', days: '', note: '' });
        const blankEstimate = () => ({
            waste: { supplier: 10, xact: 25 },
            walls: {
                rows: [newWall()],
                headers: [],
                posts: [],
                bracingLF: '',
                shearSF: '',
                frmHours: newHours(),
                dmoHours: newHours()
            },
            floor: {
                rows: [newJoist()],
                rims: [],
                blocking: [],
                beams: [],
                sheathSF: '',
                sheathType: '3/4',
                frmHours: newHours(),
                dmoHours: newHours()
            },
            roof: {
                rows: [newRoof()],
                hips: [],
                calFill: [],
                purlins: [],
                frmHours: newHours(),
                dmoHours: newHours()
            },
            trusses: {
                rows: [newTruss()],
                bracing: [],
                blocking: [],
                frmHours: newHours(),
                dmoHours: newHours()
            },
            roofSheath: {
                sf: '',
                type: '1/2',
                autoFascia: true,
                fasciaSize: '2x6',
                manualEave: '',
                manualBarge: '',
                eaveOH: 2,
                bargeOH: 2,
                fascia: [],
                starter: [],
                lookouts: [],
                frmHours: newHours(),
                dmoHours: newHours()
            },
            hardware: {
                autoH25: true,
                autoA35: true,
                rows: [],
                frmHours: newHours(),
                dmoHours: newHours()
            },
            totals: {
                framingRate: 94.88,
                demoRate: 69.87,
                priceList: '',
                dumpsterPrice: 977,
                interiorDumpsters: '',
                contentsDumpsters: '',
                rooms: ['Entry', 'Living-dining', 'Kitchen', 'Family', 'Hall', 'Bath', 'Laundry', 'Bedroom', 'Garage',
                        'Landing', 'Bath 2', 'Bed front', 'Bed mid left', 'Bed mid right', 'Bed master', 'Bath master', 'Closet master']
                    .map(name => ({ name, interior: '', contents: '' }))
            },
            ceiling: {
                rows: [{ ...newJoist(), size: '2x6' }],
                beams: [],
                posts: [],
                ledgers: [],
                frmHours: newHours(),
                dmoHours: newHours()
            }
        });

        const n = (v) => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
        const hoursOf = (h) => n(h && h.crew) * n(h && h.days) * 8;
        const sp = (size) => /^\d+x\d+$/.test(size) ? size.replace('x', ' x ') : size.trim(); // '2x4' -> '2 x 4'; typed sizes stay as typed

        // Walls math -> { supplier: [text lines], xact: [[label, amount, unit]] }
        function calcWalls(w, waste) {
            const sw = 1 + n(waste.supplier) / 100;
            const xw = 1 + n(waste.xact) / 100;
            const plateLF = {}, studCount = {}, studLF = {}, xLF = {};
            const addTo = (obj, key, v) => { obj[key] = (obj[key] || 0) + v; };

            (w.rows || []).forEach(r => {
                const lf = n(r.lf);
                if (!lf) return;
                const h = HEIGHTS[r.height] || HEIGHTS['8'];
                // Plates: bottom (PT or regular) + top plates
                const top = n(r.topPlates) || 1;
                addTo(plateLF, r.size + (r.pt ? ' PT' : ''), lf);
                addTo(plateLF, r.size, lf * top);
                // Studs: LF x 0.8 + 1 + extras
                const count = lf * 0.8 + 1 + n(r.extraStuds);
                addTo(studCount, r.size + '|' + r.height, count);
                addTo(studLF, r.size, count * h.ft);
            });

            const supplier = [];
            Object.keys(plateLF).sort().forEach(k => {
                const pcs = Math.ceil((plateLF[k] / 16) * sw);
                const pt = k.endsWith(' PT');
                supplier.push(`${pcs} - ${sp(k.replace(' PT', ''))} x 16${pt ? ' pressure treated' : ''}   (plate)`);
                addTo(xLF, k.replace(' PT', ' pressure treated') + ' plate', plateLF[k]);
            });
            Object.keys(studCount).sort().forEach(k => {
                const [size, ht] = k.split('|');
                supplier.push(`${Math.ceil(studCount[k] * sw)} - ${sp(size)} x ${HEIGHTS[ht].precut}   (studs)`);
            });
            Object.keys(studLF).forEach(k => addTo(xLF, k + ' studs', studLF[k]));

            // Headers and posts: bought as listed, no supplier waste
            (w.headers || []).forEach(p => {
                if (!n(p.qty) || !n(p.length)) return;
                supplier.push(`${n(p.qty)} - ${sp(p.size)} x ${n(p.length)}   (header)`);
                addTo(xLF, p.size.trim() + ' header', n(p.qty) * n(p.length));
            });
            (w.posts || []).forEach(p => {
                if (!n(p.qty) || !n(p.length)) return;
                supplier.push(`${n(p.qty)} - ${sp(p.size)} x ${n(p.length)}   (post)`);
                addTo(xLF, p.size.trim() + ' post', n(p.qty) * n(p.length));
            });

            // Temp bracing: LF / 16 -> 2x4x16
            if (n(w.bracingLF)) {
                supplier.push(`${Math.ceil((n(w.bracingLF) / 16) * sw)} - 2 x 4 x 16   (temp bracing)`);
                addTo(xLF, '2x4 temp bracing', n(w.bracingLF));
            }

            const xact = Object.keys(xLF).sort().map(k => [k, Math.ceil(xLF[k] * xw), 'LF']);

            // Shear panel: SF / 32 -> 4x8 sheets
            if (n(w.shearSF)) {
                supplier.push(`${Math.ceil((n(w.shearSF) / 32) * sw)} - 4 x 8 x 1/2 OSB STR1   (shear panel)`);
                xact.push(['1/2" OSB shear panel', Math.ceil(n(w.shearSF) * xw), 'SF']);
            }
            return { supplier, xact };
        }

        // Floor joists math -> same shape as calcWalls
        function calcFloor(f, waste) {
            const sw = 1 + n(waste.supplier) / 100;
            const xw = 1 + n(waste.xact) / 100;
            const joists = {}, xLF = {}, rimLF = {}, blkLF = {};
            const addTo = (obj, key, v) => { obj[key] = (obj[key] || 0) + v; };

            (f.rows || []).forEach(r => {
                const span = n(r.span), run = n(r.run);
                if (!span || !run) return;
                // Count: run x spacing factor + 1 + extras
                const count = run * (SPACING[r.spacing] || 0.8) + 1 + n(r.extra);
                const buyLen = Math.ceil(span / 2) * 2; // next even length
                addTo(joists, r.size + '|' + buyLen, count);
                addTo(xLF, r.size + ' floor joists', count * span);
            });
            (f.rims || []).forEach(p => { if (n(p.lf)) { addTo(rimLF, p.size, n(p.lf)); addTo(xLF, p.size + ' rim', n(p.lf)); } });
            (f.blocking || []).forEach(p => { if (n(p.lf)) { addTo(blkLF, p.size, n(p.lf)); addTo(xLF, p.size + ' blocking', n(p.lf)); } });

            const supplier = [];
            Object.keys(joists).sort().forEach(k => {
                const [size, len] = k.split('|');
                supplier.push(`${Math.ceil(joists[k] * sw)} - ${sp(size)} x ${len}   (joists)`);
            });
            Object.keys(rimLF).sort().forEach(k => supplier.push(`${Math.ceil((rimLF[k] / 16) * sw)} - ${sp(k)} x 16   (rim)`));
            Object.keys(blkLF).sort().forEach(k => supplier.push(`${Math.ceil((blkLF[k] / 16) * sw)} - ${sp(k)} x 16   (blocking)`));
            (f.beams || []).forEach(p => {
                if (!n(p.qty) || !n(p.length)) return;
                supplier.push(`${n(p.qty)} - ${sp(p.size)} x ${n(p.length)}   (beam)`);
                addTo(xLF, p.size.trim() + ' beam', n(p.qty) * n(p.length));
            });

            const xact = Object.keys(xLF).sort().map(k => [k, Math.ceil(xLF[k] * xw), 'LF']);
            if (n(f.sheathSF)) {
                const t = SHEATH_TYPES[f.sheathType] || SHEATH_TYPES['3/4'];
                supplier.push(`${Math.ceil((n(f.sheathSF) / 32) * sw)} - ${t}   (floor sheathing)`);
                xact.push([t.replace('4 x 8 x ', '') + ' floor sheathing', Math.ceil(n(f.sheathSF) * xw), 'SF']);
            }
            return { supplier, xact };
        }

        // Ceiling joists math -> same shape as calcWalls
        function calcCeiling(c, waste) {
            const sw = 1 + n(waste.supplier) / 100;
            const xw = 1 + n(waste.xact) / 100;
            const joists = {}, xLF = {}, ledgerLF = {};
            const addTo = (obj, key, v) => { obj[key] = (obj[key] || 0) + v; };

            (c.rows || []).forEach(r => {
                const span = n(r.span), run = n(r.run);
                if (!span || !run) return;
                const count = run * (SPACING[r.spacing] || 0.8) + 1 + n(r.extra);
                const buyLen = Math.ceil(span / 2) * 2;
                addTo(joists, r.size + '|' + buyLen, count);
                addTo(xLF, r.size + ' ceiling joists', count * span);
            });
            (c.ledgers || []).forEach(p => { if (n(p.lf)) { addTo(ledgerLF, p.size, n(p.lf)); addTo(xLF, p.size + ' ledger', n(p.lf)); } });

            const supplier = [];
            Object.keys(joists).sort().forEach(k => {
                const [size, len] = k.split('|');
                supplier.push(`${Math.ceil(joists[k] * sw)} - ${sp(size)} x ${len}   (ceiling joists)`);
            });
            Object.keys(ledgerLF).sort().forEach(k => supplier.push(`${Math.ceil((ledgerLF[k] / 16) * sw)} - ${sp(k)} x 16   (ledger)`));
            [['beams', 'beam / purlin'], ['posts', 'post']].forEach(([key, label]) => {
                (c[key] || []).forEach(p => {
                    if (!n(p.qty) || !n(p.length)) return;
                    supplier.push(`${n(p.qty)} - ${sp(p.size)} x ${n(p.length)}   (${label})`);
                    addTo(xLF, p.size.trim() + ' ' + label, n(p.qty) * n(p.length));
                });
            });

            const xact = Object.keys(xLF).sort().map(k => [k, Math.ceil(xLF[k] * xw), 'LF']);
            return { supplier, xact };
        }

        // One roof row -> rafter length (even ft), counts
        function roofRow(r) {
            const run = n(r.run), pitch = n(r.pitch), length = n(r.length);
            if (!run || !length) return null;
            const sloped = Math.sqrt(run * run + Math.pow(run * pitch / 12, 2)); // no overhang
            const slope = sloped + n(r.overhang);
            const buyLen = Math.ceil(slope / 2) * 2; // next even foot
            const sides = n(r.sides) || 2;
            const rafters = sides * (length * (SPACING[r.spacing] || 0.55) + 1);
            const gables = r.gables === undefined ? 2 : n(r.gables);
            return {
                slope, buyLen, sides, rafters, collars: r.collar !== false ? rafters * 0.5 : 0,
                sheathSF: sloped * length * sides,   // overhang gets starter board instead
                eave: length * sides,
                barge: gables * sides * slope        // barge = rafter length with overhang
            };
        }

        // Conventional roof math -> same shape as calcWalls
        function calcRoof(rf, waste) {
            const sw = 1 + n(waste.supplier) / 100;
            const xw = 1 + n(waste.xact) / 100;
            const rafters = {}, xLF = {}, ridgeLF = {}, blkLF = {}, hipLF = {}, calLF = {};
            let collars = 0;
            const addTo = (obj, key, v) => { obj[key] = (obj[key] || 0) + v; };

            (rf.rows || []).forEach(r => {
                const c = roofRow(r);
                if (!c) return;
                addTo(rafters, r.size + '|' + c.buyLen, c.rafters);
                addTo(xLF, r.size + ' rafters', c.rafters * c.buyLen);
                // Ridge: length + 4 (gables only), doubled if checked
                if (c.sides === 2) {
                    const lf = (n(r.length) + 4) * (r.doubleRidge ? 2 : 1);
                    addTo(ridgeLF, r.ridgeSize, lf);
                    addTo(xLF, r.ridgeSize + ' ridge', lf);
                }
                // Blocking: length x sides at rafter size
                addTo(blkLF, r.size, n(r.length) * c.sides);
                addTo(xLF, r.size + ' blocking', n(r.length) * c.sides);
                collars += c.collars;
            });
            (rf.hips || []).forEach(p => { if (n(p.lf)) { addTo(hipLF, p.size, n(p.lf)); addTo(xLF, p.size + ' hip / valley', n(p.lf)); } });
            (rf.calFill || []).forEach(p => { if (n(p.lf)) { addTo(calLF, p.size, n(p.lf)); addTo(xLF, p.size + ' California fill', n(p.lf)); } });

            const supplier = [];
            Object.keys(rafters).sort().forEach(k => {
                const [size, len] = k.split('|');
                supplier.push(`${Math.ceil(rafters[k] * sw)} - ${sp(size)} x ${len}   (rafters)`);
            });
            const by16 = (obj, label) => Object.keys(obj).sort().forEach(k =>
                supplier.push(`${Math.ceil((obj[k] / 16) * sw)} - ${sp(k)} x 16   (${label})`));
            by16(ridgeLF, 'ridge');
            by16(blkLF, 'blocking');
            by16(hipLF, 'hip / valley');
            by16(calLF, 'California fill');
            // Collar ties: 50% of rafters, 2x4x8 each
            if (collars) {
                supplier.push(`${Math.ceil(collars * sw)} - 2 x 4 x 8   (collar ties)`);
                addTo(xLF, '2x4 collar ties', collars * 8);
            }
            (rf.purlins || []).forEach(p => {
                if (!n(p.qty) || !n(p.length)) return;
                supplier.push(`${n(p.qty)} - ${sp(p.size)} x ${n(p.length)}   (purlin / kicker)`);
                addTo(xLF, p.size.trim() + ' purlin / kicker', n(p.qty) * n(p.length));
            });

            const xact = Object.keys(xLF).sort().map(k => [k, Math.ceil(xLF[k] * xw), 'LF']);
            return { supplier, xact };
        }

        // One truss row -> total count, gable ends, LF per truss
        function trussRow(r) {
            const length = n(r.length), span = n(r.span);
            if (!length || !span) return null;
            const total = Math.ceil(length * 0.55 + 1); // 24" OC
            const gables = Math.min(n(r.gables), total);
            const each = span + 2 * n(r.overhang); // span plus tails both sides
            const half = span / 2;
            const sloped = Math.sqrt(half * half + Math.pow(half * n(r.pitch) / 12, 2)); // no tail
            return {
                total, gables, commons: total - gables, each,
                sheathSF: sloped * length * 2,
                eave: length * 2,
                barge: gables * 2 * (sloped + n(r.overhang))
            };
        }

        // Trusses: 10% waste on both lists (not the usual Xactimate %)
        function calcTrusses(t, waste) {
            const sw = 1 + n(waste.supplier) / 100;
            const xw = 1 + n(waste.xact) / 100;
            const supplier = [], xact = [], xLF = {}, brLF = {}, blkLF = {};
            const addTo = (obj, key, v) => { obj[key] = (obj[key] || 0) + v; };

            (t.rows || []).forEach(r => {
                const c = trussRow(r);
                if (!c) return;
                const desc = `${n(r.span)}' span ${n(r.pitch)}/12${n(r.overhang) ? `, ${n(r.overhang)}' tails` : ''}`;
                if (c.commons) supplier.push(`${Math.ceil(c.commons * 1.1)} - Common truss ${desc}`);
                if (c.gables) supplier.push(`${c.gables} - Gable end truss ${desc}`);
                xact.push([`Truss ${desc}`, Math.ceil((c.commons * 1.1 + c.gables) * c.each), 'LF']);
            });
            (t.bracing || []).forEach(p => { if (n(p.lf)) addTo(brLF, p.size, n(p.lf)); });
            (t.blocking || []).forEach(p => { if (n(p.lf)) addTo(blkLF, p.size, n(p.lf)); });
            Object.keys(brLF).sort().forEach(k => {
                supplier.push(`${Math.ceil((brLF[k] / 16) * sw)} - ${sp(k)} x 16   (truss bracing)`);
                xact.push([k + ' truss bracing', Math.ceil(brLF[k] * xw), 'LF']);
            });
            Object.keys(blkLF).sort().forEach(k => {
                supplier.push(`${Math.ceil((blkLF[k] / 16) * sw)} - ${sp(k)} x 16   (truss blocking)`);
                xact.push([k + ' truss blocking', Math.ceil(blkLF[k] * xw), 'LF']);
            });
            return { supplier, xact };
        }

        // Roof sheathing, fascia, starter, lookouts
        // Totals from both roof sections: sheathing SF and barge LF
        function roofTotals(est) {
            let sf = 0, barge = 0, eave = 0;
            const add = (c) => { if (c) { sf += c.sheathSF; barge += c.barge; eave += c.eave; } };
            (est.roof.rows || []).forEach(r => add(roofRow(r)));
            (est.trusses.rows || []).forEach(r => add(trussRow(r)));
            return { sf: Math.ceil(sf), barge: Math.ceil(barge), eave: Math.ceil(eave) };
        }

        // Starter board: (fascia LF x eave overhang + barge LF x barge overhang) / 7" coverage -> LF of 1x8 shiplap
        // Calculated (from roof areas) or typed in by hand
        function starterCalc(r, rt) {
            const auto = r.autoFascia !== false;
            const eave = auto ? rt.eave : n(r.manualEave);
            const barge = auto ? rt.barge : n(r.manualBarge);
            const sf = eave * n(r.eaveOH) + barge * n(r.bargeOH);
            return { auto, eave, barge, fasciaLF: eave + barge, sf, lf: sf / (7 / 12) };
        }

        function calcRoofSheath(r, waste, rt) {
            const sw = 1 + n(waste.supplier) / 100;
            const xw = 1 + n(waste.xact) / 100;
            const supplier = [], xact = [];
            if (n(r.sf)) {
                const t = ROOF_SHEATH[r.type] || ROOF_SHEATH['1/2'];
                supplier.push(`${Math.ceil((n(r.sf) / 32) * sw)} - ${t}   (roof sheathing)`);
                xact.push([t.replace('4 x 8 x ', '') + ' roof sheathing', Math.ceil(n(r.sf) * xw), 'SF']);
            }
            const st = starterCalc(r, rt);
            // Fascia: eaves + barge
            if (st.fasciaLF) {
                const fs = r.fasciaSize || '2x6';
                supplier.push(`${Math.ceil((st.fasciaLF / 16) * sw)} - ${sp(fs)} x 16   (fascia)`);
                xact.push([`${fs} fascia`, Math.ceil(st.fasciaLF * xw), 'LF']);
            }
            if (st.lf) {
                supplier.push(`${Math.ceil((st.lf / 16) * sw)} - 1 x 8 shiplap x 16   (starter board)`);
                xact.push(['1x8 shiplap starter board', Math.ceil(st.lf * xw), 'LF']);
            }
            (r.lookouts || []).forEach(p => {
                if (!n(p.qty) || !n(p.length)) return;
                supplier.push(`${n(p.qty)} - ${sp(p.size)} x ${n(p.length)}   (lookouts)`);
                xact.push([`${p.size.trim()} lookouts`, Math.ceil(n(p.qty) * n(p.length) * xw), 'LF']);
            });
            return { supplier, xact };
        }

        // Rafter + truss count (before waste) for automatic hurricane ties
        function tieCount(est) {
            let c = 0;
            (est.roof.rows || []).forEach(r => { const x = roofRow(r); if (x) c += x.rafters; });
            (est.trusses.rows || []).forEach(r => { const x = trussRow(r); if (x) c += x.total; });
            return Math.ceil(c);
        }

        // Hardware: 5% supplier waste, job Xactimate % on the Xactimate side
        function calcHardware(h, waste, ties) {
            const sw = 1 + HW_SUPPLIER_WASTE / 100;
            const xw = 1 + n(waste.xact) / 100;
            const supplier = [], xact = [];
            const push = (item, qty, unit) => {
                supplier.push(`${Math.ceil(qty * sw)} - ${item}${unit && unit !== 'EA' ? ` (${unit})` : ''}`);
                xact.push([item, Math.ceil(qty * xw), unit || 'EA']);
            };
            if (h.autoH25 !== false && ties) push('Simpson H2.5A', ties, 'EA');
            if (h.autoA35 !== false && ties) push('Simpson A35', Math.ceil(ties * 0.5), 'EA'); // half the hurricane ties
            (h.rows || []).forEach(r => { if (r.item.trim() && n(r.qty)) push(r.item.trim(), n(r.qty), r.unit); });
            return { supplier, xact };
        }

        const money = (v) => '$' + (Math.round(v * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // Interior / contents demo block: hours x rate, wholesale 75%, dumpsters at 60% wholesale
        function demoBlock(hours, rate, dumpsters, dumpsterPrice) {
            const retailLabor = hours * rate;
            const wholesaleLabor = retailLabor * 0.75;
            const dumpRetail = dumpsters * dumpsterPrice;
            const dumpWholesale = dumpRetail * 0.6;
            return { hours, retailLabor, wholesaleLabor, dumpRetail, dumpWholesale,
                     retail: retailLabor + dumpRetail, wholesale: wholesaleLabor + dumpWholesale };
        }

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, false = no access, object = ok
            const [authError, setAuthError] = useState('');
            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [record, setRecord] = useState(null); // saved frmEst/{jobId}
            const [est, setEst] = useState(null);       // what's on screen
            const [dirty, setDirty] = useState(false);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [savedItems, setSavedItems] = useState([]); // company-wide hardware items [{ id, name }]
            const [showManage, setShowManage] = useState(false);

            // Sign-in and role check (this page never creates user records)
            useEffect(() => {
                return auth.onAuthStateChanged(async u => {
                    setUser(u);
                    setProfile(null);
                    if (!u) return;
                    try {
                        const snap = await db.collection('users').doc(u.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: u.uid, ...d });
                        else setProfile(false);
                    } catch (e) {
                        setProfile(false);
                    }
                });
            }, []);

            // Job list
            useEffect(() => {
                if (!profile) return;
                return db.collection('jobs').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));
                    setJobs(list);
                }, e => setMessage('Error loading jobs: ' + e.message));
            }, [profile]);

            // Company-wide hardware item list
            useEffect(() => {
                if (!profile) return;
                return db.collection('hardwareItems').onSnapshot(snap => {
                    const list = [];
                    snap.forEach(doc => { if (doc.data().name) list.push({ id: doc.id, name: doc.data().name }); });
                    list.sort((a, b) => a.name.localeCompare(b.name));
                    setSavedItems(list);
                }, e => console.error('Hardware list error:', e));
            }, [profile]);

            // Load the saved estimate once when a job is picked
            useEffect(() => {
                setRecord(null);
                setEst(null);
                setDirty(false);
                if (!profile || !jobId) return;
                db.collection('frmEst').doc(jobId).get().then(doc => {
                    const d = doc.exists ? doc.data() : {};
                    const base = blankEstimate();
                    setRecord(doc.exists ? d : false);
                    setEst({
                        waste: { ...base.waste, ...(d.waste || {}) },
                        walls: { ...base.walls, ...(d.walls || {}) },
                        floor: { ...base.floor, ...(d.floor || {}) },
                        ceiling: { ...base.ceiling, ...(d.ceiling || {}) },
                        roof: { ...base.roof, ...(d.roof || {}) },
                        trusses: { ...base.trusses, ...(d.trusses || {}) },
                        roofSheath: { ...base.roofSheath, ...(d.roofSheath || {}) },
                        hardware: { ...base.hardware, ...(d.hardware || {}) },
                        totals: { ...base.totals, ...(d.totals || {}) }
                    });
                }).catch(e => setMessage('Error loading estimate: ' + e.message));
            }, [profile, jobId]);

            const change = (fn) => { setEst(prev => fn(prev)); setDirty(true); setMessage(''); };
            const setWalls = (k, v) => change(p => ({ ...p, walls: { ...p.walls, [k]: v } }));
            const setFloor = (k, v) => change(p => ({ ...p, floor: { ...p.floor, [k]: v } }));
            const setFloorRow = (i, k, v) => setFloor('rows', est.floor.rows.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const setCeil = (k, v) => change(p => ({ ...p, ceiling: { ...p.ceiling, [k]: v } }));
            const setCeilRow = (i, k, v) => setCeil('rows', est.ceiling.rows.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const setRoof = (k, v) => change(p => ({ ...p, roof: { ...p.roof, [k]: v } }));
            const setRoofRow = (i, k, v) => setRoof('rows', est.roof.rows.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const setTruss = (k, v) => change(p => ({ ...p, trusses: { ...p.trusses, [k]: v } }));
            const setTrussRow = (i, k, v) => setTruss('rows', est.trusses.rows.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const setRS = (k, v) => change(p => ({ ...p, roofSheath: { ...p.roofSheath, [k]: v } }));
            const deleteSavedItem = async (it) => {
                if (!window.confirm(`Delete "${it.name}" from the saved hardware list? Jobs that already use it keep it.`)) return;
                try { await db.collection('hardwareItems').doc(it.id).delete(); }
                catch (e) { setMessage('Error deleting item: ' + e.message); }
            };
            const setTot = (k, v) => change(p => ({ ...p, totals: { ...p.totals, [k]: v } }));
            const setRoom = (i, k, v) => setTot('rooms', est.totals.rooms.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const copyText = (text, label) => navigator.clipboard.writeText(text).then(
                () => setMessage(label + ' copied'), () => setMessage('Error: copy failed'));
            const setHW = (k, v) => change(p => ({ ...p, hardware: { ...p.hardware, [k]: v } }));
            const setHWRow = (i, k, v) => setHW('rows', est.hardware.rows.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const setWallRow = (i, k, v) => setWalls('rows', est.walls.rows.map((r, j) => j === i ? { ...r, [k]: v } : r));

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    setAuthError(e.message);
                }
            };

            const save = async () => {
                const job = jobs.find(j => j.id === jobId);
                if (!job || !est) return;
                setSaving(true);
                setMessage('');
                try {
                    const data = {
                        jobCode: job.code || '',
                        waste: est.waste,
                        walls: est.walls,
                        floor: est.floor,
                        ceiling: est.ceiling,
                        roof: est.roof,
                        trusses: est.trusses,
                        roofSheath: est.roofSheath,
                        hardware: est.hardware,
                        totals: est.totals,
                        updatedBy: { uid: user.uid, name: profile.name || user.email },
                        updatedAt: new Date()
                    };
                    await db.collection('frmEst').doc(jobId).set(data, { merge: true });
                    // Add any new hardware item names to the company list (no duplicates, any case)
                    const known = new Set([...HARDWARE, ...savedItems.map(x => x.name)].map(x => x.trim().toLowerCase()));
                    for (const r of (est.hardware.rows || [])) {
                        const name = (r.item || '').trim();
                        if (!name || known.has(name.toLowerCase())) continue;
                        known.add(name.toLowerCase());
                        const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                        try { await db.collection('hardwareItems').doc(id).set({ name, addedBy: profile.name || user.email, addedAt: new Date() }); }
                        catch (e) { console.error('Hardware item not saved:', e.message); }
                    }
                    setRecord({ ...(record || {}), ...data, updatedAt: { toDate: () => data.updatedAt } });
                    setDirty(false);
                    setMessage('Saved');
                } catch (e) {
                    setMessage('Error saving: ' + e.message);
                }
                setSaving(false);
            };

            if (!user) {
                return (
                    <div className="section">
                        <button className="btn-primary" onClick={login}>Sign in with Microsoft</button>
                        {authError && <div className="msg" style={{ color: '#d32f2f' }}>{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === false) {
                return (
                    <div className="section">
                        <p>Signed in as {user.email}. No access: FRM-EST is for Owner, Admin and Estimator.</p>
                        <button className="btn-secondary" style={{ marginTop: '12px' }} onClick={() => auth.signOut()}>Logout</button>
                    </div>
                );
            }

            const visibleJobs = jobs.filter(j => showArchived || j.archived !== true);
            const savedText = record && record.updatedAt && record.updatedAt.toDate
                ? `Last saved by ${record.updatedBy ? record.updatedBy.name : ''} on ${record.updatedAt.toDate().toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' })}`
                : 'Not saved yet';

            const w = est && est.walls;
            const out = est ? calcWalls(w, est.waste) : null;
            const f = est && est.floor;
            const floorOut = est ? calcFloor(f, est.waste) : null;
            const c = est && est.ceiling;
            const ceilOut = est ? calcCeiling(c, est.waste) : null;
            const rf = est && est.roof;
            const roofOut = est ? calcRoof(rf, est.waste) : null;
            const tr = est && est.trusses;
            const trussOut = est ? calcTrusses(tr, est.waste) : null;
            const rs = est && est.roofSheath;
            const rt = est ? roofTotals(est) : null;
            const rsOut = est ? calcRoofSheath(rs, est.waste, rt) : null;

                                    <label>Eave LF</label>
                                    <input className="num" type="number" value={rs.manualEave} onChange={e => setRS('manualEave', e.target.value)} />
                                    <label style={{ marginLeft: '16px' }}>Barge LF</label>
                                    <input className="num" type="number" value={rs.manualBarge} onChange={e => setRS('manualBarge', e.target.value)} />
                                </div>
                            )}
                            <div className="inline">
                                <label>Fascia</label>
                                <select style={{ width: 'auto' }} value={rs.fasciaSize || '2x6'} onChange={e => setRS('fasciaSize', e.target.value)}>
                                    {['2x6', '2x8', '2x10', '2x12'].map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <label style={{ marginLeft: '16px' }}>Eave overhang</label>
                                <select style={{ width: 'auto' }} value={rs.eaveOH} onChange={e => setRS('eaveOH', parseInt(e.target.value))}>
                                    <option value={0}>None</option><option value={1}>1'</option><option value={2}>2'</option><option value={3}>3'</option>
                                </select>
                                <label style={{ marginLeft: '16px' }}>Barge overhang</label>
                                <select style={{ width: 'auto' }} value={rs.bargeOH} onChange={e => setRS('bargeOH', parseInt(e.target.value))}>
                                    <option value={0}>None</option><option value={1}>1'</option><option value={2}>2'</option><option value={3}>3'</option>
                                </select>
                            </div>
                            <div className="muted">Fascia: eave {st.eave} LF + barge {st.barge} LF = {st.fasciaLF} LF</div>
                            <div className="muted">Starter: eave {st.eave} LF × {n(rs.eaveOH)}' + barge {st.barge} LF × {n(rs.bargeOH)}' = {Math.ceil(st.sf)} SF → {Math.ceil(st.lf)} LF of 1x8 shiplap</div>
                            <PieceTable title="Lookouts" sizes={['2x4', '2x6']} list={rs.lookouts} onChange={v => setRS('lookouts', v)} />

                            <div className="sub-title">Hours</div>
                            <table><tbody>
                                <HoursRow label="Sheathing / fascia framing" value={rs.frmHours} onChange={v => setRS('frmHours', v)} />
                                <HoursRow label="Sheathing / fascia demo" value={rs.dmoHours} onChange={v => setRS('dmoHours', v)} />
                            </tbody></table>

                            <Output out={rsOut} waste={est.waste} />
                        </div>

                        <div className="section">
                            <div className="section-title">HARDWARE</div>
                            <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontWeight: 'normal', marginBottom: '8px' }}>
                                <input type="checkbox" style={{ width: 'auto' }} checked={hw.autoH25 !== false} onChange={e => setHW('autoH25', e.target.checked)} />
                                Simpson H2.5A hurricane ties: 1 per rafter and truss ({ties})
                            </label>
                            <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontWeight: 'normal', marginBottom: '8px' }}>
                                <input type="checkbox" style={{ width: 'auto' }} checked={hw.autoA35 !== false} onChange={e => setHW('autoA35', e.target.checked)} />
                                Simpson A35: half the hurricane ties ({Math.ceil(ties * 0.5)})
                            </label>
                            {hw.rows.length > 0 && (
                                <table>
                                    <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th></th></tr></thead>
                                    <tbody>
                                        {hw.rows.map((r, i) => (
                                            <tr key={i}>
                                                <td><input list="hw-items" value={r.item} onChange={e => setHWRow(i, 'item', e.target.value)} placeholder="pick or type" /></td>
                                                <td><input className="num" type="number" value={r.qty} onChange={e => setHWRow(i, 'qty', e.target.value)} /></td>
                                                <td><select style={{ width: 'auto' }} value={r.unit} onChange={e => setHWRow(i, 'unit', e.target.value)}>
                                                    {HW_UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                                                </select></td>
                                                <td><button className="btn-x" onClick={() => setHW('rows', hw.rows.filter((_, j) => j !== i))}>✕</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                            <datalist id="hw-items">{[...new Set([...HARDWARE, ...savedItems.map(x => x.name)])].sort().map(h => <option key={h} value={h} />)}</datalist>
                            <button className="btn-secondary btn-sm" style={{ marginTop: '6px' }} onClick={() => setHW('rows', [...hw.rows, newHW()])}>+ Add hardware</button>
                            {['owner', 'admin'].includes(profile.role) && (
                                <button className="btn-secondary btn-sm" style={{ marginTop: '6px', marginLeft: '8px' }} onClick={() => setShowManage(!showManage)}>
                                    {showManage ? 'Hide saved items' : 'Manage saved items'}
                                </button>
                            )}
                            {showManage && (
                                <div style={{ marginTop: '8px', border: '1px solid #eee', borderRadius: '4px', padding: '8px' }}>
                                    {savedItems.length === 0 ? <div className="muted" style={{ marginTop: 0 }}>No saved items yet</div>
                                        : savedItems.map(it => (
                                            <div key={it.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '4px 0', borderBottom: '1px solid #f3f3f3', fontSize: '13px' }}>
                                                <span>{it.name}</span>
                                                <button className="btn-x" onClick={() => deleteSavedItem(it)}>Delete</button>
                                            </div>
                                        ))}
                                    <div className="muted">Built-in items (Simpson list, gun nails, teco nails) are in the code and don't show here.</div>
                                </div>
                            )}

                            <div className="sub-title">Hours</div>
                            <table><tbody>
                                <HoursRow label="Hardware install" value={hw.frmHours} onChange={v => setHW('frmHours', v)} />
                                <HoursRow label="Hardware demo" value={hw.dmoHours} onChange={v => setHW('dmoHours', v)} />
                            </tbody></table>

                            <Output out={hwOut} waste={{ supplier: HW_SUPPLIER_WASTE, xact: est.waste.xact }} />
                        </div>

                        <div className="section">
                            <div className="section-title">JOB TOTALS</div>
                            <div className="inline">
                                <label>Framing rate $/hr</label>
                                <input className="num" type="number" value={est.totals.framingRate} onChange={e => setTot('framingRate', e.target.value)} />
                                <label style={{ marginLeft: '16px' }}>Demo rate $/hr</label>
                                <input className="num" type="number" value={est.totals.demoRate} onChange={e => setTot('demoRate', e.target.value)} />
                                <label style={{ marginLeft: '16px' }}>Price list</label>
                                <input style={{ width: '160px' }} value={est.totals.priceList} onChange={e => setTot('priceList', e.target.value)} placeholder="e.g. CALA8X_OCT26" />
                            </div>

                            <div className="sub-title">Supplier list (grouped by section)</div>
                            <pre style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', fontSize: '13px', whiteSpace: 'pre-wrap', fontFamily: 'inherit' }}>{T.supplierText}</pre>
                            <button className="btn-secondary btn-sm" onClick={() => copyText(T.supplierText, 'Supplier list')}>Copy supplier list</button>

                            <div className="sub-title">Xactimate list (grouped by section)</div>
                            <pre style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', fontSize: '13px', whiteSpace: 'pre-wrap', fontFamily: 'inherit' }}>{T.xactText}</pre>
                            <button className="btn-secondary btn-sm" onClick={() => copyText(T.xactText, 'Xactimate list')}>Copy Xactimate list</button>

                            <div className="sub-title">Framing and demo hours</div>
                            <HoursTable T={T} />

                            <div className="sub-title">Interior demo and contents demo (hours per room)</div>
                            <table>
                                <thead><tr><th>Room</th><th>Interior demo hrs</th><th>Contents demo hrs</th><th></th></tr></thead>
                                <tbody>
                                    {est.totals.rooms.map((r, i) => (
                                        <tr key={i}>
                                            <td><input value={r.name} onChange={e => setRoom(i, 'name', e.target.value)} /></td>
                                            <td><input className="num" type="number" value={r.interior} onChange={e => setRoom(i, 'interior', e.target.value)} /></td>
                                            <td><input className="num" type="number" value={r.contents} onChange={e => setRoom(i, 'contents', e.target.value)} /></td>
                                            <td><button className="btn-x" onClick={() => setTot('rooms', est.totals.rooms.filter((_, j) => j !== i))}>✕</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <button className="btn-secondary btn-sm" style={{ marginTop: '6px' }} onClick={() => setTot('rooms', [...est.totals.rooms, { name: '', interior: '', contents: '' }])}>+ Add room</button>

                            <div className="inline" style={{ marginTop: '12px' }}>
                                <label>Interior dumpsters</label>
                                <input className="num" type="number" value={est.totals.interiorDumpsters} onChange={e => setTot('interiorDumpsters', e.target.value)} />
                                <label style={{ marginLeft: '16px' }}>Contents dumpsters</label>
                                <input className="num" type="number" value={est.totals.contentsDumpsters} onChange={e => setTot('contentsDumpsters', e.target.value)} />
                                <label style={{ marginLeft: '16px' }}>Dumpster price</label>
                                <input className="num" type="number" value={est.totals.dumpsterPrice} onChange={e => setTot('dumpsterPrice', e.target.value)} />
                            </div>
                            <DemoTable T={T} />

                            <button className="btn-secondary" style={{ marginTop: '16px' }} onClick={() => window.print()}>Print</button>
                        </div>
                        {ReactDOM.createPortal(<PrintView T={T} est={est} />, document.getElementById('print-root'))}

                        <button className="btn-primary" onClick={save} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
                        {message && <div className="msg" style={{ color: message.includes('Error') ? '#d32f2f' : '#388e3c' }}>{message}</div>}
                    </>)}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
