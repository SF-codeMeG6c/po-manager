                "    IniWrite xexe, INI, \"Spots\", \"exe\"",
                "    MsgBox \"Set-up saved. Close the Notes window and press Cancel in Quick Entry.`n`nIf you move or resize the Xactimate window, run set-up (F8) again.\", \"Xactimate Entry\", MSG_TOP",
                "    ShowNext()",
                "}",
                "",
                "LoadSettings() {",
                "    global spots, xexe, idx",
                "    xexe := IniRead(INI, \"Spots\", \"exe\", \"\")",
                "    for name in SPOT_NAMES {",
                "        v := IniRead(INI, \"Spots\", name, \"\")",
                "        if v != \"\" {",
                "            p := StrSplit(v, \",\")",
                "            spots[name] := [Integer(p[1]), Integer(p[2])]",
                "        }",
                "    }",
                "    idx := Integer(IniRead(INI, \"Progress\", PROGRESS_KEY, 1))",
                "    if idx < 1 || idx > ROWS.Length + 1",
                "        idx := 1",
                "}",
                "",
                "SaveProgress() => IniWrite(idx, INI, \"Progress\", PROGRESS_KEY)",
                "",
                "PickRow() {",
                "    global idx",
                "    r := InputBox(\"Start from which Excel row number? (\" ROWS[1][1] \" to \" ROWS[ROWS.Length][1] \")\", \"Xactimate Entry\")",
                "    if r.Result != \"OK\"",
                "        return",
                "    for i, row in ROWS",
                "        if IsInteger(r.Value) && row[1] = Integer(r.Value) {",
                "            idx := i",
                "            SaveProgress()",
                "            ShowNext()",
                "            return",
                "        }",
                "    MsgBox \"Row \" r.Value \" isn't in this script.\", \"Xactimate Entry\", MSG_TOP",
                "}",
                "",
                "; ---------------- entering ----------------",
                "RunRoom() {",
                "    global idx, running, stopFlag, mainWin",
                "    if setupStep {",
                "        MsgBox \"Finish set-up first (or press Esc to cancel it).\", \"Xactimate Entry\", MSG_TOP",
                "        return",
                "    }",
                "    if spots.Count < SPOT_NAMES.Length {",
                "        MsgBox \"Run set-up first (F8).\", \"Xactimate Entry\", MSG_TOP",
                "        return",
                "    }",
                "    if idx > ROWS.Length {",
                "        MsgBox \"All rows in this script are done.\", \"Xactimate Entry\", MSG_TOP",
                "        return",
                "    }",
                "    mainWin := WinActive(\"ahk_exe \" xexe)",
                "    if !mainWin {",
                "        MsgBox \"Click the room in Xactimate first, then press F9.\", \"Xactimate Entry\", MSG_TOP",
                "        return",
                "    }",
                "    room := ROWS[idx][2]",
                "    running := true, stopFlag := false",
                "    while idx <= ROWS.Length && ROWS[idx][2] = room {",
                "        r := ROWS[idx]",
                "        Tip(\"Entering Excel row \" r[1] \" (\" room \"): \" r[4] \" \" r[5] \"     Esc = stop\")",
                "        res := EnterRow(r)",
                "        if res = \"ok\" {",
                "            idx += 1",
                "            SaveProgress()",
                "            continue",
                "        }",
                "        running := false",
                "        LogStop(r, res)",
                "        SoundBeep 400, 400",
                "        if res = \"hand\" || res = \"nocode\" {",
                "            idx += 1",
                "            SaveProgress()",
                "            if res = \"nocode\"",
                "                MsgBox \"Excel row \" r[1] (r[4] = \"\" ? \" has no CAT code:`n`n\" : \" has no SEL code (Cat \" r[4] \" typed):`n`n\") r[12] \"`nqty \" r[8] \"  price \" r[9] (r[3] ? \"  (Credit)\" : \"\") (r[13] != \"\" ? \"`nCode choices: \" r[13] : \"\") (r[14] r[11] r[15] != \"\" ? \"`nNote: \" Trim(r[14] \" \" r[11] r[15]) : \"\") \"`n`nThe description was typed in the Search box and Search pressed. Pick the item, enter the qty and price\" (r[3] ? \", click Credit Item\" : \"\") \", click OK. Then press F9 to carry on with this room.\", \"Xactimate Entry - enter by hand\", MSG_TOP",
                "            else",
                "                MsgBox \"Excel row \" r[1] \" is a remove-and-replace (&) line:`n`n\" r[4] \" \" r[5] \"  qty \" r[8] \"  price \" r[9] (r[3] ? \"  (Credit)\" : \"\") (r[14] r[11] r[15] != \"\" ? \"`nNote: \" Trim(r[14] \" \" r[11] r[15]) : \"\") \"`n`nIt has two price boxes, so enter it by hand. Then press F9 to carry on with this room.\", \"Xactimate Entry - enter by hand\", MSG_TOP",
                "            ShowNext()",
                "            return",
                "        }",
                "        if res = \"popup-after-ok\" {",
                "            idx += 1",
                "            SaveProgress()",
                "            MsgBox \"A pop-up opened after OK on Excel row \" r[1] \".`n`nAnswer the pop-up, check that line, then press F9 to carry on.\", \"Xactimate Entry - stopped\", MSG_TOP",
                "        } else {",
                "            why := res = \"stopped\" ? \"You pressed Esc\" : \"A pop-up opened, or Xactimate wasn't in front,\"",
                "            MsgBox why \" during Excel row \" r[1] \".`n`nIn Quick Entry press Cancel (if the line is half filled in), then press F9 to redo row \" r[1] \".\", \"Xactimate Entry - stopped\", MSG_TOP",
                "        }",
                "        ShowNext()",
                "        return",
                "    }",
                "    running := false",
                "    SoundBeep 1000, 150",
                "    ShowNext()",
                "}",
                "",
                "EnterRow(r) {",
                "    ; r: [xlRow, room, credit, cat, sel, act, desc, qty, price, exempt, note, search text, code choices, our note, bold, heading]",
                "    global headDone",
                "    if r[16] != \"\" && headDone != r[1] {",
                "        try AddHeading(r[16])",
                "        catch as e",
                "            return e.Message = \"stopped\" ? \"stopped\" : \"popup\"",
                "        headDone := r[1]",
                "    }",
                                "    if r[4] = \"\" || (r[4] != \"USR\" && r[5] = \"\") {   ; no code (or Cat only): type Cat if known, search the description, stop for hand entry",
                "        if r[12] != \"\" {",
                "            try {",
                "                if r[4] != \"\"",
                "                    Fill(\"Cat\", r[4]), W(700)",
                "                Fill(\"Search\", r[12]), W(200)",
                "                Key(\"{Enter}\"), W(300)",
                "            }",
                "        }",
                "        return \"nocode\"",
                "    }",
                "    try {",
                "        Fill(\"Cat\", r[4]), W(700)                 ; Cat jumps to Sel on its own",
                "        if r[4] != \"USR\" {",
                "            Fill(\"Sel\", r[5]), Key(\"{Tab}\"), W(900)   ; item loads",
                "        }",
                "        if r[6] != \"\" {",
                "            ClickSpot(\"Act\"), W(400)",
                "            Key(\"{Text}\" r[6]), W(250)",
                "            Key(\"{Enter}\"), W(500)",
                "        }",
                "        if r[7] != \"\"",
                "            Fill(\"Desc\", r[7]), W(200)",
                "        Fill(\"Calc\", r[8], true), Key(\"{Tab}\"), W(300)",
                "        Fill(\"Price\", r[9], true), Key(\"{Tab}\"), W(400)",
                "        if r[6] = \"&\"                              ; R&R: whole price in Replace Price, 0 in Remove Price",
                "            Fill(\"RemovePrice\", \"0\", true), Key(\"{Tab}\"), W(400)",
                "        if r[3]",
                "            ClickSpot(\"CreditItem\"), W(400)",
                "        if r[10]",
                "            ClickSpot(\"Exempt\"), W(300)",
                "        if r[11] != \"\" || r[14] != \"\" || r[15] != \"\"",
                "            AddNote(r)",
                "        ClickSpot(\"OK\")",
                "    } catch as e {",
                "        return e.Message = \"stopped\" ? \"stopped\" : \"popup\"",
                "    }",
                "    W(1000)",
                "    if !WinActive(\"ahk_id \" mainWin)",
                "        return \"popup-after-ok\"",
                "    return \"ok\"",
                "}",
                "",
                "; Attachments opens the Notes window; the cursor starts in the lower box; Close saves the note to this line",
                "; Heading: Attachments on a blank Quick Entry, pick Line Break in the Note drop-down, click the note box, type the heading, Close, then Cancel in Quick Entry. Bold them by hand at the end.",
                "AddHeading(t) {",
                "    ClickSpot(\"Attach\")",
                "    if !WinWaitActive(\"Notes ahk_exe \" xexe, , 5 * SPEED)",
                "        throw Error(\"popup\")",
                "    W(500)",
                "    if stopFlag",
                "        throw Error(\"stopped\")",
                "    for name in [\"NoteType\", \"LineBreak\", \"NoteText\"] {   ; spots are inside the Notes window",
                "        p := spots[name]",
                "        Click p[1], p[2]",
                "        W(400)",
                "    }",
                "    if stopFlag",
                "        throw Error(\"stopped\")",
                "    Send \"{Text}\" t",
                "    W(300)",
                "    p := spots[\"NotesClose\"]",
                "    Click p[1], p[2]",
                "    if !WinWaitActive(\"ahk_id \" mainWin, , 5 * SPEED)",
                "        throw Error(\"popup\")",
                "    W(500)",
                "    ClickSpot(\"Cancel\")                     ; the Line Break stays selected; Cancel gives a blank Quick Entry below it",
                "    W(600)",
                "}",
                "",
                "; r[14] = our original note (first line), r[11] = note, r[15] = typed in bold after clicking the Bold button",
                "AddNote(r) {",
                "    ClickSpot(\"Attach\")",
                "    if !WinWaitActive(\"Notes ahk_exe \" xexe, , 5 * SPEED)",
                "        throw Error(\"popup\")",
                "    W(500)",
                "    if stopFlag",
                "        throw Error(\"stopped\")",
                "    if r[14] != \"\" {",
                "        Send \"{Text}\" r[14]",
                "        if r[11] != \"\" || r[15] != \"\"",
                "            Send \"{Enter}\"",
                "    }",
                "    if r[11] != \"\"",
                "        Send \"{Text}\" r[11]",
                "    if r[15] != \"\" {",
                "        W(300)",
                "        b := spots[\"Bold\"]                ; spot is inside the Notes window",
                "        Click b[1], b[2]",
                "        W(300)",
                "        Send \"{Text}\" r[15]",
                "    }",
                "    W(300)",
                "    p := spots[\"NotesClose\"]               ; spot is inside the Notes window",
                "    Click p[1], p[2]",
                "    if !WinWaitActive(\"ahk_id \" mainWin, , 5 * SPEED)",
                "        throw Error(\"popup\")",
                "    W(400)",
                "}",
                "",
                "Fill(name, text, asKeys := false) {",
                "    ClickSpot(name), W(150)",
                "    Key(\"^a\")",
                "    Key(asKeys ? text : \"{Text}\" text)   ; numbers go as real key presses so \".\" is kept",
                "}",
                "",
                "ClickSpot(name) {",
                "    Check()",
                "    p := spots[name]",
                "    Click p[1], p[2]",
                "}",
                "",
                "Key(k) {",
                "    Check()",
                "    Send k",
                "}",
                "",
                "Check() {",
                "    if stopFlag",
                "        throw Error(\"stopped\")",
                "    if !WinActive(\"ahk_id \" mainWin)",
                "        throw Error(\"popup\")",
                "}",
                "",
                "W(ms) => Sleep(Round(ms * SPEED))",
                "",
                "SetStop() {",
                "    global stopFlag, setupStep",
                "    if setupStep {",
                "        setupStep := 0",
                "        Tip(\"Set-up cancelled. Nothing was changed.\")",
                "        return",
                "    }",
                "    stopFlag := true",
                "}",
                "",
                "; ---------------- stop log ----------------",
                "LogStop(r, res) {",
                "    try {",
                "        why := \"Pop-up, or Xactimate not in front\"",
                "        if res = \"hand\"",
                "            why := \"& line - entered by hand\"",
                "        else if res = \"nocode\"",
                "            why := \"No CAT code - entered by hand\"",
                "        else if res = \"popup-after-ok\"",
                "            why := \"Pop-up after OK\"",
                "        else if res = \"stopped\"",
                "            why := \"Esc pressed\"",
                "        front := \"\"",
                "        try front := WinGetTitle(\"A\") \" (\" WinGetProcessName(\"A\") \")\"",
                "        FileAppend FormatTime(, \"yyyy-MM-dd HH:mm:ss\") \"`t\" SCRIPT_TITLE \"`tExcel row \" r[1] \"`t\" r[2] \"`t\" Trim(r[4] \" \" r[5] \" \" r[6]) \"`t\" why \"`tIn front: \" front \"`r`n\", STOP_LOG, \"UTF-8\"",
                "    }",
                "}",
                "",
                "; ---------------- status ----------------",
                "ShowNext() {",
                "    if spots.Count < SPOT_NAMES.Length {",
                "        Tip(\"Xactimate Entry: press F8 to set up first.\")",
                "        return",
                "    }",
                "    if idx > ROWS.Length {",
                "        Tip(\"Xactimate Entry: all \" ROWS.Length \" rows done. Check the totals in Xactimate. Headings: Ctrl+click them, right-click, Line Edit Options > Bold.\")",
                "        return",
                "    }",
                "    r := ROWS[idx], n := 0",
                "    for row in ROWS",
                "        if row[2] = r[2] && A_Index >= idx",
                "            n++",
                "    Tip(\"Next room: \" r[2] \" (\" n \" lines, from Excel row \" r[1] \"). Click the room in Xactimate, then press F9.\")",
                "}",
                "",
                "Tip(t) => ToolTip(t, 10, A_ScreenHeight - 90)"
            ];
            const xactScript = (entry, title, key) => {
                const esc = (s) => String(s == null ? '' : s).replace(/[\r\n\t]+/g, ' ').replace(/`/g, '``').replace(/'/g, "`'");
                const lines = entry.map((r, i) => {
                    // Nov 20 evening: heading before the first row of a heading group in a room, entered as a Line Break note, then Cancel in Quick Entry
                    // (a plain note heading left its line selected: next rows were lost and later lines went in above the headings).
                    const hd = r.head && (i === 0 || entry[i - 1].room !== r.room || entry[i - 1].head !== r.head) ? r.head : '';
                    const sel = r.sel || '';
                    const act = /^BID/i.test(sel) ? '' : (r.act || '');           // bid items have no Act
                    const exempt = r.cat === 'USR' && r.desc === 'Minor price differences' ? 1 : 0;
                    const q = Number(r.qty).toFixed(2).replace(/\.?0+$/, '');
                    const p = Math.abs(Number(r.price)).toFixed(2);                  // typed positive; Credit Item makes it negative
                    return '    [' + (i + 2) + ", '" + esc(r.room) + "', " + (r.entry === 'Credit' ? 1 : 0) + ", '" + esc(r.cat) + "', '" + esc(sel) + "', '" + esc(act) +
                        "', '" + esc(r.cat === 'USR' ? r.desc : '') + "', '" + q + "', '" + p + "', " + exempt + ", '" + esc(r.xnote || '') +
                        "', '" + esc(!r.cat || (r.cat !== 'USR' && !r.sel) ? r.desc : '') + "', '" + esc(r.choices || '') +
                        "', '" + esc(r.ourNo && r.note && /[a-z]/.test(r.note) ? r.note : '') + "', '" + esc(r.xbold || '') + "', '" + esc(hd) + "']";   // Nov 20: our note, bold tail, heading
                });
                const t = String(title).replace(/["`\r\n]/g, '');
                return XACT_TEMPLATE.join('\r\n').split('%%ROWS%%').join(lines.join(',\r\n')).split('%%TITLE%%').join(t).split('%%KEY%%').join(key) + '\r\n';
            };

            return { pageRows, parseEstimate, diffVersions, entryRows, suggestRoom, versionWorkbook, xactScript, suggestOurs, roomChanges, tradeRecap, oursWorkbook, lineCompare, makeLib };
        })();

        const money = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const qty = (n) => n == null ? '' : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const LINE_KIND = { OURS: 'Ours only', DIFF: 'Differs', THEIRS: 'Theirs only (info)' };
        const KIND_LABEL = { ADDED: 'Added', REMOVED: 'Removed', CHANGED: 'Changed', PRICE: 'Unit price only' };

        // Open a PDF file and read it into line items. Nothing is uploaded; the file is read in this browser.
        const readEstimateFile = async (file) => {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
            const bytes = new Uint8Array(await file.arrayBuffer());
            const doc = await window.pdfjsLib.getDocument({ data: bytes, disableFontFace: true }).promise;
            const pages = [];
            for (let n = 1; n <= doc.numPages; n++) {
                const tc = await (await doc.getPage(n)).getTextContent();
                pages.push({ items: tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5] })) });
            }
            const est = EstCompare.parseEstimate(pages);
            est.fileName = file.name;
            return est;
        };

        // One file picker with its read check underneath
        function EstimateFile({ label, est, error, busy, onPick }) {
            return (
                <div>
                    <label>{label}</label>
                    <input type="file" accept="application/pdf" onChange={e => e.target.files[0] && onPick(e.target.files[0])} />
                    {busy && <div className="read">Reading…</div>}
                    {error && <div className="read bad">{error}</div>}
                    {est && !busy && (
                        <div className={'read ' + (est.problems.length ? 'bad' : 'ok')}>
                            {est.estimate && <b>{est.estimate} · </b>}
                            {est.items.length} lines in {est.roomCheck.length} rooms, {money(est.readTotal)}
                            {est.problems.length === 0 && (est.printedTotal != null ? ' — matches the printed total and every room total' : ' — every room matches its printed total')}
                            {est.problems.length > 0 && (
                                <div>
                                    This PDF did not read cleanly. Check these before trusting the comparison:
                                    <ul>{est.problems.slice(0, 8).map((p, i) => <li key={i}>{p}</li>)}</ul>
                                    {est.problems.length > 8 && <div>…and {est.problems.length - 8} more</div>}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Insurance version vs version
        function VersionCompare({ profile }) {
            const [older, setOlder] = useState({ est: null, error: '', busy: false });
            const [newer, setNewer] = useState({ est: null, error: '', busy: false });
            const [rows, setRows] = useState(null);
            const [show, setShow] = useState({ ADDED: true, REMOVED: true, CHANGED: true, PRICE: false });
            const [ours, setOurs] = useState({ est: null, error: '', busy: false });   // our estimate, read only for its room names
            const [pairs, setPairs] = useState({});                                    // adjuster room -> our room ('' = keep the adjuster's name)
            // Step 2b (Nov 12): per job, our room list and the pairings are saved in estCompare/{jobId} with the Save button.
            // Each save first copies the old one to estCompare/{jobId}/versions. Nothing else is saved.
            const [jobs, setJobs] = useState([]);
            const [jobId, setJobId] = useState('');
            const [saved, setSaved] = useState(null);       // estCompare/{jobId}: null = no job or loading, false = nothing saved yet
            const [newRooms, setNewRooms] = useState([]);   // adjuster rooms with no saved pairing (the tool's guess is shown)
            const [saveMsg, setSaveMsg] = useState('');
            const [saving, setSaving] = useState(false);

            useEffect(() => db.collection('jobs').onSnapshot(snapshot => {
                const list = [];
                snapshot.forEach(doc => { const d = doc.data(); if (d.archived !== true) list.push({ id: doc.id, ...d }); });
                list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));
                setJobs(list);
            }, e => setSaveMsg('Error loading jobs: ' + e.message)), []);

            useEffect(() => {
                setSaved(null);
                setSaveMsg('');
                if (!jobId) return;
                let live = true;
                db.collection('estCompare').doc(jobId).get()
                    .then(snap => { if (live) setSaved(snap.exists ? snap.data() : false); })
                    .catch(e => { if (live) { setSaved(false); setSaveMsg('Could not load saved pairings: ' + e.message); } });
                return () => { live = false; };
            }, [jobId]);

            const pick = (set) => async (file) => {
                setRows(null);
                set({ est: null, error: '', busy: true });
                try {
                    const est = await readEstimateFile(file);
                    if (!est.items.length) set({ est: null, error: 'No Xactimate line items were found in this PDF.', busy: false });
                    else set({ est, error: '', busy: false });
                } catch (e) {
                    set({ est: null, error: 'Could not read this PDF: ' + e.message, busy: false });
                }
            };

            // our estimate does not change the comparison, so picking it keeps the results on screen
            const pickOurs = async (file) => {
                setOurs({ est: null, error: '', busy: true });
                try {
                    const est = await readEstimateFile(file);
                    if (!est.items.length) setOurs({ est: null, error: 'No Xactimate line items were found in this PDF.', busy: false });
                    else setOurs({ est, error: '', busy: false });
                } catch (e) {
                    setOurs({ est: null, error: 'Could not read this PDF: ' + e.message, busy: false });
                }
            };
            const ourRooms = useMemo(() => ours.est ? ours.est.roomCheck.map(c => c.room) : (saved && saved.ourRooms) || [], [ours.est, saved]);
            const savedPairs = useMemo(() => {
                const m = {};
                ((saved && saved.pairs) || []).forEach(p => { m[p.adj] = p.ours; });
                return m;
            }, [saved]);
            // adjuster rooms that have something to enter
            const adjRooms = useMemo(() => {
                if (!rows) return [];
                const list = [];
                EstCompare.entryRows(rows, older.est.items, newer.est.items).forEach(r => { if (!list.includes(r.room)) list.push(r.room); });
                return list;
            }, [rows]);
            // start each adjuster room on the tool's best guess
            // start each adjuster room on its saved pairing (if our room is still on the list), else the tool's best guess
            useEffect(() => {
                const p = {};
                const fresh = [];
                if (ourRooms.length) adjRooms.forEach(r => {
                    const s = savedPairs[r];
                    if (s !== undefined && (s === '' || ourRooms.includes(s))) p[r] = s;
                    else { p[r] = EstCompare.suggestRoom(r, ourRooms); fresh.push(r); }
                });
                setPairs(p);
                setNewRooms(fresh);
            }, [adjRooms, ourRooms, savedPairs]);

            const savePairs = async () => {
                setSaving(true);
                setSaveMsg('');
                try {
                    const ref = db.collection('estCompare').doc(jobId);
                    // keep saved pairings for adjuster rooms not in this comparison; this comparison's rooms take the screen's choice
                    const merged = { ...savedPairs };
                    adjRooms.forEach(r => { merged[r] = pairs[r] || ''; });
                    const job = jobs.find(j => j.id === jobId) || {};
                    const now = firebase.firestore.FieldValue.serverTimestamp();
                    const data = {
                        jobCode: job.code || '',
                        ourRooms,
                        ourFile: ours.est ? ours.est.fileName : (saved && saved.ourFile) || '',
                        ourTotal: ours.est ? ours.est.readTotal : (saved && saved.ourTotal != null ? saved.ourTotal : null),
                        pairs: Object.keys(merged).map(adj => ({ adj, ours: merged[adj] })),
                        savedBy: { uid: profile.uid, name: profile.name || profile.email || '' },
                        savedAt: now
                    };
                    const batch = db.batch();
                    if (saved) batch.set(ref.collection('versions').doc(), { ...saved, copiedAt: now });
                    batch.set(ref, data);
                    await batch.commit();
                    setSaved({ ...data, savedAt: firebase.firestore.Timestamp.now() });
                    setSaveMsg('Saved.');
                } catch (e) {
                    setSaveMsg('Could not save: ' + e.message);
                }
                setSaving(false);
            };
            const savedWhen = saved && saved.savedAt && saved.savedAt.toDate ? saved.savedAt.toDate().toLocaleString() : '';

            const warnings = [];
            if (older.est && newer.est) {
                if (older.est.format !== newer.est.format) warnings.push('The two PDFs are printed in different layouts, so some lines may not pair up.');
                if (older.est.readTotal === newer.est.readTotal && older.est.items.length === newer.est.items.length) warnings.push('Both files have the same line count and total. Check that they are two different versions.');
            }

            const compare = () => setRows(EstCompare.diffVersions(older.est.items, newer.est.items));

            const counts = useMemo(() => {
                const c = { ADDED: { n: 0, d: 0 }, REMOVED: { n: 0, d: 0 }, CHANGED: { n: 0, d: 0 }, PRICE: { n: 0, d: 0 } };
                (rows || []).forEach(r => { c[r.kind].n++; c[r.kind].d += r.change; });
                return c;
            }, [rows]);
            const shown = (rows || []).filter(r => show[r.kind]);
            const coded = newer.est && newer.est.format === 'coded';

            // line items before tax and O&P: the estimate's own summary figure when it prints one, else the lines added up
            const lineTotal = (est) => Math.round((est.summaryLineTotal != null ? est.summaryLineTotal : est.items.reduce((a, i) => a + (i.pre || 0), 0)) * 100) / 100;
            // the "Enter in Xactimate" rows; the Excel tab and the Xactimate script both use these
            const entryNow = () => EstCompare.entryRows(rows, older.est.items, newer.est.items, ourRooms.length ? pairs : null, ourRooms);
            const download = () => {
                const wb = EstCompare.versionWorkbook(window.XLSX, rows, {
                    oldName: older.est.fileName, newName: newer.est.fileName, oldEstimate: older.est.estimate, newEstimate: newer.est.estimate,
                    oldTotal: older.est.readTotal, newTotal: newer.est.readTotal, made: new Date().toLocaleString(),
                    entry: entryNow(),
                    ourNames: ourRooms.length > 0,
                    oldLineTotal: lineTotal(older.est), newLineTotal: lineTotal(newer.est),
                    rcvChange: older.est.summaryRcv != null && newer.est.summaryRcv != null ? Math.round((newer.est.summaryRcv - older.est.summaryRcv) * 100) / 100 : null
                });
                const base = (newer.est.estimate || 'estimate').replace(/[^\w.-]+/g, '_');
                window.XLSX.writeFile(wb, 'Version_Compare_' + base + '.xlsx');
            };
            // Xactimate entry script (AutoHotkey), one per comparison: job code and date in the file name, details on line 3
            const downloadScript = () => {
                const entry = entryNow();
                if (!entry.length) return;
                const job = jobs.find(j => j.id === jobId);
                const who = (job && job.code) || newer.est.estimate || 'estimate';
                const now = new Date();
                const roomCount = new Set(entry.map(r => r.room)).size;
                const total = entry.reduce((a, r) => a + r.amount, 0);
                const title = who + ' | ' + older.est.fileName + ' vs ' + newer.est.fileName + ' | ' + entry.length + ' rows, ' + roomCount + ' rooms, total ' + money(total) + ' | made ' + now.toLocaleString();
                const text = EstCompare.xactScript(entry, title, 'p' + now.getTime().toString(36));
                const day = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/plain' }));
                a.download = 'Xact_Entry_' + who.replace(/[^\w.-]+/g, '_') + '_' + day + '.ahk';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            };

            let lastRoom = null;
            return (
                <div>
                    <div className="section">
                        <div className="section-title">Insurance version vs version</div>
                        <div style={{ marginBottom: '16px' }}>
                            <label>Job (optional — pick one to use and save its room pairings)</label>
                            <select value={jobId} onChange={e => setJobId(e.target.value)}>
                                <option value="">-- No job --</option>
                                {jobs.map(j => <option key={j.id} value={j.id}>{j.code} - {j.address}</option>)}
                            </select>
                            {jobId && saved === null && <div className="muted">Loading…</div>}
                            {saveMsg && saveMsg.startsWith('Error') || saveMsg.startsWith('Could not load') ? <div className="read bad">{saveMsg}</div> : null}
                            {jobId && saved === false && <div className="muted">No room pairings saved for this job yet. Upload our estimate below, then Save after Compare.</div>}
                            {jobId && saved && (
                                <div className="read ok">
                                    Saved for this job: our rooms from {saved.ourFile || 'our estimate'} ({(saved.ourRooms || []).length} rooms{saved.ourTotal != null ? ', ' + money(saved.ourTotal) : ''}), {(saved.pairs || []).length} pairings
                                    {(saved.savedBy || savedWhen) && <span> — saved{saved.savedBy && saved.savedBy.name ? ' by ' + saved.savedBy.name : ''}{savedWhen ? ' ' + savedWhen : ''}</span>}.
                                    {' '}You don't need to upload our estimate again unless it was revised.
                                </div>
                            )}
                        </div>
                        <div className="files">
                            <EstimateFile label="Older estimate (PDF)" {...older} onPick={pick(setOlder)} />
                            <EstimateFile label="Newer estimate (PDF)" {...newer} onPick={pick(setNewer)} />
                            <EstimateFile label="Our estimate (PDF) — optional, for our room names" {...ours} onPick={pickOurs} />
                        </div>
                        {warnings.map((w, i) => <div key={i} className="read bad" style={{ marginBottom: '10px' }}>{w}</div>)}
                        <button className="btn-primary" disabled={!older.est || !newer.est} onClick={compare}>Compare</button>
                        <div className="muted">The PDFs are read in this browser and never uploaded. Only our room names and the pairings are saved, when you click Save.</div>
                    </div>

                    {rows && (
                        <div>
                            {ourRooms.length > 0 && adjRooms.length > 0 && (
                                <div className="section">
                                    <div className="section-title">Room names for the "Enter in Xactimate" tab</div>
                                    <table className="sumtable">
                                        <thead><tr><th>Adjuster room</th><th>Our room</th></tr></thead>
                                        <tbody>
                                            {adjRooms.map(r => (
                                                <tr key={r}>
                                                    <td>{r}{saved && newRooms.includes(r) && <span className="small" style={{ color: '#b3261e', fontWeight: 600 }}> new</span>}</td>
                                                    <td>
                                                        <select value={pairs[r] || ''} onChange={e => { setSaveMsg(''); setPairs(p => ({ ...p, [r]: e.target.value })); }}>
                                                            <option value="">(keep the adjuster's name)</option>
                                                            {ourRooms.map(o => <option key={o} value={o}>{o}</option>)}
                                                        </select>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="muted">
                                        {saved ? 'Saved pairings are filled in. Rooms marked "new" have the tool\'s best guess; check those.' : 'The tool\'s best guess is filled in.'} Fix any that are wrong before you download.
                                    </div>
                                    <div className="bar">
                                        <button className="btn-primary" disabled={!jobId || saved === null || saving} onClick={savePairs}>{saving ? 'Saving…' : 'Save room pairings'}</button>
                                        {!jobId && <span className="small">Pick a job above to save these.</span>}
                                        {saveMsg && <span className="small" style={{ color: saveMsg === 'Saved.' ? '#1b6e2b' : '#b3261e', fontWeight: 600 }}>{saveMsg}</span>}
                                    </div>
                                </div>
                            )}
                            <div className="section">
                                <div className="section-title">What changed</div>
                                <table className="sumtable">
                                    <thead><tr><th>Type of change</th><th className="n">Lines</th><th className="n">$ change</th></tr></thead>
                                    <tbody>
                                        {['ADDED', 'REMOVED', 'CHANGED', 'PRICE'].map(k => (
                                            <tr key={k}><td>{KIND_LABEL[k]}</td><td className="n">{counts[k].n}</td><td className={'n' + (counts[k].d < 0 ? ' neg' : '')}>{money(counts[k].d)}</td></tr>
                                        ))}
                                        <tr className="sum"><td>Total</td><td className="n">{rows.length}</td><td className="n">{money(rows.reduce((a, r) => a + r.change, 0))}</td></tr>
                                    </tbody>
                                </table>
                                <div className="muted">Dollars are before tax and O&P. Line totals went from {money(older.est.readTotal)} to {money(newer.est.readTotal)} with tax and O&P.</div>
                            </div>

                            <div className="bar">
                                {['ADDED', 'REMOVED', 'CHANGED', 'PRICE'].map(k => (
                                    <label key={k}><input type="checkbox" checked={show[k]} onChange={e => setShow(s => ({ ...s, [k]: e.target.checked }))} /> {KIND_LABEL[k]} ({counts[k].n})</label>
                                ))}
                                <span className="grow"></span>
                                <button className="btn-secondary" onClick={download}>Download Excel</button>
                                <button className="btn-secondary" onClick={downloadScript}>Download Xactimate script</button>
                            </div>

                            {rows.length === 0 && <div className="msg">No differences found between these two estimates.</div>}
                            {rows.length > 0 && shown.length === 0 && <div className="msg">Nothing to show. Tick a type of change above.</div>}
                            {shown.length > 0 && (
                                <div className="scroll">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th className="n">Old #</th><th className="n">New #</th><th>Change</th>{coded && <th>Code</th>}<th>Description</th>
                                                <th className="n">Old qty</th><th className="n">New qty</th><th className="n">Old price</th><th className="n">New price</th><th className="n">$ change</th><th>What changed</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {shown.map((r, i) => {
                                                const head = r.room !== lastRoom;
                                                lastRoom = r.room;
                                                const roomSum = head ? shown.filter(x => x.room === r.room).reduce((a, x) => a + x.change, 0) : 0;
                                                return (
                                                    <React.Fragment key={i}>
                                                        {head && <tr className="room"><td colSpan={coded ? 9 : 8}>{r.room}</td><td className={'n' + (roomSum < 0 ? ' neg' : '')}>{money(roomSum)}</td><td></td></tr>}
                                                        <tr className={r.kind}>
                                                            <td className="n">{r.oldNo}</td><td className="n">{r.newNo}</td><td className="kind">{KIND_LABEL[r.kind]}</td>
                                                            {coded && <td style={{ whiteSpace: 'nowrap' }}>{r.cat} {r.sel}</td>}
                                                            <td>{r.desc}{r.note && <div className="small">{r.note}</div>}</td>
                                                            <td className="n">{qty(r.oldQty)}{r.oldQty != null && ' ' + r.unit}</td><td className="n">{qty(r.newQty)}{r.newQty != null && ' ' + r.unit}</td>
                                                            <td className="n">{r.oldPrice == null ? '' : qty(r.oldPrice)}</td><td className="n">{r.newPrice == null ? '' : qty(r.newPrice)}</td>
                                                            <td className={'n' + (r.change < 0 ? ' neg' : '')}>{money(r.change)}</td><td>{r.what}</td>
                                                        </tr>
                                                    </React.Fragment>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Ours vs insurance, step 1 (Nov 14): room changes and trade recap. The line comparison is the next step.
        // We change our estimate to the adjuster's room names and order, so each of their rooms is paired to one of ours (or a part of one).
        // Saved per job with the Save button in estCompare/{jobId}_ours (its own record; the version vs version pairings in estCompare/{jobId} are not touched).
        const PART_SEP = '\u0001';
        const partValue = (p) => p && p.room ? [p.room, p.kind || '', p.part || ''].join(PART_SEP) : '';
        const partFromValue = (v) => { if (!v) return null; const a = v.split(PART_SEP); return { room: a[0], kind: a[1] || '', part: a[2] || '' }; };

        function OursVsInsurance({ profile }) {
            const [ours, setOurs] = useState({ est: null, error: '', busy: false });
            const [ins, setIns] = useState({ est: null, error: '', busy: false });
            const [pairs, setPairs] = useState({});         // their room -> partValue ('' = we don't have it)
            const [jobs, setJobs] = useState([]);
            const [jobId, setJobId] = useState('');
            const [saved, setSaved] = useState(null);       // null = no job or loading, false = nothing saved yet
            const [newRooms, setNewRooms] = useState([]);   // their rooms with no saved pairing (the tool's guess is shown)
            const [loadMsg, setLoadMsg] = useState('');
            const [saveMsg, setSaveMsg] = useState('');
            const [saving, setSaving] = useState(false);
            // Step 2 (Nov 14): line comparison. lines = result of the last Compare lines click (cleared when a file or a pairing changes); off = rows unticked.
            const [lines, setLines] = useState(null);
            const [lib, setLib] = useState(null);           // code library: null = loading, false = not found
            useEffect(() => {
                fetch('/est-compare/codes.json', { cache: 'no-cache' })
                    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                    .then(j => setLib(EstCompare.makeLib(j)))
                    .catch(() => setLib(false));
            }, []);
            const [off, setOff] = useState({});
            const [showKind, setShowKind] = useState({ OURS: true, DIFF: true, THEIRS: false });

            useEffect(() => db.collection('jobs').onSnapshot(snapshot => {
                const list = [];
                snapshot.forEach(doc => { const d = doc.data(); if (d.archived !== true) list.push({ id: doc.id, ...d }); });
                list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));
                setJobs(list);
            }, e => setLoadMsg('Error loading jobs: ' + e.message)), []);

            useEffect(() => {
                setSaved(null);
                setSaveMsg('');
                setLoadMsg('');
                if (!jobId) return;
                let live = true;
                db.collection('estCompare').doc(jobId + '_ours').get()
                    .then(snap => { if (live) setSaved(snap.exists ? snap.data() : false); })
                    .catch(e => { if (live) { setSaved(false); setLoadMsg('Could not load saved room pairings: ' + e.message); } });
                return () => { live = false; };
            }, [jobId]);

            const pick = (set) => async (file) => {
                set({ est: null, error: '', busy: true });
                try {
                    const est = await readEstimateFile(file);
                    if (!est.items.length) set({ est: null, error: 'No Xactimate line items were found in this PDF.', busy: false });
                    else set({ est, error: '', busy: false });
                } catch (e) {
                    set({ est: null, error: 'Could not read this PDF: ' + e.message, busy: false });
                }
            };

            const ourRooms = useMemo(() => ours.est ? ours.est.roomCheck.map(c => {
                const p = ours.est.roomParts[c.room] || {};
                return { name: c.room, total: c.read, subs: p.subs || [], heads: p.heads || [] };
            }) : [], [ours.est]);
            const insRooms = useMemo(() => ins.est ? ins.est.roomCheck.map(c => ({ name: c.room, total: c.read })) : [], [ins.est]);
            const ready = ourRooms.length > 0 && insRooms.length > 0;

            // start each of their rooms on its saved pairing (if that room or part is still in our estimate), else the tool's best guess
            useEffect(() => {
                const p = {}, fresh = [];
                const savedMap = {};
                ((saved && saved.pairs) || []).forEach(x => { savedMap[x.adj] = x; });
                let prev = '';
                if (ready) insRooms.forEach(r => {
                    const s = savedMap[r.name];
                    const o = s && s.ours ? ourRooms.find(x => x.name === s.ours) : null;
                    const good = s && (!s.ours || (o && (!s.part || (s.kind === 's' ? o.subs : o.heads).includes(s.part))));
                    const g = good ? (s.ours ? { room: s.ours, kind: s.kind || '', part: s.part || '' } : null) : EstCompare.suggestOurs(r.name, ourRooms, prev);
                    if (!good) fresh.push(r.name);
                    p[r.name] = partValue(g);
                    if (g) prev = g.room;
                });
                setPairs(p);
                setNewRooms(fresh);
            }, [ourRooms, insRooms, saved]);
            useEffect(() => { setLines(null); setOff({}); }, [pairs]);
            const compareLines = () => {
                const m = {};
                insRooms.forEach(r => { m[r.name] = partFromValue(pairs[r.name]); });
                setOff({});
                setLines(EstCompare.lineCompare(ours.est, ins.est, insRooms.map(r => r.name), ourRooms.map(r => r.name), m, recap, lib || null));
            };
            const kept = lines ? lines.rows.filter(r => !off[r.id + r.room]) : [];
            const kindCount = (k) => lines ? lines.rows.filter(r => r.kind === k).length : 0;
            const shownLines = lines ? lines.rows.filter(r => showKind[r.kind]) : [];
            const entryTotal = kept.filter(r => r.entry !== 'Info').reduce((a, r) => a + r.amount, 0);

            const changes = useMemo(() => {
                if (!ready) return [];
                const m = {};
                insRooms.forEach(r => { m[r.name] = partFromValue(pairs[r.name]); });
                return EstCompare.roomChanges(insRooms.map(r => r.name), ourRooms.map(r => r.name), m);
            }, [pairs, ourRooms, insRooms]);
            const recap = useMemo(() => ready ? EstCompare.tradeRecap(ours.est, ins.est) : null, [ours.est, ins.est]);
            const count = (test) => changes.filter(test).length;

            const savePairs = async () => {
                setSaving(true);
                setSaveMsg('');
                try {
                    const ref = db.collection('estCompare').doc(jobId + '_ours');
                    const job = jobs.find(j => j.id === jobId) || {};
                    const now = firebase.firestore.FieldValue.serverTimestamp();
                    const data = {
                        kind: 'oursVsInsurance', jobId, jobCode: job.code || '',
                        ourFile: ours.est.fileName, ourTotal: ours.est.readTotal, ourRooms: ourRooms.map(r => ({ name: r.name, subs: r.subs, heads: r.heads })),
                        insFile: ins.est.fileName, insTotal: ins.est.readTotal, insRooms: insRooms.map(r => r.name),
                        pairs: insRooms.map(r => { const p = partFromValue(pairs[r.name]); return { adj: r.name, ours: p ? p.room : '', kind: p ? p.kind : '', part: p ? p.part : '' }; }),
                        savedBy: { uid: profile.uid, name: profile.name || profile.email || '' },
                        savedAt: now
                    };
                    const batch = db.batch();
                    if (saved) batch.set(ref.collection('versions').doc(), { ...saved, copiedAt: now });
                    batch.set(ref, data);
                    await batch.commit();
                    setSaved({ ...data, savedAt: firebase.firestore.Timestamp.now() });
                    setSaveMsg('Saved.');
                } catch (e) {
                    setSaveMsg('Could not save: ' + e.message);
                }
                setSaving(false);
            };
            const savedWhen = saved && saved.savedAt && saved.savedAt.toDate ? saved.savedAt.toDate().toLocaleString() : '';

            const download = () => {
                const wb = EstCompare.oursWorkbook(window.XLSX, changes, recap, {
                    ourName: ours.est.fileName, ourEstimate: ours.est.estimate, insName: ins.est.fileName, insEstimate: ins.est.estimate, made: new Date().toLocaleString(),
                    lines: lines ? { ...lines, rows: kept } : null
                });
                const job = jobs.find(j => j.id === jobId);
                const base = ((job && job.code) || ours.est.estimate || 'estimate').replace(/[^\w.-]+/g, '_');
                window.XLSX.writeFile(wb, 'Ours_vs_Insurance_' + base + '.xlsx');
            };
            // Xactimate script for the Differences rows (Nov 14): same rows and row numbers as the Excel Differences tab; notes typed through Attachments
            const downloadScript = (theirsOnly) => {
                const entry = kept.filter(r => theirsOnly ? r.entry === 'Info' : r.entry !== 'Info');
                if (!entry.length) return;
                const job = jobs.find(j => j.id === jobId);
                const who = (job && job.code) || ours.est.estimate || 'estimate';
                const now = new Date();
                const roomCount = new Set(entry.map(r => r.room)).size;
                const total = entry.reduce((a, r) => a + r.amount, 0);
                const title = who + (theirsOnly ? ' | Theirs only (into our revised estimate): ' : ' | Differences: ') + ours.est.fileName + ' vs ' + ins.est.fileName + ' | ' + entry.length + ' rows, ' + roomCount + ' rooms, total ' + money(total) + ' | made ' + now.toLocaleString();
                const text = EstCompare.xactScript(entry, title, 'p' + now.getTime().toString(36));
                const day = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/plain' }));
                a.download = (theirsOnly ? 'Xact_TheirsOnly_' : 'Xact_Differences_') + who.replace(/[^\w.-]+/g, '_') + '_' + day + '.ahk';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            };

            const warnings = [];
            if (ready) {
                if (ours.est.readTotal === ins.est.readTotal && ours.est.items.length === ins.est.items.length) warnings.push('Both files have the same line count and total. Check that one is ours and one is the insurance estimate.');
                if (ours.est.format !== 'coded') warnings.push('Our estimate PDF does not print the CAT and SEL columns. Print ours with the codes showing; the line comparison (next step) will need them.');
            }
            const recapLine = (who, c) => !c.found ? <div className="read bad">{who}: no Recap by Category page was found in this PDF. Print the estimate with its recap pages.</div>
                : <div className={'read ' + (c.ok ? 'ok' : 'bad')}>{who}: the trades add up to {money(c.sum)}{c.ok ? ' — matches the printed subtotal' : ' but the recap prints ' + money(c.subtotal) + '. Check this recap before trusting the table.'}</div>;

            return (
                <div>
                    <div className="section">
                        <div className="section-title">Ours vs insurance — room changes, trade recap and line differences</div>
                        <div style={{ marginBottom: '16px' }}>
                            <label>Job (optional — pick one to use and save its room pairings)</label>
                            <select value={jobId} onChange={e => setJobId(e.target.value)}>
                                <option value="">-- No job --</option>
                                {jobs.map(j => <option key={j.id} value={j.id}>{j.code} - {j.address}</option>)}
                            </select>
                            {jobId && saved === null && <div className="muted">Loading…</div>}
                            {loadMsg && <div className="read bad">{loadMsg}</div>}
                            {jobId && saved === false && !loadMsg && <div className="muted">No Ours vs insurance room pairings saved for this job yet.</div>}
                            {jobId && saved && (
                                <div className="read ok">
                                    Saved for this job: {(saved.pairs || []).length} room pairings ({saved.ourFile || 'our estimate'} and {saved.insFile || 'insurance estimate'})
                                    {(saved.savedBy || savedWhen) && <span> — saved{saved.savedBy && saved.savedBy.name ? ' by ' + saved.savedBy.name : ''}{savedWhen ? ' ' + savedWhen : ''}</span>}.
                                    {' '}Upload both estimates and the saved pairings are filled in.
                                </div>
                            )}
                        </div>
                        <div className="files">
                            <EstimateFile label="Our estimate (PDF)" {...ours} onPick={pick(setOurs)} />
                            <EstimateFile label="Insurance estimate (PDF)" {...ins} onPick={pick(setIns)} />
                        </div>
                        {warnings.map((w, i) => <div key={i} className="read bad" style={{ marginBottom: '10px' }}>{w}</div>)}
                        <div className="muted">The PDFs are read in this browser and never uploaded. Only the room names and pairings are saved, when you click Save.</div>
                    </div>

                    {ready && (
                        <div>
                            <div className="section">
                                <div className="section-title">Room changes to make in our estimate</div>
                                <div className="muted" style={{ marginTop: 0, marginBottom: '10px' }}>
                                    In the adjuster's room order. For each of their rooms, pick the room of ours (or the part of it) that covers the same space. Several of theirs can use the same one of ours.
                                </div>
                                <div className="scroll">
                                    <table>
                                        <thead><tr><th className="n">#</th><th>Their room</th><th className="n">Their total</th><th>Our room now</th><th className="n">Our total</th><th>Change in our estimate</th></tr></thead>
                                        <tbody>
                                            {changes.map((c, i) => {
                                                if (c.type === 'OURS') {
                                                    const o = ourRooms.find(r => r.name === c.ours);
                                                    return <tr key={'o' + i} className="oursonly"><td></td><td>(none)</td><td></td><td>{c.ours}</td><td className="n">{o ? money(o.total) : ''}</td><td>{c.text}</td></tr>;
                                                }
                                                const t = insRooms[c.no - 1];
                                                const o = c.ours && !c.part ? ourRooms.find(r => r.name === c.ours) : null;
                                                return (
                                                    <tr key={c.adj}>
                                                        <td className="n">{c.no}</td>
                                                        <td>{c.adj}{saved && newRooms.includes(c.adj) && <span className="small" style={{ color: '#b3261e', fontWeight: 600 }}> new</span>}</td>
                                                        <td className="n">{money(t.total)}</td>
                                                        <td>
                                                            <select value={pairs[c.adj] || ''} onChange={e => { const v = e.target.value; setSaveMsg(''); setPairs(p => ({ ...p, [c.adj]: v })); }}>
                                                                <option value="">(we don't have this room)</option>
                                                                {ourRooms.map(r => (
                                                                    <React.Fragment key={r.name}>
                                                                        <option value={partValue({ room: r.name })}>{r.name}</option>
                                                                        {r.subs.map(x => <option key={'s' + x} value={partValue({ room: r.name, kind: 's', part: x })}>{'   ' + r.name + ' › ' + x + ' (subroom)'}</option>)}
                                                                        {r.heads.map(x => <option key={'h' + x} value={partValue({ room: r.name, kind: 'h', part: x })}>{'   ' + r.name + ' › ' + x + ' lines'}</option>)}
                                                                    </React.Fragment>
                                                                ))}
                                                            </select>
                                                        </td>
                                                        <td className="n">{o ? money(o.total) : ''}</td>
                                                        <td className={c.text === 'No change.' ? '' : 'todo'}>{c.text}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="muted">
                                    {count(c => c.rename)} to rename, {count(c => c.move)} to move, {count(c => c.type === 'SPLIT')} to split out, {count(c => c.type === 'ADD')} theirs only, {count(c => c.type === 'OURS')} ours only.
                                    {' '}{saved ? 'Saved pairings are filled in. Rooms marked "new" have the tool\'s best guess; check those.' : 'The tool\'s best guess is filled in; fix any that are wrong.'}
                                    {' '}Room totals include tax and O&P. The PDF does not say which lines belong to a subroom, so splits are done by hand in Xactimate.
                                </div>
                                <div className="bar">
                                    <button className="btn-primary" disabled={!jobId || saved === null || saving} onClick={savePairs}>{saving ? 'Saving…' : 'Save room pairings'}</button>
                                    <button className="btn-secondary" onClick={download}>Download Excel</button>
                                    {!jobId && <span className="small">Pick a job above to save these.</span>}
                                    {saveMsg && <span className="small" style={{ color: saveMsg === 'Saved.' ? '#1b6e2b' : '#b3261e', fontWeight: 600 }}>{saveMsg}</span>}
                                </div>
                            </div>

                            <div className="section">
                                <div className="section-title">Trade recap</div>
                                {recapLine('Ours', recap.ours)}
                                {recapLine('Insurance', recap.ins)}
                                {recap.rows.length > 0 && (
                                    <table className="sumtable" style={{ maxWidth: '760px', marginTop: '12px' }}>
                                        <thead><tr><th>Trade</th><th className="n">Ours</th><th className="n">Insurance</th><th className="n">Difference</th><th></th></tr></thead>
                                        <tbody>
                                            {recap.rows.map(r => (
                                                <tr key={r.trade} className={r.left ? 'leftout' : ''}>
                                                    <td>{r.trade}</td><td className="n">{money(r.ours)}</td><td className="n">{money(r.ins)}</td>
                                                    <td className={'n' + (r.diff < 0 && !r.left ? ' neg' : '')}>{money(r.diff)}</td><td>{r.left ? 'Left out ($' + recap.limit + ' rule)' : ''}</td>
                                                </tr>
                                            ))}
                                            <tr className="sum"><td>Total</td><td className="n">{money(recap.rows.reduce((a, r) => a + r.ours, 0))}</td><td className="n">{money(recap.rows.reduce((a, r) => a + r.ins, 0))}</td>
                                                <td className="n">{money(recap.rows.reduce((a, r) => a + r.diff, 0))}</td><td></td></tr>
                                        </tbody>
                                    </table>
                                )}
                                <div className="muted">From each estimate's Recap by Category, before tax and O&P.</div>
                            </div>

                            <div className="section">
                                <div className="section-title">Line differences</div>
                                <div className="bar" style={{ marginTop: 0 }}>
                                    <button className="btn-primary" onClick={compareLines}>Compare lines</button>
                                    {lines && ['OURS', 'DIFF', 'THEIRS'].map(k => (
                                        <label key={k}><input type="checkbox" checked={showKind[k]} onChange={e => setShowKind(s => ({ ...s, [k]: e.target.checked }))} /> {LINE_KIND[k]} ({kindCount(k)})</label>
                                    ))}
                                    <span className="grow"></span>
                                    {lines && <button className="btn-secondary" onClick={download}>Download Excel</button>}
                                    {lines && <button className="btn-secondary" onClick={() => downloadScript(false)}>Download Xactimate script</button>}
                                    {lines && <button className="btn-secondary" onClick={() => downloadScript(true)} title="Ticked Theirs only rows, at their unit price, for a copy of our estimate with rooms renamed to match theirs">Download script: theirs only</button>}
                                </div>
                                <div className="muted" style={{ marginBottom: '6px' }}>{lib === null ? 'Loading the code library…' : lib ? 'Code library: ' + lib.count.toLocaleString() + ' codes' + (lib.made ? ' (made ' + lib.made + ')' : '') + '. Used for their lines with no code.' : 'Code library not found (est-compare/codes.json). Their lines with no code are guessed from our lines only.'}</div>
                                {!lines && <div className="muted">Uses the room pairings above. Lines in common (within 10%) are hidden. Changing a pairing clears the results.</div>}
                                {lines && (
                                    <div>
                                        <table className="sumtable" style={{ maxWidth: '760px', marginBottom: '14px' }}>
                                            <tbody>
                                                <tr><td>Rows to enter (ticked adds and credits)</td><td className="n">{money(entryTotal)}</td></tr>
                                                <tr><td>Our estimate less the insurance estimate, line items</td><td className="n">{money(lines.oursTotal - lines.insTotal)}</td></tr>
                                                <tr><td>Not in the rows: lines in common (10% or less apart)</td><td className="n">{money(lines.common)}</td></tr>
                                                <tr><td>Not in the rows: theirs only, no credit</td><td className="n">{money(-lines.theirsOnly)}</td></tr>
                                                <tr><td>Not in the rows: everything else (replace-only credits, unticked lines)</td><td className="n">{money(lines.oursTotal - lines.insTotal - entryTotal - lines.common + lines.theirsOnly)}</td></tr>
                                            </tbody>
                                        </table>
                                        {shownLines.length === 0 && <div className="msg">Nothing to show. Tick a type above.</div>}
                                        {shownLines.length > 0 && (
                                            <div className="scroll">
                                                <table>
                                                    <thead><tr><th></th><th>Entry</th><th>Code</th><th>Description</th><th className="n">Qty</th><th className="n">Unit price</th><th className="n">Amount</th><th className="n">Ours #</th><th className="n">Theirs #</th><th>Why</th></tr></thead>
                                                    <tbody>
                                                        {shownLines.map((r, i) => {
                                                            const first = i === 0 || shownLines[i - 1].room !== r.room;
                                                            const id = r.id + r.room;
                                                            const roomSum = first ? kept.filter(x => x.room === r.room && x.entry !== 'Info').reduce((a, x) => a + x.amount, 0) : 0;
                                                            return (
                                                                <React.Fragment key={id + i}>
                                                                    {first && <tr className="room"><td colSpan={6}>{r.room}</td><td className={'n' + (roomSum < 0 ? ' neg' : '')}>{money(roomSum)}</td><td colSpan={3}></td></tr>}
                                                                    <tr className={(off[id] ? 'leftout ' : '') + (r.check ? 'check ' : '') + 'L' + r.kind}>
                                                                        <td><input type="checkbox" checked={!off[id]} onChange={e => { const on = e.target.checked; setOff(o => ({ ...o, [id]: !on })); }} /></td>
                                                                        <td className="kind">{r.entry === 'Info' ? 'Theirs only' : r.entry}</td>
                                                                        <td style={{ whiteSpace: 'nowrap' }}>{r.cat} {r.sel} {r.act}</td>
                                                                        <td>{r.desc}{r.note && <div className="small">{r.note}</div>}</td>
                                                                        <td className="n">{qty(r.qty)} {r.unit}</td><td className="n">{qty(r.price)}</td>
                                                                        <td className={'n' + (r.amount < 0 ? ' neg' : '')}>{money(r.amount)}</td>
                                                                        <td className="n">{r.ourNo}</td><td className="n">{r.insNo}</td><td>{r.what}</td>
                                                                    </tr>
                                                                </React.Fragment>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                        <div className="muted">Dollars are before tax and O&P. Untick a line to leave it out of the Excel. "Theirs only" lines are for information and are never credited.</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(undefined); // undefined = still checking
            const [profile, setProfile] = useState(null); // null = loading, false = no access
            const [authError, setAuthError] = useState('');
            const [mode, setMode] = useState(null); // null = pick, 'versions', 'ours'

            // Sign-in and role check (this page never creates user records)
            useEffect(() => {
                return auth.onAuthStateChanged(async u => {
                    setUser(u);
                    setProfile(null);
                    if (!u) return;
                    try {
                        const snap = await db.collection('users').doc(u.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: u.uid, ...d });
                        else setProfile(false);
                    } catch (e) {
                        setProfile(false);
                    }
                });
            }, []);

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    setAuthError(e.message);
                }
            };

            if (user === undefined || (user && profile === null)) return <div className="msg">Loading…</div>;
            if (!user) return (
                <div>
                    <button className="btn-primary" onClick={login}>Sign in with Microsoft</button>
                    {authError && <div className="msg" style={{ color: '#d32f2f' }}>{authError}</div>}
                </div>
            );
            if (profile === false) return (
                <div>
                    <p>No access. Estimate Comparisons is for Owner, Admin and Estimator. Contact an admin.</p>
                    <button className="btn-secondary" style={{ marginTop: '12px' }} onClick={() => auth.signOut()}>Sign out</button>
                </div>
            );

            if (mode === 'versions') return (
                <div>
                    <button className="back" onClick={() => setMode(null)}>← Comparison types</button>
                    <VersionCompare profile={profile} />
                </div>
            );
            if (mode === 'ours') return (
                <div>
                    <button className="back" onClick={() => setMode(null)}>← Comparison types</button>
                    <OursVsInsurance profile={profile} />
                </div>
            );
            return (
                <div className="choices">
                    <button className="choice" onClick={() => setMode('versions')}>
                        <b>Insurance version vs version</b>
                        <span>See what the adjuster changed between two versions of their estimate, room by room, with the line numbers from both.</span>
                    </button>
                    <button className="choice" onClick={() => setMode('ours')}>
                        <b>Ours vs insurance</b>
                        <span>See which of our rooms to rename, move or split to match the adjuster's rooms, compare the two estimates trade by trade, then list the line differences to enter.</span>
                    </button>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
