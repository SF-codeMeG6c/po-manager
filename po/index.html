<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Manager - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-secondary:disabled { background: #e0e0e0; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 6px 10px; font-size: 12px; margin-right: 4px; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        .success { color: #388e3c; font-size: 12px; margin-top: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { background: #f5f5f5; padding: 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #fafafa; }
        
        
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        .button-group { display: flex; gap: 8px; margin-top: 8px; }
        .button-group button { margin: 0; }
        
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>PO Manager</h1>
        <p class="subtitle">Freeman Restoration Subcontractor Scope of Work</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PDFDocument } = PDFLib;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        const functions = firebase.functions();

        const TEMPLATE_PDF_URL = 'https://raw.githubusercontent.com/SF-codeMeG6c/po-manager/main/Sub_Spec_Blank_9-20-26_V2.pdf';

        function POApp() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login');
            
            const [jobCode, setJobCode] = useState('');
            const [jobAddress, setJobAddress] = useState('');
            const [cityStateZip, setCityStateZip] = useState('');
            const [lockBox, setLockBox] = useState('');
            const [superName, setSuperName] = useState('');
            const [superPhone, setSuperPhone] = useState('');
            const [superEmail, setSuperEmail] = useState('');
            const [currentJobId, setCurrentJobId] = useState('');
            
            const [currentPO, setCurrentPO] = useState('');
            const [message, setMessage] = useState('');
            const [poWindow, setPoWindow] = useState(false);       // the Make New PO / Edit PO window is open
            const [showTemplates, setShowTemplates] = useState(false); // template list shown inside that window
            const [jobLibrary, setJobLibrary] = useState([]);
            const [teamError, setTeamError] = useState(''); // error reading the Super from Customer Information

            const [uploadLoading, setUploadLoading] = useState(false);
            const [jobForms, setJobForms] = useState([]);

            // Phase 4: PDF Metadata & Search
            const [formLibraryData, setFormLibraryData] = useState([]);
            const [formMetadata, setFormMetadata] = useState({
                subName: '',
                category: '',
                contact: '',
                phone: '',
                email: '',
                subCode: '',
                contractAmount: '',
                scope: ''
            });
            const [editingPO, setEditingPO] = useState(null); // tracker row being edited
            const [listening, setListening] = useState(null); // 'scope' or a tracker row id
            const recognitionRef = React.useRef(null);
            const scopeRef = React.useRef(null);
            const noteRef = React.useRef(null);
            const [noteModal, setNoteModal] = useState(null); // { form, text } while the note window is open
            const [sendingId, setSendingId] = useState(null); // PO being emailed
            const [openVersions, setOpenVersions] = useState(null); // PO row showing its old versions
            const [attachments, setAttachments] = useState([]); // [{ name, type, file }] new, or [{ name, type, url }] saved
            const [profile, setProfile] = useState(null); // users record: null = checking, false = no access, object = active user

            useEffect(() => {
                auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) { clearSignedOutState(); return; }
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        if (snap.exists && snap.data().active === true) {
                            setProfile({ uid: currentUser.uid, ...snap.data() });
                            loadJobs(currentUser.uid, snap.data().role);
                            loadFormLibraryData(currentUser.uid);
                        } else if (!snap.exists) {
                            // New person: create their own record as pending (no access until approved)
                            try {
                                await db.collection('users').doc(currentUser.uid).set({
                                    name: currentUser.displayName || currentUser.email || '',
                                    email: currentUser.email || '',
                                    role: 'pending',
                                    active: false,
                                    requestedAt: new Date()
                                });
                                setProfile('pending');
                            } catch (createErr) {
                                setProfile(false);
                            }
                        } else {
                            setProfile(snap.data().role === 'pending' ? 'pending' : false);
                        }
                    } catch (err) {
                        setProfile(false);
                    }
                });
            }, []);

            const loadFormLibraryData = (uid) => {
                db.collection('formLibrary').onSnapshot(snapshot => {
                    const forms = [];
                    snapshot.forEach(doc => {
                        forms.push({ id: doc.id, ...doc.data() });
                    });
                    setFormLibraryData(forms);
                });
            };

            // Job list: all jobs, or only assigned jobs for Supers. Archived jobs are hidden.
            const loadJobs = (uid, role) => {
                let query = db.collection('jobs');
                if (role === 'super') query = query.where('assignedSupers', 'array-contains', uid);
                query.onSnapshot(snapshot => {
                    const jobs = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        if (d.archived === true) return;
                        jobs.push({ id: doc.id, code: d.code || '', address: d.address || '', cityStateZip: d.cityStateZip || '', lockBox: d.lockBox || '', assignedSupers: d.assignedSupers || [] });
                    });
                    jobs.sort((a, b) => a.code.localeCompare(b.code));
                    setJobLibrary(jobs);
                }, error => console.error('Job list error:', error));
            };

            // The loaded job's code, address and lock box follow the job record (changed only on Customer Information)
            useEffect(() => {
                const j = jobLibrary.find(x => x.id === currentJobId);
                if (!j) return;
                setJobCode(j.code); setJobAddress(j.address); setCityStateZip(j.cityStateZip); setLockBox(j.lockBox);
            }, [jobLibrary, currentJobId]);

            // The loaded job's Super, read live from the Customer Information card (team.super). Picked only on Customer Information.
            useEffect(() => {
                setSuperName(''); setSuperPhone(''); setSuperEmail(''); setTeamError('');
                if (!user || !currentJobId) return;
                return db.collection('jobs').doc(currentJobId).collection('notesInfo').doc('contactCard').onSnapshot(doc => {
                    const t = doc.exists ? (doc.data().team || {}) : {};
                    const s = t.super && t.super.uid ? t.super : {};
                    setSuperName(s.name || s.email || ''); setSuperPhone(s.phone || ''); setSuperEmail(s.email || '');
                    setTeamError('');
                }, error => setTeamError('Error loading the Super from Customer Information: ' + error.message));
            }, [user, currentJobId]);

            // The loaded job's POs. Switching jobs stops listening to the old job, so its POs can't show up on the new one.
            const formsUnsub = React.useRef(null);
            const stopJobForms = () => { if (formsUnsub.current) { formsUnsub.current(); formsUnsub.current = null; } };
            const loadJobForms = (jobId) => {
                if (!user) return;
                stopJobForms();
                formsUnsub.current = db.collection('jobs').doc(jobId).collection('forms').orderBy('dateCreated', 'desc').onSnapshot(snapshot => {
                    const forms = [];
                    snapshot.forEach(doc => {
                        forms.push({ id: doc.id, ...doc.data() });
                    });
                    setJobForms(forms);
                });
            };

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const isAdminUser = !!profile && ['owner', 'admin'].includes(profile.role);
            const canEditJobs = !!profile && ['owner', 'admin', 'estimator'].includes(profile.role);

            // Clear the page when the person is signed out. Logout is on the Dashboard.
            const clearSignedOutState = () => {
                setJobCode('');
                setJobAddress('');
                setCityStateZip('');
                setLockBox('');
                setSuperName('');
                setSuperPhone('');
                setSuperEmail('');
                setCurrentPO('');
                setCurrentJobId('');
                setJobLibrary([]);
                stopJobForms();
                setJobForms([]);
            };

            // Picking a job in the drop-down loads it right away; the blank line clears the page.
            // A PO open in Edit PO is dropped only after asking (it belongs to the job being left).
            const pickJob = (id) => {
                if (id === currentJobId) return;
                if (editingPO) {
                    if (!window.confirm(`You are editing PO ${editingPO.poNumber}. Switch jobs and drop the changes?`)) return;
                    handleCancelEditPO();
                }
                const job = jobLibrary.find(j => j.id === id);
                if (job) { handleSelectJob(job); return; }
                stopJobForms();
                setCurrentJobId(''); setJobCode(''); setJobAddress(''); setCityStateZip(''); setLockBox('');
                setJobForms([]); setCurrentPO('');
            };

            const handleSelectJob = (job) => {
                setJobCode(job.code);
                setJobAddress(job.address);
                setCityStateZip(job.cityStateZip);
                setLockBox(job.lockBox);
                
                // If job has id, use it; otherwise find it by code
                if (job.id) {
                    setCurrentJobId(job.id);
                    loadJobForms(job.id);
                } else if (job.code && user) {
                    // Find job by code in jobs collection
                    db.collection('jobs').where('userId', '==', user.uid)
                      .where('code', '==', job.code)
                      .limit(1)
                      .get()
                      .then(snapshot => {
                          if (!snapshot.empty) {
                              const jobId = snapshot.docs[0].id;
                              setCurrentJobId(jobId);
                              loadJobForms(jobId);
                          } else {
                              setMessage('Job not found in database');
                          }
                      })
                      .catch(error => {
                          setMessage('Error loading job: ' + error.message);
                      });
                }
            };

            // Opened from the Dashboard with ?job=ID: load that job once the job list is in
            const urlJobId = new URLSearchParams(window.location.search).get('job');
            const urlJobLoaded = React.useRef(false);
            useEffect(() => {
                if (urlJobLoaded.current || !urlJobId || !user) return;
                const job = jobLibrary.find(j => j.id === urlJobId);
                if (!job) return;
                urlJobLoaded.current = true;
                handleSelectJob(job);
            }, [jobLibrary, user]);

          const getNextPONumber = async () => {
    if (!user || !currentJobId) {
        setMessage('Error: Job not selected');
        return null;
    }
    try {
        const jobDoc = await db.collection('jobs').doc(currentJobId).get();
        const currentCounter = (jobDoc.data()?.poCounter || 0) + 1;
        
        // Update counter in Firebase
        await db.collection('jobs').doc(currentJobId).update({
            poCounter: currentCounter
        });
        
        // Format: JobCode-001
        const poNumber = `${jobCode}-${String(currentCounter).padStart(3, '0')}`;
        return poNumber;
    } catch (error) {
        setMessage('Error generating PO number: ' + error.message);
        return null;
    }
};

          const handleGeneratePDF = async () => {
    // New PO or edited PO: always today's job (job record) and Super (Customer Information card). An edit keeps the old ones in history.
    const header = {
        jobCode, jobAddress, cityStateZip, lockBox, superName, superEmail, superPhone
    };
    if (!currentJobId || !header.jobCode) {
        setMessage('Pick a job first');
        return;
    }
    if (!header.superName) {
        setMessage('This job has no Super. Set it on Customer Information.');
        return;
    }
    if (!formMetadata.subName || !formMetadata.category) {
        setMessage('Subcontractor and Category required');
        return;
    }
    setUploadLoading(true);
    try {
        const poNumber = editingPO ? editingPO.poNumber : await getNextPONumber();
        if (!poNumber) { setUploadLoading(false); return; }

        const response = await fetch(TEMPLATE_PDF_URL);
        const arrayBuffer = await response.arrayBuffer();
        const pdfDoc = await PDFDocument.load(arrayBuffer);
        const form = pdfDoc.getForm();

        // Amount always shown as $12,345.00 (typed with or without $ or commas)
        const rawAmount = (formMetadata.contractAmount || '').replace(/[^0-9.]/g, '');
        const amountNoSign = rawAmount && !isNaN(parseFloat(rawAmount))
            ? parseFloat(rawAmount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            : '';
        const amountDisplay = amountNoSign ? `$${amountNoSign}` : '';

        // PDF form field name -> value
        const values = {
            'Job Code': header.jobCode,
            'Job Address': header.jobAddress,
            'City State Zip': header.cityStateZip,
            'Lock Box': header.lockBox,
            'PO': poNumber,
            'Super': header.superName,
            'Email': header.superEmail,
            'Super Phone': header.superPhone,
            'Subcontractor': formMetadata.subName,
            'Contact': formMetadata.contact,
            'Phone': formMetadata.phone,
            'Email_2': formMetadata.email,
            'Sub Code': formMetadata.subCode,
            'Category': formMetadata.category,
            'Contract Amount': amountDisplay,
            'Text1': formMetadata.scope
        };
        // Match on name with extra spaces ignored (e.g. "City  State  Zip")
        form.getFields().forEach(field => {
            const name = field.getName().replace(/\s+/g, ' ').trim();
            if (values[name] !== undefined && field.setText) {
                field.setText(values[name] || '');
            }
        });

        // Add attachment pages after the PO page, in list order
        for (const att of attachments) {
            const bytes = att.file ? await att.file.arrayBuffer() : await (await fetch(att.url)).arrayBuffer();
            if (att.type === 'application/pdf') {
                const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
                try { src.getForm().flatten(); } catch (e) { /* no form fields */ }
                const pages = await pdfDoc.copyPages(src, src.getPageIndices());
                pages.forEach(p => pdfDoc.addPage(p));
            } else {
                const img = att.type === 'image/png' ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
                const page = pdfDoc.addPage([612, 792]); // letter size
                const scale = Math.min(540 / img.width, 720 / img.height, 1);
                const w = img.width * scale, h = img.height * scale;
                page.drawImage(img, { x: (612 - w) / 2, y: (792 - h) / 2, width: w, height: h });
            }
        }

        const pdfBytes = await pdfDoc.save();

        // Save new attachment files so Edit PO can rebuild with them
        const savedAttachments = [];
        for (const att of attachments) {
            if (att.file) {
                const attRef = storage.ref(`jobForms/${currentJobId}/att_${Date.now()}_${att.name}`);
                await attRef.put(att.file);
                savedAttachments.push({ name: att.name, type: att.type, url: await attRef.getDownloadURL() });
            } else {
                savedAttachments.push({ name: att.name, type: att.type, url: att.url });
            }
        }

        // File name built from form data
        const d = new Date();
        const dateStr = `${d.getMonth() + 1}-${d.getDate()}-${String(d.getFullYear()).slice(-2)}`;
        const clean = (t) => (t || '').trim().replace(/[\/\\]/g, '-').replace(/\s+/g, '-');
        const fileName = `${clean(formMetadata.category)}_${clean(formMetadata.subName)}_$${clean(amountNoSign)}_${poNumber}_${dateStr}.pdf`;

        const fileRef = storage.ref(`jobForms/${currentJobId}/${Date.now()}_${fileName}`);
        await fileRef.put(new Blob([pdfBytes], { type: 'application/pdf' }));
        const downloadURL = await fileRef.getDownloadURL();

        const poData = {
            fileName: fileName,
            pdfUrl: downloadURL,
            poNumber: poNumber,
            subName: formMetadata.subName,
            category: formMetadata.category,
            contact: formMetadata.contact,
            phone: formMetadata.phone,
            email: formMetadata.email,
            subCode: formMetadata.subCode,
            contractAmount: formMetadata.contractAmount,
            scope: formMetadata.scope || '',
            header: header,
            attachments: savedAttachments,
            pdfUpdatedAt: new Date(),
            dateUpdated: new Date()
        };
        const formsRef = db.collection('jobs').doc(currentJobId).collection('forms');
        const byMe = { uid: user.uid, name: (profile && profile.name) || user.email };

        if (editingPO) {
            // Update same row (notes/status kept). The previous version is kept in history; old files are NOT deleted.
            const prev = {
                fileName: editingPO.fileName || '',
                pdfUrl: editingPO.pdfUrl || '',
                poNumber: editingPO.poNumber || '',
                subName: editingPO.subName || '',
                category: editingPO.category || '',
                contractAmount: editingPO.contractAmount || '',
                scope: editingPO.scope || '',
                attachments: editingPO.attachments || [],
                header: editingPO.header || null,
                savedAt: editingPO.pdfUpdatedAt || editingPO.dateCreated || null,
                savedBy: editingPO.editedBy || editingPO.createdBy || null,
                replacedAt: new Date(),
                replacedBy: byMe
            };
            await formsRef.doc(editingPO.id).update({
                ...poData, editedBy: byMe, editedAt: new Date(),
                versions: firebase.firestore.FieldValue.arrayUnion(prev)
            });
            setEditingPO(null);
            setMessage(`PO updated: ${fileName}`);
        } else {
            await formsRef.add({ ...poData, notes: '', status: 'New', dateCreated: new Date(), createdBy: byMe });
            setMessage(`PO created and saved to job: ${fileName}`);
        }

        setCurrentPO(poNumber);
        setFormMetadata({ subName: '', category: '', contact: '', phone: '', email: '', subCode: '', contractAmount: '', scope: '' });
        setAttachments([]);
        setPoWindow(false);
        setShowTemplates(false);
    } catch (error) {
        setMessage('Error creating PO: ' + error.message);
    }
    setUploadLoading(false);
};

            const handleUseTemplate = (t) => {
                setFormMetadata({
                    subName: t.subName || '', category: t.category || '', contact: t.contact || '',
                    phone: t.phone || '', email: t.email || '', subCode: t.subCode || '',
                    contractAmount: t.contractAmount || '', scope: t.scope || ''
                });
                setMessage(`Template loaded: ${t.subName} | ${t.category}`);
                setShowTemplates(false);
            };

            // Voice to text (Chrome/Edge). target = 'scope' or a tracker row id; onText gets each spoken phrase
            const toggleVoice = (target, onText) => {
                if (listening) {
                    recognitionRef.current && recognitionRef.current.stop();
                    if (listening === target) return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setMessage('Voice input not supported in this browser (use Chrome or Edge)'); return; }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.continuous = true;
                rec.interimResults = false;
                rec.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) text += e.results[i][0].transcript;
                    }
                    if (text) onText(text.trim());
                };
                rec.onerror = (e) => { setMessage('Voice input error: ' + e.error); };
                rec.onend = () => setListening(prev => (prev === target ? null : prev));
                recognitionRef.current = rec;
                rec.start();
                setListening(target);
            };

            const capLines = (t) => (t || '').replace(/(^|\n)(\s*)([a-z])/g, (m, nl, sp, c) => nl + sp + c.toUpperCase());

            // Capitalize line starts in a textbox as you type, without moving the cursor
            const capInPlace = (el) => {
                const fixed = capLines(el.value);
                if (fixed !== el.value) {
                    const start = el.selectionStart, end = el.selectionEnd;
                    el.value = fixed;
                    el.setSelectionRange(start, end);
                }
                return fixed;
            };

            // Put spoken text where the cursor is in a textbox; returns new text + cursor spot
            const insertAtCursor = (el, text) => {
                const cur = el.value || '';
                const pos = el.selectionStart ?? cur.length;
                const before = cur.slice(0, pos), after = cur.slice(pos);
                const sepBefore = before && !/[\s]$/.test(before) ? ' ' : '';
                const sepAfter = after && !/^[\s]/.test(after) ? ' ' : '';
                const value = capLines(before + sepBefore + text + sepAfter + after);
                return { value, pos: (before + sepBefore + text).length };
            };

            const voiceInto = (ref, setText) => (text) => {
                const el = ref.current;
                if (!el) return;
                const { value, pos } = insertAtCursor(el, text);
                setText(value);
                setTimeout(() => { el.focus(); el.setSelectionRange(pos, pos); }, 0);
            };

            const toggleScopeVoice = () => toggleVoice('scope',
                voiceInto(scopeRef, v => setFormMetadata(prev => ({ ...prev, scope: v }))));

            const toggleNoteVoice = () => toggleVoice('note',
                voiceInto(noteRef, v => setNoteModal(prev => prev ? { ...prev, text: v } : prev)));

            const closeNoteModal = () => {
                if (listening === 'note' && recognitionRef.current) recognitionRef.current.stop();
                setNoteModal(null);
            };

            const saveNoteModal = async () => {
                await handleUpdateForm(noteModal.form.id, { notes: noteModal.text });
                closeNoteModal();
            };

            const handleEditPO = (form) => {
                setEditingPO(form);
                setAttachments(form.attachments || []);
                setFormMetadata({
                    subName: form.subName || '', category: form.category || '', contact: form.contact || '',
                    phone: form.phone || '', email: form.email || '', subCode: form.subCode || '',
                    contractAmount: form.contractAmount || '', scope: form.scope || ''
                });
                setMessage('');
                setShowTemplates(false);
                setPoWindow(true);
            };

            const handleAddAttachments = (e) => {
                const allowed = ['application/pdf', 'image/png', 'image/jpeg'];
                const files = Array.from(e.target.files || []);
                const bad = files.filter(f => !allowed.includes(f.type));
                if (bad.length) setMessage('Skipped (only PDF, JPG, PNG): ' + bad.map(f => f.name).join(', '));
                setAttachments(prev => [...prev, ...files.filter(f => allowed.includes(f.type)).map(f => ({ name: f.name, type: f.type, file: f }))]);
                e.target.value = '';
            };

            const moveAttachment = (i, dir) => {
                setAttachments(prev => {
                    const list = [...prev];
                    const j = i + dir;
                    if (j < 0 || j >= list.length) return prev;
                    [list[i], list[j]] = [list[j], list[i]];
                    return list;
                });
            };

            const removeAttachment = (i) => setAttachments(prev => prev.filter((_, k) => k !== i));

            const handleCancelEditPO = () => {
                setEditingPO(null);
                setAttachments([]);
                setFormMetadata({ subName: '', category: '', contact: '', phone: '', email: '', subCode: '', contractAmount: '', scope: '' });
                setMessage('');
            };

            // Make New PO: open the window with a blank form (POs made here start as New)
            const openNewPO = () => {
                handleCancelEditPO();
                setShowTemplates(false);
                setPoWindow(true);
            };
            // Cancel: close the window; ask first if anything was typed or changed
            const closePoWindow = () => {
                const f = formMetadata;
                const typed = editingPO
                    ? ['subName', 'category', 'contact', 'phone', 'email', 'subCode', 'contractAmount', 'scope'].some(k => (f[k] || '') !== (editingPO[k] || ''))
                        || (attachments || []).length !== (editingPO.attachments || []).length || attachments.some(a => a.file)
                    : Object.values(f).some(v => (v || '').trim()) || attachments.length > 0;
                if (typed && !window.confirm('Close and drop what you typed?')) return;
                if (listening === 'scope' && recognitionRef.current) recognitionRef.current.stop();
                handleCancelEditPO();
                setShowTemplates(false);
                setPoWindow(false);
            };

            const fmtTime = (ts) => {
                const d = ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
                return d ? d.toLocaleString('en-US', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
            };

            const handleSendToSub = async (form) => {
                if (!form.email) return;
                if (form.lastEmail && !window.confirm(`Already sent on ${fmtTime(form.lastEmail.sentAt)} to ${form.lastEmail.to} — send again?`)) return;
                setSendingId(form.id);
                try {
                    await functions.httpsCallable('sendPOEmail')({ jobId: currentJobId, formId: form.id });
                    setMessage(`PO ${form.poNumber} sent to ${form.email}`);
                } catch (error) {
                    setMessage('Error sending email: ' + error.message);
                }
                setSendingId(null);
            };

            // Save notes/status straight from the tracker row
            const handleUpdateForm = async (formId, fields) => {
                if (!currentJobId) return;
                try {
                    await db.collection('jobs').doc(currentJobId).collection('forms').doc(formId).update({ ...fields, dateUpdated: new Date() });
                } catch (error) {
                    setMessage('Error updating form: ' + error.message);
                }
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">LOGIN</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) {
                return <div className="section">Loading...</div>;
            }

            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">WAITING FOR APPROVAL</div>
                        <p>Your account is waiting for approval. An admin will set up your access.</p>
                    </div>
                );
            }

            if (profile && profile.role === 'office') {
                return (
                    <div className="section">
                        <div className="section-title">PO MANAGER</div>
                        <p>No access. PO Manager is for Owner, Admin, Estimator and Super. Contact an admin.</p>
                    </div>
                );
            }

            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">ACCOUNT NOT SET UP</div>
                        <p>Your account doesn't have access. Contact an admin.</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="section">
                        <div className="section-title">JOB DETAILS</div>


                        {jobLibrary.length > 0 && (
                            <div className="form-group">
                                <label>Job</label>
                                <select
                                    value={currentJobId}
                                    onChange={e => pickJob(e.target.value)}
                                    style={{ padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                >
                                    <option value="">-- Pick a job --</option>
                                    {jobLibrary.map(job => (
                                        <option key={job.id} value={job.id}>{job.code} - {job.address}</option>
                                    ))}
                                </select>
                            </div>
                        )}

                        {currentJobId ? (
                            <div className="form-group" style={{ fontSize: '14px', lineHeight: 1.6 }}>
                                <div><strong>{jobCode}</strong></div>
                                <div>{[jobAddress, cityStateZip].filter(Boolean).join(', ') || 'No address on Customer Information.'}</div>
                                <div>Lock box: {lockBox || '(none)'}</div>
                            </div>
                        ) : (
                            <div style={{ fontSize: '13px', color: '#666' }}>Pick a job. Jobs are added and changed on Customer Information.</div>
                        )}
                    </div>

                    <div className="section">
                        <div className="section-title">SUPERVISOR</div>

                        {!currentJobId ? (
                            <div style={{ fontSize: '13px', color: '#666' }}>Pick a job to see its Super.</div>
                        ) : superName ? (
                            <div className="form-group" style={{ fontSize: '14px', lineHeight: 1.6 }}>
                                <div><strong>{superName}</strong></div>
                                <div style={{ fontSize: '13px', color: '#666' }}>{[superPhone, superEmail].filter(Boolean).join(' | ') || 'No phone or email on Customer Information.'}</div>
                            </div>
                        ) : (
                            <div style={{ fontSize: '13px', color: '#666' }}>Not picked. Set it on Customer Information.</div>
                        )}
                        {teamError && <div className="error">{teamError}</div>}
                    </div>

                    {currentJobId && (
                        <div className="section">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div className="section-title" style={{ margin: 0 }}>PO TRACKER</div>
                                <button className="btn-primary" style={{ width: 'auto', padding: '8px 16px', marginTop: 0 }} onClick={openNewPO}>+ Make New PO</button>
                            </div>
                            {!poWindow && message && <div style={{ marginTop: '10px', padding: '8px', textAlign: 'center', color: message.includes('Error') || message.includes('no Super') || message.includes('required') ? '#d32f2f' : '#388e3c', fontWeight: 500 }}>{message}</div>}
                            {jobForms.filter(f => f.deleted !== true).length === 0 && <div style={{ fontSize: '13px', color: '#666', marginTop: '12px' }}>No POs on this job yet.</div>}
                            <table>
                                <thead>
                                    <tr>
                                        <th>File</th>
                                        <th>Notes</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...jobForms]
                                        .filter(form => form.deleted !== true) // POs hidden before Oct 24 stay hidden
                                        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.fileName || '').localeCompare(b.fileName || ''))
                                        .map(form => {
                                            // New = made in PO Manager, CES = from the Trades-EST handoff (or set by hand), Revised = changed by the Super.
                                            // Older records: Complete shows as CES, Pending (or none) as New.
                                            const status = ['CES', 'Complete', 'Completed'].includes(form.status) ? 'CES'
                                                : form.status === 'Revised' ? 'Revised' : 'New';
                                            return (
                                                <tr key={form.id}>
                                                    <td>
                                                        {form.fileName}
                                                        {(form.createdBy || form.editedBy) && (
                                                            <div style={{ fontSize: '11px', color: '#888', marginTop: '2px' }}>
                                                                {[
                                                                    form.createdBy && `Created by ${form.createdBy.name}`,
                                                                    form.editedBy && `Edited by ${form.editedBy.name} ${form.editedAt && form.editedAt.toDate ? form.editedAt.toDate().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }) : ''}`
                                                                ].filter(Boolean).join(' · ')}
                                                            </div>
                                                        )}
                                                        {(form.versions || []).length > 0 && (
                                                            <div style={{ fontSize: '11px', marginTop: '2px' }}>
                                                                <span style={{ color: '#0066cc', cursor: 'pointer' }}
                                                                    onClick={() => setOpenVersions(openVersions === form.id ? null : form.id)}>
                                                                    {openVersions === form.id ? 'Hide versions' : `Versions (${form.versions.length})`}
                                                                </span>
                                                                {openVersions === form.id && [...form.versions].reverse().map((v, i) => (
                                                                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '3px 0', borderTop: '1px solid #f0f0f0', color: '#555' }}>
                                                                        <span style={{ flex: 1, wordBreak: 'break-all' }}>
                                                                            {v.fileName}
                                                                            <span style={{ color: '#888' }}>{' · replaced ' + fmtTime(v.replacedAt) + (v.replacedBy ? ' by ' + v.replacedBy.name : '')}</span>
                                                                        </span>
                                                                        {v.pdfUrl && <button className="btn-secondary btn-sm" style={{ width: 'auto' }} onClick={() => window.open(v.pdfUrl)}>View</button>}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td>
                                                        <button type="button" className="btn-secondary btn-sm"
                                                            onClick={() => setNoteModal({ form, text: form.notes || '' })}
                                                            title={form.notes || ''}
                                                            style={{ width: 'auto', textAlign: 'left', maxWidth: '180px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                                            📝 {form.notes ? form.notes.split('\n')[0] : 'Add note'}
                                                        </button>
                                                    </td>
                                                    <td>
                                                        {['New', 'CES', 'Revised'].map(st => (
                                                            <label key={st} style={{ display: 'flex', alignItems: 'center', gap: '4px', margin: 0, fontWeight: 'normal', whiteSpace: 'nowrap' }}>
                                                                <input type="radio" name={'status-' + form.id} checked={status === st}
                                                                    onChange={() => handleUpdateForm(form.id, { status: st })} style={{ width: 'auto', margin: 0 }} />
                                                                {st}
                                                            </label>
                                                        ))}
                                                    </td>
                                                    <td>
                                                        <div className="button-group" style={{ gap: '4px' }}>
                                                            {form.poNumber && <button className="btn-secondary btn-sm" onClick={() => handleEditPO(form)}>Edit PO</button>}
                                                            <button className="btn-secondary btn-sm" onClick={() => window.open(form.pdfUrl)}>View</button>
                                                        </div>
                                                        {form.poNumber && (
                                                            <button className="btn-primary btn-sm" style={{ width: 'auto', marginTop: '4px' }}
                                                                onClick={() => handleSendToSub(form)}
                                                                disabled={!form.email || sendingId === form.id}
                                                                title={form.email ? `Email to ${form.email}` : 'No sub email on this PO'}>
                                                                {sendingId === form.id ? 'Sending...' : 'Send to Sub'}
                                                            </button>
                                                        )}
                                                        {form.lastEmail && (() => {
                                                            const e = form.lastEmail;
                                                            const color = e.status === 'Delivered' ? '#388e3c' : e.status === 'Bounced' ? '#d32f2f' : '#555';
                                                            const label = e.status === 'Delivered' ? `Delivered ${fmtTime(e.statusAt)} ✓`
                                                                : e.status === 'Bounced' ? `Bounced ${fmtTime(e.statusAt)} ✗`
                                                                : `Sent ${fmtTime(e.sentAt)}`;
                                                            const changed = form.pdfUpdatedAt && e.sentAt && form.pdfUpdatedAt.toMillis() > e.sentAt.toMillis();
                                                            const history = (form.emailHistory || []).map(h =>
                                                                `${h.to} | Sent ${fmtTime(h.sentAt)} | ${h.status}${h.statusAt ? ' ' + fmtTime(h.statusAt) : ''}${h.detail ? ' (' + h.detail + ')' : ''}`).join('\n');
                                                            return (
                                                                <div title={history} style={{ fontSize: '11px', marginTop: '4px', cursor: 'help' }}>
                                                                    <div style={{ color, fontWeight: 600 }}>{label}</div>
                                                                    {changed && <div style={{ color: '#cc6600', fontWeight: 600 }}>Changed since sent</div>}
                                                                </div>
                                                            );
                                                        })()}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {poWindow && (
                        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', zIndex: 1000, overflowY: 'auto', padding: '30px 0' }}>
                            <div style={{ background: 'white', borderRadius: '8px', padding: '20px', width: '90%', maxWidth: '700px', boxShadow: '0 4px 20px rgba(0,0,0,0.3)' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px' }}>
                                    <div style={{ fontWeight: 700, fontSize: '16px' }}>{editingPO ? `Edit PO ${editingPO.poNumber}` : `New PO for ${jobCode}`}</div>
                                    {!editingPO && <button type="button" className="btn-secondary" style={{ width: 'auto', marginTop: 0 }} onClick={() => setShowTemplates(!showTemplates)}>{showTemplates ? 'Hide templates' : '📋 Pick a template'}</button>}
                                </div>
                                <div style={{ fontSize: '12px', color: '#666', margin: '4px 0 12px' }}>Super: {superName || '(none on Customer Information)'}{editingPO ? '' : ' · Starts as New'}</div>
                                {showTemplates && !editingPO && (
                                    <div style={{ border: '1px solid #ddd', borderRadius: '6px', padding: '8px', marginBottom: '12px', background: '#fafafa', maxHeight: '300px', overflowY: 'auto' }}>
                                        {formLibraryData.length === 0 ? <div style={{ fontSize: '13px', color: '#666' }}>No templates yet. Templates are saved from Trades-EST.</div> : (
                                            <table style={{ marginTop: 0 }}>
                                                <thead><tr><th>Category</th><th>Subcontractor</th><th>Amount</th><th></th></tr></thead>
                                                <tbody>
                                                    {[...formLibraryData]
                                                        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.subName || '').localeCompare(b.subName || ''))
                                                        .map(t => (
                                                            <tr key={t.id}>
                                                                <td>{t.category}</td>
                                                                <td>{t.subName}</td>
                                                                <td>{t.contractAmount || '-'}</td>
                                                                <td><button className="btn-secondary btn-sm" style={{ marginTop: 0 }} onClick={() => handleUseTemplate(t)}>Use</button></td>
                                                            </tr>
                                                        ))}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                )}
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 12px' }}>
                        <div className="form-group"><label>Subcontractor</label>
                            <input value={formMetadata.subName || ''} onChange={e => setFormMetadata({ ...formMetadata, subName: e.target.value })} /></div>
                        <div className="form-group"><label>Contact</label>
                            <input value={formMetadata.contact || ''} onChange={e => setFormMetadata({ ...formMetadata, contact: e.target.value })} /></div>
                        <div className="form-group"><label>Phone</label>
                            <input value={formMetadata.phone || ''} onChange={e => setFormMetadata({ ...formMetadata, phone: e.target.value })} /></div>
                        <div className="form-group"><label>Email</label>
                            <input value={formMetadata.email || ''} onChange={e => setFormMetadata({ ...formMetadata, email: e.target.value })} /></div>
                        <div className="form-group"><label>Sub Code</label>
                            <input value={formMetadata.subCode || ''} onChange={e => setFormMetadata({ ...formMetadata, subCode: e.target.value })} /></div>
                        <div className="form-group"><label>Category</label>
                            <input value={formMetadata.category || ''} onChange={e => setFormMetadata({ ...formMetadata, category: e.target.value })} /></div>
                        <div className="form-group"><label>Contract Amount</label>
                            <input value={formMetadata.contractAmount || ''} onChange={e => setFormMetadata({ ...formMetadata, contractAmount: e.target.value })} /></div>
                        </div>
                        <div className="form-group"><label>Scope of Work
                            <button type="button" className={listening === 'scope' ? 'btn-danger btn-sm' : 'btn-secondary btn-sm'} onClick={toggleScopeVoice} style={{ width: 'auto', marginLeft: '10px' }}>
                                {listening === 'scope' ? '■ Stop' : '🎤 Voice'}
                            </button></label>
                            <textarea ref={scopeRef} rows="8" value={formMetadata.scope || ''} onChange={e => { const v = capInPlace(e.target); setFormMetadata({ ...formMetadata, scope: v }); }} /></div>

                        <div className="form-group">
                            <label>Attachments (added after the PO page)
                                <label className="btn-secondary btn-sm" style={{ display: 'inline-block', width: 'auto', marginLeft: '10px', cursor: 'pointer' }}>
                                    + Add Files
                                    <input type="file" multiple accept="application/pdf,image/png,image/jpeg" onChange={handleAddAttachments} style={{ display: 'none' }} />
                                </label>
                            </label>
                            {attachments.length === 0 && <div style={{ fontSize: '12px', color: '#888' }}>No attachments (PDF, JPG, PNG)</div>}
                            {attachments.map((att, i) => (
                                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '4px 0', borderBottom: '1px solid #eee', fontSize: '13px' }}>
                                    <span style={{ width: '20px', color: '#888' }}>{i + 1}.</span>
                                    <span style={{ flex: 1, wordBreak: 'break-all' }}>{att.name}</span>
                                    <button type="button" className="btn-secondary btn-sm" style={{ width: 'auto' }} onClick={() => moveAttachment(i, -1)} disabled={i === 0}>↑</button>
                                    <button type="button" className="btn-secondary btn-sm" style={{ width: 'auto' }} onClick={() => moveAttachment(i, 1)} disabled={i === attachments.length - 1}>↓</button>
                                    <button type="button" className="btn-danger btn-sm" style={{ width: 'auto' }} onClick={() => removeAttachment(i)}>✕</button>
                                </div>
                            ))}
                        </div>

                                {message && <div style={{ marginTop: '10px', padding: '8px', textAlign: 'center', color: message.includes('Error') || message.includes('no Super') || message.includes('required') ? '#d32f2f' : '#388e3c', fontWeight: 500 }}>{message}</div>}
                                <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
                                    <div style={{ flex: 1 }} />
                                    <button type="button" className="btn-secondary" style={{ width: 'auto' }} onClick={closePoWindow} disabled={uploadLoading}>Cancel</button>
                                    <button type="button" className="btn-primary" style={{ width: 'auto' }} onClick={handleGeneratePDF} disabled={uploadLoading || !currentJobId}>
                                        {uploadLoading ? 'Saving...' : (editingPO ? 'Save Changes to PO' : 'Create PO & Save to Job')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {noteModal && (
                        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
                            <div style={{ background: 'white', borderRadius: '8px', padding: '20px', width: '90%', maxWidth: '700px', boxShadow: '0 4px 20px rgba(0,0,0,0.3)' }}>
                                <div style={{ fontWeight: 700, marginBottom: '4px' }}>Notes</div>
                                <div style={{ fontSize: '12px', color: '#666', marginBottom: '10px', wordBreak: 'break-all' }}>{noteModal.form.fileName}</div>
                                <textarea
                                    ref={noteRef}
                                    rows="15"
                                    autoFocus
                                    value={noteModal.text}
                                    onChange={e => { const v = capInPlace(e.target); setNoteModal(prev => ({ ...prev, text: v })); }}
                                    placeholder="Type or use Voice..."
                                    style={{ width: '100%' }}
                                />
                                <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                                    <button type="button" className={listening === 'note' ? 'btn-danger' : 'btn-secondary'} onClick={toggleNoteVoice} style={{ width: 'auto' }}>
                                        {listening === 'note' ? '■ Stop' : '🎤 Voice'}
                                    </button>
                                    <div style={{ flex: 1 }} />
                                    <button type="button" className="btn-secondary" onClick={closeNoteModal} style={{ width: 'auto' }}>Cancel</button>
                                    <button type="button" className="btn-primary" onClick={saveNoteModal} style={{ width: 'auto' }}>Save</button>
                                </div>
                            </div>
                        </div>
                    )}


                </div>
            );
        }

        ReactDOM.render(<POApp />, document.getElementById('app'));
    </script>
</body>
</html>
