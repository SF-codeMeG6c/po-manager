<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPM Tool - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        .hint { font-size: 11px; color: #888; margin-top: 3px; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f5f5; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPM Tool</h1>
        <p class="subtitle">Freeman Restoration starting-point Gross Produced Margin</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Same Firebase project as PO Manager
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const GPM_ROLES = ['owner', 'admin', 'estimator'];
        const DEFAULT_DATE_NOTE = 'or 5 days after permit issued';

        // Money/percent fields: typed as text, saved as numbers
        const NUMBER_FIELDS = ['settlementAmount', 'deductible', 'paFeePct', 'dwellingTotal', 'otherStructuresTotal', 'codeUpgradeTotal', 'customerItems'];

        const BLANK_INPUTS = {
            settlementAmount: '', settlementDate: '', deductible: '', paFeePct: '10',
            dwellingTotal: '', otherStructuresTotal: '', codeUpgradeTotal: '', customerItems: '',
            agreementDate: '',
            startDate: '', startNote: DEFAULT_DATE_NOTE,
            completionDate: '', completionNote: DEFAULT_DATE_NOTE
        };

        // "$1,234.56" or "1234.56" -> 1234.56 ; blank -> null
        const toNumber = (t) => {
            const s = String(t ?? '').replace(/[^0-9.]/g, '');
            if (!s) return null;
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
        };
        const fmtMoney = (n) => n === null || n === undefined ? '' :
            Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // Company-wide rates (fixed, not per job)
        const IN_HOUSE_LABOR_PCT = 0.135;
        const TARGET_GPM = 0.28;

        const $ = (n) => (n < 0 ? '($' + fmtMoney(-n) + ')' : '$' + fmtMoney(n));
        const pct = (n) => (n * 100).toFixed(1) + '%';

        // All GPM math in one place. Returns null until settlement and estimate are entered.
        const calcGPM = (inputs, poTotal) => {
            const settlement = toNumber(inputs.settlementAmount) || 0;
            const deductible = toNumber(inputs.deductible) || 0;
            const pa = (toNumber(inputs.paFeePct) || 0) / 100;
            const ce = (toNumber(inputs.dwellingTotal) || 0) + (toNumber(inputs.otherStructuresTotal) || 0) + (toNumber(inputs.codeUpgradeTotal) || 0);
            const customerItems = toNumber(inputs.customerItems) || 0;
            if (!settlement || !ce) return null;

            const netSettlement = settlement - deductible;
            const settlementPAFee = netSettlement * pa;
            const settlementAfterPA = netSettlement - settlementPAFee;
            const over = ce > netSettlement;
            // PA fee: on net settlement when over, on Customer Estimate when under
            const paFee = over ? settlementPAFee : ce * pa;
            const sellingPrice = ce - paFee - customerItems; // amount due Freeman Restoration
            const inHouseLabor = sellingPrice * IN_HOUSE_LABOR_PCT;
            const jobCost = poTotal + inHouseLabor;
            const grossProfit = sellingPrice - jobCost;
            const gpm = sellingPrice ? grossProfit / sellingPrice : 0;
            const difference = sellingPrice - settlementAfterPA; // + customer pays extra, - customer credit

            return { settlement, deductible, pa, ce, netSettlement, settlementPAFee, settlementAfterPA, over,
                     paFee, customerItems, sellingPrice, poTotal, inHouseLabor, jobCost, grossProfit, gpm, difference };
        };

        function GPMApp() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, false = no access, object = allowed
            const [authError, setAuthError] = useState('');

            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [inputs, setInputs] = useState(BLANK_INPUTS);
            const [dirty, setDirty] = useState(false);
            const [lastSaved, setLastSaved] = useState(null); // { name, at }
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [pos, setPos] = useState([]);              // this job's POs from PO Manager (read-only)
            const [excludedPoIds, setExcludedPoIds] = useState([]);

            // Live, read-only list of the picked job's POs
            useEffect(() => {
                setPos([]);
                if (!jobId) return;
                const unsub = db.collection('jobs').doc(jobId).collection('forms').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, poNumber: d.poNumber || '', category: d.category || '', subName: d.subName || '',
                                    status: d.status || 'Pending', amount: toNumber(d.contractAmount) });
                    });
                    list.sort((a, b) => a.category.localeCompare(b.category) || a.poNumber.localeCompare(b.poNumber));
                    setPos(list);
                }, error => setMessage('Error loading POs: ' + error.message));
                return () => unsub();
            }, [jobId]);

            useEffect(() => {
                auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) return;
                    try {
                        // Read-only check. New users get their pending record from PO Manager, not here.
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && GPM_ROLES.includes(d.role)) {
                            setProfile({ uid: currentUser.uid, ...d });
                        } else {
                            setProfile(false);
                        }
                    } catch (err) {
                        setProfile(false);
                    }
                });
            }, []);

            // Job list (read-only, same jobs as PO Manager)
            useEffect(() => {
                if (!profile) return;
                const unsub = db.collection('jobs').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, code: d.code || '', address: d.address || '', archived: d.archived === true });
                    });
                    list.sort((a, b) => a.code.localeCompare(b.code));
                    setJobs(list);
                }, error => setMessage('Error loading jobs: ' + error.message));
                return () => unsub();
            }, [profile]);

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = () => auth.signOut();

            // Pick a job: load its saved GPM inputs, or start blank
            const handlePickJob = async (id) => {
                if (dirty && !window.confirm('You have unsaved changes. Switch jobs anyway?')) return;
                setJobId(id);
                setDirty(false);
                setMessage('');
                setLastSaved(null);
                setExcludedPoIds([]);
                if (!id) { setInputs(BLANK_INPUTS); return; }
                try {
                    const snap = await db.collection('gpm').doc(id).get();
                    if (!snap.exists) { setInputs(BLANK_INPUTS); return; }
                    const d = snap.data();
                    setExcludedPoIds(Array.isArray(d.excludedPoIds) ? d.excludedPoIds : []);
                    const loaded = { ...BLANK_INPUTS };
                    Object.keys(BLANK_INPUTS).forEach(k => {
                        if (d[k] === undefined || d[k] === null) return;
                        loaded[k] = NUMBER_FIELDS.includes(k) && k !== 'paFeePct' ? fmtMoney(d[k]) : String(d[k]);
                    });
                    setInputs(loaded);
                    if (d.updatedAt) setLastSaved({ name: d.updatedBy?.name || '', at: d.updatedAt.toDate() });
                } catch (error) {
                    setMessage('Error loading GPM data: ' + error.message);
                }
            };

            const setField = (k, v) => { setInputs(prev => ({ ...prev, [k]: v })); setDirty(true); };

            const toggleInclude = (poId, include) => {
                setExcludedPoIds(prev => include ? prev.filter(id => id !== poId) : [...prev, poId]);
                setDirty(true);
            };

            const handleSave = async () => {
                if (!jobId) return;
                const job = jobs.find(j => j.id === jobId);
                const data = {};
                Object.keys(BLANK_INPUTS).forEach(k => {
                    data[k] = NUMBER_FIELDS.includes(k) ? toNumber(inputs[k]) : (inputs[k] || '').trim();
                });
                const byMe = { uid: user.uid, name: profile.name || user.email };
                setSaving(true);
                try {
                    await db.collection('gpm').doc(jobId).set({
                        ...data,
                        excludedPoIds,
                        jobCode: job ? job.code : '',
                        updatedBy: byMe,
                        updatedAt: new Date()
                    }, { merge: true });
                    setDirty(false);
                    setLastSaved({ name: byMe.name, at: new Date() });
                    setMessage('Saved');
                } catch (error) {
                    setMessage('Error saving: ' + error.message);
                }
                setSaving(false);
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">LOGIN</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) {
                return <div className="section"><p>Loading...</p></div>;
            }

            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">NO ACCESS</div>
                        <p>Signed in as {user.email}. The GPM Tool is only for Owner, Admin and Estimator. Contact an admin if you need access.</p>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>
                );
            }

            const visibleJobs = jobs.filter(j => showArchived || !j.archived || j.id === jobId);

            const field = (k, labelText, hint, type = 'text') => (
                <div className="form-group">
                    <label>{labelText}</label>
                    <input type={type} value={inputs[k]} onChange={e => setField(k, e.target.value)} />
                    {hint && <div className="hint">{hint}</div>}
                </div>
            );

            return (
                <div>
                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                            <p style={{ margin: 0 }}>Signed in as {profile.name || user.email} ({profile.role})</p>
                            <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                        </div>

                        <div className="section-title">JOB</div>
                        <div className="form-group">
                            <select value={jobId} onChange={e => handlePickJob(e.target.value)}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code}{j.address ? ' - ' + j.address : ''}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                        </div>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontWeight: 'normal' }}>
                            <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} style={{ width: 'auto' }} />
                            Show archived jobs
                        </label>
                    </div>

                    {jobId && (<>
                        <div className="section">
                            <div className="section-title">SETTLEMENT</div>
                            <div className="grid">
                                {field('settlementAmount', 'Settlement amount', 'Total Insurance Obligated to pay, from the statement')}
                                {field('settlementDate', 'Settlement date', null, 'date')}
                                {field('deductible', 'Deductible', 'Enter as a positive number')}
                                {field('paFeePct', 'PA fee %', 'Enter 10 for 10%. Enter 0 if no PA.')}
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">XACTIMATE TOTALS</div>
                            <div className="grid">
                                {field('dwellingTotal', 'Dwelling estimate (Replacement Cost Value)')}
                                {field('otherStructuresTotal', 'Other structures estimate')}
                                {field('codeUpgradeTotal', 'Code upgrade estimate')}
                                {field('customerItems', 'Items paid by customer', 'Enter as a positive number. Lowers the amount due Freeman.')}
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">COVER PAGE DATES</div>
                            <div className="grid">
                                {field('agreementDate', 'Agreement date', 'Used for both "agreement dated" lines', 'date')}
                                <div />
                                {field('startDate', 'Proposed start date', null, 'date')}
                                {field('startNote', 'Text after start date')}
                                {field('completionDate', 'Proposed completion date', null, 'date')}
                                {field('completionNote', 'Text after completion date')}
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">POs ({pos.length})</div>
                            {pos.length === 0
                                ? <p style={{ color: '#888' }}>No POs on this job yet.</p>
                                : <div style={{ overflowX: 'auto' }}>
                                    <table>
                                        <thead>
                                            <tr><th>Include</th><th>PO</th><th>Category</th><th>Subcontractor</th><th>Status</th><th style={{ textAlign: 'right' }}>Amount</th></tr>
                                        </thead>
                                        <tbody>
                                            {pos.map(po => {
                                                const included = !excludedPoIds.includes(po.id);
                                                const bad = po.amount === null;
                                                return (
                                                    <tr key={po.id} style={{ color: included ? '#333' : '#aaa' }}>
                                                        <td><input type="checkbox" checked={included} onChange={e => toggleInclude(po.id, e.target.checked)} style={{ width: 'auto' }} /></td>
                                                        <td>{po.poNumber}</td>
                                                        <td>{po.category}</td>
                                                        <td>{po.subName}</td>
                                                        <td>{po.status}</td>
                                                        <td style={{ textAlign: 'right', color: bad ? '#d32f2f' : undefined, fontWeight: bad ? 600 : undefined }}>
                                                            {bad ? 'No amount' : $(po.amount)}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                  </div>}
                        </div>

                        {(() => {
                            const poTotal = pos.filter(p => !excludedPoIds.includes(p.id)).reduce((s, p) => s + (p.amount || 0), 0);
                            const r = calcGPM(inputs, poTotal);
                            if (!r) return (
                                <div className="section">
                                    <div className="section-title">RESULTS</div>
                                    <p style={{ color: '#888' }}>Enter the settlement amount and Xactimate totals to see results.</p>
                                </div>
                            );
                            const onTarget = r.gpm >= TARGET_GPM;
                            const row = (label, value, strong) => (
                                <tr style={strong ? { fontWeight: 700 } : undefined}>
                                    <td>{label}</td><td style={{ textAlign: 'right' }}>{value}</td>
                                </tr>
                            );
                            return (
                                <div className="section">
                                    <div className="section-title">RESULTS ({r.over ? 'over settlement' : 'under settlement'})</div>
                                    <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', marginBottom: '15px' }}>
                                        <div style={{ flex: 1, minWidth: '200px', padding: '15px', borderRadius: '6px', background: onTarget ? '#e8f5e9' : '#fdecea', border: '1px solid ' + (onTarget ? '#388e3c' : '#d32f2f') }}>
                                            <div style={{ fontSize: '13px', color: '#555' }}>GPM</div>
                                            <div style={{ fontSize: '28px', fontWeight: 700, color: onTarget ? '#2e7d32' : '#c62828' }}>{pct(r.gpm)}</div>
                                            <div style={{ fontSize: '13px', color: '#555' }}>
                                                Target {pct(TARGET_GPM)} ({r.gpm - TARGET_GPM >= 0 ? '+' : ''}{((r.gpm - TARGET_GPM) * 100).toFixed(1)} pts)
                                            </div>
                                        </div>
                                        <div style={{ flex: 1, minWidth: '200px', padding: '15px', borderRadius: '6px', background: '#f9f9f9', border: '1px solid #ddd' }}>
                                            <div style={{ fontSize: '13px', color: '#555' }}>{r.difference >= 0 ? 'Customer pays extra' : 'Customer credit'}</div>
                                            <div style={{ fontSize: '28px', fontWeight: 700 }}>{$(Math.abs(r.difference))}</div>
                                        </div>
                                    </div>
                                    <table>
                                        <tbody>
                                            {row('Net settlement (settlement - deductible)', $(r.netSettlement))}
                                            {row('Settlement after PA fee', $(r.settlementAfterPA))}
                                            {row('Customer Estimate (dwelling + other structures + code upgrade)', $(r.ce))}
                                            {row(`PA fee - courtesy discount (${pct(r.pa)} of ${r.over ? 'net settlement' : 'Customer Estimate'})`, $(-r.paFee))}
                                            {row('Items paid by customer', $(-r.customerItems))}
                                            {row('Selling price (amount due Freeman Restoration)', $(r.sellingPrice), true)}
                                            {row(`POs included (${pos.filter(p => !excludedPoIds.includes(p.id)).length} of ${pos.length})`, $(r.poTotal))}
                                            {row(`In-house labor (${pct(IN_HOUSE_LABOR_PCT)} of selling price)`, $(r.inHouseLabor))}
                                            {row('Job cost', $(r.jobCost), true)}
                                            {row('Gross profit', $(r.grossProfit), true)}
                                        </tbody>
                                    </table>
                                </div>
                            );
                        })()}

                        <button className="btn-primary" onClick={handleSave} disabled={saving || !dirty}>
                            {saving ? 'Saving...' : 'Save'}
                        </button>
                        {lastSaved && (
                            <div className="hint" style={{ textAlign: 'center', marginTop: '8px' }}>
                                Last saved by {lastSaved.name} {lastSaved.at.toLocaleString('en-US', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}
                            </div>
                        )}
                    </>)}

                    {message && <div style={{ marginTop: '15px', padding: '10px', textAlign: 'center', color: message.includes('Error') ? '#d32f2f' : '#388e3c', fontWeight: 500 }}>{message}</div>}
                </div>
            );
        }

        ReactDOM.render(<GPMApp />, document.getElementById('app'));
    </script>
</body>
</html>
