<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPM Tool - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        .hint { font-size: 11px; color: #888; margin-top: 3px; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f5f5; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPM Tool</h1>
        <p class="subtitle">Freeman Restoration starting-point Gross Produced Margin</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Same Firebase project as PO Manager
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const GPM_ROLES = ['owner', 'admin', 'estimator'];
        const DEFAULT_DATE_NOTE = 'or 5 days after permit issued';

        // Money/percent fields: typed as text, saved as numbers
        const NUMBER_FIELDS = ['settlementAmount', 'deductible', 'paFeePct', 'dwellingTotal', 'otherStructuresTotal', 'codeUpgradeTotal', 'customerItems'];

        const BLANK_INPUTS = {
            settlementAmount: '', settlementDate: '', deductible: '', paFeePct: '10',
            dwellingTotal: '', otherStructuresTotal: '', codeUpgradeTotal: '', customerItems: '',
            agreementDate: '',
            startDate: '', startNote: DEFAULT_DATE_NOTE,
            completionDate: '', completionNote: DEFAULT_DATE_NOTE
        };

        // "$1,234.56" or "1234.56" -> 1234.56 ; blank -> null
        const toNumber = (t) => {
            const s = String(t ?? '').replace(/[^0-9.]/g, '');
            if (!s) return null;
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
        };
        const fmtMoney = (n) => n === null || n === undefined ? '' :
            Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // Company-wide rates (fixed, not per job)
        const IN_HOUSE_LABOR_PCT = 0.135;
        const TARGET_GPM = 0.28;

        const $ = (n) => { const v = Math.round(n * 100) / 100 || 0; return v < 0 ? '($' + fmtMoney(-v) + ')' : '$' + fmtMoney(v); }; // || 0 turns -0 into 0
        const pct = (n) => (n * 100).toFixed(1) + '%';

        // All GPM math in one place. Returns null until settlement and estimate are entered.
        const calcGPM = (inputs, poTotal) => {
            const settlement = toNumber(inputs.settlementAmount) || 0;
            const deductible = toNumber(inputs.deductible) || 0;
            const pa = (toNumber(inputs.paFeePct) || 0) / 100;
            const ce = (toNumber(inputs.dwellingTotal) || 0) + (toNumber(inputs.otherStructuresTotal) || 0) + (toNumber(inputs.codeUpgradeTotal) || 0);
            const customerItems = toNumber(inputs.customerItems) || 0;
            if (!settlement || !ce) return null;

            const netSettlement = settlement - deductible;
            const settlementPAFee = netSettlement * pa;
            const settlementAfterPA = netSettlement - settlementPAFee;
            const over = ce > netSettlement;
            // PA fee: on net settlement when over, on Customer Estimate when under
            const paFee = over ? settlementPAFee : ce * pa;
            const sellingPrice = ce - paFee - customerItems; // amount due Freeman Restoration
            const inHouseLabor = sellingPrice * IN_HOUSE_LABOR_PCT;
            const jobCost = poTotal + inHouseLabor;
            const grossProfit = sellingPrice - jobCost;
            const gpm = sellingPrice ? grossProfit / sellingPrice : 0;
            const difference = sellingPrice - settlementAfterPA; // + customer pays extra, - customer credit

            return { settlement, deductible, pa, ce, netSettlement, settlementPAFee, settlementAfterPA, over,
                     paFee, customerItems, sellingPrice, poTotal, inHouseLabor, jobCost, grossProfit, gpm, difference };
        };


        // ---------- Summary notes layout ----------
        // Each line: amount = which number to show ('' = none), label = text. {date} = settlement date, {pa} = PA fee %.
        // paOnly lines are left out when the PA fee is 0%. itemsOnly lines are left out when items paid by customer is 0.
        // This is the starting layout. The saved company-wide layout (gpmSettings/notesLayout) replaces it once someone saves one.
        const DEFAULT_LAYOUT = {
            over: [
                { amount: 'settlement', label: 'Settlement amount as of   {date}' },
                { amount: 'deductible', label: 'Minus deductible' },
                { amount: 'netSettlement', label: '' },
                { amount: 'settlementPAFee', label: 'Minus {pa} PA Fee', paOnly: true },
                { amount: 'settlementAfterPA', label: 'Settlement amount minus PA Fee' },
                { amount: '', label: '' },
                { amount: 'dwelling', label: 'Dwelling Estimate Amount' },
                { amount: 'courtesyDiscount', label: 'Minus PA Fee - Courtesy Discount', paOnly: true },
                { amount: 'dwellingMinusPA', label: 'Dwelling Estimate minus PA Fee', paOnly: true },
                { amount: 'otherStructures', label: 'Other Structures Estimate Amount' },
                { amount: 'codeUpgrade', label: 'Code Upgrade Estimate Amount' },
                { amount: 'customerItems', label: 'Items paid by Customer in this estimate - deducted from this estimate', itemsOnly: true },
                { amount: 'amountDue', label: 'Amount due Freeman Restoration' },
                { amount: '', label: '' },
                { amount: 'settlementAfterPA', label: 'Settlement amount minus PA Fee' },
                { amount: 'amountDue', label: 'Amount Due Freeman Restoration Minus PA Fee' },
                { amount: 'difference', label: 'Funds Customer to pay extra over settlement' }
            ],
            under: [
                { amount: 'settlement', label: 'Settlement amount as of   {date}' },
                { amount: 'deductible', label: 'Minus deductible' },
                { amount: 'netSettlement', label: '' },
                { amount: 'settlementPAFee', label: 'Minus {pa} PA Fee', paOnly: true },
                { amount: 'settlementAfterPA', label: 'Settlement amount minus PA Fee' },
                { amount: '', label: '' },
                { amount: 'customerEstimate', label: 'Customer Estimate amount' },
                { amount: 'courtesyDiscount', label: 'Minus PA Fee - Courtesy Discount', paOnly: true },
                { amount: 'ceMinusPA', label: 'Customer Estimate minus PA Fee', paOnly: true },
                { amount: 'customerItems', label: 'Items paid by Customer in this estimate - deducted from this estimate', itemsOnly: true },
                { amount: 'amountDue', label: 'Estimate amount due Freeman Restoration less Customer Items' },
                { amount: '', label: '' },
                { amount: 'settlementAfterPA', label: 'Settlement amount minus PA Fee' },
                { amount: 'amountDue', label: 'Amount Due Freeman Restoration Minus PA Fee' },
                { amount: 'difference', label: 'Funds Customer to keep after PA Fee from settlement' }
            ]
        };

        // The numbers a notes line can show (negatives print in parentheses)
        const noteAmounts = (r, inputs) => {
            const dwelling = toNumber(inputs.dwellingTotal) || 0;
            return {
                settlement: r.settlement,
                deductible: -r.deductible,
                netSettlement: r.netSettlement,
                settlementPAFee: -r.settlementPAFee,
                settlementAfterPA: r.settlementAfterPA,
                dwelling,
                otherStructures: toNumber(inputs.otherStructuresTotal) || 0,
                codeUpgrade: toNumber(inputs.codeUpgradeTotal) || 0,
                customerEstimate: r.ce,
                courtesyDiscount: -r.paFee,
                dwellingMinusPA: dwelling - r.paFee,
                ceMinusPA: r.ce - r.paFee,
                customerItems: -r.customerItems,
                amountDue: r.sellingPrice,
                difference: Math.abs(r.difference)
            };
        };

        // Choices for the layout editor's Amount dropdown
        const AMOUNT_OPTIONS = [
            ['', 'None'],
            ['settlement', 'Settlement'],
            ['deductible', 'Deductible (minus)'],
            ['netSettlement', 'Net settlement (settlement - deductible)'],
            ['settlementPAFee', 'PA fee on net settlement (minus)'],
            ['settlementAfterPA', 'Settlement minus PA fee'],
            ['dwelling', 'Dwelling estimate'],
            ['otherStructures', 'Other structures estimate'],
            ['codeUpgrade', 'Code upgrade estimate'],
            ['customerEstimate', 'Customer Estimate (all three)'],
            ['courtesyDiscount', 'Courtesy discount / PA fee used (minus)'],
            ['dwellingMinusPA', 'Dwelling estimate minus PA fee'],
            ['ceMinusPA', 'Customer Estimate minus PA fee'],
            ['customerItems', 'Items paid by customer (minus)'],
            ['amountDue', 'Amount due Freeman (selling price)'],
            ['difference', 'Difference (customer pays extra / keeps)']
        ];

        // Saved layout from Firestore -> safe layout (falls back to default)
        const cleanLayout = (d) => {
            const side = (arr, fallback) => Array.isArray(arr) ? arr.map(l => ({
                amount: typeof l.amount === 'string' ? l.amount : '',
                label: typeof l.label === 'string' ? l.label : '',
                paOnly: l.paOnly === true,
                itemsOnly: l.itemsOnly === true
            })) : fallback;
            return { over: side(d && d.over, DEFAULT_LAYOUT.over), under: side(d && d.under, DEFAULT_LAYOUT.under) };
        };

        // 'YYYY-MM-DD' -> 'MM/DD/YYYY'
        const fmtDate = (d) => {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
            return m ? `${m[2]}/${m[3]}/${m[1]}` : '';
        };

        // Build the notes text: amount <tab> label, one line each
        const buildNotes = (layoutLines, r, inputs) => {
            const amounts = noteAmounts(r, inputs);
            const paText = (Math.round(r.pa * 1000) / 10) + '%';
            return layoutLines
                .filter(l => !(l.paOnly && r.pa === 0) && !(l.itemsOnly && r.customerItems === 0))
                .map(l => {
                    const amt = l.amount ? $(Math.round(amounts[l.amount] * 100) / 100) : '';
                    const label = (l.label || '').replace('{date}', fmtDate(inputs.settlementDate)).replace('{pa}', paText);
                    return amt || label ? `${amt}\t${label}` : '';
                })
                .join('\n');
        };

        function GPMApp() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, false = no access, object = allowed
            const [authError, setAuthError] = useState('');

            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [inputs, setInputs] = useState(BLANK_INPUTS);
            const [dirty, setDirty] = useState(false);
            const [lastSaved, setLastSaved] = useState(null); // { name, at }
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [pos, setPos] = useState([]);              // this job's POs from PO Manager (read-only)
            const [excludedPoIds, setExcludedPoIds] = useState([]);
            const [notesEdit, setNotesEdit] = useState(null); // one-off edits to the notes (not saved); null = use generated
            const [layout, setLayout] = useState(DEFAULT_LAYOUT);   // company-wide notes layout
            const [layoutInfo, setLayoutInfo] = useState(null);     // { name, at } of last layout save
            const [layoutDraft, setLayoutDraft] = useState(null);   // layout being edited; null = editor closed
            const [layoutTab, setLayoutTab] = useState('over');

            useEffect(() => {
                if (!profile) return;
                const unsub = db.collection('gpmSettings').doc('notesLayout').onSnapshot(doc => {
                    if (doc.exists) {
                        setLayout(cleanLayout(doc.data()));
                        const d = doc.data();
                        setLayoutInfo(d.updatedAt ? { name: (d.updatedBy && d.updatedBy.name) || '', at: d.updatedAt.toDate() } : null);
                    } else {
                        setLayout(DEFAULT_LAYOUT);
                        setLayoutInfo(null);
                    }
                }, error => setMessage('Error loading notes layout: ' + error.message));
                return () => unsub();
            }, [profile]);

            // Layout editor actions (work on the draft; nothing saved until Save layout)
            const editLine = (i, changes) => setLayoutDraft(prev => ({ ...prev, [layoutTab]: prev[layoutTab].map((l, k) => k === i ? { ...l, ...changes } : l) }));
            const moveLine = (i, dir) => setLayoutDraft(prev => {
                const list = [...prev[layoutTab]]; const j = i + dir;
                if (j < 0 || j >= list.length) return prev;
                [list[i], list[j]] = [list[j], list[i]];
                return { ...prev, [layoutTab]: list };
            });
            const removeLine = (i) => setLayoutDraft(prev => ({ ...prev, [layoutTab]: prev[layoutTab].filter((_, k) => k !== i) }));
            const addLine = (blank) => setLayoutDraft(prev => ({ ...prev, [layoutTab]: [...prev[layoutTab], { amount: '', label: blank ? '' : 'New line', paOnly: false, itemsOnly: false }] }));

            const saveLayout = async () => {
                try {
                    await db.collection('gpmSettings').doc('notesLayout').set({
                        over: layoutDraft.over, under: layoutDraft.under,
                        updatedBy: { uid: user.uid, name: profile.name || user.email },
                        updatedAt: new Date()
                    });
                    setLayoutDraft(null);
                    setMessage('Notes layout saved for all jobs');
                } catch (error) {
                    setMessage('Error saving notes layout: ' + error.message);
                }
            };

            // Live, read-only list of the picked job's POs
            useEffect(() => {
                setPos([]);
                if (!jobId) return;
                const unsub = db.collection('jobs').doc(jobId).collection('forms').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, poNumber: d.poNumber || '', category: d.category || '', subName: d.subName || '',
                                    status: d.status || 'Pending', amount: toNumber(d.contractAmount) });
                    });
                    list.sort((a, b) => a.category.localeCompare(b.category) || a.poNumber.localeCompare(b.poNumber));
                    setPos(list);
                }, error => setMessage('Error loading POs: ' + error.message));
                return () => unsub();
            }, [jobId]);

            useEffect(() => {
                auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) return;
                    try {
                        // Read-only check. New users get their pending record from PO Manager, not here.
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && GPM_ROLES.includes(d.role)) {
                            setProfile({ uid: currentUser.uid, ...d });
                        } else {
                            setProfile(false);
                        }
                    } catch (err) {
                        setProfile(false);
                    }
                });
            }, []);

            // Job list (read-only, same jobs as PO Manager)
            useEffect(() => {
                if (!profile) return;
                const unsub = db.collection('jobs').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, code: d.code || '', address: d.address || '', archived: d.archived === true });
                    });
                    list.sort((a, b) => a.code.localeCompare(b.code));
                    setJobs(list);
                }, error => setMessage('Error loading jobs: ' + error.message));
                return () => unsub();
            }, [profile]);

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = () => auth.signOut();

            // Pick a job: load its saved GPM inputs, or start blank
            const handlePickJob = async (id) => {
                if (dirty && !window.confirm('You have unsaved changes. Switch jobs anyway?')) return;
                setJobId(id);
                setDirty(false);
                setMessage('');
                setLastSaved(null);
                setExcludedPoIds([]);
                setNotesEdit(null);
                if (!id) { setInputs(BLANK_INPUTS); return; }
                try {
                    const snap = await db.collection('gpm').doc(id).get();
                    if (!snap.exists) { setInputs(BLANK_INPUTS); return; }
                    const d = snap.data();
                    setExcludedPoIds(Array.isArray(d.excludedPoIds) ? d.excludedPoIds : []);
                    const loaded = { ...BLANK_INPUTS };
                    Object.keys(BLANK_INPUTS).forEach(k => {
                        if (d[k] === undefined || d[k] === null) return;
                        loaded[k] = NUMBER_FIELDS.includes(k) && k !== 'paFeePct' ? fmtMoney(d[k]) : String(d[k]);
                    });
                    setInputs(loaded);
                    if (d.updatedAt) setLastSaved({ name: d.updatedBy?.name || '', at: d.updatedAt.toDate() });
                } catch (error) {
                    setMessage('Error loading GPM data: ' + error.message);
                }
            };

            const setField = (k, v) => { setInputs(prev => ({ ...prev, [k]: v })); setDirty(true); };

            const toggleInclude = (poId, include) => {
                setExcludedPoIds(prev => include ? prev.filter(id => id !== poId) : [...prev, poId]);
                setDirty(true);
            };

            const handleSave = async () => {
                if (!jobId) return;
                const job = jobs.find(j => j.id === jobId);
                const data = {};
                Object.keys(BLANK_INPUTS).forEach(k => {
                    data[k] = NUMBER_FIELDS.includes(k) ? toNumber(inputs[k]) : (inputs[k] || '').trim();
                });
                const byMe = { uid: user.uid, name: profile.name || user.email };
                setSaving(true);
                try {
                    await db.collection('gpm').doc(jobId).set({
                        ...data,
                        excludedPoIds,
                        jobCode: job ? job.code : '',
                        updatedBy: byMe,
                        updatedAt: new Date()
                    }, { merge: true });
                    setDirty(false);
                    setLastSaved({ name: byMe.name, at: new Date() });
                    setMessage('Saved');
                } catch (error) {
                    setMessage('Error saving: ' + error.message);
                }
                setSaving(false);
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">LOGIN</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) {
                return <div className="section"><p>Loading...</p></div>;
            }

            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">NO ACCESS</div>
                        <p>Signed in as {user.email}. The GPM Tool is only for Owner, Admin and Estimator. Contact an admin if you need access.</p>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>
                );
            }

            const visibleJobs = jobs.filter(j => showArchived || !j.archived || j.id === jobId);

            const field = (k, labelText, hint, type = 'text') => (
                <div className="form-group">
                    <label>{labelText}</label>
                    <input type={type} value={inputs[k]} onChange={e => setField(k, e.target.value)} />
                    {hint && <div className="hint">{hint}</div>}
                </div>
            );

            return (
                <div>
                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                            <p style={{ margin: 0 }}>Signed in as {profile.name || user.email} ({profile.role})</p>
                            <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                        </div>

                        <div className="section-title">JOB</div>
                        <div className="form-group">
                            <select value={jobId} onChange={e => handlePickJob(e.target.value)}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code}{j.address ? ' - ' + j.address : ''}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                        </div>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontWeight: 'normal' }}>
                            <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} style={{ width: 'auto' }} />
                            Show archived jobs
                        </label>
                    </div>

                    {jobId && (<>
                        <div className="section">
                            <div className="section-title">SETTLEMENT</div>
                            <div className="grid">
                                {field('settlementAmount', 'Settlement amount', 'Total Insurance Obligated to pay, from the statement')}
                                {field('settlementDate', 'Settlement date', null, 'date')}
                                {field('deductible', 'Deductible', 'Enter as a positive number')}
                                {field('paFeePct', 'PA fee %', 'Enter 10 for 10%. Enter 0 if no PA.')}
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">XACTIMATE TOTALS</div>
                            <div className="grid">
                                {field('dwellingTotal', 'Dwelling estimate (Replacement Cost Value)')}
                                {field('otherStructuresTotal', 'Other structures estimate')}
                                {field('codeUpgradeTotal', 'Code upgrade estimate')}
                                {field('customerItems', 'Items paid by customer', 'Enter as a positive number. Lowers the amount due Freeman.')}
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">COVER PAGE DATES</div>
                            <div className="grid">
                                {field('agreementDate', 'Agreement date', 'Used for both "agreement dated" lines', 'date')}
                                <div />
                                {field('startDate', 'Proposed start date', null, 'date')}
                                {field('startNote', 'Text after start date')}
                                {field('completionDate', 'Proposed completion date', null, 'date')}
                                {field('completionNote', 'Text after completion date')}
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">POs ({pos.length})</div>
                            {pos.length === 0
                                ? <p style={{ color: '#888' }}>No POs on this job yet.</p>
                                : <div style={{ overflowX: 'auto' }}>
                                    <table>
                                        <thead>
                                            <tr><th>Include</th><th>PO</th><th>Category</th><th>Subcontractor</th><th>Status</th><th style={{ textAlign: 'right' }}>Amount</th></tr>
                                        </thead>
                                        <tbody>
                                            {pos.map(po => {
                                                const included = !excludedPoIds.includes(po.id);
                                                const bad = po.amount === null;
                                                return (
                                                    <tr key={po.id} style={{ color: included ? '#333' : '#aaa' }}>
                                                        <td><input type="checkbox" checked={included} onChange={e => toggleInclude(po.id, e.target.checked)} style={{ width: 'auto' }} /></td>
                                                        <td>{po.poNumber}</td>
                                                        <td>{po.category}</td>
                                                        <td>{po.subName}</td>
                                                        <td>{po.status}</td>
                                                        <td style={{ textAlign: 'right', color: bad ? '#d32f2f' : undefined, fontWeight: bad ? 600 : undefined }}>
                                                            {bad ? 'No amount' : $(po.amount)}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                  </div>}
                        </div>

                        {(() => {
                            const poTotal = pos.filter(p => !excludedPoIds.includes(p.id)).reduce((s, p) => s + (p.amount || 0), 0);
                            const r = calcGPM(inputs, poTotal);
                            if (!r) return (
                                <div className="section">
                                    <div className="section-title">RESULTS</div>
                                    <p style={{ color: '#888' }}>Enter the settlement amount and Xactimate totals to see results.</p>
                                </div>
                            );
                            const onTarget = r.gpm >= TARGET_GPM;
                            const row = (label, value, strong) => (
                                <tr style={strong ? { fontWeight: 700 } : undefined}>
                                    <td>{label}</td><td style={{ textAlign: 'right' }}>{value}</td>
                                </tr>
                            );
                            return (
                                <div className="section">
                                    <div className="section-title">RESULTS ({r.over ? 'over settlement' : 'under settlement'})</div>
                                    <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', marginBottom: '15px' }}>
                                        <div style={{ flex: 1, minWidth: '200px', padding: '15px', borderRadius: '6px', background: onTarget ? '#e8f5e9' : '#fdecea', border: '1px solid ' + (onTarget ? '#388e3c' : '#d32f2f') }}>
                                            <div style={{ fontSize: '13px', color: '#555' }}>GPM</div>
                                            <div style={{ fontSize: '28px', fontWeight: 700, color: onTarget ? '#2e7d32' : '#c62828' }}>{pct(r.gpm)}</div>
                                            <div style={{ fontSize: '13px', color: '#555' }}>
                                                Target {pct(TARGET_GPM)} ({r.gpm - TARGET_GPM >= 0 ? '+' : ''}{((r.gpm - TARGET_GPM) * 100).toFixed(1)} pts)
                                            </div>
                                        </div>
                                        <div style={{ flex: 1, minWidth: '200px', padding: '15px', borderRadius: '6px', background: '#f9f9f9', border: '1px solid #ddd' }}>
                                            <div style={{ fontSize: '13px', color: '#555' }}>{r.difference >= 0 ? 'Customer pays extra' : 'Customer credit'}</div>
                                            <div style={{ fontSize: '28px', fontWeight: 700 }}>{$(Math.abs(r.difference))}</div>
                                        </div>
                                    </div>
                                    <table>
                                        <tbody>
                                            {row('Net settlement (settlement - deductible)', $(r.netSettlement))}
                                            {row('Settlement after PA fee', $(r.settlementAfterPA))}
                                            {row('Customer Estimate (dwelling + other structures + code upgrade)', $(r.ce))}
                                            {row(`PA fee - courtesy discount (${pct(r.pa)} of ${r.over ? 'net settlement' : 'Customer Estimate'})`, $(-r.paFee))}
                                            {row('Items paid by customer', $(-r.customerItems))}
                                            {row('Selling price (amount due Freeman Restoration)', $(r.sellingPrice), true)}
                                            {row(`POs included (${pos.filter(p => !excludedPoIds.includes(p.id)).length} of ${pos.length})`, $(r.poTotal))}
                                            {row(`In-house labor (${pct(IN_HOUSE_LABOR_PCT)} of selling price)`, $(r.inHouseLabor))}
                                            {row('Job cost', $(r.jobCost), true)}
                                            {row('Gross profit', $(r.grossProfit), true)}
                                        </tbody>
                                    </table>
                                </div>
                            );
                        })()}

                        {(() => {
                            const poTotal = pos.filter(p => !excludedPoIds.includes(p.id)).reduce((s, p) => s + (p.amount || 0), 0);
                            const r = calcGPM(inputs, poTotal);
                            if (!r) return null;
                            const generated = buildNotes(layout[r.over ? 'over' : 'under'], r, inputs);
                            const text = notesEdit !== null ? notesEdit : generated;
                            const copy = () => navigator.clipboard.writeText(text).then(
                                () => setMessage('Summary notes copied'),
                                () => setMessage('Error: copy failed. Select the text and copy it.'));
                            return (
                                <div className="section">
                                    <div className="section-title">SUMMARY NOTES ({r.over ? 'over settlement' : 'under settlement'})</div>
                                    <textarea value={text} onChange={e => setNotesEdit(e.target.value)} rows={Math.max(8, text.split('\n').length + 1)}
                                        style={{ width: '100%', fontFamily: 'Arial, sans-serif', fontSize: '13px', tabSize: 30, padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', whiteSpace: 'pre' }} />
                                    <div className="hint">Edits here are for this copy only and are not saved. Changing the numbers above rebuilds the notes unless you've edited them.</div>
                                    <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                                        <button className="btn-primary" style={{ width: 'auto' }} onClick={copy}>Copy notes</button>
                                        {notesEdit !== null && <button className="btn-secondary" onClick={() => setNotesEdit(null)}>Reset to generated</button>}
                                        <div style={{ flex: 1 }} />
                                        {!layoutDraft && <button className="btn-secondary" onClick={() => { setLayoutDraft(JSON.parse(JSON.stringify(layout))); setLayoutTab(r.over ? 'over' : 'under'); }}>Edit notes layout</button>}
                                    </div>
                                    {layoutInfo && !layoutDraft && <div className="hint" style={{ textAlign: 'right', marginTop: '4px' }}>
                                        Layout last changed by {layoutInfo.name} {layoutInfo.at.toLocaleDateString('en-US')}</div>}

                                    {layoutDraft && (
                                        <div style={{ marginTop: '15px', padding: '15px', border: '1px solid #0066cc', borderRadius: '6px', background: '#f7fbff' }}>
                                            <div style={{ fontWeight: 600, marginBottom: '4px' }}>Notes layout (applies to all jobs)</div>
                                            <div className="hint" style={{ marginBottom: '10px' }}>{'{date}'} = settlement date, {'{pa}'} = PA fee %. Nothing changes until you click Save layout.</div>
                                            <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                                                {['over', 'under'].map(t => (
                                                    <button key={t} className={layoutTab === t ? 'btn-primary' : 'btn-secondary'} style={{ width: 'auto' }} onClick={() => setLayoutTab(t)}>
                                                        {t === 'over' ? 'Over settlement' : 'Under settlement'}
                                                    </button>
                                                ))}
                                            </div>
                                            <div style={{ overflowX: 'auto' }}>
                                            <table>
                                                <thead>
                                                    <tr><th>Amount</th><th>Label</th><th title="Hide when no PA fee">No PA: hide</th><th title="Hide when no customer items">No items: hide</th><th></th></tr>
                                                </thead>
                                                <tbody>
                                                    {layoutDraft[layoutTab].map((l, i) => (
                                                        <tr key={i}>
                                                            <td style={{ minWidth: '190px' }}>
                                                                <select value={l.amount} onChange={e => editLine(i, { amount: e.target.value })}>
                                                                    {AMOUNT_OPTIONS.map(([v, t]) => <option key={v} value={v}>{t}</option>)}
                                                                </select>
                                                            </td>
                                                            <td style={{ minWidth: '240px' }}><input value={l.label} onChange={e => editLine(i, { label: e.target.value })} placeholder="(blank)" /></td>
                                                            <td style={{ textAlign: 'center' }}><input type="checkbox" checked={l.paOnly} onChange={e => editLine(i, { paOnly: e.target.checked })} style={{ width: 'auto' }} /></td>
                                                            <td style={{ textAlign: 'center' }}><input type="checkbox" checked={l.itemsOnly} onChange={e => editLine(i, { itemsOnly: e.target.checked })} style={{ width: 'auto' }} /></td>
                                                            <td style={{ whiteSpace: 'nowrap' }}>
                                                                <button className="btn-secondary" style={{ padding: '4px 8px' }} onClick={() => moveLine(i, -1)} disabled={i === 0}>↑</button>{' '}
                                                                <button className="btn-secondary" style={{ padding: '4px 8px' }} onClick={() => moveLine(i, 1)} disabled={i === layoutDraft[layoutTab].length - 1}>↓</button>{' '}
                                                                <button style={{ padding: '4px 8px', background: '#d32f2f', color: 'white' }} onClick={() => removeLine(i)}>✕</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            </div>
                                            <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                                                <button className="btn-secondary" onClick={() => addLine(false)}>+ Add line</button>
                                                <button className="btn-secondary" onClick={() => addLine(true)}>+ Blank line</button>
                                            </div>
                                            <div style={{ fontWeight: 600, margin: '15px 0 5px', fontSize: '13px' }}>
                                                Preview ({layoutTab === 'over' ? 'over' : 'under'} settlement, using this job's numbers)
                                            </div>
                                            <pre style={{ fontFamily: 'Arial, sans-serif', fontSize: '13px', tabSize: 30, background: 'white', border: '1px solid #ddd', borderRadius: '4px', padding: '8px 10px', whiteSpace: 'pre', overflowX: 'auto' }}>
                                                {buildNotes(layoutDraft[layoutTab], r, inputs) || '(empty)'}
                                            </pre>
                                            <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                                                <button className="btn-primary" style={{ width: 'auto' }} onClick={saveLayout}>Save layout</button>
                                                <button className="btn-secondary" onClick={() => setLayoutDraft(null)}>Cancel</button>
                                                <div style={{ flex: 1 }} />
                                                <button className="btn-secondary" onClick={() => { if (window.confirm('Put both layouts back to the original wording? (Not saved until you click Save layout.)')) setLayoutDraft(JSON.parse(JSON.stringify(DEFAULT_LAYOUT))); }}>Reset to default</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })()}

                        <button className="btn-primary" onClick={handleSave} disabled={saving || !dirty}>
                            {saving ? 'Saving...' : 'Save'}
                        </button>
                        {lastSaved && (
                            <div className="hint" style={{ textAlign: 'center', marginTop: '8px' }}>
                                Last saved by {lastSaved.name} {lastSaved.at.toLocaleString('en-US', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}
                            </div>
                        )}
                    </>)}

                    {message && <div style={{ marginTop: '15px', padding: '10px', textAlign: 'center', color: message.includes('Error') ? '#d32f2f' : '#388e3c', fontWeight: 500 }}>{message}</div>}
                </div>
            );
        }

        ReactDOM.render(<GPMApp />, document.getElementById('app'));
    </script>
</body>
</html>
