                                    return (
                                    <React.Fragment key={i.id}>
                                        <tr className={codeId === i.id ? 'editing-row' : ''}>
                                            <td>{shortDate(i.dateReceived)}{h.email ? <small><span className="pill passed">Email</span></small> : null}</td>
                                            <td>{fromOf(i) || <span className="muted">-</span>}{h.email && h.email.from && h.email.from !== fromOf(i) ? <small>{h.email.from}</small> : null}{i.pdfRead ? <small>Read from PDF</small> : null}</td>
                                            <td>{i.invoiceNumber || <span className="muted">-</span>}{dupOpen(i) ? <small><span className="pill pa-pending">Possible duplicate</span></small> : null}</td>
                                            <td className="num">{typeof i.amount === 'number' ? money(i.amount) : '-'}</td>
                                            <td>{h.poNumber ? <span>PO {h.poNumber}</span> : h.jobText ? `"${h.jobText}"` : <span className="muted">no PO or job on it</span>}
                                                {h.jobCode && !h.poNumber ? <small>Job {h.jobCode}{h.formId ? '' : ', no PO'}</small> : null}
                                                {h.email && h.email.subject ? <small>Subject: {h.email.subject}</small> : null}
                                                {h.note ? <small className="hold-note">{h.note}</small> : null}</td>
                                            <td>{h.email ? 'Email' : (i.createdBy ? i.createdBy.name : '')}</td>
                                            <td><span className="row-btns">
                                                {i.file && i.file.url && <a className="btn-link" href={i.file.url} target="_blank" rel="noopener">View</a>}
                                                <button className="btn-link" onClick={() => codeId === i.id ? closeCode() : openCode(i)} disabled={saving}>{codeId === i.id ? 'Close' : 'Code'}</button>
                                                <button className="btn-link" onClick={() => onHide(i)} disabled={saving}>Hide</button>
                                            </span></td>
                                        </tr>
                                        {codeId === i.id && (
                                            <tr><td colSpan="7">
                                                <div className="code-box">
                                                    <div className="section-title" style={{ marginBottom: '6px' }}>Code this bill{h.email ? ` (emailed ${h.email.from || ''})` : ''}</div>
                                                    {readNote && <div className={readNote.startsWith('Reading') ? 'muted' : 'read-note'} style={{ marginBottom: '8px' }}>{readNote}</div>}
                                                    <div className="kinds" style={{ marginBottom: '8px' }}>
                                                        {[['sub', 'Sub invoice'], ['supplier', 'Supplier bill']].map(([k, label]) => (
                                                            <label key={k}><input type="radio" name="nc-kind" checked={f.kind === k} onChange={() => pickKind(k)} disabled={saving} /> {label}</label>
                                                        ))}
                                                    </div>
                                                    <div className="bgrid">
                                                        <div>
                                                            <label htmlFor="nc-job">Job</label>
                                                            <select id="nc-job" value={f.jobId} onChange={e => pickJob(e.target.value)} disabled={saving}>
                                                                <option value="">-- Pick the job --</option>
                                                                {openJobs.map(j => <option key={j.id} value={j.id}>{j.code} - {j.address}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label htmlFor="nc-po">{f.kind === 'supplier' ? 'Material PO' : 'PO'}</label>
                                                            <select id="nc-po" value={f.formId} onChange={e => set('formId', e.target.value)} disabled={saving || !jdNow || !jdNow.pos || !f.kind}>
                                                                <option value="">{f.jobId && jdNow && jdNow.pos === null ? 'Loading...' : !f.kind ? '-- Pick Sub or Supplier first --' : '-- Pick the PO --'}</option>
                                                                {poChoices.map(p => <option key={p.id} value={p.id}>{p.category} - {p.poNumber} - {p.subName}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label htmlFor="nc-vendor">{f.kind === 'sub' ? 'Sub' : 'Supplier'}</label>
                                                            {f.kind === 'sub'
                                                                ? <input id="nc-vendor" type="text" value={po ? po.subName : ''} placeholder="From the PO" disabled />
                                                                : <select id="nc-vendor" value={f.vendorPick} onChange={e => set('vendorPick', e.target.value)} disabled={saving}>
                                                                    <option value="">-- Pick the supplier --</option>
                                                                    {names.map(n => <option key={n} value={n}>{n}</option>)}
                                                                    <option value={OTHER}>Other (type it)</option>
                                                                </select>}
                                                            {f.kind !== 'sub' && f.vendorPick === OTHER && <input id="nc-vendor-other" type="text" value={f.vendorOther} placeholder="Name as it is in QuickBooks" onChange={e => set('vendorOther', e.target.value)} disabled={saving} style={{ marginTop: '4px' }} />}
                                                        </div>
                                                        <div>
                                                            <label htmlFor="nc-num">Invoice #</label>
                                                            <input id="nc-num" type="text" value={f.invoiceNumber} onChange={e => set('invoiceNumber', e.target.value)} disabled={saving} />
                                                        </div>
                                                        <div>
                                                            <label htmlFor="nc-amt">Amount</label>
                                                            <input id="nc-amt" type="text" inputMode="decimal" value={f.amount} onChange={e => set('amount', e.target.value)} disabled={saving} />
                                                        </div>
                                                        <div>
                                                            <label htmlFor="nc-date">Date received</label>
                                                            <input id="nc-date" type="date" value={f.dateReceived} onChange={e => set('dateReceived', e.target.value)} disabled={saving} />
                                                        </div>
                                                        {f.kind === 'sub' && <div>
                                                            <label htmlFor="nc-prev">Previous payment (on the sub's form)</label>
                                                            <input id="nc-prev" type="text" inputMode="decimal" value={f.previousPayment} placeholder="Leave blank if none" onChange={e => set('previousPayment', e.target.value)} disabled={saving} />
                                                        </div>}
                                                        <div>
                                                            <label htmlFor="nc-appr">Approver</label>
                                                            <select id="nc-appr" value={f.approverUid} onChange={e => set('approverUid', e.target.value)} disabled={saving}>
                                                                <option value="">{approvers === null ? 'Loading people...' : '-- Pick who approves it --'}</option>
                                                                {approverList.map(a => <option key={a.uid} value={a.uid}>{a.name}{jdNow && jdNow.superInfo && a.uid === jdNow.superInfo.uid ? ' (job Super)' : ` (${a.role})`}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>
                                                    {problem && <div className={problem.startsWith('Loading') ? 'muted' : problem.includes("can't be added twice") ? 'error' : 'warn'} style={{ marginTop: '6px' }}>{problem}</div>}
                                                    {warn && <div className="warn" style={{ marginTop: '6px' }}>{warn}</div>}
                                                    {fileName && <div className="fname" style={{ marginTop: '6px', marginBottom: 0 }}>File name becomes: {fileName}</div>}
                                                    {msg && !msg.ok && <div className="error" style={{ marginTop: '6px' }}>{msg.text}</div>}
                                                    <div className="actions">
                                                        <button className="btn-secondary btn-auto" onClick={closeCode} disabled={saving}>Cancel</button>
                                                        <button className="btn-primary btn-auto" onClick={save} disabled={saving || !!problem}>{saving ? 'Saving...' : 'Save coding'}</button>
                                                    </div>
                                                </div>
                                            </td></tr>
                                        )}
                                    </React.Fragment>);
                                })}</tbody>
                            </table></div>
                        </React.Fragment>
                    )}
                </div>
            );
        }

        // Step 3a: Bookkeeping page (Owner/Admin; Bookkeeping has the Admin role)
        function Bookkeeping({ allInvoices, user, profile }) {
            const [editId, setEditId] = useState(null);
            const [draft, setDraft] = useState(null);
            const [msg, setMsg] = useState(null);
            const [busy, setBusy] = useState(false);
            const [mark, setMark] = useState(null);          // { ids, date, qbBillNo } for Mark in QuickBooks
            const [showDone, setShowDone] = useState(false);
            const by = () => ({ uid: user.uid, name: profile.name || user.email });

            const toQb = (allInvoices || []).filter(i => isReady(i) && !inQb(i));
            const done = (allInvoices || []).filter(i => isReady(i) && inQb(i))
                .sort((a, b) => String(b.qbEntered.date).localeCompare(String(a.qbEntered.date)));
            const groups = {};
            toQb.forEach(i => { const v = qbOf(i).vendor || '(no supplier)'; (groups[v] = groups[v] || []).push(i); });
            const vendors = Object.keys(groups).sort((a, b) => a.localeCompare(b));
            vendors.forEach(v => groups[v].sort((a, b) => String(a.dateReceived).localeCompare(String(b.dateReceived)) || String(a.invoiceNumber).localeCompare(String(b.invoiceNumber))));
            const sum = (list) => list.reduce((t, i) => t + (typeof i.amount === 'number' ? i.amount : 0), 0);
            const checked = toQb.filter(qbChecked);

            const openEdit = (i) => {
                if (editId && editId !== i.id && draft && !window.confirm('Drop the changes you started on the other line?')) return;
                setEditId(i.id); setDraft({ ...qbOf(i), checked: qbChecked(i) || true }); setMsg(null);
            };
            const saveEdit = async (i) => {
                const d = draft;
                const fields = {};
                QB_FIELDS.forEach(k => { fields[k] = String(d[k] || '').trim(); });
                const missing = !fields.vendor ? 'Type the supplier as it is in QuickBooks.' : !fields.customer ? 'Type the Customer/Job.'
                    : !fields.billNo ? 'Type the bill #.' : !/^\d{4}-\d{2}-\d{2}$/.test(fields.billDate) ? 'Pick the bill date.'
                    : fields.dueDate && !/^\d{4}-\d{2}-\d{2}$/.test(fields.dueDate) ? 'The due date isn\'t a date.'
                    : !QB_ITEMS.includes(fields.item) ? 'Pick the QuickBooks item.' : '';
                if (missing) { setMsg({ text: missing, ok: false, id: i.id }); return; }
                const before = qbOf(i);
                const changed = QB_FIELDS.filter(k => (before[k] || '') !== fields[k]);
                const wasChecked = qbChecked(i);
                if (!changed.length && wasChecked === !!d.checked) { setEditId(null); setDraft(null); return; }
                setBusy(true); setMsg(null);
                try {
                    const now = new Date();
                    const qb = { ...fields, checked: !!d.checked, checkedAt: d.checked ? now : null, checkedBy: d.checked ? by() : null,
                        ...(i.qb && i.qb.printedAt ? { printedAt: i.qb.printedAt, printedBy: i.qb.printedBy } : {}),
                        ...(i.qb && i.qb.zippedAt ? { zippedAt: i.qb.zippedAt, zippedBy: i.qb.zippedBy } : {}) };
                    const ref = db.collection('apInvoices').doc(i.id);
                    const b = db.batch();
                    b.update(ref, { qb });
                    const hb = {}, ha = {};
                    changed.forEach(k => { hb[k] = before[k] || ''; ha[k] = fields[k]; });
                    b.set(ref.collection('history').doc(), { action: 'QuickBooks details', fields: changed, before: hb, after: ha,
                        checked: !!d.checked, wasChecked, firstTime: !i.qb, at: now, by: by() });
                    await b.commit();
                    setEditId(null); setDraft(null);
                    setMsg({ text: `${i.vendor} ${i.invoiceNumber}: ${changed.length ? 'corrected (' + changed.join(', ') + ')' : 'saved'}${d.checked ? ', checked.' : ', not checked yet.'}`, ok: true });
                } catch (error) { setMsg({ text: 'Error saving: ' + error.message, ok: false, id: i.id }); }
                setBusy(false);
            };

            // The checked list as a printable page (Print, and a copy inside the zip)
            const listHtml = (now, who) => {
                const pv = {};
                checked.forEach(i => { const v = qbOf(i).vendor; (pv[v] = pv[v] || []).push(i); });
                const rowsHtml = Object.keys(pv).sort((a, b) => a.localeCompare(b)).map(v => {
                    const list = pv[v];
                    return `<h3>${esc(v)}</h3><table><thead><tr><th>Customer/Job</th><th>Bill #</th><th>Bill date</th><th>Due date</th><th>Item</th><th>Memo</th><th class="n">Amount</th><th>Entered</th></tr></thead><tbody>`
                        + list.map(i => { const q = qbOf(i); return `<tr><td>${esc(q.customer)}</td><td>${esc(q.billNo)}</td><td>${esc(shortDate(q.billDate))}</td><td>${esc(shortDate(q.dueDate))}</td><td>${esc(q.item)}</td><td>${esc(q.memo)}</td><td class="n">${esc(money(i.amount || 0))}</td><td class="box">&#9744;</td></tr>`; }).join('')
                        + `<tr class="t"><td colspan="6">${esc(v)}: ${list.length} bill${list.length === 1 ? '' : 's'}</td><td class="n">${esc(money(sum(list)))}</td><td></td></tr></tbody></table>`;
                }).join('');
                const html = `<!doctype html><html><head><meta charset="utf-8"><title>Bills for QuickBooks ${esc(dateOnly(now))}</title><style>
                    body{font-family:-apple-system,Segoe UI,sans-serif;font-size:12px;color:#222;margin:24px}h1{font-size:18px;margin:0 0 4px}.sub{color:#555;margin-bottom:16px}
                    h3{font-size:14px;margin:18px 0 6px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:4px 6px;text-align:left}
                    th{background:#eee}.n{text-align:right;white-space:nowrap}.box{text-align:center;font-size:14px}.t td{font-weight:bold;background:#f6f6f6}
                    .grand{font-size:14px;font-weight:bold;margin-top:16px}.sign{margin-top:28px}@media print{button{display:none}}</style></head><body>
                    <button onclick="window.print()">Print</button>
                    <h1>Bills for QuickBooks</h1><div class="sub">Freeman Restoration · printed ${esc(dateTime(now))} by ${esc(who)} · checked by Bookkeeping in Accounts Payable</div>
                    ${rowsHtml}<div class="grand">Total: ${checked.length} bill${checked.length === 1 ? '' : 's'} · ${esc(money(sum(checked)))}</div>
                    <div class="sign">Entered in QuickBooks by: ______________________ &nbsp;&nbsp; Date: ____________</div></body></html>`;
                return html;
            };
            const printList = async () => {
                if (!checked.length) return;
                const now = new Date();
                const who = profile.name || user.email;
                const html = listHtml(now, who);
                const w = window.open('', '_blank');
                if (!w) { setMsg({ text: 'The print page was blocked. Allow pop-ups for this site, then click Print again.', ok: false }); return; }
                w.document.open(); w.document.write(html); w.document.close();
                try { w.focus(); setTimeout(() => { try { w.print(); } catch (e) { /* the page has its own Print button */ } }, 300); } catch (e) { /* ignore */ }
                // Record what was printed
                try {
                    const b = db.batch();
                    checked.forEach(i => {
                        const ref = db.collection('apInvoices').doc(i.id);
                        b.update(ref, { qb: { ...i.qb, printedAt: now, printedBy: by() } });
                        b.set(ref.collection('history').doc(), { action: 'Printed for QuickBooks', at: now, by: by() });
                    });
                    await b.commit();
                    setMsg({ text: `Printed ${checked.length} checked bill${checked.length === 1 ? '' : 's'} (${money(sum(checked))}). After entering them in QuickBooks, click Mark checked bills In QuickBooks.`, ok: true });
                } catch (error) { setMsg({ text: 'Printed, but the print record didn\'t save: ' + error.message, ok: false }); }
            };

            // 3b: the checked bills' files in one zip, a folder per supplier (QuickBooks name), with a copy of the printed list.
            // Needs the one-time CORS setting on the Storage bucket so the page may download the files.
            const [zipping, setZipping] = useState('');
            const downloadZip = async () => {
                if (!checked.length) return;
                setZipping('Getting ready...'); setMsg(null);
                const now = new Date();
                const who = profile.name || user.email;
                const stamp = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}-${String(now.getFullYear()).slice(-2)}`;
                try {
                    await loadScript(JSZIP_URL);
                    const zip = new window.JSZip();
                    const used = {};
                    const missing = [];
                    const got = [];
                    let k = 0;
                    for (const i of checked) {
                        k++;
                        setZipping(`Downloading ${k} of ${checked.length}...`);
                        const folder = cleanPart(qbOf(i).vendor || i.vendor || 'Supplier').replace(/-/g, ' ');
                        let name = (i.file && i.file.name) || `${i.invoiceNumber}.pdf`;
                        const key = (folder + '/' + name).toLowerCase();
                        if (used[key]) { const dot = name.lastIndexOf('.'); name = dot > 0 ? `${name.slice(0, dot)} (${used[key] + 1})${name.slice(dot)}` : `${name} (${used[key] + 1})`; }
                        used[key] = (used[key] || 0) + 1;
                        try {
                            if (!i.file || !i.file.url) throw new Error('no file saved');
                            zip.file(`${folder}/${name}`, await fetchFile(i.file.url));
                            got.push(i);
                        } catch (error) {
                            missing.push(`${i.vendor} ${i.invoiceNumber} (${name}): ${error.message === 'Failed to fetch' ? 'blocked (the /fbstorage line in _redirects)' : error.message}`);
                        }
                    }
                    if (!got.length) {
                        setZipping('');
                        setMsg({ text: missing.every(m => m.includes('blocked')) ? 'No files could be downloaded. The site\'s _redirects file (the /fbstorage line) is probably missing: see the AP handoff note, or ask Aubree.'
                            : 'No files could be downloaded: ' + missing.join('; '), ok: false });
                        return;
                    }
                    zip.file(`Bills for QuickBooks ${stamp}.html`, listHtml(now, who));
                    if (missing.length) zip.file('MISSING FILES.txt', 'These bills are on the list but their files could not be downloaded:\r\n\r\n' + missing.join('\r\n') + '\r\n');
                    setZipping('Making the zip...');
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `AP for QuickBooks ${stamp}.zip`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
                    // Record it on each bill that made it into the zip
                    try {
                        const b = db.batch();
                        got.forEach(i => {
                            const ref = db.collection('apInvoices').doc(i.id);
                            b.update(ref, { qb: { ...i.qb, zippedAt: now, zippedBy: by() } });
                            b.set(ref.collection('history').doc(), { action: 'Downloaded in zip', at: now, by: by() });
                        });
                        await b.commit();
                    } catch (error) { /* the zip is already downloaded; the record is only a note */ }
                    setZipping('');
                    setMsg({ text: `Downloaded AP for QuickBooks ${stamp}.zip: ${got.length} file${got.length === 1 ? '' : 's'} in a folder per supplier, plus the list.`
                        + (missing.length ? ` ${missing.length} file${missing.length === 1 ? '' : 's'} couldn't be downloaded (listed in MISSING FILES.txt).` : '')
                        + ' It went to your Downloads folder unless your browser asks where to save.', ok: !missing.length });
                } catch (error) {
                    setZipping('');
                    setMsg({ text: 'Error making the zip: ' + error.message, ok: false });
                }
            };

            const openMark = (ids) => { setMark({ ids, date: todayText(), qbBillNo: '' }); setMsg(null); };
            const saveMark = async () => {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(mark.date)) { setMsg({ text: 'Pick the date it was entered in QuickBooks.', ok: false }); return; }
                const list = toQb.filter(i => mark.ids.includes(i.id));
                const notChecked = list.filter(i => !qbChecked(i));
                if (notChecked.length) { setMsg({ text: 'Only checked bills can be marked In QuickBooks. Check the line first.', ok: false }); return; }
                setBusy(true);
                try {
                    const now = new Date();
                    const b = db.batch();
                    list.forEach(i => {
                        const ref = db.collection('apInvoices').doc(i.id);
                        const qbEntered = { date: mark.date, qbBillNo: mark.ids.length === 1 ? mark.qbBillNo.trim() : '', at: now, by: by() };
                        b.update(ref, { qbEntered });
                        b.set(ref.collection('history').doc(), { action: 'In QuickBooks', date: mark.date, qbBillNo: qbEntered.qbBillNo, qb: qbOf(i), at: now, by: by() });
                    });
                    await b.commit();
                    setMark(null);
                    setMsg({ text: `${list.length} bill${list.length === 1 ? '' : 's'} marked In QuickBooks (${money(sum(list))}).`, ok: true });
                } catch (error) { setMsg({ text: 'Error: ' + error.message, ok: false }); }
                setBusy(false);
            };
            const undo = async (i) => {
                const reason = window.prompt(`Undo "In QuickBooks" for ${i.vendor} ${i.invoiceNumber}? It goes back on the For QuickBooks list.\n\nWhy? (required)`, '');
                if (reason === null) return;
                if (!reason.trim()) { setMsg({ text: 'Type why it is being undone.', ok: false }); return; }
                try {
                    const now = new Date();
                    const ref = db.collection('apInvoices').doc(i.id);
                    const b = db.batch();
                    b.update(ref, { qbEntered: null });
                    b.set(ref.collection('history').doc(), { action: 'Undo In QuickBooks', reason: reason.trim(), before: i.qbEntered, at: now, by: by() });
                    await b.commit();
                    setMsg({ text: `${i.vendor} ${i.invoiceNumber} is back on the For QuickBooks list.`, ok: true });
                } catch (error) { setMsg({ text: 'Error: ' + error.message, ok: false }); }
            };

            const lineRow = (i) => {
                const q = qbOf(i);
                const editing = editId === i.id;
                return (
                    <React.Fragment key={i.id}>
                        <tr className={editing ? 'editing-row' : ''}>
                            <td>{qbChecked(i) ? <span className="pill checked">Checked</span> : <span className="pill unchecked">Not checked</span>}
                                {i.qb && i.qb.printedAt && <small>Printed {dateOnly(i.qb.printedAt)}</small>}
                                {i.qb && i.qb.zippedAt && <small>Files downloaded {dateOnly(i.qb.zippedAt)}</small>}</td>
                            <td>{q.customer}<small>{i.po ? i.po.poNumber : ''}</small></td>
                            <td>{q.billNo}{q.billNo !== i.invoiceNumber && <small>AP: {i.invoiceNumber}</small>}</td>
                            <td>{shortDate(q.billDate)}{q.dueDate && <small>Due {shortDate(q.dueDate)}</small>}</td>
                            <td>{q.item || <span className="warn">none</span>}<small>{q.memo}</small></td>
                            <td className="num">{money(i.amount || 0)}<small>{i.appr && i.appr.by ? 'Pay: ' + i.appr.by.name : ''}</small></td>
                            <td><div className="row-btns">
                                {i.file && i.file.url && <button className="btn-secondary btn-sm" onClick={() => window.open(i.file.url)}>View</button>}
                                {!editing && <button className="btn-secondary btn-sm" onClick={() => openEdit(i)} disabled={busy}>{qbChecked(i) ? 'Correct' : 'Check'}</button>}
                                {!editing && qbChecked(i) && <button className="btn-link" onClick={() => openMark([i.id])} disabled={busy}>In QuickBooks</button>}
                            </div></td>
                        </tr>
                        {editing && draft && (
                            <tr className="qb-edit"><td colSpan="7">
                                <div className="qb-form">
                                    <div><label>Supplier (as in QuickBooks)</label><input type="text" value={draft.vendor} onChange={e => setDraft(d => ({ ...d, vendor: e.target.value }))} /></div>
                                    <div><label>Customer/Job</label><input type="text" value={draft.customer} onChange={e => setDraft(d => ({ ...d, customer: e.target.value }))} /></div>
                                    <div><label>Bill #</label><input type="text" value={draft.billNo} onChange={e => setDraft(d => ({ ...d, billNo: e.target.value }))} /></div>
                                    <div><label>QuickBooks item</label>
                                        <select value={draft.item} onChange={e => setDraft(d => ({ ...d, item: e.target.value }))}>
                                            <option value="">-- Pick the item --</option>
                                            {QB_ITEMS.map(it => <option key={it} value={it}>{it}</option>)}
                                        </select></div>
                                    <div><label>Bill date</label><input type="date" value={draft.billDate} onChange={e => setDraft(d => ({ ...d, billDate: e.target.value }))} /></div>
                                    <div><label>Due date (optional)</label><input type="date" value={draft.dueDate} onChange={e => setDraft(d => ({ ...d, dueDate: e.target.value }))} /></div>
                                    <div style={{ gridColumn: 'span 2' }}><label>Memo</label><input type="text" value={draft.memo} onChange={e => setDraft(d => ({ ...d, memo: e.target.value }))} /></div>
                                </div>
                                <div className="muted" style={{ margin: '4px 0' }}>Amount {money(i.amount || 0)} can't be changed here. If it's wrong, Production Admin sets the invoice back to Pending (Review) with a note.</div>
                                <label className="check"><input type="checkbox" checked={!!draft.checked} onChange={e => setDraft(d => ({ ...d, checked: e.target.checked }))} /> Checked and ready to enter in QuickBooks</label>
                                {msg && msg.id === i.id && <div className="error">{msg.text}</div>}
                                <div className="actions" style={{ marginTop: '6px' }}>
                                    <button className="btn-secondary btn-auto btn-sm" onClick={() => { setEditId(null); setDraft(null); }} disabled={busy}>Cancel</button>
                                    <button className="btn-primary btn-auto btn-sm" onClick={() => saveEdit(i)} disabled={busy}>{busy ? 'Saving...' : 'Save'}</button>
                                </div>
                            </td></tr>
                        )}
                    </React.Fragment>
                );
            };

            return (
                <div className="section">
                    <div className="section-title">For QuickBooks: Ready to pay, not yet entered</div>
                    <p className="muted" style={{ marginBottom: '10px' }}>Check and correct each bill as it should go into QuickBooks, print the checked list, enter it in QuickBooks, then mark those bills In QuickBooks. Every correction is kept in the invoice's history.</p>
                    {allInvoices === null && <p className="muted">Loading invoices...</p>}
                    {allInvoices && (
                        <div className="list-sum">
                            <span>{toQb.length} bill{toQb.length === 1 ? '' : 's'} · {money(sum(toQb))} · {checked.length} checked</span>
                            <span className="row-btns">
                                <button className="btn-secondary btn-auto btn-sm" onClick={printList} disabled={busy || !!zipping || !checked.length}>Print checked list ({checked.length})</button>
                                <button className="btn-secondary btn-auto btn-sm" onClick={downloadZip} disabled={busy || !!zipping || !checked.length}>{zipping || `Download checked files (${checked.length})`}</button>
                                <button className="btn-primary btn-auto btn-sm" onClick={() => openMark(checked.map(i => i.id))} disabled={busy || !checked.length}>Mark checked bills In QuickBooks ({checked.length})</button>
                            </span>
                        </div>
                    )}
                    {mark && (
                        <div className="review-box">
                            <div className="section-title" style={{ marginBottom: '6px' }}>Mark {mark.ids.length} bill{mark.ids.length === 1 ? '' : 's'} In QuickBooks ({money(sum(toQb.filter(i => mark.ids.includes(i.id))))})</div>
                            <div className="grid2">
                                <div className="form-group"><label htmlFor="qb-date">Date entered in QuickBooks</label>
                                    <input id="qb-date" type="date" value={mark.date} onChange={e => setMark(m => ({ ...m, date: e.target.value }))} /></div>
                                {mark.ids.length === 1 && <div className="form-group"><label htmlFor="qb-no">QuickBooks bill # (optional)</label>
                                    <input id="qb-no" type="text" value={mark.qbBillNo} onChange={e => setMark(m => ({ ...m, qbBillNo: e.target.value }))} /></div>}
                            </div>
                            {msg && !msg.ok && !msg.id && <div className="error">{msg.text}</div>}
                            <div className="actions">
                                <button className="btn-secondary btn-auto" onClick={() => setMark(null)} disabled={busy}>Cancel</button>
                                <button className="btn-primary btn-auto" onClick={saveMark} disabled={busy}>{busy ? 'Saving...' : 'Mark In QuickBooks'}</button>
                            </div>
                        </div>
                    )}
                    {msg && !msg.id && !(mark && !msg.ok) && <div className={msg.ok ? 'ok' : 'error'} style={{ marginBottom: '10px' }}>{msg.text}</div>}
                    {allInvoices && toQb.length === 0 && <p className="muted">Nothing waiting for QuickBooks.</p>}
                    {vendors.map(v => (
                        <div key={v} className="qb-group">
                            <div className="qb-group-head"><span>{v}</span><span>{groups[v].length} · {money(sum(groups[v]))}</span></div>
                            <div className="table-wrap"><table>
                                <thead><tr><th></th><th>Customer/Job</th><th>Bill #</th><th>Bill date</th><th>Item</th><th className="num">Amount</th><th></th></tr></thead>
                                <tbody>{groups[v].map(lineRow)}</tbody>
                            </table></div>
                        </div>
                    ))}
                    {done.length > 0 && (
                        <div style={{ marginTop: '10px' }}>
                            <button className="btn-link" onClick={() => setShowDone(x => !x)}>{showDone ? 'Hide' : 'Show'} bills already In QuickBooks ({done.length})</button>
                            {showDone && (
                                <div className="table-wrap"><table>
                                    <thead><tr><th>Entered</th><th>Supplier</th><th>Customer/Job</th><th>Bill #</th><th className="num">Amount</th><th></th></tr></thead>
                                    <tbody>{done.map(i => { const q = qbOf(i); return (
                                        <tr key={i.id}><td>{shortDate(i.qbEntered.date)}<small>{i.qbEntered.by ? i.qbEntered.by.name : ''}{i.qbEntered.qbBillNo ? ' · QB # ' + i.qbEntered.qbBillNo : ''}</small></td>
                                            <td>{q.vendor}</td><td>{q.customer}</td><td>{q.billNo}</td><td className="num">{money(i.amount || 0)}</td>
                                            <td><button className="btn-link" onClick={() => undo(i)}>Undo</button></td></tr>); })}</tbody>
                                </table></div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function APApp() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, 'pending', 'notset', 'noaccess', object = can use AP
            const [authError, setAuthError] = useState('');
            const [jobs, setJobs] = useState(null);        // null = loading
            const [jobsError, setJobsError] = useState('');
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState(START_JOB_ID);
            const [superInfo, setSuperInfo] = useState(undefined); // undefined = loading, null = none picked
            const [pos, setPos] = useState(null);          // null = loading
            const [posError, setPosError] = useState('');
            const [allInvoices, setAllInvoices] = useState(null); // Owner/Admin: every invoice on every job, hidden ones included (null = loading)
            const [myInvoices, setMyInvoices] = useState(null);   // everyone else: invoices assigned to them, all jobs
            const [invError, setInvError] = useState('');
            const [vendorList, setVendorList] = useState(SUPPLIERS); // the saved supplier list (Owner/Admin)
            const [showAdd, setShowAdd] = useState(false);
            const [form, setForm] = useState(blankForm());
            const [file, setFile] = useState(null);
            const [dragOver, setDragOver] = useState(false);
            const [people, setPeople] = useState(null);       // all users (Owner/Admin only): approver pick list and names for filters
            const [peopleError, setPeopleError] = useState('');
            const [showHidden, setShowHidden] = useState(false); // Owner/Admin: show hidden invoices (greyed, with Restore)
            const [editId, setEditId] = useState(null);       // the invoice being edited (null = adding a new one)
            const [editOrig, setEditOrig] = useState(null);   // the form as it was when Edit opened (to tell if anything changed)
            const [filters, setFilters] = useState(BLANK_FILTERS); // all-invoices list
            const [reviewId, setReviewId] = useState(null);   // the invoice Production Admin is reviewing (2a)
            const [review, setReview] = useState({ status: '', note: '' });
            const [reviewMsg, setReviewMsg] = useState(null);
            const [reviewSaving, setReviewSaving] = useState(false);
            const [apprId, setApprId] = useState(null);       // the invoice the approver is deciding on (2b)
            const [apprForm, setApprForm] = useState({ status: '', note: '' });
            const [apprMsg, setApprMsg] = useState(null);
            const [apprSaving, setApprSaving] = useState(false);
            const [apprDone, setApprDone] = useState('');     // message after the approver saves
            const [showBatch, setShowBatch] = useState(false); // 1d batch upload box (Owner/Admin, no job picked)
            const [view, setView] = useState('invoices');      // 3a: 'invoices' or 'books' (Owner/Admin, no job picked)
            const [notesId, setNotesId] = useState(null);     // the invoice whose notes are open (2c)
            const [notes, setNotes] = useState(null);         // its notes, oldest first (null = loading)
            const [notesErr, setNotesErr] = useState('');
            const [noteText, setNoteText] = useState('');
            const [noteAsk, setNoteAsk] = useState(false);    // "Needs an answer"
            const [noteMsg, setNoteMsg] = useState(null);
            const [noteSaving, setNoteSaving] = useState(false);
            const [noteEditId, setNoteEditId] = useState(null);
            const [noteEditText, setNoteEditText] = useState('');
            const [saving, setSaving] = useState(false);
            const [formMsg, setFormMsg] = useState(null);   // { text, ok } inside the Add box
            const [listMsg, setListMsg] = useState('');     // after a save

            // Sign-in and role check. This page never creates user records (new people sign in on the Dashboard).
            useEffect(() => {
                return auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) return;
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: currentUser.uid, ...d });
                        else if (d && d.role === 'pending') setProfile('pending');
                        else if (d && d.active === true) setProfile('noaccess');
                        else setProfile('notset');
                    } catch (err) {
                        setProfile('notset');
                    }
                });
            }, []);

            const isAdmin = !!profile && typeof profile === 'object' && ['owner', 'admin'].includes(profile.role);
            // Production Admin step: any user with the Admin role (decided Oct 30). Owner adds notes only, so can't pass (Spencer).
            const isPA = !!profile && typeof profile === 'object' && profile.role === 'admin';

            // Job list: all jobs, or only assigned jobs for Supers (the rules require the assignedSupers query)
            useEffect(() => {
                setJobs(null);
                if (!profile || typeof profile !== 'object') return;
                let query = db.collection('jobs');
                if (profile.role === 'super') query = query.where('assignedSupers', 'array-contains', profile.uid);
                return query.onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, code: d.code || '', address: d.address || '', cityStateZip: d.cityStateZip || '', archived: d.archived === true,
                            assignedSupers: Array.isArray(d.assignedSupers) ? d.assignedSupers : [] });
                    });
                    list.sort((a, b) => a.code.localeCompare(b.code));
                    setJobs(list);
                    setJobsError('');
                }, error => { setJobs([]); setJobsError('Error loading jobs: ' + error.message); });
            }, [profile]);

            const job = jobId && jobs ? jobs.find(j => j.id === jobId) : null;
            const jobReady = !!job;

            // The job's Super, read from Customer Information (team.super)
            useEffect(() => {
                setSuperInfo(undefined);
                if (!jobReady) return;
                return db.collection('jobs').doc(jobId).collection('notesInfo').doc('contactCard').onSnapshot(doc => {
                    const t = doc.exists ? (doc.data().team || {}) : {};
                    setSuperInfo(t.super && t.super.uid ? t.super : null);
                }, () => setSuperInfo(null));
            }, [jobId, jobReady]);

            // The job's POs from PO Manager. Read only: AP never changes them. Hidden POs are left out.
            useEffect(() => {
                setPos(null);
                setPosError('');
                if (!jobReady) return;
                return db.collection('jobs').doc(jobId).collection('forms').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        if (d.deleted === true) return;
                        list.push({ id: doc.id, poNumber: d.poNumber || '', category: d.category || '', subName: d.subName || '',
                            status: poStatus(d.status), amount: amountOf(d.contractAmount) });
                    });
                    list.sort((a, b) => a.poNumber.localeCompare(b.poNumber, undefined, { numeric: true }));
                    setPos(list);
                }, error => { setPos([]); setPosError('Error loading POs: ' + error.message); });
            }, [jobId, jobReady]);

            // Invoices, newest received first. Hidden ones are left out unless keepHidden.
            const toList = (snapshot, keepHidden) => {
                const list = [];
                snapshot.forEach(doc => { const d = doc.data(); if (keepHidden || d.deleted !== true) list.push({ id: doc.id, ...d }); });
                const ms = (t) => t && t.toMillis ? t.toMillis() : 0;
                return list.sort((a, b) => (b.dateReceived || '').localeCompare(a.dateReceived || '') || ms(b.createdAt) - ms(a.createdAt));
            };

            // Owner/Admin: every invoice on every job, hidden ones included. One live list feeds the all-invoices list,
            // the job's list and the duplicate check (1c).
            useEffect(() => {
                setAllInvoices(null);
                if (!isAdmin) return;
                setInvError('');
                return db.collection('apInvoices').onSnapshot(
                    snapshot => setAllInvoices(toList(snapshot, true)),
                    error => { setAllInvoices([]); setInvError('Error loading invoices: ' + error.message); });
            }, [isAdmin]);

            // Everyone else: the invoices assigned to them, on any job (Spencer, Oct 29: an approver may be on a job they aren't
            // assigned to). The rules refuse any other list, so the query asks by approver.
            useEffect(() => {
                setMyInvoices(null);
                if (!profile || typeof profile !== 'object' || isAdmin) return;
                return db.collection('apInvoices').where('approver.uid', '==', profile.uid).onSnapshot(
                    snapshot => setMyInvoices(toList(snapshot)),
                    error => { setMyInvoices([]); setInvError('Error loading invoices: ' + error.message); });
            }, [profile, isAdmin]);

            // The saved supplier list (Owner/Admin). Until the first name is added, it's the five starting names.
            useEffect(() => {
                if (!isAdmin) return;
                return vendorsDoc().onSnapshot(doc => {
                    const saved = doc.exists && Array.isArray(doc.data().list) ? doc.data().list : [];
                    const all = [...SUPPLIERS, ...saved.filter(n => !SUPPLIERS.includes(n) && !RETIRED_SUPPLIERS.includes(n))];
                    setVendorList(all);
                }, () => setVendorList(SUPPLIERS));
            }, [isAdmin]);

            // The picked job's invoices. Owner/Admin: from the all-invoices list (hidden ones too, shown only with Show hidden).
            // Everyone else: the invoices assigned to them on this job.
            const jobAll = !jobId ? null
                : isAdmin ? (allInvoices ? allInvoices.filter(i => i.jobId === jobId) : null)
                : (myInvoices ? myInvoices.filter(i => i.jobId === jobId) : null);
            const invoices = jobAll ? jobAll.filter(i => showHidden || i.deleted !== true) : null;
            const activeJob = (jobAll || []).filter(i => i.deleted !== true); // for the PO balance: hidden invoices never count
            const editInv = editId ? (jobAll || []).find(i => i.id === editId) || null : null;
            const reviewInv = reviewId ? (jobAll || []).find(i => i.id === reviewId) || null : null;
            // Passed invoices count against the PO balance right away (decided Oct 30), hidden ones never
            const passedOn = (formId, exceptId) => activeJob.filter(i => i.id !== exceptId && i.po && i.po.formId === formId && isPassed(i))
                .reduce((s, i) => s + (i.amount || 0), 0);
            const notPassedOn = (formId, exceptId) => activeJob.filter(i => i.id !== exceptId && i.po && i.po.formId === formId && !isPassed(i))
                .reduce((s, i) => s + (i.amount || 0), 0);

            // Users (Owner/Admin): the approver pick list and the names in the filters
            useEffect(() => {
                if (!isAdmin || people) return;  // loads once for Owner/Admin (approver pick lists in Add, Edit and Batch upload)
                db.collection('users').get().then(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ uid: doc.id, name: d.name || d.email || '', role: d.role || '', active: d.active === true });
                    });
                    list.sort((a, b) => a.name.localeCompare(b.name));
                    setPeople(list);
                }).catch(error => { setPeople([]); setPeopleError('Error loading people: ' + error.message); });
            }, [isAdmin, people]);
            // People who can be picked as approver: active Admin, Estimator, Super and Office users
            const approvers = people ? people.filter(p => p.active && APPROVER_ROLES.includes(p.role)) : null;

            // The approver starts as the job's Super (Spencer, Oct 28). Production Admin can change it.
            useEffect(() => {
                if (showAdd && !form.approverUid && superInfo && superInfo.uid) setForm(f => f.approverUid ? f : { ...f, approverUid: superInfo.uid });
            }, [showAdd, superInfo]);

            // Notes of the open invoice (2c). The rule lets Owner/Admin and the invoice's approver read them.
            useEffect(() => {
                setNotes(null); setNotesErr('');
                if (!notesId) return;
                return db.collection('apInvoices').doc(notesId).collection('apNotes').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    const ms = (t) => { const d = asDate(t); return d ? d.getTime() : 0; };
                    list.sort((a, b) => ms(a.at) - ms(b.at));
                    setNotes(list);
                }, error => { setNotes([]); setNotesErr('Error loading notes: ' + error.message); });
            }, [notesId]);

            // Pick a job. The address keeps the job, so a refresh stays on it.
            const pickJob = (id) => {
                if (showAdd && formTouched() && !window.confirm('Switch jobs and drop the invoice you started?')) return;
                if (reviewId && reviewTouched() && !window.confirm('Switch jobs and drop the review you started?')) return;
                closeAdd(true);
                closeReview(true);
                setListMsg('');
                setJobId(id);
                window.history.replaceState(null, '', id ? '?job=' + encodeURIComponent(id) : window.location.pathname);
            };

            const formTouched = () => editId
                ? !!file || !same(form, editOrig)
                : !!file || ['formId', 'vendorPick', 'vendorOther', 'invoiceNumber', 'amount', 'previousPayment'].some(k => String(form[k] || '').trim());
            const openAdd = () => { if (reviewId) { if (reviewTouched() && !window.confirm('Drop the review you started?')) return; setReviewId(null); }
                setForm(blankForm()); setEditId(null); setEditOrig(null); setFile(null); setFormMsg(null); setListMsg(''); setShowAdd(true); };
            const closeAdd = (force) => {
                if (!force && formTouched() && !window.confirm(editId ? 'Close and drop your changes?' : 'Close and drop what you typed?')) return;
                setShowAdd(false); setForm(blankForm()); setEditId(null); setEditOrig(null); setFile(null); setFormMsg(null);
            };
            // Edit (Owner/Admin): the same form, filled in from the saved invoice
            const openEdit = (inv) => {
                if (inQb(inv)) { window.alert('This bill is In QuickBooks. Bookkeeping clicks Undo on the Bookkeeping page before it can be edited.'); return; }
                if (reviewId) closeReview(true);
                if (showAdd && formTouched() && !window.confirm(`Drop what you typed and edit invoice ${inv.invoiceNumber} instead?`)) return;
                const sup = inv.kind === 'supplier';
                const onList = sup ? vendorList.find(n => n === inv.vendor) : null;
                const f = {
                    kind: sup ? 'supplier' : 'sub', formId: inv.po ? inv.po.formId : '',
                    vendorPick: sup ? (onList || OTHER) : '', vendorOther: sup && !onList ? (inv.vendor || '') : '', addVendor: false,
                    invoiceNumber: inv.invoiceNumber || '', amount: typeof inv.amount === 'number' ? String(inv.amount) : '',
                    dateReceived: inv.dateReceived || '', previousPayment: typeof inv.previousPayment === 'number' ? String(inv.previousPayment) : '',
                    approverUid: inv.approver ? inv.approver.uid : ''
                };
                setForm(f); setEditOrig(f); setEditId(inv.id); setFile(null); setFormMsg(null); setListMsg(''); setShowAdd(true);
            };

            // Edit from an all-jobs list: switch to the bill's job, then open the form once its invoices are there
            const [pendingEdit, setPendingEdit] = useState(null);
            const editFromList = (inv) => {
                if (inQb(inv)) { window.alert('This bill is In QuickBooks. Bookkeeping clicks Undo on the Bookkeeping page before it can be edited.'); return; }
                if (jobId === inv.jobId) { openEdit(inv); return; }
                pickJob(inv.jobId); setPendingEdit(inv.id);
            };
            useEffect(() => {
                if (!pendingEdit || !jobAll) return;
                const inv = jobAll.find(i => i.id === pendingEdit);
                setPendingEdit(null);
                if (!inv) return;
                openEdit(inv);
                setTimeout(() => { const box = document.querySelector('.add-box'); if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
            }, [pendingEdit, jobAll]);

            // Hide (Owner/Admin). Nothing is deleted: the record is marked hidden and a history line is added.
            const hideInvoice = async (inv) => {
                if (inQb(inv)) { window.alert('This bill is In QuickBooks. Bookkeeping clicks Undo on the Bookkeeping page before it can be hidden.'); return; }
                const reason = window.prompt(`Hide invoice ${inv.invoiceNumber} from ${inv.vendor} (${typeof inv.amount === 'number' ? money(inv.amount) : ''})?\n`
                    + 'It drops out of every list and out of the PO balance. Owner or Admin can restore it.\n\nWhy is it being hidden? (optional)', '');
                if (reason === null) return;
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    batch.update(ref, { deleted: true, deletedAt: now, deletedBy: by, deletedReason: reason.trim() });
                    batch.set(ref.collection('history').doc(), { action: 'Hidden', at: now, by, reason: reason.trim() });
                    await batch.commit();
                    if (editId === inv.id) closeAdd(true);
                    setListMsg(`Invoice ${inv.invoiceNumber} from ${inv.vendor} hidden. Tick "Show hidden" to see or restore it.`);
                } catch (error) {
                    window.alert('Error hiding the invoice: ' + error.message);
                }
            };
            // Restore (Owner/Admin). Blocked if the same vendor + invoice # was added again while this one was hidden.
            // Production Admin review (2a): Pass / Pending / Supplement with a note. Pass is blocked over the PO balance.
            const reviewTouched = () => !!(review.note.trim() || (reviewInv && review.status !== ((reviewInv.pa && reviewInv.pa.status) || '')));
            const openReview = (inv) => {
                if (showAdd && formTouched() && !window.confirm('Drop what you typed and review this invoice instead?')) return;
                if (reviewId && reviewId !== inv.id && reviewTouched() && !window.confirm('Drop the review you started?')) return;
                if (showAdd) closeAdd(true);
                setReviewId(inv.id); setReview({ status: (inv.pa && inv.pa.status) || '', note: '' }); setReviewMsg(null); setListMsg('');
            };
            const closeReview = (force) => {
                if (!force && reviewTouched() && !window.confirm('Close and drop the review?')) return;
                setReviewId(null); setReview({ status: '', note: '' }); setReviewMsg(null);
            };
            const saveReview = async () => {
                const inv = reviewInv;
                if (!inv) { setReviewMsg({ text: 'This invoice is no longer on the list.', ok: false }); return; }
                const st = review.status;
                const note = review.note.trim();
                const now0 = (inv.pa && inv.pa.status) || '';
                const poNow = (pos || []).find(p => p.id === (inv.po && inv.po.formId)) || null;
                const passedOther = poNow ? passedOn(poNow.id, inv.id) : 0;
                const room = poNow && poNow.amount !== null ? poNow.amount - passedOther : null;
                const dupTick = dupOpen(inv) && review.dupOk === true;
                const problem = inQb(inv) ? 'This invoice is marked In QuickBooks. Undo that on the Bookkeeping page first.'
                    : !st ? 'Pick Pass, Pending or Supplement.'
                    : st === 'Pass' && dupOpen(inv) && !dupTick ? 'This invoice is flagged as a possible duplicate. Check it against the invoice named in the orange box, then tick "Checked, not a duplicate" before it can pass.'
                    : st === now0 && !note && !dupTick ? 'Nothing changed.'
                    : (st === 'Pending' || st === 'Supplement') && !note ? `Type a note saying why it's ${st === 'Pending' ? 'pending' : 'a supplement'}.`
                    : st === 'Pass' && !poNow ? "This invoice's PO isn't on the job any more (hidden in PO Manager?). Edit the invoice to pick its PO first."
                    : st === 'Pass' && room === null ? 'This PO has no amount, so it can\'t pass. Fix the PO in PO Manager first.'
                    : st === 'Pass' && (inv.amount || 0) > room + 0.005 ? `Over the PO balance by ${money((inv.amount || 0) - room)}. It can't pass until a revised PO or a supplement covers it.`
                    : '';
                if (problem) { setReviewMsg({ text: problem, ok: false }); return; }
                // Leaving Pass clears the approver's decision (2b); it stays in the history line
                const clearsAppr = st !== 'Pass' && !!(inv.appr && inv.appr.status);
                if (clearsAppr && !window.confirm(`${inv.appr.by ? inv.appr.by.name : 'The approver'} already marked it ${inv.appr.status}. Changing it to ${st} clears their decision. Go ahead?`)) return;
                setReviewSaving(true); setReviewMsg(null);
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const pa = { status: st, note, at: now, by };
                    const keepAppr = st === 'Pass' && inv.appr && inv.appr.status ? inv.appr : null;
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    const upd = { pa, appr: keepAppr, status: statusKeyOf(pa, keepAppr) };
                    if (dupTick) upd.dupChecked = { at: now, by };
                    batch.update(ref, upd);
                    batch.set(ref.collection('history').doc(), { action: 'Production Admin', status: st, note, before: inv.pa || null,
                        apprCleared: clearsAppr ? inv.appr : null, ...(dupTick ? { dupChecked: true } : {}), at: now, by });
                    await batch.commit();
                    setListMsg(`Invoice ${inv.invoiceNumber} from ${inv.vendor}: ${st === 'Pass' ? 'Passed' : st}${st === now0 ? (dupTick && !note ? ' (checked, not a duplicate)' : ' (note added)') : ''}${dupTick && st !== now0 ? '; checked, not a duplicate' : ''}.`);
                    setReviewId(null); setReview({ status: '', note: '' });
                } catch (error) {
                    setReviewMsg({ text: 'Error saving: ' + error.message, ok: false });
                }
                setReviewSaving(false);
            };

            // Approver step (2b): the invoice's approver picks Pay / Pending / Supplement once Production Admin passed it.
            // The rule lets them change only appr and status, and add their own history line.
            const apprAll = isAdmin ? (allInvoices || []) : (myInvoices || []);
            const apprInv = apprId ? apprAll.find(i => i.id === apprId) || null : null;
            const apprTouched = () => !!(apprForm.note.trim() || (apprInv && apprForm.status !== ((apprInv.appr && apprInv.appr.status) || '')));
            const openApprove = (inv) => {
                if (apprId && apprId !== inv.id && apprTouched() && !window.confirm('Drop the decision you started?')) return;
                setApprId(inv.id); setApprForm({ status: (inv.appr && inv.appr.status) || '', note: '' }); setApprMsg(null); setApprDone('');
                try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* older browsers */ }
            };
            const closeApprove = (force) => {
                if (!force && apprTouched() && !window.confirm('Close and drop your decision?')) return;
                setApprId(null); setApprForm({ status: '', note: '' }); setApprMsg(null);
            };
            const saveApprove = async () => {
                const inv = apprInv;
                if (!inv) { setApprMsg({ text: 'This invoice is no longer on your list.', ok: false }); return; }
                const st = apprForm.status;
                const note = apprForm.note.trim();
                const now0 = (inv.appr && inv.appr.status) || '';
                const problem = inQb(inv) ? 'This invoice is already marked In QuickBooks. Ask Bookkeeping if it needs to change.'
                    : !isPassed(inv) || inv.deleted === true ? 'Production Admin has changed this invoice. It is no longer passed.'
                    : !inv.approver || inv.approver.uid !== user.uid ? 'This invoice is assigned to someone else now.'
                    : !st ? 'Pick Pay, Pending or Supplement.'
                    : st === 'Pay' && openQ(inv) > 0 ? `There ${openQ(inv) === 1 ? 'is an open question' : `are ${openQ(inv)} open questions`} on this invoice. It can't be marked Pay until ${openQ(inv) === 1 ? "it's" : "they're"} marked Answered (see Notes).`
                    : st === now0 && !note ? 'Nothing changed.'
                    : (st === 'Pending' || st === 'Supplement') && !note ? `Type a note saying why it's ${st === 'Pending' ? 'pending' : 'a supplement'}.`
                    : '';
                if (problem) { setApprMsg({ text: problem, ok: false }); return; }
                setApprSaving(true); setApprMsg(null);
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const appr = { status: st, note, at: now, by };
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    batch.update(ref, { appr, status: statusKeyOf(inv.pa, appr) });
                    batch.set(ref.collection('history').doc(), { action: 'Approver', status: st, note, before: inv.appr || null, at: now, by });
                    await batch.commit();
                    setApprDone(`Invoice ${inv.invoiceNumber} from ${inv.vendor}: ${st === 'Pay' ? 'Pay (ready to pay)' : st}${st === now0 ? ' (note added)' : ''}.`);
                    setApprId(null); setApprForm({ status: '', note: '' });
                } catch (error) {
                    setApprMsg({ text: 'Error saving: ' + error.message, ok: false });
                }
                setApprSaving(false);
            };

            // Notes (2c): Owner, Admin and the invoice's approver post. Own notes can be edited (old text kept); no deletes.
            const notesAll = isAdmin ? (allInvoices || []) : (myInvoices || []);
            const notesInv = notesId ? notesAll.find(i => i.id === notesId) || null : null;
            const myRole = profile && typeof profile === 'object' ? profile.role : '';
            const meBy = () => ({ uid: user.uid, name: profile.name || user.email, role: myRole });
            const openNotes = (inv) => {
                if (notesId && notesId !== inv.id && (noteText.trim() || noteEditId) && !window.confirm('Drop the note you started?')) return;
                setNotesId(inv.id); setNoteText(''); setNoteAsk(false); setNoteMsg(null); setNoteEditId(null); setNoteEditText('');
                try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* older browsers */ }
            };
            const closeNotes = () => {
                if ((noteText.trim() || noteEditId) && !window.confirm('Close and drop the note you started?')) return;
                setNotesId(null); setNoteText(''); setNoteAsk(false); setNoteMsg(null); setNoteEditId(null); setNoteEditText('');
            };
            const postNote = async () => {
                const inv = notesInv;
                const text = noteText.trim();
                if (!inv) { setNoteMsg({ text: 'This invoice is no longer on your list.', ok: false }); return; }
                if (!text) { setNoteMsg({ text: 'Type the note.', ok: false }); return; }
                if (text.length > 4000) { setNoteMsg({ text: 'That note is too long (4,000 characters at most).', ok: false }); return; }
                setNoteSaving(true); setNoteMsg(null);
                try {
                    const now = new Date();
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const FV = firebase.firestore.FieldValue;
                    const noteRef = ref.collection('apNotes').doc();
                    const batch = db.batch();
                    batch.set(noteRef, { text, at: now, by: meBy(), needsAnswer: noteAsk, answered: false, edits: [] });
                    const upd = { noteCount: FV.increment(1), lastNoteAt: now };
                    if (noteAsk) upd.openQuestionIds = FV.arrayUnion(noteRef.id);
                    batch.update(ref, upd);
                    await batch.commit();
                    setNoteText(''); setNoteAsk(false);
                    setNoteMsg({ text: noteAsk ? 'Question posted. Pay is blocked until you (or an Owner/Admin) mark it Answered.' : 'Note posted.', ok: true });
                } catch (error) {
                    setNoteMsg({ text: 'Error posting the note: ' + error.message, ok: false });
                }
                setNoteSaving(false);
            };
            const saveNoteEdit = async (n) => {
                const text = noteEditText.trim();
                if (!text) { setNoteMsg({ text: 'A note can\'t be emptied. Post a new note instead.', ok: false }); return; }
                if (text === n.text) { setNoteEditId(null); return; }
                if (text.length > 4000) { setNoteMsg({ text: 'That note is too long (4,000 characters at most).', ok: false }); return; }
                setNoteSaving(true); setNoteMsg(null);
                try {
                    const now = new Date();
                    await db.collection('apInvoices').doc(notesId).collection('apNotes').doc(n.id).update({
                        text, editedAt: now, edits: firebase.firestore.FieldValue.arrayUnion({ text: n.text, until: now })
                    });
                    setNoteEditId(null); setNoteEditText('');
                    setNoteMsg({ text: 'Note changed. The old text is kept under it.', ok: true });
                } catch (error) {
                    setNoteMsg({ text: 'Error saving the note: ' + error.message, ok: false });
                }
                setNoteSaving(false);
            };
            const markAnswered = async (n) => {
                if (!window.confirm('Mark this question Answered?')) return;
                setNoteSaving(true); setNoteMsg(null);
                try {
                    const now = new Date();
                    const ref = db.collection('apInvoices').doc(notesId);
                    const batch = db.batch();
                    batch.update(ref.collection('apNotes').doc(n.id), { answered: true, answeredAt: now, answeredBy: meBy() });
                    batch.update(ref, { openQuestionIds: firebase.firestore.FieldValue.arrayRemove(n.id), lastNoteAt: now });
                    await batch.commit();
                    setNoteMsg({ text: 'Question marked Answered.', ok: true });
                    setApprMsg(null);
                } catch (error) {
                    setNoteMsg({ text: 'Error: ' + error.message, ok: false });
                }
                setNoteSaving(false);
            };

            const restoreInvoice = async (inv) => {
                const key = dupKeyOf(inv.vendor, inv.invoiceNumber);
                const other = (allInvoices || []).find(i => i.id !== inv.id && i.deleted !== true && dupKeyOf(i.vendor, i.invoiceNumber) === key);
                if (other) {
                    window.alert(`It can't be restored: invoice ${other.invoiceNumber} from ${other.vendor} is already in AP on ${other.jobCode || 'the Needs coding list'}. Hide that one first if this is the one to keep.`);
                    return;
                }
                if (!window.confirm(`Restore invoice ${inv.invoiceNumber} from ${inv.vendor}? It counts against the PO balance again.`
                    + (isPassed(inv) ? ' It had passed, so it comes back as Waiting on Production Admin and needs Pass and Pay again.' : ''))) return;
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    const wasPassed = isPassed(inv);
                    batch.update(ref, { deleted: false, restoredAt: now, restoredBy: by,
                        ...(wasPassed ? { pa: null, appr: null, status: statusKeyOf(null, null) } : {}) });
                    batch.set(ref.collection('history').doc(), { action: 'Restored', at: now, by,
                        ...(wasPassed ? { resetApprovals: { pa: inv.pa || null, appr: inv.appr || null } } : {}) });
                    await batch.commit();
                    setListMsg(`Invoice ${inv.invoiceNumber} from ${inv.vendor} restored.`);
                } catch (error) {
                    window.alert('Error restoring the invoice: ' + error.message);
                }
            };
            const setField = (k, v) => { setForm(f => ({ ...f, [k]: v })); setFormMsg(null); };

            const takeFile = (f) => {
                if (!f) return;
                if (!(f.type === 'application/pdf' || f.type.startsWith('image/'))) { setFormMsg({ text: 'Only a PDF or a photo can be added.', ok: false }); return; }
                if (f.size > MAX_MB * 1024 * 1024) { setFormMsg({ text: `That file is over ${MAX_MB} MB. Scan it smaller or split it.`, ok: false }); return; }
                setFile(f); setFormMsg(null);
            };

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">Sign in</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">Waiting for approval</div>
                        <p>Your account is waiting for approval. An admin will set up your access.</p>
                    </div>
                );
            }

            if (profile === 'noaccess') {
                return (
                    <div className="section">
                        <div className="section-title">No access</div>
                        <p>Accounts Payable is for {ALLOWED_TEXT}. Contact an admin if you need access.</p>
                    </div>
                );
            }

            if (profile === 'notset') {
                return (
                    <div className="section">
                        <div className="section-title">Account not set up</div>
                        <p>Your account doesn't have access. Contact an admin.</p>
                    </div>
                );
            }

            const listed = (jobs || []).filter(j => showArchived || !j.archived || j.id === jobId);
            const total = (pos || []).reduce((sum, p) => sum + (p.amount || 0), 0);

            // Add invoice: what's picked and typed so far
            const poChoices = (pos || []).filter(p => form.kind === 'supplier' ? isGeneralPO(p) : !isGeneralPO(p));
            const po = (pos || []).find(p => p.id === form.formId) || null;
            // A typed "Other" name already on the list (any capitals) uses the list's spelling
            const otherTyped = form.vendorOther.trim().replace(/\s+/g, ' ');
            const otherOnList = otherTyped ? vendorList.find(n => n.toLowerCase() === otherTyped.toLowerCase()) : null;
            const vendor = form.kind === 'sub' ? (po ? po.subName : '')
                : form.vendorPick === OTHER ? (otherOnList || otherTyped) : form.vendorPick;
            const amount = amountOf(form.amount);
            const prevPay = form.previousPayment.trim() ? amountOf(form.previousPayment) : null;
            const approvedSoFar = po ? passedOn(po.id, editId) : 0; // passed invoices on this PO (2a); approver Pay comes in 2b
            const waitingOnPo = po ? notPassedOn(po.id, editId) : 0;
            // Same vendor + invoice # already in AP (any job, not hidden) = blocked. Same PO + same amount = a warning only.
            const typedKey = vendor && form.invoiceNumber.trim() ? dupKeyOf(vendor, form.invoiceNumber) : '';
            const dupOf = typedKey && allInvoices
                ? allInvoices.find(i => i.id !== editId && i.deleted !== true && dupKeyOf(i.vendor, i.invoiceNumber) === typedKey) : null;
            const sameAmount = po && amount > 0
                ? activeJob.filter(i => i.id !== editId && i.po && i.po.formId === po.id && typeof i.amount === 'number' && Math.abs(i.amount - amount) < 0.005) : [];
            const balance = po && po.amount !== null ? po.amount - approvedSoFar : null;
            const approverList = (() => {
                const list = [...(approvers || [])];
                if (superInfo && superInfo.uid && !list.some(a => a.uid === superInfo.uid)) list.unshift({ uid: superInfo.uid, name: superInfo.name || 'Job Super', role: 'super' });
                // Editing: keep the saved approver in the list even if they're no longer active
                if (editInv && editInv.approver && editInv.approver.uid && !list.some(a => a.uid === editInv.approver.uid)) {
                    list.push({ uid: editInv.approver.uid, name: editInv.approver.name || '', role: 'no longer active' });
                }
                return list;
            })();
            const approver = approverList.find(a => a.uid === form.approverUid) || null;
            const fileName = po && vendor && amount && file && /^\d{4}-\d{2}-\d{2}$/.test(form.dateReceived)
                ? buildFileName({ category: po.category, vendor, amount, poNumber: po.poNumber, dateReceived: form.dateReceived, file }) : '';

            const handleSave = async () => {
                const missing = !po ? 'Pick the PO.' : !vendor ? 'Pick or type the vendor.' : !form.invoiceNumber.trim() ? 'Type the invoice #.'
                    : !(amount > 0) ? 'Type the invoice amount.' : !/^\d{4}-\d{2}-\d{2}$/.test(form.dateReceived) ? 'Pick the date received.'
                    : prevPay === null && form.previousPayment.trim() ? 'Previous payment must be an amount, or left blank.'
                    : !approver ? 'Pick who approves it.' : !file && !editId ? 'Add the invoice file (PDF or photo).'
                    : allInvoices === null ? 'Still loading the invoice list. Try again in a moment.'
                    : dupOf ? `Invoice ${dupOf.invoiceNumber} from ${dupOf.vendor} is already in AP on ${dupOf.jobCode || 'the Needs coding list'}. The same invoice can't be added twice.` : '';
                if (missing) { setFormMsg({ text: missing, ok: false }); return; }
                if (editId) { await saveEdit(); return; }
                setSaving(true); setFormMsg(null);
                try {
                    // 1. The file, in apInvoices/{jobId}/{invoiceId}/ (the invoice id lets the Storage rule check its approver)
                    const invRef = db.collection('apInvoices').doc();
                    const sameName = sameNameAs(fileName, allInvoices);
                    const saveName = sameName.length ? withRandom(fileName) : fileName;
                    const path = `apInvoices/${jobId}/${invRef.id}/${Date.now()}_${saveName}`;
                    const ref = storage.ref(path);
                    await ref.put(file, cleanSaveName(saveName, file.type));
                    const url = await ref.getDownloadURL();
                    // 2. The invoice record, its first history line and any new supplier name, saved together
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const batch = db.batch();
                    const newVendor = form.kind === 'supplier' && form.vendorPick === OTHER && form.addVendor && !otherOnList;
                    if (newVendor) {
                        batch.set(vendorsDoc(), {
                            list: firebase.firestore.FieldValue.arrayUnion(...SUPPLIERS, vendor),
                            added: firebase.firestore.FieldValue.arrayUnion({ name: vendor, at: now, by })
                        }, { merge: true });
                    }
                    batch.set(invRef, {
