<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts Payable - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
        .section-head .section-title { margin-bottom: 0; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-auto { width: auto; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        .ok { color: #388e3c; font-size: 13px; margin-top: 5px; }
        .warn { color: #b36b00; font-size: 12px; margin-top: 5px; font-weight: 600; }
        .muted { font-size: 13px; color: #888; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        select, input[type=text], input[type=date] { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; background: white; }
        select:focus, input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        .form-group { margin-bottom: 12px; }
        .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; font-weight: normal; margin-bottom: 0; }
        .check input { width: auto; }
        .job-head { background: #f9f9f9; border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
        .job-code { font-size: 18px; font-weight: 600; color: #333; }
        .job-addr { font-size: 13px; color: #666; margin-top: 2px; }
        .job-super { font-size: 13px; color: #333; margin-top: 6px; }
        .notice { background: #f9f9f9; border-radius: 6px; padding: 14px; font-size: 14px; color: #555; margin-bottom: 18px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; color: #333; }
        th { background: #f5f5f5; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; white-space: nowrap; }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        tr.total td { font-weight: 600; border-top: 2px solid #ddd; border-bottom: none; }
        td small { display: block; font-size: 11px; color: #888; }
        .add-box { border: 1px solid #ddd; border-radius: 6px; background: #fafcff; padding: 16px; margin-bottom: 18px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
        .kinds { display: flex; gap: 16px; margin-bottom: 12px; }
        .balance { background: white; border: 1px solid #eee; border-radius: 4px; padding: 8px 10px; font-size: 13px; color: #333; margin: -4px 0 12px; }
        .balance div { display: flex; justify-content: space-between; }
        .balance .left { font-weight: 600; border-top: 1px solid #eee; margin-top: 4px; padding-top: 4px; }
        .drop { border: 2px dashed #ccc; border-radius: 6px; padding: 18px; text-align: center; font-size: 13px; color: #666; background: white; cursor: pointer; }
        .drop.over { border-color: #0066cc; background: #f3f8fd; }
        .drop strong { color: #333; word-break: break-all; }
        .fname { font-size: 12px; color: #555; background: #f5f5f5; border-radius: 4px; padding: 6px 8px; word-break: break-all; margin-bottom: 12px; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
        tr.hidden-row td { color: #aaa; background: #fafafa; }
        tr.editing-row td { background: #fffbe6; }
        .row-btns { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
        .btn-link { background: none; color: #0066cc; padding: 5px 4px; font-size: 12px; }
        .btn-link:hover { text-decoration: underline; }
        .filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .filters select, .filters input[type=text] { padding: 6px 8px; font-size: 13px; }
        .list-sum { font-size: 13px; color: #555; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dup { color: #d32f2f; font-size: 12px; margin-top: 5px; font-weight: 600; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .pill.waiting-pa { background: #e8f0fb; color: #0052a3; }
        .pill.pa-pending { background: #fff3e0; color: #b36b00; }
        .pill.pa-supplement { background: #f3e8fb; color: #7b1fa2; }
        .pill.passed { background: #e6f4ea; color: #2e7d32; }
        .pill.ready { background: #2e7d32; color: white; }
        .pill.appr-pending { background: #fff3e0; color: #b36b00; }
        .pill.appr-supplement { background: #f3e8fb; color: #7b1fa2; }
        .appr-box { border: 1px solid #b7dcc0; border-radius: 6px; background: #f6fbf7; padding: 16px; margin-bottom: 20px; }
        .wait-title { font-weight: 600; color: #2e7d32; font-size: 14px; margin-bottom: 8px; }
        .pill.hidden { background: #eee; color: #888; }
        .review-box { border: 1px solid #c8daf0; border-radius: 6px; background: #f7fafe; padding: 16px; margin-bottom: 18px; }
        .review-facts { font-size: 13px; color: #333; margin-bottom: 10px; line-height: 1.6; }
        .review-now { font-size: 13px; background: white; border: 1px solid #eee; border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; }
        textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; min-height: 60px; }
        @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .container { padding: 18px; } .filters { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Accounts Payable</h1>
        <p class="subtitle">Sub and supplier invoices: intake, approval, and hand-off to Bookkeeping</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Same Firebase project as the other tools
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Who can open Accounts Payable (Spencer, Oct 28). Production Admin and Bookkeeping have the Admin role.
        // Estimator and Office may approve invoices on their own POs. Only Owner and Admin add invoices.
        const ALLOWED = ['owner', 'admin', 'estimator', 'super', 'office'];
        const ALLOWED_TEXT = 'Owner, Admin, Estimator, Super and Office';
        // Who can be picked to approve an invoice (Owner adds notes only, so isn't listed)
        const APPROVER_ROLES = ['admin', 'estimator', 'super', 'office'];

        // Supplier pick list (Spencer, Oct 28). Names must match the QuickBooks vendor names exactly.
        // Saved in apSettings/vendors (list). Owner and Admin add names; nobody removes them. These five start the list.
        const SUPPLIERS = ['Home Depot', "Lowe's", 'Ganahl Lumber', 'Katella Lumber', 'L&M'];
        const vendorsDoc = () => db.collection('apSettings').doc('vendors');
        const OTHER = '__other__';
        const MAX_MB = 20; // same limit as the Storage rule

        // Duplicate check (1c): same vendor + same invoice #, ignoring capitals, spaces, dashes and other punctuation
        const normKey = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const dupKeyOf = (vendor, number) => normKey(vendor) + '|' + normKey(number);
        // Firestore Timestamp or Date -> Date
        const asDate = (t) => t && t.toDate ? t.toDate() : t instanceof Date ? t : null;
        const dateOnly = (t) => { const d = asDate(t); return d ? `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}` : ''; };
        // Compare saved values without caring about key order
        const stable = (v) => v && typeof v === 'object' && !Array.isArray(v)
            ? Object.keys(v).sort().reduce((o, k) => { o[k] = stable(v[k]); return o; }, {}) : (v === undefined ? null : v);
        const same = (a, b) => JSON.stringify(stable(a)) === JSON.stringify(stable(b));
        // Step 2a: Production Admin decision on an invoice: pa = { status: 'Pass' | 'Pending' | 'Supplement', note, at, by }
        const PA_CHOICES = ['Pass', 'Pending', 'Supplement'];
        const isPassed = (i) => !!(i.pa && i.pa.status === 'Pass');
        // Status key saved on the invoice (status) and shown as a pill. Hidden invoices show Hidden.
        // Step 2b: the approver's decision once passed: appr = { status: 'Pay' | 'Pending' | 'Supplement', note, at, by }
        const APPR_CHOICES = ['Pay', 'Pending', 'Supplement'];
        const apprKeyOf = (appr) => appr.status === 'Pay' ? 'ready' : appr.status === 'Pending' ? 'appr-pending' : 'appr-supplement';
        const statusKeyOf = (pa, appr) => !pa || !pa.status ? 'waiting-pa'
            : pa.status === 'Pass' ? (appr && appr.status ? apprKeyOf(appr) : 'passed')
            : pa.status === 'Pending' ? 'pa-pending' : 'pa-supplement';
        const isReady = (i) => i.deleted !== true && isPassed(i) && !!(i.appr && i.appr.status === 'Pay');
        // Passed and waiting on this person's Pay / Pending / Supplement
        const waitingOn = (i, uid) => i.deleted !== true && isPassed(i) && !(i.appr && i.appr.status) && i.approver && i.approver.uid === uid;
        const statusOf = (i) => {
            if (i.deleted === true) return { key: 'hidden', text: 'Hidden' };
            const key = statusKeyOf(i.pa, i.appr);
            const who = i.approver && i.approver.name ? i.approver.name : 'the approver';
            const text = key === 'waiting-pa' ? 'Waiting on Production Admin'
                : key === 'passed' ? `Passed, waiting on ${who}`
                : key === 'ready' ? 'Ready to pay'
                : key === 'appr-pending' ? `Pending (${who})`
                : key === 'appr-supplement' ? `Supplement (${who})`
                : key === 'pa-pending' ? 'Pending (Production Admin)' : 'Supplement (Production Admin)';
            return { key, text };
        };
        const FIELD_LABELS = { kind: 'kind', vendor: 'vendor', invoiceNumber: 'invoice #', amount: 'amount', previousPayment: 'previous payment',
            dateReceived: 'date received', po: 'PO', approver: 'approver', file: 'file' };

        // Job from the address: /ap/?job=ID ('' = no job picked). The Dashboard tile opens with no job.
        const START_JOB_ID = new URLSearchParams(window.location.search).get('job') || '';

        // PO amounts are typed text ("12,345.00", "$2,500"). Returns a number, or null if there is none.
        const amountOf = (v) => {
            const t = String(v === undefined || v === null ? '' : v).replace(/[^0-9.\-]/g, '');
            const n = parseFloat(t);
            return isNaN(n) ? null : n;
        };
        const money = (n) => n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });

        // PO status as PO Manager shows it (older records: Complete shows as CES, none as New)
        const poStatus = (s) => s === 'Extra' ? 'Extra'
            : ['CES', 'Complete', 'Completed'].includes(s) ? 'CES'
            : s === 'Revised' ? 'Revised' : 'New';

        // A trade's General PO (for supplier bills): sub name "General Material", Cat is the trade
        const isGeneralPO = (p) => p.subName.trim().toLowerCase() === 'general material';

        const pad = (n) => String(n).padStart(2, '0');
        const todayText = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
        const shortDate = (ymd) => { const [y, m, d] = String(ymd || '').split('-'); return y && m && d ? `${+m}/${+d}/${y.slice(-2)}` : ''; };

        // File name: Trade_Vendor-Name_$Amount_PO#_MM-DD-YY.ext (handoff, Oct 21)
        const cleanPart = (t) => String(t || '').trim().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '-');
        const amountForName = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
        const extOf = (file) => {
            const m = /\.[a-z0-9]{2,5}$/i.exec(file.name || '');
            if (m) return m[0].toLowerCase();
            return file.type === 'application/pdf' ? '.pdf' : file.type === 'image/png' ? '.png' : '.jpg';
        };
        const buildFileName = ({ category, vendor, amount, poNumber, dateReceived, file }) => {
            const [y, m, d] = dateReceived.split('-');
            const trade = cleanPart(String(category || '').split('/')[0]);
            return `${trade}_${cleanPart(vendor)}_${amountForName(amount)}_${cleanPart(poNumber)}_${m}-${d}-${y.slice(-2)}${extOf(file)}`;
        };
        // Stored files get a time stamp in front so no save overwrites another; viewing still offers the clean name (same as PO Manager)
        const cleanSaveName = (name, type) => {
            const nm = String(name || 'file').replace(/["\r\n]/g, '');
            return { contentType: type || undefined, contentDisposition: `inline; filename="${nm.replace(/[^\x20-\x7e]/g, '_')}"; filename*=UTF-8''${encodeURIComponent(nm)}` };
        };

        const blankForm = () => ({ kind: 'sub', formId: '', vendorPick: '', vendorOther: '', addVendor: false, invoiceNumber: '', amount: '',
            dateReceived: todayText(), previousPayment: '', approverUid: '' });

        function APApp() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, 'pending', 'notset', 'noaccess', object = can use AP
            const [authError, setAuthError] = useState('');
            const [jobs, setJobs] = useState(null);        // null = loading
            const [jobsError, setJobsError] = useState('');
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState(START_JOB_ID);
            const [superInfo, setSuperInfo] = useState(undefined); // undefined = loading, null = none picked
            const [pos, setPos] = useState(null);          // null = loading
            const [posError, setPosError] = useState('');
            const [allInvoices, setAllInvoices] = useState(null); // Owner/Admin: every invoice on every job, hidden ones included (null = loading)
            const [myInvoices, setMyInvoices] = useState(null);   // everyone else: invoices assigned to them, all jobs
            const [invError, setInvError] = useState('');
            const [vendorList, setVendorList] = useState(SUPPLIERS); // the saved supplier list (Owner/Admin)
            const [showAdd, setShowAdd] = useState(false);
            const [form, setForm] = useState(blankForm());
            const [file, setFile] = useState(null);
            const [dragOver, setDragOver] = useState(false);
            const [people, setPeople] = useState(null);       // all users (Owner/Admin only): approver pick list and names for filters
            const [peopleError, setPeopleError] = useState('');
            const [showHidden, setShowHidden] = useState(false); // Owner/Admin: show hidden invoices (greyed, with Restore)
            const [editId, setEditId] = useState(null);       // the invoice being edited (null = adding a new one)
            const [editOrig, setEditOrig] = useState(null);   // the form as it was when Edit opened (to tell if anything changed)
            const [filters, setFilters] = useState({ superUid: '', approverUid: '', kind: '', text: '' }); // all-invoices list
            const [reviewId, setReviewId] = useState(null);   // the invoice Production Admin is reviewing (2a)
            const [review, setReview] = useState({ status: '', note: '' });
            const [reviewMsg, setReviewMsg] = useState(null);
            const [reviewSaving, setReviewSaving] = useState(false);
            const [apprId, setApprId] = useState(null);       // the invoice the approver is deciding on (2b)
            const [apprForm, setApprForm] = useState({ status: '', note: '' });
            const [apprMsg, setApprMsg] = useState(null);
            const [apprSaving, setApprSaving] = useState(false);
            const [apprDone, setApprDone] = useState('');     // message after the approver saves
            const [saving, setSaving] = useState(false);
            const [formMsg, setFormMsg] = useState(null);   // { text, ok } inside the Add box
            const [listMsg, setListMsg] = useState('');     // after a save

            // Sign-in and role check. This page never creates user records (new people sign in on the Dashboard).
            useEffect(() => {
                return auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) return;
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: currentUser.uid, ...d });
                        else if (d && d.role === 'pending') setProfile('pending');
                        else if (d && d.active === true) setProfile('noaccess');
                        else setProfile('notset');
                    } catch (err) {
                        setProfile('notset');
                    }
                });
            }, []);

            const isAdmin = !!profile && typeof profile === 'object' && ['owner', 'admin'].includes(profile.role);
            // Production Admin step: any user with the Admin role (decided Oct 30). Owner adds notes only, so can't pass (Spencer).
            const isPA = !!profile && typeof profile === 'object' && profile.role === 'admin';

            // Job list: all jobs, or only assigned jobs for Supers (the rules require the assignedSupers query)
            useEffect(() => {
                setJobs(null);
                if (!profile || typeof profile !== 'object') return;
                let query = db.collection('jobs');
                if (profile.role === 'super') query = query.where('assignedSupers', 'array-contains', profile.uid);
                return query.onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.push({ id: doc.id, code: d.code || '', address: d.address || '', cityStateZip: d.cityStateZip || '', archived: d.archived === true,
                            assignedSupers: Array.isArray(d.assignedSupers) ? d.assignedSupers : [] });
                    });
                    list.sort((a, b) => a.code.localeCompare(b.code));
                    setJobs(list);
                    setJobsError('');
                }, error => { setJobs([]); setJobsError('Error loading jobs: ' + error.message); });
            }, [profile]);

            const job = jobId && jobs ? jobs.find(j => j.id === jobId) : null;
            const jobReady = !!job;

            // The job's Super, read from Customer Information (team.super)
            useEffect(() => {
                setSuperInfo(undefined);
                if (!jobReady) return;
                return db.collection('jobs').doc(jobId).collection('notesInfo').doc('contactCard').onSnapshot(doc => {
                    const t = doc.exists ? (doc.data().team || {}) : {};
                    setSuperInfo(t.super && t.super.uid ? t.super : null);
                }, () => setSuperInfo(null));
            }, [jobId, jobReady]);

            // The job's POs from PO Manager. Read only: AP never changes them. Hidden POs are left out.
            useEffect(() => {
                setPos(null);
                setPosError('');
                if (!jobReady) return;
                return db.collection('jobs').doc(jobId).collection('forms').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        if (d.deleted === true) return;
                        list.push({ id: doc.id, poNumber: d.poNumber || '', category: d.category || '', subName: d.subName || '',
                            status: poStatus(d.status), amount: amountOf(d.contractAmount) });
                    });
                    list.sort((a, b) => a.poNumber.localeCompare(b.poNumber, undefined, { numeric: true }));
                    setPos(list);
                }, error => { setPos([]); setPosError('Error loading POs: ' + error.message); });
            }, [jobId, jobReady]);

            // Invoices, newest received first. Hidden ones are left out unless keepHidden.
            const toList = (snapshot, keepHidden) => {
                const list = [];
                snapshot.forEach(doc => { const d = doc.data(); if (keepHidden || d.deleted !== true) list.push({ id: doc.id, ...d }); });
                const ms = (t) => t && t.toMillis ? t.toMillis() : 0;
                return list.sort((a, b) => (b.dateReceived || '').localeCompare(a.dateReceived || '') || ms(b.createdAt) - ms(a.createdAt));
            };

            // Owner/Admin: every invoice on every job, hidden ones included. One live list feeds the all-invoices list,
            // the job's list and the duplicate check (1c).
            useEffect(() => {
                setAllInvoices(null);
                if (!isAdmin) return;
                setInvError('');
                return db.collection('apInvoices').onSnapshot(
                    snapshot => setAllInvoices(toList(snapshot, true)),
                    error => { setAllInvoices([]); setInvError('Error loading invoices: ' + error.message); });
            }, [isAdmin]);

            // Everyone else: the invoices assigned to them, on any job (Spencer, Oct 29: an approver may be on a job they aren't
            // assigned to). The rules refuse any other list, so the query asks by approver.
            useEffect(() => {
                setMyInvoices(null);
                if (!profile || typeof profile !== 'object' || isAdmin) return;
                return db.collection('apInvoices').where('approver.uid', '==', profile.uid).onSnapshot(
                    snapshot => setMyInvoices(toList(snapshot)),
                    error => { setMyInvoices([]); setInvError('Error loading invoices: ' + error.message); });
            }, [profile, isAdmin]);

            // The saved supplier list (Owner/Admin). Until the first name is added, it's the five starting names.
            useEffect(() => {
                if (!isAdmin) return;
                return vendorsDoc().onSnapshot(doc => {
                    const saved = doc.exists && Array.isArray(doc.data().list) ? doc.data().list : [];
                    const all = [...SUPPLIERS, ...saved.filter(n => !SUPPLIERS.includes(n))];
                    setVendorList(all);
                }, () => setVendorList(SUPPLIERS));
            }, [isAdmin]);

            // The picked job's invoices. Owner/Admin: from the all-invoices list (hidden ones too, shown only with Show hidden).
            // Everyone else: the invoices assigned to them on this job.
            const jobAll = !jobId ? null
                : isAdmin ? (allInvoices ? allInvoices.filter(i => i.jobId === jobId) : null)
                : (myInvoices ? myInvoices.filter(i => i.jobId === jobId) : null);
            const invoices = jobAll ? jobAll.filter(i => showHidden || i.deleted !== true) : null;
            const activeJob = (jobAll || []).filter(i => i.deleted !== true); // for the PO balance: hidden invoices never count
            const editInv = editId ? (jobAll || []).find(i => i.id === editId) || null : null;
            const reviewInv = reviewId ? (jobAll || []).find(i => i.id === reviewId) || null : null;
            // Passed invoices count against the PO balance right away (decided Oct 30), hidden ones never
            const passedOn = (formId, exceptId) => activeJob.filter(i => i.id !== exceptId && i.po && i.po.formId === formId && isPassed(i))
                .reduce((s, i) => s + (i.amount || 0), 0);
            const notPassedOn = (formId, exceptId) => activeJob.filter(i => i.id !== exceptId && i.po && i.po.formId === formId && !isPassed(i))
                .reduce((s, i) => s + (i.amount || 0), 0);

            // Users (Owner/Admin): the approver pick list and the names in the filters
            useEffect(() => {
                if (!isAdmin || people) return;

                    const list = [];
                    snapshot.forEach(doc => {

            }, [isAdmin, people]);
            // People who can be picked as approver: active Admin, Estimator, Super and Office users
            const approvers = people ? people.filter(p => p.active && APPROVER_ROLES.includes(p.role)) : null;

            // The approver starts as the job's Super (Spencer, Oct 28). Production Admin can change it.
            useEffect(() => {
                if (showAdd && !form.approverUid && superInfo && superInfo.uid) setForm(f => f.approverUid ? f : { ...f, approverUid: superInfo.uid });
            }, [showAdd, superInfo]);

            // Pick a job. The address keeps the job, so a refresh stays on it.
            const pickJob = (id) => {

            const formTouched = () => editId
                ? !!file || !same(form, editOrig)
                : !!file || ['formId', 'vendorPick', 'vendorOther', 'invoiceNumber', 'amount', 'previousPayment'].some(k => String(form[k] || '').trim());
            const openAdd = () => { if (reviewId) { if (reviewTouched() && !window.confirm('Drop the review you started?')) return; setReviewId(null); }
                setForm(blankForm()); setEditId(null); setEditOrig(null); setFile(null); setFormMsg(null); setListMsg(''); setShowAdd(true); };
            const closeAdd = (force) => {
                if (!force && formTouched() && !window.confirm(editId ? 'Close and drop your changes?' : 'Close and drop what you typed?')) return;
                setShowAdd(false); setForm(blankForm()); setEditId(null); setEditOrig(null); setFile(null); setFormMsg(null);
            };
            // Edit (Owner/Admin): the same form, filled in from the saved invoice
            const openEdit = (inv) => {
                if (isPassed(inv)) { window.alert('This invoice has passed. Production Admin sets it back to Pending before it can be edited.'); return; }
                if (reviewId) closeReview(true);
                if (showAdd && formTouched() && !window.confirm(`Drop what you typed and edit invoice ${inv.invoiceNumber} instead?`)) return;
                const sup = inv.kind === 'supplier';
                const onList = sup ? vendorList.find(n => n === inv.vendor) : null;
                const f = {
                    kind: sup ? 'supplier' : 'sub', formId: inv.po ? inv.po.formId : '',
                    vendorPick: sup ? (onList || OTHER) : '', vendorOther: sup && !onList ? (inv.vendor || '') : '', addVendor: false,
                    invoiceNumber: inv.invoiceNumber || '', amount: typeof inv.amount === 'number' ? String(inv.amount) : '',
                    dateReceived: inv.dateReceived || '', previousPayment: typeof inv.previousPayment === 'number' ? String(inv.previousPayment) : '',
                    approverUid: inv.approver ? inv.approver.uid : ''
                };
                setForm(f); setEditOrig(f); setEditId(inv.id); setFile(null); setFormMsg(null); setListMsg(''); setShowAdd(true);
            };

            // Hide (Owner/Admin). Nothing is deleted: the record is marked hidden and a history line is added.
            const hideInvoice = async (inv) => {
                if (isPassed(inv)) { window.alert('This invoice has passed. Production Admin sets it back to Pending before it can be hidden.'); return; }
                const reason = window.prompt(`Hide invoice ${inv.invoiceNumber} from ${inv.vendor} (${typeof inv.amount === 'number' ? money(inv.amount) : ''})?\n`
                    + 'It drops out of every list and out of the PO balance. Owner or Admin can restore it.\n\nWhy is it being hidden? (optional)', '');
                if (reason === null) return;
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    batch.update(ref, { deleted: true, deletedAt: now, deletedBy: by, deletedReason: reason.trim() });
                    batch.set(ref.collection('history').doc(), { action: 'Hidden', at: now, by, reason: reason.trim() });
                    await batch.commit();
                    if (editId === inv.id) closeAdd(true);
                    setListMsg(`Invoice ${inv.invoiceNumber} from ${inv.vendor} hidden. Tick "Show hidden" to see or restore it.`);
                } catch (error) {
                    window.alert('Error hiding the invoice: ' + error.message);
                }
            };
            // Restore (Owner/Admin). Blocked if the same vendor + invoice # was added again while this one was hidden.
            // Production Admin review (2a): Pass / Pending / Supplement with a note. Pass is blocked over the PO balance.
            const reviewTouched = () => !!(review.note.trim() || (reviewInv && review.status !== ((reviewInv.pa && reviewInv.pa.status) || '')));
            const openReview = (inv) => {
                if (showAdd && formTouched() && !window.confirm('Drop what you typed and review this invoice instead?')) return;
                if (reviewId && reviewId !== inv.id && reviewTouched() && !window.confirm('Drop the review you started?')) return;
                if (showAdd) closeAdd(true);
                setReviewId(inv.id); setReview({ status: (inv.pa && inv.pa.status) || '', note: '' }); setReviewMsg(null); setListMsg('');
            };
            const closeReview = (force) => {
                if (!force && reviewTouched() && !window.confirm('Close and drop the review?')) return;
                setReviewId(null); setReview({ status: '', note: '' }); setReviewMsg(null);
            };
            const saveReview = async () => {
                const inv = reviewInv;
                if (!inv) { setReviewMsg({ text: 'This invoice is no longer on the list.', ok: false }); return; }
                const st = review.status;
                const note = review.note.trim();
                const now0 = (inv.pa && inv.pa.status) || '';
                const poNow = (pos || []).find(p => p.id === (inv.po && inv.po.formId)) || null;
                const passedOther = poNow ? passedOn(poNow.id, inv.id) : 0;
                const room = poNow && poNow.amount !== null ? poNow.amount - passedOther : null;
                const problem = !st ? 'Pick Pass, Pending or Supplement.'
                    : st === now0 && !note ? 'Nothing changed.'
                    : (st === 'Pending' || st === 'Supplement') && !note ? `Type a note saying why it's ${st === 'Pending' ? 'pending' : 'a supplement'}.`
                    : st === 'Pass' && !poNow ? "This invoice's PO isn't on the job any more (hidden in PO Manager?). Edit the invoice to pick its PO first."
                    : st === 'Pass' && room === null ? 'This PO has no amount, so it can\'t pass. Fix the PO in PO Manager first.'
                    : st === 'Pass' && (inv.amount || 0) > room + 0.005 ? `Over the PO balance by ${money((inv.amount || 0) - room)}. It can't pass until a revised PO or a supplement covers it.`
                    : '';
                if (problem) { setReviewMsg({ text: problem, ok: false }); return; }
                // Leaving Pass clears the approver's decision (2b); it stays in the history line
                const clearsAppr = st !== 'Pass' && !!(inv.appr && inv.appr.status);
                if (clearsAppr && !window.confirm(`${inv.appr.by ? inv.appr.by.name : 'The approver'} already marked it ${inv.appr.status}. Changing it to ${st} clears their decision. Go ahead?`)) return;
                setReviewSaving(true); setReviewMsg(null);
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const pa = { status: st, note, at: now, by };
                    const keepAppr = st === 'Pass' && inv.appr && inv.appr.status ? inv.appr : null;
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    batch.update(ref, { pa, appr: keepAppr, status: statusKeyOf(pa, keepAppr) });
                    batch.set(ref.collection('history').doc(), { action: 'Production Admin', status: st, note, before: inv.pa || null,
                        apprCleared: clearsAppr ? inv.appr : null, at: now, by });
                    await batch.commit();
                    setListMsg(`Invoice ${inv.invoiceNumber} from ${inv.vendor}: ${st === 'Pass' ? 'Passed' : st}${st === now0 ? ' (note added)' : ''}.`);
                    setReviewId(null); setReview({ status: '', note: '' });
                } catch (error) {
                    setReviewMsg({ text: 'Error saving: ' + error.message, ok: false });
                }
                setReviewSaving(false);
            };

            // Approver step (2b): the invoice's approver picks Pay / Pending / Supplement once Production Admin passed it.
            // The rule lets them change only appr and status, and add their own history line.
            const apprAll = isAdmin ? (allInvoices || []) : (myInvoices || []);
            const apprInv = apprId ? apprAll.find(i => i.id === apprId) || null : null;
            const apprTouched = () => !!(apprForm.note.trim() || (apprInv && apprForm.status !== ((apprInv.appr && apprInv.appr.status) || '')));
            const openApprove = (inv) => {
                if (apprId && apprId !== inv.id && apprTouched() && !window.confirm('Drop the decision you started?')) return;
                setApprId(inv.id); setApprForm({ status: (inv.appr && inv.appr.status) || '', note: '' }); setApprMsg(null); setApprDone('');
                try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* older browsers */ }
            };
            const closeApprove = (force) => {
                if (!force && apprTouched() && !window.confirm('Close and drop your decision?')) return;
                setApprId(null); setApprForm({ status: '', note: '' }); setApprMsg(null);
            };
            const saveApprove = async () => {
                const inv = apprInv;
                if (!inv) { setApprMsg({ text: 'This invoice is no longer on your list.', ok: false }); return; }
                const st = apprForm.status;
                const note = apprForm.note.trim();
                const now0 = (inv.appr && inv.appr.status) || '';
                const problem = !isPassed(inv) || inv.deleted === true ? 'Production Admin has changed this invoice. It is no longer passed.'
                    : !inv.approver || inv.approver.uid !== user.uid ? 'This invoice is assigned to someone else now.'
                    : !st ? 'Pick Pay, Pending or Supplement.'
                    : st === now0 && !note ? 'Nothing changed.'
                    : (st === 'Pending' || st === 'Supplement') && !note ? `Type a note saying why it's ${st === 'Pending' ? 'pending' : 'a supplement'}.`
                    : '';
                if (problem) { setApprMsg({ text: problem, ok: false }); return; }
                setApprSaving(true); setApprMsg(null);
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const appr = { status: st, note, at: now, by };
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    batch.update(ref, { appr, status: statusKeyOf(inv.pa, appr) });
                    batch.set(ref.collection('history').doc(), { action: 'Approver', status: st, note, before: inv.appr || null, at: now, by });
                    await batch.commit();
                    setApprDone(`Invoice ${inv.invoiceNumber} from ${inv.vendor}: ${st === 'Pay' ? 'Pay (ready to pay)' : st}${st === now0 ? ' (note added)' : ''}.`);
                    setApprId(null); setApprForm({ status: '', note: '' });
                } catch (error) {
                    setApprMsg({ text: 'Error saving: ' + error.message, ok: false });
                }
                setApprSaving(false);
            };

            const restoreInvoice = async (inv) => {
                const key = dupKeyOf(inv.vendor, inv.invoiceNumber);
                const other = (allInvoices || []).find(i => i.id !== inv.id && i.deleted !== true && dupKeyOf(i.vendor, i.invoiceNumber) === key);
                if (other) {
                    window.alert(`It can't be restored: invoice ${other.invoiceNumber} from ${other.vendor} is already in AP on ${other.jobCode}. Hide that one first if this is the one to keep.`);
                    return;
                }
                if (!window.confirm(`Restore invoice ${inv.invoiceNumber} from ${inv.vendor}? It counts against the PO balance again.`)) return;
                try {
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const batch = db.batch();
                    batch.update(ref, { deleted: false, restoredAt: now, restoredBy: by });
                    batch.set(ref.collection('history').doc(), { action: 'Restored', at: now, by });
                    await batch.commit();
                    setListMsg(`Invoice ${inv.invoiceNumber} from ${inv.vendor} restored.`);
                } catch (error) {
                    window.alert('Error restoring the invoice: ' + error.message);
                }
            };
            const setField = (k, v) => { setForm(f => ({ ...f, [k]: v })); setFormMsg(null); };

            const takeFile = (f) => {
                if (!f) return;
                if (!(f.type === 'application/pdf' || f.type.startsWith('image/'))) { setFormMsg({ text: 'Only a PDF or a photo can be added.', ok: false }); return; }
                if (f.size > MAX_MB * 1024 * 1024) { setFormMsg({ text: `That file is over ${MAX_MB} MB. Scan it smaller or split it.`, ok: false }); return; }
                setFile(f); setFormMsg(null);
            };

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">Sign in</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">Waiting for approval</div>
                        <p>Your account is waiting for approval. An admin will set up your access.</p>
                    </div>
                );
            }

            if (profile === 'noaccess') {
                return (
                    <div className="section">
                        <div className="section-title">No access</div>
                        <p>Accounts Payable is for {ALLOWED_TEXT}. Contact an admin if you need access.</p>
                    </div>
                );
            }

            if (profile === 'notset') {
                return (
                    <div className="section">
                        <div className="section-title">Account not set up</div>
                        <p>Your account doesn't have access. Contact an admin.</p>
                    </div>
                );
            }

            const listed = (jobs || []).filter(j => showArchived || !j.archived || j.id === jobId);
            const total = (pos || []).reduce((sum, p) => sum + (p.amount || 0), 0);

            // Add invoice: what's picked and typed so far
            const poChoices = (pos || []).filter(p => form.kind === 'supplier' ? isGeneralPO(p) : !isGeneralPO(p));
            const po = (pos || []).find(p => p.id === form.formId) || null;
            // A typed "Other" name already on the list (any capitals) uses the list's spelling
            const otherTyped = form.vendorOther.trim().replace(/\s+/g, ' ');
            const otherOnList = otherTyped ? vendorList.find(n => n.toLowerCase() === otherTyped.toLowerCase()) : null;
            const vendor = form.kind === 'sub' ? (po ? po.subName : '')
                : form.vendorPick === OTHER ? (otherOnList || otherTyped) : form.vendorPick;
            const amount = amountOf(form.amount);
            const prevPay = form.previousPayment.trim() ? amountOf(form.previousPayment) : null;
            const approvedSoFar = po ? passedOn(po.id, editId) : 0; // passed invoices on this PO (2a); approver Pay comes in 2b
            const waitingOnPo = po ? notPassedOn(po.id, editId) : 0;
            // Same vendor + invoice # already in AP (any job, not hidden) = blocked. Same PO + same amount = a warning only.
            const typedKey = vendor && form.invoiceNumber.trim() ? dupKeyOf(vendor, form.invoiceNumber) : '';
            const dupOf = typedKey && allInvoices
                ? allInvoices.find(i => i.id !== editId && i.deleted !== true && dupKeyOf(i.vendor, i.invoiceNumber) === typedKey) : null;
            const sameAmount = po && amount > 0
                ? activeJob.filter(i => i.id !== editId && i.po && i.po.formId === po.id && typeof i.amount === 'number' && Math.abs(i.amount - amount) < 0.005) : [];
            const balance = po && po.amount !== null ? po.amount - approvedSoFar : null;
            const approverList = (() => {
                const list = [...(approvers || [])];
                if (superInfo && superInfo.uid && !list.some(a => a.uid === superInfo.uid)) list.unshift({ uid: superInfo.uid, name: superInfo.name || 'Job Super', role: 'super' });
                // Editing: keep the saved approver in the list even if they're no longer active
                if (editInv && editInv.approver && editInv.approver.uid && !list.some(a => a.uid === editInv.approver.uid)) {
                    list.push({ uid: editInv.approver.uid, name: editInv.approver.name || '', role: 'no longer active' });
                }
                return list;
            })();
            const approver = approverList.find(a => a.uid === form.approverUid) || null;
            const fileName = po && vendor && amount && file && /^\d{4}-\d{2}-\d{2}$/.test(form.dateReceived)
                ? buildFileName({ category: po.category, vendor, amount, poNumber: po.poNumber, dateReceived: form.dateReceived, file }) : '';

            const handleSave = async () => {
                const missing = !po ? 'Pick the PO.' : !vendor ? 'Pick or type the vendor.' : !form.invoiceNumber.trim() ? 'Type the invoice #.'
                    : !(amount > 0) ? 'Type the invoice amount.' : !/^\d{4}-\d{2}-\d{2}$/.test(form.dateReceived) ? 'Pick the date received.'
                    : prevPay === null && form.previousPayment.trim() ? 'Previous payment must be an amount, or left blank.'
                    : !approver ? 'Pick who approves it.' : !file && !editId ? 'Add the invoice file (PDF or photo).'
                    : allInvoices === null ? 'Still loading the invoice list. Try again in a moment.'
                    : dupOf ? `Invoice ${dupOf.invoiceNumber} from ${dupOf.vendor} is already in AP on ${dupOf.jobCode}. The same invoice can't be added twice.` : '';
                if (missing) { setFormMsg({ text: missing, ok: false }); return; }
                if (editId) { await saveEdit(); return; }
                setSaving(true); setFormMsg(null);
                try {
                    // 1. The file, in apInvoices/{jobId}/{invoiceId}/ (the invoice id lets the Storage rule check its approver)
                    const invRef = db.collection('apInvoices').doc();
                    const path = `apInvoices/${jobId}/${invRef.id}/${Date.now()}_${fileName}`;
                    const ref = storage.ref(path);
                    await ref.put(file, cleanSaveName(fileName, file.type));
                    const url = await ref.getDownloadURL();
                    // 2. The invoice record, its first history line and any new supplier name, saved together
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const batch = db.batch();
                    const newVendor = form.kind === 'supplier' && form.vendorPick === OTHER && form.addVendor && !otherOnList;
                    if (newVendor) {
                        batch.set(vendorsDoc(), {
                            list: firebase.firestore.FieldValue.arrayUnion(...SUPPLIERS, vendor),
                            added: firebase.firestore.FieldValue.arrayUnion({ name: vendor, at: now, by })
                        }, { merge: true });
                    }
                    batch.set(invRef, {
                        jobId, jobCode: job.code, kind: form.kind, vendor,
                        invoiceNumber: form.invoiceNumber.trim(), amount, previousPayment: form.kind === 'sub' ? prevPay : null,
                        dateReceived: form.dateReceived,
                        po: { formId: po.id, poNumber: po.poNumber, category: po.category, subName: po.subName },
                        approver: { uid: approver.uid, name: approver.name },
                        file: { url, name: fileName, path, type: file.type },
                        createdAt: now, createdBy: by, deleted: false
                    });
                    batch.set(invRef.collection('history').doc(), { action: 'Added', at: now, by });
                    await batch.commit();
                    setListMsg(`Invoice added: ${fileName}${newVendor ? `. ${vendor} added to the supplier list.` : ''}`);
                    closeAdd(true);
