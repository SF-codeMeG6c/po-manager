                    setFormMsg({ text: 'Error saving the invoice: ' + error.message, ok: false });
                }
                setSaving(false);
            };

            // Save an edit (Owner/Admin). Only changed fields are written; the old values go in the invoice's history.
            // A new file is stored next to the old one; the old file is kept (oldFiles) and named in the history.
            const saveEdit = async () => {
                const inv = editInv;
                if (!inv) { setFormMsg({ text: 'This invoice is no longer on the list.', ok: false }); return; }
                if (isPassed(inv)) { setFormMsg({ text: 'This invoice has passed meanwhile. Production Admin sets it back to Pending before it can be edited.', ok: false }); return; }
                const next = {
                    kind: form.kind, vendor, invoiceNumber: form.invoiceNumber.trim(), amount,
                    previousPayment: form.kind === 'sub' ? prevPay : null, dateReceived: form.dateReceived,
                    po: { formId: po.id, poNumber: po.poNumber, category: po.category, subName: po.subName },
                    approver: { uid: approver.uid, name: approver.name }
                };
                const before = {};
                Object.keys(next).forEach(k => { before[k] = inv[k] === undefined ? null : inv[k]; });
                const changed = Object.keys(next).filter(k => !same(next[k], before[k]));
                if (!changed.length && !file) { setFormMsg({ text: 'Nothing changed.', ok: false }); return; }
                setSaving(true); setFormMsg(null);
                try {
                    const ref = db.collection('apInvoices').doc(inv.id);
                    let newFile = null;
                    if (file) {
                        const path = `apInvoices/${inv.jobId}/${inv.id}/${Date.now()}_${fileName}`;
                        const sref = storage.ref(path);
                        await sref.put(file, cleanSaveName(fileName, file.type));
                        newFile = { url: await sref.getDownloadURL(), name: fileName, path, type: file.type };
                    }
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const update = { editedAt: now, editedBy: by };
                    changed.forEach(k => { update[k] = next[k]; });
                    const hist = { action: 'Edited', at: now, by, fields: changed.slice(), before: {}, after: {} };
                    changed.forEach(k => { hist.before[k] = before[k]; hist.after[k] = next[k]; });
                    if (newFile) {
                        update.file = newFile;
                        if (inv.file) update.oldFiles = firebase.firestore.FieldValue.arrayUnion({ ...inv.file, replacedAt: now });
                        hist.fields.push('file');
                        hist.before.file = inv.file || null;
                        hist.after.file = newFile;
                    }
                    const batch = db.batch();
                    const newVendor = form.kind === 'supplier' && form.vendorPick === OTHER && form.addVendor && !otherOnList;
                    if (newVendor) {
                        batch.set(vendorsDoc(), {
                            list: firebase.firestore.FieldValue.arrayUnion(...SUPPLIERS, vendor),
                            added: firebase.firestore.FieldValue.arrayUnion({ name: vendor, at: now, by })
                        }, { merge: true });
                    }
                    batch.update(ref, update);
                    batch.set(ref.collection('history').doc(), hist);
                    await batch.commit();
                    setListMsg(`Invoice ${next.invoiceNumber} saved. Changed: ${hist.fields.map(k => FIELD_LABELS[k] || k).join(', ')}.`
                        + (newVendor ? ` ${vendor} added to the supplier list.` : ''));
                    closeAdd(true);
                } catch (error) {
                    setFormMsg({ text: 'Error saving the changes: ' + error.message, ok: false });
                }
                setSaving(false);
            };

            // Invoice table. showJob adds the job code (the all-jobs lists). canEdit shows Edit (job view only, Owner/Admin).
            const invoiceTable = (list, showJob, canEdit) => (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>{showJob && <th>Job</th>}<th>Received</th><th>Vendor</th><th>Invoice #</th><th>PO</th><th className="num">Amount</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody>
                            {list.map(i => (
                                <tr key={i.id} className={i.deleted === true ? 'hidden-row' : (i.id === editId || i.id === reviewId || i.id === apprId) ? 'editing-row' : ''}>
                                    {showJob && <td>{(jobs || []).some(j => j.id === i.jobId)
                                        ? <a href={'?job=' + encodeURIComponent(i.jobId)} onClick={e => { e.preventDefault(); pickJob(i.jobId); }}>{i.jobCode}</a>
                                        : i.jobCode}</td>}
                                    <td>{shortDate(i.dateReceived)}</td>
                                    <td>{i.vendor}<small>{i.kind === 'supplier' ? 'Supplier bill' : 'Sub invoice'}</small>
                                        {i.deleted === true && <small>Hidden {dateOnly(i.deletedAt)}{i.deletedBy ? ' by ' + i.deletedBy.name : ''}{i.deletedReason ? ': ' + i.deletedReason : ''}</small>}</td>
                                    <td>{i.invoiceNumber}{i.editedAt && <small>Edited {dateOnly(i.editedAt)}</small>}</td>
                                    <td>{i.po ? i.po.poNumber : ''}<small>{i.po ? i.po.category : ''}</small></td>
                                    <td className="num">{typeof i.amount === 'number' ? money(i.amount) : '-'}
                                        {typeof i.previousPayment === 'number' && <small>Prev. paid {money(i.previousPayment)}</small>}</td>
                                    <td>{(() => { const s = statusOf(i); return <span className={'pill ' + s.key}>{s.text}</span>; })()}
                                        {i.deleted !== true && i.pa && i.pa.note && <small title={i.pa.note}>PA: "{i.pa.note.length > 60 ? i.pa.note.slice(0, 60) + '...' : i.pa.note}"</small>}
                                        {i.deleted !== true && isPassed(i) && i.appr && i.appr.note && <small title={i.appr.note}>{i.appr.by ? i.appr.by.name : 'Approver'}: "{i.appr.note.length > 60 ? i.appr.note.slice(0, 60) + '...' : i.appr.note}"</small>}
                                        <small>Approver: {i.approver ? i.approver.name : '-'}</small></td>
                                    <td><div className="row-btns">
                                        {i.file && i.file.url && <button className="btn-secondary btn-sm" onClick={() => window.open(i.file.url)}>View</button>}
                                        {i.deleted !== true && isPassed(i) && i.approver && i.approver.uid === user.uid && i.id !== apprId && (
                                            <button className={(i.appr && i.appr.status ? 'btn-secondary' : 'btn-primary btn-auto') + ' btn-sm'} onClick={() => openApprove(i)}>
                                                {i.appr && i.appr.status ? 'Change' : 'Approve'}</button>)}
                                        {isPA && canEdit && i.deleted !== true && i.id !== reviewId && <button className="btn-secondary btn-sm" onClick={() => openReview(i)}>Review</button>}
                                        {isAdmin && canEdit && i.deleted !== true && !isPassed(i) && i.id !== editId && <button className="btn-secondary btn-sm" onClick={() => openEdit(i)}>Edit</button>}
                                        {isAdmin && i.deleted !== true && !isPassed(i) && <button className="btn-link" onClick={() => hideInvoice(i)}>Hide</button>}
                                        {isAdmin && i.deleted === true && <button className="btn-link" onClick={() => restoreInvoice(i)}>Restore</button>}
                                    </div></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );

            // All-invoices list (Owner/Admin): filters by the job's Super, approver, kind and a search box
            const jobById = {};
            (jobs || []).forEach(j => { jobById[j.id] = j; });
            const nameOf = (uid) => { const p = (people || []).find(x => x.uid === uid); return p ? p.name : ''; };
            const superChoices = (() => {
                const uids = new Set();
                (jobs || []).forEach(j => j.assignedSupers.forEach(u => uids.add(u)));
                return [...uids].map(uid => ({ uid, name: nameOf(uid) || 'Unknown user' })).sort((a, b) => a.name.localeCompare(b.name));
            })();
            const approverChoices = (() => {
                const map = {};
                (allInvoices || []).forEach(i => { if (i.approver && i.approver.uid) map[i.approver.uid] = i.approver.name || nameOf(i.approver.uid); });
                return Object.keys(map).map(uid => ({ uid, name: map[uid] })).sort((a, b) => a.name.localeCompare(b.name));
            })();
            const setFilter = (k, v) => setFilters(f => ({ ...f, [k]: v }));
            const searchText = filters.text.trim().toLowerCase();
            const filtered = (allInvoices || []).filter(i =>
                (showHidden || i.deleted !== true)
                && (!filters.superUid || (jobById[i.jobId] && jobById[i.jobId].assignedSupers.includes(filters.superUid)))
                && (!filters.approverUid || (i.approver && i.approver.uid === filters.approverUid))
                && (!filters.kind || i.kind === filters.kind)
                && (!searchText || [i.vendor, i.invoiceNumber, i.jobCode, i.po && i.po.poNumber].join(' ').toLowerCase().includes(searchText)));
            const filteredTotal = filtered.filter(i => i.deleted !== true).reduce((s, i) => s + (typeof i.amount === 'number' ? i.amount : 0), 0);
            const filtersOn = filters.superUid || filters.approverUid || filters.kind || searchText;
            const showHiddenBox = (
                <label className="check">
                    <input type="checkbox" checked={showHidden} onChange={e => setShowHidden(e.target.checked)} />
                    Show hidden
                </label>
            );

            const myWaiting = (isAdmin ? (allInvoices || []) : (myInvoices || [])).filter(i => waitingOn(i, user.uid));

            return (
                <div>
                    {apprDone && <div className="ok" style={{ marginBottom: '14px' }}>{apprDone}</div>}
                    {apprInv && (
                        <div className="appr-box">
                            <div className="section-title" style={{ marginBottom: '6px' }}>Your approval: invoice {apprInv.invoiceNumber} from {apprInv.vendor}</div>
                            <div className="review-facts">
                                {apprInv.jobCode} · {apprInv.kind === 'supplier' ? 'Supplier bill' : 'Sub invoice'} · {typeof apprInv.amount === 'number' ? money(apprInv.amount) : '-'}
                                {' '}· received {shortDate(apprInv.dateReceived)} · PO {apprInv.po ? `${apprInv.po.poNumber} (${apprInv.po.category})` : '-'}
                                {typeof apprInv.previousPayment === 'number' ? ` · previous payment on the form ${money(apprInv.previousPayment)}` : ''}
                                {apprInv.file && apprInv.file.url && <button className="btn-link" onClick={() => window.open(apprInv.file.url)}>View file</button>}
                            </div>
                            <div className="review-now">
                                Production Admin: <span className="pill passed">Passed</span>
                                {apprInv.pa && apprInv.pa.by && <span className="muted"> by {apprInv.pa.by.name}, {dateOnly(apprInv.pa.at)}{apprInv.pa.note ? `: "${apprInv.pa.note}"` : ''}</span>}
                                {apprInv.appr && apprInv.appr.status && <div className="muted" style={{ marginTop: '4px' }}>Your decision now: {apprInv.appr.status}, {dateOnly(apprInv.appr.at)}{apprInv.appr.note ? `: "${apprInv.appr.note}"` : ''}</div>}
                            </div>
                            <div className="kinds">
                                {APPR_CHOICES.map(c => (
                                    <label key={c} className="check">
                                        <input type="radio" name="appr-status" checked={apprForm.status === c} onChange={() => { setApprForm(v => ({ ...v, status: c })); setApprMsg(null); }} />
                                        {c}
                                    </label>
                                ))}
                            </div>
                            <div className="form-group">
                                <label htmlFor="appr-note">Note {apprForm.status === 'Pending' || apprForm.status === 'Supplement' ? '(required: say why)' : '(optional)'}</label>
                                <textarea id="appr-note" value={apprForm.note} onChange={e => { setApprForm(v => ({ ...v, note: e.target.value })); setApprMsg(null); }} />
                            </div>
                            {apprMsg && <div className={apprMsg.ok ? 'ok' : 'error'}>{apprMsg.text}</div>}
                            <div className="actions">
                                <button className="btn-secondary btn-auto" onClick={() => closeApprove(false)} disabled={apprSaving}>Cancel</button>
                                <button className="btn-primary btn-auto" onClick={saveApprove} disabled={apprSaving}>{apprSaving ? 'Saving...' : 'Save'}</button>
                            </div>
                        </div>
                    )}

                    {myWaiting.length > 0 && !job && (
                        <div className="section">
                            <div className="wait-title">Waiting on you ({myWaiting.length})</div>
                            {invoiceTable(myWaiting, true, false)}
                        </div>
                    )}

                    {isAdmin && !job && (
                        <div className="section">
                            <div className="section-title">All invoices (all jobs)</div>
                            <div className="filters">
                                <select value={filters.superUid} onChange={e => setFilter('superUid', e.target.value)} aria-label="Job's Super">
                                    <option value="">All Supers</option>
                                    {superChoices.map(s => <option key={s.uid} value={s.uid}>{s.name}</option>)}
                                </select>
                                <select value={filters.approverUid} onChange={e => setFilter('approverUid', e.target.value)} aria-label="Approver">
                                    <option value="">All approvers</option>
                                    {approverChoices.map(a => <option key={a.uid} value={a.uid}>{a.name}</option>)}
                                </select>
                                <select value={filters.kind} onChange={e => setFilter('kind', e.target.value)} aria-label="Kind">
                                    <option value="">Subs and suppliers</option>
                                    <option value="sub">Sub invoices</option>
                                    <option value="supplier">Supplier bills</option>
                                </select>
                                <input type="text" value={filters.text} placeholder="Search vendor, invoice #, job, PO" onChange={e => setFilter('text', e.target.value)} />
                            </div>
                            <div className="list-sum">
                                <span>{allInvoices === null ? '' : `${filtered.length} invoice${filtered.length === 1 ? '' : 's'} · ${money(filteredTotal)}${showHidden ? ' (hidden ones not counted)' : ''}`}
                                    {filtersOn && <button className="btn-link" onClick={() => setFilters({ superUid: '', approverUid: '', kind: '', text: '' })}>Clear filters</button>}</span>
                                {showHiddenBox}
                            </div>
                            {peopleError && <div className="error" style={{ marginBottom: '10px' }}>{peopleError}</div>}
                            {invError && <div className="error" style={{ marginBottom: '10px' }}>{invError}</div>}
                            {listMsg && <div className="ok" style={{ marginBottom: '10px' }}>{listMsg}</div>}
                            {allInvoices === null && <p className="muted">Loading invoices...</p>}
                            {allInvoices && filtered.length === 0 && !invError && (
                                <p className="muted">{allInvoices.length === 0 ? 'No invoices in AP yet.' : 'No invoices match.'}</p>
                            )}
                            {filtered.length > 0 && invoiceTable(filtered, true, false)}
                        </div>
                    )}

                    {!isAdmin && !job && (
                        <div className="section">
                            <div className="section-title">Invoices assigned to you (all jobs)</div>
                            {invError && <div className="error" style={{ marginBottom: '10px' }}>{invError}</div>}
                            {myInvoices === null && <p className="muted">Loading invoices...</p>}
                            {myInvoices && myInvoices.length === 0 && !invError && <p className="muted">No invoices are assigned to you.</p>}
                            {myInvoices && myInvoices.length > 0 && invoiceTable(myInvoices, true)}
                        </div>
                    )}

                    <div className="section">
                        <div className="section-title">Job</div>
                        <div className="form-group">
                            <label htmlFor="job-pick">Pick a job</label>
                            <select id="job-pick" value={jobId} onChange={e => pickJob(e.target.value)}>
                                <option value="">{jobs === null ? 'Loading jobs...' : '-- Pick a job --'}</option>
                                {listed.map(j => (
                                    <option key={j.id} value={j.id}>{j.code} - {j.address}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                        </div>
                        <label className="check">
                            <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} />
                            Show archived jobs
                        </label>
                        {jobsError && <div className="error">{jobsError}</div>}
                    </div>

                    {jobId && jobs && !job && (
                        <div className="notice">This job wasn't found, or you don't have access to it. Pick a job above.</div>
                    )}

                    {job && (
                        <div>
                            <div className="job-head">
                                <div className="job-code">{job.code}{job.archived ? ' (archived)' : ''}</div>
                                <div className="job-addr">{[job.address, job.cityStateZip].filter(Boolean).join(', ') || 'No address on Customer Information.'}</div>
                                <div className="job-super">
                                    Super: {superInfo === undefined ? 'Loading...'
                                        : superInfo ? superInfo.name
                                        : <span className="muted">not picked. Set it on Customer Information.</span>}
                                </div>
                            </div>

                            <div className="section">
                                <div className="section-title">POs on this job</div>
                                {posError && <div className="error" style={{ marginBottom: '10px' }}>{posError}</div>}
                                {pos === null && <p className="muted">Loading POs...</p>}
                                {pos && pos.length === 0 && !posError && <p className="muted">No POs on this job yet. POs are made in PO Manager.</p>}
                                {pos && pos.length > 0 && (
                                    <div className="table-wrap">
                                        <table>
                                            <thead>
                                                <tr><th>PO #</th><th>Category</th><th>Sub</th><th>Status</th><th className="num">PO amount</th></tr>
                                            </thead>
                                            <tbody>
                                                {pos.map(p => (
                                                    <tr key={p.id}>
                                                        <td>{p.poNumber || '-'}</td>
                                                        <td>{p.category}</td>
                                                        <td>{p.subName}</td>
                                                        <td>{p.status}</td>
                                                        <td className="num">{p.amount === null ? '-' : money(p.amount)}</td>
                                                    </tr>
                                                ))}
                                                <tr className="total">
                                                    <td colSpan="4">Total ({pos.length} PO{pos.length === 1 ? '' : 's'})</td>
                                                    <td className="num">{money(total)}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>

                            <div className="section">
                                <div className="section-head">
                                    <div className="section-title">{isAdmin ? 'Invoices' : 'Invoices assigned to you'}</div>
                                    <div className="row-btns" style={{ alignItems: 'center', gap: '14px' }}>
                                        {isAdmin && showHiddenBox}
                                        {isAdmin && !showAdd && <button className="btn-primary btn-auto btn-sm" onClick={openAdd}>+ Add invoice</button>}
                                    </div>
                                </div>

                                {showAdd && (
                                    <div className="add-box">
                                        <div className="section-title" style={{ marginBottom: editId ? '2px' : '10px' }}>
                                            {editId ? `Edit invoice ${editOrig ? editOrig.invoiceNumber : ''} on ${job.code}` : `Add an invoice to ${job.code}`}
                                        </div>
                                        {editInv && <p className="muted" style={{ marginBottom: '10px' }}>
                                            Added {dateOnly(editInv.createdAt)}{editInv.createdBy ? ' by ' + editInv.createdBy.name : ''}. The old values are kept in the invoice's history.
                                        </p>}
                                        <div className="kinds">
                                            {[['sub', 'Sub invoice'], ['supplier', 'Supplier bill']].map(([k, label]) => (
                                                <label key={k} className="check">
                                                    <input type="radio" name="kind" checked={form.kind === k}
                                                        onChange={() => setForm(f => ({ ...f, kind: k, formId: '', vendorPick: '', vendorOther: '', previousPayment: '' }))} />
                                                    {label}
                                                </label>
                                            ))}
                                        </div>

                                        <div className="form-group">
                                            <label htmlFor="inv-po">{form.kind === 'supplier' ? 'General PO (trade)' : 'PO'}</label>
                                            <select id="inv-po" value={form.formId} onChange={e => setField('formId', e.target.value)}>
                                                <option value="">-- Pick the PO --</option>
                                                {poChoices.map(p => (
                                                    <option key={p.id} value={p.id}>
                                                        {form.kind === 'supplier' ? `${p.category} - ${p.poNumber}` : `${p.poNumber} - ${p.category} - ${p.subName}`}
                                                    </option>
                                                ))}
                                            </select>
                                            {poChoices.length === 0 && pos && (
                                                <div className="warn">
                                                    {form.kind === 'supplier'
                                                        ? 'This job has no General POs (sub name "General Material"). They are made in Trades-EST with the CES.'
                                                        : 'This job has no sub POs yet. POs are made in PO Manager.'}
                                                </div>
                                            )}
                                        </div>

                                        {po && (
                                            <div className="balance">
                                                <div><span>PO amount</span><span>{po.amount === null ? 'none on the PO' : money(po.amount)}</span></div>
                                                <div><span>Passed so far</span><span>{money(approvedSoFar)}</span></div>
                                                {waitingOnPo > 0 && <div className="muted"><span>Invoices added, not yet passed</span><span>{money(waitingOnPo)}</span></div>}
                                                <div className="left"><span>Balance left</span><span>{balance === null ? '-' : money(balance)}</span></div>
                                            </div>
                                        )}

                                        <div className="grid2">
                                            <div className="form-group">
                                                <label htmlFor="inv-vendor">{form.kind === 'sub' ? 'Sub (from the PO)' : 'Supplier'}</label>
                                                {form.kind === 'sub' ? (
                                                    <input id="inv-vendor" type="text" value={vendor} readOnly placeholder="Pick the PO first" style={{ background: '#f5f5f5' }} />
                                                ) : (
                                                    <select id="inv-vendor" value={form.vendorPick} onChange={e => setField('vendorPick', e.target.value)}>
                                                        <option value="">-- Pick the supplier --</option>
                                                        {vendorList.map(s => <option key={s} value={s}>{s}</option>)}
                                                        <option value={OTHER}>Other (type it)</option>
                                                    </select>
                                                )}
                                                {form.kind === 'supplier' && form.vendorPick === OTHER && (
                                                    <div>
                                                        <input type="text" style={{ marginTop: '6px' }} value={form.vendorOther} placeholder="Name as it is in QuickBooks"
                                                            onChange={e => setField('vendorOther', e.target.value)} />
                                                        {otherOnList ? (
                                                            <div className="muted" style={{ marginTop: '4px' }}>Already on the list as "{otherOnList}". That spelling is used.</div>
                                                        ) : otherTyped && (
                                                            <label className="check" style={{ marginTop: '6px' }}>
                                                                <input type="checkbox" checked={form.addVendor} onChange={e => setField('addVendor', e.target.checked)} />
                                                                Add "{otherTyped}" to the supplier list
                                                            </label>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="form-group">
                                                <label htmlFor="inv-num">Invoice #</label>
                                                <input id="inv-num" type="text" value={form.invoiceNumber} onChange={e => setField('invoiceNumber', e.target.value)} />
                                                {dupOf && (
                                                    <div className="dup">Already in AP: invoice {dupOf.invoiceNumber} from {dupOf.vendor} on {dupOf.jobCode}
                                                        {dupOf.dateReceived ? `, received ${shortDate(dupOf.dateReceived)}` : ''}. The same invoice can't be added twice.</div>
                                                )}
                                            </div>
                                            <div className="form-group">
                                                <label htmlFor="inv-amt">Invoice amount</label>
                                                <input id="inv-amt" type="text" inputMode="decimal" value={form.amount} placeholder="$0.00" onChange={e => setField('amount', e.target.value)} />
                                                {amount > 0 && balance !== null && amount > balance && (
                                                    <div className="warn">Over the PO balance by {money(amount - balance)}. It can be added, but it can't pass until a revised PO or a supplement covers it.</div>
                                                )}
                                                {amount > 0 && balance !== null && waitingOnPo > 0 && amount + waitingOnPo > balance && (
                                                    <div className="warn">With the {money(waitingOnPo)} already added and not yet passed, this PO would be over by {money(amount + waitingOnPo - balance)}.</div>
                                                )}
                                                {sameAmount.length > 0 && (
                                                    <div className="warn">Same amount as invoice {sameAmount.map(i => i.invoiceNumber).join(', ')} on this PO. Check it isn't the same bill.</div>
                                                )}
                                            </div>
                                            <div className="form-group">
                                                <label htmlFor="inv-date">Date received</label>
                                                <input id="inv-date" type="date" value={form.dateReceived} onChange={e => setField('dateReceived', e.target.value)} />
                                            </div>
                                            {form.kind === 'sub' && (
                                                <div className="form-group">
                                                    <label htmlFor="inv-prev">Previous payment (as written on the form)</label>
                                                    <input id="inv-prev" type="text" inputMode="decimal" value={form.previousPayment} placeholder="Leave blank if none" onChange={e => setField('previousPayment', e.target.value)} />
                                                </div>
                                            )}
                                            <div className="form-group">
                                                <label htmlFor="inv-appr">Approver</label>
                                                <select id="inv-appr" value={form.approverUid} onChange={e => setField('approverUid', e.target.value)}>
                                                    <option value="">{approvers === null ? 'Loading people...' : '-- Pick who approves it --'}</option>
                                                    {approverList.map(a => (
                                                        <option key={a.uid} value={a.uid}>{a.name}{superInfo && a.uid === superInfo.uid ? ' (job Super)' : ` (${a.role})`}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="form-group">
                                            <label>{editId ? 'Replace the file (optional)' : 'Invoice file'}</label>
                                            {editId && editInv && editInv.file && !file && (
                                                <div className="muted" style={{ marginBottom: '6px' }}>Now: {editInv.file.name}. It keeps that name unless a new file is picked; a replaced file is kept in the history.</div>
                                            )}
                                            <label className={'drop' + (dragOver ? ' over' : '')}
                                                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                                                onDragLeave={() => setDragOver(false)}
                                                onDrop={e => { e.preventDefault(); setDragOver(false); takeFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}>
                                                {file ? <span><strong>{file.name}</strong><br />Click or drop another file to replace it.</span>
                                                    : <span>{editId ? 'Drop a new PDF or photo here, or click to pick it.' : 'Drop the PDF or photo here, or click to pick it.'}</span>}
                                                <input type="file" accept="application/pdf,image/*" style={{ display: 'none' }}
                                                    onChange={e => { takeFile(e.target.files && e.target.files[0]); e.target.value = ''; }} />
                                            </label>
                                        </div>

                                        {fileName && <div className="fname">Saved as: {fileName}</div>}
                                        {formMsg && <div className={formMsg.ok ? 'ok' : 'error'}>{formMsg.text}</div>}
                                        <div className="actions">
                                            <button className="btn-secondary btn-auto" onClick={() => closeAdd(false)} disabled={saving}>Cancel</button>
                                            <button className="btn-primary btn-auto" onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : editId ? 'Save changes' : 'Add invoice'}</button>
                                        </div>
                                    </div>
                                )}

                                {reviewInv && (() => {
                                    const r = reviewInv;
                                    const poNow = (pos || []).find(p => p.id === (r.po && r.po.formId)) || null;
                                    const passedOther = poNow ? passedOn(poNow.id, r.id) : 0;
                                    const room = poNow && poNow.amount !== null ? poNow.amount - passedOther : null;
                                    const over = room !== null && (r.amount || 0) > room + 0.005;
                                    const s = statusOf(r);
                                    return (
                                        <div className="review-box">
                                            <div className="section-title" style={{ marginBottom: '6px' }}>Production Admin review: invoice {r.invoiceNumber} from {r.vendor}</div>
                                            <div className="review-facts">
                                                {r.kind === 'supplier' ? 'Supplier bill' : 'Sub invoice'} · {typeof r.amount === 'number' ? money(r.amount) : '-'} · received {shortDate(r.dateReceived)} · PO {r.po ? r.po.poNumber : '-'}
                                                {typeof r.previousPayment === 'number' ? ` · previous payment on the form ${money(r.previousPayment)}` : ''} · approver {r.approver ? r.approver.name : '-'}
                                                {r.file && r.file.url && <button className="btn-link" onClick={() => window.open(r.file.url)}>View file</button>}
                                            </div>
                                            <div className="review-now">
                                                Now: <span className={'pill ' + s.key}>{s.text}</span>
                                                {r.pa && r.pa.by && <span className="muted"> by {r.pa.by.name}, {dateOnly(r.pa.at)}{r.pa.note ? `: "${r.pa.note}"` : ''}</span>}
                                                {r.appr && r.appr.status && <div className="muted" style={{ marginTop: '4px' }}>Approver: {r.appr.status} by {r.appr.by ? r.appr.by.name : ''}, {dateOnly(r.appr.at)}{r.appr.note ? `: "${r.appr.note}"` : ''}. Changing Pass to Pending or Supplement clears it.</div>}
                                            </div>
                                            <div className="balance">
                                                <div><span>PO amount</span><span>{!poNow ? 'PO not on the job' : poNow.amount === null ? 'none on the PO' : money(poNow.amount)}</span></div>
                                                <div><span>Passed so far (other invoices)</span><span>{money(passedOther)}</span></div>
                                                <div><span>This invoice</span><span>{typeof r.amount === 'number' ? money(r.amount) : '-'}</span></div>
                                                <div className="left"><span>Balance after passing it</span><span>{room === null ? '-' : money(room - (r.amount || 0))}</span></div>
                                            </div>
                                            {over && <div className="dup" style={{ marginBottom: '10px' }}>Over the PO balance by {money((r.amount || 0) - room)}. It can't pass until a revised PO or a supplement covers it. Pending or Supplement can still be picked.</div>}
                                            <div className="kinds">
                                                {PA_CHOICES.map(c => (
                                                    <label key={c} className="check">
                                                        <input type="radio" name="pa-status" checked={review.status === c} onChange={() => { setReview(v => ({ ...v, status: c })); setReviewMsg(null); }} />
                                                        {c}
                                                    </label>
                                                ))}
                                            </div>
                                            <div className="form-group">
                                                <label htmlFor="pa-note">Note {review.status === 'Pending' || review.status === 'Supplement' ? '(required: say why)' : '(optional)'}</label>
                                                <textarea id="pa-note" value={review.note} onChange={e => { setReview(v => ({ ...v, note: e.target.value })); setReviewMsg(null); }} />
                                            </div>
                                            {reviewMsg && <div className={reviewMsg.ok ? 'ok' : 'error'}>{reviewMsg.text}</div>}
                                            <div className="actions">
                                                <button className="btn-secondary btn-auto" onClick={() => closeReview(false)} disabled={reviewSaving}>Cancel</button>
                                                <button className="btn-primary btn-auto" onClick={saveReview} disabled={reviewSaving}>{reviewSaving ? 'Saving...' : 'Save'}</button>
                                            </div>
                                        </div>
                                    );
                                })()}

                                {listMsg && <div className="ok" style={{ marginBottom: '10px' }}>{listMsg}</div>}
                                {invError && <div className="error" style={{ marginBottom: '10px' }}>{invError}</div>}
                                {invoices === null && <p className="muted">Loading invoices...</p>}
                                {invoices && invoices.length === 0 && !invError && (
                                    <p className="muted">{!isAdmin ? 'No invoices on this job are assigned to you.'
                                        : jobAll && jobAll.length > 0 ? 'Every invoice on this job is hidden. Tick "Show hidden" to see them.' : 'No invoices on this job yet.'}</p>
                                )}
                                {invoices && invoices.length > 0 && invoiceTable(invoices, false, true)}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<APApp />, document.getElementById('app'));
    </script>
</body>
</html>
