<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts Payable - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
        .section-head .section-title { margin-bottom: 0; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-auto { width: auto; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        .ok { color: #388e3c; font-size: 13px; margin-top: 5px; }
        .warn { color: #b36b00; font-size: 12px; margin-top: 5px; font-weight: 600; }
        .muted { font-size: 13px; color: #888; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        select, input[type=text], input[type=date] { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; background: white; }
        select:focus, input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        .form-group { margin-bottom: 12px; }
        .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; font-weight: normal; margin-bottom: 0; }
        .check input { width: auto; }
        .job-head { background: #f9f9f9; border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
        .job-code { font-size: 18px; font-weight: 600; color: #333; }
        .job-addr { font-size: 13px; color: #666; margin-top: 2px; }
        .job-super { font-size: 13px; color: #333; margin-top: 6px; }
        .notice { background: #f9f9f9; border-radius: 6px; padding: 14px; font-size: 14px; color: #555; margin-bottom: 18px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; color: #333; }
        th { background: #f5f5f5; padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; white-space: nowrap; }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        tr.total td { font-weight: 600; border-top: 2px solid #ddd; border-bottom: none; }
        td small { display: block; font-size: 11px; color: #888; }
        .add-box { border: 1px solid #ddd; border-radius: 6px; background: #fafcff; padding: 16px; margin-bottom: 18px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
        .kinds { display: flex; gap: 16px; margin-bottom: 12px; }
        .balance { background: white; border: 1px solid #eee; border-radius: 4px; padding: 8px 10px; font-size: 13px; color: #333; margin: -4px 0 12px; }
        .balance div { display: flex; justify-content: space-between; }
        .balance .left { font-weight: 600; border-top: 1px solid #eee; margin-top: 4px; padding-top: 4px; }
        .drop { border: 2px dashed #ccc; border-radius: 6px; padding: 18px; text-align: center; font-size: 13px; color: #666; background: white; cursor: pointer; }
        .drop.over { border-color: #0066cc; background: #f3f8fd; }
        .drop strong { color: #333; word-break: break-all; }
        .fname { font-size: 12px; color: #555; background: #f5f5f5; border-radius: 4px; padding: 6px 8px; word-break: break-all; margin-bottom: 12px; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
        tr.hidden-row td { color: #aaa; background: #fafafa; }
        tr.editing-row td { background: #fffbe6; }
        .row-btns { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
        .btn-link { background: none; color: #0066cc; padding: 5px 4px; font-size: 12px; }
        .btn-link:hover { text-decoration: underline; }
        .filters { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1.4fr; gap: 8px; margin-bottom: 10px; }
        .filters select, .filters input[type=text] { padding: 6px 8px; font-size: 13px; }
        .list-sum { font-size: 13px; color: #555; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dup { color: #d32f2f; font-size: 12px; margin-top: 5px; font-weight: 600; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .pill.waiting-pa { background: #e8f0fb; color: #0052a3; }
        .pill.pa-pending { background: #fff3e0; color: #b36b00; }
        .pill.pa-supplement { background: #f3e8fb; color: #7b1fa2; }
        .pill.passed { background: #e6f4ea; color: #2e7d32; }
        .pill.ready { background: #2e7d32; color: white; }
        .pill.appr-pending { background: #fff3e0; color: #b36b00; }
        .pill.appr-supplement { background: #f3e8fb; color: #7b1fa2; }
        .appr-box { border: 1px solid #b7dcc0; border-radius: 6px; background: #f6fbf7; padding: 16px; margin-bottom: 20px; }
        .wait-title { font-weight: 600; color: #2e7d32; font-size: 14px; margin-bottom: 8px; }
        .pill.question { background: #fdecea; color: #c62828; }
        .pill.dupflag { background: #fff3e0; color: #b36b00; border: 1px solid #f0c27a; }
        .pill.inqb { background: #455a64; color: white; }
        .pill.coding { background: #fff3e0; color: #b45309; border: 1px solid #f5c98a; }
        .hold-line { margin-top: 6px; font-size: 13px; }
        .read-note { font-size: 13px; color: #2e6b3a; background: #eef7ef; border-radius: 4px; padding: 6px 8px; }
        .hold-note { color: #b45309; }
        .code-box { border: 1px solid #f5c98a; background: #fffaf2; border-radius: 6px; padding: 12px; margin: 10px 0; }
        .pill.checked { background: #e6f4ea; color: #2e7d32; }
        .pill.unchecked { background: #f5f5f5; color: #777; }
        .dup-box { border: 1px solid #f0c27a; background: #fffaf0; border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; }
        .view-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .view-tabs button { background: #f0f0f0; color: #333; padding: 7px 14px; font-size: 13px; }
        .view-tabs button.on { background: #0066cc; color: white; }
        .qb-group { margin-bottom: 18px; }
        .qb-group-head { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 6px; }
        .qb-edit td { background: #f7fafe; }
        .qb-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; padding: 6px 0; }
        .qb-form label { font-size: 12px; margin-bottom: 2px; }
        .qb-form select, .qb-form input[type=text], .qb-form input[type=date] { padding: 6px 8px; font-size: 13px; }
        @media (max-width: 600px) { .qb-form { grid-template-columns: 1fr 1fr; } }
        .batch-box { border: 1px solid #c8daf0; border-radius: 6px; background: #f7fafe; padding: 16px; margin-bottom: 20px; }
        .batch-defaults { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 12px; }
        .bcard { border: 1px solid #ddd; border-radius: 6px; background: white; padding: 10px 12px; margin-bottom: 10px; }
        .bcard.saved { background: #f3faf4; border-color: #b7dcc0; }
        .bcard.bad { border-color: #f0b4b4; }
        .bcard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }
        .bcard-head strong { word-break: break-all; }
        .bgrid { display: grid; grid-template-columns: 1.2fr 1.3fr 1.2fr; gap: 6px 10px; }
        .bgrid label { font-size: 12px; margin-bottom: 2px; }
        .bgrid select, .bgrid input[type=text], .bgrid input[type=date] { padding: 6px 8px; font-size: 13px; }
        @media (max-width: 600px) { .bgrid, .batch-defaults { grid-template-columns: 1fr; } }
        .notes-box { border: 1px solid #ddd; border-radius: 6px; background: #fcfcfc; padding: 16px; margin-bottom: 20px; }
        .note { border-top: 1px solid #eee; padding: 10px 0; font-size: 13px; color: #333; }
        .note:first-child { border-top: none; padding-top: 0; }
        .note-head { font-size: 12px; color: #666; margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .note-text { white-space: pre-wrap; word-break: break-word; }
        .note.open { background: #fff8f7; border-left: 3px solid #c62828; padding-left: 8px; }
        .note-old { font-size: 12px; color: #888; margin-top: 4px; white-space: pre-wrap; }
        .pill.hidden { background: #eee; color: #888; }
        .review-box { border: 1px solid #c8daf0; border-radius: 6px; background: #f7fafe; padding: 16px; margin-bottom: 18px; }
        .review-facts { font-size: 13px; color: #333; margin-bottom: 10px; line-height: 1.6; }
        .review-now { font-size: 13px; background: white; border: 1px solid #eee; border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; }
        textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; min-height: 60px; }
        @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .container { padding: 18px; } .filters { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Accounts Payable</h1>
        <p class="subtitle">Sub and supplier invoices: intake, approval, and hand-off to Bookkeeping</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Same Firebase project as the other tools
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Who can open Accounts Payable (Spencer, Oct 28). Production Admin and Bookkeeping have the Admin role.
        // Estimator and Office may approve invoices on their own POs. Only Owner and Admin add invoices.
        const ALLOWED = ['owner', 'admin', 'estimator', 'super', 'office'];
        const ALLOWED_TEXT = 'Owner, Admin, Estimator, Super and Office';
        // Who can be picked to approve an invoice (Owner adds notes only, so isn't listed)
        const APPROVER_ROLES = ['admin', 'estimator', 'super', 'office'];

        // Supplier pick list (Spencer, Oct 28). Names must match the QuickBooks vendor names exactly.
        // Saved in apSettings/vendors (list). Owner and Admin add names; nobody removes them. These five start the list.
        const SUPPLIERS = ['Home Depot', "Lowe's", 'Ganahl Lumber', 'Katella Lumber', 'L&W Supply', 'National Construction Rentals']; // QuickBooks names (Spencer, Nov 6)
        // Names taken off the list (Aubree, Nov 6). The saved list can't lose a name (rules), so the page just doesn't show these.
        const RETIRED_SUPPLIERS = ['L&M', 'National'];
        const vendorsDoc = () => db.collection('apSettings').doc('vendors');
        const OTHER = '__other__';
        const MAX_MB = 20; // same limit as the Storage rule

        // Duplicate check (1c): same vendor + same invoice #, ignoring capitals, spaces, dashes and other punctuation
        const normKey = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const dupKeyOf = (vendor, number) => normKey(vendor) + '|' + normKey(number);
        // Firestore Timestamp or Date -> Date
        const asDate = (t) => t && t.toDate ? t.toDate() : t instanceof Date ? t : null;
        const dateOnly = (t) => { const d = asDate(t); return d ? `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}` : ''; };
        // Compare saved values without caring about key order
        const stable = (v) => v && typeof v === 'object' && !Array.isArray(v)
            ? Object.keys(v).sort().reduce((o, k) => { o[k] = stable(v[k]); return o; }, {}) : (v === undefined ? null : v);
        const same = (a, b) => JSON.stringify(stable(a)) === JSON.stringify(stable(b));
        // Step 2a: Production Admin decision on an invoice: pa = { status: 'Pass' | 'Pending' | 'Supplement', note, at, by }
        const PA_CHOICES = ['Pass', 'Pending', 'Supplement'];
        const isPassed = (i) => !!(i.pa && i.pa.status === 'Pass');
        // Status key saved on the invoice (status) and shown as a pill. Hidden invoices show Hidden.
        // Step 2b: the approver's decision once passed: appr = { status: 'Pay' | 'Pending' | 'Supplement', note, at, by }
        const APPR_CHOICES = ['Pay', 'Pending', 'Supplement'];
        const apprKeyOf = (appr) => appr.status === 'Pay' ? 'ready' : appr.status === 'Pending' ? 'appr-pending' : 'appr-supplement';
        const statusKeyOf = (pa, appr) => !pa || !pa.status ? 'waiting-pa'
            : pa.status === 'Pass' ? (appr && appr.status ? apprKeyOf(appr) : 'passed')
            : pa.status === 'Pending' ? 'pa-pending' : 'pa-supplement';
        const isReady = (i) => i.deleted !== true && isPassed(i) && !!(i.appr && i.appr.status === 'Pay');
        // Passed and waiting on this person's Pay / Pending / Supplement
        const waitingOn = (i, uid) => i.deleted !== true && isPassed(i) && !(i.appr && i.appr.status) && i.approver && i.approver.uid === uid;
        const statusOf = (i) => {
            if (i.deleted === true) return { key: 'hidden', text: 'Hidden' };
            if (isHolding(i)) return { key: 'coding', text: 'Needs coding' };
            const key = statusKeyOf(i.pa, i.appr);
            if (key === 'ready' && inQb(i)) return { key: 'inqb', text: 'In QuickBooks' };
            const who = i.approver && i.approver.name ? i.approver.name : 'the approver';
            const text = key === 'waiting-pa' ? 'Waiting on Production Admin'
                : key === 'passed' ? `Passed, waiting on ${who}`
                : key === 'ready' ? 'Ready to pay'
                : key === 'appr-pending' ? `Pending (${who})`
                : key === 'appr-supplement' ? `Supplement (${who})`
                : key === 'pa-pending' ? 'Pending (Production Admin)' : 'Supplement (Production Admin)';
            return { key, text };
        };
        // Step 2c: notes on an invoice, in apInvoices/{id}/apNotes (not 'notes': the Customer Notes search rule covers every 'notes' collection). The invoice keeps noteCount and openQuestionIds
        // (notes marked "Needs an answer" not yet marked Answered). Pay is blocked while any question is open.
        // Only the person who asked, or an Owner/Admin, marks a question Answered (the rule checks it).
        const ROLE_LABELS = { owner: 'Owner', admin: 'Admin', estimator: 'Estimator', super: 'Super', office: 'Office' };
        const openQ = (i) => Array.isArray(i.openQuestionIds) ? i.openQuestionIds.length : 0;
        const dateTime = (t) => { const d = asDate(t); if (!d) return '';
            let h = d.getHours(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12;
            return `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)} ${h}:${pad(d.getMinutes())} ${ap}`; };
        // Step 2d: status filter on the all-invoices list. Hidden invoices are never counted; with Show hidden they're added greyed.
        const STATUS_FILTERS = [
            ['open', 'Not yet approved', (i) => !isReady(i)],
            ['waiting-pa', 'Waiting on Production Admin', (i) => statusKeyOf(i.pa, i.appr) === 'waiting-pa'],
            ['waiting-appr', 'Waiting on approver', (i) => statusKeyOf(i.pa, i.appr) === 'passed'],
            ['held', 'Pending or Supplement', (i) => ['pa-pending', 'pa-supplement', 'appr-pending', 'appr-supplement'].includes(statusKeyOf(i.pa, i.appr))],
            ['question', 'Question open', (i) => openQ(i) > 0],
            ['ready', 'Ready to pay', (i) => isReady(i) && !inQb(i)],
            ['inqb', 'In QuickBooks', (i) => isReady(i) && inQb(i)],
            ['dupflag', 'Possible duplicate', (i) => dupOpen(i)],
            ['all', 'All statuses', () => true]
        ];
        const STATUS_DEFAULT = 'open'; // the page opens on the work queue (decided Nov 4)
        const BLANK_FILTERS = { status: STATUS_DEFAULT, superUid: '', approverUid: '', kind: '', text: '' };
        // Duplicate file names (Spencer, Nov 5): when a new invoice's file name matches one already in AP (not hidden),
        // add a random number (_R1234) and flag it; Production Admin ticks "Checked, not a duplicate" before it can pass.
        const baseFileName = (n) => String(n || '').replace(/_R\d{4}(\.[a-z0-9]{2,5})$/i, '$1').toLowerCase();
        const sameNameAs = (name, list, exceptId) => (list || []).filter(i => i.id !== exceptId && i.deleted !== true && i.file && baseFileName(i.file.name) === baseFileName(name));
        const withRandom = (name) => String(name).replace(/(\.[a-z0-9]{2,5})$/i, `_R${1000 + Math.floor(Math.random() * 9000)}$1`);
        const dupFlagFor = (matches, now) => ({ at: now, matches: matches.map(m => ({ id: m.id, invoiceNumber: m.invoiceNumber || '', jobCode: m.jobCode || '', vendor: m.vendor || '' })) });
        const dupOpen = (i) => i.deleted !== true && !!(i.dupFlag && !i.dupChecked);
        // Step 4b: a supplier bill whose job or PO isn't known yet is saved to the Needs coding list (no job, no PO, no approver).
        // Owner/Admin code it later; it then goes to Production Admin like any other invoice. Not counted on any job or PO until then.
        const isHolding = (i) => i.needsCoding === true;
        // Any invoice layout (Nov 11): the invoice # after an "Invoice #" / "Invoice No." label, the amount after a
        // "Total" / "Amount Due" / "Balance Due" label (the last one on the bill), and the invoice date. A best guess to check.
        const guessInvoice = (pages) => {
            const moneyIn = (t) => { const m = /\$?\s*\(?(-?[\d,]+\.\d{2})\)?/.exec(String(t || '')); return m ? Number(m[1].replace(/,/g, '')) : null; };
            const lines = [];
            pages.forEach((p, k) => {
                const its = p.items.slice().sort((a, b) => b.y - a.y || a.x - b.x);
                its.forEach(it => {
                    const ln = lines.find(l => l.k === k && Math.abs(l.y - it.y) <= 4);
                    if (ln) ln.items.push(it); else lines.push({ k, y: it.y, items: [it] });
                });
            });
            lines.forEach(l => { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim(); });
            const all = lines.map(l => l.text).join('\n');
            const num = /invoice\s*(?:#|no\.?|number|num)\s*[:#.]?\s*([A-Za-z0-9][A-Za-z0-9\-\/]{0,24})/i.exec(all);
            const date = /invoice\s*date\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/i.exec(all) || /\bdate\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/i.exec(all);
            const due = /due\s*date\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/i.exec(all);
            let amount = null;
            lines.forEach(l => {
                if (!/(total\s*due|amount\s*due|balance\s*due|invoice\s*total|grand\s*total|total\s*amount|amount\s*of\s*invoice|\btotal\b)/i.test(l.text)) return;
                if (/sub\s*-?\s*total|tax|previous|paid|credit|retention/i.test(l.text) && !/total\s*due|amount\s*due|balance\s*due|grand\s*total/i.test(l.text)) return;
                const after = l.text.replace(/^.*?(total\s*due|amount\s*due|balance\s*due|invoice\s*total|grand\s*total|total\s*amount|amount\s*of\s*invoice|\btotal\b)/i, '');
                const v = moneyIn(after);
                if (v !== null && v > 0) amount = v; // the last labelled total on the bill wins
            });
            return { invoiceNumber: num && !/^(date|no|number|total)$/i.test(num[1]) ? num[1] : '', amount,
                invoiceDate: date ? APReader.isoDate(date[1]) : '', dueDate: due ? APReader.isoDate(due[1]) : '' };
        };
        // A known job code in some text, and right after it a PO number (-014) or a trade (/FRM). Longest codes first. (Nov 11)
        const findJobInText = (text, jobs) => {
            const t = String(text || ''); const low = t.toLowerCase();
            let first = null;
            for (const j of (jobs || []).filter(x => x.code).slice().sort((a, b) => b.code.length - a.code.length)) {

                }
            };

            // A job code in the file name picks the job (for example CONBO.M.2519_FRM.pdf)
            const guessJob = (name) => {
                const n = normKey(name);
                const hit = openJobs.filter(j => j.code && n.includes(normKey(j.code)));
                return hit.length === 1 ? hit[0].id : '';
            };
            const addFiles = (fileList) => {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                const bad = [];
                const room = BATCH_MAX - rows.length;
                const fresh = [];
                files.forEach(f => {
                    if (!(f.type === 'application/pdf' || (f.type || '').startsWith('image/'))) { bad.push(`${f.name} (not a PDF or photo)`); return; }
                    if (f.size > MAX_MB * 1024 * 1024) { bad.push(`${f.name} (over ${MAX_MB} MB)`); return; }
                    if (fresh.length >= room) { bad.push(`${f.name} (more than ${BATCH_MAX} files in one batch)`); return; }
                    const jobId = guessJob(f.name);
                    // A job already loaded fills in its Super and its only material PO right away
                    const jd = jobId ? jobData[jobId] : null;
                    // A trade code at the end of the file name (like _FRM.pdf) picks the material PO when the job has more than one
                    const tm = /[_\-\s]([A-Za-z]{3})\.[A-Za-z]{3,4}$/.exec(f.name);
                    // ...but not the start of a job code (Nationa-ABC.pdf is job ABC.123, not trade ABC)
                    const trade = tm && !openJobs.some(j => j.code && String(j.code).split('.')[0].toUpperCase() === tm[1].toUpperCase()) ? tm[1].toUpperCase() : '';
                    const formId = jd && jd.pos ? pickMaterialPO(jd.pos, trade) : '';
                    const approverUid = jd && jd.superInfo ? jd.superInfo.uid : '';
                    fresh.push({ key: nextKey.current++, file: f, jobId, formId, vendorPick: defs.vendorPick, vendorOther: defs.vendorOther,
                        addVendor: false, invoiceNumber: '', amount: '', dateReceived: defs.dateReceived, approverUid, state: 'new', msg: '',
                        jobHow: jobId ? 'file' : '', jobOk: true, trade, invoiceDate: '', dueDate: '', reading: f.type === 'application/pdf', readInfo: null });
                });
                setRows(rs => [...rs, ...fresh]);
                fresh.forEach(r => r.jobId && loadJob(r.jobId));
                fresh.forEach(r => r.reading && readRow(r.key, r.file));
                setTopMsg(bad.length ? { text: `Not added: ${bad.join('; ')}.`, ok: false }
                    : { text: `${fresh.length} file${fresh.length === 1 ? '' : 's'} added.${fresh.some(r => r.reading) ? ' Supplier PDFs fill themselves in.' : ''} Check each card, then Save all ready.`, ok: true });
            };

            // Read one PDF and fill its card (or several cards, one per invoice in the file)
            const readRow = async (key, file) => {
                let res = null, split = null, splitErr = '';
                try {
                    const got = await pdfPages(file);
                    res = APReader.readSupplierPdf(got.pages);
                    if (res && res.invoices && res.invoices.length > 1 && got.numPages > 1) {
                        try { split = await splitPages(got.bytes, file.name, res.invoices.map(i => i.page), got.numPages); }
                        catch (e) { splitErr = 'The pages could not be split, so each card keeps the whole file.'; }
                    }
                } catch (error) { res = { error: error.message }; }
                const fail = !res ? 'unknown' : res.error ? 'error' : res.unreadable ? 'scan' : res.unknown ? 'unknown' : !res.invoices.length ? 'unknown' : '';
                if (fail) {
                    setRows(rs => rs.map(r => r.key !== key ? r : { ...r, reading: false, readInfo: { fail, msg: res && res.error ? res.error : '' } }));
                    return;
                }
                const pick = vendorList.find(n => n.toLowerCase().includes(res.keyword)) || '';
                const many = res.invoices.length;
                // Match the jobs first, so their POs and Super can be loaded straight away
                const matched = res.invoices.map(inv => APReader.matchJob(inv.jobText, openJobs));
                matched.forEach(m => m.jobId && loadJob(m.jobId));
                setRows(rs => {
                    const idx = rs.findIndex(r => r.key === key);
                    if (idx < 0) return rs;
                    const base = rs[idx];
                    const made = res.invoices.map((inv, k) => {
                        const m = matched[k];
                        const jobId = m.jobId || (k === 0 ? base.jobId : '');
                        const jd = jobId ? jobDataRef.current[jobId] : null;
                        const fields = ['supplier'];
                        if (inv.invoiceNumber) fields.push('invoice #');
                        if (inv.amount !== null && inv.amount !== undefined) fields.push('amount');
                        if (inv.invoiceDate || inv.dueDate) fields.push('bill and due dates');
                        if (m.jobId) fields.push('job');
                        if (m.trade) fields.push('trade ' + m.trade);
                        else if (base.trade) fields.push('trade ' + base.trade + ' (from the file name)');
                        return {
                            ...base, key: k === 0 ? base.key : nextKey.current++,
                            file: split ? split[k] : base.file,
                            vendorPick: pick || OTHER, vendorOther: pick ? '' : res.supplier,
                            invoiceNumber: inv.invoiceNumber || (k === 0 ? base.invoiceNumber : ''),
                            amount: inv.amount !== null && inv.amount !== undefined ? inv.amount.toFixed(2) : (k === 0 ? base.amount : ''),
                            jobId, jobHow: m.jobId ? m.how : (jobId ? base.jobHow : ''), jobOk: !(m.jobId && m.how !== 'code'),
                            trade: m.trade || base.trade || '', invoiceDate: inv.invoiceDate || '', dueDate: inv.dueDate || '',
                            formId: jd && jd.pos ? pickMaterialPO(jd.pos, m.trade || base.trade) : '',
                            approverUid: jd && jd.superInfo ? jd.superInfo.uid : (k === 0 && jobId === base.jobId ? base.approverUid : ''),
                            reading: false,
                            readInfo: { supplier: res.supplier, fields, note: [inv.note, splitErr].filter(Boolean).join(' '), jobText: inv.jobText || '',
                                page: many > 1 ? inv.page : 0, of: many, originalFileName: file.name, supplierOnList: !!pick }
                        };
                    });
                    return [...rs.slice(0, idx), ...made, ...rs.slice(idx + 1)];
                });
            };
            const setRow = (key, patch) => {
                setRows(rs => rs.map(r => {
                    if (r.key !== key) return r;
                    const next = { ...r, ...patch, state: r.state === 'error' ? 'new' : r.state, msg: r.state === 'error' ? '' : r.msg };
                    if (patch.jobId !== undefined && patch.jobId !== r.jobId) {
                        next.formId = ''; next.approverUid = ''; next.jobHow = 'manual'; next.jobOk = true;
                        const jd = jobData[patch.jobId];
                        if (jd && jd.pos) { next.approverUid = jd.superInfo ? jd.superInfo.uid : ''; next.formId = pickMaterialPO(jd.pos, r.trade); }
                    }
                    return next;
                }));
                if (patch.jobId) loadJob(patch.jobId);
            };
            const removeRow = (key) => setRows(rs => rs.filter(r => r.key !== key));
            const applyDefaults = () => {
                setRows(rs => rs.map(r => r.state === 'saved' ? r : r.readInfo && r.readInfo.supplier ? { ...r, dateReceived: defs.dateReceived }
                    : { ...r, vendorPick: defs.vendorPick, vendorOther: defs.vendorOther, dateReceived: defs.dateReceived }));
                setTopMsg({ text: 'Supplier and date put on every card not yet saved (cards read from a PDF keep their supplier).', ok: true });
            };

            // What each card has and is missing
            const keyOf = (r) => {
                const typed = r.vendorOther.trim().replace(/\s+/g, ' ');
                const onList = typed ? vendorList.find(n => n.toLowerCase() === typed.toLowerCase()) : null;
                const vendor = r.vendorPick === OTHER ? (onList || typed) : r.vendorPick;
                return { vendor, typed, onList, dk: vendor && r.invoiceNumber.trim() ? dupKeyOf(vendor, r.invoiceNumber) : '' };
            };
            const info = {};
            rows.forEach((r, idx) => {
                const { vendor, typed, onList, dk } = keyOf(r);
                const job = (jobs || []).find(j => j.id === r.jobId) || null;
                const jd = r.jobId ? jobData[r.jobId] : null;
                const po = jd && jd.pos ? jd.pos.find(p => p.id === r.formId) || null : null;
                const amount = amountOf(r.amount);
                const list = [...(approvers || [])];
                if (jd && jd.superInfo && !list.some(a => a.uid === jd.superInfo.uid)) list.unshift({ uid: jd.superInfo.uid, name: jd.superInfo.name || 'Job Super', role: 'super' });
                const approver = list.find(a => a.uid === r.approverUid) || null;
                const dupAp = dk && allInvoices ? allInvoices.find(i => i.deleted !== true && dupKeyOf(i.vendor, i.invoiceNumber) === dk) : null;
                const dupBatch = dk ? rows.slice(0, idx).find(o => o.state !== 'saved' && keyOf(o).dk === dk) : null;
                const problem = r.state === 'saved' ? ''
                    : r.reading ? 'Reading the PDF...'
                    : !r.jobId ? (r.readInfo && r.readInfo.supplier && r.readInfo.jobText ? `Pick the job. The bill says "${r.readInfo.jobText}", which doesn't match a job code.` : r.readInfo && r.readInfo.supplier ? 'Pick the job. The bill has no job code on it.' : 'Pick the job.')
                    : (r.jobHow === 'number' || r.jobHow === 'name') && !r.jobOk ? `Check the job: it was matched by ${JOB_HOW[r.jobHow]} in "${r.readInfo ? r.readInfo.jobText : ''}". Tick "Job is right" if it is.`
                    : !jd || jd.pos === null ? 'Loading the job...'
                    : jd.error ? jd.error
                    : jd.pos.length === 0 ? 'This job has no material PO (sub name "General Material" or "Various – see scope"). Make one in PO Manager first.'
                    : !po ? 'Pick the material PO.'
                    : !vendor ? 'Pick or type the supplier.'
                    : !r.invoiceNumber.trim() ? 'Type the invoice #.'
                    : !(amount > 0) ? 'Type the amount.'
                    : !/^\d{4}-\d{2}-\d{2}$/.test(r.dateReceived) ? 'Pick the date received.'
                    : !approver ? 'Pick who approves it.'
                    : allInvoices === null ? 'Still loading the invoice list...'
                    : dupAp ? `Invoice ${dupAp.invoiceNumber} from ${dupAp.vendor} is already in AP on ${dupAp.jobCode || 'the Needs coding list'}. It can't be added twice.`
                    : dupBatch ? `Same supplier and invoice # as ${dupBatch.file.name} in this batch.`
                    : '';
                // PO balance: passed invoices + invoices added but not passed + other unsaved cards on the same PO
                let warn = '';
                if (po && amount > 0 && r.state !== 'saved') {
                    if (po.amount === null) warn = 'This PO has no amount, so it can\'t pass until the PO is fixed in PO Manager.';
                    else {
                        const onPo = (allInvoices || []).filter(i => i.deleted !== true && i.po && i.po.formId === po.id);
                        const used = onPo.reduce((sum, i) => sum + (i.amount || 0), 0)
                            + rows.filter(o => o.key !== r.key && o.state !== 'saved' && o.jobId === r.jobId && o.formId === po.id).reduce((sum, o) => sum + (amountOf(o.amount) || 0), 0);
                        if (used + amount > po.amount + 0.005) warn = `With the invoices already on this PO and in this batch, it would be over the PO's ${money(po.amount)} by ${money(used + amount - po.amount)}. It can be added, but it can't pass until a revised PO or a supplement covers it.`;
                    }
                }
                const fileName = !problem && po && vendor && amount > 0 ? buildFileName({ category: po.category, vendor, amount, poNumber: po.poNumber, dateReceived: r.dateReceived, file: r.file }) : '';
                // Needs coding (4b): the supplier, invoice #, amount and date are in, no duplicate, but no job or PO yet
                const holdOk = r.state !== 'saved' && !r.reading && !!vendor && !!r.invoiceNumber.trim() && amount > 0
                    && /^\d{4}-\d{2}-\d{2}$/.test(r.dateReceived) && allInvoices !== null && !dupAp && !dupBatch;
                const canHold = !!problem && holdOk && !po;
                const holdName = canHold ? holdFileName({ vendor, amount, dateReceived: r.dateReceived, file: r.file }) : '';
                // A duplicate is normally named only once the job and PO are in; say it straight away so it's clear why it can't be saved at all
                const dupMsg = dupAp ? `Invoice ${dupAp.invoiceNumber} from ${dupAp.vendor} is already in AP on ${dupAp.jobCode || 'the Needs coding list'}. It can't be added twice.`
                    : dupBatch ? `Same supplier and invoice # as ${dupBatch.file.name} in this batch.` : '';
                info[r.key] = { vendor, typed, onList, job, jd, po, amount, approver, approverList: list, problem, warn, fileName, canHold, holdName,
                    dupEarly: r.state !== 'saved' && dupMsg && problem !== dupMsg ? dupMsg : '' };
            });
            const readyRows = rows.filter(r => r.state !== 'saved' && !info[r.key].problem);
            const unsavedCount = rows.filter(r => r.state !== 'saved').length;
            const savedCount = rows.length - unsavedCount;

            const saveAll = async () => {
                if (!readyRows.length) return;
                setRunning(true); setTopMsg(null);
                let ok = 0, failed = 0, flagged = 0;
                const savedThisRun = [];
                for (const r of readyRows) {
                    const x = info[r.key];
                    setRows(rs => rs.map(o => o.key === r.key ? { ...o, state: 'saving', msg: '' } : o));
                    try {
                        const invRef = db.collection('apInvoices').doc();
                        const sameName = sameNameAs(x.fileName, [...(allInvoices || []), ...savedThisRun]);
                        const saveName = sameName.length ? withRandom(x.fileName) : x.fileName;
                        const path = `apInvoices/${r.jobId}/${invRef.id}/${Date.now()}_${saveName}`;
                        const ref = storage.ref(path);
                        await ref.put(r.file, cleanSaveName(saveName, r.file.type));
                        const url = await ref.getDownloadURL();
                        const now = new Date();
                        const by = { uid: user.uid, name: profile.name || user.email };
                        const batch = db.batch();
                        const newVendor = r.vendorPick === OTHER && r.addVendor && !x.onList;
                        if (newVendor) {
                            batch.set(vendorsDoc(), {
                                list: firebase.firestore.FieldValue.arrayUnion(...SUPPLIERS, x.vendor),
                                added: firebase.firestore.FieldValue.arrayUnion({ name: x.vendor, at: now, by })
                            }, { merge: true });
                        }
                        batch.set(invRef, {
                            jobId: r.jobId, jobCode: x.job ? x.job.code : '', kind: 'supplier', vendor: x.vendor,
                            invoiceNumber: r.invoiceNumber.trim(), amount: x.amount, previousPayment: null, dateReceived: r.dateReceived,
                            po: { formId: x.po.id, poNumber: x.po.poNumber, category: x.po.category, subName: x.po.subName },
                            approver: { uid: x.approver.uid, name: x.approver.name },
                            file: { url, name: saveName, path, type: r.file.type },
                            dupFlag: sameName.length ? dupFlagFor(sameName, now) : null,
                            invoiceDate: r.invoiceDate || null, dueDate: r.dueDate || null,
                            pdfRead: r.readInfo && r.readInfo.supplier ? { supplier: r.readInfo.supplier, fields: r.readInfo.fields, jobText: r.readInfo.jobText,
                                jobHow: r.jobHow || '', page: r.readInfo.page || 0, of: r.readInfo.of || 1, at: now } : null,
                            createdAt: now, createdBy: by, deleted: false, batchUpload: true
                        });
                        batch.set(invRef.collection('history').doc(), { action: 'Added', at: now, by, batchUpload: true,
                            originalFileName: r.readInfo && r.readInfo.originalFileName ? r.readInfo.originalFileName : r.file.name,
                            ...(r.readInfo && r.readInfo.supplier ? { readFromPdf: r.readInfo.supplier } : {}), ...(sameName.length ? { dupFlag: true } : {}) });
                        await batch.commit();
                        ok++;
                        if (sameName.length) flagged++;
                        savedThisRun.push({ id: invRef.id, invoiceNumber: r.invoiceNumber.trim(), jobCode: x.job ? x.job.code : '', vendor: x.vendor, deleted: false, file: { name: saveName } });
                        setRows(rs => rs.map(o => o.key === r.key ? { ...o, state: 'saved',
                            msg: `Saved as ${saveName}` + (sameName.length ? ` (same file name as invoice ${sameName.map(m => m.invoiceNumber).join(', ')}: flagged as a possible duplicate)` : '') } : o));
                    } catch (error) {
                        failed++;
                        setRows(rs => rs.map(o => o.key === r.key ? { ...o, state: 'error', msg: 'Error saving: ' + error.message } : o));
                    }
                }
                setRunning(false);
                const left = unsavedCount - ok;
                setTopMsg({ text: `${ok} saved${failed ? `, ${failed} not saved (see the red cards)` : ''}.${left > 0 ? ` ${left} card${left === 1 ? '' : 's'} still to finish.` : ' Every card is saved.'}`
                    + (flagged ? ` ${flagged} flagged as a possible duplicate (same file name) for Production Admin to check.` : ''), ok: !failed });
            };
            // 4b: save cards with no job or PO yet to the Needs coding list
            const holdList = rows.filter(r => r.state !== 'saved' && info[r.key].canHold);
            const saveHold = async (list) => {
                if (!list.length) return;
                setRunning(true); setTopMsg(null);
                let ok = 0, failed = 0, flagged = 0;
                const savedThisRun = [];
                for (const r of list) {
                    const x = info[r.key];
                    setRows(rs => rs.map(o => o.key === r.key ? { ...o, state: 'saving', msg: '' } : o));
                    try {
                        const invRef = db.collection('apInvoices').doc();
                        const sameName = sameNameAs(x.holdName, [...(allInvoices || []), ...savedThisRun]);
                        const saveName = sameName.length ? withRandom(x.holdName) : x.holdName;
                        const path = `apInvoices/${HOLD_FOLDER}/${invRef.id}/${Date.now()}_${saveName}`;
                        const ref = storage.ref(path);
                        await ref.put(r.file, cleanSaveName(saveName, r.file.type));
                        const url = await ref.getDownloadURL();
                        const now = new Date();
                        const by = { uid: user.uid, name: profile.name || user.email };
                        const batch = db.batch();
                        const newVendor = r.vendorPick === OTHER && r.addVendor && !x.onList;
                        if (newVendor) {
                            batch.set(vendorsDoc(), {
                                list: firebase.firestore.FieldValue.arrayUnion(...SUPPLIERS, x.vendor),
                                added: firebase.firestore.FieldValue.arrayUnion({ name: x.vendor, at: now, by })
                            }, { merge: true });
                        }
                        batch.set(invRef, {
                            jobId: '', jobCode: '', kind: 'supplier', vendor: x.vendor,
                            invoiceNumber: r.invoiceNumber.trim(), amount: x.amount, previousPayment: null, dateReceived: r.dateReceived,
                            po: null, approver: null,
                            file: { url, name: saveName, path, type: r.file.type },
                            dupFlag: sameName.length ? dupFlagFor(sameName, now) : null,
                            invoiceDate: r.invoiceDate || null, dueDate: r.dueDate || null,
                            pdfRead: r.readInfo && r.readInfo.supplier ? { supplier: r.readInfo.supplier, fields: r.readInfo.fields, jobText: r.readInfo.jobText,
                                jobHow: r.jobHow || '', page: r.readInfo.page || 0, of: r.readInfo.of || 1, at: now } : null,
                            needsCoding: true,
                            hold: { at: now, by, jobId: r.jobId || '', jobCode: x.job ? x.job.code : '', trade: r.trade || '',
                                jobText: r.readInfo && r.readInfo.jobText ? r.readInfo.jobText : '', why: x.problem },
                            createdAt: now, createdBy: by, deleted: false, batchUpload: true
                        });
                        batch.set(invRef.collection('history').doc(), { action: 'Added', at: now, by, batchUpload: true, needsCoding: true,
                            originalFileName: r.readInfo && r.readInfo.originalFileName ? r.readInfo.originalFileName : r.file.name,
                            ...(r.readInfo && r.readInfo.supplier ? { readFromPdf: r.readInfo.supplier } : {}), ...(sameName.length ? { dupFlag: true } : {}) });
                        await batch.commit();
                        ok++;
                        if (sameName.length) flagged++;
                        savedThisRun.push({ id: invRef.id, invoiceNumber: r.invoiceNumber.trim(), jobCode: '', vendor: x.vendor, deleted: false, file: { name: saveName } });
                        setRows(rs => rs.map(o => o.key === r.key ? { ...o, state: 'saved',
                            msg: `Saved to Needs coding as ${saveName}` + (sameName.length ? ` (same file name as invoice ${sameName.map(m => m.invoiceNumber).join(', ')}: flagged as a possible duplicate)` : '') } : o));
                    } catch (error) {
                        failed++;
                        setRows(rs => rs.map(o => o.key === r.key ? { ...o, state: 'error', msg: 'Error saving: ' + error.message } : o));
                    }
                }
                setRunning(false);
                const left = unsavedCount - ok;
                setTopMsg({ text: `${ok} saved to Needs coding${failed ? `, ${failed} not saved (see the red cards)` : ''}.${left > 0 ? ` ${left} card${left === 1 ? '' : 's'} still to finish.` : ' Every card is saved.'}`
                    + ' Code them from the Needs coding tab.' + (flagged ? ` ${flagged} flagged as a possible duplicate (same file name).` : ''), ok: !failed });
            };
            const close = () => {
                if (unsavedCount && !window.confirm(`${unsavedCount} file${unsavedCount === 1 ? ' is' : 's are'} not saved. Close and drop ${unsavedCount === 1 ? 'it' : 'them'}?`)) return;
                onClose();
            };

            return (
                <div className="batch-box">
                    <div className="section-head" style={{ marginBottom: '6px' }}>
                        <div className="section-title">Batch upload: supplier bills</div>
                        <button className="btn-secondary btn-auto btn-sm" onClick={close} disabled={running}>Close</button>
                    </div>
                    <p className="muted" style={{ marginBottom: '10px' }}>Drop in up to {BATCH_MAX} PDFs or photos. Each becomes a card: fill in the job, material PO, supplier, invoice #, amount and date. Cards save when they're complete; the rest stay here until you finish them. A job code in the file name picks the job. Home Depot, L&W Supply, National and Ganahl Lumber PDFs are read and filled in for you; scans and photos are filled in by hand.</p>
                    <div className="batch-defaults">
                        <div>
                            <label htmlFor="b-def-vendor">Supplier for new files</label>
                            <select id="b-def-vendor" value={defs.vendorPick} onChange={e => setDefs(d => ({ ...d, vendorPick: e.target.value }))}>
                                <option value="">-- Pick on each card --</option>
                                {vendorList.map(v => <option key={v} value={v}>{v}</option>)}
                                <option value={OTHER}>Other (type it)</option>
                            </select>
                            {defs.vendorPick === OTHER && <input type="text" style={{ marginTop: '6px' }} value={defs.vendorOther} placeholder="Name as it is in QuickBooks" onChange={e => setDefs(d => ({ ...d, vendorOther: e.target.value }))} />}
                        </div>
                        <div>
                            <label htmlFor="b-def-date">Date received for new files</label>
                            <input id="b-def-date" type="date" value={defs.dateReceived} onChange={e => setDefs(d => ({ ...d, dateReceived: e.target.value }))} />
                        </div>
                        <button className="btn-secondary btn-auto btn-sm" onClick={applyDefaults} disabled={running || !unsavedCount}>Use on all cards</button>
                    </div>
                    <label className={'drop' + (dragOver ? ' over' : '')} style={{ display: 'block', marginBottom: '12px' }}
                        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                        onDragLeave={() => setDragOver(false)}
                        onDrop={e => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}>
                        <span>Drop the supplier bills here, or click to pick them (PDF or photo, {MAX_MB} MB each).</span>
                        <input type="file" multiple accept="application/pdf,image/*" style={{ display: 'none' }}
                            onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
                    </label>
                    {topMsg && <div className={topMsg.ok ? 'ok' : 'error'} style={{ marginBottom: '10px' }}>{topMsg.text}</div>}

                    {rows.map(r => {
                        const x = info[r.key];
                        const saved = r.state === 'saved';
                        const dis = saved || r.state === 'saving' || running;
                        return (
                            <div key={r.key} className={'bcard' + (saved ? ' saved' : r.state === 'error' ? ' bad' : '')}>
                                <div className="bcard-head">
                                    <span><strong>{r.file.name}</strong> <span className="muted">({Math.max(1, Math.round(r.file.size / 1024))} KB)</span></span>
                                    <span className="row-btns">
                                        <button className="btn-link" onClick={() => window.open(URL.createObjectURL(r.file))}>View</button>
                                        {!saved && <button className="btn-link" onClick={() => removeRow(r.key)} disabled={dis}>Remove</button>}
                                        {r.reading && <span className="pill waiting-pa">Reading...</span>}
                                        {!r.reading && r.readInfo && r.readInfo.supplier && <span className="pill checked">Read from PDF</span>}
                                        {saved ? <span className="pill passed">Saved</span> : r.state === 'saving' ? <span className="pill waiting-pa">Saving...</span>
                                            : x.problem ? <span className="pill pa-pending">Needs info</span> : <span className="pill waiting-pa">Ready</span>}
                                    </span>
                                </div>
                                {!saved && r.readInfo && (
                                    <div className="muted" style={{ fontSize: '12px', marginBottom: '6px' }}>
                                        {r.readInfo.supplier
                                            ? <span>Read as a <strong>{r.readInfo.supplier}</strong> bill{r.readInfo.page ? ` (invoice on page ${r.readInfo.page}; this file had ${r.readInfo.of} invoices, so each has its own card)` : ''}: filled {r.readInfo.fields.join(', ')}.
                                                {r.invoiceDate ? ` Bill date ${shortDate(r.invoiceDate)}` : ''}{r.dueDate ? `, due ${shortDate(r.dueDate)}` : ''}{r.invoiceDate || r.dueDate ? ' (for Bookkeeping).' : ''}
                                                {r.readInfo.note ? ' ' + r.readInfo.note : ''}
                                                {!r.readInfo.supplierOnList ? ` "${r.readInfo.supplier}" isn't on the supplier list yet: check it matches the QuickBooks name and tick Add to the supplier list.` : ''} Check every field before saving.</span>
                                            : r.readInfo.fail === 'scan' ? <span className="warn">This PDF has no text (a scan or a photo), so it can't be read. Fill in the card.</span>
                                            : r.readInfo.fail === 'error' ? <span className="warn">{r.readInfo.msg || 'The PDF could not be read.'} Fill in the card.</span>
                                            : <span className="warn">Not a bill layout the tool knows (it reads Home Depot, L&W Supply, National and Ganahl Lumber). Fill in the card.</span>}
                                    </div>
                                )}
                                {!saved && (
                                    <div className="bgrid">
                                        <div>
                                            <label>Job</label>
                                            <select value={r.jobId} onChange={e => setRow(r.key, { jobId: e.target.value })} disabled={dis}>
                                                <option value="">-- Pick the job --</option>
                                                {openJobs.map(j => <option key={j.id} value={j.id}>{j.code} - {j.address}</option>)}
                                            </select>
                                            {(r.jobHow === 'number' || r.jobHow === 'name') && (
                                                <label className="check" style={{ marginTop: '4px' }}>
                                                    <input type="checkbox" checked={!!r.jobOk} onChange={e => setRow(r.key, { jobOk: e.target.checked })} disabled={dis} />
                                                    Job is right (matched by {JOB_HOW[r.jobHow]} in "{r.readInfo ? r.readInfo.jobText : ''}")
                                                </label>
                                            )}
                                        </div>
                                        <div>
                                            <label>Material PO</label>
                                            <select value={r.formId} onChange={e => setRow(r.key, { formId: e.target.value })} disabled={dis || !x.jd || !x.jd.pos}>
                                                <option value="">{r.jobId && x.jd && x.jd.pos === null ? 'Loading...' : '-- Pick the PO --'}</option>
                                                {(x.jd && x.jd.pos ? x.jd.pos : []).map(p => <option key={p.id} value={p.id}>{p.category} - {p.poNumber} - {p.subName}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label>Supplier</label>
                                            <select value={r.vendorPick} onChange={e => setRow(r.key, { vendorPick: e.target.value })} disabled={dis}>
                                                <option value="">-- Pick the supplier --</option>
                                                {vendorList.map(v => <option key={v} value={v}>{v}</option>)}
                                                <option value={OTHER}>Other (type it)</option>
                                            </select>
                                            {r.vendorPick === OTHER && (
                                                <div>
                                                    <input type="text" style={{ marginTop: '4px' }} value={r.vendorOther} placeholder="Name as it is in QuickBooks" onChange={e => setRow(r.key, { vendorOther: e.target.value })} disabled={dis} />
                                                    {x.onList ? <div className="muted">On the list as "{x.onList}".</div>
                                                        : x.typed && <label className="check" style={{ marginTop: '4px' }}>
                                                            <input type="checkbox" checked={r.addVendor} onChange={e => setRow(r.key, { addVendor: e.target.checked })} disabled={dis} />
                                                            Add "{x.typed}" to the supplier list</label>}
                                                </div>
                                            )}
                                        </div>
                                        <div>
                                            <label>Invoice #</label>
                                            <input type="text" value={r.invoiceNumber} onChange={e => setRow(r.key, { invoiceNumber: e.target.value })} disabled={dis} />
                                        </div>
                                        <div>
                                            <label>Amount</label>
                                            <input type="text" inputMode="decimal" placeholder="$0.00" value={r.amount} onChange={e => setRow(r.key, { amount: e.target.value })} disabled={dis} />
                                        </div>
                                        <div>
                                            <label>Date received</label>
                                            <input type="date" value={r.dateReceived} onChange={e => setRow(r.key, { dateReceived: e.target.value })} disabled={dis} />
                                        </div>
                                        <div>
                                            <label>Approver</label>
                                            <select value={r.approverUid} onChange={e => setRow(r.key, { approverUid: e.target.value })} disabled={dis}>
                                                <option value="">{approvers === null ? 'Loading people...' : '-- Pick who approves it --'}</option>
                                                {x.approverList.map(a => <option key={a.uid} value={a.uid}>{a.name}{x.jd && x.jd.superInfo && a.uid === x.jd.superInfo.uid ? ' (job Super)' : ` (${a.role})`}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                )}
                                {!saved && x.problem && <div className={x.problem.startsWith('Loading') ? 'muted' : (x.problem.includes('already in AP') || x.problem.startsWith('Same supplier') ? 'dup' : 'warn')} style={{ marginTop: '6px' }}>{x.problem}</div>}
                                {!saved && x.warn && <div className="warn" style={{ marginTop: '6px' }}>{x.warn}</div>}
                                {!saved && x.fileName && <div className="fname" style={{ marginTop: '6px', marginBottom: 0 }}>Saved as: {x.fileName}</div>}
                                {!saved && x.dupEarly && <div className="dup" style={{ marginTop: '6px' }}>{x.dupEarly}</div>}
                                {!saved && x.canHold && (
                                    <div className="hold-line">Job or PO not known yet? <button className="btn-link" onClick={() => saveHold([r])} disabled={dis}>Save to Needs coding</button>
                                        <span className="muted"> (it waits on the Needs coding tab until someone picks the job and PO)</span></div>
                                )}
                                {r.msg && <div className={saved ? 'ok' : 'error'} style={{ marginTop: '6px' }}>{r.msg}</div>}
                            </div>
                        );
                    })}

                    {rows.length > 0 && (
                        <div className="actions" style={{ alignItems: 'center' }}>
                            <span className="muted">{readyRows.length} ready · {unsavedCount - readyRows.length} need info · {savedCount} saved</span>
                            {savedCount > 0 && <button className="btn-secondary btn-auto btn-sm" onClick={() => setRows(rs => rs.filter(r => r.state !== 'saved'))} disabled={running}>Clear saved cards</button>}
                            {holdList.length > 0 && <button className="btn-secondary btn-auto" onClick={() => saveHold(holdList)} disabled={running}>{`Save ${holdList.length} to Needs coding`}</button>}
                            <button className="btn-primary btn-auto" onClick={saveAll} disabled={running || !readyRows.length}>{running ? 'Saving...' : `Save all ready (${readyRows.length})`}</button>
                        </div>
                    )}
                </div>
            );
        }

        // Step 4b / E1 (Nov 11): Needs coding page (Owner/Admin). Bills saved with no job or PO yet: batch-upload holds and, from
        // email intake, every emailed bill (with the job and PO already filled in when the email or file gave them). Pick or check the
        // job, PO, name, invoice # and amount; Save coding sends it to Production Admin like any other invoice.
        function NeedsCoding({ allInvoices, jobs, approvers, vendorList, user, profile, onHide }) {
            const BLANK = { kind: '', vendorPick: '', vendorOther: '', invoiceNumber: '', amount: '', previousPayment: '', dateReceived: '',
                invoiceDate: '', dueDate: '', jobId: '', formId: '', approverUid: '', poWanted: '' };
            const [codeId, setCodeId] = useState(null);
            const [f, setF] = useState(BLANK);
            const [jd, setJd] = useState(null);       // { jobId, pos: all POs | null (loading), superInfo, error }
            const [readNote, setReadNote] = useState('');
            const [msg, setMsg] = useState(null);
            const [saving, setSaving] = useState(false);
            const current = React.useRef('');
            const opened = React.useRef('');
            const list = (allInvoices || []).filter(i => isHolding(i) && i.deleted !== true)
                .sort((a, b) => (a.dateReceived || '').localeCompare(b.dateReceived || '') || (a.vendor || '').localeCompare(b.vendor || ''));
            const openJobs = (jobs || []).filter(j => !j.archived);
            const inv = codeId ? list.find(i => i.id === codeId) || null : null;
            const tradeOf = (i) => (i && i.hold && i.hold.trade) || '';
            const names = vendorList || SUPPLIERS;
            const pickName = (name) => {
                const n = String(name || '').trim();
                if (!n) return { vendorPick: '', vendorOther: '' };
                const on = names.find(x => x.toLowerCase() === n.toLowerCase());
                return on ? { vendorPick: on, vendorOther: '' } : { vendorPick: OTHER, vendorOther: n };
            };
            const set = (k, v) => setF(x => ({ ...x, [k]: v }));

            const loadFor = async (jobId, trade, keepFormId) => {
                current.current = jobId;
                setJd(jobId ? { jobId, pos: null, superInfo: undefined } : null);
                if (!jobId) return;
                try {
                    const [formsSnap, cardSnap] = await Promise.all([
                        db.collection('jobs').doc(jobId).collection('forms').get(),
                        db.collection('jobs').doc(jobId).collection('notesInfo').doc('contactCard').get()
                    ]);
                    const all = [];
                    formsSnap.forEach(doc => {
                        const d = doc.data();
                        if (d.deleted === true) return;
                        all.push({ id: doc.id, poNumber: d.poNumber || '', category: d.category || '', subName: d.subName || '',
                            status: poStatus(d.status), amount: amountOf(d.contractAmount) });
                    });
                    all.sort((a, b) => a.poNumber.localeCompare(b.poNumber, undefined, { numeric: true }));
                    const t = cardSnap.exists ? (cardSnap.data().team || {}) : {};
                    const sup = t.super && t.super.uid ? t.super : null;
                    if (current.current !== jobId) return;
                    setJd({ jobId, pos: all, superInfo: sup });
                    setF(x => {
                        if (x.jobId !== jobId) return x;
                        let formId = x.formId && all.some(p => p.id === x.formId) ? x.formId : '';
                        let kind = x.kind;
                        const found = formId ? all.find(p => p.id === formId) : null;
                        if (found && !kind) kind = isGeneralPO(found) ? 'supplier' : 'sub';
                        if (!formId && x.poWanted) {
                            const w = all.find(p => p.poNumber.toLowerCase() === x.poWanted.toLowerCase());
                            if (w) { formId = w.id; kind = isGeneralPO(w) ? 'supplier' : 'sub'; }
                        }
                        if (!formId && kind === 'supplier') formId = pickMaterialPO(all.filter(isGeneralPO), trade);
                        return { ...x, kind, formId, approverUid: x.approverUid || (sup ? sup.uid : '') };
                    });
                } catch (error) {
                    if (current.current !== jobId) return;
                    setJd({ jobId, pos: [], superInfo: null, error: 'Error loading the job: ' + error.message });
                }
            };
            // Supplier PDFs with nothing typed yet are read when the bill is opened (Home Depot, L&W, National, Ganahl)
            const readStored = async (i) => {
                if (!i.file || !i.file.url || !/pdf/i.test(i.file.type || i.file.name || '')) return;
                const hasJob = !!(i.hold && i.hold.jobId);
                if (i.invoiceNumber && typeof i.amount === 'number' && hasJob) return;
                setReadNote('Reading the PDF...');
                try {
                    const blob = await fetchFile(i.file.url);
                    const { pages } = await pdfPages(blob);
                    const res = APReader.readSupplierPdf(pages);
                    if (opened.current !== i.id) return;
                    // Any layout: a job code or PO number printed on the PDF picks the job and PO
                    let foundNote = '';
                    if (!hasJob) {
                        const text = pages.map(p => p.items.slice().sort((a, b) => b.y - a.y || a.x - b.x).map(it => it.s).join(' ')).join('\n');
                        const hit = findJobInText(text, openJobs);
                        if (hit) {
                            foundNote = hit.poNumber ? `Found PO ${hit.poNumber} on the PDF.` : `Found job ${hit.code} on the PDF${hit.trade ? ` (trade ${hit.trade})` : ''}.`;
                            setF(x => x.jobId ? x : { ...x, jobId: hit.jobId, poWanted: hit.poNumber, kind: x.kind || (hit.trade && !hit.poNumber ? 'supplier' : '') });
                            loadFor(hit.jobId, hit.trade || tradeOf(i));
                        }
                    }
                    if (!res || res.unreadable || res.unknown || !res.invoices.length) {
                        if (res && res.unreadable) {
                            setReadNote((foundNote ? foundNote + ' ' : '') + 'This PDF has no text (a scan or photo), so fill in the rest from the file.');
                            return;
                        }
                        const g = guessInvoice(pages);
                        setF(x => ({ ...x,
                            invoiceNumber: x.invoiceNumber || g.invoiceNumber,
                            amount: x.amount || (g.amount !== null ? String(g.amount) : ''),
                            invoiceDate: x.invoiceDate || g.invoiceDate, dueDate: x.dueDate || g.dueDate }));
                        const got = [g.invoiceNumber && 'invoice #', g.amount !== null && 'amount', g.invoiceDate && 'bill date'].filter(Boolean);
                        setReadNote((foundNote ? foundNote + ' ' : '')
                            + (got.length ? `Read the ${got.join(', ')} from the PDF: check ${got.length === 1 ? 'it' : 'them'} against the file.` : '')
                            + (!g.invoiceNumber || g.amount === null ? ` Type the ${[!g.invoiceNumber && 'invoice #', g.amount === null && 'amount'].filter(Boolean).join(' and ')} from the file.` : ''));
                        return;
                    }
                    const r0 = res.invoices[0];
                    const onList = names.find(n => n.toLowerCase().includes(res.keyword));
                    setF(x => ({ ...x,
                        kind: x.kind || 'supplier',
                        ...(x.vendorPick || x.vendorOther ? {} : (onList ? { vendorPick: onList, vendorOther: '' } : { vendorPick: OTHER, vendorOther: res.supplier })),
                        invoiceNumber: x.invoiceNumber || r0.invoiceNumber || '',
                        amount: x.amount || (r0.amount !== null && r0.amount !== undefined ? String(r0.amount) : ''),
                        invoiceDate: x.invoiceDate || r0.invoiceDate || '', dueDate: x.dueDate || r0.dueDate || '' }));
                    setReadNote((foundNote ? foundNote + ' ' : '') + `Read as a ${res.supplier} bill. Check every field.` + (res.invoices.length > 1 ? ` This PDF holds ${res.invoices.length} invoices: code the first here, and add the others with Batch upload.` : '')
                        + (r0.note ? ' ' + r0.note : ''));
                } catch (error) {
                    if (opened.current === i.id) setReadNote('Could not read the PDF (' + error.message + '), so fill it in from the file.');
                }
            };
            const openCode = (i) => {
                const h = i.hold || {};
                const jobId = h.jobId && openJobs.some(j => j.id === h.jobId) ? h.jobId : '';
                // A job code + trade on the bill (ABC.123/FRM) means the job's material PO, so it starts as a Supplier bill
                setF({ ...BLANK, kind: i.kind === 'sub' || i.kind === 'supplier' ? i.kind : h.trade ? 'supplier' : '', ...pickName(i.vendor),
                    invoiceNumber: i.invoiceNumber || '', amount: typeof i.amount === 'number' ? String(i.amount) : '',
                    previousPayment: typeof i.previousPayment === 'number' ? String(i.previousPayment) : '',
                    dateReceived: i.dateReceived || todayText(), invoiceDate: i.invoiceDate || '', dueDate: i.dueDate || '',
                    jobId, formId: jobId && h.formId ? h.formId : '' });
                setMsg(null); setReadNote(''); setCodeId(i.id); opened.current = i.id;
                loadFor(jobId, tradeOf(i));
                readStored(i);
            };
            const pickJob = (jobId) => { setF(x => ({ ...x, jobId, formId: '', approverUid: '' })); loadFor(jobId, tradeOf(inv)); };
            const pickKind = (kind) => setF(x => {
                const mats = jdNow && jdNow.pos ? jdNow.pos.filter(isGeneralPO) : [];
                return { ...x, kind, formId: kind === 'supplier' && mats.length ? pickMaterialPO(mats, tradeOf(inv)) : '', previousPayment: kind === 'sub' ? x.previousPayment : '' };
            });
            const closeCode = () => { setCodeId(null); current.current = ''; opened.current = ''; setJd(null); setReadNote(''); };

            const job = f.jobId ? openJobs.find(j => j.id === f.jobId) || null : null;
            const jdNow = jd && jd.jobId === f.jobId ? jd : null;
            const poChoices = jdNow && jdNow.pos ? jdNow.pos.filter(p => f.kind === 'supplier' ? isGeneralPO(p) : f.kind === 'sub' ? !isGeneralPO(p) : false) : [];
            const po = poChoices.find(p => p.id === f.formId) || null;
            const otherTyped = f.vendorOther.trim().replace(/\s+/g, ' ');
            const otherOnList = otherTyped ? names.find(n => n.toLowerCase() === otherTyped.toLowerCase()) : null;
            const vendor = f.kind === 'sub' ? (po ? po.subName : '') : f.vendorPick === OTHER ? (otherOnList || otherTyped) : f.vendorPick;
            const amount = amountOf(f.amount);
            const prevPay = f.previousPayment.trim() ? amountOf(f.previousPayment) : null;
            const approverList = [...(approvers || [])];
            if (jdNow && jdNow.superInfo && !approverList.some(a => a.uid === jdNow.superInfo.uid)) approverList.unshift({ uid: jdNow.superInfo.uid, name: jdNow.superInfo.name || 'Job Super', role: 'super' });
            const approver = approverList.find(a => a.uid === f.approverUid) || null;
            const dupOf = inv && vendor && f.invoiceNumber.trim() && allInvoices
                ? allInvoices.find(i => i.id !== inv.id && i.deleted !== true && dupKeyOf(i.vendor, i.invoiceNumber) === dupKeyOf(vendor, f.invoiceNumber)) : null;
            const problem = !inv ? ''
                : !f.jobId ? 'Pick the job.'
                : !jdNow || jdNow.pos === null ? 'Loading the job...'
                : jdNow.error ? jdNow.error
                : !f.kind ? 'Pick Sub invoice or Supplier bill.'
                : !poChoices.length ? (f.kind === 'supplier' ? 'This job has no material PO (sub name "General Material" or "Various – see scope"). Make one in PO Manager first.' : 'This job has no sub POs in PO Manager yet.')
                : !po ? (f.kind === 'supplier' ? 'Pick the material PO.' : 'Pick the PO.')
                : !vendor ? 'Pick or type the supplier.'
                : !f.invoiceNumber.trim() ? 'Type the invoice #.'
                : !(amount > 0) ? 'Type the amount.'
                : prevPay === null && f.previousPayment.trim() ? 'Previous payment must be an amount, or left blank.'
                : !/^\d{4}-\d{2}-\d{2}$/.test(f.dateReceived) ? 'Pick the date received.'
                : !approver ? 'Pick who approves it.'
                : dupOf ? `Invoice ${dupOf.invoiceNumber} from ${dupOf.vendor} is already in AP on ${dupOf.jobCode || 'the Needs coding list'}. It can't be added twice.` : '';
            let warn = '';
            if (inv && po && amount > 0) {
                if (po.amount === null) warn = 'This PO has no amount, so it can\'t pass until the PO is fixed in PO Manager.';
                else {
                    const used = (allInvoices || []).filter(i => i.id !== inv.id && i.deleted !== true && i.po && i.po.formId === po.id).reduce((t, i) => t + (i.amount || 0), 0);
                    if (used + amount > po.amount + 0.005) warn = `With the invoices already on this PO, it would be over the PO's ${money(po.amount)} by ${money(used + amount - po.amount)}. It can be coded, but it can't pass until a revised PO or a supplement covers it.`;
                }
            }
            const fileName = inv && po && vendor && amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(f.dateReceived) ? buildFileName({ category: po.category, vendor, amount, poNumber: po.poNumber,
                dateReceived: f.dateReceived, file: { name: inv.file ? inv.file.name : '', type: inv.file ? inv.file.type : '' } }) : '';

            const save = async () => {
                if (!inv || problem) return;
                setSaving(true); setMsg(null);
                try {
                    const ref = db.collection('apInvoices').doc(inv.id);
                    const snap = await ref.get();
                    if (!snap.exists || snap.data().needsCoding !== true || snap.data().deleted === true) {
                        setMsg({ text: 'Someone else coded or hid this bill meanwhile.', ok: false }); setSaving(false); return;
                    }
                    const same = sameNameAs(fileName, allInvoices, inv.id);
                    const name = same.length ? withRandom(fileName) : fileName;
                    const now = new Date();
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const next = { kind: f.kind, vendor, invoiceNumber: f.invoiceNumber.trim(), amount, previousPayment: f.kind === 'sub' ? prevPay : null,
                        dateReceived: f.dateReceived, invoiceDate: f.invoiceDate || null, dueDate: f.dueDate || null };
                    const changed = Object.keys(next).filter(k => (inv[k] === undefined ? null : inv[k]) !== next[k]);
                    const batch = db.batch();
                    batch.update(ref, {
                        ...next,
                        jobId: f.jobId, jobCode: job.code,
                        po: { formId: po.id, poNumber: po.poNumber, category: po.category, subName: po.subName },
                        approver: { uid: approver.uid, name: approver.name },
                        needsCoding: false,
                        coded: { at: now, by, holdFileName: inv.file ? inv.file.name : '' },
                        file: { ...(inv.file || {}), name },
                        dupFlag: same.length ? dupFlagFor(same, now) : (inv.dupFlag || null)
                    });
                    batch.set(ref.collection('history').doc(), { action: 'Coded', at: now, by, jobCode: job.code, poNumber: po.poNumber,
                        approver: approver.name, fileName: name, filled: changed, ...(same.length ? { dupFlag: true } : {}) });
                    await batch.commit();
                    closeCode();
                    setMsg({ text: `Bill ${next.invoiceNumber} from ${vendor} coded to ${job.code}, PO ${po.poNumber}. It's now waiting on Production Admin.`
                        + (same.length ? ` Same file name as invoice ${same.map(m => m.invoiceNumber).join(', ')}, so a number was added and it's flagged as a possible duplicate.` : ''), ok: true });
                } catch (error) {
                    setMsg({ text: 'Error saving: ' + error.message, ok: false });
                }
                setSaving(false);
            };

            const total = list.reduce((t, i) => t + (typeof i.amount === 'number' ? i.amount : 0), 0);
            const fromOf = (i) => i.vendor || (i.hold && i.hold.email && (i.hold.email.fromName || i.hold.email.from)) || '';
            return (
                <div className="section">
                    <div className="section-title">Needs coding: bills with no job or PO yet, and bills from email</div>
                    <p className="muted" style={{ marginBottom: '10px' }}>Check or pick the job, PO, name, invoice # and amount for each bill. It then goes to Production Admin like any other invoice. These bills aren't counted on any job or PO until they're coded.</p>
                    {allInvoices === null && <p className="muted">Loading invoices...</p>}
                    {msg && !(inv && !msg.ok) && <div className={msg.ok ? 'ok' : 'error'} style={{ marginBottom: '10px' }}>{msg.text}</div>}
                    {allInvoices && list.length === 0 && <p className="muted">Nothing waiting to be coded.</p>}
                    {list.length > 0 && (
                        <React.Fragment>
                            <div className="list-sum"><span>{list.length} bill{list.length === 1 ? '' : 's'}{total ? ` · ${money(total)} typed so far` : ''}</span></div>
                            <div className="table-wrap"><table>
                                <thead><tr><th>Received</th><th>From</th><th>Invoice #</th><th className="num">Amount</th><th>Found / note</th><th>Saved by</th><th></th></tr></thead>
                                <tbody>{list.map(i => {
                                    const h = i.hold || {};
