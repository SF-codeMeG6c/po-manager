<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Cost - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        .form-group { margin-bottom: 12px; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        .hint { font-size: 11px; color: #888; margin-top: 3px; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-link { background: none; color: #0066cc; padding: 0; font-size: 13px; }
        .btn-link:hover { text-decoration: underline; }
        .error { color: #d32f2f; font-size: 13px; margin-top: 5px; }
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        .radio-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; margin-top: 8px; }
        .radio-line input { width: auto; }
        .info { background: #fff8e1; border: 1px solid #ffe082; border-radius: 4px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 40px; font-size: 14px; }
        .summary div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
        .summary .big { font-weight: 700; font-size: 16px; }
        .gpm-good { color: #2e7d32; }
        .gpm-bad { color: #b71c1c; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f5f5; padding: 8px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        tr.cat td { background: #f1f4f8; font-weight: 700; color: #333; border-top: 2px solid #dde3ea; }
        tr.cat td.name { cursor: pointer; }
        tr.sub td:first-child { padding-left: 22px; }
        tr.total td { font-weight: 700; border-top: 2px solid #333; }
        .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: #eee; color: #333; white-space: nowrap; }
        .tag.CES { background: #e3eefb; color: #0052a3; }
        .tag.Revised { background: #fff3e0; color: #a65c00; }
        .tag.New { background: #fdecea; color: #b71c1c; }
        .tag.Extra { background: #e3f2e5; color: #2e7d32; }
        .tag.Credit { background: #f3e5f5; color: #6a1b9a; }
        .up { color: #b71c1c; }
        .down { color: #2e7d32; }
        .muted { color: #888; font-size: 12px; }
        .nbtn { margin-left: 8px; padding: 1px 8px; font-size: 11px; font-weight: 500; border-radius: 10px; background: #eef2f7; color: #335; border: 1px solid #d5dce6; cursor: pointer; vertical-align: middle; }
        .nbtn:hover { background: #e2e9f3; }
        .nbtn.open { background: #fff3e0; color: #8a4b00; border-color: #f0a020; font-weight: 700; }
        .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; }
        .modal { background: white; border-radius: 8px; padding: 20px; width: 100%; max-width: 640px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
        .msg { border: 1px solid #e6e6e6; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 14px; }
        .msg.q { border-color: #f0a020; background: #fffaf0; }
        .msg.q.done { border-color: #c8e6c9; background: #f6fbf6; }
        .msg.ponote { background: #f7f9fc; border-style: dashed; }
        .msg .who { font-size: 12px; color: #666; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .msg .body { white-space: pre-wrap; color: #222; }
        .msg .acts { margin-top: 6px; display: flex; gap: 12px; }
        .qtag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 8px; background: #f0a020; color: white; }
        .qtag.done { background: #2e7d32; }
        .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; resize: vertical; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-small { padding: 5px 10px; font-size: 13px; }
        .mic.on { background: #d32f2f; color: white; }
        @media (max-width: 700px) { .summary { grid-template-columns: 1fr; } .container { padding: 16px; } body { padding: 8px; } .hide-sm { display: none; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Job Cost</h1>
        <p class="subtitle">Freeman Restoration running job cost and GPM after CES signing</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Same Firebase project as the other tools
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Everyone with rights sees Job Cost (decided Oct 27). Supers see only their assigned jobs.
        const JOBCOST_ROLES = ['owner', 'admin', 'estimator', 'super', 'office'];

        // Company-wide rates, same as GPM
        const IN_HOUSE_LABOR_PCT = 0.135;
        const TARGET_GPM = 0.28;

        const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
        const toNumber = (t) => {
            if (typeof t === 'number') return isNaN(t) ? 0 : t;
            const s = String(t ?? '').replace(/[^0-9.]/g, '');
            if (!s) return 0;
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        };
        const fmtMoney = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const $ = (n) => { const v = round2(n) || 0; return v < 0 ? '($' + fmtMoney(-v) + ')' : '$' + fmtMoney(v); };
        const pct = (n) => (n * 100).toFixed(1) + '%';
        const catKey = (c) => String(c || '').trim().toUpperCase() || '(no Cat)';
        const fmtDate = (t) => { try { const d = t && t.toDate ? t.toDate() : (t ? new Date(t) : null); return d ? `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}` : ''; } catch (e) { return ''; } };

        // ---------- All Job Cost math in one place (decided Oct 25-27) ----------
        // Starts from the GPM CES lock. One row per PO; extra lines with no PO and credits get their own rows; a subtotal per Cat.
        //  - PO rows: Original = the PO's amount in the CES lock (0 for POs made after it). Current = today's PO Manager amount.
        //    POs left out of the CES GPM (excluded) stay left out. Hidden POs are skipped (current 0).
        //    A CES PO not yet in PO Manager (before the handoff) keeps its locked amount.
        //  - Extras: Signed Customer/Supplement = income (Total Extra) + cost; Work Done Customer Refused = cost only;
        //    Internal Approved = cost only; Draft, Sent, Void = nothing.
        //    Lines on a PO count through that Extra PO's row. Lines with no PO count at their cost (Trade budget and We absorb).
        //  - Credits: trade budget down by the saved amount per Cat (60%, or 100% for allowance lines); income down by credits less PA fee.
        //  - Selling price = CES selling price + signed extras - credits less PA fee. In-house labor = 13.5% of the selling price.
        const COUNTING = { customer: ['Signed', 'Customer refused'], supplement: ['Signed', 'Customer refused'], internal: ['Approved'] };
        const extraType = (x) => ['supplement', 'internal'].includes(x.type) ? x.type : (x.payBy === 'supplement' ? 'supplement' : 'customer');
        const extraCounts = (x) => (COUNTING[extraType(x)] || []).includes(x.status);
        const extraIncome = (x) => extraType(x) !== 'internal' && x.status === 'Signed' ? toNumber(x.total) : 0;

        const buildJobCost = ({ lock, forms, extras, credits }) => {
            if (!lock) return null;
            const excluded = new Set(lock.excludedPoIds || []);
            const lockedPos = (lock.pos || []).filter(p => !excluded.has(p.id));
            const lockedById = {};
            lockedPos.forEach(p => { lockedById[p.id] = p; });
            const formsById = {};
            (forms || []).forEach(f => { formsById[f.id] = f; });
            const rows = [];
            const left = [];

            // POs in PO Manager
            (forms || []).forEach(f => {
                if (excluded.has(f.id)) { if (f.deleted !== true) left.push(f.poNumber || f.id); return; }
                const lp = lockedById[f.id];
                if (f.deleted === true && !lp) return; // hidden and never in the CES: skip
                const original = lp ? toNumber(lp.amount) : 0;
                const current = f.deleted === true ? 0 : toNumber(f.contractAmount);
                const status = f.status === 'Extra' ? 'Extra' : f.status === 'Revised' ? 'Revised' : lp ? 'CES' : 'New';
                rows.push({ key: 'po-' + f.id, kind: 'po', id: f.id, cat: catKey(f.category || (lp && lp.category)), poNumber: f.poNumber || (lp && lp.poNumber) || '',
                            vendor: f.subName || (lp && lp.subName) || '', status, original, current,
                            note: f.deleted === true ? 'Hidden in PO Manager' : (f.fromExtra ? `From Extra #${f.fromExtra.number}` : '') });
            });
            // CES POs not in PO Manager yet (locked before the handoff)
            lockedPos.forEach(p => {
                if (formsById[p.id]) return;
                rows.push({ key: 'po-' + p.id, kind: 'po', id: p.id, cat: catKey(p.category), poNumber: p.poNumber || '', vendor: p.subName || '',
                            status: 'CES', original: toNumber(p.amount), current: toNumber(p.amount), note: 'Not in PO Manager yet' });
            });

            // Extras: lines with no PO
            let extrasIncome = 0;
            const counted = [];
            (extras || []).forEach(x => {
                if (!extraCounts(x)) return;
                counted.push(x);
                extrasIncome += extraIncome(x);
                (x.lines || []).forEach((l, i) => {
                    if (l.po && l.po.formId) return; // counted through its PO's row
                    const cost = toNumber(l.cost);
                    if (!cost) return;
                    const absorb = l.use === 'absorb';
                    rows.push({ key: `ex-${x.id}-${i}`, kind: 'extra', cat: catKey(l.cat), poNumber: '', vendor: l.vendor || '',
                                status: 'Extra', label: `Extra #${x.number} – ${absorb ? 'we absorb' : l.use === 'po' ? 'PO not made yet' : 'budget'}`,
                                original: 0, current: cost, note: [l.description, x.status === 'Customer refused' ? 'Customer refused' : '', extraType(x) === 'internal' ? 'Internal' : ''].filter(Boolean).join(' · ') });
                });
            });

            // Credits, one row per Cat
            const byCat = (credits && credits.budgetByCat) || {};
            Object.keys(byCat).forEach(c => {
                const amt = toNumber(byCat[c]);
                if (!amt) return;
                rows.push({ key: 'cr-' + c, kind: 'credit', cat: catKey(c), poNumber: '', vendor: '', status: 'Credit', label: 'Credits',
                            original: 0, current: -amt, note: '' });
            });

            // Group by Cat, rows in PO number order, then extras, then credits
            const order = { po: 0, extra: 1, credit: 2 };
            rows.sort((a, b) => a.cat.localeCompare(b.cat) || order[a.kind] - order[b.kind] || String(a.poNumber).localeCompare(String(b.poNumber)) || String(a.label || '').localeCompare(String(b.label || '')));
            const cats = [];
            rows.forEach(r => {
                let c = cats[cats.length - 1];
                if (!c || c.cat !== r.cat) { c = { cat: r.cat, rows: [], original: 0, current: 0 }; cats.push(c); }
                c.rows.push(r); c.original += r.original; c.current += r.current;
            });
            cats.forEach(c => { c.original = round2(c.original); c.current = round2(c.current); });

            const originalBudget = round2(rows.reduce((a, r) => a + r.original, 0));
            const revisedBudget = round2(rows.reduce((a, r) => a + r.current, 0));
            const res = lock.results || {};
            const cesSelling = toNumber(res.sellingPrice);
            const creditsLessPA = toNumber(credits && credits.lessPA);
            const sellingPrice = round2(cesSelling + extrasIncome - creditsLessPA);
            const inHouseLabor = round2(sellingPrice * IN_HOUSE_LABOR_PCT);
            const jobCost = round2(revisedBudget + inHouseLabor);
            const grossProfit = round2(sellingPrice - jobCost);
            const gpm = sellingPrice ? grossProfit / sellingPrice : 0;
            return { cats, rows, left, counted, cesSelling, extrasIncome: round2(extrasIncome), creditsLessPA, sellingPrice,
                     originalBudget, revisedBudget, inHouseLabor, jobCost, grossProfit, gpm,
                     cesGpm: typeof res.gpm === 'number' ? res.gpm : null, cesPoTotal: toNumber(res.poTotal) };
        };

        // ---------- Notes (Job Cost step 2, decided Oct 27) ----------
        // A conversation per PO and per Cat, in a pop-up so the table stays clean. Records: jobCost/{jobId}/messages/{id}
        // { thread: 'po:{formId}' or 'cat:{CAT}', text, question, answered, answeredBy, answeredAt, createdBy {uid, name, role}, createdAt, editedAt, editedBy }.
        // Owner, Admin, Estimator and Super post; Office reads only. Any message can be a Question; Owner, Admin or the job's Super
        // marks it Answered (and can reopen it). No deletes; the author can edit for 24 hours and the old text is kept in messages/{id}/versions.
        const NOTE_POST_ROLES = ['owner', 'admin', 'estimator', 'super'];
        const NOTE_ANSWER_ROLES = ['owner', 'admin', 'super'];
        const ROLE_NAMES = { owner: 'Owner', admin: 'Admin', estimator: 'Estimator', super: 'Super', office: 'Office' };
        const EDIT_HOURS = 24;
        const tsMillis = (t) => { try { return t && t.toMillis ? t.toMillis() : (t && t.toDate ? t.toDate().getTime() : (t ? new Date(t).getTime() : 0)); } catch (e) { return 0; } };
        const fmtWhen = (t) => { const ms = tsMillis(t); if (!ms) return ''; const d = new Date(ms); return d.toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' }); };
        const threadStats = (messages, thread) => {
            const list = (messages || []).filter(m => m.thread === thread);
            return { count: list.length, open: list.filter(m => m.question && !m.answered).length };
        };
        function NotesButton({ messages, thread, onOpen }) {
            const st = threadStats(messages, thread);
            return (
                <button type="button" className={'nbtn' + (st.open ? ' open' : '')} onClick={e => { e.stopPropagation(); onOpen(); }}
                    title={st.open ? `${st.open} open question${st.open === 1 ? '' : 's'}` : 'Notes'}>
                    {st.open ? `? ${st.open} open` : `Notes${st.count ? ' (' + st.count + ')' : ''}`}
                </button>
            );
        }

        function NotesModal({ jobId, thread, title, poNotes, messages, profile, onClose }) {
            const [text, setText] = useState('');
            const [asQuestion, setAsQuestion] = useState(false);
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const [editId, setEditId] = useState(null);
            const [editText, setEditText] = useState('');
            const [listening, setListening] = useState(false);
            const recRef = React.useRef(null);
            const canPost = NOTE_POST_ROLES.includes(profile.role);
            const canAnswer = NOTE_ANSWER_ROLES.includes(profile.role);
            const me = { uid: profile.uid, name: profile.name || '', role: profile.role };
            const list = (messages || []).filter(m => m.thread === thread).sort((a, b) => tsMillis(a.createdAt) - tsMillis(b.createdAt));
            const col = db.collection('jobCost').doc(jobId).collection('messages');
            const stopVoice = () => { if (recRef.current) { try { recRef.current.stop(); } catch (e) { } recRef.current = null; } setListening(false); };
            useEffect(() => () => stopVoice(), []);
            const toggleVoice = () => {
                if (listening) { stopVoice(); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setErr('Voice works in Chrome or Edge.'); return; }
                const rec = new SR();
                rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = false;
                rec.onresult = (e) => {
                    let said = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) said += e.results[i][0].transcript;
                    said = said.trim();
                    if (said) setText(t => (t && !/\s$/.test(t) ? t + ' ' : t) + said.charAt(0).toUpperCase() + said.slice(1));
                };
                rec.onend = () => { recRef.current = null; setListening(false); };
                rec.onerror = () => { recRef.current = null; setListening(false); };
                recRef.current = rec; rec.start(); setListening(true); setErr('');
            };
            const post = async () => {
                const t = text.trim();
                if (!t) return;
                stopVoice(); setBusy(true); setErr('');
                try {
                    await col.add({ thread, text: t, question: asQuestion, answered: false, createdBy: me, createdAt: new Date() });
                    setText(''); setAsQuestion(false);
                } catch (e) { setErr('Could not post: ' + e.message); }
                setBusy(false);
            };
            const saveEdit = async (m) => {
                const t = editText.trim();
                if (!t || t === m.text) { setEditId(null); return; }
                setBusy(true); setErr('');
                try {
                    const now = new Date();
                    await col.doc(m.id).collection('versions').add({ text: m.text, question: !!m.question, savedAt: m.editedAt || m.createdAt || null, replacedAt: now, replacedBy: me });
                    await col.doc(m.id).update({ text: t, editedAt: now, editedBy: me });
                    setEditId(null);
                } catch (e) { setErr('Could not save the edit: ' + e.message); }
                setBusy(false);
            };
            const setAnswered = async (m, answered) => {
                setBusy(true); setErr('');
                try { await col.doc(m.id).update({ answered, answeredBy: me, answeredAt: new Date() }); }
                catch (e) { setErr('Could not save: ' + e.message); }
                setBusy(false);
            };
            const close = () => {
                if (text.trim() && !window.confirm('Close and drop the note you typed?')) return;
                stopVoice(); onClose();
            };
            return (
                <div className="modal-back" onClick={close}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 10 }}>
                            <div style={{ fontWeight: 700, fontSize: 16 }}>Notes · {title}</div>
                            <button className="btn-link" onClick={close}>Close</button>
                        </div>
                        <div className="muted" style={{ margin: '4px 0 12px' }}>{list.length} message{list.length === 1 ? '' : 's'}{list.filter(m => m.question && !m.answered).length ? ` · ${list.filter(m => m.question && !m.answered).length} open question${list.filter(m => m.question && !m.answered).length === 1 ? '' : 's'}` : ''}</div>
                        {poNotes && (
                            <div className="msg ponote">
                                <div className="who">PO note (from Trades-EST / PO Manager)</div>
                                <div className="body">{poNotes}</div>
                            </div>
                        )}
                        {list.length === 0 && !poNotes && <p className="muted">No notes yet.</p>}
                        {list.map(m => {
                            const mine = m.createdBy && m.createdBy.uid === profile.uid;
                            const canEdit = canPost && mine && (Date.now() - tsMillis(m.createdAt)) < EDIT_HOURS * 3600000;
                            return (
                                <div key={m.id} className={'msg' + (m.question ? ' q' : '') + (m.question && m.answered ? ' done' : '')}>
                                    <div className="who">
                                        <b style={{ color: '#333' }}>{m.createdBy ? m.createdBy.name : ''}</b>
                                        <span>({ROLE_NAMES[m.createdBy && m.createdBy.role] || ''})</span>
                                        <span>{fmtWhen(m.createdAt)}</span>
                                        {m.editedAt && <span>· edited {fmtWhen(m.editedAt)}</span>}
                                        {m.question && <span className={'qtag' + (m.answered ? ' done' : '')}>{m.answered ? 'Answered' : 'Question'}</span>}
                                        {m.question && m.answered && m.answeredBy && <span>by {m.answeredBy.name} {fmtWhen(m.answeredAt)}</span>}
                                    </div>
                                    {editId === m.id ? (
                                        <div>
                                            <textarea rows={3} value={editText} onChange={e => setEditText(e.target.value)} />
                                            <div className="acts">
                                                <button className="btn-primary btn-small" disabled={busy} onClick={() => saveEdit(m)}>Save</button>
                                                <button className="btn-link" onClick={() => setEditId(null)}>Cancel</button>
                                            </div>
                                        </div>
                                    ) : <div className="body">{m.text}</div>}
                                    {editId !== m.id && (canEdit || (m.question && canAnswer)) && (
                                        <div className="acts">
                                            {canEdit && <button className="btn-link" onClick={() => { setEditId(m.id); setEditText(m.text); }}>Edit</button>}
                                            {m.question && canAnswer && (m.answered
                                                ? <button className="btn-link" disabled={busy} onClick={() => setAnswered(m, false)}>Reopen question</button>
                                                : <button className="btn-link" disabled={busy} onClick={() => setAnswered(m, true)}>Mark answered</button>)}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        {canPost ? (
                            <div style={{ marginTop: 12 }}>
                                <textarea rows={3} value={text} placeholder="Type a note, or use Voice..." onChange={e => setText(e.target.value)} />
                                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 8, flexWrap: 'wrap' }}>
                                    <button type="button" className={'btn-secondary btn-small mic' + (listening ? ' on' : '')} onClick={toggleVoice}>{listening ? '■ Stop' : '🎤 Voice'}</button>
                                    <label className="radio-line" style={{ marginTop: 0 }}>
                                        <input type="checkbox" checked={asQuestion} onChange={e => setAsQuestion(e.target.checked)} /> This is a question
                                    </label>
                                    <div style={{ flex: 1 }} />
                                    <button className="btn-primary btn-small" disabled={busy || !text.trim()} onClick={post}>{busy ? 'Saving...' : 'Post'}</button>
                                </div>
                            </div>
                        ) : <p className="muted" style={{ marginTop: 10 }}>Office can read notes. Posting is for Owner, Admin, Estimator and Super.</p>}
                        {err && <div className="error">{err}</div>}
                        <div className="hint" style={{ marginTop: 8 }}>Notes can't be deleted. You can edit your own note for {EDIT_HOURS} hours; the earlier text is kept.</div>
                    </div>
                </div>
            );
        }

        // Before the CES lock (decided Oct 27): show the POs already in PO Manager, such as TMP and DMO #1 POs handed off early.
        // No GPM yet: that starts from the CES lock.
        const buildEarly = (forms) => {
            const cats = [];
            const byCat = {};
            (forms || []).filter(f => f.deleted !== true).forEach(f => {
                const cat = catKey(f.category);
                if (!byCat[cat]) { byCat[cat] = { cat, rows: [], current: 0 }; cats.push(byCat[cat]); }
                const current = toNumber(f.contractAmount);
                byCat[cat].rows.push({ key: 'po-' + f.id, id: f.id, poNumber: f.poNumber || '', vendor: f.subName || '', status: f.status || 'New', current,
                                       note: f.fromTradesEst && f.fromTradesEst.early ? 'Handed off early from Trades-EST' : '' });
                byCat[cat].current += current;
            });
            cats.sort((a, b) => a.cat.localeCompare(b.cat));
            cats.forEach(c => { c.current = round2(c.current); c.rows.sort((a, b) => String(a.poNumber).localeCompare(String(b.poNumber))); });
            return { cats, total: round2(cats.reduce((t, c) => t + c.current, 0)) };
        };

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, 'pending', false = not set up, object = active user
            const [authError, setAuthError] = useState('');
            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [lock, setLock] = useState(null);       // undefined = no lock, null = loading
            const [forms, setForms] = useState(null);
            const [extras, setExtras] = useState(null);
            const [credits, setCredits] = useState(null);
            const [errors, setErrors] = useState({});
            const [open, setOpen] = useState({});         // Cat -> true when its PO rows are shown
            const [messages, setMessages] = useState([]); // the job's notes (jobCost/{jobId}/messages)
            const [notesFor, setNotesFor] = useState(null); // { thread, title, poNotes } while the Notes pop-up is open

            useEffect(() => {
                auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) { setJobs([]); setJobId(''); return; }
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        if (snap.exists && snap.data().active === true) setProfile({ uid: currentUser.uid, ...snap.data() });
                        else if (snap.exists && snap.data().role === 'pending') setProfile('pending');
                        else setProfile(false);
                    } catch (e) { setProfile(false); }
                });
            }, []);

            const allowed = !!profile && typeof profile === 'object' && JOBCOST_ROLES.includes(profile.role);
            const setErr = (k, m) => setErrors(e => ({ ...e, [k]: m }));

            // Job list: all jobs, or only assigned jobs for Supers
            useEffect(() => {
                if (!allowed) return;
                let q = db.collection('jobs');
                if (profile.role === 'super') q = q.where('assignedSupers', 'array-contains', profile.uid);
                return q.onSnapshot(snap => {
                    const list = [];
                    snap.forEach(doc => { const d = doc.data(); list.push({ id: doc.id, code: d.code || '', address: d.address || '', archived: d.archived === true }); });
                    list.sort((a, b) => a.code.localeCompare(b.code));
                    setJobs(list);
                }, err => setErr('jobs', 'Error loading jobs: ' + err.message));
            }, [allowed]);

            // Open from a link with ?job=ID
            const urlDone = React.useRef(false);
            useEffect(() => {
                if (urlDone.current || !jobs.length) return;
                urlDone.current = true;
                const id = new URLSearchParams(window.location.search).get('job');
                if (id && jobs.some(j => j.id === id)) setJobId(id);
            }, [jobs]);

            // The picked job's records, all live and read-only
            useEffect(() => {
                setLock(null); setForms(null); setExtras(null); setCredits(null); setErrors({}); setOpen({}); setMessages([]); setNotesFor(null);
                if (!allowed || !jobId) return;
                const fail = (k, what) => (err) => setErr(k, `Can't read ${what}: ${err.message}`);
                const u1 = db.collection('gpm').doc(jobId).onSnapshot(doc => {
                    const l = doc.exists ? doc.data().cesLock : null;
                    setLock(l && l.locked ? l : undefined);
                }, (err) => { setLock(undefined); fail('lock', 'the GPM CES lock')(err); });
                const u2 = db.collection('jobs').doc(jobId).collection('forms').onSnapshot(snap => {
                    const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() })); setForms(list);
                }, (err) => { setForms([]); fail('forms', 'the POs')(err); });
                const u3 = db.collection('extras').doc(jobId).collection('items').onSnapshot(snap => {
                    const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() })); setExtras(list);
                }, (err) => { setExtras([]); fail('extras', 'the extras')(err); });
                const u4 = db.collection('extras').doc(jobId).collection('credits').doc('list').onSnapshot(doc => {
                    setCredits(doc.exists ? doc.data() : {});
                }, (err) => { setCredits({}); fail('credits', 'the credits')(err); });
                const u5 = db.collection('jobCost').doc(jobId).collection('messages').onSnapshot(snap => {
                    const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() })); setMessages(list);
                }, (err) => { setMessages([]); fail('notes', 'the notes')(err); });
                return () => { u1(); u2(); u3(); u4(); u5(); };
            }, [allowed, jobId]);

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) { setAuthError(e.message); }
            };

            // ---------- Screens ----------
            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">LOGIN</div>
                        <button className="btn-primary" style={{ width: '100%' }} onClick={login}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }
            if (profile === null) return <div className="section">Loading...</div>;
            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">WAITING FOR APPROVAL</div>
                        <p>Your account is waiting for approval. An admin will set up your access.</p>
                    </div>
                );
            }
            if (profile === false || !allowed) {
                return (
                    <div className="section">
                        <div className="section-title">JOB COST</div>
                        <p>No access. Contact an admin.</p>
                    </div>
                );
            }

            const visibleJobs = jobs.filter(j => showArchived || !j.archived || j.id === jobId);
            const loading = jobId && (lock === null || forms === null || extras === null || credits === null);
            const jc = !loading && lock ? buildJobCost({ lock, forms, extras, credits }) : null;
            const errList = Object.values(errors).filter(Boolean);
            const allOpen = jc && jc.cats.length > 0 && jc.cats.every(c => open[c.cat]);
            const openQuestions = messages.filter(m => m.question && !m.answered).length;
            const formOf = (id) => (forms || []).find(f => f.id === id);
            const openPoNotes = (r) => { const f = formOf(r.id); setNotesFor({ thread: 'po:' + r.id, title: `PO ${r.poNumber}${r.vendor ? ' · ' + r.vendor : ''}`, poNotes: (f && f.notes) || '' }); };
            const openCatNotes = (cat) => setNotesFor({ thread: 'cat:' + cat, title: `${cat} (whole trade)`, poNotes: '' });
            const qLine = openQuestions > 0 && <div className="info" style={{ background: '#fff3e0', borderColor: '#f0a020' }}><b>Open questions: {openQuestions}</b> · look for the orange "? open" buttons.</div>;
            const chg = (n) => { const v = round2(n); return v === 0 ? <span className="muted">–</span> : <span className={v > 0 ? 'up' : 'down'}>{v > 0 ? '+' : ''}{$(v)}</span>; };

            return (
                <div>
                    <div className="section">
                        <div className="section-title">JOB</div>
                        <div className="form-group">
                            <select value={jobId} onChange={e => setJobId(e.target.value)}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code}{j.address ? ' - ' + j.address : ''}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                            <label className="radio-line">
                                <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} />
                                Show archived jobs
                            </label>
                        </div>
                        {errList.map((m, i) => <div key={i} className="error">{m}</div>)}
                    </div>

                    {jobId && loading && <div className="section"><p>Loading...</p></div>}

                    {jobId && !loading && !lock && !errors.lock && (() => {
                        const early = buildEarly(forms);
                        const allOpenEarly = early.cats.length > 0 && early.cats.every(c => open[c.cat]);
                        return (
                            <div className="section">
                                <div className="info">CES not locked yet. Showing POs issued so far. GPM shows once the CES is locked in GPM.</div>
                                {qLine}
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
                                    <div className="section-title" style={{ marginBottom: 0 }}>POS ISSUED BEFORE THE CES</div>
                                    {early.cats.length > 0 && (
                                        <button className="btn-link" onClick={() => setOpen(allOpenEarly ? {} : Object.fromEntries(early.cats.map(c => [c.cat, true])))}>
                                            {allOpenEarly ? 'Close all' : 'Open all'}
                                        </button>
                                    )}
                                </div>
                                {early.cats.length === 0 ? <p>No POs in PO Manager yet.</p> : (
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Cat / PO</th>
                                                <th className="hide-sm">Vendor</th>
                                                <th>Status</th>
                                                <th className="num">Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {early.cats.map(c => (
                                                <React.Fragment key={c.cat}>
                                                    <tr className="cat">
                                                        <td className="name" colSpan={3} onClick={() => setOpen(o => ({ ...o, [c.cat]: !o[c.cat] }))}>
                                                            {open[c.cat] ? '▾' : '▸'} {c.cat} <span className="muted" style={{ fontWeight: 400 }}>({c.rows.length} {c.rows.length === 1 ? 'PO' : 'POs'})</span>
                                                            <NotesButton messages={messages} thread={'cat:' + c.cat} onOpen={() => openCatNotes(c.cat)} />
                                                        </td>
                                                        <td className="num">{$(c.current)}</td>
                                                    </tr>
                                                    {open[c.cat] && c.rows.map(r => (
                                                        <tr key={r.key} className="sub">
                                                            <td><b>PO {r.poNumber}</b><NotesButton messages={messages} thread={'po:' + r.id} onOpen={() => openPoNotes(r)} />{r.note && <div className="muted">{r.note}</div>}</td>
                                                            <td className="hide-sm">{r.vendor}</td>
                                                            <td><span className={'tag ' + r.status}>{r.status}</span></td>
                                                            <td className="num">{$(r.current)}</td>
                                                        </tr>
                                                    ))}
                                                </React.Fragment>
                                            ))}
                                            <tr className="total">
                                                <td colSpan={3}>All POs</td>
                                                <td className="num">{$(early.total)}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                )}
                                <div className="hint" style={{ marginTop: 6 }}>Hidden POs are left out. Click a trade to see its POs.</div>
                            </div>
                        );
                    })()}

                    {jc && (
                        <div className="section">
                            {qLine}
                            <div className="section-title">RUNNING GPM</div>
                            <div className="muted" style={{ marginBottom: 10 }}>From the CES locked {fmtDate(lock.at)}{lock.by && lock.by.name ? ' by ' + lock.by.name : ''}, plus extras, credits and PO changes since.</div>
                            <div className="summary">
                                <div><span>CES selling price</span><span>{$(jc.cesSelling)}</span></div>
                                <div><span>Original budget (CES POs)</span><span>{$(jc.originalBudget)}</span></div>
                                <div><span>+ Signed extras</span><span>{$(jc.extrasIncome)}</span></div>
                                <div><span>Revised budget</span><span>{$(jc.revisedBudget)}</span></div>
                                <div><span>− Credits less PA fee</span><span>({$(jc.creditsLessPA)})</span></div>
                                <div><span>In-house labor ({pct(IN_HOUSE_LABOR_PCT)} of selling price)</span><span>{$(jc.inHouseLabor)}</span></div>
                                <div className="big"><span>Selling price</span><span>{$(jc.sellingPrice)}</span></div>
                                <div className="big"><span>Job cost</span><span>{$(jc.jobCost)}</span></div>
                                <div><span>Gross profit</span><span>{$(jc.grossProfit)}</span></div>
                                <div className="big"><span>GPM now</span><span className={jc.gpm >= TARGET_GPM ? 'gpm-good' : 'gpm-bad'}>{pct(jc.gpm)}</span></div>
                                <div><span>Target</span><span>{pct(TARGET_GPM)}</span></div>
                                <div><span>GPM at CES lock</span><span>{jc.cesGpm === null ? '–' : pct(jc.cesGpm)}</span></div>
                            </div>
                            {Math.abs(jc.originalBudget - jc.cesPoTotal) > 0.01 && (
                                <div className="info" style={{ marginTop: 12 }}>Original budget {$(jc.originalBudget)} doesn't match the CES lock's PO total {$(jc.cesPoTotal)}.</div>
                            )}
                        </div>
                    )}

                    {jc && (
                        <div className="section">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
                                <div className="section-title" style={{ marginBottom: 0 }}>TRADE BUDGETS</div>
                                {jc.cats.length > 0 && (
                                    <button className="btn-link" onClick={() => setOpen(allOpen ? {} : Object.fromEntries(jc.cats.map(c => [c.cat, true])))}>
                                        {allOpen ? 'Close all' : 'Open all'}
                                    </button>
                                )}
                            </div>
                            {jc.cats.length === 0 ? <p>No POs on this job.</p> : (
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Cat / PO</th>
                                            <th className="hide-sm">Vendor</th>
                                            <th>Status</th>
                                            <th className="num">Original</th>
                                            <th className="num">Current</th>
                                            <th className="num">Change</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {jc.cats.map(c => (
                                            <React.Fragment key={c.cat}>
                                                <tr className="cat">
                                                    <td className="name" colSpan={3} onClick={() => setOpen(o => ({ ...o, [c.cat]: !o[c.cat] }))}>
                                                        {open[c.cat] ? '▾' : '▸'} {c.cat} <span className="muted" style={{ fontWeight: 400 }}>({c.rows.length} {c.rows.length === 1 ? 'line' : 'lines'})</span>
                                                        <NotesButton messages={messages} thread={'cat:' + c.cat} onOpen={() => openCatNotes(c.cat)} />
                                                    </td>
                                                    <td className="num">{$(c.original)}</td>
                                                    <td className="num">{$(c.current)}</td>
                                                    <td className="num">{chg(c.current - c.original)}</td>
                                                </tr>
                                                {open[c.cat] && c.rows.map(r => (
                                                    <tr key={r.key} className="sub">
                                                        <td>
                                                            {r.kind === 'po' ? <><b>PO {r.poNumber}</b><NotesButton messages={messages} thread={'po:' + r.id} onOpen={() => openPoNotes(r)} /></> : r.label}
                                                            {r.note && <div className="muted">{r.note}</div>}
                                                        </td>
                                                        <td className="hide-sm">{r.vendor}</td>
                                                        <td><span className={'tag ' + r.status}>{r.status}</span></td>
                                                        <td className="num">{$(r.original)}</td>
                                                        <td className="num">{$(r.current)}</td>
                                                        <td className="num">{chg(r.current - r.original)}</td>
                                                    </tr>
                                                ))}
                                            </React.Fragment>
                                        ))}
                                        <tr className="total">
                                            <td colSpan={3}>All trades</td>
                                            <td className="num">{$(jc.originalBudget)}</td>
                                            <td className="num">{$(jc.revisedBudget)}</td>
                                            <td className="num">{chg(jc.revisedBudget - jc.originalBudget)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            )}
                            {jc.left.length > 0 && <div className="hint" style={{ marginTop: 8 }}>Left out, as in the CES GPM: PO {jc.left.join(', ')}.</div>}
                            <div className="hint" style={{ marginTop: 6 }}>Click a trade to see its POs, extra lines with no PO, and credits. Status: CES = in the CES lock, Revised = changed by the Super, New = made after the CES, Extra = from Extras &amp; Credits. Notes: one conversation per PO, and one per trade for extras and credits.</div>
                        </div>
                    )}

                    {notesFor && jobId && (
                        <NotesModal jobId={jobId} thread={notesFor.thread} title={notesFor.title} poNotes={notesFor.poNotes}
                            messages={messages} profile={profile} onClose={() => setNotesFor(null)} />
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
