<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Manager - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-secondary:disabled { background: #e0e0e0; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 6px 10px; font-size: 12px; margin-right: 4px; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        .success { color: #388e3c; font-size: 12px; margin-top: 5px; }
        
        /* Table styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { background: #f5f5f5; padding: 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #fafafa; }
        .status-badge { padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 500; }
        .status-completed { background: #c8e6c9; color: #2e7d32; }
        .status-in-progress { background: #fff9c4; color: #f57f17; }
        
        /* Upload area */
        .upload-area { border: 2px dashed #ccc; border-radius: 4px; padding: 20px; text-align: center; margin: 15px 0; background: #fafafa; }
        .upload-area:hover { border-color: #0066cc; background: #f0f8ff; }
        .upload-area.active { border-color: #0066cc; background: #f0f8ff; }
        .upload-area input[type="file"] { display: none; }
        
        /* Button group */
        .button-group { display: flex; gap: 8px; margin-top: 8px; }
        .button-group button { margin: 0; }
        
        /* Edit row styles */
        .edit-row input, .edit-row select, .edit-row textarea { width: 100%; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PO Manager</h1>
        <p class="subtitle">Freeman Restoration Subcontractor Scope of Work</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PDFDocument, rgb } = PDFLib;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        function POApp() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login');
            
            const [jobCode, setJobCode] = useState('');
            const [jobAddress, setJobAddress] = useState('');
            const [cityStateZip, setCityStateZip] = useState('');
            const [lockBox, setLockBox] = useState('');
            const [superName, setSuperName] = useState('');
            const [superPhone, setSuperPhone] = useState('');
            const [superEmail, setSuperEmail] = useState('');
            const [currentJobId, setCurrentJobId] = useState('');
            
            const [currentPO, setCurrentPO] = useState('');
            const [message, setMessage] = useState('');
            const [jobLibrary, setJobLibrary] = useState([]);
            const [supervisorLibrary, setSupervisorLibrary] = useState([]);
            const [selectedJobIndex, setSelectedJobIndex] = useState('');
            const [selectedSupervisorIndex, setSelectedSupervisorIndex] = useState('');

            // Form tracking state
            const [selectedPDF, setSelectedPDF] = useState(null);
            const [uploadLoading, setUploadLoading] = useState(false);
            const [jobForms, setJobForms] = useState([]);
            const [editingFormId, setEditingFormId] = useState(null);
            const [editFormData, setEditFormData] = useState({});

            useEffect(() => {
                auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    if (currentUser) {
                        loadDefaults(currentUser.uid);
                    }
                });
            }, []);

            const loadDefaults = (uid) => {
                db.collection('poManagerData').doc(uid).onSnapshot(doc => {
                    if (doc.exists) {
                        if (doc.data().jobLibrary) {
                            setJobLibrary(doc.data().jobLibrary);
                        }
                        if (doc.data().supervisorLibrary) {
                            setSupervisorLibrary(doc.data().supervisorLibrary);
                        }
                    }
                });
            };

            const loadJobForms = (jobId) => {
                if (!user) return;
                db.collection('jobs').doc(jobId).collection('forms').orderBy('dateCreated', 'desc').onSnapshot(snapshot => {
                    const forms = [];
                    snapshot.forEach(doc => {
                        forms.push({ id: doc.id, ...doc.data() });
                    });
                    setJobForms(forms);
                });
            };

            const handleLogin = async () => {
                setAuthError('');
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleSignUp = async () => {
                setAuthError('');
                try {
                    await auth.createUserWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                    setAuthMode('login');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                setJobCode('');
                setJobAddress('');
                setCityStateZip('');
                setLockBox('');
                setSuperName('');
                setSuperPhone('');
                setSuperEmail('');
                setCurrentPO('');
                setCurrentJobId('');
                setJobLibrary([]);
                setSupervisorLibrary([]);
                setSelectedJobIndex('');
                setSelectedSupervisorIndex('');
                setJobForms([]);
            };

            const handleSaveJob = async () => {
                if (!user || !jobCode) {
                    setMessage('Job Code required');
                    return;
                }
                try {
                    const newJob = { code: jobCode, address: jobAddress, cityStateZip, lockBox };
                    const updatedJobs = [...jobLibrary, newJob];
                    await db.collection('poManagerData').doc(user.uid).set(
                        { jobLibrary: updatedJobs },
                        { merge: true }
                    );
                    
                    // Create job document in jobs collection for forms subcollection
                    const jobDocRef = await db.collection('jobs').add({
                        userId: user.uid,
                        code: jobCode,
                        address: jobAddress,
                        cityStateZip,
                        lockBox,
                        dateCreated: new Date()
                    });
                    
                    setMessage('Job saved');
                    setJobCode('');
                    setJobAddress('');
                    setCityStateZip('');
                    setLockBox('');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleSelectJob = (job) => {
                setJobCode(job.code);
                setJobAddress(job.address);
                setCityStateZip(job.cityStateZip);
                setLockBox(job.lockBox);
                // Find the job document ID and load forms
                db.collection('jobs').where('userId', '==', user.uid).where('code', '==', job.code).limit(1).get().then(snapshot => {
                    if (!snapshot.empty) {
                        const jobId = snapshot.docs[0].id;
                        setCurrentJobId(jobId);
                        loadJobForms(jobId);
                    }
                });
            };

            const handleDeleteJob = async (index) => {
                const updatedJobs = jobLibrary.filter((_, i) => i !== index);
                try {
                    await db.collection('poManagerData').doc(user.uid).set(
                        { jobLibrary: updatedJobs },
                        { merge: true }
                    );
                    setMessage('Job deleted');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleSaveSupervisor = async () => {
                if (!user || !superName) {
                    setMessage('Supervisor name required');
                    return;
                }
                try {
                    const newSupervisor = { name: superName, phone: superPhone, email: superEmail };
                    const updatedSupervisors = [...supervisorLibrary, newSupervisor];
                    await db.collection('poManagerData').doc(user.uid).set(
                        { supervisorLibrary: updatedSupervisors },
                        { merge: true }
                    );
                    setMessage('Supervisor saved');
                    setSuperName('');
                    setSuperPhone('');
                    setSuperEmail('');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleSelectSupervisor = (supervisor) => {
                setSuperName(supervisor.name);
                setSuperPhone(supervisor.phone);
                setSuperEmail(supervisor.email);
            };

            const handleDeleteSupervisor = async (index) => {
                const updatedSupervisors = supervisorLibrary.filter((_, i) => i !== index);
                try {
                    await db.collection('poManagerData').doc(user.uid).set(
                        { supervisorLibrary: updatedSupervisors },
                        { merge: true }
                    );
                    setMessage('Supervisor deleted');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleGeneratePDF = async () => {
                if (!jobCode || !superName) {
                    setMessage('Select job and supervisor first');
                    return;
                }
                try {
                    // Create a simple PDF with job details
                    const pdfDoc = await PDFDocument.create();
                    const page = pdfDoc.addPage([595, 842]); // A4 size
                    const { height } = page.getSize();
                    
                    page.drawText('SUBCONTRACTOR SCOPE OF WORK', {
                        x: 50,
                        y: height - 50,
                        size: 16,
                        color: rgb(0, 0, 0)
                    });
                    
                    page.drawText(`Job: ${jobCode}`, { x: 50, y: height - 100, size: 12 });
                    page.drawText(`Address: ${jobAddress}`, { x: 50, y: height - 130, size: 12 });
                    page.drawText(`City/State/Zip: ${cityStateZip}`, { x: 50, y: height - 160, size: 12 });
                    page.drawText(`Supervisor: ${superName}`, { x: 50, y: height - 190, size: 12 });
                    page.drawText(`Phone: ${superPhone}`, { x: 50, y: height - 220, size: 12 });
                    page.drawText(`Email: ${superEmail}`, { x: 50, y: height - 250, size: 12 });
                    
                    page.drawText('SUBCONTRACTOR DETAILS', { x: 50, y: height - 300, size: 14 });
                    page.drawText('(To be filled in manually)', { x: 50, y: height - 330, size: 10, color: rgb(128, 128, 128) });
                    
                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${jobCode}_SubcontractorScope.pdf`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    setCurrentPO(`${jobCode}_SubcontractorScope`);
                    setMessage('PDF generated');
                } catch (error) {
                    setMessage('Error generating PDF: ' + error.message);
                }
            };

            const handlePDFSelect = (e) => {
                const file = e.target.files[0];
                if (file && file.type === 'application/pdf') {
                    setSelectedPDF(file);
                    setMessage('PDF selected: ' + file.name);
                } else {
                    setMessage('Error: Please select a PDF file');
                }
            };

            const handleSaveTemplate = async () => {
                if (!user || !selectedPDF) {
                    setMessage('Please select a PDF and fill in subcontractor details');
                    return;
                }
                
                setUploadLoading(true);
                try {
                    // Upload PDF to Firebase Storage
                    const timestamp = Date.now();
                    const fileRef = storage.ref(`formTemplates/${user.uid}/${timestamp}_${selectedPDF.name}`);
                    await fileRef.put(selectedPDF);
                    const downloadURL = await fileRef.getDownloadURL();
                    
                    // Save metadata to Firestore
                    await db.collection('formLibrary').add({
                        userId: user.uid,
                        fileName: selectedPDF.name,
                        pdfUrl: downloadURL,
                        dateCreated: new Date(),
                        notes: 'Template'
                    });
                    
                    setMessage('Template saved successfully');
                    setSelectedPDF(null);
                    setUploadLoading(false);
                } catch (error) {
                    setMessage('Error saving template: ' + error.message);
                    setUploadLoading(false);
                }
            };

            const handleSaveToJob = async () => {
                if (!user || !selectedPDF || !currentJobId) {
                    setMessage('Select a job and PDF, then fill in subcontractor details');
                    return;
                }
                
                setUploadLoading(true);
                try {
                    // Upload PDF to Firebase Storage
                    const timestamp = Date.now();
                    const fileRef = storage.ref(`jobForms/${currentJobId}/${timestamp}_${selectedPDF.name}`);
                    await fileRef.put(selectedPDF);
                    const downloadURL = await fileRef.getDownloadURL();
                    
                    // Save to job's forms subcollection
                    await db.collection('jobs').doc(currentJobId).collection('forms').add({
                        fileName: selectedPDF.name,
                        pdfUrl: downloadURL,
                        notes: '',
                        status: 'In Progress',
                        dateCreated: new Date(),
                        dateUpdated: new Date()
                    });
                    
                    setMessage('Form saved to job successfully');
                    setSelectedPDF(null);
                    setUploadLoading(false);
                } catch (error) {
                    setMessage('Error saving to job: ' + error.message);
                    setUploadLoading(false);
                }
            };

            const handleEditForm = (form) => {
                setEditingFormId(form.id);
                setEditFormData({ notes: form.notes || '', status: form.status || 'In Progress' });
            };

            const handleSaveFormEdit = async (formId) => {
                if (!currentJobId) return;
                
                try {
                    await db.collection('jobs').doc(currentJobId).collection('forms').doc(formId).update({
                        notes: editFormData.notes,
                        status: editFormData.status,
                        dateUpdated: new Date()
                    });
                    setEditingFormId(null);
                    setMessage('Form updated');
                } catch (error) {
                    setMessage('Error updating form: ' + error.message);
                }
            };

            const handleDeleteForm = async (formId) => {
                if (!currentJobId || !window.confirm('Delete this form record?')) return;
                
                try {
                    await db.collection('jobs').doc(currentJobId).collection('forms').doc(formId).delete();
                    setMessage('Form deleted');
                } catch (error) {
                    setMessage('Error deleting form: ' + error.message);
                }
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">{authMode === 'login' ? 'LOGIN' : 'SIGN UP'}</div>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button className="btn-primary" onClick={authMode === 'login' ? handleLogin : handleSignUp}>
                            {authMode === 'login' ? 'Login' : 'Sign Up'}
                        </button>
                        <button className="btn-secondary" onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')}>
                            {authMode === 'login' ? 'Need account?' : 'Have account?'}
                        </button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            return (
                <div>
                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                            <div className="section-title">JOB DETAILS</div>
                            <button className="btn-secondary" onClick={handleLogout} style={{ width: 'auto' }}>Logout</button>
                        </div>

                        <div className="form-group">
                            <label>Job Code</label>
                            <input value={jobCode} onChange={e => setJobCode(e.target.value)} placeholder="Stark W 2602" />
                        </div>
                        <div className="form-group">
                            <label>Job Address</label>
                            <input value={jobAddress} onChange={e => setJobAddress(e.target.value)} placeholder="Street address" />
                        </div>
                        <div className="form-group">
                            <label>City / State / Zip</label>
                            <input value={cityStateZip} onChange={e => setCityStateZip(e.target.value)} placeholder="City, State ZIP" />
                        </div>
                        <div className="form-group">
                            <label>Lock Box</label>
                            <input value={lockBox} onChange={e => setLockBox(e.target.value)} placeholder="Lock box #" />
                        </div>

                        {jobLibrary.length > 0 && (
                            <div className="form-group">
                                <label>Load Job</label>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <select 
                                        value={selectedJobIndex}
                                        onChange={e => setSelectedJobIndex(e.target.value)}
                                        style={{ flex: 1, padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                    >
                                        <option value="">-- Pick a job --</option>
                                        {jobLibrary.map((job, idx) => (
                                            <option key={idx} value={idx}>{job.code} - {job.address}</option>
                                        ))}
                                    </select>
                                    <button 
                                        className="btn-primary" 
                                        onClick={() => {
                                            if (selectedJobIndex !== '') handleSelectJob(jobLibrary[parseInt(selectedJobIndex)]);
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedJobIndex === ''}
                                    >
                                        (Load)
                                    </button>
                                    <button 
                                        className="btn-secondary" 
                                        onClick={() => {
                                            if (selectedJobIndex !== '') {
                                                handleDeleteJob(parseInt(selectedJobIndex));
                                                setSelectedJobIndex('');
                                            }
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedJobIndex === ''}
                                    >
                                        (Delete)
                                    </button>
                                </div>
                            </div>
                        )}

                        <button className="btn-primary" onClick={handleSaveJob}>Save New Job</button>
                    </div>

                    <div className="section">
                        <div className="section-title">SUPERVISOR</div>

                        {supervisorLibrary.length > 0 && (
                            <div className="form-group">
                                <label>Load Supervisor</label>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <select 
                                        value={selectedSupervisorIndex}
                                        onChange={e => setSelectedSupervisorIndex(e.target.value)}
                                        style={{ flex: 1, padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                    >
                                        <option value="">-- Pick a supervisor --</option>
                                        {supervisorLibrary.map((sup, idx) => (
                                            <option key={idx} value={idx}>{sup.name}</option>
                                        ))}
                                    </select>
                                    <button 
                                        className="btn-primary" 
                                        onClick={() => {
                                            if (selectedSupervisorIndex !== '') handleSelectSupervisor(supervisorLibrary[parseInt(selectedSupervisorIndex)]);
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedSupervisorIndex === ''}
                                    >
                                        (Load)
                                    </button>
                                    <button 
                                        className="btn-secondary" 
                                        onClick={() => {
                                            if (selectedSupervisorIndex !== '') {
                                                handleDeleteSupervisor(parseInt(selectedSupervisorIndex));
                                                setSelectedSupervisorIndex('');
                                            }
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedSupervisorIndex === ''}
                                    >
                                        (Delete)
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="form-group">
                            <label>Super Name</label>
                            <input value={superName} onChange={e => setSuperName(e.target.value)} placeholder="Supervisor name" />
                        </div>
                        <div className="form-group">
                            <label>Super Phone</label>
                            <input value={superPhone} onChange={e => setSuperPhone(e.target.value)} placeholder="Phone" />
                        </div>
                        <div className="form-group">
                            <label>Super Email</label>
                            <input value={superEmail} onChange={e => setSuperEmail(e.target.value)} placeholder="Email" />
                        </div>

                        <button className="btn-primary" onClick={handleSaveSupervisor}>Save New Supervisor</button>
                    </div>

                    <div className="section">
                        <div className="section-title">GENERATE PO</div>
                        <div style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', marginBottom: '15px', fontSize: '13px' }}>
                            Job: {jobCode || '(none)'} | Super: {superName || '(none)'}<br/>
                            {currentPO && <strong>Last PO: {currentPO}</strong>}
                        </div>
                        <button className="btn-primary" onClick={handleGeneratePDF}>Generate & Download PDF</button>
                    </div>

                    <div className="section">
                        <div className="section-title">UPLOAD & SAVE COMPLETED FORM</div>
                        
                        <div style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', marginBottom: '15px', fontSize: '13px', borderLeft: '3px solid #0066cc' }}>
                            Current Job: <strong>{jobCode || '(none selected)'}</strong>
                        </div>

                        <div className="form-group">
                            <label>Select Completed PDF</label>
                            <div className="upload-area" onClick={() => document.getElementById('pdfInput').click()}>
                                <input 
                                    id="pdfInput"
                                    type="file" 
                                    accept=".pdf" 
                                    onChange={handlePDFSelect}
                                />
                                {selectedPDF ? (
                                    <div style={{ color: '#0066cc', fontWeight: 500 }}>✓ {selectedPDF.name}</div>
                                ) : (
                                    <div style={{ color: '#999' }}>Click to upload or drag PDF here</div>
                                )}
                            </div>
                        </div>

                        <div className="button-group">
                            <button 
                                className="btn-primary" 
                                onClick={handleSaveTemplate}
                                disabled={!selectedPDF || uploadLoading}
                            >
                                {uploadLoading ? 'Saving...' : 'Save as Template'}
                            </button>
                            <button 
                                className="btn-primary" 
                                onClick={handleSaveToJob}
                                disabled={!selectedPDF || !currentJobId || uploadLoading}
                            >
                                {uploadLoading ? 'Saving...' : 'Save to This Job'}
                            </button>
                        </div>
                    </div>

                    {currentJobId && jobForms.length > 0 && (
                        <div className="section">
                            <div className="section-title">JOB FORM COMPLETION TRACKER</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>File</th>
                                        <th>Notes</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {jobForms.map(form => (
                                        <tr key={form.id} className={editingFormId === form.id ? 'edit-row' : ''}>
                                            <td>{form.fileName}</td>
                                            <td>
                                                {editingFormId === form.id ? (
                                                    <textarea 
                                                        value={editFormData.notes}
                                                        onChange={e => setEditFormData({...editFormData, notes: e.target.value})}
                                                        placeholder="Add notes..."
                                                    />
                                                ) : (
                                                    form.notes || '-'
                                                )}
                                            </td>
                                            <td>
                                                {editingFormId === form.id ? (
                                                    <select 
                                                        value={editFormData.status}
                                                        onChange={e => setEditFormData({...editFormData, status: e.target.value})}
                                                    >
                                                        <option>In Progress</option>
                                                        <option>Completed</option>
                                                    </select>
                                                ) : (
                                                    <span className={`status-badge status-${form.status.toLowerCase().replace(' ', '-')}`}>
                                                        {form.status}
                                                    </span>
                                                )}
                                            </td>
                                            <td>
                                                <div className="button-group" style={{ gap: '4px' }}>
                                                    {editingFormId === form.id ? (
                                                        <>
                                                            <button className="btn-primary btn-sm" onClick={() => handleSaveFormEdit(form.id)}>Save</button>
                                                            <button className="btn-secondary btn-sm" onClick={() => setEditingFormId(null)}>Cancel</button>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <button className="btn-secondary btn-sm" onClick={() => handleEditForm(form)}>Edit</button>
                                                            <button className="btn-secondary btn-sm" onClick={() => window.open(form.pdfUrl)}>View</button>
                                                            <button className="btn-danger btn-sm" onClick={() => handleDeleteForm(form.id)}>Delete</button>
                                                        </>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {message && <div style={{ marginTop: '15px', padding: '10px', textAlign: 'center', color: message.includes('Error') ? '#d32f2f' : '#388e3c', fontWeight: 500 }}>{message}</div>}
                </div>
            );
        }

        ReactDOM.render(<POApp />, document.getElementById('app'));
    </script>
</body>
</html>
