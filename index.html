<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Manager - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-secondary:disabled { background: #e0e0e0; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 6px 10px; font-size: 12px; margin-right: 4px; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        .success { color: #388e3c; font-size: 12px; margin-top: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { background: #f5f5f5; padding: 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #fafafa; }
        
        
        .button-group { display: flex; gap: 8px; margin-top: 8px; }
        .button-group button { margin: 0; }
        
    </style>
</head>
<body>
    <div class="container">
        <h1>PO Manager</h1>
        <p class="subtitle">Freeman Restoration Subcontractor Scope of Work</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PDFDocument } = PDFLib;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        const TEMPLATE_PDF_URL = 'https://raw.githubusercontent.com/SF-codeMeG6c/po-manager/main/Sub_Spec_Blank_9-20-26_V2.pdf';

        function POApp() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login');
            
            const [jobCode, setJobCode] = useState('');
            const [jobAddress, setJobAddress] = useState('');
            const [cityStateZip, setCityStateZip] = useState('');
            const [lockBox, setLockBox] = useState('');
            const [superName, setSuperName] = useState('');
            const [superPhone, setSuperPhone] = useState('');
            const [superEmail, setSuperEmail] = useState('');
            const [currentJobId, setCurrentJobId] = useState('');
            
            const [currentPO, setCurrentPO] = useState('');
            const [message, setMessage] = useState('');
            const [jobLibrary, setJobLibrary] = useState([]);
            const [supervisorLibrary, setSupervisorLibrary] = useState([]);
            const [selectedJobIndex, setSelectedJobIndex] = useState('');
            const [selectedSupervisorIndex, setSelectedSupervisorIndex] = useState('');

            const [uploadLoading, setUploadLoading] = useState(false);
            const [jobForms, setJobForms] = useState([]);

            // Phase 4: PDF Metadata & Search
            const [formLibraryData, setFormLibraryData] = useState([]);
            const [formMetadata, setFormMetadata] = useState({
                subName: '',
                category: '',
                contact: '',
                phone: '',
                email: '',
                subCode: '',
                contractAmount: '',
                scope: ''
            });
            const [editingPO, setEditingPO] = useState(null); // tracker row being edited
            const [listening, setListening] = useState(false);
            const recognitionRef = React.useRef(null);

            // Search by Category
            const [selectedCategory, setSelectedCategory] = useState('');
            const [filteredSubsByCategory, setFilteredSubsByCategory] = useState([]);
            const [selectedSubByCategory, setSelectedSubByCategory] = useState('');
            const [categoryPreview, setCategoryPreview] = useState(null);

            // Search by Subcontractor
            const [selectedSubcontractor, setSelectedSubcontractor] = useState('');
            const [filteredCategoriesBySub, setFilteredCategoriesBySub] = useState([]);
            const [selectedCategoryBySub, setSelectedCategoryBySub] = useState('');
            const [subPreview, setSubPreview] = useState(null);

            useEffect(() => {
                auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    if (currentUser) {
                        loadDefaults(currentUser.uid);
                        loadFormLibraryData(currentUser.uid);
                    }
                });
            }, []);

            const loadFormLibraryData = (uid) => {
                db.collection('formLibrary').where('userId', '==', uid).onSnapshot(snapshot => {
                    const forms = [];
                    snapshot.forEach(doc => {
                        forms.push({ id: doc.id, ...doc.data() });
                    });
                    setFormLibraryData(forms);
                });
            };

            const loadDefaults = (uid) => {
                db.collection('poManagerData').doc(uid).onSnapshot(doc => {
                    if (doc.exists) {
                        if (doc.data().jobLibrary) {
                            setJobLibrary(doc.data().jobLibrary);
                        }
                        if (doc.data().supervisorLibrary) {
                            setSupervisorLibrary(doc.data().supervisorLibrary);
                        }
                    }
                });
            };

            const loadJobForms = (jobId) => {
                if (!user) return;
                db.collection('jobs').doc(jobId).collection('forms').orderBy('dateCreated', 'desc').onSnapshot(snapshot => {
                    const forms = [];
                    snapshot.forEach(doc => {
                        forms.push({ id: doc.id, ...doc.data() });
                    });
                    setJobForms(forms);
                });
            };

            const handleLogin = async () => {
                setAuthError('');
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleSignUp = async () => {
                setAuthError('');
                try {
                    await auth.createUserWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                    setAuthMode('login');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                setJobCode('');
                setJobAddress('');
                setCityStateZip('');
                setLockBox('');
                setSuperName('');
                setSuperPhone('');
                setSuperEmail('');
                setCurrentPO('');
                setCurrentJobId('');
                setJobLibrary([]);
                setSupervisorLibrary([]);
                setSelectedJobIndex('');
                setSelectedSupervisorIndex('');
                setJobForms([]);
            };

            const handleSaveJob = async () => {
                if (!user || !jobCode) {
                    setMessage('Job Code required');
                    return;
                }
                try {
                    const jobDocRef = await db.collection('jobs').add({
                        userId: user.uid,
                        code: jobCode,
                        address: jobAddress,
                        cityStateZip,
                        lockBox,
                        dateCreated: new Date()
                    });
                    
                    const newJob = { id: jobDocRef.id, code: jobCode, address: jobAddress, cityStateZip, lockBox };
                    const updatedJobs = [...jobLibrary, newJob];
                    await db.collection('poManagerData').doc(user.uid).set(
                        { jobLibrary: updatedJobs },
                        { merge: true }
                    );
                    
                    setMessage('Job saved');
                    setJobCode('');
                    setJobAddress('');
                    setCityStateZip('');
                    setLockBox('');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleSelectJob = (job) => {
                setJobCode(job.code);
                setJobAddress(job.address);
                setCityStateZip(job.cityStateZip);
                setLockBox(job.lockBox);
                
                // If job has id, use it; otherwise find it by code
                if (job.id) {
                    setCurrentJobId(job.id);
                    loadJobForms(job.id);
                } else if (job.code && user) {
                    // Find job by code in jobs collection
                    db.collection('jobs').where('userId', '==', user.uid)
                      .where('code', '==', job.code)
                      .limit(1)
                      .get()
                      .then(snapshot => {
                          if (!snapshot.empty) {
                              const jobId = snapshot.docs[0].id;
                              setCurrentJobId(jobId);
                              loadJobForms(jobId);
                          } else {
                              setMessage('Job not found in database');
                          }
                      })
                      .catch(error => {
                          setMessage('Error loading job: ' + error.message);
                      });
                }
            };

            const handleDeleteJob = async (index) => {
                const updatedJobs = jobLibrary.filter((_, i) => i !== index);
                try {
                    await db.collection('poManagerData').doc(user.uid).set(
                        { jobLibrary: updatedJobs },
                        { merge: true }
                    );
                    setMessage('Job deleted');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleSaveSupervisor = async () => {
                if (!user || !superName) {
                    setMessage('Supervisor name required');
                    return;
                }
                try {
                    const newSupervisor = { name: superName, phone: superPhone, email: superEmail };
                    const updatedSupervisors = [...supervisorLibrary, newSupervisor];
                    await db.collection('poManagerData').doc(user.uid).set(
                        { supervisorLibrary: updatedSupervisors },
                        { merge: true }
                    );
                    setMessage('Supervisor saved');
                    setSuperName('');
                    setSuperPhone('');
                    setSuperEmail('');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleSelectSupervisor = (supervisor) => {
                setSuperName(supervisor.name);
                setSuperPhone(supervisor.phone);
                setSuperEmail(supervisor.email);
            };

            const handleDeleteSupervisor = async (index) => {
                const updatedSupervisors = supervisorLibrary.filter((_, i) => i !== index);
                try {
                    await db.collection('poManagerData').doc(user.uid).set(
                        { supervisorLibrary: updatedSupervisors },
                        { merge: true }
                    );
                    setMessage('Supervisor deleted');
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

          const getNextPONumber = async () => {
    if (!user || !currentJobId) {
        setMessage('Error: Job not selected');
        return null;
    }
    try {
        const jobDoc = await db.collection('jobs').doc(currentJobId).get();
        const currentCounter = (jobDoc.data()?.poCounter || 0) + 1;
        
        // Update counter in Firebase
        await db.collection('jobs').doc(currentJobId).update({
            poCounter: currentCounter
        });
        
        // Format: JobCode-001
        const poNumber = `${jobCode}-${String(currentCounter).padStart(3, '0')}`;
        return poNumber;
    } catch (error) {
        setMessage('Error generating PO number: ' + error.message);
        return null;
    }
};

          const handleGeneratePDF = async () => {
    // Editing a PO that has its own saved header: use it, no job/super selection needed
    const header = (editingPO && editingPO.header) ? editingPO.header : {
        jobCode, jobAddress, cityStateZip, lockBox, superName, superEmail, superPhone
    };
    if (!currentJobId || !header.jobCode || !header.superName) {
        setMessage('Select job and supervisor first');
        return;
    }
    if (!formMetadata.subName || !formMetadata.category) {
        setMessage('Subcontractor and Category required');
        return;
    }
    setUploadLoading(true);
    try {
        const poNumber = editingPO ? editingPO.poNumber : await getNextPONumber();
        if (!poNumber) { setUploadLoading(false); return; }

        const response = await fetch(TEMPLATE_PDF_URL);
        const arrayBuffer = await response.arrayBuffer();
        const pdfDoc = await PDFDocument.load(arrayBuffer);
        const form = pdfDoc.getForm();

        // Amount always shown as $12,345.00 (typed with or without $ or commas)
        const rawAmount = (formMetadata.contractAmount || '').replace(/[^0-9.]/g, '');
        const amountNoSign = rawAmount && !isNaN(parseFloat(rawAmount))
            ? parseFloat(rawAmount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            : '';
        const amountDisplay = amountNoSign ? `$${amountNoSign}` : '';

        // PDF form field name -> value
        const values = {
            'Job Code': header.jobCode,
            'Job Address': header.jobAddress,
            'City State Zip': header.cityStateZip,
            'Lock Box': header.lockBox,
            'PO': poNumber,
            'Super': header.superName,
            'Email': header.superEmail,
            'Super Phone': header.superPhone,
            'Subcontractor': formMetadata.subName,
            'Contact': formMetadata.contact,
            'Phone': formMetadata.phone,
            'Email_2': formMetadata.email,
            'Sub Code': formMetadata.subCode,
            'Category': formMetadata.category,
            'Contract Amount': amountDisplay,
            'Text1': formMetadata.scope
        };
        // Match on name with extra spaces ignored (e.g. "City  State  Zip")
        form.getFields().forEach(field => {
            const name = field.getName().replace(/\s+/g, ' ').trim();
            if (values[name] !== undefined && field.setText) {
                field.setText(values[name] || '');
            }
        });

        const pdfBytes = await pdfDoc.save();

        // File name built from form data
        const d = new Date();
        const dateStr = `${d.getMonth() + 1}-${d.getDate()}-${String(d.getFullYear()).slice(-2)}`;
        const clean = (t) => (t || '').trim().replace(/[\/\\]/g, '-').replace(/\s+/g, '-');
        const fileName = `${clean(formMetadata.category)}_${clean(formMetadata.subName)}_$${clean(amountNoSign)}_${poNumber}_${dateStr}.pdf`;

        const fileRef = storage.ref(`jobForms/${currentJobId}/${Date.now()}_${fileName}`);
        await fileRef.put(new Blob([pdfBytes], { type: 'application/pdf' }));
        const downloadURL = await fileRef.getDownloadURL();

        const poData = {
            fileName: fileName,
            pdfUrl: downloadURL,
            poNumber: poNumber,
            subName: formMetadata.subName,
            category: formMetadata.category,
            contact: formMetadata.contact,
            phone: formMetadata.phone,
            email: formMetadata.email,
            subCode: formMetadata.subCode,
            contractAmount: formMetadata.contractAmount,
            scope: formMetadata.scope || '',
            header: header,
            dateUpdated: new Date()
        };
        const formsRef = db.collection('jobs').doc(currentJobId).collection('forms');

        if (editingPO) {
            // Replace existing PO: update same row (notes/status kept), remove old file
            await formsRef.doc(editingPO.id).update(poData);
            try { await storage.refFromURL(editingPO.pdfUrl).delete(); } catch (e) { console.log('Old file not removed:', e.message); }
            setEditingPO(null);
            setMessage(`PO updated: ${fileName}`);
        } else {
            await formsRef.add({ ...poData, notes: '', status: 'Pending', dateCreated: new Date() });
            setMessage(`PO created and saved to job: ${fileName}`);
        }

        setCurrentPO(poNumber);
        setFormMetadata({ subName: '', category: '', contact: '', phone: '', email: '', subCode: '', contractAmount: '', scope: '' });
    } catch (error) {
        setMessage('Error creating PO: ' + error.message);
    }
    setUploadLoading(false);
};

            const getUniqueCategories = () => {
                const categories = [...new Set(formLibraryData.map(f => f.category).filter(Boolean))];
                return categories.sort();
            };

            const getSubsByCategory = (category) => {
                const subs = [...new Set(formLibraryData.filter(f => f.category === category).map(f => f.subName).filter(Boolean))];
                return subs.sort();
            };

            const getUniqueSubcontractors = () => {
                const subs = [...new Set(formLibraryData.map(f => f.subName).filter(Boolean))];
                return subs.sort();
            };

            const getCategoriesBySubcontractor = (subName) => {
                const categories = [...new Set(formLibraryData.filter(f => f.subName === subName).map(f => f.category).filter(Boolean))];
                return categories.sort();
            };

            const handleCategorySelect = (category) => {
                setSelectedCategory(category);
                setSelectedSubByCategory('');
                setCategoryPreview(null);
                if (category) {
                    const subs = getSubsByCategory(category);
                    setFilteredSubsByCategory(subs);
                }
            };

            const handleSubByCategorySelect = (subName) => {
                setSelectedSubByCategory(subName);
                if (subName && selectedCategory) {
                    const record = formLibraryData.find(f => f.category === selectedCategory && f.subName === subName);
                    if (record) {
                        setCategoryPreview({
                            subName: record.subName,
                            contact: record.contact,
                            phone: record.phone,
                            email: record.email,
                            subCode: record.subCode,
                            contractAmount: record.contractAmount,
                            category: record.category,
                            scope: record.scope || ''
                        });
                    }
                }
            };

            const handleSubcontractorSelect = (subName) => {
                setSelectedSubcontractor(subName);
                setSelectedCategoryBySub('');
                setSubPreview(null);
                if (subName) {
                    const categories = getCategoriesBySubcontractor(subName);
                    setFilteredCategoriesBySub(categories);
                }
            };

            const handleCategoryBySubSelect = (category) => {
                setSelectedCategoryBySub(category);
                if (category && selectedSubcontractor) {
                    const record = formLibraryData.find(f => f.subName === selectedSubcontractor && f.category === category);
                    if (record) {
                        setSubPreview({
                            subName: record.subName,
                            contact: record.contact,
                            phone: record.phone,
                            email: record.email,
                            subCode: record.subCode,
                            contractAmount: record.contractAmount,
                            category: record.category,
                            scope: record.scope || ''
                        });
                    }
                }
            };

            const handleUseTemplate = (t) => {
                setEditingPO(null);
                setFormMetadata({
                    subName: t.subName || '', category: t.category || '', contact: t.contact || '',
                    phone: t.phone || '', email: t.email || '', subCode: t.subCode || '',
                    contractAmount: t.contractAmount || '', scope: t.scope || ''
                });
                setMessage(`Template loaded: ${t.subName} | ${t.category}`);
                document.getElementById('generate-po-section')?.scrollIntoView({ behavior: 'smooth' });
            };

            const handleSaveTemplate = async () => {
                if (!user) return;
                if (!formMetadata.subName || !formMetadata.category) {
                    setMessage('Subcontractor and Category required');
                    return;
                }
                setUploadLoading(true);
                try {
                    const templateData = {
                        userId: user.uid,
                        subName: formMetadata.subName,
                        category: formMetadata.category,
                        contact: formMetadata.contact,
                        phone: formMetadata.phone,
                        email: formMetadata.email,
                        subCode: formMetadata.subCode,
                        contractAmount: formMetadata.contractAmount,
                        scope: formMetadata.scope || '',
                        dateUpdated: new Date()
                    };
                    // Same sub + category already saved? Update it instead of adding a duplicate
                    const existing = formLibraryData.find(f => f.subName === formMetadata.subName && f.category === formMetadata.category);
                    if (existing) {
                        await db.collection('formLibrary').doc(existing.id).update(templateData);
                        setMessage('Template updated');
                    } else {
                        await db.collection('formLibrary').add({ ...templateData, dateCreated: new Date() });
                        setMessage('Template saved');
                    }
                } catch (error) {
                    setMessage('Error saving template: ' + error.message);
                }
                setUploadLoading(false);
            };

            const handleDeleteTemplate = async (t) => {
                if (!window.confirm(`Delete template ${t.subName} | ${t.category}?`)) return;
                try {
                    await db.collection('formLibrary').doc(t.id).delete();
                    if (t.pdfUrl) {
                        try { await storage.refFromURL(t.pdfUrl).delete(); } catch (e) { console.log('Old template file not removed:', e.message); }
                    }
                    setMessage('Template deleted');
                } catch (error) {
                    setMessage('Error deleting template: ' + error.message);
                }
            };

            // Voice to text for Scope of Work (Chrome/Edge)
            const toggleVoice = () => {
                if (listening) { recognitionRef.current && recognitionRef.current.stop(); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setMessage('Voice input not supported in this browser (use Chrome or Edge)'); return; }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.continuous = true;
                rec.interimResults = false;
                rec.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) text += e.results[i][0].transcript;
                    }
                    if (text) {
                        setFormMetadata(prev => {
                            const cur = prev.scope || '';
                            const sep = cur && !cur.endsWith('\n') && !cur.endsWith(' ') ? ' ' : '';
                            return { ...prev, scope: cur + sep + text.trim() };
                        });
                    }
                };
                rec.onerror = (e) => { setMessage('Voice input error: ' + e.error); };
                rec.onend = () => setListening(false);
                recognitionRef.current = rec;
                rec.start();
                setListening(true);
            };

            const handleEditPO = (form) => {
                setEditingPO(form);
                setFormMetadata({
                    subName: form.subName || '', category: form.category || '', contact: form.contact || '',
                    phone: form.phone || '', email: form.email || '', subCode: form.subCode || '',
                    contractAmount: form.contractAmount || '', scope: form.scope || ''
                });
                setMessage(`Editing PO ${form.poNumber}`);
                document.getElementById('generate-po-section')?.scrollIntoView({ behavior: 'smooth' });
            };

            const handleCancelEditPO = () => {
                setEditingPO(null);
                setFormMetadata({ subName: '', category: '', contact: '', phone: '', email: '', subCode: '', contractAmount: '', scope: '' });
                setMessage('');
            };

            // Save notes/status straight from the tracker row
            const handleUpdateForm = async (formId, fields) => {
                if (!currentJobId) return;
                try {
                    await db.collection('jobs').doc(currentJobId).collection('forms').doc(formId).update({ ...fields, dateUpdated: new Date() });
                } catch (error) {
                    setMessage('Error updating form: ' + error.message);
                }
            };

            const handleDeleteForm = async (formId) => {
                if (!currentJobId || !window.confirm('Delete this form record?')) return;
                
                try {
                    await db.collection('jobs').doc(currentJobId).collection('forms').doc(formId).delete();
                    setMessage('Form deleted');
                } catch (error) {
                    setMessage('Error deleting form: ' + error.message);
                }
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">{authMode === 'login' ? 'LOGIN' : 'SIGN UP'}</div>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button className="btn-primary" onClick={authMode === 'login' ? handleLogin : handleSignUp}>
                            {authMode === 'login' ? 'Login' : 'Sign Up'}
                        </button>
                        <button className="btn-secondary" onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')}>
                            {authMode === 'login' ? 'Need account?' : 'Have account?'}
                        </button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            return (
                <div>
                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                            <div className="section-title">JOB DETAILS</div>
                            <button className="btn-secondary" onClick={handleLogout} style={{ width: 'auto' }}>Logout</button>
                        </div>

                        <div className="form-group">
                            <label>Job Code</label>
                            <input value={jobCode} onChange={e => setJobCode(e.target.value)} placeholder="Stark W 2602" />
                        </div>
                        <div className="form-group">
                            <label>Job Address</label>
                            <input value={jobAddress} onChange={e => setJobAddress(e.target.value)} placeholder="Street address" />
                        </div>
                        <div className="form-group">
                            <label>City / State / Zip</label>
                            <input value={cityStateZip} onChange={e => setCityStateZip(e.target.value)} placeholder="City, State ZIP" />
                        </div>
                        <div className="form-group">
                            <label>Lock Box</label>
                            <input value={lockBox} onChange={e => setLockBox(e.target.value)} placeholder="Lock box #" />
                        </div>

                        {jobLibrary.length > 0 && (
                            <div className="form-group">
                                <label>Load Job</label>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <select 
                                        value={selectedJobIndex}
                                        onChange={e => setSelectedJobIndex(e.target.value)}
                                        style={{ flex: 1, padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                    >
                                        <option value="">-- Pick a job --</option>
                                        {jobLibrary.map((job, idx) => (
                                            <option key={idx} value={idx}>{job.code} - {job.address}</option>
                                        ))}
                                    </select>
                                    <button 
                                        className="btn-primary" 
                                        onClick={() => {
                                            if (selectedJobIndex !== '') handleSelectJob(jobLibrary[parseInt(selectedJobIndex)]);
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedJobIndex === ''}
                                    >
                                        (Load)
                                    </button>
                                    <button 
                                        className="btn-secondary" 
                                        onClick={() => {
                                            if (selectedJobIndex !== '') {
                                                handleDeleteJob(parseInt(selectedJobIndex));
                                                setSelectedJobIndex('');
                                            }
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedJobIndex === ''}
                                    >
                                        (Delete)
                                    </button>
                                </div>
                            </div>
                        )}

                        <button className="btn-primary" onClick={handleSaveJob}>Save New Job</button>
                    </div>

                    <div className="section">
                        <div className="section-title">SUPERVISOR</div>

                        {supervisorLibrary.length > 0 && (
                            <div className="form-group">
                                <label>Load Supervisor</label>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <select 
                                        value={selectedSupervisorIndex}
                                        onChange={e => setSelectedSupervisorIndex(e.target.value)}
                                        style={{ flex: 1, padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                    >
                                        <option value="">-- Pick a supervisor --</option>
                                        {supervisorLibrary.map((sup, idx) => (
                                            <option key={idx} value={idx}>{sup.name}</option>
                                        ))}
                                    </select>
                                    <button 
                                        className="btn-primary" 
                                        onClick={() => {
                                            if (selectedSupervisorIndex !== '') handleSelectSupervisor(supervisorLibrary[parseInt(selectedSupervisorIndex)]);
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedSupervisorIndex === ''}
                                    >
                                        (Load)
                                    </button>
                                    <button 
                                        className="btn-secondary" 
                                        onClick={() => {
                                            if (selectedSupervisorIndex !== '') {
                                                handleDeleteSupervisor(parseInt(selectedSupervisorIndex));
                                                setSelectedSupervisorIndex('');
                                            }
                                        }}
                                        style={{ width: 'auto', padding: '8px 12px' }}
                                        disabled={selectedSupervisorIndex === ''}
                                    >
                                        (Delete)
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="form-group">
                            <label>Super Name</label>
                            <input value={superName} onChange={e => setSuperName(e.target.value)} placeholder="Supervisor name" />
                        </div>
                        <div className="form-group">
                            <label>Super Phone</label>
                            <input value={superPhone} onChange={e => setSuperPhone(e.target.value)} placeholder="Phone" />
                        </div>
                        <div className="form-group">
                            <label>Super Email</label>
                            <input value={superEmail} onChange={e => setSuperEmail(e.target.value)} placeholder="Email" />
                        </div>

                        <button className="btn-primary" onClick={handleSaveSupervisor}>Save New Supervisor</button>
                    </div>

                    <div className="section" id="generate-po-section">
                        <div className="section-title">GENERATE PO</div>
                        <div style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', marginBottom: '15px', fontSize: '13px' }}>
                            Job: {jobCode || '(none)'} | Super: {superName || '(none)'}<br/>
                            {currentPO && <strong>Last PO: {currentPO}</strong>}
                            {editingPO && <div style={{ color: '#cc6600', fontWeight: 600, marginTop: '4px' }}>Editing PO: {editingPO.poNumber}</div>}
                        </div>
                        <button className="btn-secondary" onClick={handleCancelEditPO} disabled={uploadLoading} style={{ marginBottom: '15px' }}>
                            New Blank PO
                        </button>
                        <div className="form-group"><label>Subcontractor</label>
                            <input value={formMetadata.subName || ''} onChange={e => setFormMetadata({ ...formMetadata, subName: e.target.value })} /></div>
                        <div className="form-group"><label>Contact</label>
                            <input value={formMetadata.contact || ''} onChange={e => setFormMetadata({ ...formMetadata, contact: e.target.value })} /></div>
                        <div className="form-group"><label>Phone</label>
                            <input value={formMetadata.phone || ''} onChange={e => setFormMetadata({ ...formMetadata, phone: e.target.value })} /></div>
                        <div className="form-group"><label>Email</label>
                            <input value={formMetadata.email || ''} onChange={e => setFormMetadata({ ...formMetadata, email: e.target.value })} /></div>
                        <div className="form-group"><label>Sub Code</label>
                            <input value={formMetadata.subCode || ''} onChange={e => setFormMetadata({ ...formMetadata, subCode: e.target.value })} /></div>
                        <div className="form-group"><label>Category</label>
                            <input value={formMetadata.category || ''} onChange={e => setFormMetadata({ ...formMetadata, category: e.target.value })} /></div>
                        <div className="form-group"><label>Contract Amount</label>
                            <input value={formMetadata.contractAmount || ''} onChange={e => setFormMetadata({ ...formMetadata, contractAmount: e.target.value })} /></div>
                        <div className="form-group"><label>Scope of Work
                            <button type="button" className={listening ? 'btn-danger btn-sm' : 'btn-secondary btn-sm'} onClick={toggleVoice} style={{ width: 'auto', marginLeft: '10px' }}>
                                {listening ? '■ Stop' : '🎤 Voice'}
                            </button></label>
                            <textarea rows="8" value={formMetadata.scope || ''} onChange={e => setFormMetadata({ ...formMetadata, scope: e.target.value })} /></div>

                        <button className="btn-primary" onClick={handleGeneratePDF} disabled={uploadLoading || !currentJobId}>
                            {uploadLoading ? 'Saving...' : (editingPO ? 'Save Changes to PO' : 'Create PO & Save to Job')}
                        </button>
                        <button className="btn-secondary" onClick={async () => { await handleSaveTemplate(); await handleGeneratePDF(); }} disabled={uploadLoading || !currentJobId} style={{ marginTop: '8px' }}>
                            {editingPO ? 'Save Changes + Update Template' : 'Create PO & Save to Template + Job'}
                        </button>
                        {editingPO && (
                            <button className="btn-secondary" onClick={handleCancelEditPO} disabled={uploadLoading} style={{ marginTop: '8px' }}>Cancel Edit</button>
                        )}
                        {message && <div style={{ marginTop: '15px', padding: '10px', textAlign: 'center', color: message.includes('Error') ? '#d32f2f' : '#388e3c', fontWeight: 500 }}>{message}</div>}
                    </div>

                    <div className="section">
                        <div className="section-title">SEARCH BY CATEGORY</div>
                        <div className="form-group">
                            <label>Select Category</label>
                            <select 
                                value={selectedCategory}
                                onChange={e => handleCategorySelect(e.target.value)}
                                style={{ width: '100%', padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                            >
                                <option value="">-- Pick a category --</option>
                                {getUniqueCategories().map(cat => (
                                    <option key={cat} value={cat}>{cat}</option>
                                ))}
                            </select>
                        </div>

                        {selectedCategory && filteredSubsByCategory.length > 0 && (
                            <div className="form-group">
                                <label>Select Subcontractor in {selectedCategory}</label>
                                <select 
                                    value={selectedSubByCategory}
                                    onChange={e => handleSubByCategorySelect(e.target.value)}
                                    style={{ width: '100%', padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                >
                                    <option value="">-- Pick a subcontractor --</option>
                                    {filteredSubsByCategory.map(sub => (
                                        <option key={sub} value={sub}>{sub}</option>
                                    ))}
                                </select>
                            </div>
                        )}

                        {categoryPreview && (
                            <div style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', marginTop: '12px', border: '1px solid #ddd' }}>
                                <div style={{ fontSize: '13px', marginBottom: '8px' }}>
                                    <strong>{categoryPreview.subName}</strong> | {categoryPreview.category}<br/>
                                    Contact: {categoryPreview.contact || '-'}<br/>
                                    Phone: {categoryPreview.phone || '-'}<br/>
                                    Email: {categoryPreview.email || '-'}<br/>
                                    Sub Code: {categoryPreview.subCode || '-'}<br/>
                                    Contract Amount: {categoryPreview.contractAmount || '-'}
                                </div>
                                <button 
                                    className="btn-primary" 
                                    onClick={() => handleUseTemplate(categoryPreview)}
                                    style={{ width: '100%' }}
                                >
                                    Use This Template
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="section">
                        <div className="section-title">SEARCH BY SUBCONTRACTOR</div>
                        <div className="form-group">
                            <label>Select Subcontractor</label>
                            <select 
                                value={selectedSubcontractor}
                                onChange={e => handleSubcontractorSelect(e.target.value)}
                                style={{ width: '100%', padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                            >
                                <option value="">-- Pick a subcontractor --</option>
                                {getUniqueSubcontractors().map(sub => (
                                    <option key={sub} value={sub}>{sub}</option>
                                ))}
                            </select>
                        </div>

                        {selectedSubcontractor && filteredCategoriesBySub.length > 0 && (
                            <div className="form-group">
                                <label>Select Category for {selectedSubcontractor}</label>
                                <select 
                                    value={selectedCategoryBySub}
                                    onChange={e => handleCategoryBySubSelect(e.target.value)}
                                    style={{ width: '100%', padding: '8px 10px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '14px' }}
                                >
                                    <option value="">-- Pick a category --</option>
                                    {filteredCategoriesBySub.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                </select>
                            </div>
                        )}

                        {subPreview && (
                            <div style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', marginTop: '12px', border: '1px solid #ddd' }}>
                                <div style={{ fontSize: '13px', marginBottom: '8px' }}>
                                    <strong>{subPreview.subName}</strong> | {subPreview.category}<br/>
                                    Contact: {subPreview.contact || '-'}<br/>
                                    Phone: {subPreview.phone || '-'}<br/>
                                    Email: {subPreview.email || '-'}<br/>
                                    Sub Code: {subPreview.subCode || '-'}<br/>
                                    Contract Amount: {subPreview.contractAmount || '-'}
                                </div>
                                <button 
                                    className="btn-primary" 
                                    onClick={() => handleUseTemplate(subPreview)}
                                    style={{ width: '100%' }}
                                >
                                    Use This Template
                                </button>
                            </div>
                        )}
                    </div>

                    {currentJobId && jobForms.length > 0 && (
                        <div className="section">
                            <div className="section-title">JOB FORM COMPLETION TRACKER</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>File</th>
                                        <th>Notes</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...jobForms]
                                        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.fileName || '').localeCompare(b.fileName || ''))
                                        .map(form => {
                                            const isComplete = form.status === 'Complete' || form.status === 'Completed';
                                            return (
                                                <tr key={form.id}>
                                                    <td>{form.fileName}</td>
                                                    <td>
                                                        <input
                                                            key={form.id + (form.notes || '')}
                                                            defaultValue={form.notes || ''}
                                                            title={form.notes || ''}
                                                            placeholder="Add notes..."
                                                            onBlur={e => { if (e.target.value !== (form.notes || '')) handleUpdateForm(form.id, { notes: e.target.value }); }}
                                                            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                                                            style={{ margin: 0 }}
                                                        />
                                                    </td>
                                                    <td>
                                                        <label style={{ display: 'flex', alignItems: 'center', gap: '4px', margin: 0, fontWeight: 'normal', whiteSpace: 'nowrap' }}>
                                                            <input type="radio" name={'status-' + form.id} checked={!isComplete}
                                                                onChange={() => handleUpdateForm(form.id, { status: 'Pending' })} style={{ width: 'auto', margin: 0 }} />
                                                            Pending
                                                        </label>
                                                        <label style={{ display: 'flex', alignItems: 'center', gap: '4px', margin: 0, fontWeight: 'normal', whiteSpace: 'nowrap' }}>
                                                            <input type="radio" name={'status-' + form.id} checked={isComplete}
                                                                onChange={() => handleUpdateForm(form.id, { status: 'Complete' })} style={{ width: 'auto', margin: 0 }} />
                                                            Complete
                                                        </label>
                                                    </td>
                                                    <td>
                                                        <div className="button-group" style={{ gap: '4px' }}>
                                                            {form.poNumber && <button className="btn-secondary btn-sm" onClick={() => handleEditPO(form)}>Edit PO</button>}
                                                            <button className="btn-secondary btn-sm" onClick={() => window.open(form.pdfUrl)}>View</button>
                                                            <button className="btn-danger btn-sm" onClick={() => handleDeleteForm(form.id)}>Delete</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {formLibraryData.length > 0 && (
                        <div className="section">
                            <div className="section-title">TEMPLATE LIBRARY</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Category</th>
                                        <th>Subcontractor</th>
                                        <th>Contract Amount</th>
                                        <th>Last Updated</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...formLibraryData]
                                        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.subName || '').localeCompare(b.subName || ''))
                                        .map(t => {
                                            const d = t.dateUpdated || t.dateCreated;
                                            return (
                                                <tr key={t.id}>
                                                    <td>{t.category}</td>
                                                    <td>{t.subName}</td>
                                                    <td>{t.contractAmount || '-'}</td>
                                                    <td>{d && d.toDate ? d.toDate().toLocaleDateString() : '-'}</td>
                                                    <td>
                                                        <div className="button-group" style={{ gap: '4px' }}>
                                                            <button className="btn-secondary btn-sm" onClick={() => handleUseTemplate(t)}>Use</button>
                                                            <button className="btn-danger btn-sm" onClick={() => handleDeleteTemplate(t)}>Delete</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                </tbody>
                            </table>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<POApp />, document.getElementById('app'));
    </script>
</body>
</html>
