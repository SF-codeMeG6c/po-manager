<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO Manager - Freeman Restoration</title>
</head>
<body>
  <div id="root" style="font-family: Arial; padding: 20px;"></div>
  <div id="errors" style="background: #fee; padding: 10px; margin: 10px 0; border: 1px solid #f88; display: none; color: red; font-size: 12px;"></div>

  <script>
    const errorDiv = document.getElementById('errors');
    function logError(msg) {
      console.error(msg);
      const p = document.createElement('p');
      p.textContent = msg;
      errorDiv.appendChild(p);
      errorDiv.style.display = 'block';
    }
    window.onerror = (msg, url, line) => logError(`JS Error L${line}: ${msg}`);
  </script>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    console.log('✓ React loaded');
    
    let auth = null, db = null;
    try {
      if (typeof firebase !== 'undefined' && (!firebase.apps || !firebase.apps.length)) {
        firebase.initializeApp({
          apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
          authDomain: "po-project-ea1ca.firebaseapp.com",
          projectId: "po-project-ea1ca",
          storageBucket: "po-project-ea1ca.firebasestorage.app",
          messagingSenderId: "589238434084",
          appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        });
        auth = firebase.auth();
        db = firebase.firestore();
        console.log('✓ Firebase initialized');
      }
    } catch (e) {
      console.error('Firebase error:', e);
      logError('Firebase init failed: ' + e.message);
    }

    const ChevronDown = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    );

    const ChevronUp = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    );

    const AuthScreen = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      return (
        <div style={{ maxWidth: '400px', margin: '100px auto', padding: '20px' }}>
          <h1 style={{ textAlign: 'center' }}>Freeman Restoration</h1>
          <h2 style={{ textAlign: 'center', fontSize: '18px', fontWeight: 'normal', color: '#666' }}>PO Manager</h2>
          <form onSubmit={handleAuth} style={{ background: '#f9f9f9', padding: '20px', borderRadius: '4px' }}>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ display: 'block', marginBottom: '5px', fontWeight: 'bold', fontSize: '13px' }}>Email</label>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required style={{ width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', boxSizing: 'border-box' }} />
            </div>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ display: 'block', marginBottom: '5px', fontWeight: 'bold', fontSize: '13px' }}>Password</label>
              <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required style={{ width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', boxSizing: 'border-box' }} />
            </div>
            {error && <div style={{ color: '#f44336', marginBottom: '15px', fontSize: '13px' }}>{error}</div>}
            <button type="submit" disabled={loading} style={{ width: '100%', padding: '10px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold', marginBottom: '10px' }}>
              {loading ? 'Loading...' : isSignUp ? 'Sign Up' : 'Log In'}
            </button>
            <button type="button" onClick={() => setIsSignUp(!isSignUp)} style={{ width: '100%', padding: '10px', background: 'transparent', color: '#2196F3', border: '1px solid #2196F3', borderRadius: '4px', cursor: 'pointer', fontSize: '13px' }}>
              {isSignUp ? 'Already have an account? Log In' : "Don't have an account? Sign Up"}
            </button>
          </form>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [showJobDefaults, setShowJobDefaults] = useState(true);
      const [showFormFiller, setShowFormFiller] = useState(true);
      const [showSearchLibrary, setShowSearchLibrary] = useState(false);
      const [saving, setSaving] = useState(false);
      const [generating, setGenerating] = useState(false);
      
      const [formData, setFormData] = useState({
        subName: '',
        contact: '',
        phone: '',
        email: '',
        subCode: '',
        category: '',
        scopeOfWork: '',
        contractAmount: '',
        previousPayment: '',
        amountDue: '',
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [searchType, setSearchType] = useState('subName');
      const [searchResults, setSearchResults] = useState([]);
      const [selectedResult, setSelectedResult] = useState(null);
      
      const [jobDefaults, setJobDefaults] = useState({
        jobCode: '',
        jobAddress: '',
        cityStateZip: '',
        lockBox: '',
        superName: '',
        superPhone: '',
        superEmail: '',
      });

      const [currentJob, setCurrentJob] = useState({
        jobCode: '',
        jobAddress: '',
        cityStateZip: '',
        lockBox: '',
        superName: '',
        superPhone: '',
        superEmail: '',
      });

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => { 
          console.log('Auth state changed:', currentUser?.email);
          setUser(currentUser); 
          setAuthLoading(false); 
        });
        return unsubscribe;
      }, []);

      useEffect(() => {
        if (!user || !db) {
          console.log('Skipping Firestore load - user:', !!user, 'db:', !!db);
          return;
        }
        console.log('Setting up Firestore listener for user:', user.uid);
        
        const unsubscribe = db.collection('poManagerData').doc(user.uid).onSnapshot(
          (doc) => {
            console.log('Firestore snapshot received');
            if (doc.exists && doc.data().jobDefaults) {
              console.log('Loading job defaults:', doc.data().jobDefaults);
              setJobDefaults(doc.data().jobDefaults);
            }
          },
          (error) => {
            console.error('Firestore listener error:', error);
            logError('Firestore error: ' + error.message);
          }
        );
        
        return unsubscribe;
      }, [user]);

      const handleSaveJobDefaults = async () => {
        console.log('Saving job defaults:', currentJob);
        if (!user || !db) {
          alert('Not connected to database');
          return;
        }
        setSaving(true);
        try {
          await db.collection('poManagerData').doc(user.uid).set({ jobDefaults: currentJob }, { merge: true });
          console.log('Defaults saved');
          alert('Job defaults saved');
        } catch (err) {
          console.error('Save error:', err);
          logError('Save failed: ' + err.message);
        }
        setSaving(false);
      };

      const handleApplyDefaults = () => {
        console.log('Applying defaults:', jobDefaults);
        setCurrentJob(jobDefaults);
      };

      const handleGeneratePDF = async () => {
        setGenerating(true);
        try {
          alert('PDF generation feature coming soon - form data will be overlaid on blank PDF');
          console.log('Generate PDF with:', formData);
        } catch (err) {
          console.error('PDF generation error:', err);
          logError('PDF generation failed: ' + err.message);
        }
        setGenerating(false);
      };

      const handleSaveFormToLibrary = async () => {
        if (!user || !db) {
          alert('Not connected to database');
          return;
        }
        if (!formData.subName || !formData.category) {
          alert('Subcontractor name and category required');
          return;
        }
        setSaving(true);
        try {
          await db.collection('formLibrary').add({
            userId: user.uid,
            subName: formData.subName,
            category: formData.category,
            contact: formData.contact,
            phone: formData.phone,
            email: formData.email,
            subCode: formData.subCode,
            scopeOfWork: formData.scopeOfWork,
            contractAmount: formData.contractAmount,
            previousPayment: formData.previousPayment,
            amountDue: formData.amountDue,
            timestamp: new Date(),
          });
          alert('Form saved to library');
          setFormData({ subName: '', contact: '', phone: '', email: '', subCode: '', category: '', scopeOfWork: '', contractAmount: '', previousPayment: '', amountDue: '' });
        } catch (err) {
          console.error('Save error:', err);
          logError('Save to library failed: ' + err.message);
        }
        setSaving(false);
      };

      const handleSearch = async () => {
        if (!user || !db || !searchQuery) {
          alert('Enter search term');
          return;
        }
        try {
          let results = [];
          if (searchType === 'subName') {
            const snapshot = await db.collection('formLibrary').where('userId', '==', user.uid).where('subName', '==', searchQuery).get();
            results = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const categories = [...new Set(results.map(r => r.category))];
            alert(`Found ${results.length} records. Categories: ${categories.join(', ') || 'none'}`);
          } else if (searchType === 'category') {
            const snapshot = await db.collection('formLibrary').where('userId', '==', user.uid).where('category', '==', searchQuery).get();
            results = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const subs = [...new Set(results.map(r => r.subName))];
            alert(`Found ${results.length} records. Subcontractors: ${subs.join(', ') || 'none'}`);
          }
          setSearchResults(results);
        } catch (err) {
          console.error('Search error:', err);
          logError('Search failed: ' + err.message);
        }
      };

      const handleSelectResult = (result) => {
        setFormData({
          subName: result.subName,
          contact: result.contact,
          phone: result.phone,
          email: result.email,
          subCode: result.subCode,
          category: result.category,
          scopeOfWork: result.scopeOfWork,
          contractAmount: result.contractAmount,
          previousPayment: result.previousPayment,
          amountDue: result.amountDue,
        });
        setSelectedResult(result.id);
        setSearchResults([]);
        setSearchQuery('');
      };

      if (authLoading) return <div style={{ textAlign: 'center', padding: '40px' }}>Loading...</div>;
      if (!user) return <AuthScreen />;

      return (
        <div style={{ maxWidth: '900px', margin: '0 auto', padding: '20px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px', paddingBottom: '20px', borderBottom: '1px solid #eee' }}>
            <div>
              <h1 style={{ margin: '0 0 5px 0' }}>Freeman Restoration - PO Manager</h1>
              <div style={{ fontSize: '12px', color: '#999' }}>{user.email}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {saving && <div style={{ fontSize: '12px', color: '#2196F3' }}>Saving...</div>}
              <button onClick={() => auth.signOut()} style={{ padding: '8px 16px', background: '#999', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px' }}>Logout</button>
            </div>
          </div>

          <div style={{ border: '1px solid #ddd', marginBottom: '20px', borderRadius: '4px' }}>
            <button
              onClick={() => setShowJobDefaults(!showJobDefaults)}
              style={{
                width: '100%',
                padding: '12px',
                background: '#f5f5f5',
                border: 'none',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: 'bold',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
              }}
            >
              JOB HEADER DEFAULTS
              {showJobDefaults ? <ChevronUp /> : <ChevronDown />}
            </button>

            {showJobDefaults && (
              <div style={{ padding: '15px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                  <input type="text" placeholder="Job Code" value={currentJob.jobCode} onChange={(e) => setCurrentJob({ ...currentJob, jobCode: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Job Address" value={currentJob.jobAddress} onChange={(e) => setCurrentJob({ ...currentJob, jobAddress: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="City / State / Zip" value={currentJob.cityStateZip} onChange={(e) => setCurrentJob({ ...currentJob, cityStateZip: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Lock Box" value={currentJob.lockBox} onChange={(e) => setCurrentJob({ ...currentJob, lockBox: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Super / Name" value={currentJob.superName} onChange={(e) => setCurrentJob({ ...currentJob, superName: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Super / Phone" value={currentJob.superPhone} onChange={(e) => setCurrentJob({ ...currentJob, superPhone: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="email" placeholder="Super / Email" value={currentJob.superEmail} onChange={(e) => setCurrentJob({ ...currentJob, superEmail: e.target.value })} style={{ gridColumn: '1 / -1', padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                </div>

                <div style={{ display: 'flex', gap: '10px' }}>
                  <button onClick={handleSaveJobDefaults} style={{ padding: '8px 16px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Save as Defaults</button>
                  <button onClick={handleApplyDefaults} style={{ padding: '8px 16px', background: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Apply Saved Defaults</button>
                </div>
              </div>
            )}
          </div>

          <div style={{ background: '#e8f8e8', padding: '12px', marginBottom: '20px', borderRadius: '4px', fontSize: '13px', color: '#333' }}>
            <strong>Saved defaults:</strong><br/>
            <div style={{ lineHeight: '1.6' }}>
              <div><strong>Job Code:</strong> {jobDefaults.jobCode || '(none)'}</div>
              <div><strong>Address:</strong> {jobDefaults.jobAddress || '(none)'}</div>
              <div><strong>City/State/Zip:</strong> {jobDefaults.cityStateZip || '(none)'}</div>
              <div><strong>Lock Box:</strong> {jobDefaults.lockBox || '(none)'}</div>
              <div><strong>Super:</strong> {jobDefaults.superName || '(none)'}</div>
              <div><strong>Phone:</strong> {jobDefaults.superPhone || '(none)'}</div>
              <div><strong>Email:</strong> {jobDefaults.superEmail || '(none)'}</div>
            </div>
          </div>

          <div style={{ border: '1px solid #ddd', marginBottom: '20px', borderRadius: '4px' }}>
            <button
              onClick={() => setShowFormFiller(!showFormFiller)}
              style={{
                width: '100%',
                padding: '12px',
                background: '#f5f5f5',
                border: 'none',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: 'bold',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
              }}
            >
              FILL & GENERATE FORM
              {showFormFiller ? <ChevronUp /> : <ChevronDown />}
            </button>

            {showFormFiller && (
              <div style={{ padding: '15px' }}>
                <div style={{ background: '#f9f9f9', padding: '10px', marginBottom: '15px', borderRadius: '4px', fontSize: '13px', color: '#666' }}>
                  <strong>Job Info:</strong> {currentJob.jobCode} | {currentJob.jobAddress} | {currentJob.superName}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                  <input type="text" placeholder="Subcontractor" value={formData.subName} onChange={(e) => setFormData({ ...formData, subName: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Contact" value={formData.contact} onChange={(e) => setFormData({ ...formData, contact: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Phone" value={formData.phone} onChange={(e) => setFormData({ ...formData, phone: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="email" placeholder="Email" value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Sub Code" value={formData.subCode} onChange={(e) => setFormData({ ...formData, subCode: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Category" value={formData.category} onChange={(e) => setFormData({ ...formData, category: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                </div>

                <textarea placeholder="Scope of Work" value={formData.scopeOfWork} onChange={(e) => setFormData({ ...formData, scopeOfWork: e.target.value })} style={{ width: '100%', padding: '8px', border: '1px solid #ccc', borderRadius: '4px', marginBottom: '12px', minHeight: '100px', boxSizing: 'border-box' }} />

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                  <input type="number" placeholder="Contract Amount" value={formData.contractAmount} onChange={(e) => setFormData({ ...formData, contractAmount: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="number" placeholder="Previous Payment" value={formData.previousPayment} onChange={(e) => setFormData({ ...formData, previousPayment: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="number" placeholder="Amount Due" value={formData.amountDue} onChange={(e) => setFormData({ ...formData, amountDue: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                </div>

                <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                  <button onClick={handleGeneratePDF} disabled={generating} style={{ padding: '8px 16px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>
                    {generating ? 'Generating...' : 'Generate & Download PDF'}
                  </button>
                  <button onClick={handleSaveFormToLibrary} disabled={saving} style={{ padding: '8px 16px', background: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>
                    {saving ? 'Saving...' : 'Save to Library'}
                  </button>
                </div>

                <div style={{ borderTop: '1px solid #ddd', paddingTop: '15px' }}>
                  <strong style={{ fontSize: '13px' }}>Search Library</strong>
                  <div style={{ display: 'flex', gap: '10px', marginTop: '10px', marginBottom: '10px' }}>
                    <select value={searchType} onChange={(e) => setSearchType(e.target.value)} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px', fontSize: '13px' }}>
                      <option value="subName">Search by Subcontractor</option>
                      <option value="category">Search by Category</option>
                    </select>
                    <input type="text" placeholder="Enter search term" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ flex: 1, padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                    <button onClick={handleSearch} style={{ padding: '8px 16px', background: '#FF9800', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Search</button>
                  </div>

                  {searchResults.length > 0 && (
                    <div style={{ background: '#f9f9f9', padding: '10px', borderRadius: '4px', fontSize: '13px' }}>
                      <strong>{searchResults.length} results:</strong>
                      {searchResults.map((result) => (
                        <div key={result.id} onClick={() => handleSelectResult(result)} style={{ padding: '8px', background: 'white', border: '1px solid #eee', borderRadius: '3px', marginTop: '5px', cursor: 'pointer' }}>
                          <strong>{result.subName}</strong> | {result.category} | {result.contact}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    console.log('Starting render...');
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      console.log('✓ Render successful');
    } catch (e) {
      console.error('Render error:', e);
      logError('Render failed: ' + e.message);
    }
  </script>
</body>
</html>
