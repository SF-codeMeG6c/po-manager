<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO Manager - Freeman Restoration</title>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <!-- React -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
      authDomain: "po-project-ea1ca.firebaseapp.com",
      projectId: "po-project-ea1ca",
      storageBucket: "po-project-ea1ca.firebasestorage.app",
      messagingSenderId: "589238434084",
      appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Icons
    const ChevronDown = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    );

    const ChevronUp = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    );

    const Trash2 = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    // Auth Screen
    const AuthScreen = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      return (
        <div style={{ maxWidth: '400px', margin: '100px auto', padding: '20px', fontFamily: 'Arial, sans-serif' }}>
          <h1 style={{ textAlign: 'center' }}>Freeman Restoration</h1>
          <h2 style={{ textAlign: 'center', fontSize: '18px', fontWeight: 'normal', color: '#666' }}>PO Manager</h2>

          <form onSubmit={handleAuth} style={{ background: '#f9f9f9', padding: '20px', borderRadius: '4px' }}>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ display: 'block', marginBottom: '5px', fontWeight: 'bold', fontSize: '13px' }}>Email</label>
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                required
                style={{ width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', boxSizing: 'border-box' }}
              />
            </div>

            <div style={{ marginBottom: '15px' }}>
              <label style={{ display: 'block', marginBottom: '5px', fontWeight: 'bold', fontSize: '13px' }}>Password</label>
              <input
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                required
                style={{ width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', boxSizing: 'border-box' }}
              />
            </div>

            {error && <div style={{ color: '#f44336', marginBottom: '15px', fontSize: '13px' }}>{error}</div>}

            <button
              type="submit"
              disabled={loading}
              style={{
                width: '100%',
                padding: '10px',
                background: '#2196F3',
                color: 'white',
                border: 'none',
                borderRadius: '4px',
                cursor: 'pointer',
                fontWeight: 'bold',
                marginBottom: '10px',
              }}
            >
              {loading ? 'Loading...' : isSignUp ? 'Sign Up' : 'Log In'}
            </button>

            <button
              type="button"
              onClick={() => setIsSignUp(!isSignUp)}
              style={{
                width: '100%',
                padding: '10px',
                background: 'transparent',
                color: '#2196F3',
                border: '1px solid #2196F3',
                borderRadius: '4px',
                cursor: 'pointer',
                fontSize: '13px',
              }}
            >
              {isSignUp ? 'Already have an account? Log In' : "Don't have an account? Sign Up"}
            </button>
          </form>
        </div>
      );
    };

    // Main App
    const App = () => {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [jobDefaults, setJobDefaults] = useState({
        jobCode: '',
        jobAddress: '',
        cityStateZip: '',
        lockBox: '',
        superName: '',
        superPhone: '',
        superEmail: '',
      });
      const [currentPO, setCurrentPO] = useState({
        jobCode: '',
        jobAddress: '',
        cityStateZip: '',
        lockBox: '',
        superName: '',
        superPhone: '',
        superEmail: '',
        poNumber: '',
        subName: '',
        subAddress: '',
        subPhone: '',
        subEmail: '',
        subCode: '',
        contractAmount: '',
        previousPayment: '',
        scopeOfWork: '',
      });
      const [subLibrary, setSubLibrary] = useState([]);
      const [showJobDefaults, setShowJobDefaults] = useState(true);
      const [showSubLibrary, setShowSubLibrary] = useState(false);
      const [poCount, setPoCount] = useState({});
      const [saveLibraryName, setSaveLibraryName] = useState('');
      const [saving, setSaving] = useState(false);

      // Auth listener
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return unsubscribe;
      }, []);

      // Load from Firestore
      useEffect(() => {
        if (!user) return;

        const docRef = db.collection('poManagerData').doc(user.uid);
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data.jobDefaults) setJobDefaults(data.jobDefaults);
            if (data.subLibrary) setSubLibrary(data.subLibrary);
            if (data.poCount) setPoCount(data.poCount);
          }
        });

        return unsubscribe;
      }, [user]);

      // Save to Firestore
      const saveToFirestore = async (data) => {
        if (!user) return;
        setSaving(true);
        try {
          await db.collection('poManagerData').doc(user.uid).set(data, { merge: true });
        } catch (err) {
          console.error('Save error:', err);
        }
        setSaving(false);
      };

      const applyJobDefaults = () => {
        setCurrentPO({
          ...currentPO,
          jobCode: jobDefaults.jobCode,
          jobAddress: jobDefaults.jobAddress,
          cityStateZip: jobDefaults.cityStateZip,
          lockBox: jobDefaults.lockBox,
          superName: jobDefaults.superName,
          superPhone: jobDefaults.superPhone,
          superEmail: jobDefaults.superEmail,
        });
      };

      const handleSaveJobDefaults = async () => {
        const newDefaults = {
          jobCode: currentPO.jobCode,
          jobAddress: currentPO.jobAddress,
          cityStateZip: currentPO.cityStateZip,
          lockBox: currentPO.lockBox,
          superName: currentPO.superName,
          superPhone: currentPO.superPhone,
          superEmail: currentPO.superEmail,
        };
        setJobDefaults(newDefaults);
        await saveToFirestore({ jobDefaults: newDefaults });
        alert('Job defaults saved');
      };

      const generatePONumber = async (jobCode) => {
        const newCount = (poCount[jobCode] || 0) + 1;
        const updated = { ...poCount, [jobCode]: newCount };
        setPoCount(updated);
        await saveToFirestore({ poCount: updated });
        return `${jobCode}-${String(newCount).padStart(3, '0')}`;
      };

      const handleJobCodeChange = async (e) => {
        const newJobCode = e.target.value;
        setCurrentPO({ ...currentPO, jobCode: newJobCode });
        if (newJobCode && newJobCode !== '') {
          const poNum = await generatePONumber(newJobCode);
          setCurrentPO(prev => ({ ...prev, poNumber: poNum }));
        }
      };

      const loadSubFromLibrary = (sub) => {
        setCurrentPO({
          ...currentPO,
          subName: sub.subName,
          subAddress: sub.subAddress,
          subPhone: sub.subPhone,
          subEmail: sub.subEmail,
          subCode: sub.subCode,
          contractAmount: sub.contractAmount,
          scopeOfWork: sub.scopeOfWork,
          previousPayment: '',
        });
        setShowSubLibrary(false);
      };

      const handleSaveToLibrary = async () => {
        if (!saveLibraryName.trim()) {
          alert('Please enter a name for this library entry');
          return;
        }
        if (!currentPO.subName) {
          alert('Please fill in subcontractor name');
          return;
        }

        const newEntry = {
          id: Date.now(),
          name: saveLibraryName,
          subName: currentPO.subName,
          subAddress: currentPO.subAddress,
          subPhone: currentPO.subPhone,
          subEmail: currentPO.subEmail,
          subCode: currentPO.subCode,
          contractAmount: currentPO.contractAmount,
          scopeOfWork: currentPO.scopeOfWork,
        };

        const updated = [...subLibrary, newEntry];
        setSubLibrary(updated);
        await saveToFirestore({ subLibrary: updated });
        setSaveLibraryName('');
        alert('Saved to library');
      };

      const deleteFromLibrary = async (id) => {
        const updated = subLibrary.filter(item => item.id !== id);
        setSubLibrary(updated);
        await saveToFirestore({ subLibrary: updated });
      };

      const clearSubcontractorSection = () => {
        setCurrentPO({
          ...currentPO,
          subName: '',
          subAddress: '',
          subPhone: '',
          subEmail: '',
          subCode: '',
          contractAmount: '',
          previousPayment: '',
          scopeOfWork: '',
        });
      };

      const calculateAmountDue = () => {
        const contract = parseFloat(currentPO.contractAmount) || 0;
        const previous = parseFloat(currentPO.previousPayment) || 0;
        return (contract - previous).toFixed(2);
      };

      if (authLoading) {
        return <div style={{ textAlign: 'center', padding: '40px', fontFamily: 'Arial, sans-serif' }}>Loading...</div>;
      }

      if (!user) {
        return <AuthScreen />;
      }

      return (
        <div style={{ maxWidth: '900px', margin: '0 auto', padding: '20px', fontFamily: 'Arial, sans-serif' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px', paddingBottom: '20px', borderBottom: '1px solid #eee' }}>
            <div>
              <h1 style={{ margin: '0 0 5px 0' }}>Freeman Restoration - PO Manager</h1>
              <div style={{ fontSize: '12px', color: '#999' }}>{user.email}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {saving && <div style={{ fontSize: '12px', color: '#2196F3' }}>Saving...</div>}
              <button
                onClick={() => auth.signOut()}
                style={{
                  padding: '8px 16px',
                  background: '#999',
                  color: 'white',
                  border: 'none',
                  borderRadius: '4px',
                  cursor: 'pointer',
                  fontSize: '13px',
                }}
              >
                Logout
              </button>
            </div>
          </div>

          {/* JOB DEFAULTS */}
          <div style={{ border: '1px solid #ddd', marginBottom: '20px', borderRadius: '4px' }}>
            <button
              onClick={() => setShowJobDefaults(!showJobDefaults)}
              style={{
                width: '100%',
                padding: '12px',
                background: '#f5f5f5',
                border: 'none',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: 'bold',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
              }}
            >
              JOB HEADER DEFAULTS
              {showJobDefaults ? <ChevronUp size={18} /> : <ChevronDown size={18} />}
            </button>

            {showJobDefaults && (
              <div style={{ padding: '15px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                  <input type="text" placeholder="Job Code" value={currentPO.jobCode} onChange={handleJobCodeChange} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Job Address" value={currentPO.jobAddress} onChange={(e) => setCurrentPO({ ...currentPO, jobAddress: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="City / State / Zip" value={currentPO.cityStateZip} onChange={(e) => setCurrentPO({ ...currentPO, cityStateZip: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Lock Box" value={currentPO.lockBox} onChange={(e) => setCurrentPO({ ...currentPO, lockBox: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Super / Name" value={currentPO.superName} onChange={(e) => setCurrentPO({ ...currentPO, superName: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Super / Phone" value={currentPO.superPhone} onChange={(e) => setCurrentPO({ ...currentPO, superPhone: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="email" placeholder="Super / Email" value={currentPO.superEmail} onChange={(e) => setCurrentPO({ ...currentPO, superEmail: e.target.value })} style={{ gridColumn: '1 / -1', padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                </div>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button onClick={handleSaveJobDefaults} style={{ padding: '8px 16px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Save as Defaults</button>
                  <button onClick={applyJobDefaults} style={{ padding: '8px 16px', background: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Apply Saved Defaults</button>
                </div>
              </div>
            )}
          </div>

          {/* PO NUMBER */}
          <div style={{ background: '#e8f4f8', padding: '12px', marginBottom: '20px', borderRadius: '4px', textAlign: 'center', fontSize: '18px', fontWeight: 'bold' }}>
            PO#: {currentPO.poNumber || '(auto-generated)'}
          </div>

          {/* SUBCONTRACTOR */}
          <div style={{ border: '1px solid #ddd', marginBottom: '20px', borderRadius: '4px', padding: '15px' }}>
            <h3 style={{ marginTop: 0, marginBottom: '15px' }}>SUBCONTRACTOR DETAILS</h3>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
              <input type="text" placeholder="Subcontractor" value={currentPO.subName} onChange={(e) => setCurrentPO({ ...currentPO, subName: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <input type="text" placeholder="Address" value={currentPO.subAddress} onChange={(e) => setCurrentPO({ ...currentPO, subAddress: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <input type="text" placeholder="Phone / Contact" value={currentPO.subPhone} onChange={(e) => setCurrentPO({ ...currentPO, subPhone: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <input type="email" placeholder="Email" value={currentPO.subEmail} onChange={(e) => setCurrentPO({ ...currentPO, subEmail: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <input type="text" placeholder="Sub Code / CAT / Type" value={currentPO.subCode} onChange={(e) => setCurrentPO({ ...currentPO, subCode: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <input type="number" placeholder="Contract Amount" value={currentPO.contractAmount} onChange={(e) => setCurrentPO({ ...currentPO, contractAmount: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <input type="number" placeholder="Previous Payment" value={currentPO.previousPayment} onChange={(e) => setCurrentPO({ ...currentPO, previousPayment: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
              <div style={{ padding: '8px', background: '#f9f9f9', borderRadius: '4px', fontSize: '14px', fontWeight: 'bold' }}>Amount Due: ${calculateAmountDue()}</div>
            </div>

            <label style={{ display: 'block', marginBottom: '8px', fontWeight: 'bold', fontSize: '13px' }}>Scope of Work</label>
            <textarea placeholder="Enter scope of work details..." value={currentPO.scopeOfWork} onChange={(e) => setCurrentPO({ ...currentPO, scopeOfWork: e.target.value })} style={{ width: '100%', height: '150px', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', fontFamily: 'Arial, sans-serif', fontSize: '13px', marginBottom: '12px', boxSizing: 'border-box' }} />

            <div style={{ background: '#f5f5f5', padding: '12px', borderRadius: '4px', marginBottom: '12px' }}>
              <label style={{ display: 'block', marginBottom: '8px', fontWeight: 'bold', fontSize: '13px' }}>Save to Subcontractor Library</label>
              <div style={{ display: 'flex', gap: '8px' }}>
                <input type="text" placeholder="Enter library entry name (e.g., 'Acme Electric - Standard')" value={saveLibraryName} onChange={(e) => setSaveLibraryName(e.target.value)} style={{ flex: 1, padding: '8px', border: '1px solid #ccc', borderRadius: '4px', fontSize: '13px' }} />
                <button onClick={handleSaveToLibrary} style={{ padding: '8px 16px', background: '#FF9800', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Save to Library</button>
              </div>
            </div>

            <button onClick={clearSubcontractorSection} style={{ padding: '8px 16px', background: '#f44336', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Clear Subcontractor</button>
          </div>

          {/* LIBRARY */}
          <div style={{ border: '1px solid #ddd', borderRadius: '4px' }}>
            <button onClick={() => setShowSubLibrary(!showSubLibrary)} style={{ width: '100%', padding: '12px', background: '#f5f5f5', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: 'bold', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              SUBCONTRACTOR LIBRARY ({subLibrary.length})
              {showSubLibrary ? <ChevronUp size={18} /> : <ChevronDown size={18} />}
            </button>

            {showSubLibrary && (
              <div style={{ padding: '15px' }}>
                {subLibrary.length === 0 ? (
                  <p style={{ color: '#999', fontSize: '13px' }}>No saved subcontractors yet</p>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {subLibrary.map((sub) => (
                      <div key={sub.id} style={{ border: '1px solid #ddd', padding: '10px', borderRadius: '4px', background: '#f9f9f9' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
                          <div>
                            <div style={{ fontWeight: 'bold', marginBottom: '4px' }}>{sub.name}</div>
                            <div style={{ fontSize: '12px', color: '#666' }}>{sub.subName}</div>
                          </div>
                          <div style={{ display: 'flex', gap: '8px' }}>
                            <button onClick={() => loadSubFromLibrary(sub)} style={{ padding: '6px 12px', background: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}>Load</button>
                            <button onClick={() => deleteFromLibrary(sub.id)} style={{ padding: '6px 8px', background: '#f44336', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}><Trash2 size={14} /></button>
                          </div>
                        </div>
                        <div style={{ fontSize: '12px', color: '#666', lineHeight: '1.4' }}>
                          <div>{sub.subPhone}</div>
                          <div>{sub.subEmail}</div>
                          {sub.contractAmount && <div>Standard Amount: ${sub.contractAmount}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
