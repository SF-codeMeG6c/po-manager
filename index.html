<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Manager - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; width: 100%; margin-top: 8px; }
        .btn-secondary:hover { background: #e0e0e0; }
        .saved-box { background: #e6f3e6; border: 1px solid #4caf50; border-radius: 4px; padding: 12px; margin-top: 15px; font-size: 13px; color: #2e7d32; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }
        .success { color: #388e3c; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PO Manager</h1>
        <p class="subtitle">Freeman Restoration Subcontractor Scope of Work</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PDFDocument } = PDFLib;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function POManager() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login');

            const [jobDefaults, setJobDefaults] = useState({
                jobCode: '',
                jobAddress: '',
                cityStateZip: '',
                lockBox: '',
                superName: '',
                superPhone: '',
                superEmail: '',
            });

            const [savedDefaults, setSavedDefaults] = useState(null);
            const [message, setMessage] = useState('');

            useEffect(() => {
                auth.onAuthStateChanged((currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        loadJobDefaults(currentUser.uid);
                    } else {
                        setUser(null);
                    }
                });
            }, []);

            const loadJobDefaults = (uid) => {
                db.collection('poManagerData').doc(uid).onSnapshot((doc) => {
                    if (doc.exists && doc.data().jobDefaults) {
                        setSavedDefaults(doc.data().jobDefaults);
                    }
                }, (error) => {
                    console.error('Firestore error:', error.message);
                });
            };

            const handleSignUp = async () => {
                setAuthError('');
                try {
                    await auth.createUserWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                    setAuthMode('login');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogin = async () => {
                setAuthError('');
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                setJobDefaults({
                    jobCode: '',
                    jobAddress: '',
                    cityStateZip: '',
                    lockBox: '',
                    superName: '',
                    superPhone: '',
                    superEmail: '',
                });
                setSavedDefaults(null);
            };

            const handleJobDefaultChange = (field, value) => {
                setJobDefaults(prev => ({ ...prev, [field]: value }));
            };

            const handleSaveDefaults = async () => {
                if (!user) return;
                setMessage('');
                try {
                    await db.collection('poManagerData').doc(user.uid).set(
                        { jobDefaults },
                        { merge: true }
                    );
                    setMessage('✓ Job defaults saved!');
                    setTimeout(() => setMessage(''), 3000);
                } catch (error) {
                    setMessage('Error saving: ' + error.message);
                }
            };

            const handleApplyDefaults = () => {
                if (savedDefaults) {
                    setJobDefaults(savedDefaults);
                    setMessage('✓ Defaults applied');
                    setTimeout(() => setMessage(''), 2000);
                }
            };

            const handleGeneratePDF = async () => {
                setMessage('');
                try {
                    const pdfUrl = 'https://charming-griffin-e1112f.netlify.app/Sub_Spec_Blank_9-20-26_V2.pdf';
                    
                    const response = await fetch(pdfUrl);
                    if (!response.ok) throw new Error('Failed to fetch PDF');
                    
                    const pdfBytes = await response.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(pdfBytes);
                    const form = pdfDoc.getForm();

                    // Fill form fields by name
                    try { form.getField('Job Code').setText(jobDefaults.jobCode); } catch (e) {}
                    try { form.getField('Job Address').setText(jobDefaults.jobAddress); } catch (e) {}
                    try { form.getField('City / State / Zip').setText(jobDefaults.cityStateZip); } catch (e) {}
                    try { form.getField('Lock Box').setText(jobDefaults.lockBox); } catch (e) {}
                    try { form.getField('Super').setText(jobDefaults.superName); } catch (e) {}
                    try { form.getField('Super Phone').setText(jobDefaults.superPhone); } catch (e) {}
                    try { form.getField('Email').setText(jobDefaults.superEmail); } catch (e) {}

                    form.flatten();

                    const pdfOutput = await pdfDoc.save();
                    const blob = new Blob([pdfOutput], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `PO_${jobDefaults.jobCode || 'blank'}_${new Date().toISOString().split('T')[0]}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    setMessage('✓ PDF downloaded successfully!');
                    setTimeout(() => setMessage(''), 3000);
                } catch (error) {
                    console.error('PDF generation error:', error);
                    setMessage('Error generating PDF: ' + error.message);
                }
            };

            if (!user) {
                return (
                    <div>
                        <div className="section">
                            <div className="section-title">
                                {authMode === 'login' ? 'Login' : 'Create Account'}
                            </div>
                            <div className="form-group">
                                <label>Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="your@email.com"
                                />
                            </div>
                            <div className="form-group">
                                <label>Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="••••••••"
                                />
                            </div>
                            {authError && <div className="error">{authError}</div>}
                            <button
                                className="btn-primary"
                                onClick={authMode === 'login' ? handleLogin : handleSignUp}
                            >
                                {authMode === 'login' ? 'Login' : 'Create Account'}
                            </button>
                            <button
                                className="btn-secondary"
                                onClick={() => {
                                    setAuthMode(authMode === 'login' ? 'signup' : 'login');
                                    setAuthError('');
                                }}
                            >
                                {authMode === 'login' ? 'Need an account?' : 'Already have an account?'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                            <div className="section-title">JOB HEADER DEFAULTS</div>
                            <button
                                className="btn-secondary"
                                onClick={handleLogout}
                                style={{ width: 'auto', marginTop: 0 }}
                            >
                                Logout
                            </button>
                        </div>

                        <div className="form-group">
                            <label>Job Code</label>
                            <input
                                type="text"
                                value={jobDefaults.jobCode}
                                onChange={(e) => handleJobDefaultChange('jobCode', e.target.value)}
                                placeholder="e.g., Stark W 2602"
                            />
                        </div>

                        <div className="form-group">
                            <label>Job Address</label>
                            <input
                                type="text"
                                value={jobDefaults.jobAddress}
                                onChange={(e) => handleJobDefaultChange('jobAddress', e.target.value)}
                                placeholder="Street address"
                            />
                        </div>

                        <div className="form-group">
                            <label>City / State / Zip</label>
                            <input
                                type="text"
                                value={jobDefaults.cityStateZip}
                                onChange={(e) => handleJobDefaultChange('cityStateZip', e.target.value)}
                                placeholder="City, State ZIP"
                            />
                        </div>

                        <div className="form-group">
                            <label>Lock Box</label>
                            <input
                                type="text"
                                value={jobDefaults.lockBox}
                                onChange={(e) => handleJobDefaultChange('lockBox', e.target.value)}
                                placeholder="Lock box #"
                            />
                        </div>

                        <div className="form-group">
                            <label>Super Name</label>
                            <input
                                type="text"
                                value={jobDefaults.superName}
                                onChange={(e) => handleJobDefaultChange('superName', e.target.value)}
                                placeholder="Supervisor name"
                            />
                        </div>

                        <div className="form-group">
                            <label>Super Phone</label>
                            <input
                                type="text"
                                value={jobDefaults.superPhone}
                                onChange={(e) => handleJobDefaultChange('superPhone', e.target.value)}
                                placeholder="Phone"
                            />
                        </div>

                        <div className="form-group">
                            <label>Super Email</label>
                            <input
                                type="email"
                                value={jobDefaults.superEmail}
                                onChange={(e) => handleJobDefaultChange('superEmail', e.target.value)}
                                placeholder="Email"
                            />
                        </div>

                        <button className="btn-primary" onClick={handleSaveDefaults}>Save as Defaults</button>
                        {savedDefaults && (
                            <div className="saved-box">
                                <strong>✓ Saved defaults:</strong><br/>
                                Job Code: {savedDefaults.jobCode}<br/>
                                Address: {savedDefaults.jobAddress}<br/>
                                City/State/Zip: {savedDefaults.cityStateZip}<br/>
                                Lock Box: {savedDefaults.lockBox}<br/>
                                Super: {savedDefaults.superName} | {savedDefaults.superPhone}
                            </div>
                        )}
                    </div>

                    <div className="section">
                        <div className="section-title">FILL & GENERATE FORM</div>
                        <div style={{ background: '#f9f9f9', padding: '12px', borderRadius: '4px', marginBottom: '15px', fontSize: '13px', color: '#666' }}>
                            <strong>Current Job:</strong> {jobDefaults.jobCode || '(no code set)'} | {jobDefaults.jobAddress || '(no address)'}<br/>
                            Fill in the fields above, then generate the PDF below. Subcontractor details will be entered on the PDF form.
                        </div>
                        <button className="btn-primary" onClick={handleGeneratePDF}>Generate & Download PDF</button>
                        {savedDefaults && (
                            <button className="btn-secondary" onClick={handleApplyDefaults}>Apply Saved Defaults</button>
                        )}
                    </div>

                    {message && (
                        <div className={message.includes('Error') ? 'error' : 'success'} style={{ marginTop: '15px', padding: '10px', textAlign: 'center' }}>
                            {message}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<POManager />, document.getElementById('app'));
    </script>
</body>
</html>
