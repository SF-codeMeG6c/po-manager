<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO Manager - Freeman Restoration</title>
</head>
<body>
  <div id="root"></div>

  <!-- React -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    console.log('Script loaded');
    console.log('Firebase available:', typeof firebase !== 'undefined');
    
    // Firebase setup
    let auth = null, db = null;
    try {
      if (typeof firebase !== 'undefined' && (!firebase.apps || !firebase.apps.length)) {
        firebase.initializeApp({
          apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
          authDomain: "po-project-ea1ca.firebaseapp.com",
          projectId: "po-project-ea1ca",
          storageBucket: "po-project-ea1ca.firebasestorage.app",
          messagingSenderId: "589238434084",
          appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        });
        auth = firebase.auth();
        db = firebase.firestore();
        console.log('Firebase initialized');
      }
    } catch (e) {
      console.error('Firebase error:', e);
    }

    const App = () => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      useEffect(() => {
        if (!auth) {
          setLoading(false);
          return;
        }
        try {
          auth.onAuthStateChanged(setUser);
        } catch (e) {
          console.error('Auth error:', e);
        }
        setLoading(false);
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!auth) {
          setError('Firebase not available');
          return;
        }
        try {
          await auth.signInWithEmailAndPassword(email, password);
        } catch (e) {
          setError(e.message);
        }
      };

      if (loading) return <div style={{ padding: '20px' }}>Loading...</div>;

      if (!user) {
        return (
          <div style={{ maxWidth: '400px', margin: '100px auto', padding: '20px', fontFamily: 'Arial' }}>
            <h1>Freeman Restoration</h1>
            <h2>PO Manager</h2>
            <form onSubmit={handleLogin} style={{ background: '#f9f9f9', padding: '20px' }}>
              <input
                type="email"
                placeholder="Email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                style={{ width: '100%', padding: '10px', marginBottom: '10px', boxSizing: 'border-box' }}
              />
              <input
                type="password"
                placeholder="Password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                style={{ width: '100%', padding: '10px', marginBottom: '10px', boxSizing: 'border-box' }}
              />
              {error && <div style={{ color: 'red', marginBottom: '10px' }}>{error}</div>}
              <button type="submit" style={{ width: '100%', padding: '10px', background: '#2196F3', color: 'white', border: 'none' }}>
                Log In
              </button>
            </form>
          </div>
        );
      }

      return (
        <div style={{ maxWidth: '900px', margin: '0 auto', padding: '20px' }}>
          <h1>Freeman Restoration - PO Manager</h1>
          <p>Logged in as: {user.email}</p>
          <button onClick={() => auth.signOut()} style={{ padding: '10px 20px' }}>Logout</button>
          <p style={{ color: 'green' }}>✓ App is working! Full PO Manager coming soon...</p>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
