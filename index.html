<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Manager - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #999; margin-bottom: 25px; font-size: 12px; }
        .section { margin-bottom: 25px; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 500; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 12px; margin-top: 0; }
        .message { margin-top: 12px; padding: 8px; text-align: center; font-size: 12px; }
        .message.success { color: #388e3c; }
        .message.error { color: #d32f2f; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PO Manager</h1>
        <p class="subtitle">Freeman Restoration</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PDFDocument, rgb } = PDFLib;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let poCounters = {};

        function POApp() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login');
            
            const [jobCode, setJobCode] = useState('');
            const [jobAddress, setJobAddress] = useState('');
            const [cityStateZip, setCityStateZip] = useState('');
            const [lockBox, setLockBox] = useState('');
            const [superName, setSuperName] = useState('');
            const [superPhone, setSuperPhone] = useState('');
            const [superEmail, setSuperEmail] = useState('');
            
            const [currentPO, setCurrentPO] = useState('');
            const [message, setMessage] = useState('');
            const [savedDefaults, setSavedDefaults] = useState(null);

            useEffect(() => {
                auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    if (currentUser) {
                        loadDefaults(currentUser.uid);
                    }
                });
            }, []);

            const loadDefaults = (uid) => {
                db.collection('poManagerData').doc(uid).onSnapshot(doc => {
                    if (doc.exists && doc.data().jobDefaults) {
                        setSavedDefaults(doc.data().jobDefaults);
                    }
                });
            };

            const handleLogin = async () => {
                setAuthError('');
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleSignUp = async () => {
                setAuthError('');
                try {
                    await auth.createUserWithEmailAndPassword(email, password);
                    setEmail('');
                    setPassword('');
                    setAuthMode('login');
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                setJobCode('');
                setJobAddress('');
                setCityStateZip('');
                setLockBox('');
                setSuperName('');
                setSuperPhone('');
                setSuperEmail('');
                setCurrentPO('');
                setSavedDefaults(null);
                poCounters = {};
            };

            const handleSaveDefaults = async () => {
                if (!user) return;
                try {
                    await db.collection('poManagerData').doc(user.uid).set({
                        jobDefaults: {
                            jobCode,
                            jobAddress,
                            cityStateZip,
                            lockBox,
                            superName,
                            superPhone,
                            superEmail
                        }
                    }, { merge: true });
                    setMessage('Saved');
                    setTimeout(() => setMessage(''), 2000);
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            const handleApplyDefaults = () => {
                if (savedDefaults) {
                    setJobCode(savedDefaults.jobCode);
                    setJobAddress(savedDefaults.jobAddress);
                    setCityStateZip(savedDefaults.cityStateZip);
                    setLockBox(savedDefaults.lockBox);
                    setSuperName(savedDefaults.superName);
                    setSuperPhone(savedDefaults.superPhone);
                    setSuperEmail(savedDefaults.superEmail);
                    setMessage('Applied');
                    setTimeout(() => setMessage(''), 1500);
                }
            };

            const handleGeneratePDF = async () => {
                setMessage('Generating...');
                try {
                    if (!jobCode) {
                        setMessage('Job Code required');
                        return;
                    }

                    const formatted = jobCode.replace(/\s+/g, '.');
                    
                    if (!poCounters[formatted]) {
                        poCounters[formatted] = 0;
                    }
                    
                    poCounters[formatted]++;
                    const padded = String(poCounters[formatted]).padStart(3, '0');
                    const po = formatted + '-' + padded;
                    setCurrentPO(po);

                    const resp = await fetch('https://charming-griffin-e1112f.netlify.app/Sub_Spec_Blank_9-20-26_V2.pdf');
                    if (!resp.ok) throw new Error('PDF fetch failed');
                    
                    const bytes = await resp.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(bytes);
                    const page = pdfDoc.getPages()[0];

                    const data = [
                        { text: jobCode, x: 81, y: 671 },
                        { text: jobAddress, x: 369, y: 671 },
                        { text: cityStateZip, x: 126, y: 653 },
                        { text: lockBox, x: 360, y: 653 },
                        { text: po, x: 486, y: 653 },
                        { text: superName, x: 81, y: 635 },
                        { text: superPhone, x: 495, y: 635 },
                        { text: superEmail, x: 243, y: 635 }
                    ];

                    data.forEach(item => {
                        if (item.text) {
                            page.drawText(item.text, { x: item.x, y: item.y, size: 11, color: rgb(0, 0, 0) });
                        }
                    });

                    const output = await pdfDoc.save();
                    const blob = new Blob([output], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'PO_' + po + '.pdf';
                    link.click();
                    URL.revokeObjectURL(url);

                    setMessage('Downloaded: ' + po);
                    setTimeout(() => setMessage(''), 2000);
                } catch (error) {
                    setMessage('Error: ' + error.message);
                }
            };

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">{authMode === 'login' ? 'Login' : 'Sign Up'}</div>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
                        </div>
                        {authError && <div className="message error">{authError}</div>}
                        <button className="btn-primary" onClick={authMode === 'login' ? handleLogin : handleSignUp}>
                            {authMode === 'login' ? 'Login' : 'Create Account'}
                        </button>
                        <button className="btn-secondary" onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')}>
                            {authMode === 'login' ? 'Need account?' : 'Have account?'}
                        </button>
                    </div>
                );
            }

            return (
                <div>
                    <div className="header">
                        <div></div>
                        <button className="btn-secondary btn-small" onClick={handleLogout}>Logout</button>
                    </div>

                    <div className="section">
                        <div className="section-title">Job Defaults</div>

                        <div className="form-group">
                            <label>Job Code</label>
                            <input value={jobCode} onChange={e => setJobCode(e.target.value)} placeholder="Stark W 2602" />
                        </div>
                        <div className="form-group">
                            <label>Job Address</label>
                            <input value={jobAddress} onChange={e => setJobAddress(e.target.value)} placeholder="Street address" />
                        </div>
                        <div className="form-group">
                            <label>City / State / Zip</label>
                            <input value={cityStateZip} onChange={e => setCityStateZip(e.target.value)} placeholder="City, State ZIP" />
                        </div>
                        <div className="form-group">
                            <label>Lock Box</label>
                            <input value={lockBox} onChange={e => setLockBox(e.target.value)} placeholder="Lock box #" />
                        </div>
                        <div className="form-group">
                            <label>Super Name</label>
                            <input value={superName} onChange={e => setSuperName(e.target.value)} placeholder="Supervisor name" />
                        </div>
                        <div className="form-group">
                            <label>Super Phone</label>
                            <input value={superPhone} onChange={e => setSuperPhone(e.target.value)} placeholder="Phone" />
                        </div>
                        <div className="form-group">
                            <label>Super Email</label>
                            <input value={superEmail} onChange={e => setSuperEmail(e.target.value)} placeholder="Email" />
                        </div>

                        <button className="btn-primary" onClick={handleSaveDefaults}>Save Defaults</button>
                        {savedDefaults && <button className="btn-secondary" onClick={handleApplyDefaults}>Apply Saved</button>}
                    </div>

                    <div className="section">
                        <div className="section-title">Generate PO</div>
                        <div style={{ fontSize: '13px', color: '#666', marginBottom: '12px' }}>
                            {jobCode && currentPO && <>PO: <strong>{currentPO}</strong></>}
                        </div>
                        <button className="btn-primary" onClick={handleGeneratePDF}>Generate & Download PDF</button>
                    </div>

                    {message && <div className={`message ${message.includes('Error') ? 'error' : 'success'}`}>{message}</div>}
                </div>
            );
        }

        ReactDOM.render(<POApp />, document.getElementById('app'));
    </script>
</body>
</html>
