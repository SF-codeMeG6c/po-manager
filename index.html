<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO Manager - Freeman Restoration</title>
</head>
<body>
  <div id="root" style="font-family: Arial; padding: 20px;"></div>
  <div id="errors" style="background: #fee; padding: 10px; margin: 10px 0; border: 1px solid #f88; display: none; color: red; font-size: 12px;"></div>

  <script>
    const errorDiv = document.getElementById('errors');
    function logError(msg) {
      console.error(msg);
      const p = document.createElement('p');
      p.textContent = msg;
      errorDiv.appendChild(p);
      errorDiv.style.display = 'block';
    }
    window.onerror = (msg, url, line) => logError(`JS Error L${line}: ${msg}`);
  </script>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    console.log('✓ React loaded');
    
    let auth = null, db = null;
    try {
      if (typeof firebase !== 'undefined' && (!firebase.apps || !firebase.apps.length)) {
        firebase.initializeApp({
          apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
          authDomain: "po-project-ea1ca.firebaseapp.com",
          projectId: "po-project-ea1ca",
          storageBucket: "po-project-ea1ca.firebasestorage.app",
          messagingSenderId: "589238434084",
          appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        });
        auth = firebase.auth();
        db = firebase.firestore();
        console.log('✓ Firebase initialized');
      }
    } catch (e) {
      console.error('Firebase error:', e);
      logError('Firebase init failed: ' + e.message);
    }

    const ChevronDown = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    );

    const ChevronUp = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    );

    const AuthScreen = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      return (
        <div style={{ maxWidth: '400px', margin: '100px auto', padding: '20px' }}>
          <h1 style={{ textAlign: 'center' }}>Freeman Restoration</h1>
          <h2 style={{ textAlign: 'center', fontSize: '18px', fontWeight: 'normal', color: '#666' }}>PO Manager</h2>
          <form onSubmit={handleAuth} style={{ background: '#f9f9f9', padding: '20px', borderRadius: '4px' }}>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ display: 'block', marginBottom: '5px', fontWeight: 'bold', fontSize: '13px' }}>Email</label>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required style={{ width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', boxSizing: 'border-box' }} />
            </div>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ display: 'block', marginBottom: '5px', fontWeight: 'bold', fontSize: '13px' }}>Password</label>
              <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required style={{ width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', boxSizing: 'border-box' }} />
            </div>
            {error && <div style={{ color: '#f44336', marginBottom: '15px', fontSize: '13px' }}>{error}</div>}
            <button type="submit" disabled={loading} style={{ width: '100%', padding: '10px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold', marginBottom: '10px' }}>
              {loading ? 'Loading...' : isSignUp ? 'Sign Up' : 'Log In'}
            </button>
            <button type="button" onClick={() => setIsSignUp(!isSignUp)} style={{ width: '100%', padding: '10px', background: 'transparent', color: '#2196F3', border: '1px solid #2196F3', borderRadius: '4px', cursor: 'pointer', fontSize: '13px' }}>
              {isSignUp ? 'Already have an account? Log In' : "Don't have an account? Sign Up"}
            </button>
          </form>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [showJobDefaults, setShowJobDefaults] = useState(true);
      const [saving, setSaving] = useState(false);
      
      const [jobDefaults, setJobDefaults] = useState({
        jobCode: '',
        jobAddress: '',
        cityStateZip: '',
        lockBox: '',
        superName: '',
        superPhone: '',
        superEmail: '',
      });

      const [currentJob, setCurrentJob] = useState({
        jobCode: '',
        jobAddress: '',
        cityStateZip: '',
        lockBox: '',
        superName: '',
        superPhone: '',
        superEmail: '',
      });

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => { 
          console.log('Auth state changed:', currentUser?.email);
          setUser(currentUser); 
          setAuthLoading(false); 
        });
        return unsubscribe;
      }, []);

      useEffect(() => {
        if (!user || !db) {
          console.log('Skipping Firestore load - user:', !!user, 'db:', !!db);
          return;
        }
        console.log('Setting up Firestore listener for user:', user.uid);
        
        const unsubscribe = db.collection('poManagerData').doc(user.uid).onSnapshot(
          (doc) => {
            console.log('Firestore snapshot received');
            if (doc.exists && doc.data().jobDefaults) {
              console.log('Loading job defaults:', doc.data().jobDefaults);
              setJobDefaults(doc.data().jobDefaults);
            }
          },
          (error) => {
            console.error('Firestore listener error:', error);
            logError('Firestore error: ' + error.message);
          }
        );
        
        return unsubscribe;
      }, [user]);

      const handleSaveJobDefaults = async () => {
        console.log('Saving job defaults:', currentJob);
        if (!user || !db) {
          alert('Not connected to database');
          return;
        }
        setSaving(true);
        try {
          await db.collection('poManagerData').doc(user.uid).set({ jobDefaults: currentJob }, { merge: true });
          console.log('Defaults saved');
          alert('Job defaults saved');
        } catch (err) {
          console.error('Save error:', err);
          logError('Save failed: ' + err.message);
        }
        setSaving(false);
      };

      const handleApplyDefaults = () => {
        console.log('Applying defaults:', jobDefaults);
        setCurrentJob(jobDefaults);
      };

      if (authLoading) return <div style={{ textAlign: 'center', padding: '40px' }}>Loading...</div>;
      if (!user) return <AuthScreen />;

      return (
        <div style={{ maxWidth: '900px', margin: '0 auto', padding: '20px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px', paddingBottom: '20px', borderBottom: '1px solid #eee' }}>
            <div>
              <h1 style={{ margin: '0 0 5px 0' }}>Freeman Restoration - PO Manager</h1>
              <div style={{ fontSize: '12px', color: '#999' }}>Step 1: Job Defaults</div>
              <div style={{ fontSize: '12px', color: '#999' }}>{user.email}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {saving && <div style={{ fontSize: '12px', color: '#2196F3' }}>Saving...</div>}
              <button onClick={() => auth.signOut()} style={{ padding: '8px 16px', background: '#999', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px' }}>Logout</button>
            </div>
          </div>

          <div style={{ border: '1px solid #ddd', marginBottom: '20px', borderRadius: '4px' }}>
            <button
              onClick={() => setShowJobDefaults(!showJobDefaults)}
              style={{
                width: '100%',
                padding: '12px',
                background: '#f5f5f5',
                border: 'none',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: 'bold',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
              }}
            >
              JOB HEADER DEFAULTS
              {showJobDefaults ? <ChevronUp /> : <ChevronDown />}
            </button>

            {showJobDefaults && (
              <div style={{ padding: '15px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                  <input type="text" placeholder="Job Code" value={currentJob.jobCode} onChange={(e) => setCurrentJob({ ...currentJob, jobCode: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Job Address" value={currentJob.jobAddress} onChange={(e) => setCurrentJob({ ...currentJob, jobAddress: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="City / State / Zip" value={currentJob.cityStateZip} onChange={(e) => setCurrentJob({ ...currentJob, cityStateZip: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Lock Box" value={currentJob.lockBox} onChange={(e) => setCurrentJob({ ...currentJob, lockBox: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Super / Name" value={currentJob.superName} onChange={(e) => setCurrentJob({ ...currentJob, superName: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="text" placeholder="Super / Phone" value={currentJob.superPhone} onChange={(e) => setCurrentJob({ ...currentJob, superPhone: e.target.value })} style={{ padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                  <input type="email" placeholder="Super / Email" value={currentJob.superEmail} onChange={(e) => setCurrentJob({ ...currentJob, superEmail: e.target.value })} style={{ gridColumn: '1 / -1', padding: '8px', border: '1px solid #ccc', borderRadius: '4px' }} />
                </div>

                <div style={{ display: 'flex', gap: '10px' }}>
                  <button onClick={handleSaveJobDefaults} style={{ padding: '8px 16px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Save as Defaults</button>
                  <button onClick={handleApplyDefaults} style={{ padding: '8px 16px', background: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>Apply Saved Defaults</button>
                </div>
              </div>
            )}
          </div>

          <div style={{ background: '#e8f8e8', padding: '12px', borderRadius: '4px', fontSize: '13px', color: '#333' }}>
            <strong>Saved defaults:</strong><br/>
            {jobDefaults.jobCode || '(none)'} | {jobDefaults.superName || '(none)'} | {jobDefaults.jobAddress || '(none)'}
          </div>
        </div>
      );
    };

    console.log('Starting render...');
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      console.log('✓ Render successful');
    } catch (e) {
      console.error('Render error:', e);
      logError('Render failed: ' + e.message);
    }
  </script>
</body>
</html>
