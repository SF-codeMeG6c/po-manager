<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; color: #666; }
        .ok { color: #388e3c; font-size: 12px; margin-top: 5px; }

        .users-wrap { overflow-x: auto; }
        .users { width: 100%; border-collapse: collapse; font-size: 14px; color: #333; }
        .users th { text-align: left; padding: 6px; border-bottom: 1px solid #ddd; }
        .users td { padding: 6px; border-bottom: 1px solid #eee; }
        .users tr.waiting { background: #fff7e6; }
        .users small { display: block; font-size: 11px; color: #cc6600; }
        .users input[type=text], .users select, .secret-row input { padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .users input[type=text] { width: 140px; }
        .btn-save { background: #0066cc; color: white; padding: 4px 12px; }
        .btn-save:disabled { background: #ccc; cursor: not-allowed; }
        .btn-small { padding: 4px 12px; }
        .secret-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; color: #333; }
        .secret-warn { border: 1px solid #f0a020; background: #fff7e6; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; color: #333; }
        .secret-warn.expired { border-color: #d93025; background: #fdecea; }
        .secret-warn pre { white-space: pre-wrap; font-size: 12px; background: #fff; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-top: 8px; }

        .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
                padding: 18px 10px; border: 1px solid #ddd; border-radius: 6px; background: white;
                color: #333; text-decoration: none; font-size: 13px; font-weight: 500; text-align: center; min-height: 110px; }
        a.tool:hover { border-color: #0066cc; background: #f3f8fd; }
        a.tool:focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; }
        a.tool svg { color: #0066cc; }
        .tool.soon { background: #fafafa; color: #999; border-style: dashed; cursor: default; }
        .tool.soon svg { color: #bbb; }
        .tool small { font-size: 11px; font-weight: 400; color: #aaa; }
        button.tool { font-family: inherit; cursor: pointer; width: 100%; }
        button.tool:hover, button.tool.open { border-color: #0066cc; background: #f3f8fd; }
        button.tool:focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; }
        button.tool svg { color: #0066cc; }
        button.tool.alert { border-color: #f0a020; background: #fff7e6; }
        button.tool.alert svg { color: #b36b00; }
        button.tool.alert small { color: #8a5a00; font-weight: 600; }
        button.tool.alert.expired { border-color: #d93025; background: #fdecea; }
        button.tool.alert.expired svg, button.tool.alert.expired small { color: #a3261c; }
        .admin-users { margin-top: 20px; }
        .users .jobroles label { display: block; white-space: nowrap; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Freeman Job Tools</h1>
        <p class="subtitle">Pick a tool</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Same Firebase project as PO Manager and GPM
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Simple line icons
        const Icon = ({ d }) => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                {d.map((p, i) => <path key={i} d={p} />)}
            </svg>
        );
        const ICONS = {
            po:      ['M7 3h8l4 4v14H7z', 'M15 3v4h4', 'M10 12h6', 'M10 16h6'],
            gpm:     ['M4 20V10', 'M10 20V4', 'M16 20v-7', 'M22 20H2'],
            frmest:  ['M3 11l9-7 9 7', 'M5 10v10', 'M19 10v10', 'M9 20v-9', 'M15 20v-9', 'M3 20h18'],
            tradesest: ['M3 9h18v10H3z', 'M8 9V6h8v3', 'M3 13h18'],
            notes:   ['M4 5h16v11H9l-5 4z', 'M8 9h8', 'M8 12h5'],
            cost:    ['M12 3v18', 'M16 7h-5a2.5 2.5 0 0 0 0 5h2a2.5 2.5 0 0 1 0 5H7'],
            extras:  ['M12 4v8', 'M8 8h8', 'M8 18h8'],   // plus over minus: extras and credits
            stmt:    ['M6 3h12v18H6z', 'M9 7h6', 'M9 11h6', 'M9 15h4'],
            approve: ['M4 12l5 5L20 6'],
            ar:      ['M3 7h18v10H3z', 'M12 10v4', 'M7 12h.01', 'M17 12h.01'],
            wip:     ['M12 3a9 9 0 1 0 9 9', 'M12 7v5l3 2'],
            users:   ['M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1', 'M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M21 19v-1a4 4 0 0 0-3-3.87', 'M15.5 4.13a3 3 0 0 1 0 5.74']
        };

        // Job tools. Each opens with no job picked; the job is picked inside the tool.
        // roles = who sees a live tool; url = where it opens (null = coming soon)
        const JOB_TOOLS = [
            { key: 'po',      name: 'PO Manager',     roles: ['owner', 'admin', 'estimator', 'super'], url: '/po/' },
            { key: 'gpm',     name: 'GPM',            roles: ['owner', 'admin', 'estimator'],          url: '/gpm/' },
            { key: 'frmest',  name: 'FRM-EST',        roles: ['owner', 'admin', 'estimator'],          url: '/frm-est/' },
            { key: 'tradesest', name: 'Trades-EST',   roles: ['owner', 'admin', 'estimator'],          url: '/trades-est/' },
            { key: 'notes',   name: 'Customer Information & Contact Notes', roles: ['owner', 'admin', 'estimator', 'super', 'office'], url: '/notes/' },
            { key: 'extras',  name: 'Extras & Credits', roles: ['owner', 'admin', 'estimator', 'super'],     url: '/extras/' },
            { key: 'cost',    name: 'Job Costing',    url: null },
            { key: 'stmt',    name: 'Statement',      url: null }
        ];

        // Reports across all jobs (not shown to Supers)
        const COMPANY_TOOLS = [
            { key: 'approve', name: 'PO Approval',         url: null },
            { key: 'ar',      name: 'Accounts Receivable', url: null },
            { key: 'wip',     name: 'WIP',                 url: null }
        ];

        // Job roles a person can be given (separate from their access level). Saved on users/{uid}.jobRoles.
        const JOB_ROLES = [['sales', 'Salesperson'], ['claims', 'Claim Coordinator'], ['estimator', 'Estimator'], ['super', 'Super']];

        function ToolTile({ tool, href }) {
            if (href) {
                return <a className="tool" href={href}><Icon d={ICONS[tool.key]} />{tool.name}</a>;
            }
            return <div className="tool soon" aria-disabled="true"><Icon d={ICONS[tool.key]} />{tool.name}<small>Coming soon</small></div>;
        }

        function Dashboard() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, 'pending', false = no access, object = active user
            const [authError, setAuthError] = useState('');
            const [showUsers, setShowUsers] = useState(false);   // Users screen (Owner/Admin)
            const [usersList, setUsersList] = useState([]);
            const [userEdits, setUserEdits] = useState({});      // uid -> { role, active, phone, jobRoles } not yet saved
            const [usersMsg, setUsersMsg] = useState(null);      // { text, ok } in the Admin section
            const [copyMsg, setCopyMsg] = useState(null);        // { text, ok } in the secret warning
            const [secretExpires, setSecretExpires] = useState(''); // Microsoft sign-in secret expiry, 'YYYY-MM-DD'
            const [secretInput, setSecretInput] = useState('');

            // Sign-in and role check. New people get a pending record (same as PO Manager).
            useEffect(() => {
                auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) return;
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        if (snap.exists && snap.data().active === true) {
                            setProfile({ uid: currentUser.uid, ...snap.data() });
                        } else if (!snap.exists) {
                            try {
                                await db.collection('users').doc(currentUser.uid).set({
                                    name: currentUser.displayName || currentUser.email || '',
                                    email: currentUser.email || '',
                                    role: 'pending',
                                    active: false,
                                    requestedAt: new Date()
                                });
                                setProfile('pending');
                            } catch (e) {
                                setProfile(false);
                            }
                        } else {
                            setProfile(snap.data().role === 'pending' ? 'pending' : false);
                        }
                    } catch (err) {
                        setProfile(false);
                    }
                });
            }, []);

            const isAdminUser = !!profile && typeof profile === 'object' && ['owner', 'admin'].includes(profile.role);

            // Users list, live for Owner/Admin (the Users box shows how many people are waiting). Waiting people come first.
            useEffect(() => {
                if (!isAdminUser) return;
                return db.collection('users').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => {
                        const ap = a.role === 'pending' ? 0 : 1, bp = b.role === 'pending' ? 0 : 1;
                        return ap !== bp ? ap - bp : (a.name || '').localeCompare(b.name || '');
                    });
                    setUsersList(list);
                }, error => setUsersMsg({ text: 'Error loading users: ' + error.message, ok: false }));
            }, [isAdminUser]);

            // Microsoft sign-in secret expiry date (Owner/Admin)
            useEffect(() => {
                if (!isAdminUser) return;
                return db.collection('settings').doc('app').onSnapshot(doc => {
                    const d = doc.exists ? (doc.data().msSecretExpires || '') : '';
                    setSecretExpires(d);
                    setSecretInput(d);
                }, error => console.error('Settings error:', error));
            }, [isAdminUser]);

            const handleSaveUser = async (u) => {
                const edit = userEdits[u.id] || {};
                const role = edit.role !== undefined ? edit.role : u.role;
                const active = edit.active !== undefined ? edit.active : u.active === true;
                const phone = edit.phone !== undefined ? edit.phone.trim() : (u.phone || '');
                const jobRoles = edit.jobRoles !== undefined ? edit.jobRoles : (u.jobRoles || []);
                try {
                    const now = new Date();
                    const data = { role, active, phone, jobRoles, updatedAt: now };
                    // A phone number being replaced is kept in the record
                    if (u.phone && phone !== u.phone) {
                        data.phoneHistory = firebase.firestore.FieldValue.arrayUnion({ phone: u.phone, replacedAt: now, replacedBy: { uid: user.uid, name: (profile && profile.name) || user.email } });
                    }
                    await db.collection('users').doc(u.id).update(data);
                    setUserEdits(prev => { const next = { ...prev }; delete next[u.id]; return next; });
                    setUsersMsg({ text: `Saved ${u.name || u.email}: ${role}${active ? '' : ' (inactive)'}`, ok: true });
                } catch (error) {
                    setUsersMsg({ text: 'Error saving user: ' + error.message, ok: false });
                }
            };

            const handleSaveSecretDate = async () => {
                try {
                    await db.collection('settings').doc('app').set({ msSecretExpires: secretInput }, { merge: true });
                    setUsersMsg({ text: 'Secret expiration date saved', ok: true });
                } catch (error) {
                    setUsersMsg({ text: 'Error saving date: ' + error.message, ok: false });
                }
            };

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = () => auth.signOut();

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">Sign in</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">Waiting for approval</div>
                        <p>You're signed in as {user.email}. Your account is waiting for approval. An admin will set up your access.</p>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>
                );
            }

            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">Account not set up</div>
                        <p>You're signed in as {user.email}, but your account doesn't have access. Contact an admin.</p>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>
                );
            }

            const role = profile.role;
            const liveTools = JOB_TOOLS.filter(t => t.url && t.roles.includes(role));
            const soonTools = JOB_TOOLS.filter(t => !t.url);

            const secretDaysLeft = secretExpires
                ? Math.ceil((new Date(secretExpires + 'T00:00:00') - new Date()) / 86400000)
                : null;

            // Alerts on the Users box: people waiting for approval, and the secret within 14 days of expiring (or expired)
            const pendingCount = usersList.filter(u => u.role === 'pending').length;
            const secretSoon = secretDaysLeft !== null && secretDaysLeft <= 14;
            const secretLine = !secretSoon ? '' : secretDaysLeft < 0 ? 'Sign-in secret expired'
                : secretDaysLeft === 0 ? 'Sign-in secret expires today'
                : `Sign-in secret expires in ${secretDaysLeft} day${secretDaysLeft === 1 ? '' : 's'}`;
            const usersBoxClass = 'tool' + (showUsers ? ' open' : '')
                + (secretSoon && secretDaysLeft < 0 ? ' alert expired' : (secretSoon || pendingCount > 0) ? ' alert' : '');

            const renewalText = `I need to renew the Microsoft sign-in client secret for my Freeman Job Tools web app. It expires on ${secretExpires}.

Setup:
- Web app: PO Manager, hosted on Netlify (charming-griffin-e1112f.netlify.app), code on GitHub (po-manager/index.html)
- Firebase project: po-project-ea1ca. Sign-in uses Firebase Authentication with the Microsoft provider.
- Microsoft Entra app registration: "Freeman Job Tools" (single tenant), tenant ID 977675c3-2808-4305-ac2e-f4418dc1d69c
- Redirect URI: https://po-project-ea1ca.firebaseapp.com/__/auth/handler
- Current client secret description: "Firebase"

Please walk me through this one step at a time:
1. Create a new client secret in Entra (App registrations > Freeman Job Tools > Certificates & secrets), 24 months.
2. Paste the new secret Value into Firebase (Authentication > Sign-in method > Microsoft > Application secret) and save.
3. Test Microsoft sign-in in a private/incognito window.
4. Update the expiration date on the Dashboard (Users > secret expires date).
5. Only after the test works, delete the old secret in Entra.

I prefer plain, brief instructions, one step at a time.`;

            return (
                <div>
                    <div className="topbar">
                        <span>Signed in as {profile.name || user.email}</span>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>

                    {role === 'notools' && (
                        <div className="section">
                            <p>No tools yet. Contact an admin.</p>
                        </div>
                    )}

                    {role !== 'notools' && (
                    <div className="section">
                        <div className="section-title">Job tools</div>
                        <div className="tools">
                            {liveTools.map(t => <ToolTile key={t.key} tool={t} href={t.url} />)}
                            {soonTools.map(t => <ToolTile key={t.key} tool={t} />)}
                        </div>
                    </div>
                    )}

                    {role !== 'super' && role !== 'notools' && (
                        <div className="section">
                            <div className="section-title">All jobs</div>
                            <div className="tools">
                                {COMPANY_TOOLS.map(t => <ToolTile key={t.key} tool={t} />)}
                            </div>
                        </div>
                    )}

                    {isAdminUser && (
                        <div className="section">
                            <div className="section-title">Admin</div>
                            <div className="tools">
                                <button type="button" className={usersBoxClass} aria-expanded={showUsers}
                                    onClick={() => { setShowUsers(!showUsers); setUsersMsg(null); }}>
                                    <Icon d={ICONS.users} />Users
                                    {pendingCount > 0 && <small>{pendingCount} waiting for approval</small>}
                                    {secretLine && <small>{secretLine}</small>}
                                </button>
                            </div>
                            {showUsers && (
                                <div className="admin-users">
                                    {secretDaysLeft !== null && secretDaysLeft <= 60 && (
                                        <div className={secretDaysLeft < 0 ? 'secret-warn expired' : 'secret-warn'}>
                                            <strong>
                                                {secretDaysLeft < 0
                                                    ? `Microsoft sign-in secret expired on ${secretExpires}. New sign-ins will fail until it's renewed.`
                                                    : `Microsoft sign-in secret expires on ${secretExpires} (${secretDaysLeft} days). Renew it in Entra before then.`}
                                            </strong>
                                            <div style={{ marginTop: '8px' }}>
                                                <button className="btn-secondary btn-small"
                                                    onClick={() => navigator.clipboard.writeText(renewalText).then(
                                                        () => setCopyMsg({ text: 'Renewal instructions copied. Paste them into a new Claude chat.', ok: true }),
                                                        () => setCopyMsg({ text: 'Copy failed. Open "Show instructions", select the text and copy it.', ok: false }))}>
                                                    Copy renewal instructions
                                                </button>
                                            </div>
                                            {copyMsg && <div className={copyMsg.ok ? 'ok' : 'error'}>{copyMsg.text}</div>}
                                            <details style={{ marginTop: '8px' }}>
                                                <summary style={{ cursor: 'pointer' }}>Show instructions</summary>
                                                <pre>{renewalText}</pre>
                                            </details>
                                        </div>
                                    )}
                                    <div className="users-wrap">
                                        <table className="users">
                                            <thead>
                                                <tr>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Phone</th>
                                                    <th>Role</th>
                                                    <th>Job roles</th>
                                                    <th>Active</th>
                                                    <th></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {usersList.map(u => {
                                                    const isMe = u.id === user.uid;
                                                    const edit = userEdits[u.id] || {};
                                                    const uRole = edit.role !== undefined ? edit.role : u.role;
                                                    const active = edit.active !== undefined ? edit.active : u.active === true;
                                                    const phone = edit.phone !== undefined ? edit.phone : (u.phone || '');
                                                    const jobRoles = edit.jobRoles !== undefined ? edit.jobRoles : (u.jobRoles || []);
                                                    const changed = edit.role !== undefined || edit.active !== undefined || edit.jobRoles !== undefined || (edit.phone !== undefined && edit.phone.trim() !== (u.phone || ''));
                                                    return (
                                                        <tr key={u.id} className={u.role === 'pending' ? 'waiting' : ''}>
                                                            <td>
                                                                {u.name}{isMe ? ' (you)' : ''}
                                                                {u.role === 'pending' && <small>Waiting for access</small>}
                                                            </td>
                                                            <td>{u.email}</td>
                                                            <td>
                                                                <input type="text" value={phone} placeholder="Phone" aria-label={'Phone for ' + (u.name || u.email)}
                                                                    onChange={e => setUserEdits(prev => ({ ...prev, [u.id]: { ...prev[u.id], phone: e.target.value } }))} />
                                                            </td>
                                                            <td>
                                                                <select value={uRole} disabled={isMe} aria-label={'Role for ' + (u.name || u.email)}
                                                                    onChange={e => setUserEdits(prev => ({ ...prev, [u.id]: { ...prev[u.id], role: e.target.value } }))}>
                                                                    <option value="pending">Pending</option>
                                                                    <option value="owner">Owner</option>
                                                                    <option value="admin">Admin</option>
                                                                    <option value="estimator">Estimator</option>
                                                                    <option value="super">Super</option>
                                                                    <option value="office">Office</option>
                                                                    <option value="notools">No tools</option>
                                                                </select>
                                                            </td>
                                                            <td className="jobroles">
                                                                {JOB_ROLES.map(([key, label]) => (
                                                                    <label key={key}>
                                                                        <input type="checkbox" checked={jobRoles.includes(key)} aria-label={label + ' for ' + (u.name || u.email)}
                                                                            onChange={e => {
                                                                                const next = e.target.checked ? [...jobRoles, key] : jobRoles.filter(k => k !== key);
                                                                                setUserEdits(prev => ({ ...prev, [u.id]: { ...prev[u.id], jobRoles: JOB_ROLES.map(([k]) => k).filter(k => next.includes(k)) } }));
                                                                            }} /> {label}
                                                                    </label>
                                                                ))}
                                                            </td>
                                                            <td>
                                                                <input type="checkbox" checked={active} disabled={isMe} aria-label={'Active for ' + (u.name || u.email)}
                                                                    onChange={e => setUserEdits(prev => ({ ...prev, [u.id]: { ...prev[u.id], active: e.target.checked } }))} />
                                                            </td>
                                                            <td>
                                                                <button className="btn-save" disabled={!changed} onClick={() => handleSaveUser(u)}>Save</button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="secret-row">
                                        <label htmlFor="secret-date">Microsoft sign-in secret expires:</label>
                                        <input id="secret-date" type="date" value={secretInput} onChange={e => setSecretInput(e.target.value)} />
                                        <button className="btn-save" disabled={secretInput === secretExpires} onClick={handleSaveSecretDate}>Save</button>
                                    </div>
                                </div>
                            )}
                            {usersMsg && <div className={usersMsg.ok ? 'ok' : 'error'}>{usersMsg.text}</div>}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('app'));
    </script>
</body>
</html>
