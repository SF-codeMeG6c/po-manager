<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Notes - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        a { color: #0066cc; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }

        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; font-size: 13px; color: #666; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .job-head { background: #f9f9f9; border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
        .job-code { font-size: 18px; font-weight: 600; color: #333; }
        .job-addr { font-size: 13px; color: #666; margin-top: 2px; }
        .notice { background: #f9f9f9; border-radius: 6px; padding: 14px; font-size: 14px; color: #555; }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        select:focus, textarea:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        textarea { min-height: 90px; resize: vertical; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .form-group { margin-bottom: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip { display: inline-flex; align-items: center; gap: 4px; background: #e8f1fb; color: #0052a3; border-radius: 12px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
        .chip button { background: none; padding: 0 2px; color: #0052a3; font-size: 14px; line-height: 1; }
        .note { border: 1px solid #eee; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
        .note-meta { font-size: 12px; color: #888; margin-bottom: 6px; }
        .note-text { font-size: 14px; color: #333; white-space: pre-wrap; margin-top: 8px; }
        .muted { font-size: 13px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Customer Notes</h1>
        <p class="subtitle">Customer calls, requests and decisions for each job</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Same Firebase project as the other tools
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Roles that can use Customer Notes
        const ALLOWED = ['owner', 'admin', 'estimator', 'super', 'office'];

        // Job from the address: /notes/?job=ID ('' = no job, the all-jobs view)
        const URL_JOB_ID = new URLSearchParams(window.location.search).get('job') || '';

        // Date and time for a note ('Saving...' until the server time arrives)
        const fmtTime = (ts) => ts && ts.toDate
            ? ts.toDate().toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' })
            : 'Saving...';

        // Capitalize the start of each line (same as PO Manager)
        const capLines = (t) => (t || '').replace(/(^|\n)(\s*)([a-z])/g, (m, nl, sp, c) => nl + sp + c.toUpperCase());

        // Put spoken text where the cursor is in a textbox; returns new text + cursor spot (same as PO Manager)
        const insertAtCursor = (el, text) => {
            const cur = el.value || '';
            const pos = el.selectionStart ?? cur.length;
            const before = cur.slice(0, pos), after = cur.slice(pos);
            const sepBefore = before && !/[\s]$/.test(before) ? ' ' : '';
            const sepAfter = after && !/^[\s]/.test(after) ? ' ' : '';
            const value = capLines(before + sepBefore + text + sepAfter + after);
            return { value, pos: (before + sepBefore + text).length };
        };

        // One job's notes: the Add a note box and the notes list
        function JobNotes({ job, profile }) {
            const [tagList, setTagList] = useState(null);   // null = loading
            const [notes, setNotes] = useState(null);       // null = loading
            const [pickTags, setPickTags] = useState([]);
            const [text, setText] = useState('');
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [listening, setListening] = useState(false);
            const recognitionRef = useRef(null);
            const textRef = useRef(null);
            const me = { uid: profile.uid, name: profile.name || profile.email || '' };

            // Company-wide tag list
            useEffect(() => {
                return db.collection('notesSettings').doc('tags').onSnapshot(doc => {
                    setTagList(doc.exists && Array.isArray(doc.data().list) ? doc.data().list : []);
                }, error => { setTagList([]); setMessage('Error loading tags: ' + error.message); });
            }, []);

            // This job's notes, newest first. Hidden notes are left out.
            useEffect(() => {
                return db.collection('jobs').doc(job.id).collection('notes').orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const list = [];
                        snapshot.forEach(doc => { const d = doc.data({ serverTimestamps: 'estimate' }); if (d.deleted !== true) list.push({ id: doc.id, ...d }); });
                        setNotes(list);
                    }, error => { setNotes([]); setMessage('Error loading notes: ' + error.message); });
            }, [job.id]);

            // Stop voice if the page closes while listening
            useEffect(() => () => { recognitionRef.current && recognitionRef.current.stop(); }, []);

            // Voice to text (Chrome/Edge), same approach as PO Manager
            const toggleVoice = () => {
                if (listening) { recognitionRef.current && recognitionRef.current.stop(); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setMessage('Voice input not supported in this browser (use Chrome or Edge)'); return; }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.continuous = true;
                rec.interimResults = false;
                rec.onresult = (e) => {
                    let spoken = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) spoken += e.results[i][0].transcript;
                    }
                    const el = textRef.current;
                    if (!spoken || !el) return;
                    const { value, pos } = insertAtCursor(el, spoken.trim());
                    setText(value);
                    setTimeout(() => { el.focus(); el.setSelectionRange(pos, pos); }, 0);
                };
                rec.onerror = (e) => { setMessage('Voice input error: ' + e.error); };
                rec.onend = () => setListening(false);
                recognitionRef.current = rec;
                rec.start();
                setListening(true);
            };

            const addTag = (t) => { if (t && !pickTags.includes(t)) setPickTags([...pickTags, t]); };
            const removeTag = (t) => setPickTags(pickTags.filter(x => x !== t));

            const handleSave = async () => {
                setMessage('');
                if (!text.trim()) { setMessage('Type a note first.'); return; }
                if (pickTags.length === 0) { setMessage('Pick at least one tag.'); return; }
                if (listening && recognitionRef.current) recognitionRef.current.stop();
                setSaving(true);
                try {
                    await db.collection('jobs').doc(job.id).collection('notes').add({
                        text: capLines(text.trim()),
                        tags: pickTags,
                        jobId: job.id,
                        jobCode: job.code,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        createdBy: me,
                        followUpDate: '',
                        followUpDone: false,
                        deleted: false
                    });
                    setText('');
                    setPickTags([]);
                } catch (error) {
                    setMessage('Error saving note: ' + error.message);
                }
                setSaving(false);
            };

            return (
                <div>
                    <div className="section">
                        <div className="section-title">Add a note</div>
                        <div className="form-group">
                            <label htmlFor="tag-pick">Tags</label>
                            <select id="tag-pick" value="" onChange={e => addTag(e.target.value)} disabled={!tagList}>
                                <option value="">{tagList === null ? 'Loading tags...' : '-- Add a tag --'}</option>
                                {(tagList || []).filter(t => !pickTags.includes(t)).map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            {pickTags.length > 0 && (
                                <div className="chips">
                                    {pickTags.map(t => (
                                        <span key={t} className="chip">{t}<button type="button" onClick={() => removeTag(t)} aria-label={'Remove ' + t}>&times;</button></span>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="form-group">
                            <div className="row">
                                <label htmlFor="note-text" style={{ marginBottom: 0 }}>Note</label>
                                <button type="button" className={listening ? 'btn-danger btn-sm' : 'btn-secondary btn-sm'} onClick={toggleVoice}>
                                    {listening ? '■ Stop' : '🎤 Voice'}
                                </button>
                            </div>
                            <textarea id="note-text" ref={textRef} value={text} placeholder="Type or use Voice..."
                                onChange={e => setText(capLines(e.target.value))} />
                        </div>
                        <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : 'Save note'}</button>
                        {message && <div className="error">{message}</div>}
                    </div>

                    <div className="section">
                        <div className="section-title">Notes</div>
                        {notes === null && <p className="muted">Loading notes...</p>}
                        {notes && notes.length === 0 && <p className="muted">No notes yet for this job.</p>}
                        {(notes || []).map(n => (
                            <div key={n.id} className="note">
                                <div className="note-meta">{fmtTime(n.createdAt)} · {(n.createdBy && n.createdBy.name) || 'Unknown'}</div>
                                <div className="chips" style={{ marginTop: 0 }}>
                                    {(n.tags || []).map(t => <span key={t} className="chip">{t}</span>)}
                                </div>
                                <div className="note-text">{n.text}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function NotesApp() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, 'pending', false = no access, object = active user
            const [authError, setAuthError] = useState('');
            const [job, setJob] = useState(null);         // null = loading, false = not found or no access, object = the job

            // Sign-in and role check. This page never creates user records (new people sign in on the Dashboard).
            useEffect(() => {
                return auth.onAuthStateChanged(async currentUser => {
                    setUser(currentUser);
                    setProfile(null);
                    if (!currentUser) return;
                    try {
                        const snap = await db.collection('users').doc(currentUser.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: currentUser.uid, ...d });
                        else if (d && d.role === 'pending') setProfile('pending');
                        else setProfile(false);
                    } catch (err) {
                        setProfile(false);
                    }
                });
            }, []);

            // Load the one job named in the address. The rules block a Super who isn't assigned, which counts as "no access".
            useEffect(() => {
                setJob(null);
                if (!profile || typeof profile !== 'object' || !URL_JOB_ID) return;
                db.collection('jobs').doc(URL_JOB_ID).get().then(doc => {
                    if (!doc.exists) { setJob(false); return; }
                    const d = doc.data();
                    setJob({ id: doc.id, code: d.code || '', address: d.address || '', cityStateZip: d.cityStateZip || '', archived: d.archived === true });
                }).catch(() => setJob(false));
            }, [profile]);

            const handleMicrosoftLogin = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    setAuthError(error.message);
                }
            };

            const handleLogout = () => auth.signOut();

            if (!user) {
                return (
                    <div className="section">
                        <div className="section-title">Sign in</div>
                        <button className="btn-primary" onClick={handleMicrosoftLogin}>Sign in with Microsoft</button>
                        {authError && <div className="error">{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === 'pending') {
                return (
                    <div className="section">
                        <div className="section-title">Waiting for approval</div>
                        <p>You're signed in as {user.email}. Your account is waiting for approval. An admin will set up your access.</p>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>
                );
            }

            if (profile === false) {
                return (
                    <div className="section">
                        <div className="section-title">Account not set up</div>
                        <p>You're signed in as {user.email}, but your account doesn't have access. Contact an admin.</p>
                        <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                    </div>
                );
            }

            return (
                <div>
                    <div className="topbar">
                        <span>Signed in as {profile.name || user.email}</span>
                        <div className="topbar-right">
                            <a href="/notes/">Search all jobs</a>
                            <button className="btn-secondary" onClick={handleLogout}>Logout</button>
                        </div>
                    </div>

                    {!URL_JOB_ID && (
                        <div className="notice">
                            Search across all jobs is coming soon. To see one job's notes, open Customer Notes from that job on the <a href="/">Dashboard</a>.
                        </div>
                    )}

                    {URL_JOB_ID && job === null && <div className="section">Loading job...</div>}

                    {URL_JOB_ID && job === false && (
                        <div className="notice">
                            This job wasn't found, or you don't have access to it. Go back to the <a href="/">Dashboard</a> and pick a job.
                        </div>
                    )}

                    {URL_JOB_ID && job && (
                        <div>
                            <div className="job-head">
                                <div className="job-code">{job.code}{job.archived ? ' (archived)' : ''}</div>
                                <div className="job-addr">{[job.address, job.cityStateZip].filter(Boolean).join(', ')}</div>
                            </div>
                            <JobNotes job={job} profile={profile} />
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<NotesApp />, document.getElementById('app'));
    </script>
</body>
</html>
