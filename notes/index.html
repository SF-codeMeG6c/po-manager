<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Information &amp; Contact Notes - Freeman Restoration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; font-size: 13px; color: #0066cc; text-decoration: none; margin-bottom: 12px; }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; }
        .section-title { font-weight: 600; color: #333; margin-bottom: 15px; font-size: 15px; }
        p { margin-bottom: 12px; font-size: 14px; color: #333; }
        a { color: #0066cc; }
        button { padding: 10px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #0066cc; color: white; width: 100%; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .error { color: #d32f2f; font-size: 12px; margin-top: 5px; }

        .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; font-size: 13px; color: #666; }
        .job-head { background: #f9f9f9; border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
        .job-code { font-size: 18px; font-weight: 600; color: #333; }
        .job-addr { font-size: 13px; color: #666; margin-top: 2px; }
        .notice { background: #f9f9f9; border-radius: 6px; padding: 14px; font-size: 14px; color: #555; }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        select:focus, textarea:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        textarea { min-height: 90px; resize: vertical; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .form-group { margin-bottom: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip { display: inline-flex; align-items: center; gap: 4px; background: #e8f1fb; color: #0052a3; border-radius: 12px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
        .chip button { background: none; padding: 0 2px; color: #0052a3; font-size: 14px; line-height: 1; }
        .note { border: 1px solid #eee; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
        .note-meta { font-size: 12px; color: #888; margin-bottom: 6px; }
        .note-text { font-size: 14px; color: #333; white-space: pre-wrap; margin-top: 8px; }
        .muted { font-size: 13px; color: #888; }
        .note-hidden { background: #fafafa; border-style: dashed; opacity: 0.75; }
        .note-actions { display: flex; gap: 6px; }
        .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; font-weight: normal; margin-bottom: 0; }
        .check input { width: auto; }
        input[type=date] { padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .followups { background: #fffaf0; border: 1px solid #f3e2c0; border-radius: 6px; padding: 12px 14px; margin-bottom: 30px; }
        .fu-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid #f3e2c0; }
        .fu-item:first-of-type { border-top: none; }
        .fu-date { font-size: 13px; font-weight: 600; color: #333; white-space: nowrap; }
        .fu-date.late { color: #d32f2f; }
        .fu-text { font-size: 13px; color: #555; margin-top: 2px; white-space: pre-wrap; }
        .fu-line { font-size: 12px; color: #8a6d1f; margin-top: 6px; }
        input[type=tel], input[type=email] { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .card-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
        .card-group { margin-bottom: 14px; }
        .card-view .card-group { margin-bottom: 0; background: #f9f9f9; border-radius: 6px; padding: 10px 12px; }
        .card-group-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 12px; }
        .card-field label { font-size: 12px; margin-bottom: 3px; }
        .card-line { font-size: 13px; color: #333; margin-bottom: 3px; overflow-wrap: anywhere; }
        .card-label { color: #888; margin-right: 6px; }
        .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 12px; background: #f9f9f9; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
        .filters label { font-size: 12px; margin-bottom: 3px; }
        .filters select, .filters input[type=date] { width: 100%; padding: 6px 8px; font-size: 13px; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: #666; }
        .print-only { display: none; }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: none; }
            .no-print, button, .back-link, .topbar, .filters { display: none !important; }
            .print-only { display: block; }
            .note { break-inside: avoid; }
            a { color: #333; text-decoration: none; }
        }
        .job-link { font-weight: 600; color: #0066cc; }
        input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .contact-edit { border: 1px solid #eee; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
        .extra-row { justify-content: flex-start; margin-top: 6px; }
        .extra-row input { flex: 1; min-width: 0; width: auto; }
        .ok-msg { color: #388e3c; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link no-print">&larr; Dashboard</a>
        <h1>Customer Information &amp; Contact Notes</h1>
        <p class="subtitle">Job details, contacts, and customer calls, requests and decisions</p>
        <div id="app"></div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Same Firebase project as the other tools
        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Roles that can use Customer Notes
        const ALLOWED = ['owner', 'admin', 'estimator', 'super', 'office'];

        // Job from the address: /notes/?job=ID ('' = no job, the all-jobs view)
        const URL_JOB_ID = new URLSearchParams(window.location.search).get('job') || '';

        // Unsaved work on the page: a typed note, a note being edited, or the contact card open for editing.
        // The job drop down checks this before it switches jobs.
        const UNSAVED = { note: false, edit: false, card: false };
        const hasUnsaved = () => UNSAVED.note || UNSAVED.edit || UNSAVED.card;

        // Date and time for a note ('Saving...' until the server time arrives)
        const fmtTime = (ts) => ts && ts.toDate
            ? ts.toDate().toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' })
            : 'Saving...';

        // Follow-up dates are stored as 'YYYY-MM-DD'. Show them as 10/15/26, with no time-zone shifts.
        const fmtDay = (d) => { const p = (d || '').split('-'); return p.length === 3 ? `${+p[1]}/${+p[2]}/${p[0].slice(2)}` : ''; };
        const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };

        // Local date of a timestamp as 'YYYY-MM-DD' (for date-range filters)
        const dayOf = (ts) => {
            if (!ts || !ts.toDate) return '';
            const t = ts.toDate();
            return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
        };

        // Filters: tag, date range (by the date a note was written) and person
        const NO_FILTERS = { tag: '', from: '', to: '', person: '' };
        const applyFilters = (list, f) => list.filter(n =>
            (!f.tag || (n.tags || []).includes(f.tag))
            && (!f.from || dayOf(n.createdAt) >= f.from)
            && (!f.to || dayOf(n.createdAt) <= f.to)
            && (!f.person || (n.createdBy && n.createdBy.uid) === f.person));
        const peopleIn = (list) => {
            const seen = {};
            list.forEach(n => { if (n.createdBy && n.createdBy.uid) seen[n.createdBy.uid] = n.createdBy.name || 'Unknown'; });
            return Object.keys(seen).map(uid => ({ uid, name: seen[uid] })).sort((a, b) => a.name.localeCompare(b.name));
        };

        function NoteFilters({ tagList, people, value, onChange }) {
            const set = (k, v) => onChange({ ...value, [k]: v });
            return (
                <div className="filters">
                    <div>
                        <label htmlFor="f-tag">Tag</label>
                        <select id="f-tag" value={value.tag} onChange={e => set('tag', e.target.value)}>
                            <option value="">All tags</option>
                            {(tagList || []).map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                    </div>
                    <div>
                        <label htmlFor="f-from">From</label>
                        <input id="f-from" type="date" value={value.from} onChange={e => set('from', e.target.value)} />
                    </div>
                    <div>
                        <label htmlFor="f-to">To</label>
                        <input id="f-to" type="date" value={value.to} onChange={e => set('to', e.target.value)} />
                    </div>
                    <div>
                        <label htmlFor="f-person">Person</label>
                        <select id="f-person" value={value.person} onChange={e => set('person', e.target.value)}>
                            <option value="">Everyone</option>
                            {people.map(p => <option key={p.uid} value={p.uid}>{p.name}</option>)}
                        </select>
                    </div>
                </div>
            );
        }

        // CSV export that opens cleanly in Excel
        const csvCell = (v) => {
            let t = v === undefined || v === null ? '' : String(v);
            if (/^[=+\-@]/.test(t)) t = "'" + t;            // stop Excel treating text as a formula
            return '"' + t.replace(/"/g, '""') + '"';
        };
        const timeOf = (ts) => ts && ts.toDate ? ts.toDate().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '';
        const fullDay = (d) => { const p = (d || '').split('-'); return p.length === 3 ? `${+p[1]}/${+p[2]}/${p[0]}` : ''; };
        const exportNotesCsv = (list, fileName, withHidden) => {
            const head = ['Job', 'Date', 'Time', 'Written by', 'Tags', 'Note', 'Follow-up date', 'Follow-up done', 'Done by', 'Edited', 'Edited by'];
            if (withHidden) head.push('Hidden', 'Hidden by', 'Hidden on');
            const rows = list.map(n => {
                const r = [n.jobCode || '', fullDay(dayOf(n.createdAt)), timeOf(n.createdAt), n.createdBy ? n.createdBy.name : '',
                    (n.tags || []).join(', '), n.text || '', fullDay(n.followUpDate),
                    n.followUpDate ? (n.followUpDone ? 'Yes' : 'No') : '', n.followUpDoneBy ? n.followUpDoneBy.name : '',
                    n.editedAt ? fmtTime(n.editedAt) : '', n.editedBy ? n.editedBy.name : ''];
                if (withHidden) r.push(n.deleted ? 'Yes' : '', n.deletedBy ? n.deletedBy.name : '', n.deletedAt ? fmtTime(n.deletedAt) : '');
                return r;
            });
            const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
            const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            const a = document.createElement('a');
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        const safeName = (t) => (t || 'job').replace(/[^\w.-]+/g, '_');

        // Capitalize the start of each line (same as PO Manager)
        const capLines = (t) => (t || '').replace(/(^|\n)(\s*)([a-z])/g, (m, nl, sp, c) => nl + sp + c.toUpperCase());

        // Put spoken text where the cursor is in a textbox; returns new text + cursor spot (same as PO Manager)
        const insertAtCursor = (el, text) => {
            const cur = el.value || '';
            const pos = el.selectionStart ?? cur.length;
            const before = cur.slice(0, pos), after = cur.slice(pos);
            const sepBefore = before && !/[\s]$/.test(before) ? ' ' : '';
            const sepAfter = after && !/^[\s]/.test(after) ? ' ' : '';
            const value = capLines(before + sepBefore + text + sepAfter + after);
            return { value, pos: (before + sepBefore + text).length };
        };

        const ADMINS = ['owner', 'admin'];   // can hide and restore notes
        const EDIT_HOURS = 24;               // the author can edit a note this long after saving it

        // A copy of a note as it is now, for its history (versions). Leaves out empty fields.
        const noteCopy = (n) => {
            const copy = {};
            ['text', 'tags', 'followUpDate', 'createdAt', 'createdBy', 'editedAt', 'editedBy', 'deleted', 'deletedBy', 'deletedAt']
                .forEach(k => { if (n[k] !== undefined && n[k] !== null) copy[k] = n[k]; });
            return copy;
        };

        // Tags: pick from the company list, remove with ×, or add a new tag to the list
        function TagPicker({ id, tagList, value, onChange, onNewTag }) {
            const [adding, setAdding] = useState(false);
            const [newTag, setNewTag] = useState('');
            const [err, setErr] = useState('');
            const pick = (t) => { if (t && !value.includes(t)) onChange([...value, t]); };
            const saveNew = async () => {
                const name = newTag.trim().replace(/\s+/g, ' ');
                if (!name) return;
                if (name.length > 30) { setErr('Keep tags to 30 characters or less.'); return; }
                const existing = (tagList || []).find(t => t.toLowerCase() === name.toLowerCase());
                setErr('');
                try {
                    if (!existing) await onNewTag(name);
                    pick(existing || name);
                    setNewTag('');
                    setAdding(false);
                } catch (error) {
                    setErr('Error adding tag: ' + error.message);
                }
            };
            return (
                <div>
                    <div className="row" style={{ marginBottom: 0 }}>
                        <select id={id} value="" onChange={e => pick(e.target.value)} disabled={!tagList}>
                            <option value="">{tagList === null ? 'Loading tags...' : '-- Add a tag --'}</option>
                            {(tagList || []).filter(t => !value.includes(t)).map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        {!adding && <button type="button" className="btn-secondary btn-sm" style={{ whiteSpace: 'nowrap' }} onClick={() => setAdding(true)}>+ New tag</button>}
                    </div>
                    {adding && (
                        <div className="row" style={{ marginTop: '8px', marginBottom: 0 }}>
                            <input type="text" value={newTag} placeholder="New tag name" maxLength={30} autoFocus
                                onChange={e => setNewTag(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') saveNew(); }} />
                            <button type="button" className="btn-secondary btn-sm" onClick={saveNew}>Add</button>
                            <button type="button" className="btn-secondary btn-sm" onClick={() => { setAdding(false); setNewTag(''); setErr(''); }}>Cancel</button>
                        </div>
                    )}
                    {err && <div className="error">{err}</div>}
                    {value.length > 0 && (
                        <div className="chips">
                            {value.map(t => (
                                <span key={t} className="chip">{t}<button type="button" onClick={() => onChange(value.filter(x => x !== t))} aria-label={'Remove ' + t}>&times;</button></span>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Contact card fields (all optional). Lock box is the job's own lockBox field, shared with PO Manager.
        // Every box can also have extra items: a list of { label, value } the user adds (e.g. Gate code: 4471).
        const EMPTY_CARD = {
            team: {},
            details: { insured: '', lossAddress: '', homeAddress: '', dateOfLoss: '', extras: [] },
            homeowners: [{ name: '', who: '', phone: '', email: '', extras: [] }, { name: '', who: '', phone: '', email: '', extras: [] }],
            contacts: [],
            insurance: { company: '', claimNumber: '', adjusterName: '', adjusterPhone: '', adjusterEmail: '', extras: [] },
            publicAdjusting: { company: '', percent: '', salesName: '', salesPhone: '', salesEmail: '', adjusterName: '', adjusterPhone: '', adjusterEmail: '', extras: [] },
            mortgage: { hasMortgage: '', company: '', phone: '', extras: [] },
            settlement: { settlementAmount: '', commissionDave: '', emsVendors: '', emsFixedPrice: '', emsAsIncurred: '', extras: [] }
        };
        // Other contacts: each has a title the user types or picks (Tenant, Attorney...), plus the fields below
        const EMPTY_CONTACT = { title: '', name: '', company: '', phone: '', email: '', extras: [] };
        const CONTACT_FIELDS = [['name', 'Name'], ['company', 'Company'], ['phone', 'Phone', 'tel'], ['email', 'Email', 'email']];
        const TITLE_SUGGESTIONS = ['Tenant', 'Property manager', 'Spouse', 'Son', 'Daughter', 'Attorney', 'HOA', 'Real estate agent', 'Contractor'];
        const MAX_CONTACTS = 10;
        // Job team: picked by Owner/Admin from the Users list (job roles set on the Dashboard's Users screen, users/{uid}.jobRoles).
        // Name, email and phone are copied onto the card so everyone (and other tools) can read them.
        const TEAM_ROLES = [['sales', 'Sales person'], ['claims', 'Claim coordinator'], ['super', 'Super'], ['estimator', 'Estimator']];
        const teamPerson = (u) => ({ uid: u.id || u.uid, name: u.name || u.email || '', email: u.email || '', phone: u.phone || '' });
        const MAX_EXTRAS = 15;
        // top: true sections show above the homeowners
        const CARD_SECTIONS = [
            { key: 'details', top: true, title: 'Job details', fields: [['insured', 'Insured'], ['lossAddress', 'Loss address'], ['homeAddress', 'Home (mailing) address'], ['dateOfLoss', 'Date of loss']] },
            { key: 'insurance', title: 'Insurance company', fields: [['company', 'Company'], ['claimNumber', 'Claim number'], ['adjusterName', 'Adjuster name'], ['adjusterPhone', 'Adjuster phone', 'tel'], ['adjusterEmail', 'Adjuster email', 'email']] },
            { key: 'publicAdjusting', title: 'Public adjusting company', fields: [['company', 'Company'], ['percent', 'Public adjuster %'], ['salesName', 'Salesperson name'], ['salesPhone', 'Salesperson phone', 'tel'], ['salesEmail', 'Salesperson email', 'email'], ['adjusterName', 'PA adjuster name'], ['adjusterPhone', 'PA adjuster phone', 'tel'], ['adjusterEmail', 'PA adjuster email', 'email']] },
            { key: 'mortgage', title: 'Mortgage company', fields: [['hasMortgage', 'Mortgage? (Yes / No)'], ['company', 'Company'], ['phone', 'Contact phone', 'tel']] },
            { key: 'settlement', title: 'Settlement & EMS', fields: [['settlementAmount', 'Settlement amount'], ['commissionDave', 'Com Dave %'], ['emsVendors', 'EMS vendors & description'], ['emsFixedPrice', 'EMS fixed price amount'], ['emsAsIncurred', 'EMS as incurred']] }
        ];
        const SECTION_KEYS = CARD_SECTIONS.map(s => s.key);
        const HOMEOWNER_FIELDS = [['name', 'Name'], ['who', 'Who'], ['phone', 'Phone', 'tel'], ['email', 'Email', 'email']];

        // Fill in any missing fields so the form always has every box
        const fullCard = (d) => {
            const c = JSON.parse(JSON.stringify(EMPTY_CARD));
            if (!d) return c;
            (d.homeowners || []).slice(0, 2).forEach((h, i) => { c.homeowners[i] = { ...c.homeowners[i], ...h, extras: [...(h.extras || [])] }; });
            SECTION_KEYS.forEach(k => { c[k] = { ...c[k], ...(d[k] || {}), extras: [...((d[k] && d[k].extras) || [])] }; });
            c.contacts = (d.contacts || []).map(x => ({ ...EMPTY_CONTACT, ...x, extras: [...(x.extras || [])] }));
            c.team = { ...(d.team || {}) };
            return c;
        };
        // Trim every field; drop empty extra items, and homeowners or contacts with nothing filled in
        const cleanCard = (c) => {
            const s = (v) => (typeof v === 'string' ? v : '').trim();
            const cleanExtras = (list) => (list || []).map(x => ({ label: s(x.label), value: s(x.value) })).filter(x => x.label || x.value);
            const t = (o) => { const r = {}; Object.keys(o).forEach(k => { if (k !== 'extras') r[k] = s(o[k]); }); r.extras = cleanExtras(o.extras); return r; };
            const hasAny = (o) => Object.keys(o).some(k => (k === 'extras' ? o.extras.length > 0 : o[k]));
            const team = {};
            TEAM_ROLES.forEach(([k]) => {
                const p = (c.team || {})[k];
                if (p && p.uid) team[k] = { uid: s(p.uid), name: s(p.name), email: s(p.email), phone: s(p.phone) };
            });
            return {
                team,
                homeowners: c.homeowners.map(t).filter(hasAny),
                contacts: c.contacts.map(t).filter(hasAny).slice(0, MAX_CONTACTS),
                ...Object.fromEntries(SECTION_KEYS.map(k => [k, t(c[k])]))
            };
        };

        // Customer Intake PDF (fillable form): box name on the form -> where it goes on the card.
        // Box names are matched ignoring case, spaces and symbols, so "Yes  No" matches "yesno".
        const INTAKE_MAP = {
            insured: ['details', 'insured'], lossaddress: ['details', 'lossAddress'], homeaddress: ['details', 'homeAddress'], dateofloss: ['details', 'dateOfLoss'],
            primarycontact: ['h0', 'name'], who: ['h0', 'who'], email: ['h0', 'email'], phone: ['h0', 'phone'],
            secondarycontact: ['h1', 'name'], who2: ['h1', 'who'], email2: ['h1', 'email'], phone2: ['h1', 'phone'],
            insuranceco: ['insurance', 'company'], adjuster: ['insurance', 'adjusterName'], email3: ['insurance', 'adjusterEmail'], phone3: ['insurance', 'adjusterPhone'], claim: ['insurance', 'claimNumber'],
            lockboxcode: ['lockBox'],
            publicadjustingco: ['publicAdjusting', 'company'], publicadjuster: ['publicAdjusting', 'percent'], email4: ['publicAdjusting', 'adjusterEmail'], phone4: ['publicAdjusting', 'adjusterPhone'],
            pasalesperson: ['publicAdjusting', 'salesName'], phone5: ['publicAdjusting', 'salesPhone'],
            settlementamount: ['settlement', 'settlementAmount'], comdave: ['settlement', 'commissionDave'],
            yesno: ['mortgage', 'hasMortgage'], mortgagecompany: ['mortgage', 'company'],
            emsvendorsdescription: ['settlement', 'emsVendors'], emsfixedpriceamount: ['settlement', 'emsFixedPrice'], emsasincurred: ['settlement', 'emsAsIncurred']
        };
        const boxKey = (name) => (name || '').toLowerCase().replace(/[^a-z0-9]/g, '');

        // pdf-lib (reads the form's boxes) is loaded only the first time someone imports
        let pdfLibLoading = null;
        const loadPdfLib = () => {
            if (window.PDFLib) return Promise.resolve(window.PDFLib);
            if (!pdfLibLoading) pdfLibLoading = new Promise((resolve, reject) => {
                const el = document.createElement('script');
                el.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
                el.onload = () => resolve(window.PDFLib);
                el.onerror = () => { pdfLibLoading = null; reject(new Error('Could not load the PDF reader. Check the internet connection and try again.')); };
                document.head.appendChild(el);
            });
            return pdfLibLoading;
        };
        // Read the typed-in values from the form's boxes: { boxKey: value }
        const readIntakePdf = async (file) => {
            const PDFLib = await loadPdfLib();
            const doc = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
            const values = {};
            let boxes = 0;
            doc.getForm().getFields().forEach(f => {
                boxes++;
                let v = '';
                if (f instanceof PDFLib.PDFTextField) v = f.getText() || '';
                else if (f instanceof PDFLib.PDFCheckBox) v = f.isChecked() ? 'Yes' : '';
                else if (f instanceof PDFLib.PDFDropdown || f instanceof PDFLib.PDFOptionList) v = (f.getSelected() || []).join(', ');
                else if (f instanceof PDFLib.PDFRadioGroup) v = f.getSelected() || '';
                values[boxKey(f.getName())] = String(v).replace(/\s+/g, ' ').trim();
            });
            return { values, boxes };
        };
        // Put the form's values into the card being edited. Empty boxes on the form leave the card as it is.
        const applyIntake = (base, values) => {
            const next = { ...base, homeowners: base.homeowners.map(h => ({ ...h })) };
            SECTION_KEYS.forEach(k => { next[k] = { ...base[k] }; });
            let filled = 0, replaced = 0;
            Object.keys(INTAKE_MAP).forEach(key => {
                const v = values[key];
                if (!v) return;
                const [where, field] = INTAKE_MAP[key];
                const target = where === 'lockBox' ? null : where === 'h0' ? next.homeowners[0] : where === 'h1' ? next.homeowners[1] : next[where];
                const old = target ? (target[field] || '') : (next.lockBox || '');
                if (old.trim() === v) return;
                if (old.trim()) replaced++;
                filled++;
                if (target) target[field] = v; else next.lockBox = v;
            });
            return { next, filled, replaced };
        };
        const telHref = (p) => 'tel:' + (p || '').replace(/[^\d+]/g, '');
        // Extra items become tap-to-email or tap-to-call when they look like an email or a phone number (10+ digits)
        const itemKind = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v || '') ? 'email'
            : (/^[\d\s().+-]+$/.test(v || '') && (v || '').replace(/\D/g, '').length >= 10 ? 'tel' : '');

        // Extra items while editing: an item name and its value, a × to remove, and + Add item
        function ExtraItems({ items, onChange }) {
            const set = (i, k, v) => onChange(items.map((x, j) => (j === i ? { ...x, [k]: v } : x)));
            return (
                <div style={{ marginTop: '6px' }}>
                    {items.map((x, i) => (
                        <div key={i} className="row extra-row">
                            <input type="text" placeholder="Item (e.g. Gate code)" value={x.label} onChange={e => set(i, 'label', e.target.value)} />
                            <input type="text" placeholder="Value" value={x.value} onChange={e => set(i, 'value', e.target.value)} />
                            <button type="button" className="btn-secondary btn-sm" onClick={() => onChange(items.filter((_, j) => j !== i))} aria-label="Remove item">&times;</button>
                        </div>
                    ))}
                    {items.length < MAX_EXTRAS && (
                        <button type="button" className="btn-secondary btn-sm" style={{ marginTop: '6px' }} onClick={() => onChange([...items, { label: '', value: '' }])}>+ Add item</button>
                    )}
                </div>
            );
        }

        // A phone or email as a tap-to-call or tap-to-email link
        function CardValue({ value, kind }) {
            if (kind === 'tel') return <a href={telHref(value)}>{value}</a>;
            if (kind === 'email') return <a href={'mailto:' + value}>{value}</a>;
            return <span>{value}</span>;
        }

        // Extra items on the card: "Item  value" lines
        function ExtraLines({ items }) {
            return (items || []).filter(x => x.label || x.value).map((x, i) => (
                <div key={'x' + i} className="card-line">
                    {x.label && <span className="card-label">{x.label}</span>}
                    <CardValue value={x.value} kind={itemKind(x.value)} />
                </div>
            ));
        }

        // Customer contact card: view, then one Edit button for the whole card
        function ContactCard({ job, profile }) {
            const [card, setCard] = useState(undefined);       // undefined = loading, null = none yet
            const [lockBox, setLockBox] = useState('');
            const [editing, setEditing] = useState(null);      // the form while editing
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [users, setUsers] = useState(null);          // active users, for the job team pickers (Owner/Admin only)
            const [importMsg, setImportMsg] = useState(null);  // { text, ok } after importing an intake form
            const [importing, setImporting] = useState(false);
            const fileRef = useRef(null);
            const isAdmin = ADMINS.includes(profile.role);
            const me = { uid: profile.uid, name: profile.name || profile.email || '' };
            const jobRef = db.collection('jobs').doc(job.id);
            const cardRef = jobRef.collection('notesInfo').doc('contactCard');

            useEffect(() => cardRef.onSnapshot(
                doc => setCard(doc.exists ? doc.data() : null),
                error => { setCard(null); setMessage('Error loading contact card: ' + error.message); }
            ), [job.id]);
            // Lock box comes live from the job, so a change in PO Manager shows here too
            useEffect(() => jobRef.onSnapshot(
                doc => setLockBox(doc.exists ? (doc.data().lockBox || '') : ''),
                () => {}
            ), [job.id]);
            // Tell the job drop down when the card is open for editing
            useEffect(() => { UNSAVED.card = !!editing; return () => { UNSAVED.card = false; }; }, [editing]);

            // Only Owner and Admin can read the users list, so only they load it
            const loadUsers = (fresh) => {
                if (isAdmin && (fresh || users === null)) {
                    db.collection('users').get().then(snap => {
                        const list = [];
                        snap.forEach(doc => { const d = doc.data(); if (d.active === true) list.push({ id: doc.id, ...d }); });
                        list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                        setUsers(list);
                    }).catch(error => { setUsers([]); setMessage('Error loading users for the job team: ' + error.message); });
                }
            };
            const startEdit = () => {
                setMessage('');
                setImportMsg(null);
                setEditing({ ...fullCard(card), lockBox });
                loadUsers(true);
            };
            const cancelEdit = () => { setEditing(null); setMessage(''); setImportMsg(null); };

            // Import a filled-in Customer Intake PDF: its boxes fill the card for review; nothing saves until Save
            const importIntake = async (file) => {
                if (!file) return;
                setImportMsg(null);
                setImporting(true);
                try {
                    const { values, boxes } = await readIntakePdf(file);
                    if (boxes === 0) {
                        setImportMsg({ text: 'This PDF has no fill-in boxes (it may be scanned or printed). Type the info in by hand.', ok: false });
                    } else {
                        const base = editing || { ...fullCard(card), lockBox };
                        const { next, filled, replaced } = applyIntake(base, values);
                        if (filled === 0) {
                            setImportMsg({ text: Object.values(values).some(Boolean) ? 'Everything on this form is already on the card.' : 'The form\'s boxes are empty. Fill it in on the computer, save it, then import it.', ok: false });
                            if (!editing) setEditing(base);
                        } else {
                            setEditing({ ...next, _import: file.name });
                            setImportMsg({ text: `Filled ${filled} box${filled === 1 ? '' : 'es'} from ${file.name}`
                                + (replaced ? ` (${replaced} replaced what was there before)` : '')
                                + '. Check them, then click Save contact card. Cancel undoes the import.', ok: true });
                        }
                        loadUsers();
                    }
                } catch (error) {
                    setImportMsg({ text: 'Could not read that PDF: ' + error.message, ok: false });
                }
                setImporting(false);
                if (fileRef.current) fileRef.current.value = '';
            };
            const importButton = (
                <span>
                    <input ref={fileRef} type="file" accept="application/pdf,.pdf" style={{ display: 'none' }} onChange={e => importIntake(e.target.files[0])} />
                    <button type="button" className="btn-secondary btn-sm" disabled={importing} onClick={() => fileRef.current && fileRef.current.click()}>
                        {importing ? 'Reading PDF...' : 'Import intake form (PDF)'}
                    </button>
                </span>
            );
            const importLine = importMsg && <div className={importMsg.ok ? 'ok-msg' : 'error'} style={{ marginBottom: '10px' }}>{importMsg.text}</div>;
            const userById = (uid) => (users || []).find(u => u.id === uid);
            const setTeam = (key, uid) => setEditing(prev => {
                const team = { ...prev.team };
                const u = userById(uid);
                if (u) team[key] = teamPerson(u); else delete team[key];
                return { ...prev, team };
            });
            const setField = (section, field, value) => setEditing(prev => ({ ...prev, [section]: { ...prev[section], [field]: value } }));
            const setHomeowner = (i, field, value) => setEditing(prev => {
                const homeowners = prev.homeowners.map((h, j) => (j === i ? { ...h, [field]: value } : h));
                return { ...prev, homeowners };
            });
            const setContact = (i, field, value) => setEditing(prev => ({
                ...prev, contacts: prev.contacts.map((x, j) => (j === i ? { ...x, [field]: value } : x))
            }));
            const addContact = () => setEditing(prev => ({ ...prev, contacts: [...prev.contacts, { ...EMPTY_CONTACT, extras: [] }] }));
            const removeContact = (i) => setEditing(prev => ({ ...prev, contacts: prev.contacts.filter((_, j) => j !== i) }));

            // Save: copy the card as it was (with the lock box) to history first, all in one save
            const save = async () => {
                setMessage('');
                const clean = cleanCard(editing);
                // Owner/Admin: refresh each team member's name, email and phone from the Users list
                if (isAdmin && users) Object.keys(clean.team).forEach(k => { const u = userById(clean.team[k].uid); if (u) clean.team[k] = teamPerson(u); });
                // Everyone else can't change the team, so it is saved exactly as it was
                if (!isAdmin) clean.team = card && card.team ? card.team : {};
                const newLock = (editing.lockBox || '').trim();
                const lockChanged = newLock !== (lockBox || '');
                const now = firebase.firestore.FieldValue.serverTimestamp();
                setSaving(true);
                try {
                    const batch = db.batch();
                    if (card || lockBox) {
                        const old = card ? { ...card } : {};
                        batch.set(cardRef.collection('history').doc(), { ...old, lockBox: lockBox || '', savedAt: now, savedBy: me });
                    }
                    const imported = editing._import ? { lastImport: { fileName: editing._import, importedAt: now, importedBy: me } }
                        : (card && card.lastImport ? { lastImport: card.lastImport } : {});
                    batch.set(cardRef, { ...clean, ...imported, updatedAt: now, updatedBy: me });
                    if (lockChanged) batch.update(jobRef, { lockBox: newLock, lockBoxUpdatedBy: me, lockBoxUpdatedAt: now });
                    await batch.commit();
                    setEditing(null);
                    setImportMsg(null);
                } catch (error) {
                    setMessage('Error saving contact card: ' + error.message);
                }
                setSaving(false);
            };

            if (card === undefined) return <div className="section"><div className="section-title">Contact card</div><p className="muted">Loading...</p></div>;

            if (editing) {
                const input = (value, onChange, label, kind) => (
                    <div className="card-field" key={label}>
                        <label>{label}</label>
                        <input type={kind === 'tel' ? 'tel' : kind === 'email' ? 'email' : 'text'} value={value} onChange={e => onChange(e.target.value)} />
                    </div>
                );
                const sectionEditor = (s) => (
                    <div key={s.key} className="card-group">
                        <div className="card-group-title">{s.title}</div>
                        <div className="card-grid">{s.fields.map(([f, label, kind]) => input(editing[s.key][f], v => setField(s.key, f, v), label, kind))}</div>
                        <ExtraItems items={editing[s.key].extras} onChange={list => setField(s.key, 'extras', list)} />
                    </div>
                );
                return (
                    <div className="section">
                        <div className="row">
                            <div className="section-title" style={{ marginBottom: 0 }}>Contact card</div>
                            {importButton}
                        </div>
                        {importLine}
                        <div className="card-group">
                            <div className="card-group-title">Job team</div>
                            {isAdmin ? (
                                <div>
                                    <div className="card-grid">
                                        {TEAM_ROLES.map(([k, label]) => {
                                            const picked = editing.team[k];
                                            const choices = (users || []).filter(u => (u.jobRoles || []).includes(k));
                                            const pickedListed = picked && choices.some(u => u.id === picked.uid);
                                            const now = picked && userById(picked.uid);
                                            const changed = now && (now.phone || '') !== (picked.phone || '');
                                            return (
                                                <div className="card-field" key={k}>
                                                    <label htmlFor={'team-' + k}>{label}</label>
                                                    <select id={'team-' + k} value={picked ? picked.uid : ''} disabled={users === null} onChange={e => setTeam(k, e.target.value)}>
                                                        <option value="">{users === null ? 'Loading...' : '-- None --'}</option>
                                                        {picked && !pickedListed && <option value={picked.uid}>{picked.name} (not marked {label} on Users screen)</option>}
                                                        {choices.map(u => <option key={u.id} value={u.id}>{u.name || u.email}</option>)}
                                                    </select>
                                                    {changed && <div className="note-meta" style={{ marginTop: '3px' }}>Phone changed on the Users screen. Saving updates it here.</div>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <p className="muted" style={{ marginTop: '6px' }}>Lists people by their job roles on the Dashboard's Users screen. Picking a Super here doesn't change who can see the job.</p>
                                </div>
                            ) : (
                                <div>
                                    {TEAM_ROLES.filter(([k]) => editing.team[k]).map(([k, label]) => (
                                        <div key={k} className="card-line"><span className="card-label">{label}</span>{editing.team[k].name}</div>
                                    ))}
                                    <p className="muted" style={{ marginTop: '4px' }}>Only Owner or Admin can change the job team.</p>
                                </div>
                            )}
                        </div>
                        {CARD_SECTIONS.filter(s => s.top).map(sectionEditor)}
                        {editing.homeowners.map((h, i) => (
                            <div key={i} className="card-group">
                                <div className="card-group-title">Homeowner {i + 1}</div>
                                <div className="card-grid">{HOMEOWNER_FIELDS.map(([f, label, kind]) => input(h[f], v => setHomeowner(i, f, v), label, kind))}</div>
                                <ExtraItems items={h.extras} onChange={list => setHomeowner(i, 'extras', list)} />
                            </div>
                        ))}
                        <div className="card-group">
                            <div className="card-group-title">Other contacts</div>
                            {editing.contacts.length === 0 && <p className="muted">None yet. Add a tenant, property manager, family member and so on.</p>}
                            {editing.contacts.map((ct, i) => (
                                <div key={i} className="contact-edit">
                                    <div className="row" style={{ alignItems: 'flex-end' }}>
                                        <div className="card-field" style={{ flex: 1 }}>
                                            <label>Title</label>
                                            <input type="text" list="contact-titles" placeholder="Type or pick, e.g. Tenant" value={ct.title} onChange={e => setContact(i, 'title', e.target.value)} />
                                        </div>
                                        <button type="button" className="btn-secondary btn-sm" onClick={() => removeContact(i)}>Remove contact</button>
                                    </div>
                                    <div className="card-grid" style={{ marginTop: '6px' }}>{CONTACT_FIELDS.map(([f, label, kind]) => input(ct[f], v => setContact(i, f, v), label, kind))}</div>
                                    <ExtraItems items={ct.extras} onChange={list => setContact(i, 'extras', list)} />
                                </div>
                            ))}
                            {editing.contacts.length < MAX_CONTACTS && <button type="button" className="btn-secondary btn-sm" onClick={addContact}>+ Add contact</button>}
                            <datalist id="contact-titles">{TITLE_SUGGESTIONS.map(t => <option key={t} value={t} />)}</datalist>
                        </div>
                        {CARD_SECTIONS.filter(s => !s.top).map(sectionEditor)}
                        <div className="card-group">
                            <div className="card-group-title">Lock box</div>
                            <div className="card-grid">{input(editing.lockBox, v => setEditing(prev => ({ ...prev, lockBox: v })), 'Lock box code (also shows in PO Manager)')}</div>
                        </div>
                        <div className="note-actions">
                            <button className="btn-primary btn-sm" style={{ width: 'auto' }} onClick={save} disabled={saving}>{saving ? 'Saving...' : 'Save contact card'}</button>
                            <button className="btn-secondary btn-sm" onClick={cancelEdit} disabled={saving}>Cancel</button>
                        </div>
                        {message && <div className="error">{message}</div>}
                    </div>
                );
            }

            const c = fullCard(card);
            const owners = c.homeowners.filter(h => h.name || h.phone || h.email || h.extras.length > 0);
            const contacts = c.contacts;
            const filled = (s) => s.fields.some(([f]) => c[s.key][f]) || c[s.key].extras.length > 0;
            const teamPicked = TEAM_ROLES.filter(([k]) => c.team[k]);
            const sectionView = (s) => (
                <div key={s.key} className="card-group">
                    <div className="card-group-title">{s.title}</div>
                    {s.fields.filter(([f]) => c[s.key][f]).map(([f, label, kind]) => (
                        <div key={f} className="card-line"><span className="card-label">{label}</span><CardValue value={c[s.key][f]} kind={kind} /></div>
                    ))}
                    <ExtraLines items={c[s.key].extras} />
                </div>
            );
            const nothing = teamPicked.length === 0 && owners.length === 0 && contacts.length === 0 && !CARD_SECTIONS.some(filled) && !lockBox;
            return (
                <div className="section">
                    <div className="row">
                        <div className="section-title" style={{ marginBottom: 0 }}>Contact card</div>
                        <span className="note-actions no-print">
                            {importButton}
                            <button className="btn-secondary btn-sm" onClick={startEdit}>Edit</button>
                        </span>
                    </div>
                    {importLine}
                    {nothing && <p className="muted" style={{ marginTop: '8px' }}>No contact info yet. Click Edit to add it.</p>}
                    <div className="card-view">
                        {teamPicked.length > 0 && (
                            <div className="card-group">
                                <div className="card-group-title">Job team</div>
                                {teamPicked.map(([k, label]) => {
                                    const p = c.team[k];
                                    return (
                                        <div key={k} style={{ marginBottom: '5px' }}>
                                            <div className="card-line" style={{ marginBottom: 0 }}><span className="card-label">{label}</span>{p.name}</div>
                                            {(p.phone || p.email) && (
                                                <div className="card-line" style={{ fontSize: '12px' }}>
                                                    {p.phone && <CardValue value={p.phone} kind="tel" />}
                                                    {p.phone && p.email && ' · '}
                                                    {p.email && <CardValue value={p.email} kind="email" />}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        {CARD_SECTIONS.filter(s => s.top && filled(s)).map(sectionView)}
                        {owners.map((h, i) => (
                            <div key={i} className="card-group">
                                <div className="card-group-title">Homeowner{owners.length > 1 ? ' ' + (i + 1) : ''}</div>
                                {HOMEOWNER_FIELDS.filter(([f]) => h[f]).map(([f, label, kind]) => (
                                    <div key={f} className="card-line"><span className="card-label">{label}</span><CardValue value={h[f]} kind={kind} /></div>
                                ))}
                                <ExtraLines items={h.extras} />
                            </div>
                        ))}
                        {contacts.map((ct, i) => (
                            <div key={'c' + i} className="card-group">
                                <div className="card-group-title">{ct.title || 'Contact'}</div>
                                {CONTACT_FIELDS.filter(([f]) => ct[f]).map(([f, label, kind]) => (
                                    <div key={f} className="card-line"><span className="card-label">{label}</span><CardValue value={ct[f]} kind={kind} /></div>
                                ))}
                                <ExtraLines items={ct.extras} />
                            </div>
                        ))}
                        {CARD_SECTIONS.filter(s => !s.top && filled(s)).map(sectionView)}
                        {lockBox && (
                            <div className="card-group">
                                <div className="card-group-title">Lock box</div>
                                <div className="card-line"><span className="card-label">Code</span><span>{lockBox}</span></div>
                            </div>
                        )}
                    </div>
                    {card && card.updatedBy && <div className="note-meta" style={{ marginTop: '6px' }}>Last updated by {card.updatedBy.name} · {fmtTime(card.updatedAt)}</div>}
                    {card && card.lastImport && <div className="note-meta">Intake form imported: {card.lastImport.fileName} · {card.lastImport.importedBy ? card.lastImport.importedBy.name : ''} · {fmtTime(card.lastImport.importedAt)}</div>}
                    {message && <div className="error">{message}</div>}
                </div>
            );
        }

        // One job's notes: the Add a note box and the notes list
        function JobNotes({ job, profile }) {
            const [tagList, setTagList] = useState(null);   // null = loading
            const [notes, setNotes] = useState(null);       // null = loading; includes hidden notes
            const [pickTags, setPickTags] = useState([]);
            const [text, setText] = useState('');
            const [followUp, setFollowUp] = useState('');
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [listening, setListening] = useState(false);
            const [showHidden, setShowHidden] = useState(false);
            const [filters, setFilters] = useState(NO_FILTERS);
            const [editing, setEditing] = useState(null);   // { id, text, tags } while editing a note
            const [listMessage, setListMessage] = useState('');
            const recognitionRef = useRef(null);
            const textRef = useRef(null);
            const me = { uid: profile.uid, name: profile.name || profile.email || '' };
            const isAdmin = ADMINS.includes(profile.role);
            const notesRef = db.collection('jobs').doc(job.id).collection('notes');

            // Company-wide tag list
            useEffect(() => {
                return db.collection('notesSettings').doc('tags').onSnapshot(doc => {
                    setTagList(doc.exists && Array.isArray(doc.data().list) ? doc.data().list : []);
                }, error => { setTagList([]); setMessage('Error loading tags: ' + error.message); });
            }, []);

            // This job's notes, newest first
            useEffect(() => {
                return notesRef.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data({ serverTimestamps: 'estimate' }) }));
                    setNotes(list);
                }, error => { setNotes([]); setListMessage('Error loading notes: ' + error.message); });
            }, [job.id]);

            // Stop voice if the page closes while listening
            useEffect(() => () => { recognitionRef.current && recognitionRef.current.stop(); }, []);

            // Tell the job drop down when a note is typed but not saved, or a note is being edited
            useEffect(() => {
                UNSAVED.note = !!text.trim();
                UNSAVED.edit = !!editing;
                return () => { UNSAVED.note = false; UNSAVED.edit = false; };
            }, [text, editing]);

            // Add a new tag to the company list. Tags can be added here but never removed.
            const addNewTag = (name) => db.collection('notesSettings').doc('tags')
                .update({ list: firebase.firestore.FieldValue.arrayUnion(name) });

            // Voice to text (Chrome/Edge), same approach as PO Manager
            const toggleVoice = () => {
                if (listening) { recognitionRef.current && recognitionRef.current.stop(); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setMessage('Voice input not supported in this browser (use Chrome or Edge)'); return; }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.continuous = true;
                rec.interimResults = false;
                rec.onresult = (e) => {
                    let spoken = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) spoken += e.results[i][0].transcript;
                    }
                    const el = textRef.current;
                    if (!spoken || !el) return;
                    const { value, pos } = insertAtCursor(el, spoken.trim());
                    setText(value);
                    setTimeout(() => { el.focus(); el.setSelectionRange(pos, pos); }, 0);
                };
                rec.onerror = (e) => { setMessage('Voice input error: ' + e.error); };
                rec.onend = () => setListening(false);
                recognitionRef.current = rec;
                rec.start();
                setListening(true);
            };

            const handleSave = async () => {
                setMessage('');
                if (!text.trim()) { setMessage('Type a note first.'); return; }
                if (pickTags.length === 0) { setMessage('Pick at least one tag.'); return; }
                if (listening && recognitionRef.current) recognitionRef.current.stop();
                setSaving(true);
                try {
                    await notesRef.add({
                        text: capLines(text.trim()),
                        tags: pickTags,
                        jobId: job.id,
                        jobCode: job.code,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        createdBy: me,
                        followUpDate: followUp,
                        followUpDone: false,
                        deleted: false
                    });
                    setText('');
                    setPickTags([]);
                    setFollowUp('');
                } catch (error) {
                    setMessage('Error saving note: ' + error.message);
                }
                setSaving(false);
            };

            // The author can edit for 24 hours after saving
            const canEdit = (n) => n.createdBy && n.createdBy.uid === me.uid && n.deleted !== true && n.createdAt && n.createdAt.toDate
                && Date.now() < n.createdAt.toDate().getTime() + EDIT_HOURS * 3600 * 1000;

            // Save an edit. The note as it was is copied to its history first, in the same save.
            const saveEdit = async (n) => {
                setListMessage('');
                const newText = capLines(editing.text.trim());
                if (!newText) { setListMessage('A note can\'t be empty.'); return; }
                if (editing.tags.length === 0) { setListMessage('Pick at least one tag.'); return; }
                if (newText === n.text && editing.tags.join('|') === (n.tags || []).join('|')
                    && editing.followUpDate === (n.followUpDate || '')) { setEditing(null); return; }
                try {
                    const batch = db.batch();
                    batch.set(notesRef.doc(n.id).collection('versions').doc(),
                        { ...noteCopy(n), action: 'edit', savedAt: firebase.firestore.FieldValue.serverTimestamp(), savedBy: me });
                    batch.update(notesRef.doc(n.id),
                        { text: newText, tags: editing.tags, followUpDate: editing.followUpDate, editedAt: firebase.firestore.FieldValue.serverTimestamp(), editedBy: me });
                    await batch.commit();
                    setEditing(null);
                } catch (error) {
                    setListMessage('Error saving edit: ' + error.message + ' (notes can only be edited for 24 hours)');
                }
            };

            // Owner and Admin: hide or restore a note. Nothing is ever deleted; each change keeps a copy in history.
            const setHidden = async (n, hide) => {
                setListMessage('');
                if (hide && !window.confirm('Hide this note? Owner and Admin can restore it later.')) return;
                const now = firebase.firestore.FieldValue.serverTimestamp();
                try {
                    const batch = db.batch();
                    batch.set(notesRef.doc(n.id).collection('versions').doc(),
                        { ...noteCopy(n), action: hide ? 'hide' : 'restore', savedAt: now, savedBy: me });
                    batch.update(notesRef.doc(n.id), hide
                        ? { deleted: true, deletedBy: me, deletedAt: now }
                        : { deleted: false, deletedBy: firebase.firestore.FieldValue.delete(), deletedAt: firebase.firestore.FieldValue.delete() });
                    await batch.commit();
                } catch (error) {
                    setListMessage('Error ' + (hide ? 'hiding' : 'restoring') + ' note: ' + error.message);
                }
            };

            // Anyone who can see the job can mark a follow-up done; it records who and when
            const markDone = async (n) => {
                setListMessage('');
                try {
                    await notesRef.doc(n.id).update({ followUpDone: true, followUpDoneBy: me, followUpDoneAt: firebase.firestore.FieldValue.serverTimestamp() });
                } catch (error) {
                    setListMessage('Error marking follow-up done: ' + error.message);
                }
            };

            const today = todayStr();
            const openFollowUps = (notes || []).filter(n => n.deleted !== true && n.followUpDate && n.followUpDone !== true)
                .sort((a, b) => a.followUpDate.localeCompare(b.followUpDate));
            const hiddenCount = (notes || []).filter(n => n.deleted === true).length;
            const visible = (notes || []).filter(n => n.deleted !== true || (isAdmin && showHidden));
            const shown = applyFilters(visible, filters);
            const filtering = JSON.stringify(filters) !== JSON.stringify(NO_FILTERS);
            const handleExport = () => exportNotesCsv(shown.map(n => ({ ...n, jobCode: n.jobCode || job.code })),
                `Notes_${safeName(job.code)}_${todayStr()}.csv`, isAdmin && showHidden);

            return (
                <div>
                    {openFollowUps.length > 0 && (
                        <div className="followups">
                            <div className="section-title" style={{ marginBottom: '6px' }}>Open follow-ups ({openFollowUps.length})</div>
                            {openFollowUps.map(n => {
                                const late = n.followUpDate < today;
                                return (
                                    <div key={n.id} className="fu-item">
                                        <div>
                                            <div className={late ? 'fu-date late' : 'fu-date'}>
                                                {fmtDay(n.followUpDate)}{n.followUpDate === today ? ' (today)' : late ? ' (overdue)' : ''}
                                                <span className="note-meta" style={{ fontWeight: 400 }}> · {(n.tags || []).join(', ')} · {(n.createdBy && n.createdBy.name) || 'Unknown'}</span>
                                            </div>
                                            <div className="fu-text">{n.text}</div>
                                        </div>
                                        <button className="btn-secondary btn-sm" onClick={() => markDone(n)}>Done</button>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <div className="section no-print">
                        <div className="section-title">Add a note</div>
                        <div className="form-group">
                            <label htmlFor="tag-pick">Tags</label>
                            <TagPicker id="tag-pick" tagList={tagList} value={pickTags} onChange={setPickTags} onNewTag={addNewTag} />
                        </div>
                        <div className="form-group">
                            <div className="row">
                                <label htmlFor="note-text" style={{ marginBottom: 0 }}>Note</label>
                                <button type="button" className={listening ? 'btn-danger btn-sm' : 'btn-secondary btn-sm'} onClick={toggleVoice}>
                                    {listening ? '■ Stop' : '🎤 Voice'}
                                </button>
                            </div>
                            <textarea id="note-text" ref={textRef} value={text} placeholder="Type or use Voice..."
                                onChange={e => setText(capLines(e.target.value))} />
                        </div>
                        <div className="form-group">
                            <label htmlFor="follow-up">Follow-up date (optional)</label>
                            <input id="follow-up" type="date" value={followUp} onChange={e => setFollowUp(e.target.value)} />
                            {followUp && <button type="button" className="btn-secondary btn-sm" style={{ marginLeft: '8px' }} onClick={() => setFollowUp('')}>Clear</button>}
                        </div>
                        <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : 'Save note'}</button>
                        {message && <div className="error">{message}</div>}
                    </div>

                    <div className="section">
                        <div className="row">
                            <div className="section-title" style={{ marginBottom: 0 }}>Notes</div>
                            {isAdmin && (
                                <label className="check">
                                    <input type="checkbox" checked={showHidden} onChange={e => setShowHidden(e.target.checked)} />
                                    Show hidden ({hiddenCount})
                                </label>
                            )}
                        </div>
                        <NoteFilters tagList={tagList} people={peopleIn(notes || [])} value={filters} onChange={setFilters} />
                        <div className="filter-bar">
                            <span>
                                {filtering ? `Showing ${shown.length} of ${visible.length} notes` : `${shown.length} note${shown.length === 1 ? '' : 's'}`}
                                {filtering && <button className="btn-secondary btn-sm" style={{ marginLeft: '8px' }} onClick={() => setFilters(NO_FILTERS)}>Clear filters</button>}
                            </span>
                            <span className="note-actions">
                                <button className="btn-secondary btn-sm" onClick={handleExport} disabled={shown.length === 0}>Export to Excel (CSV)</button>
                                <button className="btn-secondary btn-sm" onClick={() => window.print()} disabled={shown.length === 0}>Print / PDF</button>
                            </span>
                        </div>
                        <div className="print-only note-meta">Printed {fmtTime({ toDate: () => new Date() })}{filtering ? ' · filtered' : ''}</div>
                        {listMessage && <div className="error" style={{ marginBottom: '10px' }}>{listMessage}</div>}
                        {notes === null && <p className="muted">Loading notes...</p>}
                        {notes && visible.length === 0 && <p className="muted">No notes yet for this job.</p>}
                        {notes && visible.length > 0 && shown.length === 0 && <p className="muted">No notes match these filters.</p>}
                        {shown.map(n => {
                            const hidden = n.deleted === true;
                            const isEditing = editing && editing.id === n.id;
                            return (
                                <div key={n.id} className={hidden ? 'note note-hidden' : 'note'}>
                                    <div className="row">
                                        <div className="note-meta" style={{ marginBottom: 0 }}>
                                            {fmtTime(n.createdAt)} · {(n.createdBy && n.createdBy.name) || 'Unknown'}
                                            {n.editedAt && <span title={'Edited ' + fmtTime(n.editedAt)}> · edited</span>}
                                        </div>
                                        {!isEditing && (
                                            <div className="note-actions">
                                                {canEdit(n) && <button className="btn-secondary btn-sm" onClick={() => { setListMessage(''); setEditing({ id: n.id, text: n.text || '', tags: n.tags || [], followUpDate: n.followUpDate || '' }); }}>Edit</button>}
                                                {isAdmin && !hidden && <button className="btn-secondary btn-sm" onClick={() => setHidden(n, true)}>Hide</button>}
                                                {isAdmin && hidden && <button className="btn-secondary btn-sm" onClick={() => setHidden(n, false)}>Restore</button>}
                                            </div>
                                        )}
                                    </div>
                                    {hidden && <div className="note-meta">Hidden by {(n.deletedBy && n.deletedBy.name) || 'Unknown'} · {fmtTime(n.deletedAt)}</div>}
                                    {isEditing ? (
                                        <div style={{ marginTop: '8px' }}>
                                            <div className="form-group">
                                                <TagPicker id={'edit-tags-' + n.id} tagList={tagList} value={editing.tags}
                                                    onChange={tags => setEditing({ ...editing, tags })} onNewTag={addNewTag} />
                                            </div>
                                            <div className="form-group">
                                                <textarea value={editing.text} onChange={e => setEditing({ ...editing, text: capLines(e.target.value) })} />
                                            </div>
                                            <div className="form-group">
                                                <label htmlFor={'edit-fu-' + n.id}>Follow-up date (optional)</label>
                                                <input id={'edit-fu-' + n.id} type="date" value={editing.followUpDate} onChange={e => setEditing({ ...editing, followUpDate: e.target.value })} />
                                                {editing.followUpDate && <button type="button" className="btn-secondary btn-sm" style={{ marginLeft: '8px' }} onClick={() => setEditing({ ...editing, followUpDate: '' })}>Clear</button>}
                                            </div>
                                            <div className="note-actions">
                                                <button className="btn-primary btn-sm" style={{ width: 'auto' }} onClick={() => saveEdit(n)}>Save edit</button>
                                                <button className="btn-secondary btn-sm" onClick={() => { setEditing(null); setListMessage(''); }}>Cancel</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="chips">
                                                {(n.tags || []).map(t => <span key={t} className="chip">{t}</span>)}
                                            </div>
                                            <div className="note-text">{n.text}</div>
                                            {n.followUpDate && (
                                                <div className="fu-line">
                                                    Follow up {fmtDay(n.followUpDate)}
                                                    {n.followUpDone === true
                                                        ? ` · Done by ${(n.followUpDoneBy && n.followUpDoneBy.name) || 'Unknown'}${n.followUpDoneAt ? ' ' + fmtTime(n.followUpDoneAt) : ''}`
                                                        : ' · open'}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Search across all jobs the person can see. Owner, Admin, Estimator and Office search every job at once
        // (a "collection group" query); Supers search their assigned jobs one by one, as the rules require.
        const SEES_ALL = ['owner', 'admin', 'estimator', 'office'];
        const daysAgo = (n) => { const t = new Date(Date.now() - n * 86400000); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };

        function AllJobsSearch({ profile }) {
            const [tagList, setTagList] = useState(null);
            const [filters, setFilters] = useState({ ...NO_FILTERS, from: daysAgo(30) });
            const [results, setResults] = useState(null);     // null = not searched yet
            const [searching, setSearching] = useState(false);
            const [message, setMessage] = useState('');
            const [showHidden, setShowHidden] = useState(false);
            const [ran, setRan] = useState(null);             // the filters used for the last search
            const isAdmin = ADMINS.includes(profile.role);

            useEffect(() => db.collection('notesSettings').doc('tags').onSnapshot(
                doc => setTagList(doc.exists && Array.isArray(doc.data().list) ? doc.data().list : []),
                () => setTagList([])
            ), []);

            // Dates go to the database; tag and person are applied after, so only one index is needed
            const dated = (q, f) => {
                if (f.from) q = q.where('createdAt', '>=', new Date(f.from + 'T00:00:00'));
                if (f.to) q = q.where('createdAt', '<=', new Date(f.to + 'T23:59:59.999'));
                return q.orderBy('createdAt', 'desc');
            };

            const runSearch = async (f) => {
                setMessage('');
                if (f.from && f.to && f.from > f.to) { setMessage('The From date is after the To date.'); return; }
                setSearching(true);
                try {
                    const list = [];
                    const add = (doc) => {
                        const d = doc.data({ serverTimestamps: 'estimate' });
                        list.push({ id: doc.id, ...d, jobId: d.jobId || doc.ref.parent.parent.id });
                    };
                    if (SEES_ALL.includes(profile.role)) {
                        (await dated(db.collectionGroup('notes'), f).get()).forEach(add);
                    } else {
                        const jobs = await db.collection('jobs').where('assignedSupers', 'array-contains', profile.uid).get();
                        const ids = [];
                        jobs.forEach(j => ids.push(j.id));
                        const snaps = await Promise.all(ids.map(id => dated(db.collection('jobs').doc(id).collection('notes'), f).get()));
                        snaps.forEach(s => s.forEach(add));
                        list.sort((a, b) => (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0));
                    }
                    setResults(list);
                    setRan(f);
                } catch (error) {
                    // The first time a search runs, Firestore may ask for an index. Its message includes a link to send to Spencer.
                    setMessage('Search error: ' + error.message + (/index/i.test(error.message) ? ' — Please send this message (with its link) to Spencer.' : ''));
                    setResults(null);
                }
                setSearching(false);
            };

            useEffect(() => { runSearch(filters); }, []);

            // Changing a date needs a new search; tag and person filter what is already loaded
            const datesChanged = ran && (ran.from !== filters.from || ran.to !== filters.to);
            const visible = (results || []).filter(n => n.deleted !== true || (isAdmin && showHidden));
            const shown = applyFilters(visible, { ...filters, from: '', to: '' });
            const hiddenCount = (results || []).filter(n => n.deleted === true).length;
            const handleExport = () => exportNotesCsv(shown, `Notes_AllJobs_${todayStr()}.csv`, isAdmin && showHidden);

            return (
                <div className="section">
                    <div className="row">
                        <div className="section-title" style={{ marginBottom: 0 }}>Search all jobs</div>
                        {isAdmin && (
                            <label className="check">
                                <input type="checkbox" checked={showHidden} onChange={e => setShowHidden(e.target.checked)} />
                                Show hidden ({hiddenCount})
                            </label>
                        )}
                    </div>
                    <p className="muted" style={{ margin: '4px 0 10px' }}>
                        {SEES_ALL.includes(profile.role) ? 'Searches every job.' : 'Searches the jobs assigned to you.'} To add or change notes, open a job.
                    </p>
                    <NoteFilters tagList={tagList} people={peopleIn(results || [])} value={filters} onChange={setFilters} />
                    <div className="filter-bar">
                        <span className="note-actions" style={{ alignItems: 'center' }}>
                            <button className={datesChanged ? 'btn-primary btn-sm' : 'btn-secondary btn-sm'} style={{ width: 'auto' }}
                                onClick={() => runSearch(filters)} disabled={searching}>{searching ? 'Searching...' : 'Search'}</button>
                            <button className="btn-secondary btn-sm" onClick={() => { setFilters(NO_FILTERS); runSearch(NO_FILTERS); }} disabled={searching}>All dates</button>
                            {results && !searching && <span>{shown.length} note{shown.length === 1 ? '' : 's'}{datesChanged ? ' · dates changed, click Search' : ''}</span>}
                        </span>
                        <span className="note-actions">
                            <button className="btn-secondary btn-sm" onClick={handleExport} disabled={shown.length === 0}>Export to Excel (CSV)</button>
                            <button className="btn-secondary btn-sm" onClick={() => window.print()} disabled={shown.length === 0}>Print / PDF</button>
                        </span>
