    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",
            projectId: "po-project-ea1ca",
            storageBucket: "po-project-ea1ca.firebasestorage.app",
            messagingSenderId: "589238434084",
            appId: "1:589238434084:web:a97e8382c585362a7c1bb1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage(); // request attachments, in the same job folder PO Manager uses
        const functions = firebase.functions(); // sendQuoteRequest: emails a request through Postmark

        const ALLOWED = ['owner', 'admin', 'estimator'];
        const ADMINS = ['owner', 'admin']; // can restore removed trades

        // Built-in start list (from the Stark W 2602 Trade Recap, sub names removed).
        // Used until a start list is saved with "Edit start list".
        const DEFAULT_START = [
            ['APP', 'Appliances'],
            ['AWN', 'Alumawood patio covers'],
            ['CAB', 'Cabinets / counter tops'],
            ['CLN #1', 'Final clean'],

            ['DMO #4', 'Trailer loads'],

            ['DRY #2', 'Drywall material'],

            ['ELE/LIT #2', 'Lighting material'],
            ['EQU', 'Heavy equipment'],
            ['FCC', 'Carpet'],

            ['FCT', 'Floor tile'],
            ['FCV', 'Vinyl / plank'],
            ['FEE', 'Eagle View / iGuide'],

            ['FEE', 'Building'],
            ['FNC/DOR #1', 'Exterior door labor'],
            ['FNC/DOR #2', 'Molding and door labor'],
            ['FNC/DOR #3', 'Molding and door material'],
            ['FNC/DOR #4', 'Balustrade'],
            ['FNC/DOR #5', 'Garage door'],
            ['FNH #1', 'Finish hardware labor'],
            ['FNH #2', 'Finish hardware material'],
            ['FPL', 'Fireplace zero clearance'],
            ['FPS', 'Fire sprinklers'],
            ['FRM #1', 'Framing labor'],
            ['FRM #2', 'Framing material'],
            ['FRM #3', 'Truss'],
            ['FRM #4', 'Patio/deck framing labor'],
            ['FRM #5', 'Patio/deck framing material'],
            ['HVC', 'Heat and air'],
            ['INS', 'Insulation'],
            ['LAB', 'Multiple entries'],
            ['LND', 'Landscaping'],
            ['MAS #1', 'Masonry labor'],
            ['MAS #2', 'Masonry material'],
            ['MBL', 'Shower walls, sheet material'],
            ['MPR', 'Moisture protection / decks'],
            ['MSD/GLS', 'Glass work'],
            ['ORI', 'Ornamental iron'],
            ['PLM #1', 'Plumbing labor'],
            ['PLM #2', 'Plumbing fixtures'],
            ['PLM #3', 'Shower pan'],
            ['PNL', 'Paneling'],
            ['PNT #1', 'Paint'],
            ['PNT #2', 'Seal/deo'],
            ['PNT #3', 'Seal/deo material'],
            ['RFG', 'Roofing'],
            ['SDG #1', 'Siding labor'],
            ['SDG #2', 'Siding material'],
            ['SFG', 'Soffit / fascia / gutter'],
            ['STL', 'Steel components'],
            ['STU/SCF', 'Stucco'],
            ['TIL', 'Showers / fireplace face'],
            ['TMP', 'Camera'],
            ['TMP', 'Temp electric'],
            ['TMP', 'Toilet'],
            ['TMP', 'Hand wash'],
            ['WDS', 'Skylight material'],
            ['WDT #1', 'Blinds'],
            ['WDT #2', 'Plantation shutters'],
            ['WDV #1', 'Window labor'],
            ['WDV #2', 'Window material'],
            ['WDV - skylight', 'Skylight labor'],
            ['WDV - skylight', 'Skylight material']
        ].map(([code, name], i) => ({ id: 's' + i, code, name }));

        const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

        // Alphabetical by trade code. Spaces ignored, numbers compared as numbers (#2 before #10).
        const cmpCode = (a, b) => {
            const parts = (s) => (s || '').toUpperCase().replace(/\s+/g, '').match(/\d+|\D+/g) || [];
            const x = parts(a), y = parts(b);
            for (let i = 0; i < Math.min(x.length, y.length); i++) {
                const p = x[i], q = y[i];
                if (/^\d/.test(p) && /^\d/.test(q)) { if (+p !== +q) return +p - +q; }
                else if (p !== q) return p < q ? -1 : 1;
            }
            return x.length - y.length;
        };
        // Lines with the same code keep the order they were in
        const sortLines = (lines) => [...lines].sort((a, b) => cmpCode(a.code, b.code));

        // A new job starts with a blank copy of every trade on the start list
        // The start list trade a job trade came from: matched by where the line came from, else by code and description
        const findStart = (startList, l) => {
            const live = (startList || []).filter(x => !x.deleted);
            const same = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
            return live.find(x => l.startId && x.id === l.startId) || live.find(x => same(x.code, l.code) && same(x.name, l.name)) || null;
        };
        // Price list items saved on a start list trade, as blank job items (quantity and note empty)
        const jobItems = (items) => (items || []).filter(i => (i.name || '').trim()).map(i => ({ id: newId(), name: i.name, price: i.price || '', qty: '', note: '' }));
        const copyStart = (start) => sortLines(start.filter(l => !l.deleted).map(l => {
            const line = { id: newId(), startId: l.id, code: l.code, name: l.name, method: l.method || '' };
            if (l.method === 'calculator' && l.items && l.items.length) line.ws = { citems: jobItems(l.items) };
            if (l.method === 'allowance' && (l.defSf || l.defSl)) line.ws = { defSf: l.defSf || DEFAULT_SPLIT, defSl: l.defSl || DEFAULT_LABOR_PCT };
            return line;
        }));

        // What gets saved: no on-screen flags, no fully blank lines
        const cleanLines = (lines) => sortLines(lines)
            .map(({ _new, ...l }) => ({ ...l, code: (l.code || '').trim(), name: (l.name || '').trim() }))
            .filter(l => l.code || l.name);

        const toDate = (ts) => ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
        const fmtDay = (ts) => { const d = toDate(ts); return d ? d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }) : ''; };
        const fmtStamp = (ts) => { const d = toDate(ts); return d ? d.toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' }) : ''; };

        // Primary method per trade. Calculator comes later.
        //   Quote:  vendor price is typed in; the CES may need new unit prices to hold margin
        //   Factor: vendor price = Xactimate total x factor; the CES does not change
        //   Allowance: labor (I lines) and material (M lines) each get a factor and their own total
        //   Calculator: vendor price = a price list (quantity x price each); otherwise the same as Quote
        const METHODS = [['', ''], ['quote', 'Quote'], ['factor', 'Factor'], ['allowance', 'Allowance'], ['calculator', 'Calculator']];
        const hasWorksheet = (m) => m === 'quote' || m === 'factor' || m === 'allowance' || m === 'calculator';
        const DEFAULT_FACTOR = '0.70'; // Quote: retail needed = vendor price / 0.70
        const DEFAULT_MULT = '0.50';   // Factor: vendor price = Xactimate total x 0.50
        const DEFAULT_LABOR_MULT = '0.80'; // Allowance: labor = I lines x 0.80
        const DEFAULT_MAT_MULT = '1.00';   // Allowance: material = M lines x 1.00 (no margin on allowances)
        const DEFAULT_SPLIT = '0.80';      // Allowance split line: retail x 0.80 ...
        const DEFAULT_LABOR_PCT = '50';    // ... then this percent to labor, the rest to material
        const BASEBOARD_LABOR_PER_LF = 2.25; // vendor labor price to install baseboard, used in the baseboard reminder
        const UNITS = ['SF', 'LF', 'EA', 'SQ', 'SY', 'HR', 'DA', 'WK', 'MO'];

        // Numbers are typed as text so $ and commas are fine
        const n = (v) => { const x = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(x) ? 0 : x; };
        const round2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
        const money = (x) => (x < 0 ? '-' : '') + '$' + Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const blankWs = () => ({ vendor: '', matVendor: '', quote: '', pad: [], apad: [], citems: [], factor: DEFAULT_FACTOR, mult: DEFAULT_MULT, laborMult: DEFAULT_LABOR_MULT, matMult: DEFAULT_MAT_MULT, defSf: DEFAULT_SPLIT, defSl: DEFAULT_LABOR_PCT, xact: [] });
        // A box the user has actually filled in (blank or untouched follows the trade's starting numbers)
        const own = (v) => v != null && String(v).trim() !== '';
        // A typed factor: 60 works as 0.60 (1.2 stays 1.2); blank falls back to the default
        const factorOf = (v, def) => { let x = n(v); if (x > 3) x = x / 100; return x > 0 ? x : n(def); };
        // A typed percent, 0 to 100; blank falls back to the default
        const pctOf = (v, def) => { const t = String(v == null ? '' : v).trim(); return Math.min(100, Math.max(0, t === '' ? n(def) : n(t))) / 100; };
        // Xactimate activity of a line: I = install (labor), M = material, + and the rest = both
        const actOf = (x) => x.act || (((x.desc || '').match(/^[A-Z]{3} \S+ (\S) /) || [])[1] || '');

        // All the math for one trade's worksheet
        function calcWs(ws, method) {
            const padTotal = ws.pad.reduce((t, p) => t + n(p.amount), 0);
            const rows = ws.xact.map(x => {
                // Lines marked CHANGE, OPEN-ITEM, BID ITEM... carry no dollars, same as on the Work Order
                if (x.marker) return { ...x, total: 0 };
                // Untouched Work Order line: use the total printed on the Work Order (Xactimate rounds its own way)
                const asPrinted = x.woTotal != null && x.qty === x.woQty && x.price === x.woPrice;
                return { ...x, total: asPrinted ? x.woTotal : round2(n(x.qty) * n(x.price)) };
            });
            const xactTotal = round2(rows.reduce((t, r) => t + r.total, 0));

            if (method === 'allowance') {
                const laborMult = factorOf(ws.laborMult, DEFAULT_LABOR_MULT), matMult = factorOf(ws.matMult, DEFAULT_MAT_MULT);
                let iTotal = 0, mTotal = 0, oTotal = 0, oLabor = 0, oMat = 0, oCount = 0;
                rows.forEach(r => {
                    const a = actOf(r);
                    r.kind = a === 'I' ? 'labor' : a === 'M' ? 'material' : 'split';
                    if (r.marker) return;
                    if (r.kind === 'labor') iTotal += r.total;
                    else if (r.kind === 'material') mTotal += r.total;
                    else {
                        // Line that is labor and material together: retail x factor, then divided by the labor percent
                        const cost = round2(r.total * factorOf(own(r.sf) ? r.sf : ws.defSf, DEFAULT_SPLIT));
                        r.labor = round2(cost * pctOf(own(r.sl) ? r.sl : ws.defSl, DEFAULT_LABOR_PCT));
                        r.mat = round2(cost - r.labor);
                        oTotal += r.total; oLabor += r.labor; oMat += r.mat; oCount++;
                    }
                });
                // Scratch pad lines work the same way from a typed retail amount
                const pads = (ws.apad || []).map(p => {
                    const cost = round2(n(p.retail) * factorOf(p.factor, DEFAULT_SPLIT));
                    const laborAmt = round2(cost * pctOf(p.labor, DEFAULT_LABOR_PCT));
                    return { ...p, laborAmt, matAmt: round2(cost - laborAmt) };
                });
                const padRetail = round2(pads.reduce((t, p) => t + n(p.retail), 0));
                const iBase = round2(iTotal * laborMult), mBase = round2(mTotal * matMult);
                const labor = round2(iBase + oLabor + pads.reduce((t, p) => t + p.laborAmt, 0));
                const material = round2(mBase + oMat + pads.reduce((t, p) => t + p.matAmt, 0));
                const vendorPrice = round2(labor + material);
                const retailBase = round2(xactTotal + padRetail);   // retail the margin is measured against
                return {
                    rows, xactTotal, pads, padRetail, iBase, mBase, labor, material, vendorPrice, retailBase, oCount,
                    iTotal: round2(iTotal), mTotal: round2(mTotal), oTotal: round2(oTotal), oLabor: round2(oLabor), oMat: round2(oMat),
                    margin: retailBase > 0 ? (retailBase - vendorPrice) / retailBase : null
                };
            }

            if (method === 'factor') {
                let mult = n(ws.mult);
                if (mult > 3) mult = mult / 100;                          // 50 typed for 0.50 (1.2 stays 1.2)
                if (!(mult > 0)) mult = n(DEFAULT_MULT);
                const base = round2(xactTotal * mult);                    // Xactimate total x factor
                const vendorPrice = round2(base + padTotal);              // plus scratch pad
                return { rows, xactTotal, mult, base, vendorPrice, margin: xactTotal > 0 ? (xactTotal - vendorPrice) / xactTotal : null };
            }

            // Calculator: quantity x price each for every item on the price list
            const items = (ws.citems || []).map(i => ({ ...i, total: round2(n(i.qty) * n(i.price)) }));
            const itemsTotal = round2(items.reduce((t, i) => t + i.total, 0));
            const vendorPrice = round2((method === 'calculator' ? itemsTotal : n(ws.quote)) + padTotal); // quote or items, + scratch pad
            let factor = n(ws.factor);
            if (factor > 1) factor = factor / 100;                        // 70 typed for 0.70
            if (!(factor > 0)) factor = n(DEFAULT_FACTOR);
            const retail = round2(vendorPrice / factor);                  // what Xactimate needs to total
            // New unit prices: every priced line moves by the same percentage, rounded to the cent
            const ratio = xactTotal > 0 ? retail / xactTotal : 0;
            rows.forEach(r => {
                r.newPrice = r.marker ? 0 : round2(n(r.price) * ratio);
                r.newTotal = r.marker ? 0 : round2(n(r.qty) * r.newPrice);
            });
            const newTotal = round2(rows.reduce((t, r) => t + r.newTotal, 0));
            return {
                vendorPrice, factor, retail, rows, xactTotal, newTotal, items, itemsTotal,
                diff: round2(xactTotal - retail),                         // + over, - short
                margin: xactTotal > 0 ? (xactTotal - vendorPrice) / xactTotal : null,
                leftover: round2(newTotal - retail)                       // rounding leftover at the new prices
            };
        }
        const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Xactimate categories a trade code starts with on the picker: "INS" -> INS, "FNC/DOR #2" -> FNC and DOR, "PNT-DEO" -> PNT
        const catsFor = (code) => (code || '').toUpperCase().split(/[\s#]/)[0].split(/[\/-]/).filter(t => /^[A-Z]{3}$/.test(t));

        // Read an Xactimate Work Order PDF (already opened with pdf.js) into its line items
        async function parseWorkOrder(pdf) {
            const num = (s) => parseFloat(String(s).replace(/,/g, ''));
            const out = { date: '', estimate: '', lines: [], catTotals: {}, catNames: {} };
            let cat = '';     // category section we are in
            let cur = null;   // item waiting for its quantity/price row
            let last = null;  // last finished item (a marker like "ROOF BID ITEM" can wrap to a second row)
            for (let p = 1; p <= pdf.numPages; p++) {
                const page = await pdf.getPage(p);
                const tc = await page.getTextContent();
                // Group the text into rows by height on the page
                const rows = [];
                tc.items.forEach(it => {
                    const s = (it.str || '').trim();
                    if (!s) return;
                    const x = it.transform[4], y = it.transform[5];
                    let row = rows.find(r => Math.abs(r.y - y) < 2);
                    if (!row) { row = { y, parts: [] }; rows.push(row); }
                    row.parts.push({ x, s });
                });
                rows.sort((a, b) => b.y - a.y);
                rows.forEach(row => {
                    row.parts.sort((a, b) => a.x - b.x);
                    const text = row.parts.map(q => q.s).join(' ').replace(/\s+/g, ' ');
                    const x0 = row.parts[0].x;
                    let m;
                    if ((m = text.match(/^(\d{1,2}\/\d{1,2}\/\d{4}) Page: \d+$/))) { if (!out.date) out.date = m[1]; return; }
                    if (row.y > 770) return; // page number at the top edge
                    if ((m = text.match(/^Estimate: (\S+)/))) { out.estimate = m[1]; return; }
                    if (x0 < 60 && (m = text.match(/^TOTAL .*?(-?[\d,]+\.\d{2})?$/))) { if (cat) out.catTotals[cat] = m[1] ? num(m[1]) : 0; return; }
                    // Quantity row: "1,743.04 SF 2.16 3,764.97 [ ]" or "... CHANGE [ ]"
                    if (cur && (m = text.match(/^(-?[\d,]+\.\d{2}) ([A-Z]{2,3}) (-?[\d,]+\.\d{2}) (.+?)(?: \[ ?\])?$/))) {
                        cur.qty = m[1]; cur.unit = m[2]; cur.price = m[3];
                        if (/^-?[\d,]+\.\d{2}$/.test(m[4])) { cur.total = num(m[4]); cur.marker = ''; }
                        else { cur.total = null; cur.marker = m[4]; }
                        out.lines.push(cur); last = cur; cur = null;
                        return;
                    }
                    // Rest of a marker that wrapped ("ROOF BID" / "ITEM")
                    if (!cur && last && last.marker && row.parts.length === 1 && x0 > 480) { last.marker += ' ' + text; last = null; return; }
                    // Category heading: "INS INSULATION" (starts further left than the items)
                    if (x0 < 42 && (m = text.match(/^([A-Z]{3}) [A-Z]/))) { cat = m[1]; out.catNames[cat] = text.slice(4); cur = null; last = null; return; }
                    // Item row: category, selector, activity, description
                    if (x0 >= 42 && x0 < 60) {
                        if (/^[A-Z]{3}$/.test(row.parts[0].s)) {
                            const rest = row.parts.slice(1);
                            cur = {
                                cat: row.parts[0].s,
                                sel: rest.filter(q => q.x < 160).map(q => q.s).join(' '),
                                act: rest.filter(q => q.x >= 160 && q.x < 182).map(q => q.s).join(' '),
                                desc: rest.filter(q => q.x >= 182).map(q => q.s).join(' ')
                            };
                        } else if ((m = text.match(/^([A-Z]{3}) (\S+) (\S) (.+)$/))) {
                            cur = { cat: m[1], sel: m[2], act: m[3], desc: m[4] };
                        }
                        return;
                    }
                    // Description that wrapped to a second row
                    if (cur && x0 >= 182) cur.desc += ' ' + text;
                });
            }
            // Key per line = its text plus which copy it is (the same item can be listed more than once)
            const seen = {};
            out.lines.forEach(l => {
                const k = `${l.cat}|${l.sel}|${l.act}|${l.desc}`;
                seen[k] = (seen[k] || 0) + 1;
                l.key = `${k}#${seen[k]}`;
            });
            return out;
        }

        // Pick which Work Order categories and lines go into one trade
        function WorkOrderPicker({ wo, line, prev, existing, onImport, onCancel }) {
            const present = [...new Set(wo.lines.map(l => l.cat))];
            const skippedBefore = new Set((prev && prev.skipped) || []);
            // Start from the last picks for this trade; first time, from the trade's own category
            const [cats, setCats] = useState(() => ((prev && prev.cats && prev.cats.length) ? prev.cats : catsFor(line.code)).filter(k => present.includes(k)));
            const [off, setOff] = useState(() => { const o = {}; wo.lines.forEach((l, i) => { if (skippedBefore.has(l.key)) o[i] = true; }); return o; });

            const linesOf = (k) => wo.lines.map((l, i) => ({ l, i })).filter(x => x.l.cat === k);
            const picked = wo.lines.filter((l, i) => cats.includes(l.cat) && !off[i]);

            const setOnly = (k, act) => { const o = { ...off }; linesOf(k).forEach(x => { if (x.l.act === act) delete o[x.i]; else o[x.i] = true; }); setOff(o); };
            const doImport = () => onImport(picked, cats, wo.lines.filter((l, i) => cats.includes(l.cat) && off[i]).map(l => l.key));

            return (

        // Work Order check: compare every Work Order line with the lines the job's trades have imported. Changes nothing.
        function checkWorkOrder(wo, lines) {
            const text = (l) => `${l.cat} ${l.sel} ${l.act} ${l.desc}`;
            const byKey = {};
            wo.lines.forEach((l, i) => { byKey[l.key] = i; });
            const hits = wo.lines.map(() => []);   // trades holding each Work Order line
            const stale = [];                      // trades whose imported lines no longer match this Work Order
            lines.filter(t => !t.deleted && hasWorksheet(t.method) && t.ws && t.ws.xact).forEach(t => {
                let changed = 0, gone = 0;
                const used = {};
                t.ws.xact.forEach(x => {
                    if (x.woQty == null) return;   // typed by hand: nothing to compare
                    let i = x.key != null && byKey[x.key] != null ? byKey[x.key] : -1;
                    if (i < 0) i = wo.lines.findIndex((l, k) => !used[k] && text(l) === x.desc); // imported before keys were kept
                    if (i < 0 || used[i]) { gone++; return; }
                    used[i] = true;
                    hits[i].push(t);
                    const l = wo.lines[i];
                    const same = l.qty === x.woQty && l.price === x.woPrice && (l.total == null ? null : l.total) === (x.woTotal == null ? null : x.woTotal) && (l.marker || '') === (x.marker || '');
                    if (!same) changed++;
                });
                if (changed || gone) stale.push({ id: t.id, code: t.code, name: t.name, changed, gone });
            });
            // Each line: none = no dollars on the Work Order, un = not in any trade, ok = in one trade, twice = in two or more
            const rows = wo.lines.map((l, i) => ({ l, trades: hits[i], status: l.marker ? 'none' : hits[i].length === 0 ? 'un' : hits[i].length === 1 ? 'ok' : 'twice' }));
            const sum = (list) => round2(list.reduce((t, r) => t + (r.l.total || 0), 0));
            const group = (st) => { const list = rows.filter(r => r.status === st); return { count: list.length, total: sum(list) }; };
            const cats = [...new Set(wo.lines.map(l => l.cat))].map(k => {
                const mine = rows.filter(r => r.l.cat === k);
                const of = (st) => mine.filter(r => r.status === st);
                return { cat: k, name: wo.catNames[k] || '', rows: mine, count: mine.length, total: sum(mine), ok: sum(of('ok')), un: sum(of('un')), unCount: of('un').length, twice: sum(of('twice')), twiceCount: of('twice').length };
            });
            cats.sort((a, b) => (a.cat < b.cat ? -1 : a.cat > b.cat ? 1 : 0)); // alphabetical by category
            // Compare the Work Order's categories with the job's trade list, both ways
            const live = lines.filter(t => !t.deleted);
            const listed = new Set();
            live.forEach(t => catsFor(t.code).forEach(k => listed.add(k)));
            const onWo = new Set(cats.map(k => k.cat));
            const missing = cats.filter(k => !listed.has(k.cat));                              // on the Work Order, no trade for it on the list
            const absent = live.filter(t => !catsFor(t.code).some(k => onWo.has(k)));           // on the list, nothing for it on the Work Order
            return { rows, cats, stale, missing, absent, ok: group('ok'), un: group('un'), twice: group('twice'), none: group('none'), count: rows.length, total: sum(rows) };
        }
