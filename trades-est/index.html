        // Calculator math: + - x / and ( ), typed like 23600+575. Returns null until the math is complete.
        function calcExpr(src) {
            const s = String(src == null ? '' : src).replace(/[\s,$]/g, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
            if (!s) return null;
            let i = 0;
            const factor = () => {
                if (s[i] === '-') { i++; return -factor(); }
                if (s[i] === '+') { i++; return factor(); }
                if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw new Error('paren'); i++; return v; }
                const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
                if (!m) throw new Error('number');
                i += m[0].length;
                return parseFloat(m[0]);
            };
            const term = () => {
                let v = factor();
                while (s[i] === '*' || s[i] === '/') { const op = s[i++]; const r = factor(); v = op === '*' ? v * r : v / r; }
                return v;
            };
            const expr = () => {
                let v = term();
                while (s[i] === '+' || s[i] === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
                return v;
            };
            try { const v = expr(); return i === s.length && isFinite(v) ? v : null; } catch (e) { return null; }
        }

        const CALC_KEYS = ['C', '(', ')', '←', '7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '-', '0', '.', '=', '+'];

        // Pop-up calculator. With onUse it shows a Use button that hands the answer back (to a scratch pad line).
        function Calculator({ start, onUse, onClose }) {
            const [text, setText] = useState(start ? String(start) : '');
            const box = React.useRef(null);
            const value = calcExpr(text);
            const equals = () => { if (value !== null) setText(String(Math.round(value * 1e6) / 1e6)); };
            const tap = (k) => {
                if (k === 'C') setText('');
                else if (k === '←') setText(text.slice(0, -1));
                else if (k === '=') equals();
                else setText(text + k);
                if (box.current) box.current.focus();
            };
            return (
                <div className="calc-back">
                    <div className="calc">
                        <div style={{ fontWeight: 700, marginBottom: '8px' }}>Calculator</div>
                        <input ref={box} autoFocus value={text} style={{ textAlign: 'right', fontSize: '16px' }}
                            onChange={e => setText(e.target.value.replace(/[^0-9.+\-*/()x×÷,$ ]/gi, ''))}
                            onKeyDown={e => {
                                if (e.key === 'Enter') { e.preventDefault(); equals(); }
                                if (e.key === 'Escape') onClose();
                            }} />
                        <div className="res">{value !== null ? '= ' + value.toLocaleString('en-US', { maximumFractionDigits: 4 }) : ''}</div>
                        <div className="keys">
                            {CALC_KEYS.map(k => <button key={k} className={/[0-9.]/.test(k) ? '' : 'op'} onClick={() => tap(k)}>{k}</button>)}
                        </div>
                        {onUse && (
                            <button className="btn-primary" style={{ marginTop: 0 }} disabled={value === null} onClick={() => onUse(String(round2(value)))}>
                                {value !== null ? `Use ${money(round2(value))}` : 'Use'}
                            </button>
                        )}
                        <button className="btn-secondary" style={{ width: '100%', marginTop: '8px' }} onClick={onClose}>Close</button>
                    </div>
                </div>
            );
        }

        const overShort = (x) => x === 0 ? <span>{money(0)}</span>
            : <span className={x < 0 ? 'short' : 'over'}>{money(Math.abs(x))} {x < 0 ? 'short' : 'over'}</span>;

        // ---------- Quote requests: the PO before the customer signs ----------
        // Each request is its own record (tradesEst/{jobId}/requests), outside the trade list, so saving the
        // trade list never touches it. Field names match PO Manager's POs so the handoff at signing is a copy.
        const REQUEST_FIRST_LINE = 'REQUEST FOR PRICING - NOT A PURCHASE ORDER';
        const KINDS = [['ask', 'Ask for a price'], ['confirm', 'Confirm our price']];
        const kindFor = (method) => method === 'quote' ? 'ask' : 'confirm'; // Quote has no price yet; the others produce ours
        const kindText = (k) => (KINDS.find(x => x[0] === k) || ['', ''])[1];
        const REQ_FIELDS = ['subName', 'contact', 'phone', 'email', 'subCode', 'category', 'kind', 'part', 'contractAmount', 'scope'];
        const amountText = (x) => x > 0 ? x.toFixed(2) : '';
        const showAmount = (v) => String(v == null ? '' : v).trim() === '' ? '-' : money(n(v));
        const ATT_TYPES = ['application/pdf', 'image/png', 'image/jpeg'];
        const attKey = (list) => JSON.stringify((list || []).map(a => [a.name, a.type, a.url || '']));
        const MAX_EMAIL_BYTES = 9.5 * 1024 * 1024; // Postmark limit is 10 MB total
        const millis = (ts) => { const d = toDate(ts); return d ? d.getTime() : 0; };
        const fmtTime = (ts) => { const d = toDate(ts); return d ? d.toLocaleString('en-US', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; };

        // Scope box helpers (same behavior as PO Manager): capitalize line starts, put spoken text at the cursor
        const capLines = (t) => (t || '').replace(/(^|\n)(\s*)([a-z])/g, (m, nl, sp, ch) => nl + sp + ch.toUpperCase());
        const capInPlace = (el) => {
            const fixed = capLines(el.value);
            if (fixed !== el.value) {
                const start = el.selectionStart, end = el.selectionEnd;
                el.value = fixed;
                el.setSelectionRange(start, end);
            }
            return fixed;
        };
        const insertAtCursor = (el, text) => {
            const cur = el.value || '';
            const pos = el.selectionStart == null ? cur.length : el.selectionStart;
            const before = cur.slice(0, pos), after = cur.slice(pos);
            const sepBefore = before && !/\s$/.test(before) ? ' ' : '';
            const sepAfter = after && !/^\s/.test(after) ? ' ' : '';
            return { value: capLines(before + sepBefore + text + sepAfter + after), pos: (before + sepBefore + text).length };
        };

        // What can be done with a saved request. Shared by the list inside a trade's worksheet and the job's tracker,
        // so both places work the same way.
        function useRequestActions(po) {
            const { jobId, jobCode, job, superPick, me } = po || {}; // the start list has no job and no requests
            const [previewId, setPreviewId] = useState(null); // request whose form is being built
            const [sendingId, setSendingId] = useState(null); // request being emailed
            const [note, setNote] = useState('');
            const reqRef = (id) => { const col = db.collection('tradesEst').doc(jobId).collection('requests'); return id ? col.doc(id) : col.doc(); };

            // What goes in the form's boxes for a request: the job, the job's supervisor pick, and the request itself
            const formHeader = () => {
                const sup = superPick || {};
                return {
                    jobCode: (job && job.code) || jobCode, jobAddress: (job && job.address) || '', cityStateZip: (job && job.cityStateZip) || '', lockBox: (job && job.lockBox) || '',
                    superName: sup.name || '', superEmail: sup.email || '', superPhone: sup.phone || ''
                };
            };
            const formValues = (r) => ({
                ...formHeader(), poNumber: r.poNumber,
                subName: r.subName, contact: r.contact, phone: r.phone, email: r.email, subCode: r.subCode, category: r.category,
                amount: r.kind === 'confirm' ? r.contractAmount : '', // asking for a price: the sub sees no amount
                scope: r.scope
            });

            // Send for pricing: build the form, keep that exact PDF in the job folder, then email it to the sub.
            // Replies go to whoever clicks this (the function sets that from the sign-in).
            const send = async (r) => {
                if (!r.email) return;
                if (!window.POForm) { setNote('Error: the form builder did not load. Check that shared/po-form.js is in the repo, then refresh the page.'); return; }
                const amountShown = r.kind === 'confirm' ? window.POForm.amountText(r.contractAmount) : '';
                if (r.kind === 'confirm' && !amountShown) { setNote(`Error: ${r.poNumber} is "Confirm our price" but has no amount. Add the amount, or switch it to "Ask for a price".`); return; }
                const ask = r.lastEmail
                    ? `Already sent on ${fmtTime(r.lastEmail.sentAt)} to ${r.lastEmail.to}. Send ${r.poNumber} again to ${r.email}?`
                    : `Send ${r.poNumber} for pricing to ${r.subName} at ${r.email}?`;
                if (!window.confirm(ask)) return;
                setSendingId(r.id);
                setNote('');
                try {
                    const bytes = await window.POForm.build(formValues(r), r.attachments || []);
                    if (bytes.length > MAX_EMAIL_BYTES) throw new Error('the request is over 10 MB, too large to email. Remove or shrink attachments.');
                    // File name: PO Manager's pattern with RFP in front; the amount only when the sub is shown it
                    const d = new Date();
                    const dateStr = `${d.getMonth() + 1}-${d.getDate()}-${String(d.getFullYear()).slice(-2)}`;
                    const clean = (t) => (t || '').trim().replace(/[\/\\]/g, '-').replace(/\s+/g, '-');
                    const fileName = ['RFP', clean(r.category), clean(r.subName), amountShown, r.poNumber, dateStr].filter(Boolean).join('_') + '.pdf';
                    const fileRef = storage.ref(`jobForms/${jobId}/${Date.now()}_${fileName}`);
                    await fileRef.put(new Blob([bytes], { type: 'application/pdf' }));
                    const pdfUrl = await fileRef.getDownloadURL();
                    // The form as sent: its file, and the job and supervisor it went out with
                    await reqRef(r.id).update({ pdfUrl, fileName, header: formHeader(), pdfBuiltAt: d, pdfBuiltBy: me });
                    await functions.httpsCallable('sendQuoteRequest')({ jobId, requestId: r.id });
                    // What was sent is this saved version: an edit after this shows "Changed since sent"
                    await reqRef(r.id).update({ sentUpdatedAt: r.updatedAt || null });
                    setNote(`Request ${r.poNumber} sent to ${r.email}. Replies come to you.`);
                } catch (err) {
                    setNote('Error sending the request: ' + err.message);
                }
                setSendingId(null);
            };

            // Build the Subcontractor Scope of Work form for a saved request and open it in a new tab. Nothing is saved or sent.
            const preview = async (r) => {
                if (!window.POForm) { setNote('Error: the form builder did not load. Check that shared/po-form.js is in the repo, then refresh the page.'); return; }
                const tab = window.open('', '_blank'); // opened right on the click so the browser allows it; the PDF goes in when it is ready
                if (!tab) { setNote('Error: the browser blocked the new tab. Allow pop-ups for this site, then click Preview again.'); return; }
                tab.document.write('<p style="font-family: sans-serif; padding: 20px">Building the form...</p>');
                setPreviewId(r.id);
                setNote('');
                try {
                    const bytes = await window.POForm.build(formValues(r), r.attachments || []);
                    tab.location.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
                    // A browser set to download PDFs leaves the tab on the waiting page: say where the form went
                    setTimeout(() => { try { if (!tab.closed && !/^blob:/.test(tab.location.href)) tab.document.body.innerHTML = '<p style="font-family: sans-serif; padding: 20px">The form was downloaded. Look in your downloads, then close this tab.</p>'; } catch (e) { /* tab moved on */ } }, 1500);
                } catch (err) {
                    tab.close();
                    setNote('Error building the form: ' + err.message);
                }
                setPreviewId(null);
            };

            // Delete hides the request (kept for records); Owner/Admin can restore it
            const hide = async (r) => {
                if (!window.confirm(`Delete request ${r.poNumber}? It will be hidden from the list. The record is kept.`)) return;
                try {
                    await reqRef(r.id).update({ deleted: true, deletedBy: me, deletedAt: new Date() });
                    setNote(`Request ${r.poNumber} deleted.`);
                } catch (err) { setNote('Error deleting the request: ' + err.message); }
            };
            const restore = async (r) => {
                try {
                    await reqRef(r.id).update({ deleted: false, restoredBy: me, restoredAt: new Date() });
                    setNote(`Request ${r.poNumber} restored.`);
                } catch (err) { setNote('Error restoring the request: ' + err.message); }
            };

            // Pending or Complete, set by hand like PO Manager's tracker. Saved on the click; each change is kept.
            const setStatus = async (r, status) => {
                if ((r.status || 'Pending') === status) return;
                try {
                    const now = new Date();
                    await reqRef(r.id).update({ status, statusBy: me, statusAt: now, statusHistory: firebase.firestore.FieldValue.arrayUnion({ status, by: me, at: now }) });
                    setNote('');
                } catch (err) { setNote('Error saving the status: ' + err.message); }
            };
            // Notes for the team (not on the form, not in the email). Same field name as PO Manager so they move with the PO at the handoff.
            const saveNotes = async (r, text) => {
                const notes = String(text || '').replace(/\s+$/, '');
                if (notes === (r.notes || '')) return;
                const now = new Date();
                const data = { notes, notesBy: me, notesAt: now };
                // What the note said before is kept in the record
                if (r.notes) data.noteHistory = firebase.firestore.FieldValue.arrayUnion({ notes: r.notes, savedBy: r.notesBy || null, savedAt: r.notesAt || null, replacedAt: now, replacedBy: me });
                await reqRef(r.id).update(data);
            };
            return { reqRef, previewId, sendingId, note, setNote, send, preview, hide, restore, setStatus, saveNotes };
        }

        // Notes window, like PO Manager's: a big box with Voice
        function NoteModal({ title, start, onSave, onClose }) {
            const [text, setText] = useState(start || '');
            const [listening, setListening] = useState(false);
            const [saving, setSaving] = useState(false);
            const [err, setErr] = useState('');
            const boxRef = React.useRef(null);
            const recRef = React.useRef(null);
            useEffect(() => () => { if (recRef.current) recRef.current.stop(); }, []);
            const toggleVoice = () => {
                if (listening) { if (recRef.current) recRef.current.stop(); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setErr('Voice input is not supported in this browser (use Chrome or Edge).'); return; }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.continuous = true;
                rec.interimResults = false;
                rec.onresult = (e) => {
                    let said = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) said += e.results[i][0].transcript;
                    const el = boxRef.current;
                    if (!said.trim() || !el) return;
                    const { value, pos } = insertAtCursor(el, said.trim());
                    setText(value);
                    setTimeout(() => { el.focus(); el.setSelectionRange(pos, pos); }, 0);
                };
                rec.onerror = (e) => setErr('Voice input stopped (' + e.error + ').');
                rec.onend = () => { setListening(false); recRef.current = null; };
                recRef.current = rec;
                rec.start();
                setListening(true);
            };
            const save = async () => {
                if (recRef.current) recRef.current.stop();
                setSaving(true);
                setErr('');
                try { await onSave(text); onClose(); } catch (e) { setErr('Error saving the note: ' + e.message); setSaving(false); }
            };
            return (
                <div className="calc-back">
                    <div style={{ background: 'white', borderRadius: '8px', padding: '20px', width: '90%', maxWidth: '700px', boxShadow: '0 4px 20px rgba(0,0,0,0.3)' }}>
                        <div style={{ fontWeight: 700, marginBottom: '4px' }}>Notes</div>
                        <div style={{ fontSize: '12px', color: '#666', marginBottom: '10px', wordBreak: 'break-all' }}>{title}</div>
                        <textarea ref={boxRef} rows="15" autoFocus value={text} placeholder="Type or use Voice..." onChange={e => setText(capInPlace(e.target))} />
                        {err && <div className="bad" style={{ fontSize: '13px', marginTop: '6px' }}>{err}</div>}
                        <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                            <button type="button" className={listening ? 'btn-x' : 'btn-secondary'} style={{ padding: '10px' }} onClick={toggleVoice}>{listening ? '■ Stop' : '🎤 Voice'}</button>
                            <div style={{ flex: 1 }} />
                            <button type="button" className="btn-secondary" onClick={onClose} disabled={saving}>Cancel</button>
                            <button type="button" className="btn-primary" style={{ width: 'auto', marginTop: 0 }} onClick={save} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Saved requests as rows, laid out like PO Manager's tracker: File, Notes, Status, Actions.
        // lock = a request is open for editing somewhere, so Edit, Delete and Send wait.
        function RequestRows({ rows, act, onEdit, lock }) {
            const [histId, setHistId] = useState(null);   // request showing its earlier versions
            const [noteId, setNoteId] = useState(null);   // request whose notes window is open
            const noteFor = rows.find(r => r.id === noteId);
            const titleOf = (r) => [r.category, r.subName, String(r.contractAmount == null ? '' : r.contractAmount).trim() === '' ? 'no amount' : money(n(r.contractAmount))].join(' | ');
            const radio = { display: 'flex', alignItems: 'center', gap: '4px', margin: 0, fontWeight: 'normal', whiteSpace: 'nowrap', color: '#333', cursor: 'pointer' };
            return (<>
                <table className="track">
                    <thead><tr><th>File</th><th style={{ width: '190px' }}>Notes</th><th style={{ width: '105px' }}>Status</th><th style={{ width: '245px' }}>Actions</th></tr></thead>
                    <tbody>
                        {rows.map(r => {
                            const status = r.status === 'Complete' ? 'Complete' : 'Pending';
                            const by = [r.createdBy && `Created by ${r.createdBy.name} ${fmtDay(r.createdAt)}`,
                                (r.versions || []).length > 0 && r.updatedBy && `Edited by ${r.updatedBy.name} ${fmtDay(r.updatedAt)}`,
                                (r.attachments || []).length > 0 && `${r.attachments.length} attachment${r.attachments.length === 1 ? '' : 's'}`].filter(Boolean).join(' · ');
                            return (
                                <React.Fragment key={r.id}>
                                    <tr>
                                        <td>
                                            <div>{titleOf(r)}</div>
                                            <div style={{ marginTop: '2px' }}><span className="po-num">{r.poNumber}</span> <span style={{ color: '#555' }}>· {kindText(r.kind)}{r.part ? ` (${r.part})` : ''}</span></div>
                                            <div style={{ fontSize: '11px', color: '#888', marginTop: '2px' }}>{by}</div>
                                        </td>
                                        <td>
                                            <button type="button" className="btn-secondary btn-sm" onClick={() => setNoteId(r.id)} title={r.notes || ''}
                                                style={{ textAlign: 'left', maxWidth: '180px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                                📝 {r.notes ? r.notes.split('\n')[0] : 'Add note'}
                                            </button>
                                        </td>
                                        <td>
                                            {['Pending', 'Complete'].map(sName => (
                                                <label key={sName} style={radio}>
                                                    <input type="radio" style={{ width: 'auto', margin: 0 }} checked={status === sName} onChange={() => act.setStatus(r, sName)} />{sName}
                                                </label>
                                            ))}
                                        </td>
                                        <td style={{ whiteSpace: 'nowrap' }}>
                                            <button className="btn-secondary btn-sm" title="Build the form and open it in a new tab. Nothing is sent." onClick={() => act.preview(r)} disabled={!!act.previewId}>{act.previewId === r.id ? 'Building...' : 'Preview'}</button>{' '}
                                            <button className="btn-secondary btn-sm" onClick={() => onEdit(r)} disabled={lock} title={lock ? 'Save or cancel the request that is open first.' : ''}>Edit</button>{' '}
                                            {(r.versions || []).length > 0 && <button className="btn-secondary btn-sm" onClick={() => setHistId(histId === r.id ? null : r.id)}>{histId === r.id ? 'Hide history' : 'History'}</button>}{' '}
                                            <button className="btn-x" onClick={() => act.hide(r)} disabled={lock}>Delete</button>
                                            <div style={{ marginTop: '4px' }}>
                                                <button className="btn-sm" style={{ background: (!r.email || !!act.sendingId || lock) ? '#ccc' : '#0066cc', color: 'white', cursor: (!r.email || !!act.sendingId || lock) ? 'not-allowed' : 'pointer' }} onClick={() => act.send(r)}
                                                    disabled={!r.email || !!act.sendingId || lock}
                                                    title={r.email ? `Email this request to ${r.email}` : 'No sub email on this request. Edit it to add one.'}>
                                                    {act.sendingId === r.id ? 'Sending...' : 'Send for pricing'}
                                                </button>
                                                {!r.email && <span style={{ fontSize: '11px', color: '#888', marginLeft: '6px' }}>No sub email</span>}
                                            </div>
                                            {r.lastEmail && (() => {
                                                const e = r.lastEmail;
                                                const color = e.status === 'Delivered' ? '#388e3c' : e.status === 'Bounced' ? '#d32f2f' : '#555';
                                                const label = e.status === 'Delivered' ? `Delivered ${fmtTime(e.statusAt)} ✓`
                                                    : e.status === 'Bounced' ? `Bounced ${fmtTime(e.statusAt)} ✗`
                                                    : `Sent ${fmtTime(e.sentAt)}`;
                                                // Edited since the version that was sent
                                                const changed = millis(r.updatedAt) > millis(r.sentUpdatedAt);
                                                const history = (r.emailHistory || []).map(h =>
                                                    `${h.to} | Sent ${fmtTime(h.sentAt)}${h.sentBy ? ' by ' + h.sentBy.name : ''} | ${h.status}${h.statusAt ? ' ' + fmtTime(h.statusAt) : ''}${h.detail ? ' (' + h.detail + ')' : ''}`).join('\n');
                                                return (
                                                    <div title={history} style={{ fontSize: '11px', marginTop: '4px', cursor: 'help', whiteSpace: 'normal' }}>
                                                        <div style={{ color, fontWeight: 600 }}>{label}</div>
                                                        {changed && <div style={{ color: '#cc6600', fontWeight: 600 }}>Changed since sent</div>}
                                                    </div>
                                                );
                                            })()}
                                        </td>
                                    </tr>
                                    {histId === r.id && [...(r.versions || [])].reverse().map((v, i) => (
                                        <tr key={i} className="gone" title={(v.scope || '') + ((v.attachments || []).length ? '\n\nAttachments: ' + v.attachments.map(a => a.name).join(', ') : '')}>
                                            <td><span style={{ fontSize: '12px' }}>Earlier version:</span> {titleOf(v)} · {kindText(v.kind)}{v.part ? ` (${v.part})` : ''}</td>
                                            <td colSpan="2" style={{ fontSize: '12px' }}>{v.savedBy ? v.savedBy.name : ''} {fmtStamp(v.savedAt)}</td>
                                            <td style={{ fontSize: '12px' }}>Hover to read its scope</td>
                                        </tr>
                                    ))}
                                </React.Fragment>
                            );
                        })}
                    </tbody>
                </table>
                {noteFor && <NoteModal title={`${noteFor.poNumber} · ${titleOf(noteFor)}`} start={noteFor.notes || ''} onSave={text => act.saveNotes(noteFor, text)} onClose={() => setNoteId(null)} />}
            </>);
        }

        // Deleted requests (hidden, kept for records), with Restore for Owner/Admin
        function DeletedRows({ rows, act }) {
            return (
                <table style={{ marginTop: '8px' }}>
                    <tbody>
                        {rows.map(r => (
                            <tr key={r.id} className="gone">
                                <td style={{ width: '150px' }}>{r.poNumber}</td>
                                <td>{r.category} | {r.subName}</td>
                                <td>Deleted by {r.deletedBy ? r.deletedBy.name : ''} {fmtDay(r.deletedAt)}</td>
                                <td style={{ width: '80px' }}><button className="btn-secondary btn-sm" onClick={() => act.restore(r)}>Restore</button></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            );
        }

        // A trade's POs, shown right under its row on the trade list (no need to open the trade).
        // line = the trade they hang on; null for POs whose trade was taken off the list.
        function TradePOs({ rows, po, line }) {
            const act = useRequestActions(po);
            // Editing happens in the trade's worksheet, where the pricing is: open it with this request ready to edit
            const edit = (r) => {
                if (!line) { act.setNote(`Error: the trade for ${r.poNumber} is no longer on the trade list. Restore the trade to edit this request.`); return; }
                if (!hasWorksheet(line.method)) { act.setNote(`Error: ${line.code} has no Method picked, so its worksheet cannot open. Pick a Method on that trade, then click Edit again.`); return; }
                act.setNote('');
                po.editRequest(r);
            };
            return (
                <div className="po-under">
                    <RequestRows rows={rows} act={act} onEdit={edit} lock={po.draftOpen} />
                    {act.note && <div style={{ fontSize: '13px', fontWeight: 600, marginTop: '6px', color: act.note.includes('Error') ? '#d32f2f' : '#388e3c' }}>{act.note}</div>}
                </div>
            );
        }

        // Deleted POs on the job (hidden, kept for records). Owner/Admin can restore them.
        function DeletedPOs({ rows, po }) {
            const act = useRequestActions(po);
            const [show, setShow] = useState(false);
            return (
                <div style={{ marginTop: '10px' }} className="po-deleted">
                    <button className="btn-secondary btn-sm" onClick={() => setShow(!show)}>{show ? 'Hide deleted POs' : `Show deleted POs (${rows.length})`}</button>
                    {show && <DeletedRows rows={rows} act={act} />}
                    {act.note && <div style={{ fontSize: '13px', fontWeight: 600, marginTop: '6px', color: act.note.includes('Error') ? '#d32f2f' : '#388e3c' }}>{act.note}</div>}
                </div>
            );
        }

        // The quote requests for one trade, at the bottom of its worksheet
        function Requests({ line, ws, c, po }) {
            const { jobId, jobCode, me, requests, requestsError, templates, savedIds } = po;
            const act = useRequestActions(po);            // this section only needs its message line and the request records
            const { note, setNote, reqRef } = act;
            const [draft, setDraft] = useState(null);     // request on screen: its fields + id ('' = new)
            const [busy, setBusy] = useState(false);
            const [listening, setListening] = useState(false);
            const recRef = React.useRef(null);
            const scopeRef = React.useRef(null);
            useEffect(() => () => { if (recRef.current) recRef.current.stop(); }, []);

            const isAllow = line.method === 'allowance';
            const saved = savedIds.has(line.id);          // the trade is in the saved trade list
            const mine = (requests || []).filter(r => r.lineId === line.id).sort((a, b) => (a.poNumber || '').localeCompare(b.poNumber || ''));
            const live = mine.filter(r => !r.deleted);
            // What the worksheet has right now for this trade (Allowance: one number and one vendor each for labor and material)
            const wsAmount = (part) => isAllow ? (part === 'material' ? c.material : c.labor) : c.vendorPrice;
            const wsVendor = (part) => ((isAllow && part === 'material' ? ws.matVendor : ws.vendor) || '').trim();
            const setF = (k, v) => setDraft(d => ({ ...d, [k]: v }));

            const stopVoice = () => { if (recRef.current) recRef.current.stop(); };
            const startNew = () => {
                // Allowance: the second request starts on material when labor already has one
                const part = isAllow ? (live.some(r => r.part === 'labor') && !live.some(r => r.part === 'material') ? 'material' : 'labor') : '';
                setDraft({
                    id: '', subName: wsVendor(part), contact: '', phone: '', email: '', subCode: '', category: (line.code || '').trim(),
                    kind: kindFor(line.method), part, contractAmount: amountText(wsAmount(part)), scope: REQUEST_FIRST_LINE + '\n\n',
                    attachments: []
                });
                setNote('');
            };
            const startEdit = (r) => {
                const d = { id: r.id };
                REQ_FIELDS.forEach(k => { d[k] = r[k] || ''; });
                d.attachments = r.attachments || [];
                setDraft(d);
                setNote('');
            };
            const closeDraft = () => { stopVoice(); setDraft(null); };
            // Tell the page a request is open here, so the tracker holds its Edit, Delete and Send until it is saved or cancelled
            useEffect(() => { po.setDraftOpen(!!draft); return () => po.setDraftOpen(false); }, [!!draft]);
            // "+ PO" on the trade row, or Edit on one of its POs: this trade's worksheet was opened for it,
            // so start the new request, or start editing that one, and bring the edit box into view
            useEffect(() => {
                const j = po.jump;
                if (!j || j.lineId !== line.id || requests === null) return;
                const r = j.isNew ? null : requests.find(x => x.id === j.requestId && !x.deleted);
                if (j.isNew ? saved : !!r) {
                    if (j.isNew) startNew(); else startEdit(r);
                    setTimeout(() => { const el = document.getElementById('req-editor'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
                }
                po.clearJump();
            }, [po.jump, requests === null]);
            const pickPart = (part) => setDraft(d => ({ ...d, part, contractAmount: amountText(wsAmount(part)) || d.contractAmount, subName: wsVendor(part) || d.subName }));
            const loadTemplate = (id) => {
                const t = (templates || []).find(x => x.id === id);
                if (!t) return;
                const body = (t.scope || '').replace(REQUEST_FIRST_LINE, '').trim(); // templates saved here already carry the first line
                const typed = (draft.scope || '').replace(REQUEST_FIRST_LINE, '').trim();
                const swap = body && (!typed || window.confirm("Replace the scope wording with this template's wording?"));
                setDraft(d => ({
                    ...d, subName: t.subName || '', contact: t.contact || '', phone: t.phone || '', email: t.email || '', subCode: t.subCode || '',
                    scope: swap ? REQUEST_FIRST_LINE + '\n\n' + body : d.scope
                }));
            };

            // Attachments: new ones are { name, type, file } until Save request stores them; saved ones are { name, type, url }
            const addFiles = (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = '';
                const bad = files.filter(f => !ATT_TYPES.includes(f.type));
                setNote(bad.length ? 'Error: skipped (only PDF, JPG, PNG): ' + bad.map(f => f.name).join(', ') : '');
                const good = files.filter(f => ATT_TYPES.includes(f.type)).map(f => ({ name: f.name, type: f.type, file: f }));
                if (good.length) setDraft(d => ({ ...d, attachments: [...d.attachments, ...good] }));
            };
            const moveAtt = (i, dir) => setDraft(d => {
                const list = [...d.attachments], j = i + dir;
                if (j < 0 || j >= list.length) return d;
                [list[i], list[j]] = [list[j], list[i]];
                return { ...d, attachments: list };
            });
            const removeAtt = (i) => setDraft(d => ({ ...d, attachments: d.attachments.filter((_, k) => k !== i) }));
            // Store the new files; files taken off a request stay in storage (kept for records)
            const storeFiles = async (list) => {
                const out = [];
                for (const att of list) {
                    if (att.file) {
                        const ref = storage.ref(`jobForms/${jobId}/att_${Date.now()}_${att.name}`);
                        await ref.put(att.file);
                        out.push({ name: att.name, type: att.type, url: await ref.getDownloadURL() });
                    } else out.push({ name: att.name, type: att.type, url: att.url });
                }
                return out;
            };

            // Save this vendor to PO Manager's template list (company-wide). Does not save the request.
            // The scope wording goes with it, first line included: templates are where estimating starts.
            const saveTemplate = async () => {
                const f = {};
                ['subName', 'contact', 'phone', 'email', 'subCode', 'category', 'scope'].forEach(k => { f[k] = String(draft[k] == null ? '' : draft[k]).trim(); });
                if (!f.subName || !f.category) { setNote('Error: Subcontractor and Category are required to save a template.'); return; }
                if (!f.scope.includes(REQUEST_FIRST_LINE)) f.scope = (REQUEST_FIRST_LINE + '\n\n' + f.scope).trim();
                const key = (t) => (t || '').trim().toLowerCase();
                const old = (templates || []).find(t => key(t.subName) === key(f.subName) && key(t.category) === key(f.category));
                if (old && !window.confirm(`A template for ${old.category} | ${old.subName} is already saved. Replace its vendor details and scope wording with what is on this request?`)) return;
                setBusy(true);
                setNote('');
                try {
                    const now = new Date();
                    // An existing template keeps its amount; a new one starts with none (a request's amount belongs to one job)
                    if (old) await db.collection('formLibrary').doc(old.id).update({ ...f, dateUpdated: now });
                    else await db.collection('formLibrary').add({ ...f, userId: me.uid, contractAmount: '', dateCreated: now, dateUpdated: now });
                    setNote(`Template ${old ? 'updated' : 'saved'}: ${f.category} | ${f.subName}. The request itself is not saved until you click Save request.`);
                } catch (err) {
                    setNote('Error saving the template: ' + err.message);
                }
                setBusy(false);
            };

            // Voice to text into the scope box (Chrome or Edge)
            const toggleVoice = () => {
                if (listening) { stopVoice(); return; }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { setNote('Error: voice input is not supported in this browser (use Chrome or Edge).'); return; }
                const rec = new SR();
                rec.lang = 'en-US';
                rec.continuous = true;
                rec.interimResults = false;
                rec.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) text += e.results[i][0].transcript;
                    const el = scopeRef.current;
                    if (!text.trim() || !el) return;
                    const { value, pos } = insertAtCursor(el, text.trim());
                    setF('scope', value);
                    setTimeout(() => { el.focus(); el.setSelectionRange(pos, pos); }, 0);
                };
                rec.onerror = (e) => setNote('Error: voice input stopped (' + e.error + ').');
                rec.onend = () => { setListening(false); recRef.current = null; };
                recRef.current = rec;
                rec.start();
                setListening(true);
            };

            const save = async () => {
                const f = {};
                REQ_FIELDS.forEach(k => { f[k] = String(draft[k] == null ? '' : draft[k]).trim(); });
                if (!f.subName || !f.category) { setNote('Error: Subcontractor and Category are required.'); return; }
                // The first line stays on every request until the handoff
                if (!f.scope.includes(REQUEST_FIRST_LINE)) f.scope = (REQUEST_FIRST_LINE + '\n\n' + f.scope).trim();
                stopVoice();
                setBusy(true);
                setNote('');
                try {
                    const now = new Date();
                    if (!draft.id) {
                        f.attachments = await storeFiles(draft.attachments); // files first: if one fails, no PO number is used
                        // New: take the next PO number from the job's counter (the one PO Manager uses) and save, as one step
                        const jobRef = db.collection('jobs').doc(jobId);
                        const ref = reqRef();
                        const poNumber = await db.runTransaction(async tx => {
                            const snap = await tx.get(jobRef);
                            if (!snap.exists) throw new Error('Job not found.');
                            const next = (snap.data().poCounter || 0) + 1;
                            const num = `${snap.data().code || jobCode}-${String(next).padStart(3, '0')}`;
                            tx.update(jobRef, { poCounter: next });
                            tx.set(ref, {
                                ...f, lineId: line.id, tradeCode: line.code || '', tradeName: line.name || '', poNumber: num,
                                status: 'Pending', deleted: false, createdBy: me, createdAt: now, updatedBy: me, updatedAt: now
                            });
                            return num;
                        });
                        setNote(`Request saved as ${poNumber}.`);
                    } else {
                        const old = mine.find(r => r.id === draft.id);
                        if (!old) throw new Error('This request is no longer on the list.');
                        const filesChanged = draft.attachments.some(a => a.file) || attKey(draft.attachments) !== attKey(old.attachments);
                        if (!filesChanged && !REQ_FIELDS.some(k => (old[k] || '') !== f[k])) { setDraft(null); setNote('No changes to save.'); setBusy(false); return; }
                        f.attachments = await storeFiles(draft.attachments);
                        // Keep what it said, and what was attached, before this edit
                        const prev = { savedAt: old.updatedAt || old.createdAt || null, savedBy: old.updatedBy || old.createdBy || null, replacedAt: now, replacedBy: me, attachments: old.attachments || [] };
                        REQ_FIELDS.forEach(k => { prev[k] = old[k] || ''; });
                        await reqRef(draft.id).update({ ...f, updatedBy: me, updatedAt: now, versions: firebase.firestore.FieldValue.arrayUnion(prev) });
                        setNote(`Request ${old.poNumber} saved. The earlier version is kept.`);
                    }
                    setDraft(null);
                } catch (err) {
                    setNote('Error saving the request: ' + err.message);
                }
                setBusy(false);
            };
            const sortedTemplates = [...(templates || [])].sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.subName || '').localeCompare(b.subName || ''));
            const wsNow = draft ? wsAmount(draft.part) : 0;
            const radio = { display: 'flex', alignItems: 'center', gap: '5px', fontWeight: 'normal', margin: 0, color: '#333', cursor: 'pointer' };

            return (<>
                <div className="sub-title">Quote requests</div>
                {requestsError && <div className="bad" style={{ fontSize: '13px', marginBottom: '8px' }}>{requestsError}</div>}
                {!draft && (
                    <div className="inline" style={{ fontSize: '13px' }}>
                        <button className="btn-secondary btn-sm" onClick={startNew} disabled={!saved || requests === null || busy}>+ New request</button>
                        {!saved && <span style={{ color: '#666' }}>Click Save at the bottom of the page first. A request can only be added to a trade that is in the saved trade list.</span>}
                        {saved && <span style={{ color: '#666' }}>{live.length ? `This trade's ${live.length === 1 ? 'PO is' : live.length + ' POs are'} listed under its row, above this worksheet.` : 'No POs on this trade yet.'}</span>}
                    </div>
                )}

                {draft && (
                    <div className="req" id="req-editor">
                        <div style={{ fontWeight: 700, marginBottom: '10px' }}>{draft.id ? `Edit request ${(mine.find(r => r.id === draft.id) || {}).poNumber || ''}` : 'New request'}</div>
                        <div className="form-group">
                            <label>Load vendor from a PO Manager template</label>
                            <select value="" onChange={e => loadTemplate(e.target.value)}>
                                <option value="">{templates === null ? 'Loading...' : sortedTemplates.length ? '-- Pick a template --' : 'No templates saved in PO Manager'}</option>
                                {sortedTemplates.map(t => <option key={t.id} value={t.id}>{t.category} | {t.subName}</option>)}
                            </select>
                        </div>
                        <div className="req-grid">
                            <div><label>Subcontractor</label><input value={draft.subName} onChange={e => setF('subName', e.target.value)} /></div>
                            <div><label>Contact</label><input value={draft.contact} onChange={e => setF('contact', e.target.value)} /></div>
                            <div><label>Phone</label><input value={draft.phone} onChange={e => setF('phone', e.target.value)} /></div>
                            <div><label>Email</label><input value={draft.email} onChange={e => setF('email', e.target.value)} /></div>
                            <div><label>Sub Code</label><input value={draft.subCode} onChange={e => setF('subCode', e.target.value)} /></div>
                            <div><label>Category</label><input value={draft.category} onChange={e => setF('category', e.target.value)} /></div>
                        </div>
                        <div className="inline" style={{ margin: '12px 0 4px' }}>
                            <span style={{ fontSize: '13px', color: '#555', fontWeight: 500 }}>Kind of request</span>
                            {KINDS.map(([v, label]) => (
                                <label key={v} style={radio}><input type="radio" style={{ width: 'auto' }} checked={draft.kind === v} onChange={() => setF('kind', v)} />{label}</label>
                            ))}
                        </div>
                        {isAllow && (
                            <div className="inline" style={{ margin: '8px 0 4px' }}>
                                <span style={{ fontSize: '13px', color: '#555', fontWeight: 500 }}>This request is for</span>
                                <label style={radio}><input type="radio" style={{ width: 'auto' }} checked={draft.part === 'labor'} onChange={() => pickPart('labor')} />Labor ({money(c.labor)})</label>
                                <label style={radio}><input type="radio" style={{ width: 'auto' }} checked={draft.part === 'material'} onChange={() => pickPart('material')} />Material ({money(c.material)})</label>
                            </div>
                        )}
                        <div className="inline" style={{ margin: '8px 0 4px' }}>
                            <label>Amount</label>
                            <input className="num" style={{ width: '130px' }} value={draft.contractAmount} onChange={e => setF('contractAmount', e.target.value)} placeholder="0.00" />
                            <span style={{ fontSize: '13px', color: '#666' }}>{draft.kind === 'ask' ? 'Kept here only. The sub does not see it.' : 'The sub sees this as the Contract Amount.'}</span>
                            {wsNow > 0 && n(draft.contractAmount) !== wsNow && (<>
                                <span style={{ fontSize: '13px' }} className="short">Worksheet has {money(wsNow)}</span>
                                <button className="btn-secondary btn-sm" onClick={() => setF('contractAmount', amountText(wsNow))}>Use it</button>
                            </>)}
                        </div>
                        <div className="form-group" style={{ marginTop: '10px' }}>
                            <label>Scope of Work
                                <button type="button" className={listening ? 'btn-x' : 'btn-secondary btn-sm'} onClick={toggleVoice} style={{ marginLeft: '10px' }}>{listening ? '■ Stop' : '🎤 Voice'}</button>
                            </label>
                            <textarea ref={scopeRef} rows="9" value={draft.scope} onChange={e => setF('scope', capInPlace(e.target))} />
                            <div style={{ fontSize: '12px', color: '#666', marginTop: '3px' }}>The first line stays on every request and comes off at the handoff to PO Manager.</div>
                        </div>
                        <div className="form-group">
                            <div style={{ fontSize: '13px', color: '#555', fontWeight: 500, marginBottom: '5px' }}>Attachments (added as pages after the form)
                                <label className="btn-secondary btn-sm" style={{ display: 'inline-block', width: 'auto', marginLeft: '10px', marginBottom: 0, cursor: 'pointer', borderRadius: '4px', color: '#333' }}>
                                    + Add Files
                                    <input type="file" multiple accept="application/pdf,image/png,image/jpeg" onChange={addFiles} style={{ display: 'none' }} />
                                </label>
                            </div>
                            {draft.attachments.length === 0 && <div style={{ fontSize: '12px', color: '#888' }}>No attachments (PDF, JPG, PNG)</div>}
                            {draft.attachments.map((att, i) => (
                                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '4px 0', borderBottom: '1px solid #eee', fontSize: '13px' }}>
                                    <span style={{ width: '20px', color: '#888' }}>{i + 1}.</span>
                                    <span style={{ flex: 1, wordBreak: 'break-all' }}>{att.name}{att.file && <span style={{ color: '#cc6600' }}> (not saved yet)</span>}</span>
                                    <button type="button" className="btn-secondary btn-sm" onClick={() => moveAtt(i, -1)} disabled={i === 0}>↑</button>
                                    <button type="button" className="btn-secondary btn-sm" onClick={() => moveAtt(i, 1)} disabled={i === draft.attachments.length - 1}>↓</button>
                                    <button type="button" className="btn-x" onClick={() => removeAtt(i)}>✕</button>
                                </div>
                            ))}
                        </div>
                        <div className="inline">
                            <button className="btn-primary" style={{ width: 'auto', marginTop: 0, padding: '8px 18px' }} onClick={save} disabled={busy}>{busy ? 'Saving...' : 'Save request'}</button>
                            <button className="btn-secondary" style={{ padding: '8px 18px' }} onClick={closeDraft} disabled={busy}>Cancel</button>
                            <button className="btn-secondary" style={{ padding: '8px 18px' }} onClick={saveTemplate} disabled={busy || templates === null} title="Add this vendor and scope wording to the template list used here and in PO Manager">Save vendor as template</button>
                            {!draft.id && <span style={{ fontSize: '13px', color: '#666' }}>Saving takes the next PO number on this job.</span>}
                        </div>
                    </div>
                )}
                {note && <div style={{ fontSize: '13px', fontWeight: 600, marginTop: '8px', color: note.includes('Error') ? '#d32f2f' : '#388e3c' }}>{note}</div>}
            </>);
        }

        // Has a trade been worked on? Stamped when its worksheet is changed; a worksheet saved before the stamp existed
        // counts when it holds something typed or imported (not just the numbers a new job starts with).
        const tradeEdited = (l) => {
            if (!l) return false;
            if (l.editedAt) return true;
            const w = l.ws || {};
            const text = (v) => String(v == null ? '' : v).trim() !== '';
            return text(w.vendor) || text(w.matVendor) || text(w.quote) || !!w.wo
                || (w.pad || []).length > 0 || (w.apad || []).length > 0 || (w.xact || []).length > 0
                || (w.citems || []).some(i => text(i.qty) || text(i.note));
        };
        // Where a trade stands, for its tag on the trade list:
        //   todo = not started, unsaved = worked on but not saved yet, priced = edited and saved with no PO yet,
        //   pending = has POs and some are not complete, done = all of its POs are complete
        const tradeStatus = (l, savedLine, reqs) => {
            if (reqs.length) {
                const done = reqs.filter(r => r.status === 'Complete').length;
                return done === reqs.length ? { kind: 'done', text: 'Complete' } : { kind: 'pending', text: `Pending (${done} of ${reqs.length} complete)` };
            }
            if (tradeEdited(savedLine)) return { kind: 'priced', text: 'Priced' };
            if (tradeEdited(l)) return { kind: 'unsaved', text: 'Not saved yet' };
            return { kind: 'todo', text: 'Not started' };
        };
        const STATUS_COLOR = { todo: '#cc6600', unsaved: '#cc6600', priced: '#555', pending: '#0066cc', done: '#388e3c' };

        // One trade's pricing worksheet.
        //   Quote:  vendor price, retail needed, Xactimate lines with new unit prices, comparison
        //   Factor: vendor price = Xactimate total x factor (+ scratch pad), Xactimate lines, comparison
        //   Allowance: labor and material vendor prices, Xactimate lines (each goes to labor, material or a split), comparison
        //   Calculator: same as Quote, with a price list (quantity x price each) in place of the typed quote
        function Worksheet({ line, me, onChange, startItems, onSaveToStart, onSaveSplit, po }) {
            const [busy, setBusy] = useState(false);
            const [note, setNote] = useState('');
            const [calcFor, setCalcFor] = useState(null); // scratch pad box the calculator is open for: { list, id, field }
            const [pick, setPick] = useState(null);       // Work Order just read, waiting for lines to be picked
            const [itemNote, setItemNote] = useState('');  // result of saving the price list to the start list
            const [splitNote, setSplitNote] = useState(''); // result of saving the starting split to the start list
            const ws = { ...blankWs(), ...(line.ws || {}) };
            const isFactor = line.method === 'factor';
            const isAllow = line.method === 'allowance';
            const isCalc = line.method === 'calculator';
            const plain = isFactor || isAllow; // no "new unit price" columns: the CES does not change
            const c = calcWs(ws, line.method);
            const set = (k, v) => onChange({ ...ws, [k]: v });
            const setRow = (list, id, k, v) => set(list, ws[list].map(r => r.id === id ? { ...r, [k]: v } : r));
            const ready = isAllow ? c.retailBase > 0 : isFactor ? c.xactTotal > 0 : (c.vendorPrice > 0 && c.xactTotal > 0);

            // Read a Work Order PDF, then open the picker. Nothing changes until lines are imported.
            const upload = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                setBusy(true);
                setNote('');
                try {
                    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
                    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                    const wo = await parseWorkOrder(pdf);
                    if (!wo.lines.length) setNote('Error: no Work Order lines found in that PDF. It needs to be the Xactimate Work Order report. Nothing changed.');
                    else setPick({ wo, fileName: file.name });
                } catch (err) {
                    setNote('Error reading the PDF: ' + err.message);
                }
                setBusy(false);
            };
            // Bring the picked lines into this trade only
            const importPicked = (picked, cats, skipped) => {
                // Keep the split settings already made on a line when a newer Work Order replaces it
                const before = {};
                ws.xact.forEach(x => { if (x.key) before[x.key] = x; });
                const xact = picked.map(l => {
                    const x = {
                        id: newId(), desc: `${l.cat} ${l.sel} ${l.act} ${l.desc}`, qty: l.qty, unit: l.unit, price: l.price,
                        woQty: l.qty, woPrice: l.price, woTotal: l.total, marker: l.marker, act: l.act, key: l.key
                    };
                    const old = before[l.key];
                    if (old && old.sf != null) x.sf = old.sf;
                    if (old && old.sl != null) x.sl = old.sl;
                    return x;
                });
                onChange({ ...ws, xact, wo: { fileName: pick.fileName, date: pick.wo.date, estimate: pick.wo.estimate, cats, skipped, lines: picked.length, uploadedBy: me, uploadedAt: new Date() } });
                setNote(`${picked.length} line(s) loaded from the Work Order dated ${pick.wo.date}. Click Save to keep them.`);
                setPick(null);
            };

            // Bring in the start list's price list. Items already on the job keep their quantity and note and get the current price.
            const loadItems = () => {
                const mine = ws.citems || [];
                if (mine.length && !window.confirm("Update this job's items and prices from the start list? Quantities and notes are kept.")) return;
                const fresh = jobItems(startItems);
                const key = (t) => (t || '').trim().toLowerCase();
                const used = {};
                const merged = fresh.map(f => {
                    const old = mine.find(m => key(m.name) === key(f.name) && !used[m.id]);
                    if (!old) return f;
                    used[old.id] = true;
                    return { ...old, price: f.price };
                });
                set('citems', [...merged, ...mine.filter(m => !used[m.id])]);
            };

            // Send this job's item names and prices (not quantities or notes) up to the start list for this trade
            const saveToStart = async () => {
                const named = (ws.citems || []).filter(i => (i.name || '').trim());
                if (!named.length) { setItemNote('Error: there are no named items to save.'); return; }
                const ask = startItems.length
                    ? `Replace the start list price list for ${line.code} (${startItems.length} item${startItems.length === 1 ? '' : 's'}) with these ${named.length} item${named.length === 1 ? '' : 's'} and prices? Every new job will start with them.`
                    : `Save these ${named.length} item${named.length === 1 ? '' : 's'} and prices as the start list price list for ${line.code}? Every new job will start with them.`;
                if (!window.confirm(ask)) return;
                setItemNote('');
                try {
                    const count = await onSaveToStart(named);
                    setItemNote(`Saved to the start list: ${count} item${count === 1 ? '' : 's'}. New jobs will start with them.`);
                } catch (err) {
                    setItemNote('Error saving to the start list: ' + err.message);
                }
            };

            // Calculator: the job's price list
            const itemsBlock = isCalc && (<>
                    <div className="sub-title">Price list</div>
                    <table>
                        <thead><tr><th>Item</th><th>Note</th><th className="num">Qty</th><th className="num">Price each</th><th className="money" style={{ width: '110px' }}>Total</th><th style={{ width: '40px' }}></th></tr></thead>
                        <tbody>
                            {c.items.map(i => (
                                <tr key={i.id}>
                                    <td><input value={i.name} onChange={e => setRow('citems', i.id, 'name', e.target.value)} placeholder="Item" /></td>
                                    <td><input value={i.note} onChange={e => setRow('citems', i.id, 'note', e.target.value)} placeholder="Note" /></td>
                                    <td><input className="num" value={i.qty} onChange={e => setRow('citems', i.id, 'qty', e.target.value)} /></td>
                                    <td><input className="num" value={i.price} onChange={e => setRow('citems', i.id, 'price', e.target.value)} /></td>
                                    <td className="money">{money(i.total)}</td>
                                    <td><button className="btn-x" title="Remove this item from this job" onClick={() => set('citems', ws.citems.filter(x => x.id !== i.id))}>✕</button></td>
                                </tr>
                            ))}
                            {c.items.length === 0 && <tr><td colSpan="6" style={{ color: '#888', padding: '10px 4px' }}>No items on this job yet.</td></tr>}
                            <tr className="sum"><td colSpan="4">Items total</td><td className="money">{money(c.itemsTotal)}</td><td></td></tr>
                        </tbody>
                    </table>
                    <div className="inline" style={{ marginTop: '6px', fontSize: '13px' }}>
                        <button className="btn-secondary btn-sm" onClick={() => set('citems', [...ws.citems, { id: newId(), name: '', price: '', qty: '', note: '' }])}>+ Add item</button>
                        {startItems && startItems.length > 0 && <button className="btn-secondary btn-sm" onClick={loadItems}>Load items from start list</button>}
                        {startItems && <button className="btn-secondary btn-sm" onClick={saveToStart}>Save these items to the start list</button>}
                        {startItems && startItems.length === 0 && <span style={{ color: '#666' }}>No price list saved for this trade on the start list yet.</span>}
                        {!startItems && <span style={{ color: '#666' }}>This trade is not on the start list, so its items stay on this job.</span>}
                    </div>
                    {itemNote && <div style={{ fontSize: '13px', fontWeight: 600, marginTop: '8px', color: itemNote.includes('Error') ? '#d32f2f' : '#388e3c' }}>{itemNote}</div>}
            </>);

            const vendorBlock = (<>
                    <div className="sub-title">Vendor price</div>
                    <table>
                        <thead><tr><th style={{ width: '110px' }}></th><th>Vendor / note</th><th className="num">Amount</th><th style={{ width: '56px' }}></th><th style={{ width: '40px' }}></th></tr></thead>
                        <tbody>
                            {isCalc && (
                                <tr>
                                    <td>Items</td>
                                    <td><input value={ws.vendor} onChange={e => set('vendor', e.target.value)} placeholder="Vendor name" /></td>
                                    <td className="money">{money(c.itemsTotal)}</td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            )}
                            {!isFactor && !isCalc && (
                                <tr>

        // Start list: the price list kept with a Calculator trade (item + price each). New jobs start with it.
        function PriceList({ line, onChange }) {
            const items = line.items || [];
            const setItem = (id, k, v) => onChange(items.map(i => i.id === id ? { ...i, [k]: v } : i));
