                </div>
            );
        }

        // Editable list of trades. Used for a job's list and for the start list.
        // worksheets = true on a job (Open button and pricing worksheet); false on the start list
        function LineTable({ lines, onChange, me, canRestore, worksheets, startList, onSaveItems, onSaveSplit, po }) {
            const [showGone, setShowGone] = useState(false);
            const [openId, setOpenId] = useState(null); // trade whose worksheet (or price list, on the start list) is open
            // Edit clicked on a PO, or "+ PO" on a trade: open that trade's worksheet
            const jump = po ? po.jump : null;
            useEffect(() => { if (jump) setOpenId(jump.lineId); }, [jump]);
            // The start list's price list for a job trade: null = trade is not on the start list, [] = on it with no list yet
            const startItemsFor = (l) => {
                const hit = findStart(startList, l);
                return hit ? (hit.items || []).filter(i => (i.name || '').trim()) : null;
            };
            const [addCode, setAddCode] = useState('');
            const [addName, setAddName] = useState('');
            const [todoOnly, setTodoOnly] = useState(false); // show only the trades not started
            const live = lines.filter(l => !l.deleted);
            const gone = lines.filter(l => l.deleted);
            // Status tags (job trade list only): from the saved trade list and the job's requests
            const tags = worksheets && po;
            // The job's POs: each trade's go under its row; ones whose trade was taken off the list get their own group
            const allReqs = tags ? [...(po.requests || [])].sort((a, b) => (a.poNumber || '').localeCompare(b.poNumber || '')) : [];
            const liveReqs = allReqs.filter(r => !r.deleted), goneReqs = allReqs.filter(r => r.deleted);
            const reqsOf = (l) => liveReqs.filter(r => r.lineId === l.id);
            const statusOf = {};
            if (tags) live.forEach(l => { statusOf[l.id] = tradeStatus(l, po.savedLines.get(l.id), reqsOf(l)); });
            const countOf = (kinds) => live.filter(l => statusOf[l.id] && kinds.includes(statusOf[l.id].kind)).length;
            const orphans = liveReqs.filter(r => !live.some(l => l.id === r.lineId));
            const doneReqs = liveReqs.filter(r => r.status === 'Complete').length;
            // "+ PO": open the trade's worksheet with a new request started
            const whyNoPO = (l) => !hasWorksheet(l.method) ? 'Pick a Method on this trade first.'
                : !po.savedIds.has(l.id) ? 'Click Save at the bottom of the page first.'
                : po.requests === null ? 'Loading...'
                : po.draftOpen ? 'Save or cancel the request that is open first.' : '';
            // With the filter on: trades not started (or not saved yet), plus the one that is open so it never vanishes mid-edit
            const shown = tags && todoOnly ? live.filter(l => ['todo', 'unsaved'].includes(statusOf[l.id].kind) || l.id === openId) : live;
            const cols = tags ? 6 : 5;

            const edit = (id, k, v) => onChange(lines.map(l => l.id === id ? { ...l, [k]: v } : l));
            // Put the row back in alphabetical order after its code is changed (when you leave the box)
            const resort = () => {
                const sorted = sortLines(lines);
                if (sorted.some((l, i) => l.id !== lines[i].id)) onChange(sorted);
            };
            const remove = (l) => {
                // Added just now and never saved: nothing to keep. Otherwise hide it and record who and when.
                if (l._new) onChange(lines.filter(x => x.id !== l.id));
                else onChange(lines.map(x => x.id === l.id ? { ...x, deleted: true, deletedBy: me, deletedAt: new Date() } : x));
            };
            const restore = (l) => onChange(sortLines(lines.map(x => {
                if (x.id !== l.id) return x;
                const { deleted, deletedBy, deletedAt, ...rest } = x;
                return { ...rest, restoredBy: me, restoredAt: new Date() };
            })));
            const add = () => {
                const code = addCode.trim(), name = addName.trim();
                if (!code && !name) return;
                onChange(sortLines([...lines, { id: newId(), code, name, _new: true }]));
                setAddCode('');
                setAddName('');
            };
            const addOnEnter = (e) => { if (e.key === 'Enter') add(); };

            return (
                <div>
                    {tags && po.requestsError && <div className="bad" style={{ fontSize: '13px', marginBottom: '8px' }}>{po.requestsError}</div>}
                    {tags && (
                        <div className="inline" style={{ fontSize: '13px', marginBottom: '8px' }}>
                            <span style={{ color: '#666' }}>
                                {live.length} trade{live.length === 1 ? '' : 's'}:{' '}
                                <strong style={{ color: countOf(['todo', 'unsaved']) ? STATUS_COLOR.todo : '#666' }}>{countOf(['todo', 'unsaved'])} not started</strong>,{' '}
                                {countOf(['priced'])} priced, {countOf(['pending'])} pending, {countOf(['done'])} complete
                                {liveReqs.length > 0 && <span className="po-count"> · {liveReqs.length} PO{liveReqs.length === 1 ? '' : 's'}: {doneReqs} complete, {liveReqs.length - doneReqs} pending</span>}
                            </span>
                            <button className="btn-secondary btn-sm" onClick={() => setTodoOnly(!todoOnly)}>{todoOnly ? 'Show all trades' : 'Show only not started'}</button>
                        </div>
                    )}
                    <table className="lines">
                        <thead><tr>
                            <th className="code">Trade code</th><th>Description</th><th style={{ width: '110px' }}>Method</th>
                            {tags && <th style={{ width: '170px' }}>Status</th>}
                            <th style={{ width: tags ? '118px' : '70px' }}></th>
                            <th style={{ width: '40px' }}></th>
                        </tr></thead>
                        <tbody>
                            {shown.map(l => (
                                <React.Fragment key={l.id}>
                                    <tr className="line">
                                        <td><input value={l.code} onChange={e => edit(l.id, 'code', e.target.value)} onBlur={resort} /></td>
                                        <td><input value={l.name} onChange={e => edit(l.id, 'name', e.target.value)} /></td>
                                        <td>
                                            <select value={l.method || ''} onChange={e => edit(l.id, 'method', e.target.value)}>
                                                {METHODS.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                                            </select>
                                        </td>
                                        {tags && <td className="trade-status" style={{ fontSize: '12px', fontWeight: 600, whiteSpace: 'nowrap', color: STATUS_COLOR[statusOf[l.id].kind] }}>{statusOf[l.id].text}</td>}
                                        <td style={{ whiteSpace: 'nowrap' }}>
                                            {worksheets && hasWorksheet(l.method) && (
                                                <button className="btn-secondary btn-sm" onClick={() => setOpenId(openId === l.id ? null : l.id)}>
                                                    {openId === l.id ? 'Close' : 'Open'}
                                                </button>
                                            )}
                                            {tags && <>{' '}<button className="btn-secondary btn-sm" title={whyNoPO(l) || 'Start a new PO on this trade'} disabled={!!whyNoPO(l)} onClick={() => po.newRequest(l)}>+ PO</button></>}
                                            {!worksheets && l.method === 'calculator' && (
                                                <button className="btn-secondary btn-sm" title="Items and prices for this trade" onClick={() => setOpenId(openId === l.id ? null : l.id)}>
                                                    {openId === l.id ? 'Close' : 'Items'}
                                                </button>
                                            )}
                                        </td>
                                        <td><button className="btn-x" title="Remove this trade" onClick={() => remove(l)}>✕</button></td>
                                    </tr>
                                    {tags && reqsOf(l).length > 0 && (
                                        <tr><td colSpan={cols} style={{ padding: 0, borderBottom: 'none' }}><TradePOs rows={reqsOf(l)} po={po} line={l} /></td></tr>
                                    )}
                                    {worksheets && openId === l.id && hasWorksheet(l.method) && (
                                        <tr><td colSpan={cols}><Worksheet line={l} me={me} po={po} startItems={startItemsFor(l)} onSaveToStart={items => onSaveItems(l, items)} onSaveSplit={(sf, sl) => onSaveSplit(l, sf, sl)}
                                            onChange={ws => onChange(lines.map(x => x.id === l.id ? { ...x, ws, editedBy: me, editedAt: new Date() } : x))} /></td></tr>
                                    )}
                                    {!worksheets && openId === l.id && l.method === 'calculator' && (
                                        <tr><td colSpan={cols}><PriceList line={l} onChange={items => edit(l.id, 'items', items)} /></td></tr>
                                    )}
                                </React.Fragment>
                            ))}
                            {live.length === 0 && <tr><td colSpan={cols} style={{ color: '#888', padding: '10px 4px' }}>No trades on this list.</td></tr>}
                            {live.length > 0 && shown.length === 0 && <tr><td colSpan={cols} style={{ color: '#388e3c', padding: '10px 4px', fontWeight: 600 }}>Every trade on this job has been started.</td></tr>}
                            {tags && !todoOnly && orphans.length > 0 && (<>
                                <tr><td colSpan={cols} style={{ padding: '12px 4px 4px', fontWeight: 600, color: '#cc6600' }}>POs on trades that were taken off this list</td></tr>
                                <tr><td colSpan={cols} style={{ padding: 0, borderBottom: 'none' }}><TradePOs rows={orphans} po={po} line={null} /></td></tr>
                            </>)}
                        </tbody>
                    </table>

                    {tags && po.isAdmin && goneReqs.length > 0 && <DeletedPOs rows={goneReqs} po={po} />}

                    <div className="sub-title">Add a trade</div>
                    <div style={{ display: 'flex', gap: '8px' }}>
                        <input className="code" value={addCode} onChange={e => setAddCode(e.target.value)} onKeyDown={addOnEnter} placeholder="Trade code" />
                        <input value={addName} onChange={e => setAddName(e.target.value)} onKeyDown={addOnEnter} placeholder="Description" />
                        <button className="btn-secondary btn-sm" style={{ whiteSpace: 'nowrap' }} onClick={add}>+ Add trade</button>
                    </div>

                    <div className="muted">
                        {live.length} trade{live.length === 1 ? '' : 's'}
                        {gone.length > 0 && (<>
                            {' | '}{gone.length} removed{' '}
                            <button className="btn-secondary btn-sm" style={{ marginLeft: '6px' }} onClick={() => setShowGone(!showGone)}>
                                {showGone ? 'Hide removed' : 'Show removed'}
                            </button>
                        </>)}
                    </div>

                    {showGone && gone.length > 0 && (
                        <table style={{ marginTop: '8px' }}>
                            <thead><tr><th className="code">Trade code</th><th>Description</th><th>Removed</th><th style={{ width: '80px' }}></th></tr></thead>
                            <tbody>
                                {gone.map(l => (
                                    <tr key={l.id} className="gone">
                                        <td>{l.code}</td>
                                        <td>{l.name}</td>
                                        <td>{l.deletedBy ? l.deletedBy.name : ''} {fmtDay(l.deletedAt)}</td>
                                        <td>{canRestore && <button className="btn-secondary btn-sm" onClick={() => restore(l)}>Restore</button>}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, false = no access, object = ok
            const [authError, setAuthError] = useState('');
            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [record, setRecord] = useState(null);   // saved tradesEst/{jobId}: null = loading, false = none yet
            const [lines, setLines] = useState(null);     // the job's trade list on screen
            const [dirty, setDirty] = useState(false);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [startRec, setStartRec] = useState(null);     // saved tradesEstStart/list: null = loading, false = none yet
            const [startLines, setStartLines] = useState(null); // saved start list (or the built-in one)
            const [editingStart, setEditingStart] = useState(false);
            const [startEdit, setStartEdit] = useState(null);   // start list on screen while editing
            const [startDirty, setStartDirty] = useState(false);
            const startRef = React.useRef(null);
            const [showCalc, setShowCalc] = useState(false); // general calculator from the top button
            const [check, setCheck] = useState(null);         // Work Order read for the check report
            const [checkBusy, setCheckBusy] = useState(false);
            const [supers, setSupers] = useState(null);       // company-wide Supervisor list (the one PO Manager keeps): null = loading
            const [supersError, setSupersError] = useState('');
            const [superPick, setSuperPick] = useState(null); // this job's supervisor: { id, name, phone, email } or null
            const [requests, setRequests] = useState(null);   // this job's quote requests: null = loading
            const [requestsError, setRequestsError] = useState('');
            const [templates, setTemplates] = useState(null); // PO Manager's templates (vendor details and scope wording), read only here
            const [myPhone, setMyPhone] = useState(null);     // the signed-in person's saved phone (userContacts/{uid}): null = loading
            const [phoneInput, setPhoneInput] = useState('');
            const [phoneNote, setPhoneNote] = useState('');
            const [jump, setJump] = useState(null);           // Edit on a PO, or "+ PO" on a trade: { lineId, requestId | isNew } to open in that trade's worksheet
            const [draftOpen, setDraftOpen] = useState(false); // a request is open for editing in a worksheet

            // Sign-in and role check (this page never creates user records)
            useEffect(() => {
                return auth.onAuthStateChanged(async u => {
                    setUser(u);
                    setProfile(null);
                    if (!u) return;
                    try {
                        const snap = await db.collection('users').doc(u.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: u.uid, ...d });
                        else setProfile(false);
                    } catch (e) {
                        setProfile(false);
                    }
                });
            }, []);

            // Job list
            useEffect(() => {
                if (!profile) return;
                return db.collection('jobs').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));
                    setJobs(list);
                }, e => setMessage('Error loading jobs: ' + e.message));
            }, [profile]);

            // Opened from the Dashboard tile (?job=...): pick that job once the list loads
            const urlJobDone = React.useRef(false);
            useEffect(() => {
                if (urlJobDone.current || !jobs.length) return;
                urlJobDone.current = true;
                const id = new URLSearchParams(window.location.search).get('job');
                if (id && !jobId && jobs.some(j => j.id === id)) setJobId(id);
            }, [jobs]);

            // Company-wide start list
            useEffect(() => {
                if (!profile) return;
                return db.collection('tradesEstStart').doc('list').onSnapshot(doc => {
                    const d = doc.exists ? doc.data() : null;
                    const list = d && Array.isArray(d.lines) ? sortLines(d.lines) : sortLines(DEFAULT_START);
                    startRef.current = list;
                    setStartRec(d || false);
                    setStartLines(list);
                }, e => setMessage('Error loading start list: ' + e.message));
            }, [profile]);

            // Company-wide Supervisor list, read only here. Supervisors are added and removed in PO Manager.
            useEffect(() => {
                if (!profile) return;
                return db.collection('supervisors').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => { const d = doc.data(); list.push({ id: doc.id, name: d.name || '', phone: d.phone || '', email: d.email || '' }); });
                    list.sort((a, b) => a.name.localeCompare(b.name));
                    setSupers(list);
                    setSupersError('');
                }, e => { setSupers([]); setSupersError('Error loading the Supervisor list: ' + e.message); });
            }, [profile]);

            // The signed-in person's own phone, typed once. It will go on the quote request emails they send.
            useEffect(() => {
                if (!profile || !user) return;
                return db.collection('userContacts').doc(user.uid).onSnapshot(doc => {
                    const p = doc.exists ? (doc.data().phone || '') : '';
                    setMyPhone(p);
                    setPhoneInput(p);
                }, e => { setMyPhone(''); setPhoneNote('Error loading your phone: ' + e.message); });
            }, [profile]);
            const savePhone = async () => {
                const phone = phoneInput.trim();
                setPhoneNote('');
                try {
                    const now = new Date();
                    const data = { phone, name: profile.name || user.email || '', email: user.email || '', updatedAt: now };
                    // A number being replaced is kept in the record
                    if (myPhone) data.history = firebase.firestore.FieldValue.arrayUnion({ phone: myPhone, replacedAt: now });
                    await db.collection('userContacts').doc(user.uid).set(data, { merge: true });
                    setPhoneNote(phone ? 'Phone saved' : 'Phone removed');
                } catch (e) {
                    setPhoneNote('Error saving your phone: ' + e.message);
                }
            };

            // PO Manager's templates, for filling in a request's vendor
            useEffect(() => {
                if (!profile) return;
                return db.collection('formLibrary').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setTemplates(list);
                }, () => setTemplates([]));
            }, [profile]);

            // This job's quote requests. They are their own records, so Save on the trade list never touches them.
            useEffect(() => {
                setRequests(null);
                setRequestsError('');
                if (!profile || !jobId) return;
                return db.collection('tradesEst').doc(jobId).collection('requests').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setRequests(list);
                    setRequestsError('');
                }, e => { setRequests([]); setRequestsError('Error loading quote requests: ' + e.message); });
            }, [profile, jobId]);

            // Load the job's trade list once when a job is picked. No saved list yet = blank copy of the start list.
            const startReady = startLines !== null;
            useEffect(() => {
                setRecord(null);
                setLines(null);
                setDirty(false);
                setSuperPick(null);
                if (!profile || !jobId || !startReady) return;
                db.collection('tradesEst').doc(jobId).get().then(doc => {
                    if (doc.exists) {
                        setRecord(doc.data());
                        setLines(sortLines(doc.data().lines || []));
                        setSuperPick(doc.data().supervisor || null);
                    } else {
                        setRecord(false);
                        setLines(copyStart(startRef.current || []));
                    }
                }).catch(e => setMessage('Error loading trade list: ' + e.message));
            }, [profile, jobId, startReady]);

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    setAuthError(e.message);
                }
            };

            // Save the job's trade list. Every save also keeps a copy in history (versions).
            const save = async () => {
                const job = jobs.find(j => j.id === jobId);
                if (!job || !lines) return;
                setSaving(true);
                setMessage('');
                try {
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const now = new Date();
                    const clean = cleanLines(lines);
                    const data = { jobCode: job.code || '', lines: clean, supervisor: superPick || null, updatedBy: by, updatedAt: now };
                    const ref = db.collection('tradesEst').doc(jobId);
                    const batch = db.batch();
                    batch.set(ref, data, { merge: true });
                    batch.set(ref.collection('versions').doc(), { jobCode: job.code || '', lines: clean, supervisor: superPick || null, savedBy: by, savedAt: now });
                    await batch.commit();
                    setRecord({ ...(record || {}), ...data });
                    setLines(clean);
                    setDirty(false);
                    setMessage('Saved');
                } catch (e) {
                    setMessage('Error saving: ' + e.message);
                }
                setSaving(false);
            };

            // Save the company-wide start list, with a copy in history (versions)
            const saveStart = async () => {
                if (!startEdit) return;
                setSaving(true);
                setMessage('');
                try {
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const now = new Date();
                    const clean = cleanLines(startEdit);
                    const ref = db.collection('tradesEstStart').doc('list');
                    const batch = db.batch();
                    batch.set(ref, { lines: clean, updatedBy: by, updatedAt: now }, { merge: true });
                    batch.set(ref.collection('versions').doc(), { lines: clean, savedBy: by, savedAt: now });
                    await batch.commit();
                    setStartEdit(clean);
                    setStartDirty(false);
                    setMessage('Start list saved');
                } catch (e) {
                    setMessage('Error saving start list: ' + e.message);
                }
                setSaving(false);
            };

            // Save a job's price list (item names and prices only) as the start list price list for that trade
            const saveTradeToStart = async (line, fields) => {
                const list = startRef.current || [];
                const hit = findStart(list, line);
                if (!hit) throw new Error('This trade is not on the start list.');
                const by = { uid: user.uid, name: profile.name || user.email };
                const now = new Date();
                const clean = cleanLines(list.map(x => x.id === hit.id ? { ...x, ...fields } : x));
                const ref = db.collection('tradesEstStart').doc('list');
                const batch = db.batch();
                batch.set(ref, { lines: clean, updatedBy: by, updatedAt: now }, { merge: true });
                batch.set(ref.collection('versions').doc(), { lines: clean, savedBy: by, savedAt: now });
                await batch.commit();
            };
            const saveItemsToStart = async (line, items) => {
                const priceList = items.filter(i => (i.name || '').trim()).map(i => ({ id: newId(), name: i.name.trim(), price: i.price || '' }));
                await saveTradeToStart(line, { method: 'calculator', items: priceList });
                return priceList.length;
            };
            // Save an Allowance trade's starting split (for lines not marked I or M) as that trade's start on new jobs
            const saveSplitToStart = (line, sf, sl) => saveTradeToStart(line, { method: 'allowance', defSf: sf, defSl: sl });

            // Read a Work Order for the check report. Read-only: no trade changes, nothing is saved.
            const runCheck = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                setCheckBusy(true);
                setMessage('');
                try {
                    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
                    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                    const wo = await parseWorkOrder(pdf);
                    if (!wo.lines.length) setMessage('Error: no Work Order lines found in that PDF. It needs to be the Xactimate Work Order report.');
                    else setCheck(wo);
                } catch (err) {
                    setMessage('Error reading the PDF: ' + err.message);
                }
                setCheckBusy(false);
            };

            const openStart = () => {
                setStartEdit(startLines.map(l => ({ ...l })));
                setStartDirty(false);
                setEditingStart(true);
                setMessage('');
            };
            const closeStart = () => {
                if (startDirty && !window.confirm('You have unsaved changes to the start list. Close anyway?')) return;
                setEditingStart(false);
                setStartEdit(null);
                setStartDirty(false);
                setMessage('');
            };

            if (!user) {
                return (
                    <div className="section">
                        <button className="btn-primary" onClick={login}>Sign in with Microsoft</button>
                        {authError && <div className="msg" style={{ color: '#d32f2f' }}>{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === false) {
                return (
                    <div className="section">
                        <p>Signed in as {user.email}. No access: Trades-EST is for Owner, Admin and Estimator.</p>
                        <button className="btn-secondary" style={{ marginTop: '12px' }} onClick={() => auth.signOut()}>Logout</button>
                    </div>
                );
            }

            const me = { uid: user.uid, name: profile.name || user.email };
            const canRestore = ADMINS.includes(profile.role);
            const job = jobs.find(j => j.id === jobId);
            const visibleJobs = jobs.filter(j => showArchived || j.archived !== true);
            // What a trade's quote requests need. savedIds = trades in the saved trade list (a request can only hang on one of those).
            const po = {
                jobId, jobCode: job ? job.code || '' : '', job, superPick, me, isAdmin: canRestore, requests, requestsError, templates,
                savedIds: new Set(((record && record.lines) || []).map(l => l.id)),
                savedLines: new Map(((record && record.lines) || []).map(l => [l.id, l])),
                jump, clearJump: () => setJump(null), editRequest: (r) => setJump({ lineId: r.lineId, requestId: r.id }),
                newRequest: (l) => setJump({ lineId: l.id, isNew: true }),
                draftOpen, setDraftOpen
            };
            const savedText = record && record.updatedAt
                ? `Last saved by ${record.updatedBy ? record.updatedBy.name : ''} on ${fmtStamp(record.updatedAt)}`
                : 'Not saved yet. Showing the start list.';
            const startText = startRec && startRec.updatedAt
                ? `Last saved by ${startRec.updatedBy ? startRec.updatedBy.name : ''} on ${fmtStamp(startRec.updatedAt)}`
                : 'Built-in list. Not changed yet.';
            const msg = message && <div className="msg" style={{ color: message.includes('Error') ? '#d32f2f' : '#388e3c' }}>{message}</div>;

            return (
                <div>
                    <div className="row">
                        <div>
                            <span style={{ fontSize: '14px' }}>Signed in as {profile.name || user.email} ({profile.role})</span>
                            <div className="inline" style={{ marginTop: '6px', fontSize: '13px' }}>
                                <label>My phone</label>
                                <input style={{ width: '160px' }} value={phoneInput} disabled={myPhone === null} placeholder="For quote request emails"
                                    onChange={e => { setPhoneInput(e.target.value); setPhoneNote(''); }}
                                    onKeyDown={e => { if (e.key === 'Enter' && myPhone !== null && phoneInput.trim() !== myPhone) savePhone(); }} />
                                <button className="btn-secondary btn-sm" onClick={savePhone} disabled={myPhone === null || phoneInput.trim() === myPhone}>Save</button>
                                {phoneNote && <span style={{ fontWeight: 600, color: phoneNote.includes('Error') ? '#d32f2f' : '#388e3c' }}>{phoneNote}</span>}
                            </div>
                        </div>
                        <div style={{ display: 'flex', gap: '8px' }}>
                            <button className="btn-secondary" onClick={() => setShowCalc(true)}>Calculator</button>
                            <button className="btn-secondary" onClick={() => auth.signOut()}>Logout</button>
                        </div>
                    </div>
                    {showCalc && <Calculator onClose={() => setShowCalc(false)} />}

                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                            <div className="section-title">JOB</div>
                            {!editingStart && <button className="btn-secondary btn-sm" onClick={openStart} disabled={!startReady}>Edit start list</button>}
                        </div>
                        <div className="form-group">
                            <select value={jobId} disabled={editingStart} onChange={e => {
                                if (dirty && !window.confirm('You have unsaved changes. Switch jobs anyway?')) return;
                                setJobId(e.target.value); setMessage('');
                            }}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code} - {j.address}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                        </div>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontWeight: 'normal' }}>
                            <input type="checkbox" style={{ width: 'auto' }} checked={showArchived} onChange={e => setShowArchived(e.target.checked)} />
                            Show archived jobs
                        </label>
                        {jobId && lines && !editingStart && (
                            <div className="form-group" style={{ marginTop: '14px', marginBottom: 0 }}>
                                <label>Supervisor for this job</label>
                                <select value={superPick ? superPick.id : ''} disabled={supers === null} onChange={e => {
                                    const s = (supers || []).find(x => x.id === e.target.value);
                                    setSuperPick(s ? { id: s.id, name: s.name, phone: s.phone, email: s.email } : null);
                                    setDirty(true); setMessage('');
                                }}>
                                    <option value="">{supers === null ? 'Loading...' : '-- No supervisor picked --'}</option>
                                    {superPick && !(supers || []).some(s => s.id === superPick.id) && <option value={superPick.id}>{superPick.name} (no longer on the list)</option>}
                                    {(supers || []).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                                {superPick && <div className="muted" style={{ marginTop: '4px' }}>{[superPick.phone, superPick.email].filter(Boolean).join(' | ') || 'No phone or email on the Supervisor list for this name.'}</div>}
                                {supersError && <div className="muted" style={{ marginTop: '4px', color: '#d32f2f', fontWeight: 600 }}>{supersError}</div>}
                            </div>
                        )}
                        {jobId && <div className="muted">{record === null ? 'Loading...' : savedText}{dirty && <span className="unsaved"> | Unsaved changes</span>}</div>}
                    </div>

                    {editingStart && startEdit && (
                        <div className="section">
                            <div className="section-title">START LIST</div>
                            <div className="note">
                                This is the list every new job starts with. Changes here do not touch jobs already saved in Trades-EST.
                            </div>
                            <div className="muted" style={{ marginTop: 0, marginBottom: '10px' }}>{startText}{startDirty && <span className="unsaved"> | Unsaved changes</span>}</div>
                            <LineTable lines={startEdit} me={me} canRestore={canRestore} worksheets={false}
                                onChange={next => { setStartEdit(next); setStartDirty(true); setMessage(''); }} />
                            <button className="btn-primary" onClick={saveStart} disabled={saving}>{saving ? 'Saving...' : 'Save start list'}</button>
                            <button className="btn-secondary" style={{ width: '100%', marginTop: '8px' }} onClick={closeStart} disabled={saving}>
                                {jobId ? 'Close start list and go back to the job' : 'Close start list'}
                            </button>
                            {msg}
                        </div>
                    )}

                    {!editingStart && lines && (
                        <div className="section">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                <div className="section-title">TRADES{job ? ` - ${job.code}` : ''}</div>
                                <label className="btn-secondary btn-sm" style={{ display: 'inline-block', borderRadius: '4px', cursor: 'pointer', color: '#333', margin: 0 }} title="Compare a Work Order with what the trades have imported. Changes nothing.">
                                    {checkBusy ? 'Reading...' : 'Check Work Order'}
                                    <input type="file" accept="application/pdf" onChange={runCheck} disabled={checkBusy} style={{ display: 'none' }} />
                                </label>
                            </div>
                            {check && <WorkOrderCheck wo={check} lines={lines} jobCode={job ? job.code : ''} onClose={() => setCheck(null)} />}
                            <LineTable key={jobId} lines={lines} me={me} canRestore={canRestore} worksheets={true} po={po} startList={startLines} onSaveItems={saveItemsToStart} onSaveSplit={saveSplitToStart}
                                onChange={next => { setLines(next); setDirty(true); setMessage(''); }} />
                            <datalist id="units">{UNITS.map(u => <option key={u} value={u} />)}</datalist>
                            <button className="btn-primary" onClick={save} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
                            {msg}
                        </div>
                    )}

                    {!editingStart && !lines && msg}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
