    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDy41rudb08QDJ1yhQweqrBUihGSZ8KiRw",
            authDomain: "po-project-ea1ca.firebaseapp.com",

        };
        firebase.initializeApp(firebaseConfig);

        const ALLOWED = ['owner', 'admin', 'estimator'];
        const ADMINS = ['owner', 'admin']; // can restore removed trades

        // Built-in start list (from the Stark W 2602 Trade Recap, sub names removed).
        // Used until a start list is saved with "Edit start list".
        const DEFAULT_START = [

            ['MPR', 'Moisture protection / decks'],
            ['MSD/GLS', 'Glass work'],
            ['ORI', 'Ornamental iron'],
            ['PLM #1', 'Plumbing labor'],
            ['PLM #2', 'Plumbing fixtures'],
            ['PLM #3', 'Shower pan'],
            ['PNL', 'Paneling'],
            ['PNT #1', 'Paint'],
            ['PNT #2', 'Seal/deo'],
            ['PNT #3', 'Seal/deo material'],
            ['RFG', 'Roofing'],
            ['SDG #1', 'Siding labor'],
            ['SDG #2', 'Siding material'],
            ['SFG', 'Soffit / fascia / gutter'],
            ['STL', 'Steel components'],
            ['STU/SCF', 'Stucco'],
            ['TIL', 'Showers / fireplace face'],
            ['TMP', 'Camera'],
            ['TMP', 'Temp electric'],
            ['TMP', 'Toilet'],
            ['TMP', 'Hand wash'],
            ['WDS', 'Skylight material'],
            ['WDT #1', 'Blinds'],
            ['WDT #2', 'Plantation shutters'],
            ['WDV #1', 'Window labor'],
            ['WDV #2', 'Window material'],
            ['WDV - skylight', 'Skylight labor'],
            ['WDV - skylight', 'Skylight material']
        ].map(([code, name], i) => ({ id: 's' + i, code, name }));

        const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

        // Alphabetical by trade code. Spaces ignored, numbers compared as numbers (#2 before #10).
        const cmpCode = (a, b) => {
            const parts = (s) => (s || '').toUpperCase().replace(/\s+/g, '').match(/\d+|\D+/g) || [];
            const x = parts(a), y = parts(b);
            for (let i = 0; i < Math.min(x.length, y.length); i++) {
                const p = x[i], q = y[i];
                if (/^\d/.test(p) && /^\d/.test(q)) { if (+p !== +q) return +p - +q; }
                else if (p !== q) return p < q ? -1 : 1;
            }
            return x.length - y.length;
        };
        // Lines with the same code keep the order they were in
        const sortLines = (lines) => [...lines].sort((a, b) => cmpCode(a.code, b.code));

        // A new job starts with a blank copy of every trade on the start list
        const copyStart = (start) => sortLines(start.filter(l => !l.deleted).map(l => ({ id: newId(), startId: l.id, code: l.code, name: l.name, method: l.method || '' })));

        // What gets saved: no on-screen flags, no fully blank lines
        const cleanLines = (lines) => sortLines(lines)
            .map(({ _new, ...l }) => ({ ...l, code: (l.code || '').trim(), name: (l.name || '').trim() }))
            .filter(l => l.code || l.name);

        const toDate = (ts) => ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
        const fmtDay = (ts) => { const d = toDate(ts); return d ? d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }) : ''; };
        const fmtStamp = (ts) => { const d = toDate(ts); return d ? d.toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' }) : ''; };

        // Primary method per trade. Calculator comes later.
        //   Quote:  vendor price is typed in; the CES may need new unit prices to hold margin
        //   Factor: vendor price = Xactimate total x factor; the CES does not change
        //   Allowance: labor (I lines) and material (M lines) each get a factor and their own total
        const METHODS = [['', ''], ['quote', 'Quote'], ['factor', 'Factor'], ['allowance', 'Allowance']];
        const hasWorksheet = (m) => m === 'quote' || m === 'factor' || m === 'allowance';
        const DEFAULT_FACTOR = '0.70'; // Quote: retail needed = vendor price / 0.70
        const DEFAULT_MULT = '0.50';   // Factor: vendor price = Xactimate total x 0.50
        const DEFAULT_LABOR_MULT = '0.60'; // Allowance: labor = I lines x 0.60
        const DEFAULT_MAT_MULT = '1.00';   // Allowance: material = M lines x 1.00 (no margin on allowances)
        const DEFAULT_SPLIT = '0.60';      // Allowance split line: retail x 0.60 ...
        const DEFAULT_LABOR_PCT = '50';    // ... then this percent to labor, the rest to material
        const UNITS = ['SF', 'LF', 'EA', 'SQ', 'SY', 'HR', 'DA', 'WK', 'MO'];

        // Numbers are typed as text so $ and commas are fine
        const n = (v) => { const x = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(x) ? 0 : x; };
        const round2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
        const money = (x) => (x < 0 ? '-' : '') + '$' + Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const blankWs = () => ({ vendor: '', matVendor: '', quote: '', pad: [], apad: [], factor: DEFAULT_FACTOR, mult: DEFAULT_MULT, laborMult: DEFAULT_LABOR_MULT, matMult: DEFAULT_MAT_MULT, xact: [] });
        // A typed factor: 60 works as 0.60 (1.2 stays 1.2); blank falls back to the default
        const factorOf = (v, def) => { let x = n(v); if (x > 3) x = x / 100; return x > 0 ? x : n(def); };
        // A typed percent, 0 to 100; blank falls back to the default
        const pctOf = (v, def) => { const t = String(v == null ? '' : v).trim(); return Math.min(100, Math.max(0, t === '' ? n(def) : n(t))) / 100; };
        // Xactimate activity of a line: I = install (labor), M = material, + and the rest = both
        const actOf = (x) => x.act || (((x.desc || '').match(/^[A-Z]{3} \S+ (\S) /) || [])[1] || '');

        // All the math for one trade's worksheet
        function calcWs(ws, method) {
            const padTotal = ws.pad.reduce((t, p) => t + n(p.amount), 0);
            const rows = ws.xact.map(x => {
                // Lines marked CHANGE, OPEN-ITEM, BID ITEM... carry no dollars, same as on the Work Order
                if (x.marker) return { ...x, total: 0 };
                // Untouched Work Order line: use the total printed on the Work Order (Xactimate rounds its own way)
                const asPrinted = x.woTotal != null && x.qty === x.woQty && x.price === x.woPrice;
                return { ...x, total: asPrinted ? x.woTotal : round2(n(x.qty) * n(x.price)) };
            });
            const xactTotal = round2(rows.reduce((t, r) => t + r.total, 0));

            if (method === 'allowance') {
                const laborMult = factorOf(ws.laborMult, DEFAULT_LABOR_MULT), matMult = factorOf(ws.matMult, DEFAULT_MAT_MULT);
                let iTotal = 0, mTotal = 0, oTotal = 0, oLabor = 0, oMat = 0, oCount = 0;
                rows.forEach(r => {
                    const a = actOf(r);
                    r.kind = a === 'I' ? 'labor' : a === 'M' ? 'material' : 'split';
                    if (r.marker) return;
                    if (r.kind === 'labor') iTotal += r.total;
                    else if (r.kind === 'material') mTotal += r.total;
                    else {
                        // Line that is labor and material together: retail x factor, then divided by the labor percent
                        const cost = round2(r.total * factorOf(r.sf, DEFAULT_SPLIT));
                        r.labor = round2(cost * pctOf(r.sl, DEFAULT_LABOR_PCT));
                        r.mat = round2(cost - r.labor);
                        oTotal += r.total; oLabor += r.labor; oMat += r.mat; oCount++;
                    }
                });
                // Scratch pad lines work the same way from a typed retail amount
                const pads = (ws.apad || []).map(p => {
                    const cost = round2(n(p.retail) * factorOf(p.factor, DEFAULT_SPLIT));
                    const laborAmt = round2(cost * pctOf(p.labor, DEFAULT_LABOR_PCT));
                    return { ...p, laborAmt, matAmt: round2(cost - laborAmt) };
                });
                const padRetail = round2(pads.reduce((t, p) => t + n(p.retail), 0));
                const iBase = round2(iTotal * laborMult), mBase = round2(mTotal * matMult);
                const labor = round2(iBase + oLabor + pads.reduce((t, p) => t + p.laborAmt, 0));
                const material = round2(mBase + oMat + pads.reduce((t, p) => t + p.matAmt, 0));
                const vendorPrice = round2(labor + material);
                const retailBase = round2(xactTotal + padRetail);   // retail the margin is measured against
                return {
                    rows, xactTotal, pads, padRetail, iBase, mBase, labor, material, vendorPrice, retailBase, oCount,
                    iTotal: round2(iTotal), mTotal: round2(mTotal), oTotal: round2(oTotal), oLabor: round2(oLabor), oMat: round2(oMat),
                    margin: retailBase > 0 ? (retailBase - vendorPrice) / retailBase : null
                };
            }

            if (method === 'factor') {
                let mult = n(ws.mult);
                if (mult > 3) mult = mult / 100;                          // 50 typed for 0.50 (1.2 stays 1.2)
                if (!(mult > 0)) mult = n(DEFAULT_MULT);
                const base = round2(xactTotal * mult);                    // Xactimate total x factor
                const vendorPrice = round2(base + padTotal);              // plus scratch pad
                return { rows, xactTotal, mult, base, vendorPrice, margin: xactTotal > 0 ? (xactTotal - vendorPrice) / xactTotal : null };
            }

            const vendorPrice = round2(n(ws.quote) + padTotal);          // quote + scratch pad
            let factor = n(ws.factor);
            if (factor > 1) factor = factor / 100;                        // 70 typed for 0.70
            if (!(factor > 0)) factor = n(DEFAULT_FACTOR);
            const retail = round2(vendorPrice / factor);                  // what Xactimate needs to total
            // New unit prices: every priced line moves by the same percentage, rounded to the cent
            const ratio = xactTotal > 0 ? retail / xactTotal : 0;
            rows.forEach(r => {
                r.newPrice = r.marker ? 0 : round2(n(r.price) * ratio);
                r.newTotal = r.marker ? 0 : round2(n(r.qty) * r.newPrice);
            });
            const newTotal = round2(rows.reduce((t, r) => t + r.newTotal, 0));
            return {
                vendorPrice, factor, retail, rows, xactTotal, newTotal,
                diff: round2(xactTotal - retail),                         // + over, - short
                margin: xactTotal > 0 ? (xactTotal - vendorPrice) / xactTotal : null,
                leftover: round2(newTotal - retail)                       // rounding leftover at the new prices
            };
        }
        const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Xactimate categories a trade code starts with on the picker: "INS" -> INS, "FNC/DOR #2" -> FNC and DOR, "PNT-DEO" -> PNT
        const catsFor = (code) => (code || '').toUpperCase().split(/[\s#]/)[0].split(/[\/-]/).filter(t => /^[A-Z]{3}$/.test(t));

        // Read an Xactimate Work Order PDF (already opened with pdf.js) into its line items
        async function parseWorkOrder(pdf) {
            const num = (s) => parseFloat(String(s).replace(/,/g, ''));
            const out = { date: '', estimate: '', lines: [], catTotals: {}, catNames: {} };
            let cat = '';     // category section we are in
            let cur = null;   // item waiting for its quantity/price row
            let last = null;  // last finished item (a marker like "ROOF BID ITEM" can wrap to a second row)
            for (let p = 1; p <= pdf.numPages; p++) {
                const page = await pdf.getPage(p);
                const tc = await page.getTextContent();
                // Group the text into rows by height on the page
                const rows = [];
                tc.items.forEach(it => {
                    const s = (it.str || '').trim();
                    if (!s) return;
                    const x = it.transform[4], y = it.transform[5];
                    let row = rows.find(r => Math.abs(r.y - y) < 2);
                    if (!row) { row = { y, parts: [] }; rows.push(row); }
                    row.parts.push({ x, s });
                });
                rows.sort((a, b) => b.y - a.y);
                rows.forEach(row => {
                    row.parts.sort((a, b) => a.x - b.x);
                    const text = row.parts.map(q => q.s).join(' ').replace(/\s+/g, ' ');
                    const x0 = row.parts[0].x;
                    let m;
                    if ((m = text.match(/^(\d{1,2}\/\d{1,2}\/\d{4}) Page: \d+$/))) { if (!out.date) out.date = m[1]; return; }
                    if (row.y > 770) return; // page number at the top edge
                    if ((m = text.match(/^Estimate: (\S+)/))) { out.estimate = m[1]; return; }
                    if (x0 < 60 && (m = text.match(/^TOTAL .*?(-?[\d,]+\.\d{2})?$/))) { if (cat) out.catTotals[cat] = m[1] ? num(m[1]) : 0; return; }
                    // Quantity row: "1,743.04 SF 2.16 3,764.97 [ ]" or "... CHANGE [ ]"
                    if (cur && (m = text.match(/^(-?[\d,]+\.\d{2}) ([A-Z]{2,3}) (-?[\d,]+\.\d{2}) (.+?)(?: \[ ?\])?$/))) {
                        cur.qty = m[1]; cur.unit = m[2]; cur.price = m[3];
                        if (/^-?[\d,]+\.\d{2}$/.test(m[4])) { cur.total = num(m[4]); cur.marker = ''; }
                        else { cur.total = null; cur.marker = m[4]; }
                        out.lines.push(cur); last = cur; cur = null;
                        return;
                    }
                    // Rest of a marker that wrapped ("ROOF BID" / "ITEM")
                    if (!cur && last && last.marker && row.parts.length === 1 && x0 > 480) { last.marker += ' ' + text; last = null; return; }
                    // Category heading: "INS INSULATION" (starts further left than the items)
                    if (x0 < 42 && (m = text.match(/^([A-Z]{3}) [A-Z]/))) { cat = m[1]; out.catNames[cat] = text.slice(4); cur = null; last = null; return; }
                    // Item row: category, selector, activity, description
                    if (x0 >= 42 && x0 < 60) {
                        if (/^[A-Z]{3}$/.test(row.parts[0].s)) {
                            const rest = row.parts.slice(1);
                            cur = {
                                cat: row.parts[0].s,
                                sel: rest.filter(q => q.x < 160).map(q => q.s).join(' '),
                                act: rest.filter(q => q.x >= 160 && q.x < 182).map(q => q.s).join(' '),
                                desc: rest.filter(q => q.x >= 182).map(q => q.s).join(' ')
                            };
                        } else if ((m = text.match(/^([A-Z]{3}) (\S+) (\S) (.+)$/))) {
                            cur = { cat: m[1], sel: m[2], act: m[3], desc: m[4] };
                        }
                        return;
                    }
                    // Description that wrapped to a second row
                    if (cur && x0 >= 182) cur.desc += ' ' + text;
                });
            }
            // Key per line = its text plus which copy it is (the same item can be listed more than once)
            const seen = {};
            out.lines.forEach(l => {
                const k = `${l.cat}|${l.sel}|${l.act}|${l.desc}`;
                seen[k] = (seen[k] || 0) + 1;
                l.key = `${k}#${seen[k]}`;
            });
            return out;
        }

        // Pick which Work Order categories and lines go into one trade
        function WorkOrderPicker({ wo, line, prev, existing, onImport, onCancel }) {
            const present = [...new Set(wo.lines.map(l => l.cat))];
            const skippedBefore = new Set((prev && prev.skipped) || []);
            // Start from the last picks for this trade; first time, from the trade's own category
            const [cats, setCats] = useState(() => ((prev && prev.cats && prev.cats.length) ? prev.cats : catsFor(line.code)).filter(k => present.includes(k)));
            const [off, setOff] = useState(() => { const o = {}; wo.lines.forEach((l, i) => { if (skippedBefore.has(l.key)) o[i] = true; }); return o; });

            const linesOf = (k) => wo.lines.map((l, i) => ({ l, i })).filter(x => x.l.cat === k);
            const picked = wo.lines.filter((l, i) => cats.includes(l.cat) && !off[i]);
            const pickedTotal = round2(picked.reduce((t, l) => t + (l.total || 0), 0));
            const toggleCat = (k) => setCats(cats.includes(k) ? cats.filter(x => x !== k) : present.filter(x => x === k || cats.includes(x)));
            const setAll = (k, on) => { const o = { ...off }; linesOf(k).forEach(x => { if (on) delete o[x.i]; else o[x.i] = true; }); setOff(o); };
            // Pick only one activity in a category: M = material lines, I = install (labor) lines
            const setOnly = (k, act) => { const o = { ...off }; linesOf(k).forEach(x => { if (x.l.act === act) delete o[x.i]; else o[x.i] = true; }); setOff(o); };
            const doImport = () => onImport(picked, cats, wo.lines.filter((l, i) => cats.includes(l.cat) && off[i]).map(l => l.key));

            return (
                <div className="pick-back">
                    <div className="pick">
                        <div className="pick-head">
                            <div style={{ fontWeight: 700 }}>Pick Work Order lines for {line.code} {line.name}</div>
                            <div className="muted" style={{ marginTop: '4px' }}>Work Order dated {wo.date}{wo.estimate ? ` (${wo.estimate})` : ''}. Only this trade changes.</div>
                        </div>
                        <div className="pick-body">
                            <div className="sub-title">1. Categories</div>
                            <div className="pick-cats">
                                {present.map(k => {
                                    const ls = linesOf(k);
                                    return (
                                        <label key={k} className={cats.includes(k) ? 'on' : ''}>
                                            <input type="checkbox" checked={cats.includes(k)} onChange={() => toggleCat(k)} />
                                            <span>{k} {wo.catNames[k] || ''}, {ls.length} line{ls.length === 1 ? '' : 's'}, {money(wo.catTotals[k] || 0)}</span>
                                        </label>
                                    );
                                })}
                            </div>

                            <div className="sub-title">2. Lines</div>
                            {cats.length === 0 && <div className="muted" style={{ marginTop: 0 }}>Check a category above to see its lines.</div>}
                            {cats.map(k => {
                                const ls = linesOf(k);
                                const on = ls.filter(x => !off[x.i]).length;
                                return (
                                    <div key={k} style={{ marginBottom: '14px' }}>
                                        <div className="inline" style={{ fontSize: '13px', marginBottom: '4px' }}>
                                            <strong>{k} {wo.catNames[k] || ''}</strong>
                                            <span style={{ color: '#666' }}>{on} of {ls.length} picked</span>
                                            <button className="btn-secondary btn-sm" onClick={() => setAll(k, true)}>All</button>
                                            <button className="btn-secondary btn-sm" onClick={() => setAll(k, false)}>None</button>
                                            {ls.some(x => x.l.act === 'M') && <button className="btn-secondary btn-sm" title="Pick only the material lines" onClick={() => setOnly(k, 'M')}>M only</button>}
                                            {ls.some(x => x.l.act === 'I') && <button className="btn-secondary btn-sm" title="Pick only the install (labor) lines" onClick={() => setOnly(k, 'I')}>I only</button>}
                                        </div>
                                        <table>
                                            <tbody>
                                                {ls.map(({ l, i }) => (
                                                    <tr key={i} className={off[i] ? 'skip' : ''} style={{ cursor: 'pointer' }} onClick={() => setOff(off[i] ? (({ [i]: _, ...rest }) => rest)(off) : { ...off, [i]: true })}>
                                                        <td style={{ width: '28px' }}><input type="checkbox" checked={!off[i]} readOnly /></td>
                                                        <td>{l.sel} {l.act} {l.desc}</td>
                                                        <td className="money" style={{ width: '110px' }}>{l.qty} {l.unit}</td>
                                                        <td className="money" style={{ width: '90px' }}>{l.price}</td>
                                                        <td className="money" style={{ width: '120px' }}>{l.marker || money(l.total)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="pick-foot">
                            <span style={{ flex: 1, fontSize: '14px' }}><strong>{picked.length} line{picked.length === 1 ? '' : 's'} picked, {money(pickedTotal)}</strong></span>
                            <button className="btn-secondary" onClick={onCancel}>Cancel</button>
                            <button className="btn-primary" style={{ width: 'auto', marginTop: 0, padding: '10px 16px' }} disabled={picked.length === 0} onClick={doImport}>
                                {existing ? `Replace this trade's ${existing} line${existing === 1 ? '' : 's'} with ${picked.length} picked` : `Import ${picked.length} line${picked.length === 1 ? '' : 's'}`}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Calculator math: + - x / and ( ), typed like 23600+575. Returns null until the math is complete.
        function calcExpr(src) {
            const s = String(src == null ? '' : src).replace(/[\s,$]/g, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
            if (!s) return null;
            let i = 0;
            const factor = () => {
                if (s[i] === '-') { i++; return -factor(); }
                if (s[i] === '+') { i++; return factor(); }
                if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw new Error('paren'); i++; return v; }
                const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
                if (!m) throw new Error('number');
                i += m[0].length;
                return parseFloat(m[0]);
            };
            const term = () => {
                let v = factor();
                while (s[i] === '*' || s[i] === '/') { const op = s[i++]; const r = factor(); v = op === '*' ? v * r : v / r; }
                return v;
            };
            const expr = () => {
                let v = term();
                while (s[i] === '+' || s[i] === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
                return v;
            };
            try { const v = expr(); return i === s.length && isFinite(v) ? v : null; } catch (e) { return null; }
        }

        const CALC_KEYS = ['C', '(', ')', '←', '7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '-', '0', '.', '=', '+'];

        // Pop-up calculator. With onUse it shows a Use button that hands the answer back (to a scratch pad line).
        function Calculator({ start, onUse, onClose }) {
            const [text, setText] = useState(start ? String(start) : '');
            const box = React.useRef(null);
            const value = calcExpr(text);
            const equals = () => { if (value !== null) setText(String(Math.round(value * 1e6) / 1e6)); };
            const tap = (k) => {
                if (k === 'C') setText('');
                else if (k === '←') setText(text.slice(0, -1));
                else if (k === '=') equals();
                else setText(text + k);
                if (box.current) box.current.focus();
            };
            return (
                <div className="calc-back">
                    <div className="calc">
                        <div style={{ fontWeight: 700, marginBottom: '8px' }}>Calculator</div>
                        <input ref={box} autoFocus value={text} style={{ textAlign: 'right', fontSize: '16px' }}
                            onChange={e => setText(e.target.value.replace(/[^0-9.+\-*/()x×÷,$ ]/gi, ''))}
                            onKeyDown={e => {
                                if (e.key === 'Enter') { e.preventDefault(); equals(); }
                                if (e.key === 'Escape') onClose();
                            }} />
                        <div className="res">{value !== null ? '= ' + value.toLocaleString('en-US', { maximumFractionDigits: 4 }) : ''}</div>
                        <div className="keys">
                            {CALC_KEYS.map(k => <button key={k} className={/[0-9.]/.test(k) ? '' : 'op'} onClick={() => tap(k)}>{k}</button>)}
                        </div>
                        {onUse && (
                            <button className="btn-primary" style={{ marginTop: 0 }} disabled={value === null} onClick={() => onUse(String(round2(value)))}>
                                {value !== null ? `Use ${money(round2(value))}` : 'Use'}
                            </button>
                        )}
                        <button className="btn-secondary" style={{ width: '100%', marginTop: '8px' }} onClick={onClose}>Close</button>
                    </div>
                </div>
            );
        }

        const overShort = (x) => x === 0 ? <span>{money(0)}</span>
            : <span className={x < 0 ? 'short' : 'over'}>{money(Math.abs(x))} {x < 0 ? 'short' : 'over'}</span>;

        // One trade's pricing worksheet.
        //   Quote:  vendor price, retail needed, Xactimate lines with new unit prices, comparison
        //   Factor: vendor price = Xactimate total x factor (+ scratch pad), Xactimate lines, comparison
        //   Allowance: labor and material vendor prices, Xactimate lines (each goes to labor, material or a split), comparison

            const [busy, setBusy] = useState(false);
            const [note, setNote] = useState('');
            const [calcFor, setCalcFor] = useState(null); // scratch pad box the calculator is open for: { list, id, field }
            const [pick, setPick] = useState(null);       // Work Order just read, waiting for lines to be picked
            const ws = { ...blankWs(), ...(line.ws || {}) };
            const isFactor = line.method === 'factor';
            const isAllow = line.method === 'allowance';
            const plain = isFactor || isAllow; // no "new unit price" columns: the CES does not change
            const c = calcWs(ws, line.method);
            const set = (k, v) => onChange({ ...ws, [k]: v });
            const setRow = (list, id, k, v) => set(list, ws[list].map(r => r.id === id ? { ...r, [k]: v } : r));
            const ready = isAllow ? c.retailBase > 0 : isFactor ? c.xactTotal > 0 : (c.vendorPrice > 0 && c.xactTotal > 0);

            // Read a Work Order PDF, then open the picker. Nothing changes until lines are imported.
            const upload = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                setBusy(true);
                setNote('');
                try {
                    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
                    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                    const wo = await parseWorkOrder(pdf);
                    if (!wo.lines.length) setNote('Error: no Work Order lines found in that PDF. It needs to be the Xactimate Work Order report. Nothing changed.');
                    else setPick({ wo, fileName: file.name });
                } catch (err) {
                    setNote('Error reading the PDF: ' + err.message);
                }
                setBusy(false);
            };
            // Bring the picked lines into this trade only
            const importPicked = (picked, cats, skipped) => {
                // Keep the split settings already made on a line when a newer Work Order replaces it
                const before = {};
                ws.xact.forEach(x => { if (x.key) before[x.key] = x; });
                const xact = picked.map(l => {
                    const x = {
                        id: newId(), desc: `${l.cat} ${l.sel} ${l.act} ${l.desc}`, qty: l.qty, unit: l.unit, price: l.price,
                        woQty: l.qty, woPrice: l.price, woTotal: l.total, marker: l.marker, act: l.act, key: l.key
                    };
                    const old = before[l.key];
                    if (old && old.sf != null) x.sf = old.sf;
                    if (old && old.sl != null) x.sl = old.sl;
                    return x;
                });
                onChange({ ...ws, xact, wo: { fileName: pick.fileName, date: pick.wo.date, estimate: pick.wo.estimate, cats, skipped, lines: picked.length, uploadedBy: me, uploadedAt: new Date() } });
                setNote(`${picked.length} line(s) loaded from the Work Order dated ${pick.wo.date}. Click Save to keep them.`);
                setPick(null);
            };

            const vendorBlock = (<>
                    <div className="sub-title">Vendor price</div>
                    <table>
                        <thead><tr><th style={{ width: '110px' }}></th><th>Vendor / note</th><th className="num">Amount</th><th style={{ width: '56px' }}></th><th style={{ width: '40px' }}></th></tr></thead>
                        <tbody>
                            {!isFactor && (
                                <tr>
                                    <td>Quote</td>
                                    <td><input value={ws.vendor} onChange={e => set('vendor', e.target.value)} placeholder="Vendor name" /></td>
                                    <td><input className="num" value={ws.quote} onChange={e => set('quote', e.target.value)} placeholder="0.00" /></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            )}
                            {isFactor && (<>
                                <tr>
                                    <td>Vendor</td>
                                    <td><input value={ws.vendor} onChange={e => set('vendor', e.target.value)} placeholder="Vendor name" /></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td>Factor</td>
                                    <td>
                                        <div className="inline" style={{ fontSize: '13px' }}>
                                            <span>Xactimate total {money(c.xactTotal)} x</span>
                                            <input className="num" style={{ width: '80px' }} value={ws.mult} onChange={e => set('mult', e.target.value)} />
                                        </div>
                                    </td>
                                    <td className="money">{money(c.base)}</td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </>)}
                            {ws.pad.map(p => (
                                <tr key={p.id}>
                                    <td>Scratch pad</td>
                                    <td><input value={p.note} onChange={e => setRow('pad', p.id, 'note', e.target.value)} placeholder="What this number is" /></td>
                                    <td><input className="num" value={p.amount} onChange={e => setRow('pad', p.id, 'amount', e.target.value)} placeholder="+ or -" /></td>
                                    <td><button className="btn-secondary btn-sm" title="Open the calculator for this line" onClick={() => setCalcFor({ list: 'pad', id: p.id, field: 'amount' })}>Calc</button></td>
                                    <td><button className="btn-x" title="Remove this line" onClick={() => set('pad', ws.pad.filter(x => x.id !== p.id))}>✕</button></td>
                                </tr>
                            ))}
                            <tr className="sum"><td colSpan="2">Vendor price</td><td className="money">{money(c.vendorPrice)}</td><td></td><td></td></tr>
                        </tbody>
                    </table>
                    <button className="btn-secondary btn-sm" style={{ marginTop: '6px' }}
                        onClick={() => set('pad', [...ws.pad, { id: newId(), note: '', amount: '' }])}>+ Add scratch pad line</button>
            </>);

            const calcBlock = calcFor && (
                <Calculator start={((ws[calcFor.list] || []).find(x => x.id === calcFor.id) || {})[calcFor.field]}
                    onUse={v => { setRow(calcFor.list, calcFor.id, calcFor.field, v); setCalcFor(null); }}
                    onClose={() => setCalcFor(null)} />
            );

            // Allowance: labor and material side by side
            const allowBlock = isAllow && (<>
                    <div className="sub-title">Vendor price</div>
                    <div className="inline" style={{ marginBottom: '8px', fontSize: '13px' }}>
                        <label>Labor vendor</label>
                        <input style={{ width: '230px' }} value={ws.vendor} onChange={e => set('vendor', e.target.value)} placeholder="Vendor name" />
                        <label>Material vendor</label>
                        <input style={{ width: '230px' }} value={ws.matVendor} onChange={e => set('matVendor', e.target.value)} placeholder="Vendor name" />
                    </div>
                    <table>
                        <thead><tr><th style={{ width: '110px' }}></th><th>Detail</th><th className="num">Labor</th><th className="num">Material</th><th style={{ width: '56px' }}></th><th style={{ width: '40px' }}></th></tr></thead>
                        <tbody>
                            <tr>
                                <td>Labor</td>
                                <td>
                                    <div className="inline" style={{ fontSize: '13px' }}>
                                        <span>I lines {money(c.iTotal)} x</span>
                                        <input className="num" style={{ width: '70px' }} value={ws.laborMult} onChange={e => set('laborMult', e.target.value)} />
                                    </div>
                                </td>
                                <td className="money">{money(c.iBase)}</td>
                                <td className="money">-</td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>Material</td>
                                <td>
                                    <div className="inline" style={{ fontSize: '13px' }}>
                                        <span>M lines {money(c.mTotal)} x</span>
                                        <input className="num" style={{ width: '70px' }} value={ws.matMult} onChange={e => set('matMult', e.target.value)} />
                                    </div>
                                </td>
                                <td className="money">-</td>
                                <td className="money">{money(c.mBase)}</td>
                                <td></td>
                                <td></td>
                            </tr>
                            {c.oCount > 0 && (
                                <tr>
                                    <td>Other lines</td>
                                    <td style={{ fontSize: '13px' }}>{c.oCount} line{c.oCount === 1 ? '' : 's'} not marked I or M, {money(c.oTotal)} retail. Split is set on each line below.</td>

                                    <td className="money">{money(c.oMat)}</td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            )}
                            {c.pads.map(p => (
                                <tr key={p.id}>
                                    <td>Scratch pad</td>
                                    <td>
                                        <div style={{ display: 'flex', gap: '6px', alignItems: 'center', fontSize: '13px' }}>
                                            <input style={{ flex: 1 }} value={p.note} onChange={e => setRow('apad', p.id, 'note', e.target.value)} placeholder="What this is" />
                                            <input className="num" style={{ width: '100px' }} value={p.retail} onChange={e => setRow('apad', p.id, 'retail', e.target.value)} placeholder="Retail" />
                                            <span>x</span>
                                            <input className="num" style={{ width: '58px' }} value={p.factor} onChange={e => setRow('apad', p.id, 'factor', e.target.value)} title="Factor" />
                                            <span>labor</span>
                                            <input className="num" style={{ width: '52px' }} value={p.labor} onChange={e => setRow('apad', p.id, 'labor', e.target.value)} title="Percent to labor; the rest is material" />
                                            <span>%</span>
                                        </div>
                                    </td>
                                    <td className="money">{money(p.laborAmt)}</td>
                                    <td className="money">{money(p.matAmt)}</td>

                                    <td><button className="btn-x" title="Remove this line" onClick={() => set('apad', ws.apad.filter(x => x.id !== p.id))}>✕</button></td>
                                </tr>
                            ))}
                            <tr className="sum"><td colSpan="2">Vendor price</td><td className="money">{money(c.labor)}</td><td className="money">{money(c.material)}</td><td></td><td></td></tr>
                            <tr><td colSpan="2" style={{ fontWeight: 700 }}>Labor + material</td><td colSpan="2" className="money" style={{ fontWeight: 700 }}>{money(c.vendorPrice)}</td><td></td><td></td></tr>
                        </tbody>
                    </table>
                    <button className="btn-secondary btn-sm" style={{ marginTop: '6px' }}
                        onClick={() => set('apad', [...ws.apad, { id: newId(), note: '', retail: '', factor: DEFAULT_SPLIT, labor: DEFAULT_LABOR_PCT }])}>+ Add scratch pad line</button>
            </>);

            const retailBlock = (<>
                    <div className="sub-title">Retail needed</div>
                    <div className="inline">
                        <label>Vendor price divided by</label>
                        <input className="num" style={{ width: '80px' }} value={ws.factor} onChange={e => set('factor', e.target.value)} />
                        <span>= <strong>{money(c.retail)}</strong> retail needed in Xactimate</span>
                    </div>
            </>);

            const xactBlock = (<>
                    <div className="sub-title">Xactimate lines</div>
                    <div className="inline" style={{ marginBottom: '8px', fontSize: '13px' }}>
                        <label className="btn-secondary btn-sm" style={{ display: 'inline-block', borderRadius: '4px', cursor: 'pointer', color: '#333' }}>
                            {busy ? 'Reading...' : 'Upload Work Order'}
                            <input type="file" accept="application/pdf" onChange={upload} disabled={busy} style={{ display: 'none' }} />
                        </label>
                        <span style={{ color: '#666' }}>
                            {ws.wo
                                ? `From the Work Order dated ${ws.wo.date}${ws.wo.estimate ? ' (' + ws.wo.estimate + ')' : ''}, ${(ws.wo.cats || []).join(' + ')}, uploaded by ${ws.wo.uploadedBy ? ws.wo.uploadedBy.name : ''} on ${fmtStamp(ws.wo.uploadedAt)}`
                                : 'No Work Order uploaded for this trade yet. Upload one, or add lines by hand.'}
                        </span>
                    </div>
                    {note && <div style={{ fontSize: '13px', fontWeight: 600, marginBottom: '8px', color: note.includes('Error') ? '#d32f2f' : '#388e3c' }}>{note}</div>}
                    {pick && <WorkOrderPicker wo={pick.wo} line={line} prev={ws.wo} existing={ws.xact.length} onImport={importPicked} onCancel={() => setPick(null)} />}
                    <table>
                        <thead><tr>
                            <th>Description</th><th className="num">Qty</th><th style={{ width: '70px' }}>Unit</th><th className="num">Unit price</th>
                            <th className="money">Total</th>
                            {!plain && <th className="money">New unit price</th>}
                            {!plain && <th className="money">New total</th>}

                        <tbody>
                            {c.rows.map(r => (

                                    <td><input list="units" value={r.unit} onChange={e => setRow('xact', r.id, 'unit', e.target.value)} /></td>
                                    <td><input className="num" value={r.price} onChange={e => setRow('xact', r.id, 'price', e.target.value)} /></td>
                                    <td className="money">{r.marker || money(r.total)}</td>

                                    {!plain && <td className="money">{ready && !r.marker ? money(r.newTotal) : '-'}</td>}
                                    {isAllow && (
                                        <td style={{ fontSize: '12px' }}>
                                            {r.marker ? '-' : r.kind === 'labor' ? 'Labor' : r.kind === 'material' ? 'Material' : (
                                                <div style={{ display: 'flex', gap: '4px', alignItems: 'center' }}>
                                                    <span>x</span>
                                                    <input className="num" style={{ width: '50px' }} value={r.sf == null ? DEFAULT_SPLIT : r.sf} onChange={e => setRow('xact', r.id, 'sf', e.target.value)} title="Factor" />
                                                    <span>labor</span>
                                                    <input className="num" style={{ width: '44px' }} value={r.sl == null ? DEFAULT_LABOR_PCT : r.sl} onChange={e => setRow('xact', r.id, 'sl', e.target.value)} title="Percent to labor; the rest is material" />
                                                    <span>%</span>
                                                    <span style={{ color: '#666', whiteSpace: 'nowrap' }}>L {money(r.labor)} M {money(r.mat)}</span>
                                                </div>
                                            )}
                                        </td>
                                    )}
                                    <td><button className="btn-x" title="Remove this line" onClick={() => set('xact', ws.xact.filter(x => x.id !== r.id))}>✕</button></td>
                                </tr>
                            ))}
                            <tr className="sum">
                                <td colSpan="4">Xactimate total</td>
                                <td className="money">{money(c.xactTotal)}</td>
                                {!plain && <td></td>}
                                {!plain && <td className="money">{ready ? money(c.newTotal) : '-'}</td>}
                                {isAllow && <td></td>}
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                    <button className="btn-secondary btn-sm" style={{ marginTop: '6px' }}
                        onClick={() => set('xact', [...ws.xact, { id: newId(), desc: '', qty: '', unit: '', price: '' }])}>+ Add Xactimate line</button>
            </>);

            if (isAllow) {
                return (
                    <div className="ws">
                        {allowBlock}
                        {calcBlock}
                        {xactBlock}
                        <div className="sub-title">Comparison</div>
                        <table style={{ maxWidth: '520px' }}>
                            <tbody>
                                <tr><td>Xactimate total</td><td className="money">{money(c.xactTotal)}</td></tr>
                                {c.padRetail !== 0 && <tr><td>Scratch pad retail</td><td className="money">{money(c.padRetail)}</td></tr>}
                                <tr><td>Labor vendor price</td><td className="money">{money(c.labor)}</td></tr>
                                <tr><td>Material vendor price</td><td className="money">{money(c.material)}</td></tr>
                                <tr><td>Labor + material</td><td className="money">{money(c.vendorPrice)}</td></tr>
                                <tr><td>Margin</td><td className="money">{ready ? (c.margin * 100).toFixed(1) + '%' : '-'}</td></tr>
                            </tbody>
                        </table>
                    </div>
                );
            }

            if (isFactor) {
                return (
                    <div className="ws">
                        {vendorBlock}
                        {calcBlock}
                        {xactBlock}
                        <div className="sub-title">Comparison</div>
                        <table style={{ maxWidth: '520px' }}>
                            <tbody>
                                <tr><td>Xactimate total</td><td className="money">{money(c.xactTotal)}</td></tr>
                                <tr><td>Vendor price</td><td className="money">{money(c.vendorPrice)}</td></tr>
                                <tr><td>Margin</td><td className="money">{ready ? (c.margin * 100).toFixed(1) + '%' : '-'}</td></tr>
                            </tbody>
                        </table>
                    </div>
                );
            }

            return (
                <div className="ws">
                    {vendorBlock}
                    {calcBlock}
                    {retailBlock}
                    {xactBlock}
                    <div className="sub-title">Comparison</div>
                    <table style={{ maxWidth: '520px' }}>
                        <tbody>
                            <tr><td>Vendor price</td><td className="money">{money(c.vendorPrice)}</td></tr>
                            <tr><td>Retail needed</td><td className="money">{money(c.retail)}</td></tr>
                            <tr><td>Xactimate total now</td><td className="money">{money(c.xactTotal)}</td></tr>
                            <tr><td>Difference</td><td className="money">{ready ? overShort(c.diff) : '-'}</td></tr>
                            <tr><td>Margin now</td><td className="money">{ready ? (c.margin * 100).toFixed(1) + '%' : '-'}</td></tr>
                            <tr><td>Total at new unit prices</td><td className="money">{ready ? money(c.newTotal) : '-'}</td></tr>
                            <tr><td>Left over from rounding</td><td className="money">{ready ? overShort(c.leftover) : '-'}</td></tr>
                        </tbody>
                    </table>
                </div>
            );
        }

        // Editable list of trades. Used for a job's list and for the start list.
        // worksheets = true on a job (Open button and pricing worksheet); false on the start list
        function LineTable({ lines, onChange, me, canRestore, worksheets }) {
            const [showGone, setShowGone] = useState(false);
            const [openId, setOpenId] = useState(null); // trade whose worksheet is open
            const [addCode, setAddCode] = useState('');
            const [addName, setAddName] = useState('');
            const live = lines.filter(l => !l.deleted);
            const gone = lines.filter(l => l.deleted);

            const edit = (id, k, v) => onChange(lines.map(l => l.id === id ? { ...l, [k]: v } : l));
            // Put the row back in alphabetical order after its code is changed (when you leave the box)
            const resort = () => {
                const sorted = sortLines(lines);
                if (sorted.some((l, i) => l.id !== lines[i].id)) onChange(sorted);
            };
            const remove = (l) => {
                // Added just now and never saved: nothing to keep. Otherwise hide it and record who and when.
                if (l._new) onChange(lines.filter(x => x.id !== l.id));
                else onChange(lines.map(x => x.id === l.id ? { ...x, deleted: true, deletedBy: me, deletedAt: new Date() } : x));
            };
            const restore = (l) => onChange(sortLines(lines.map(x => {
                if (x.id !== l.id) return x;
                const { deleted, deletedBy, deletedAt, ...rest } = x;
                return { ...rest, restoredBy: me, restoredAt: new Date() };
            })));
            const add = () => {
                const code = addCode.trim(), name = addName.trim();
                if (!code && !name) return;
                onChange(sortLines([...lines, { id: newId(), code, name, _new: true }]));
                setAddCode('');
                setAddName('');
            };
            const addOnEnter = (e) => { if (e.key === 'Enter') add(); };

            return (
                <div>
                    <table className="lines">
                        <thead><tr>
                            <th className="code">Trade code</th><th>Description</th><th style={{ width: '110px' }}>Method</th>
                            {worksheets && <th style={{ width: '70px' }}></th>}
                            <th style={{ width: '40px' }}></th>
                        </tr></thead>
                        <tbody>
                            {live.map(l => (
                                <React.Fragment key={l.id}>
                                    <tr className="line">
                                        <td><input value={l.code} onChange={e => edit(l.id, 'code', e.target.value)} onBlur={resort} /></td>
                                        <td><input value={l.name} onChange={e => edit(l.id, 'name', e.target.value)} /></td>
                                        <td>
                                            <select value={l.method || ''} onChange={e => edit(l.id, 'method', e.target.value)}>
                                                {METHODS.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                                            </select>
                                        </td>
                                        {worksheets && (
                                            <td>{hasWorksheet(l.method) && (
                                                <button className="btn-secondary btn-sm" onClick={() => setOpenId(openId === l.id ? null : l.id)}>
                                                    {openId === l.id ? 'Close' : 'Open'}
                                                </button>
                                            )}</td>
                                        )}
                                        <td><button className="btn-x" title="Remove this trade" onClick={() => remove(l)}>✕</button></td>
                                    </tr>
                                    {worksheets && openId === l.id && hasWorksheet(l.method) && (
                                        <tr><td colSpan="5"><Worksheet line={l} me={me} onChange={ws => edit(l.id, 'ws', ws)} /></td></tr>
                                    )}
                                </React.Fragment>
                            ))}
                            {live.length === 0 && <tr><td colSpan={worksheets ? 5 : 4} style={{ color: '#888', padding: '10px 4px' }}>No trades on this list.</td></tr>}
                        </tbody>
                    </table>

                    <div className="sub-title">Add a trade</div>
                    <div style={{ display: 'flex', gap: '8px' }}>
                        <input className="code" value={addCode} onChange={e => setAddCode(e.target.value)} onKeyDown={addOnEnter} placeholder="Trade code" />
                        <input value={addName} onChange={e => setAddName(e.target.value)} onKeyDown={addOnEnter} placeholder="Description" />
                        <button className="btn-secondary btn-sm" style={{ whiteSpace: 'nowrap' }} onClick={add}>+ Add trade</button>
                    </div>

                    <div className="muted">
                        {live.length} trade{live.length === 1 ? '' : 's'}
                        {gone.length > 0 && (<>
                            {' | '}{gone.length} removed{' '}
                            <button className="btn-secondary btn-sm" style={{ marginLeft: '6px' }} onClick={() => setShowGone(!showGone)}>
                                {showGone ? 'Hide removed' : 'Show removed'}
                            </button>
                        </>)}
                    </div>

                    {showGone && gone.length > 0 && (
                        <table style={{ marginTop: '8px' }}>
                            <thead><tr><th className="code">Trade code</th><th>Description</th><th>Removed</th><th style={{ width: '80px' }}></th></tr></thead>
                            <tbody>
                                {gone.map(l => (
                                    <tr key={l.id} className="gone">
                                        <td>{l.code}</td>
                                        <td>{l.name}</td>
                                        <td>{l.deletedBy ? l.deletedBy.name : ''} {fmtDay(l.deletedAt)}</td>
                                        <td>{canRestore && <button className="btn-secondary btn-sm" onClick={() => restore(l)}>Restore</button>}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // null = checking, false = no access, object = ok
            const [authError, setAuthError] = useState('');
            const [jobs, setJobs] = useState([]);
            const [showArchived, setShowArchived] = useState(false);
            const [jobId, setJobId] = useState('');
            const [record, setRecord] = useState(null);   // saved tradesEst/{jobId}: null = loading, false = none yet
            const [lines, setLines] = useState(null);     // the job's trade list on screen
            const [dirty, setDirty] = useState(false);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [startRec, setStartRec] = useState(null);     // saved tradesEstStart/list: null = loading, false = none yet
            const [startLines, setStartLines] = useState(null); // saved start list (or the built-in one)
            const [editingStart, setEditingStart] = useState(false);
            const [startEdit, setStartEdit] = useState(null);   // start list on screen while editing
            const [startDirty, setStartDirty] = useState(false);
            const startRef = React.useRef(null);
            const [showCalc, setShowCalc] = useState(false); // general calculator from the top button

            // Sign-in and role check (this page never creates user records)
            useEffect(() => {
                return auth.onAuthStateChanged(async u => {
                    setUser(u);
                    setProfile(null);
                    if (!u) return;
                    try {
                        const snap = await db.collection('users').doc(u.uid).get();
                        const d = snap.exists ? snap.data() : null;
                        if (d && d.active === true && ALLOWED.includes(d.role)) setProfile({ uid: u.uid, ...d });
                        else setProfile(false);
                    } catch (e) {
                        setProfile(false);
                    }
                });
            }, []);

            // Job list
            useEffect(() => {
                if (!profile) return;
                return db.collection('jobs').onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));
                    setJobs(list);
                }, e => setMessage('Error loading jobs: ' + e.message));
            }, [profile]);

            // Opened from the Dashboard tile (?job=...): pick that job once the list loads
            const urlJobDone = React.useRef(false);
            useEffect(() => {
                if (urlJobDone.current || !jobs.length) return;
                urlJobDone.current = true;
                const id = new URLSearchParams(window.location.search).get('job');
                if (id && !jobId && jobs.some(j => j.id === id)) setJobId(id);
            }, [jobs]);

            // Company-wide start list
            useEffect(() => {
                if (!profile) return;
                return db.collection('tradesEstStart').doc('list').onSnapshot(doc => {
                    const d = doc.exists ? doc.data() : null;
                    const list = d && Array.isArray(d.lines) ? sortLines(d.lines) : sortLines(DEFAULT_START);
                    startRef.current = list;
                    setStartRec(d || false);
                    setStartLines(list);
                }, e => setMessage('Error loading start list: ' + e.message));
            }, [profile]);

            // Load the job's trade list once when a job is picked. No saved list yet = blank copy of the start list.
            const startReady = startLines !== null;
            useEffect(() => {
                setRecord(null);
                setLines(null);
                setDirty(false);
                if (!profile || !jobId || !startReady) return;
                db.collection('tradesEst').doc(jobId).get().then(doc => {
                    if (doc.exists) {
                        setRecord(doc.data());
                        setLines(sortLines(doc.data().lines || []));
                    } else {
                        setRecord(false);
                        setLines(copyStart(startRef.current || []));
                    }
                }).catch(e => setMessage('Error loading trade list: ' + e.message));
            }, [profile, jobId, startReady]);

            const login = async () => {
                setAuthError('');
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ tenant: '977675c3-2808-4305-ac2e-f4418dc1d69c', prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    setAuthError(e.message);
                }
            };

            // Save the job's trade list. Every save also keeps a copy in history (versions).
            const save = async () => {
                const job = jobs.find(j => j.id === jobId);
                if (!job || !lines) return;
                setSaving(true);
                setMessage('');
                try {
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const now = new Date();
                    const clean = cleanLines(lines);
                    const data = { jobCode: job.code || '', lines: clean, updatedBy: by, updatedAt: now };
                    const ref = db.collection('tradesEst').doc(jobId);
                    const batch = db.batch();
                    batch.set(ref, data, { merge: true });
                    batch.set(ref.collection('versions').doc(), { jobCode: job.code || '', lines: clean, savedBy: by, savedAt: now });
                    await batch.commit();
                    setRecord({ ...(record || {}), ...data });
                    setLines(clean);
                    setDirty(false);
                    setMessage('Saved');
                } catch (e) {
                    setMessage('Error saving: ' + e.message);
                }
                setSaving(false);
            };

            // Save the company-wide start list, with a copy in history (versions)
            const saveStart = async () => {
                if (!startEdit) return;
                setSaving(true);
                setMessage('');
                try {
                    const by = { uid: user.uid, name: profile.name || user.email };
                    const now = new Date();
                    const clean = cleanLines(startEdit);
                    const ref = db.collection('tradesEstStart').doc('list');
                    const batch = db.batch();
                    batch.set(ref, { lines: clean, updatedBy: by, updatedAt: now }, { merge: true });
                    batch.set(ref.collection('versions').doc(), { lines: clean, savedBy: by, savedAt: now });
                    await batch.commit();
                    setStartEdit(clean);
                    setStartDirty(false);
                    setMessage('Start list saved');
                } catch (e) {
                    setMessage('Error saving start list: ' + e.message);
                }
                setSaving(false);
            };

            const openStart = () => {
                setStartEdit(startLines.map(l => ({ ...l })));
                setStartDirty(false);
                setEditingStart(true);
                setMessage('');
            };
            const closeStart = () => {
                if (startDirty && !window.confirm('You have unsaved changes to the start list. Close anyway?')) return;
                setEditingStart(false);
                setStartEdit(null);
                setStartDirty(false);
                setMessage('');
            };

            if (!user) {
                return (
                    <div className="section">
                        <button className="btn-primary" onClick={login}>Sign in with Microsoft</button>
                        {authError && <div className="msg" style={{ color: '#d32f2f' }}>{authError}</div>}
                    </div>
                );
            }

            if (profile === null) return <div className="section">Loading...</div>;

            if (profile === false) {
                return (
                    <div className="section">
                        <p>Signed in as {user.email}. No access: Trades-EST is for Owner, Admin and Estimator.</p>
                        <button className="btn-secondary" style={{ marginTop: '12px' }} onClick={() => auth.signOut()}>Logout</button>
                    </div>
                );
            }

            const me = { uid: user.uid, name: profile.name || user.email };
            const canRestore = ADMINS.includes(profile.role);
            const job = jobs.find(j => j.id === jobId);
            const visibleJobs = jobs.filter(j => showArchived || j.archived !== true);
            const savedText = record && record.updatedAt
                ? `Last saved by ${record.updatedBy ? record.updatedBy.name : ''} on ${fmtStamp(record.updatedAt)}`
                : 'Not saved yet. Showing the start list.';
            const startText = startRec && startRec.updatedAt
                ? `Last saved by ${startRec.updatedBy ? startRec.updatedBy.name : ''} on ${fmtStamp(startRec.updatedAt)}`
                : 'Built-in list. Not changed yet.';
            const msg = message && <div className="msg" style={{ color: message.includes('Error') ? '#d32f2f' : '#388e3c' }}>{message}</div>;

            return (
                <div>
                    <div className="row">
                        <span style={{ fontSize: '14px' }}>Signed in as {profile.name || user.email} ({profile.role})</span>
                        <div style={{ display: 'flex', gap: '8px' }}>
                            <button className="btn-secondary" onClick={() => setShowCalc(true)}>Calculator</button>
                            <button className="btn-secondary" onClick={() => auth.signOut()}>Logout</button>
                        </div>
                    </div>
                    {showCalc && <Calculator onClose={() => setShowCalc(false)} />}

                    <div className="section">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                            <div className="section-title">JOB</div>
                            {!editingStart && <button className="btn-secondary btn-sm" onClick={openStart} disabled={!startReady}>Edit start list</button>}
                        </div>
                        <div className="form-group">
                            <select value={jobId} disabled={editingStart} onChange={e => {
                                if (dirty && !window.confirm('You have unsaved changes. Switch jobs anyway?')) return;
                                setJobId(e.target.value); setMessage('');
                            }}>
                                <option value="">-- Pick a job --</option>
                                {visibleJobs.map(j => (
                                    <option key={j.id} value={j.id}>{j.code} - {j.address}{j.archived ? ' (archived)' : ''}</option>
                                ))}
                            </select>
                        </div>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontWeight: 'normal' }}>
                            <input type="checkbox" style={{ width: 'auto' }} checked={showArchived} onChange={e => setShowArchived(e.target.checked)} />
                            Show archived jobs
                        </label>
                        {jobId && <div className="muted">{record === null ? 'Loading...' : savedText}{dirty && <span className="unsaved"> | Unsaved changes</span>}</div>}
                    </div>

                    {editingStart && startEdit && (
                        <div className="section">
                            <div className="section-title">START LIST</div>
                            <div className="note">
                                This is the list every new job starts with. Changes here do not touch jobs already saved in Trades-EST.
                            </div>
                            <div className="muted" style={{ marginTop: 0, marginBottom: '10px' }}>{startText}{startDirty && <span className="unsaved"> | Unsaved changes</span>}</div>
                            <LineTable lines={startEdit} me={me} canRestore={canRestore} worksheets={false}
                                onChange={next => { setStartEdit(next); setStartDirty(true); setMessage(''); }} />
                            <button className="btn-primary" onClick={saveStart} disabled={saving}>{saving ? 'Saving...' : 'Save start list'}</button>
                            <button className="btn-secondary" style={{ width: '100%', marginTop: '8px' }} onClick={closeStart} disabled={saving}>
                                {jobId ? 'Close start list and go back to the job' : 'Close start list'}
                            </button>
                            {msg}
                        </div>
                    )}

                    {!editingStart && lines && (
                        <div className="section">
                            <div className="section-title">TRADES{job ? ` - ${job.code}` : ''}</div>
                            <LineTable key={jobId} lines={lines} me={me} canRestore={canRestore} worksheets={true}
                                onChange={next => { setLines(next); setDirty(true); setMessage(''); }} />
                            <datalist id="units">{UNITS.map(u => <option key={u} value={u} />)}</datalist>
                            <button className="btn-primary" onClick={save} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
                            {msg}
                        </div>
                    )}

                    {!editingStart && !lines && msg}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
